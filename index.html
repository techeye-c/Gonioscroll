"er"},{"t":"Superior limbic keratoconjunctivitis (SLK)","im":[["E:pages/Superior-limbic-keratoconjunctivitis-SLK/SLK-LRG.jpg",""]],"h":"Superior limbic keratoconjunctivitis (SLK) is a chronic, recurrent condition of ocular irritation involving the superior limbus, bulbar conjunctiva, and tarsal conjunctiva. The etiology is unknown, but it may result from mechanical trauma related to the upper lid. The condition is associated with thyroid eye disease and contact lens wear. As seen in the photographs, there may be hypertrophy of the superior limbus, positive staining superior to the limbus, and injection and thickening of the superior bulbar conjunctiva. There may also be a papillary reaction of the superior tarsal conjunctiva and superior corneal filamentary keratopathy.","u":"pages/Superior-limbic-keratoconjunctivitis-SLK/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Parinaud oculoglandular syndrome","im":[["E:pages/Parinaud/Parinauds-LRG.jpg",""],["E:pages/Parinaud/Parinauds-2-LRG.jpg",""]],"h":"Parinaud oculoglandular syndrome is a unilateral granulomatous conjunctivitis with regional lymphadenopathy. The most common identifiable cause is Bartonella henselae (cat scratch disease), but less common etiologies include Afipia felis, Bartonella clarridgeiae, tularemia, tuberculosis, sporotrichosis, syphilis, and coccidiomycosis.","u":"pages/Parinaud/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Subconjunctival Hemorrhage","im":[["E:pages/Subconjunctival%20hemorrhage/subconjunctival-hemorrhage-1-LRG.jpg","A young man developed a subconjunctival hemorrhage after being punched by a fist. Side"],["E:pages/Subconjunctival%20hemorrhage/subconjunctival-hemorrhage-2-LRG.jpg","A young man developed a subconjunctival hemorrhage after being punched by a fist."],["E:pages/Subconjunctival%20hemorrhage/Subconj-Heme-LRG.jpg",""]],"h":"A subconjunctival hemorrhage occurs due to ruptured blood vessels in the conjunctiva. The blood accumulates between the sclera and the conjunctiva and appears as a red spot on the white of the eye. The bleeding can be caused by trauma, hypertension, elevated venous pressure (e.g., Valsalva maneuver, coughing, vomiting), anticoagulant therapy, and acute hemorrhagic conjunctivitis [1]. The most common risk factors in younger patients are trauma and contact lens usage [2]. The major risk factor in elderly patients is systemic vascular disease, which weakens the walls of blood vessels [2]. Subconjunctival hemorrhages are typically benign and resolve on their own.","u":"pages/Subconjunctival%20hemorrhage/Subconjunctival-Hemorrhage.htm","cr":"Angela Mahoney; Anthony T. Chung, MD; Audrey C. Ko, MD","src":"er"},{"t":"Subconjunctival Hemorrhage","im":[["W:photos/subconjunctival-hemorrhage/subconjunctival-hemorrhage-1-LRG.jpg","A young man developed a subconjunctival hemorrhage after being punched by a fist."],["W:photos/subconjunctival-hemorrhage/subconjunctival-hemorrhage-2-LRG.jpg","A young man developed a subconjunctival hemorrhage after being punched by a fist."],["W:pages/Subconj-heme/Subconj-Heme-LRG.jpg",""]],"h":"A subconjunctival hemorrhage occurs due to ruptured blood vessels in the conjunctiva. The blood accumulates between the sclera and the conjunctiva and appears as a red spot on the white of the eye. The bleeding can be caused by trauma, hypertension, elevated venous pressure (e.g., Valsalva maneuver, coughing, vomiting), anticoagulant therapy, and acute hemorrhagic conjunctivitis [1]. The most common risk factors in younger patients are trauma and contact lens usage [2]. The major risk factor in elderly patients is systemic vascular disease, which weakens the walls of blood vessels [2]. Subconjunctival hemorrhages are typically benign and resolve on their own. Contributor: Jesse Vislisel, MD Photographer: Toni Venckus, CRA Subconjunctival hemorrhages, also known as hyposphagma, occur when there is bleeding into the potential space between the conjunctiva and sclera. This can occur secondary to any activity resulting in a Valsalva maneuver (coughing, sneezing, straining, vomiting), after ocular surgery or trauma, as a result of certain types of viral conjunctivitis, or spontaneously. Individuals on anticoagulation, those with systemic vascular disease (hypertension, diabetes, arteriosclerosis), and those with systemic conditions causing decreased coagulability are more prone to developing this condition. It is typically asymptomatic and resolves spontaneously. Contributor: Robert B. Dinn, MD and Jordan M. Graff, MD Patient sustained blunt trauma to the head. Echymosis is evident in the lid and around the eye. Medially, there is a small subconjunctival hemorrhage. In the absence of fracture or any ocular damage (which would require additional treatment), the subconjunctival hemorrhage should resolve on its own within a matter of weeks.","u":"pages/Subconjunctival-Hemorrhage.html","cr":"Angela Mahoney; Anthony T. Chung, MD; Audrey C. Ko, MD","src":"er"},{"t":"Subconjunctival Hematoma","im":[["E:LARGE/Subconj-hematoma-LARGE.jpg",""]],"h":"This an 86 year old male with a history of primary open angle gluacoma and macular degeneration who presented after a mechanical fall leading to minor blunt trauma of the right eye. His medication list included aspirin, clopidogrel, and coumadin. Upon presentation to an outside hospital he was noted to have no orbital fractures on CT. Visual acuity in this right eye was 20/100 down from a baseline of 20/40. Upon slit lamp examination he had periorbital ecchymosis, 360 degrees subconjunctival hemorrhage, and a large elevated subconjunctival hematoma inferonasally. There was no evidence of open globe, but he had moderate corneal punctate epithelial erosisons. Interestingly the patient reported the subconjunctival hematoma did not develop until one week after his fall at which time is acutely became elevated and he was most bothered by the inability to close his lids leading to exposure. He was treated with a pressure patch twice daily and lubricating ointment.","u":"pages/subconjunctival-hematoma.htm","cr":"Johanna M. Dijkstal, MD","src":"er"},{"t":"Symblepharon","im":[["E:photos-earlier/OCP_4VA2004r8349.jpg","Symblepharon is the adhesion of the palpebral conjunctiva to the bulbar conjunctiva. It can be caused by some eye diseases (such as trachoma) or trauma to the eye."],["E:photos-earlier/symbleparonSim.jpg","In operating on this lesion, the eye surgeon must be prepared to handle perforation of the cornea during the operation. (From William Charles Caccamise, Sr, MD)"],["E:photos-earlier/symblepharon-at-site-of-perforating-corneal-ulcer1.jpg","Symblepharon is adhesion of the conjunctiva of the lid to the conjunctiva of the eyeball-including the surface of the cornea. Perforation of an ulcus serpens led to this symblepharon. (From William Charles Caccamise, Sr, MD)"]],"h":"The cause of the total symblepharon in this patient, the history, was very vague. Possible causes: lye thrown in patient's eyes over a land dispute or spontaneous perforation of both corneas by ulcus serpens/hypopyon ulcer. In the latter scenario, the patient wouldhave been supine, in a stuporous state with both eyes closed for several days. In that case, the lids would become attached to the cornea and bulbar conjunctiva of each eye.","u":"pages/symblepharon.html","cr":"Jordan Graff, MD","src":"er"},{"t":"Bitot Spot","im":[["E:pages/Bitot-Spot/Bitot-1.jpg",""],["E:pages/Bitot-Spot/BItot-2.jpg",""]],"h":"60-year-old woman with Bitot spot in the left eye with low serum levels of vitamin A, in the setting of chronic hepatitis C and near-daily alcohol use. Note the nasal white foamy patch about 3 x 3 mm on nasal bulbar interpalpebral conjunctiva.","u":"pages/Bitot-Spot/index.htm","cr":"Pavlina Kemp, MD & Mark Greiner, MD","src":"er"},{"t":"Subconjunctival prolapse of orbital fat","im":[["E:pages/fat-prolapse/prolapsed-orbital-fat-LRG.jpg","Orbital fat that prolapsed"],["E:pages/fat-prolapse/orbital-fat-prolapse-LRG.jpg","Orbital fat that prolapsed spontaneously, resulting in adjacent subconjunctival hemorrhage"]],"h":"Intraconal orbital fat can herniate into the subconjunctival space when Tenon's capsule is violated spontaneously or after trauma or surgery. This process appears as a unilateral or bilateral, elevated, compressible, yellow-orange mass with visible lipid globules. It is most commonly located in the superotemporal quadrant of the globe in elderly, obese men. Reference(s): Schmack I, Patel RM, Folpe AL, Wojno T, Zaldivar RA, Balzer B, Kang SJ, Weiss SW, Grossniklaus HE. Subconjunctival herniated orbital fat: A benign adipocytic lesion that may mimic pleomorphic lipoma and atypical lipomatous tumor. Am J Surg Pathol. 2007 Feb;31(2):193-8.","u":"pages/fat-prolapse/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Ocular Hypertension, dilated episcleral vessels, blood in Schlemm's canal","im":[["E:photos/dilated-episcleral-vessels.jpg",""],["E:photos/blood-in-Schlemms-canal.jpg",""]],"h":"The patient is a 46-year-old Female with ocular hypertension who has had long-standing dilated episcleral vessels and blood in Schlemm's canal in the left eye but no evidence for carotid-cavernous fistula on intracranial imaging.","u":"pages/episcleral-vessels.htm","cr":"Kimberly Winges, MD","src":"er"},{"t":"Ciliary Flush","im":[["E:photos/Adenovirus5.jpg","Note the localized flush of capillaries seen just beyond the limbus as an almost maroon hue."]],"h":"Note the localized flush of capillaries seen just beyond the limbus as an almost maroon hue.","u":"pages/Ciliary-Flush.html","cr":"Jordan Graff, MD","src":"er"}]},{"n":"Ocular surface lesions","b":"Cysts, naevi, melanosis, papillomas, OSSN, lymphoma and choristomas.","items":[{"t":"Conjunctival epithelial inclusion cyst","im":[["E:pages/conj-epithelial-inclusion-cyst/conj-cyst-1-LRG.jpg","Patient 1"],["E:pages/conj-epithelial-inclusion-cyst/conj-cyst-1-slit-LRG.jpg","Patient 1"],["E:pages/conj-epithelial-inclusion-cyst/conj-cyst-2-LRG.jpg","Patient 2"]],"h":"Epithelial inclusion cysts of the conjunctiva may be congenital or acquired. Acquired cysts form when epithelial cells are displaced into the substantia propria where they proliferate to form a cystic cavity filled with clear fluid. The cysts are usually asymptomatic and can typically be observed only. Below are photographs of three different appearances of conjunctival epithelial inclusion cysts in three different patients. Only the largest of the three was symptomatic, requiring surgical resection.","u":"pages/conj-epithelial-inclusion-cyst/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Conjunctival Inclusion Cyst","im":[["E:pages/imgs/R_7MDTbCQGdEn7MyL_conj%20inclusion%20cyst1.png",""],["E:pages/imgs/R_7MDTbCQGdEn7MyL_conj%20inclusion%20cyst2.png",""]],"h":"A 22-year-old man presented nearly two years after uncomplicated strabismus surgery with a translucent conjunctival lesion in the right eye. Clinical examination was consistent with a conjunctival inclusion cyst related to his prior surgery at the medial rectus site. This is a rare complication that occurs when conjunctival epithelial cells are trapped under the conjunctival surface at the conclusion of surgery. In this case the patient was initially treated with topical steroid therapy without improvement of the lesion.","u":"pages/Conjunctival_Inclusion_Cyst.html","cr":"Mahsaw Mansoor, MD","src":"er"},{"t":"Conjunctival Nevus","im":[["E:photos/conj/ConjCaruncleNevus2.jpg","conjunctival nevus, stable for decades"]],"h":"conjunctival nevus, stable for decades","u":"pages/Conjunctival-Nevus-2.html","cr":"Jordan Graff, MD","src":"er"},{"t":"Pigmented Conjunctival Nevus","im":[["E:photos/conj/Conj-Nevus-etc0022.jpg",""],["E:pages/imgs/R_74oAn1DVOoOlBW7_nevus.JPG","Elevated, regularly shaped, conjunctival lesion measuring 1 cm × 6.5 mm, with a melanotic core and a large central vessel, located at the nasal limbus of the right eye."]],"h":"10-year-old female presented with a conjunctival lesion at the nasal limbus of her right eye (OD). The lesion measured approximately 1 cm × 6.5 mm, with notable elevation and a melanotic core. The lesion had been slowly enlarging over six years. Her visual acuity was 20/20 in both eyes (OU), with no reported diplopia, and intraocular pressures were within normal limits. Surgical excision was performed, and histopathology confirmed a juvenile compound nevus.","u":"pages/Pigmented-Conjunctival-Nevus.html","cr":"Dr Rajan Paul Enlarge Download Conjunctival nevus occurring","src":"er"},{"t":"Pigmented nevus of plica semilunaris","im":[["E:photos/Plica_Lesion_1.png","Dilated funduscopic examination showed severe, diffuse optic atrophy OD and bow-tie (band) optic atrophy OS."]],"h":"A 63-year-old man presented for a conjunctival lesion he says has been present his whole life but has been concerning to his daughter in law. Although his history was reassuring, its location near the caruncle as well as his immunosuppressed status warranted excisional biopsy. Histologically, sections demonstrated nests and sheets of nevus cells variably demonstrating cytoplasmic pigment. A diagnosis of a plica semilunaris nevus was made.","u":"pages/pigmented_nevus_of_plica_semilunaris.htm","cr":"Patrick Donegan, MD; Kanwal Matharu, MD","src":"er"},{"t":"Primary acquired melanosis (PAM)","im":[["E:photos/Primary-acquired-melanosis.jpg",""],["E:pages/imgs/R_7iqiNtvRklDOLlt_PAM_1.jpeg","Slit lamp photography showing one clock hour of flat, brown pigmentation localized inferiorly and extending superiorly to the limbus of the right eye. Two small iris nevi can be seen superior to the area of PAM."],["E:pages/imgs/R_7iqiNtvRklDOLlt_PAM_2.jpeg","Slit lamp photography illustrating that the area of pigmentation is flat on narrow white light beam illumination."]],"h":"Brice Critser Primary acquired melanosis (PAM) is an acquired pigmentation of the conjunctival epithelium. It is analagous to lentigo maligna of the skin and carries a risk of malignant transformation. PAM appears as unilateral, patchy areas of flat, brown pigmentation within the superficial conjunctiva. The areas may wax and wane over time. Primary Acquired Melanosis (PAM) Primary Acquired Melanosis (PAM) Category(ies): Cornea / External Eye Disease Contributor: Lauren A. Tomlinson, MD; Ryan J. Diel, MD Photographer: Michael T. Edrington, CRA Posted: 06/02/2025 Slit lamp photos of the right eye from a 66-year-old Caucasian man with one clock hour of flat brown pigmented conjunctival tissue at the inferior bulbar quadrant that extends into the limbus. No feeder vessels were identified. Gonioscopy showed no evidence of ciliary body tumor. The patient first noticed this spot two weeks prior to presentation. These findings were consistent with primary acquired melanosis (PAM). Two small iris nevi were also seen inferiorly, above the area of PAM. A small lower lid margin nevus measuring 1.5 mm was identified nasally on the same eye. As no concerning features were identified on examination, annual surveillance including repeat slit lamp photography was advised to monitor for progression.","u":"pages/primary-acquired-melanosis.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Conjunctival papilloma","im":[["E:pages/Conjunctival-papilloma/conj-papilloma-LRG.jpg",""]],"h":"Conjunctival papillomas located in the inferior fornix are often pedunculated with a multilobulated appearance. These benign neoplasms are initiated after infection by the human papillomavirus (HPV).","u":"pages/Conjunctival-papilloma/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Conjunctival squamous papilloma","im":[["E:LARGE/papilloma-LARGE.jpg",""]],"h":"Squamous papillomas can be pedunculated or sessile as shown in this photograph. The sessile variety has a flat base and is found most commonly along the limbus. They have a glistening surface, often with red dots or \"corkscrew\" blood vessels, creating a strawberry-like appearance. The lesions may encroach onto the cornea and must be monitored closely for signs of dysplastic change or carcinomatous growth.","u":"pages/conj-squamous-papilloma.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Conjunctival papilloma arising from the caruncle","im":[["E:photos/conj/conjunctival-papilloma-1.jpg",""],["E:photos/conj/conjunctival-papilloma-2.jpg",""]],"h":"A conjunctival papilloma is a benign squamous epithelial tumor. There is a strong association of conjunctival papilloma with the human papillomavirus (HPV), most notably strains 6 and 11 (low-risk) and 16 and 33 (high-risk). Treatment consists of surgical excision with free margins, followed by cryotherapy. Reference: Peck N, Lucarelli MJ, Yao M, et al. Human papillomavirus 6a lesions of the lower eyelid and genitalia. Ophthal Plast Reconstr Surg. 2006. 22(4):311-3. Sjo NC, Buchwald CV, Cassonnet P, et al. Human papillomavirus in normal conjunctival tissue and in conjunctival papilloma. Types and frequencies in a large series. Br J Ophthalmol. 2007. 91(8):1014-5.","u":"pages/conjunctival-papilloma.htm","cr":"John Chen, MD, PhD","src":"er"},{"t":"Squamous papilloma","im":[["E:photos/squamous-papilloma-upper-lid.JPG","67-year-old male with squamous papilloma of the left upper lid"]],"h":"67-year-old male with squamous papilloma of the left upper lid","u":"pages/squamous-papilloma-upper-lid.html","cr":"Jeffrey D. Welder, MD","src":"er"},{"t":"Viral papilloma","im":[["E:photos-earlier/OS1.jpg","Often caused by HPV infection, Papilloma was hidden from view until lower lid was pulled down. Patient was asymptomatic, but the lesion was removed by request of the parents."],["E:photos-earlier/papilloma.jpg","gray, red pedunculated mass (cauliflower appearing)"],["E:photos/eyes.jpg","viral papilloma Often caused by HPV."]],"h":"Often caused by HPV infection, Papilloma was hidden from view until lower lid was pulled down. Patient was asymptomatic, but the lesion was removed by request of the parents. gray, red pedunculated mass (cauliflower appearing) viral papilloma Often caused by HPV.","u":"pages/viral-papilloma-.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Conjunctival lymphoid hyperplasia","im":[["E:pages/Conjunctival-lymphoid-hyperplasia/Conjunctival-lymphoid-hyperplasia-LRG.jpg",""]],"h":"Conjunctival lymphoid hyperplasia is a benign lymphoid proliferation which appears as a smooth, mobile, salmon-colored, fleshy mass. Suspicious masses must be biopsied as they cannot be differentiated from conjunctival lymphoma clinically.","u":"pages/Conjunctival-lymphoid-hyperplasia/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Conjunctival lymphoma","im":[["E:pages/Conjunctival-lymphoma/conj-lymphoma-LRG.jpg",""]],"h":"Conjunctival lymphoma classically appears as a smooth, mobile, salmon-colored, fleshy mass. The lesions are most commonly unilateral. They cannot be differentiated from benign lymphoid hyperplasia based on clinical appearance alone, and thus require biopsy. This lesion was biopsied and found to be an extranodal marginal zone (MALT) B-cell lymphoma.","u":"pages/Conjunctival-lymphoma/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Conjunctival oncocytoma","im":[["E:pages/Oncocytoma/oncocytoma-LRG.jpg",""]],"h":"Conjunctival oncyocytomas are tumors arising from ductal and acinar cells of the accessory lacrimal glands. They are most commonly present as a reddish-brown lesion of the caruncle as seen in this photograph.","u":"pages/Oncocytoma/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Conjunctival intraepithelial neoplasia (CIN) with full thickness dysplasia","im":[["E:photos/Conjunctival-intraepithelial-neoplasia-1.JPG","Conjunctival intraepithelial neoplasia (CIN) with full thickness dysplasia (squamous cell carcinoma in situ)"],["E:photos/Conjunctival-intraepithelial-neoplasia-2.JPG","d: Conjunctival intraepithelial neoplasia (CIN) with full thickness dysplasia (squamous cell carcinoma in situ)"],["E:pages/imgs/R_1cuBEeE9NvHsmvK_Screenshot2025-04-02at6.44.24AM.png","Slit lamp photograph of the left eye demonstrates a nasal, elevated, gelatinous conjunctival lesion with leukoplakic areas extending approximately 1 mm onto the cornea, along with prominent nasal vessels."]],"h":"A 68-year-old male patient presented for a routine cataract evaluation and was found to have a suspicious conjunctival lesion in the left eye. He reports symptoms of foreign body sensation, itching, and extreme ocular dryness (notably frequent blinking). The patient has a known history of cryotherapy for precancerous skin lesions on the face. On the exam, the best-corrected visual acuity was 20/20 in both eyes with intraocular pressures of 19 mmHg OD and 20 mmHg OS. Extraocular movements and visual fields were full bilaterally. Slit lamp exam of the left eye revealed a nasal, elevated, gelatinous conjunctival lesion with leukoplakic areas extending approximately 1 mm onto the cornea, along with a temporal pinguecula and prominent nasal vessels. The patient underwent conjunctival biopsy of the left eye, and histopathology revealed a moderately differentiated squamous cell carcinoma in situ with positive margins. The patient underwent 6 rounds of topical chemotherapy therapy with Fluorouracil (5-FU).","u":"pages/CIN-Conjunctival-intraepithelial-neoplasia.htm","cr":"John Chen, MD, PhD","src":"er"},{"t":"Ocular Surface Squamous Cell Carcinoma","im":[["E:pages/OSSCC/SSC-LRG.jpg",""]],"h":"This is an 83-year-old male who presented with an elevated, limbal-based, gelatinous mass. Some adjacent vascular engorgement can be seen. The patient has history of squamous cell carcinoma on the face. Excisional biopsy confirmed the diagnosis of ocular surface squamous cell carcinoma. He subsequently received four months of topical interferon chemotherapy.","u":"pages/OSSCC/index.htm","cr":"William Flanary, MD","src":"er"},{"t":"Ocular surface squamous neoplasia","im":[["E:pages/OSSN/OSSN-LRG.jpg",""],["E:pages/OSSN/OSSN-zoom-LRG.jpg",""],["E:pages/OSSN/OSSN-slit-LRG.jpg",""]],"h":"Ocular surface squamous neoplasia stained with rose bengal. On excisional biopsy, the lesion was found to be squamous cell carcinoma in situ.","u":"pages/OSSN/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Conjunctival/Corneal Invasive Squamous Cell Carcinoma","im":[["E:photos/conj/conj-squamous-cell-carcinoma_1.jpg",""],["E:photos/conj/conj-squamous-cell-carcinoma_2.jpg",""]],"h":"75-year-old male with a conjunctival/corneal invasive squamous cell carcinoma","u":"pages/Conj-squamous-cell-carconoma.htm","cr":"John Chen, MD, PhD","src":"er"},{"t":"Dermoid","im":[["E:photos/dermoid/DermoidLimbus1_032005.jpg",""],["E:photos/dermoid/DermoidLimbus2_032005.jpg",""]],"h":"","u":"pages/Dermoid-.html","cr":"Jordan Graff, MD","src":"er"},{"t":"Limbal Dermoid","im":[["E:pages/imgs/R_1dAMWcQgStYwziH_limbal%20dermoid.png",""],["E:pages/imgs/R_1dAMWcQgStYwziH_limbal%20dermoid%202.png",""]],"h":"A 13-year-old teenager presented for evaluation of a limbal lesion in the left eye. On exam there was an elevated, non-tender, whitish lesion at the inferotemporal limbus consistent with a clinical diagnosis of a limbal dermoid. Limbal dermoids represent a congenital, benign choristoma, which represent histopathologically normal tissue in an abnormal location. While limbal dermoids can be associated with systemic conditions, such as Goldenhar Syndrome, this patient presented as an isolated finding.","u":"pages/Limbal_Dermoid.html","cr":"Mahsaw Mansoor, MD","src":"er"},{"t":"Limbal Dermoid","im":[["E:pages/imgs/R_777iChRwOVnHn84_Avellino1.png",""],["E:pages/imgs/R_777iChRwOVnHn84_Avellino2.png",""],["E:pages/imgs/R_777iChRwOVnHn84_Avellino3.png",""]],"h":"A 56-year-old woman presented for evaluation of corneal opacities in both eyes. She reported that the opacities had been present since age 12, with a slow, progressive worsening of her vision. On examination, visual acuity was 20/30 in the right eye and 20/25 in the left eye. There were multifocal corneal opacities, predominantly consisting of anterior stromal breadcrumb opacities along with deeper posterior stromal lattice lines. Based on clinical findings, a diagnosis of granular type 2 corneal dystrophy was made. Also known as Avellino corneal dystrophy, this autosomal dominant condition is caused by a point mutation in the transforming growth factor beta-induced (TGFB1) gene located on the 5q31 locus. Histopathology can reveal both hyaline and amyloid deposits, reflecting the presence of combined granular and lattice dystrophy, respectively. These deposits can cause recurrent erosions and may recur even after penetrating keratoplasty.","u":"pages/Granular_Corneal_Dystrophy_Type_2.html","cr":"Anushi Wijayagunaratne, BS; Mahsaw Mansoor, MD","src":"er"},{"t":"Complex choristoma of the conjunctiva","im":[["E:pages/complex-choristoma/complex-choristoma-3-LRG.jpg",""],["E:pages/complex-choristoma/complex-choristoma-1-LRG.jpg",""],["E:pages/complex-choristoma/complex-choristoma-2-LRG.jpg",""]],"h":"Choristomas are benign, congenital proliferations of normal tissue that is not typically found at the site of the mass. Conjunctival examples include limbal dermoids, lipodermoids, ectopic lacrimal glands, and osseus choristomas. Complex choristomas contain features of multiple types of choristomas. They often cannot be distinguished from dermoids or lipodermoids clinically. This young girl presented with a temporal epibulbar mass that slowly enlarged since birth. Histology of the lesion showed features of both lipodermoid and osseous choristoma (bone formation).","u":"pages/complex-choristoma/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Pyogenic granuloma","im":[["W:pages/pyogenic-granuloma/pyogenic-granuloma-add-1LRG.jpg","These photos are from a patient who had previously had intracanalicular punctal plugs."],["W:pages/pyogenic-granuloma/pyogenic-granuloma-add-2LRG.jpg","These photos are from a patient who had previously had intracanalicular punctal plugs."]],"h":"A pyogenic granuloma is characterized as a pedunculated vascular lesion, and appears as a fleshy red or pink mass. It is often located on the eyelid and bleeds easily with minimal contact. Clinically, it arises with rapid growth in an area of previous trauma, surgery, or inflammation. Histologically, it is composed of granulation tissue, capillaries, and non-granulomatous inflammatory cells [1 ,2]. Recommended treatment is excision of the lesion at it's base. Contributor: Jesse Vislisel, MD Photographer: Antoinette Venckus, CRA Pyogenic granulomas are formed when there is abnormally vigorous proliferation of granulation tissue. They appear as vascular growths with smooth surfaces, usually at the site of previous ocular surgery. Contributor: Tressa Larson, OD, FAAO Photographer: Mark Greiner, MD Contributor: Tressa Larson, OD, FAAO Photographer: Mark Greiner, MD Reference: Mannis MJ, Holland, Edward J. Cornea; Fundamentals, Diagnosis, and Management. Fourth ed: Elsevier, 2017. Neff A, Chahal H, Carter KD. Benign Eyelid Lesions Ophthalmology. Fifth ed: Elsevier 2019.","u":"pages/pyogenic-granuloma/index.htm","cr":"David A. Ramirez, MD, Heather A. Stiff, MD","src":"er"},{"t":"Pyogenic granuloma","im":[["http://webeye.ophth.uiowa.edu/eyeforum/atlas/pages/pyogenic-granuloma/pyogenic-granuloma-add-1LRG.jpg","These photos are from a patient who had previously had intracanalicular punctal plugs."],["http://webeye.ophth.uiowa.edu/eyeforum/atlas/pages/pyogenic-granuloma/pyogenic-granuloma-add-2LRG.jpg","These photos are from a patient who had previously had intracanalicular punctal plugs."]],"h":"A pyogenic granuloma is characterized as a pedunculated vascular lesion, and appears as a fleshy red or pink mass. It is often located on the eyelid and bleeds easily with minimal contact. Clinically, it arises with rapid growth in an area of previous trauma, surgery, or inflammation. Histologically, it is composed of granulation tissue, capillaries, and non-granulomatous inflammatory cells [1 ,2]. Recommended treatment is excision of the lesion at it's base. Contributor: Jesse Vislisel, MD Photographer: Antoinette Venckus, CRA Pyogenic granulomas are formed when there is abnormally vigorous proliferation of granulation tissue. They appear as vascular growths with smooth surfaces, usually at the site of previous ocular surgery. Contributor: Tressa Larson, OD, FAAO Photographer: Mark Greiner, MD Contributor: Robert B. Dinn, MD and Jordan M. Graff, MD, University of Iowa","u":"pages/Pyogenic-granuloma.html","cr":"David A. Ramirez, MD, Heather A. Stiff, MD","src":"er"},{"t":"Pterygium","im":[["E:pages/Pterygium/pterygium-LRG.jpg",""],["E:pages/Pterygium/pterygium-3-LRG.jpg",""]],"h":"Pterygia are wing-shaped folds of conjunctiva and fibrovascular tissue that invade the superficial corneal layers. When extensive, they can result in corneal astigmatism or occlusion of the visual axis. They are almost always preceded by pingueculae and are often associated with ultraviolet light exposure..","u":"pages/Pterygium/index.htm","cr":"Jesse Vislisel, MD","src":"er"}]},{"n":"Corneal epithelium & ocular surface disease","b":"Staining patterns, abrasions, EBMD, deposits and neurotrophic disease.","items":[{"t":"Punctate epithelial erosions (PEE) secondary to exposure keratopathy","im":[["E:pages/Punctate-epithelial-erosions/Exposure-PEE-LRG.jpg",""]],"h":"Punctate epithelial erosions (PEE) are evidence of ocular surface dryness. They represent areas of epithelial cell loss and therefore stain positively with fluorescein. The distribution of the PEE can provide information regarding the underlying etiology. Inferior PEE, as seen in this photograph, can be secondary to exposure, chronic blepharitis, or trichiasis. This patient previously underwent multiple eyelid surgeries resulting in exposure keratopathy.","u":"pages/Punctate-epithelial-erosions/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Punctate epithelial erosions (PEE) in exposure keratopathy","im":[["E:pages/Punctate-epithelial-erosions-2/PEE-LRG.JPG",""],["E:pages/Punctate-epithelial-erosions-2/PEE-slit-LRG.JPG",""]],"h":"This patient has exposure keratopathy secondary to thyroid eye disease and poor blink dynamics after upper lid blepharoplasty. Prominent punctate epithelial erosions are visible in the interpalpebral space using rose bengal stain.","u":"pages/Punctate-epithelial-erosions-2/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Punctate epithelial erosions, Diffuse","im":[["E:pages/punctate-epithelial-erosions-3/PEE-LRG.jpg",""]],"h":"","u":"pages/punctate-epithelial-erosions-3/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Applanation epitheliopathy","im":[["E:pages/applanation-epitheliopathy/applanation-epitheliopathy-LRG.jpg",""]],"h":"Applanation tonometry is the gold standard for intraocular pressure assessment. During this technique a circular Goldmann applanation tip contacts the surface of the cornea. Epithelial disruption may occur if care is not taken during applanation, leading to a circle of positive fluorescein staining as seen in this photograph.","u":"pages/applanation-epitheliopathy/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Corneal abrasion","im":[["E:pages/corneal-abrasion/corneal-abrasion-LRG.jpg",""]],"h":"This image shows a corneal epithelial defect, or corneal abrasion, after the application of fluorescein dye. The staining pattern is more visible under cobalt blue light.","u":"pages/corneal-abrasion/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Epithelial basement membrane dystrophy (map-dot-fingerprint dystrophy)","im":[["E:photos/meesmann-epithelial-corneal-dystrophy/EBMD.MECD1-LRG.jpg",""],["E:photos/meesmann-epithelial-corneal-dystrophy/EBMD.MECD2-LRG.jpg",""],["E:photos/meesmann-epithelial-corneal-dystrophy/EBMD.MECD3-LRG.jpg",""]],"h":"72-year-old female with decrease in central visual acuity. Classic gray patches, fingerprint lines, map lines, dots, and cobblestone pattern in the corneal epithelium are seen on this photo. Contributor: Thomas J.E. Clark, MD Photographer: Carol Chan, CRA This photo demonstrates classic \"dots\", which manifest as irregular round, oval, or comma-shaped, non-staining, putty-gray intraepithelial opacities. They represent intraepithelial pseudocysts containing cytoplasmic debris. Reference: Weiss JS, Moller HU, Aldave AJ, et al. IC3D Classification of Corneal Dystrophies—Edition 2. Cornea. 2015;34:117-159.","u":"pages/map-dot-dystrophy.htm","cr":"Lorraine M. Provencher, MD","src":"er"},{"t":"Hurricane keratopathy","im":[["E:pages/Hurricane-keratopathy/hurricane-keratopath-LRG.jpg",""]],"h":"Hurricane keratopathy occurs in situations of high corneal epithelial cell turnover and migration. In this condition, the centripetal pattern of cell migration from the corneal limbus becomes visible. The cells usually make a clockwise whorl or vortex pattern as they move centrally. It has been hypothesized by Dua that this is due to the effects of electromagnetic forces on the eye. This epitheliopathy typically disappears when epithelial turnover and migration slows to normal rates.","u":"pages/Hurricane-keratopathy/index.htm","cr":"Jesse Vislisel, MD; Matt Raecker, MD","src":"er"},{"t":"Thygeson's superficial punctate keratitis","im":[["E:pages/ThygesonPK/TPK-1-LRG.jpg",""],["E:pages/ThygesonPK/TPK-2-LRG.jpg",""],["E:pages/ThygesonPK/TPK-3-LRG.jpg",""]],"h":"In 1950, Dr. Phillips Thygeson reported a case series of 26 patients. These patients classically have a history of cyclical exacerbations and remissions with symptoms of foreign body sensation, photophobia, burning, tearing and occasionally blurring of vision. Symptoms are commonly bilateral but asymmetric. On exam, there are multiple slightly elevated corneal lesions which are round to oval conglomerates of gray, granular \"crumblike\" subepithelial opacities. These lesions normally negatively stain, but during exacerbations one can see staining with fluorescein dye. There is minimal conjunctival reaction. On average there are 15-20 lesions, with the greatest density being in the central cornea. These patients can present a difficult treatment conundrum. However, typical treatment consists of topical corticosteroids primarily with cyclosporine and bandaged contact lenses as secondary options. Visual prognosis is excellent. As an interesting side note, Dr. Thygeson was a faculty member of the University of Iowa Department of Ophthalmology in the 1930's. Thygeson's superficial punctate keratitis Thygeson's superficial punctate keratitis Category(ies): Cornea Contributor: Noor-Us-Sabah Ahmad, MD; Mark A. Greiner, MD Photographer: Dana L Zach A woman in her 50s presented to the Cornea clinic with a 20-year history of recurrent episodes of eye pain, redness, and light sensitivity that improved with topical corticosteroid therapy and recurred after taper and cessation. Slit lamp exam of the cornea showed multiple intraepithelial opacities in both eyes that were small, circumscribed, slightly elevated, and grayish-white in color, as highlighted in these photos using sclerotic scatter. Findings are classic for Thygesons superficial punctate keratitis. Reference: Nagra PK, Rapuano CJ, Cohen EJ, Laibson PR. Thygeson's superficial punctate keratitis: ten years' experience. Ophthalmology. 2004; 111(1):34-7 Thygeson P. Superficial punctate keratitis. J Am Med Assoc. 1950; 144(18):1544-9.","u":"pages/ThygesonPK/index.htm","cr":"Lucas Lenci, MD; Blake Perry, MD","src":"er"},{"t":"Corneal Delle","im":[["E:pages/Delle/delle-LRG.jpg","This patient developed persistent nasal chemosis after Mohs surgery for basal cell carcinoma."]],"h":"Dellen are areas of corneal thinning secondary to stromal dehydration. They typically occur at the corneal limbus near areas of adjacent elevation. Stromal hydration can usually be restored with frequent ocular lubrication.","u":"pages/Delle/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Pannus","im":[["E:photos/pannus-LRG.jpg",""],["E:photos-earlier/pannus.jpg","Pannus from failure of corneal limbal stem cells."]],"h":"Douglas B. Critser Corneal pannus is subepithelial fibrovascular tissue ingrowth from the limbus onto the cornea. It typically results from inflammation, which may be causes by a number of events such as infection or chronic irritation.","u":"pages/pannus.html","cr":"Austin R. Fox, MD","src":"er"},{"t":"Limbal stem cell deficiency","im":[["E:photos/Limbal-Stem-cell-deficiency-for-1-LRG.jpg",""],["E:photos/Limbal-Stem-cell-deficiency-2-LRG.jpg",""]],"h":"Douglas Critser Limbal stem cell deficiency (LSCD) occurs when there is sufficient disturbance or destruction of the limbal stem cells of the corneal epithelium, resulting in disruption of the normal physiologic regenerative process and repopulation of corneal epithelium. Subsequently, LSCD may result in epithelial irregularities including erosions, ulcerations, neovascularization, and potentially conjunctivalization of the corneal surface in advanced cases. Classically, a \"whorled\" appearance of the corneal surface may be seen on exam, resulting from the centripetal extension of epithelium from the limbus as seen here extending from the superior limbus.","u":"pages/limbal-stem-cell-deficiency.htm","cr":"Austin Fox, MD","src":"er"},{"t":"Stellate corneal epithelial iron line after radial keratotomy (RK)","im":[["E:pages/stellate-iron-p-RK/stellate-iron-line-RK-LRG.jpg","Radially oriented corneal incisions from prior radial keratotomy (RK) with a characteristic central stellate corneal epithelial iron line"]],"h":"This photograph shows the radially oriented corneal incisions from prior radial keratotomy (RK) with a characteristic central stellate corneal epithelial iron line. The Prospective Evaluation of Radial Keratotomy (PERK) study found that these iron lines occur in 78-85% of eyes after RK depending on the duration that has elapsed since their surgery. The iron lines are not visually significant.","u":"pages/stellate-iron-p-RK/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Cornea verticillata","im":[["E:pages/Verticillata/OD-951-LRG.jpg","Right Eye"],["E:pages/Verticillata/OS-spec-951-LRG.jpg","Left Eye"],["E:pages/Verticillata/ODslit-951-LRG.jpg","Right Eye"]],"h":"Cornea verticillata, also known as vortex keratopathy, describes a pattern of whorl- shaped opacities within the basal corneal epithelium. They are most commonly located in the inferior paracentral region, are non-elevated, and can range from white to brown in color. These changes are usually not visually significant. Cornea verticillata is often caused by the use of certain systemic medications, the most common of which include amiodarone, chloroquine, hydroxychloroquine, indomethacin, and phenothiazenes. Cornea verticillata can also be seen in the sphingolipidosis, Fabry disease. Figure 1 Figure 1 Contributor: Jesse Vislisel, MD Photographer: Brice Critser, CRA Figure 2 Figure 2 Contributor: Jesse Vislisel, MD; W.L.M. Alward, MD Photographer: Brice Critser, CRA Figure 3 Figure 3 Contributor: Jesse Vislisel, MD Photographer: Cindy Montague, CRA Figure 4: Cornea verticillata in a patient with known Fabry disease. Figure 4: Cornea verticillata in a patient with known Fabry disease. Contributor: Jeff Welder, MD","u":"pages/Verticillata/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Amiodarone vortex keratopathy","im":[["E:photos/amiodaroneKeratopathyOD.jpg",""]],"h":"","u":"pages/amiodarone-keratopathy.htm","cr":"Kimberly Winges, MD","src":"er"},{"t":"Fabry Disease","im":[["E:pages/fabry/verticillata-358-Fabry-LRG.jpg","Cornea verticillata in a young female which led to the diagnosis of Fabry disease."],["E:pages/fabry/FABRY-OD-LRG.jpg","Cornea verticillata in a patient with known Fabry disease.Right Eye"],["E:pages/fabry/FABRY-OS-LRG.jpg","Cornea verticillata in a patient with known Fabry disease.Left Eye"]],"h":"Fabry disease is an X-linked dominant sphingolipidosis caused by a deficiency in alpha-galactosidase A which results in accumulation of ceramide trihexoside in select body tissues. Ocular findings include cornea verticillata, conjunctival aneurysms, cataracts, retinal vascular changes and optic atrophy. (Contributor: Jeffrey D. Welder, MD) Corneal verticillata and skin angiokeratoma in a patient with Fabry disease. This x-linked dominant condition is caused by a deficiency in alpha galactosidase leading to glycolipid accumulation in blood vessels and other tissues. Other ocular findings include conjunctival aneurysms, cataracts, retinal vascular changes and optic atrophy. Contributor: Jesse Vislisel, MD Contributor: Jeffrey D. Welder, M.D. Contributor: Jeffrey D. Welder, M.D. Contributor: Jesse Vislisel, MD","u":"pages/fabry/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Neurotrophic Ulcer Secondary to 5th and 7th Cranial Nerve Palsies","im":[["E:pages/Neurotrophic-Ulcer/1-ulcer-LRG.jpg",""],["E:pages/Neurotrophic-Ulcer/2-ulcer.-LRG.jpg",""],["E:pages/Neurotrophic-Ulcer/3-ulcer-diffuse-illumination-LRG.jpg",""]],"h":"This is a 51-year-old woman was referred to the ophthalmology clinic from otolaryngology with progressive blurred vision in the right eye after resection of large petroclival meningioma 1 month prior. She had lagopthalmos and incomplete blink with significantly decreased corneal sensation. She was found to have a corneal ulcer with a gray, heaped-up rim, surrounding white blood cell recruitment, and mild corneal edema. She was started on aggressive lubrication and topical antibiotics to prevent secondary bacterial infection with plan for future tarsorrhaphy. Round or oval-shaped ulcers with grayish, elevated edges are classic for neurotrophic ulcers. In this case the patient had a 5th cranial nerve palsy causing decreased sensation and was also predisposed to exposure given her 7th cranial nerve palsy. The differential for etiology of neurotrophic ulcer also includes cerebrovascular accidents, aneurysms, multiple sclerosis, herpes simplex or herpes zoster keratitis, or toxicity with topical medications such as anesthetics.","u":"pages/Neurotrophic-Ulcer/index.htm","cr":"Lindsay McConnell, MD Luke Lenci, MD","src":"er"}]},{"n":"Corneal dystrophies, degenerations & ectasia","b":"Stromal dystrophies, Fuchs, band keratopathy, keratoconus and deposits.","items":[{"t":"Meesmann Epithelial Corneal Dystrophy","im":[["W:photos/meesmann-epithelial-corneal-dystrophy/EBMD.MECD1-LRG.jpg",""],["W:photos/meesmann-epithelial-corneal-dystrophy/EBMD.MECD2-LRG.jpg",""],["W:photos/meesmann-epithelial-corneal-dystrophy/EBMD.MECD3-LRG.jpg",""]],"h":"Meesmann epithelial corneal dystrophy (aka, juvenile hereditary epithelial dystrophy) is an autosomal dominant condition with a mutation in the gene keratin K3 (KRT3) at locus 12q13. Patients with this condition will manifest pathology early in life. The cornea will have multiple, tiny epithelial vesicles that are diffusely distributed and will extend all the way to the limbus. These bubble-like blebs are more numerous in the interpalpebral area and are best visualized with retroillumination. The epithelium adjacent to the cysts is clear, but there can be whorled and wedge-shaped epithelial patterns. The findings are bilateral and limited to the corneal epithelium. Pathology will show that these microcysts consist of degenerated epithelial cell products. The epithelial cells themselves contain \"peculiar substance\" - an electron-dense accumulation of granular and filamentary material. There is frequently a thickened basement membrane with projections into the basal epithelium. Symptoms are usually mild and generally limited to glare, light sensitivity, irritation and slight decrease in vision. No treatment is typically required. Meesman Corneal DystrophyMeesman Corneal DystrophyCategory(ies): Cornea / External Eye DiseaseContributor: Mahsaw Mansoor, MDPhotographer: Brice Critser, OCT-C, FOPSPosted: 06/04/2024A 57-year-old female presented for evaluation of dry eyes and photophobia for many years. She reports her mother and daughter have a similar condition. On exam, there were diffuse epithelial cysts that stained negatively consistent with a diagnosis of Meesman corneal dystrophy.","u":"pages/Meesmann-epithelial-corneal-dystrophy/index.htm","cr":"Lorraine M. Provencher, MD","src":"er"},{"t":"Reis-Bucklers corneal dystrophy","im":[["E:photos/Reis-Bucklers-1.JPG",""],["E:photos/Reis-Bucklers-2.JPG",""]],"h":"52-year-old female presented with Reis-Bucklers corneal dystrophy. She was diagnosed at age 5 and has suffered from chronic recurrent erosion syndrome. Family history is notable for father, brother and two sisters with corneal dystrophy.","u":"pages/Reis-Bucklers.htm","cr":"Jeffrey Welder, MD","src":"er"},{"t":"Avellino Dystrophy","im":[["E:pages/Avellino/Avellino-Dystrophy-OD-sclerotic-scatter-LRG.jpg","Avellino Dystrophy OD"],["E:pages/Avellino/avellino-dystrophy-os-sclerotic-scatter-LRG.jpg","Avellino Dystrophy OS"],["E:pages/Avellino-dystrophy/avellino-LRG.jpg","Avellino Dystrophy Zoomed"]],"h":"This 23-year-old female patient has granular type II (Avellino) corneal dystrophy and recurrent erosions. She has a strong family history of this autosomal dominant corneal dystrophy. In both eyes, there are linear lattice deposits and granular deposits in the central and paracentral anterior stroma with clear intervening stroma between the deposits. The right eye (top) has undergone phototherapeutic keratectomy and exhibits diffuse subepithelial haze. Treatment for her recurrent erosions included ocular surface lubrication with preservative-free artificial tears, sodium chloride 5% ointment, and rigid gas-permable contact lenses. Avellino Dystrophy: Type II granular corneal dystrophy Avellino Dystrophy: Type II granular corneal dystrophy Category(ies): Cornea Contributor: Matthew Ward, MD 47-year-old man with type II granular corneal dystrophy (Avellino) manifested after undergoing LASIK vision correction. Avellino dystrophy is known to blossom after LASIK. For this reason, it is the practice in some Asian countries with high prevalence of Avellino (most prominently Korea where prevalence approaches 1/1000) to perform routine genetic testing to rule out the TGF beta 1 mutation in all candidates for laser vision correction. For more information on the anterior stromal corneal dystrophies see the following case: Epithelial-Stromal and Stromal Corneal Dystrophies Related Articles Epithelial-Stromal and Stromal Corneal Dystrophies - Clinicopathologic Review Epithelial-Stromal and Stromal Corneal Dystrophies - Clinicopathologic Review","u":"pages/Avellino/index.htm","cr":"Caroline W. Wilson, MD and Mark A. Greiner, MD","src":"er"},{"t":"Granular corneal dystrophy","im":[["E:pages/Granular-corneal-dystrophy/GCD-OS-diffuse-LRG.jpg","Slit lamp photo, OS, demonstrate gray-white breadcrumb-like opacities in the anterior cornea, which is classic for granular dystrophy."],["E:pages/Granular-corneal-dystrophy/GCD-OD-diffuse-LRG.jpg","Slit lamp photo, OD, demonstrate gray-white breadcrumb-like opacities in the anterior cornea, which is classic for granular dystrophy."]],"h":"This 30-year-old Chinese female presented for evaluation of granular corneal dystrophy. She had a strong family history of cornea problems suggesting an autosomal dominant inheritance which supported the diagnosis of BIGH3 (Transforming Growth Factor Beta 1 gene, TGFβ1) related disease. Vision was 20/20 in both eyes.","u":"pages/Granular-corneal-dystrophy/index.htm","cr":"David Phillips, MD","src":"er"},{"t":"Granular corneal dystrophy type 1","im":[["E:pages/Granular-corneal-dystrophy/GCD-OS-slit.jpg",""],["E:pages/Granular-corneal-dystrophy/granular-dystrophy-TP-1-TV-LRG.jpg","photo above by T. Venckus"],["E:pages/Granular-corneal-dystrophy/granular-dystrophy-TP-1SK-LRG.jpg","photo above by S. Karakas"]],"h":"Granular corneal dystrophy type 1 is an autosomal dominant condition secondary to a mutation in the TGFβ1 gene. This dystrophy results in hyaline material deposition which appears early in life as discrete \"bread crumb\" or \"rock candy\" granular opacities in the anterior corneal stroma with intervening clear spaces and sparing of the periphery. These opacities enlarge and eventually may become confluent later in life. Three photos from different patients portraying both the \"bread crumb\" and \"rock candy\" appearances of the condition. OMIM #121900, see also *601692","u":"pages/granular-corneal-dystrophy-type-1.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Lattice corneal dystrophy","im":[["E:photos/lattice-corneal-dystrophy-1.jpg",""],["E:photos/lattice-corneal-dystrophy-2.jpg",""],["E:pages/imgs/R_7dMNCXQYdup7FAZ_lattice%20dystrophy1.png",""]],"h":"Lattice corneal dystrophy is an autosomal dominant condition caused by a mutation in the TGFBI gene. The condition results in amyloid deposits which classically appear as refractile, branching lines in the anterior corneal stroma. The patients may also have subepithelial ovoid white dots and diffuse anterior stromal haze. These findings begin centrally at a young age and spread outward over time. The above photos show the eyes of two different patients with varying presentations of the disease. OMIM #122200 Lattice Corneal DystrophyLattice Corneal DystrophyCategory(ies): Cornea / External Eye DiseaseContributor: Mahsaw Mansoor, MDPhotographer: Sarah Skiles, CRAPosted: 06/04/2024A 55-year-old female presented with foreign body sensation in both eyes. She has a family history significant for lattice corneal dystrophy in her father and paternal grandmother. On exam, there were prominent refractile lines in the anterior corneal stroma with a branching pattern consistent with lattice corneal dystrophy.","u":"pages/lattice-corneal-dystrophy.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Corneal macular dystrophy","im":[["E:photos/macular-dystrophy-OD.jpg","right eye"],["E:photos/macular-dystrophy.jpg","right eye"]],"h":"Corneal macular dystrophy is an autosomal recessive condition due to a mutation in the CHST6 gene which results in abnormal synthesis of keratan sulfate. The condition presents with mucopolysaccharide deposits appearing as gray-white opacities throughout all corneal stromal levels and extending into the periphery. There is diffuse clouding of the stroma between opacities.","u":"pages/macular-corneal-dystrophy.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Fleck Corneal Dystrophy","im":[["E:pages/Fleck-Corneal-Dystrophy/Fleck-1-LRG.jpg",""],["E:pages/Fleck-Corneal-Dystrophy/Fleck-2-LRG.jpg",""]],"h":"Fleck Corneal Dystrophy (a.k.a. Francois-Neetens speckled corneal dystrophy) is an autosomal dominant disorder caused by a mutation in phosphoinositide kinase (gene locus 2q34) that results in the accumulation of glycosaminoglycans and complex lipids in swollen vacuolated keratocytes. Clinically, subtle, yet distinctive, small, translucent, gray-white, dandruff-like flakes are seen scattered throughout all levels of an otherwise clear corneal stroma, extending to the periphery. Signs of the disease are typically seen at birth or within the first few years of life. Affected patients are typically asymptomatic, but may have slight photophobia or decreased corneal sensitivity. The disease is non-progressive with a good prognosis. Reference: Weiss JS, Moller HU, Aldave AJ, et al. IC3D Classification of Corneal Dystrophies—Edition 2. Cornea. 2015;34:117-159.","u":"pages/Fleck-Corneal-Dystrophy/index.htm","cr":"T.J. Clark, MD","src":"er"},{"t":"Schnyder Corneal Dystrophy","im":[["E:pages/Schnyder-dystrophy/schnyder-OD-LRG.jpg",""],["E:pages/Schnyder-dystrophy/schnyder-OS-LRG.jpg",""],["E:pages/Schnyder-dystrophy/schnyder-OD-SS-LRG.jpg",""]],"h":"Schnyder crystalline corneal dystrophy is an autosomal dominant condition caused by a mutation in the UbiA prenyltransferase domain-containing protein 1 (UVIAD1). It results in deposition of cholesterol and phospholipid crystals in the central corneal stroma. Later, the patients develop a dense corneal arcus, and eventually midperipheral corneal opacification and decreased corneal sensation. OMIM #121800","u":"pages/Schnyder-dystrophy/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Posterior Polymorphous Corneal Dystrophy (PPMD)","im":[["E:pages/PPMD/PPMD-a-LRG.jpg","Classic appearance of these lesions with direct illumination"],["E:pages/PPMD/PPMD-b-LRG.jpg","Classic appearance of these lesions with retroillumination"],["E:pages/PPMD/PPMD-snail-track-LRG.jpg","Patient 2a"]],"h":"Posterior polymorphous corneal dystrophy (PPMD, PPCD) is a rare, bilateral, autosomal dominant inherited corneal dystrophy. The corneal abnormality in PPMD occurs at the level of Descemet's membrane and endothelium, and rarely will result in corneal edema or elevated intraocular pressure. The three main patterns in which PPMD may present include endothelial vesicle-like lesions, band lesions, and diffuse deep stromal opacities. Figure 1: Vesicle-like lesions in PPMD Figure 1: Vesicle-like lesions in PPMD Contributor: Jesse Vislisel, MD and Kenneth M. Goins, MD Photographer: Brice Critser, CRA March 2,2015 Vesicle-like lesions at the level of Descemet's membrane and endothelium are the hallmark lesions of PPMD. They appear as transparent cystic lesions surrounded by gray halos and commonly occur in lines or clusters. The figures below demonstrate the classic appearance of these lesions with direct illumination, retroillumination, and on specular microscopy. Figure 2: Band lesions in PPMD Figure 2: Band lesions in PPMD Contributor: Jesse Vislisel, MD and Kenneth M. Goins, MD Photographer: Brice Critser, CRA Band lesions, sometimes called \"snail tracks,\" are classically horizontal lesions with parallel, scalloped, non-tapering edges at the level of the posterior cornea. Below are examples of these lesions in 2 separate patients. Figure 3: Diffuse posterior stromal opacities in PPMD Figure 3: Diffuse posterior stromal opacities in PPMD Contributor: Jesse Vislisel, MD and Kenneth M. Goins, MD Photographer: Brice Critser, CRA PPMD may present with diffuse, gray-white opacities at the level of Descemet's membrane. There may be deep stromal haze adjacent to the lesions. Below are slit lamp photographs of two patients with such lesions. Figure 4: Confocal microscopy of affected endothelium in PPMD Figure 4: Confocal microscopy of affected endothelium in PPMD Contributor: Andrew Doan, MD, PhD, University of Iowa Confocal microscopy of the endothelium in PPMD shows epithelial-like cells. Normal endothelial cells are hexagonal and flat.","u":"pages/PPMD/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Guttae in Fuchs' endothelial corneal dystrophy","im":[["E:pages/guttae/guttae-LRG.jpg",""]],"h":"Guttae, Latin for \"drops,\" are excrescences of collagen produced by stressed corneal endothelial cells. They can have a dimpled or \"beaten metal\" appearance at the slit lamp. When found as an age-related change in the corneal periphery of normal individuals they are termed Hassall-Henle bodies.","u":"pages/guttae/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Fuch's Endothelial Corneal Dystrophy","im":[["E:photos/fuchs/Fuchs_022005slit1.jpg","Slit beam view of cornea in a patient with Fuch's corneal dystrophy. By overlying the slit beam with the reflected image of the tungsten filament on the cornea, the examiner can highlight the endothelial surface just to the side of the combined bright spot in the slit beam."],["E:photos/fuchs/Fuchs_022005slitZoom.jpg","Here, the characteristic corneal endothelial guttata are well visualized."]],"h":"Expanded text by Brendan K. Penaluna, May 5, 2017 Fuchs' dystrophy is an example of a posterior corneal dystrophy. Thickening of the Descemet's membrane and defects of endothelial cell number and shape may result in progressive obscuration of vision. Cataract surgery in the setting of Fuch's dystrophy may rarely result in the decompensation of the corneal endothelium, creating an opportunity for the worsening of Fuchs' dystrophy. In this image of a patient with Fuchs' dystrophy post-cataract surgery, endothelial degeneration and subsequent edema and scarring can be appreciated as the white, hazy opacity contrasting against the brown iris and black of the pupil.[1] Contributor: Jordan M. Graff, MD Contributor: Andrew Doan, MD, PhD","u":"pages/Fuchs-Endothelial-Corneal-Dystrophy.html","cr":"Brendan K. Penaluna, Jordan Graff, MD, Andrew Doan, MD, PhD","src":"er"},{"t":"Polymorphic amyloid degeneration of the cornea","im":[["E:pages/Amyloid-degeneration/1-LRG-PAD.jpg","polymorphic amyloid degeneration in a patient before surgery"],["E:pages/Amyloid-degeneration/2-LRG-PAD-RR.jpg","polymorphic amyloid degeneration in a patient before surgery"],["E:pages/Amyloid-degeneration/3-LRG-PAD.jpg","polymorphic amyloid degeneration in a patient after she underwent superficial keratectomy"]],"h":"Polymorphic amyloid degeneration is a bilateral corneal degeneration that develops later in life. It results in refractile, stellate flecks or irregular filaments in the mid to deep corneal stroma with intervening clear spaces. These photographs show the appearance of polymorphic amyloid degeneration in a patient before and after she underwent superficial keratectomy for Salzmann nodular degeneration.","u":"pages/Amyloid-degeneration/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Band Keratopathy","im":[["W:pages/band-keratopathy/band-keratopathy-hyperparathyr-LRG.jpg","-A"],["W:pages/band-keratopathy/band-keratopathy-hyperparathyr-slit-LRG.jpg","-B"],["W:pages/band-keratopathy/band-keratopathy-hyperparathyr-SS-LRG.jpg","-C"]],"h":"Calcific band keratopathy (BK) results from calcium hydroxyapetite deposition in the superficial cornea, mainly Bowman layer. It can be caused by chronic ocular inflammation, hypercalcemia, hyperphosphatemia, chronic exposure to mercurial vapors or preservatives, silicone oil, primary hereditary transmission. It is often idiopathic. BK usually begins as fine, yellow-white deposits in the periphery that may coalesce over time to form a horizontal band across the cornea. Figure 1. Calcific band keratopathy secondary to hyperparathyroidism Figure 2. Early band keratopathy in a patient with uveitis associated with juvenile idiopathic arthritis. The accompanying iron line denotes the chronicity of these corneal changes. Figure 3. Late band keratopathy with a chalky, white consistency. Figure 4. Band keratopathy in a patient with HLA-B27-associated anterior uveitis. The \"Swiss cheese\" appearance derives from lucent \"holes\" in the calcific pattern due to corneal nerve penetration through Bowman's layer. Figure 5. Calcific band keratopathy","u":"pages/band-keratopathy/index.htm","cr":"Jesse Vislisel, MD Brice, Critser, CRA","src":"er"},{"t":"Calcific band keratopathy","im":[["E:pages/BK-1/Fig-1-LRG.jpg",""]],"h":"Calcific band keratopathy (BK) is a corneal degeneration that is characterized by deposition of calcium within the superficial cornea, mainly within Bowman's layer. BK usually begins as fine, yellow-white deposits in the periphery that may coalesce over time to form a horizontal band across the cornea.","u":"pages/BK-1/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Calcific band keratopathy with lucent holes","im":[["E:pages/BK-holes/BK-LRG-B27-RV.jpg",""],["E:pages/BK-holes/Fig-4--LRG.jpg",""]],"h":"Randy Verdick, FOPS Calcific band keratopathy (BK) is a corneal degeneration that is characterized by deposition of calcium within the superficial cornea, mainly within Bowman's layer. BK usually begins as fine, yellow-white deposits in the periphery that may coalesce over time to form a horizontal band across the cornea. This photograph shows BK in a patient with HLA-B27-associated uveitis. The \"Swiss cheese\" appearance derives from lucent \"holes\" in the calcific pattern due to corneal nerve penetration through Bowman's layer.","u":"pages/BK-holes/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Calcific band keratopathy associated with juvenile idiopathic arthritis","im":[["E:pages/BK-JIA/BK-JIA-LRG.jpg",""],["E:pages/BK-JIA/BK-JIA-slit-LRG.jpg",""]],"h":"Calcific band keratopathy (BK) is a corneal degeneration that is characterized by deposition of calcium within the superficial cornea, mainly within Bowman's layer. BK usually begins as fine, yellow-white deposits in the periphery that may coalesce over time to form a horizontal band across the cornea. These photographs show early BK in a patient with uveitis associated with juvenile idiopathic arthritis. The accompanying iron line denotes the chronicity of these corneal changes.","u":"pages/BK-JIA/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Calcific band keratopathy, late:","im":[["E:pages/BK-late/late-BK-LRG.jpg",""]],"h":"Calcific band keratopathy (BK) is a corneal degeneration that is characterized by deposition of calcium within the superficial cornea, mainly within Bowman's layer. BK usually begins as fine, yellow-white deposits in the periphery that may coalesce over time to form a horizontal band across the cornea. This photograph shows late BK with a chalky, white consistency.","u":"pages/BK-late/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Band keratopathy","im":[["E:photos/band/band6-371X340.jpg","This is a chronically inflamed eye with a cataracta complicata and a chronic, smouldering uveitis. Band keratopathy occurs commonly in such eyes."],["E:photos/band/band7.jpg","This photo shows a more advanced stage of bandshaped keratopathy with incipient calcium deposits. Bandshaped keratopathy most frequently occurs in eyes with longstanding intraocular inflammation. The patient is from the Himalayan hill country and demonstrates an epicanthal fold characteristic of India's Mongoloid population."],["E:photos/band/bandshaped3.jpg","In chronically inflamed eyes, calcium deposition is common beneath the corneal epithelium. The photo shows a classic example of bandshaped keratopathy in an eye whose vision potential has been completely destroyed by intraocular inflammation and keratitis with leukomatous scarring."]],"h":"Retired Clinical Assistant Professor of Ophthalmology, University of Rochester School of Medicine and Dentistry *Dr. Caccamise has very generously shared his images of patients taken while operating during the \"eye season\" in rural India as well as those from his private practice during the 1960's and 1970's. Many of his images are significant for their historical perspective and for techniques and conditions seen in settings in undeveloped areas.","u":"pages/band-keratopathy.htm","cr":"Meagan Seay, DO and Nasreen Syed, MD","src":"er"},{"t":"Lipid keratopathy","im":[["E:pages/Lipid-keratopathy/Lipid-keratopathy-LRG.jpg",""],["E:pages/Lipid-keratopathy/lipidK-fig2-1-LRG.jpg",""],["E:pages/Lipid-keratopathy/lipidK-fig2-2-LRG.jpg",""]],"h":"","u":"pages/Lipid-keratopathy/index.htm","cr":"Kurt Chamberlain, MS3; Justin Risma, MD","src":"er"},{"t":"Lipid Keratopathy, post-trauma","im":[["E:photos/lipo/LipidKeratopathy1.jpg",""],["E:photos/lipo/LipidKeratopathy2.jpg",""]],"h":"US Military Flight Surgeon This 46yo Afghani male presented with the appearance of a Secondary Lipid Keratopathy in his left eye. He had suffered a serious blast injury many years prior, which may have been the inciting event. Additional corneal scarring can also be seen.","u":"pages/Lipid-Keratopathy-post-trauma.html","cr":"David W Hayes, DO","src":"er"},{"t":"Terrien Marginal Degeneration","im":[["E:LARGE/Terriens3L.jpg",""],["E:LARGE/Terriens2L.jpg",""],["W:pages/terrien-update/LRG-Terrien-CC.jpg","a"]],"h":"(2c, 2d) This patient with Terrien marginal degeneration has characteristic findings in the right eye. The severe superior stromal thinning is visible on anterior segment OCT and is creating a characteristic against-the-rule pattern of astigmatism. The patient was filtering aqueous through the area of superior thinning resulting in positive Seidel testing and creation of an adjacent conjunctival bleb. He underwent a crescentic lamellar keratoplasty to repair the defect (section below) Contributor: Jesse Vislisel, MD Photographer: Brice Critser, CRA (left image), Stefani Karakas, CRA (right) Post-operative appearance of the patient from previous images after undergoing crescentic lamellar keratoplasty at 1 week and 1 month after the procedure. See the related video to view the procedure.","u":"pages/terrien.htm","cr":"Justin Risma, MD","src":"er"},{"t":"Pellucid marginal degeneration","im":[["E:pages/Pellucid-marginal-degeneration/pellucid-OD-LRG.PNG","These slitlamp photographs demonstrate the corneal protrusion above the area of inferior thinning in a patient with pellucid marginal degeneration."],["E:pages/Pellucid-marginal-degeneration/pellucid-OS-LRG.PNG","OS These slitlamp photographs demonstrate the corneal protrusion above the area of inferior thinning in a patient with pellucid marginal degeneration."]],"h":"Pellucid marginal degeneration is a bilateral corneal ectasia that results in inferior corneal thinning with a corneal protrusion above the thinnest area. This is in contrast to keratoconus where maximal thinning occurs at the apex of the protrusion.","u":"pages/Pellucid-marginal-degeneration/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Keratoconus","im":[["W:photos/Keratoconus/Fig1-LRG.jpg","Slit lamp photograph of the left eye of a patient with keratoconus shows the cone-shaped cornea in right gaze."],["W:photos/Keratoconus/Fig2-LRG.jpg","Slit lamp photograph of the left eye of a patient with keratoconus shows the cone-shaped cornea creating an indentation or bowing of the lower eyelid in downgaze, also known as Munson's sign."],["W:photos/Keratoconus/Fig3-LRG.jpg","Scheimpflug imaging demonstrates the cone-shaped cornea of keratoconus. Advanced corneal thinning can be appreciated in the central cornea."]],"h":"Keratoconus is a bilateral corneal ectasia characterized by central thinning and bulging of the cornea resulting in a cone-shaped protrusion. This patient demonstrates multiple characteristic signs of the condition. Keratoconus Keratoconus Contributor: William Charles Caccamise, Sr, MD,Retired Clinical Assistant Professor of Ophthalmology, University of Rochester School of Medicine and Dentistry *Dr. Caccamise has very generously shared his images of patients taken while operating during the \"eye season\" in rural India as well as those from his private practice during the 1960's and 1970's. Many of his images are significant for their historical perspective and for techniques and conditions seen in settings in undeveloped areas. Munson's sign in left eye Munson's sign in left eye","u":"pages/keratoconus/index.htm","cr":"Austin R. Fox, MD; A. Tim Johnson, MD, PhD","src":"er"},{"t":"Vogt's striae in keratoconus","im":[["E:photos/Vogts-striae/L/Vogts-striae-LRG.jpg",""],["E:photos/Vogts-striae/L/Vogts-striae-1-LRG.jpg",""],["E:photos/Vogts-striae/L/Vogts-striae-2-LRG.jpg",""]],"h":"Vogt's striae are vertical (rarely horizontal) fine, whitish lines in the deep/posterior stroma and Descemet's membrane commonly found in patients with keratoconus. It may be asymmetric depending on the degree of keratoconus in each eye. There is a positive correlation between the orientation of the lines with the steepest axis of the cornea and the mechanism is thought to be related to mechanical stress forces on collagen lamellae radiating from the cone apex. The striae can temporarily disappear with external pressure to the globe.","u":"pages/vogts-striae.htm","cr":"Christopher A. Kirkpatrick, MD","src":"er"},{"t":"Fleischer ring in keratoconus","im":[["E:photos/Fleischer-ring-classic.jpg","This is a 26 year old male patient with keratoconus demonstrating a prominent Fleischer ring around the base of the cone. Other typical signs are also seen including Vogt's striae in the center and stromal scarring at the apex from episodes of hydrops."]],"h":"This is a 26 year old male patient with keratoconus demonstrating a prominent Fleischer ring around the base of the cone. Other typical signs are also seen including Vogt's striae in the center and stromal scarring at the apex from episodes of hydrops.","u":"pages/fleischer-ring-keratoconus-classic.html","cr":"Matt Ward, MD","src":"er"},{"t":"Corneal Hydrops","im":[["E:photos/corneal-hydrops/Fig1-Oblique-slit-lamp-acute-corneal-hydrops.png","Oblique slit-lamp view of acute corneal hydrops highlighting significant apical corneal edema"],["E:photos/corneal-hydrops/Fig2-anterior-slit-lamp-acute-corneal-hydrops.png","Anterior slit-lamp view"],["E:pages/Corneal-Hydrops/hydrops-JT-LRG.jpg","Acute corneal hydrops with severe inferior corneal stromal edema and overlying microcystic edema and bullae in the setting of advanced keratoconus. These photographs were taken 1 week after onset of the episode."]],"h":"Jody Troyer Corneal hydrops is the acute onset of corneal edema due to a break in Descemet membrane. This condition may be seen in individuals with advanced keratoconus or other forms of corneal ectasia. Recovery may take weeks to months with medical therapy, but may be accelerated by the placement of air or gas into the anterior chamber to slow the influx of aqueous into the cornea. Scarring, and sometimes corneal flattening, will occur after resolution of the episode. Entry #1 Entry #1 Contributor: Matthew Meyer, MD Photographer: Sarah Skiles February 12, 2024 Oblique slit-lamp view of acute corneal hydrops highlighting significant apical corneal edema with corresponding anterior slit-lamp view and corneal tomography. Entry #2 Entry #2 Contributor: Jesse Vislisel, MD Photographer: Jody Troyer","u":"pages/Corneal-Hydrops/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Corneal clouding in Hurler's syndrome","im":[["E:pages/Hurlers-syndrome/Hurler-OD-LRG.jpg","Right Eye"],["E:pages/Hurlers-syndrome/Hurler-OS-LRG.jpg","Left Eye"],["E:pages/Hurlers-syndrome/Hurler-OD-slit-LRG.jpg","Right Eye - Slit Lamp"]],"h":"Cloudy corneas noted in a 12-year-old patient with Hurler's syndrome, also known as mucopolysaccharidosis type-1 (MPS-I). His alpha-L-iduronidase activity was found to be 0 (normal 0.17 - 0.54). The patient underwent hematopoietic stem cell transplant at the age of 14 months. Corneal clouding is thought to be due to direct infiltration of glycosaminoglycan in the cornea. The corneal opacities first appear in the anterior stroma and are fine, gray, and punctate. Later, the posterior stroma and endothelium become involved. It is felt that the corneal clarity can clear overtime following a hematopoietic stem cell transplant. Retinal degeneration along with optic nerve head swelling and atrophy have also been described in Hurler's Syndrome. Corneal clouding in mucopolysaccharidosis type I Corneal clouding in mucopolysaccharidosis type I Category(ies): Cornea / External Eye Disease Contributors: Ella Gehrke, MD; Gelilah Yohannes, MD; Lindsay De Andrade, MD Photographer: Brooke Muth A 6-year-old female with a history of mucopolysaccharidosis type I (MPS I), Hurler–Scheie phenotype, presented with bilateral blurred vision. Visual acuity was 20/40 in the right eye and 20/60 in the left eye. Slit-lamp examination revealed diffuse corneal stromal haze with multifocal subepithelial opacities bilaterally. MPS I is an autosomal recessive lysosomal storage disorder caused by deficiency of α-L-iduronidase, resulting in impaired degradation of glycosaminoglycans (GAGs) (1). Corneal clouding, the hallmark ocular manifestation, results from GAG accumulation, which disrupts stromal collagen organization and transparency (2). Although all corneal layers may be affected, stromal involvement predominates (2). Clinically, corneal involvement may manifest as diffuse stromal haze, patchy subepithelial opacities, and progressive visual impairment. Severe corneal clouding can also increase the risk of deprivation amblyopia. Other ocular manifestations of MPS I include glaucoma, optic neuropathy, and retinal degeneration (3). The patient was receiving weekly enzyme replacement therapy with Laronidase, although its efficacy in reversing established corneal clouding is limited (1, 2).","u":"pages/Hurlers-syndrome/index.htm","cr":"David Phillips, MD and Jesse Vislisel, MD","src":"er"},{"t":"Cystinosis","im":[["E:photos/cyst-cysti/cystinosis-1.jpg","Refractile crystal deposition throughout the corneal stroma in a patient with a confirmed CTNS mutation"],["E:photos/cyst-cysti/cystinosis-2.jpg","Refractile crystal deposition throughout the corneal stroma in a patient with a confirmed CTNS mutation"],["E:photos/cyst-cysti/cystinosis-3.jpg","Slit Lamp of refractile crystal deposition throughout the corneal stroma in a patient with a confirmed CTNS mutation"]],"h":"Cystinosis is an autosomal recessive metabolic disorder caused by the CTNS gene that results in the accumulation of the amino acid cystine within lysosomes. In addition to the other systemic pathology, ocular findings include deposition of fine polychromatic cystine crystals in the conjunctiva, anterior corneal stroma (shown here) and trabecular meshwork. The crystals typically do not affect visual acuity, but can cause significant photophobia. These photographs show diffuse, refractile crystal deposition throughout the corneal stroma in a patient with a confirmed CTNS mutation.","u":"pages/cystinosis.htm","cr":"Christopher A Kirkpatrick, MD","src":"er"},{"t":"Kayser-Fleischer Ring in Wilson's Disease","im":[["E:photos/Kayser-Fleischer-Ring-Wilson%27s-Disease/Sunflower-Cataract-OD-LRG.jpg","Slit lamp photographs of sunflower cataracts of the right eye. Note the ring-shaped, anterior capsular opacities that resemble a \"sunflower,\" a finding that is classically associated with Wilson's Disease."],["E:photos/Kayser-Fleischer-Ring-Wilson%27s-Disease/Sunflower-Cataract-OS-LRG.jpg","Slit lamp photographs of sunflower cataracts of the left eye. Note the ring-shaped, anterior capsular opacities that resemble a \"sunflower,\" a finding that is classically associated with Wilson's Disease."],["E:photos/Kayser-Fleischer-Ring-Wilson%27s-Disease/SlitLamp-OD-Fig2a-LRG.jpg","Slit lamp photographs of a Kayser-Fleischer ring. Note the prominent golden/copper hue of the peripheral corneal endothelium—a result of copper deposition, primarily in Descemet membrane."]],"h":"Slit lamp photographs of sunflower cataracts of the right eye. Note the ring-shaped, anterior capsular opacities that resemble a \"sunflower,\" a finding that is classically associated with Wilson's Disease. Slit lamp photographs of sunflower cataracts of the left eye. Note the ring-shaped, anterior capsular opacities that resemble a \"sunflower,\" a finding that is classically associated with Wilson's Disease. Slit lamp photographs of a Kayser-Fleischer ring. Note the prominent golden/copper hue of the peripheral corneal endothelium—a result of copper deposition, primarily in Descemet membrane.","u":"pages/kayser-fleischer-ring-wilsons-disease.htm","cr":"Thomas J.E. Clark, MD","src":"er"},{"t":"Corneal deposits secondary to ciprofloxacin eye drops","im":[["E:photos/Cipro-corneal-deposits/Cipro-Corneal-deposits-1.JPG","Image: Brice Critser, CRA"],["E:photos/Cipro-corneal-deposits/Cipro-Corneal-deposits-2.JPG","Image: Stefani Karakas, CRA"]],"h":"45-year-old female with Pseudomonas keratitis who developed corneal depositis secondary to topical ciprofloxacin use. The depositis usually resolve on their own over time.","u":"pages/cipro-corneal-deposits.htm","cr":"Elizabeth Gauger, MD and Anna Kitzmann, MD","src":"er"},{"t":"Corneal and lenticular pigmentation from long-term chlorpromazine use","im":[["W:photos/chlorpromazine/slit-lamp-chlorpromazine-LRG.jpg",""],["W:photos/chlorpromazine/slit-lamp-chlorpromazine-2-LRG.jpg",""],["W:photos/chlorpromazine/slit-lamp-chlorpromazine-3-LRG.jpg",""]],"h":"OCT-C 55-year-old male with history of schizophrenia and long term chlorpromazine use. There is blue-gray dyspigmentation of the nose, bilateral cheeks, forearms, dorsal hands and arms in photo-distributed areas. Slit lamp examination shows diffuse punctate corneal deposits through the posterior stroma, descemet membrane, and endothelium of the cornea. Contributor: Elizabeth Gauger, MD Photographer: D. Brice Critser, CRA, OCT-C Corneal and lenticular pigmentation from long-term chlorpromazine use 59-year-old male with history of schizophrenia and long-term chlorpromazine (thorazine) treatment. His ocular exam is notable for fine pigment deposition in the posterior corneal stroma and endothelium. In addition, there is pigmentation in a stellate pattern on the anterior lens and lens capsule. This rarely causes a decrease in visual acuity. These findings are characteristic of long-term thorazine use and are suspected to be related to dose and duration of treatment. It is recommended that persons undergoing long-term treatment with thorazine have regular eye examinations.","u":"pages/chlorpromazine-pigmentation-lens-cornea.htm","cr":"Zachary Q. Mortensen, MD; Ryan J. Diel, MD","src":"er"},{"t":"Honeycomb corneal edema secondary to Rho-kinase inhibitor","im":[["E:photos/Honeycomb-P&P-Composite.png",""],["E:pages/imgs/Honeycomb_corneal_edema.webp","Slit lamp photograph showing honeycomb corneal edema."]],"h":"January 29, 2024 A 75-year-old woman with corneal endothelial cell failure underwent Descemet’s stripping automated endothelial keratoplasty (DSEAK) due to advanced primary open angle glaucoma necessitating Ahmed Seton placement. Rho kinase inhibitor netarsudil was initiated 15 months later due to persistently elevated intraocular pressure. Ten months later, she developed microcystic corneal edema. Anterior segment OCT (AS-OCT) confirmed localization to the sub-epithelial space (A). The edema was present diffusely in a honeycomb pattern (B and C). Fluorescein staining confirmed a longitudinal interpalpebral distribution and rupture of subepithelial bullae (D). Netarsudil was stopped due to discomfort and reduction in visual acuity. May 6, 2026 A 65-year-old man with Fuchs endothelial corneal dystrophy underwent Descemet stripping only (DSO) and was started on ripasudil four times per day due to evidence of therapeutic potential in the management of corneal edema and promotion of endothelial wound healing (Erdinest, 2025; Okumura, 2016). Ophthalmic history also included glaucoma suspect and narrow angle status post laser peripheral iridotomy in both eyes. At post-op week one visit for DSO, honeycomb (also known as reticular in the literature) corneal epithelial edema was seen on slit lamp, which exactly mapped to the area of stripping. Visual acuity with pinhole was slightly improved from prior visit. However, IOP had increased to 35 mmHg with suspicion of steroid response following surgery. At two weeks post-op, IOP had decreased to 22 mmHg after switching from prednisolone to FML, and the honeycombing had improved without discontinuing ripasudil.","u":"pages/honeycomb-corneal-edema-rho-kinase-inhibitor.htm","cr":"Joanna I.M. Silverman, MD, Mark A. Greiner, MD","src":"er"},{"t":"Pseudophakic Bullous Keratopathy","im":[["E:LARGE/Pseudophakic-bullous-keratopathy-LRG.jpg","This patient's edema resulted as a sequellae of cataract surgery, thus is it called pseudophakic bullous keratopathy. Note the diffuse epithelial microcysts with several larger bullae visible to the left of the slit beam."]],"h":"Bullous keratopathy is characterized by corneal edema with formation of epithelial bullae. It is secondary to loss or dysfunction of the corneal endothelial cells which usually maintain the cornea's dehydrated state.","u":"pages/pseudophakic-bullous-keratopathy.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Corneal edema secondary to dexamethasone implant (OZURDEX®) migration into the anterior chamber","im":[["E:pages/Ozurdex/Ozurdex-in-the-AC-1-LRG.jpg",""],["E:pag
