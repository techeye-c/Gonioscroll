":"er"},{"t":"Limbal Dermoid","im":[["E:pages/imgs/R_1dAMWcQgStYwziH_limbal%20dermoid.png",""],["E:pages/imgs/R_1dAMWcQgStYwziH_limbal%20dermoid%202.png",""]],"h":"","u":"pages/Limbal_Dermoid.html","cr":"Mahsaw Mansoor, MD","src":"er"},{"t":"Limbal Dermoid","im":[["E:pages/imgs/R_777iChRwOVnHn84_Avellino1.png",""],["E:pages/imgs/R_777iChRwOVnHn84_Avellino2.png",""],["E:pages/imgs/R_777iChRwOVnHn84_Avellino3.png",""]],"h":"A 56-year-old woman presented for evaluation of corneal opacities in both eyes. She reported that the opacities had been present since age 12, with a slow, progressive worsening of her vision. On examination, visual acuity was 20/30 in the right eye and 20/25 in the left eye. There were multifocal corneal opacities, predominantly consisting of ante","u":"pages/Granular_Corneal_Dystrophy_Type_2.html","cr":"Anushi Wijayagunaratne, BS; Mahsaw Mansoor, MD","src":"er"},{"t":"Complex choristoma of the conjunctiva","im":[["E:pages/complex-choristoma/complex-choristoma-3-LRG.jpg",""],["E:pages/complex-choristoma/complex-choristoma-1-LRG.jpg",""],["E:pages/complex-choristoma/complex-choristoma-2-LRG.jpg",""]],"h":"","u":"pages/complex-choristoma/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Pyogenic granuloma","im":[["W:pages/pyogenic-granuloma/pyogenic-granuloma-add-1LRG.jpg","These photos are from a patient who had previously had intracanalicular punctal plugs."],["W:pages/pyogenic-granuloma/pyogenic-granuloma-add-2LRG.jpg","These photos are from a patient who had previously had intracanalicular punctal plugs."]],"h":"A pyogenic granuloma is characterized as a pedunculated vascular lesion, and appears as a fleshy red or pink mass. It is often located on the eyelid and bleeds easily with minimal contact. Clinically, it arises with rapid growth in an area of previous trauma, surgery, or inflammation. Histologically, it is composed of granulation tissue, capillaries, and non-granulomatous inflammatory cells [1 ,2]. R","u":"pages/pyogenic-granuloma/index.htm","cr":"David A. Ramirez, MD, Heather A. Stiff, MD","src":"er"},{"t":"Pyogenic granuloma","im":[["http://webeye.ophth.uiowa.edu/eyeforum/atlas/pages/pyogenic-granuloma/pyogenic-granuloma-add-1LRG.jpg","These photos are from a patient who had previously had intracanalicular punctal plugs."],["http://webeye.ophth.uiowa.edu/eyeforum/atlas/pages/pyogenic-granuloma/pyogenic-granuloma-add-2LRG.jpg","These photos are from a patient who had previously had intracanalicular punctal plugs."]],"h":"A pyogenic granuloma is characterized as a pedunculated vascular lesion, and appears as a fleshy red or pink mass. It is often located on the eyelid and bleeds easily with minimal contact. Clinically, it arises with rapid growth in an area of previous trauma, surgery, or inflammation. Histologically, it is composed of granulation tissue, capillaries, and non-granulomatous inflammatory cells [1 ,2]. R","u":"pages/Pyogenic-granuloma.html","cr":"David A. Ramirez, MD, Heather A. Stiff, MD","src":"er"},{"t":"Pterygium","im":[["E:pages/Pterygium/pterygium-LRG.jpg",""],["E:pages/Pterygium/pterygium-3-LRG.jpg",""]],"h":"","u":"pages/Pterygium/index.htm","cr":"Jesse Vislisel, MD","src":"er"}]},{"n":"Corneal epithelium & ocular surface disease","b":"Staining patterns, abrasions, EBMD, deposits and neurotrophic disease.","items":[{"t":"Punctate epithelial erosions (PEE) secondary to exposure keratopathy","im":[["E:pages/Punctate-epithelial-erosions/Exposure-PEE-LRG.jpg",""]],"h":"","u":"pages/Punctate-epithelial-erosions/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Punctate epithelial erosions (PEE) in exposure keratopathy","im":[["E:pages/Punctate-epithelial-erosions-2/PEE-LRG.JPG",""],["E:pages/Punctate-epithelial-erosions-2/PEE-slit-LRG.JPG",""]],"h":"","u":"pages/Punctate-epithelial-erosions-2/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Punctate epithelial erosions, Diffuse","im":[["E:pages/punctate-epithelial-erosions-3/PEE-LRG.jpg",""]],"h":"","u":"pages/punctate-epithelial-erosions-3/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Applanation epitheliopathy","im":[["E:pages/applanation-epitheliopathy/applanation-epitheliopathy-LRG.jpg",""]],"h":"Applanation tonometry is the gold standard for intraocular pressure assessment. During this technique a circular Goldmann applanation tip contacts the surface of the cornea. Epithelial disruption may occur if care is not taken during applanation, leading to a circle of positive fluorescein staining as seen in this photograph.","u":"pages/applanation-epitheliopathy/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Corneal abrasion","im":[["E:pages/corneal-abrasion/corneal-abrasion-LRG.jpg",""]],"h":"","u":"pages/corneal-abrasion/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Epithelial basement membrane dystrophy (map-dot-fingerprint dystrophy)","im":[["E:photos/meesmann-epithelial-corneal-dystrophy/EBMD.MECD1-LRG.jpg",""],["E:photos/meesmann-epithelial-corneal-dystrophy/EBMD.MECD2-LRG.jpg",""],["E:photos/meesmann-epithelial-corneal-dystrophy/EBMD.MECD3-LRG.jpg",""]],"h":"72-year-old female with decrease in central visual acuity. Classic gray patches, fingerprint lines, map lines, dots, and cobblestone pattern in the corneal epithelium are seen on this photo. Contributor: Thomas J.E","u":"pages/map-dot-dystrophy.htm","cr":"Lorraine M. Provencher, MD","src":"er"},{"t":"Hurricane keratopathy","im":[["E:pages/Hurricane-keratopathy/hurricane-keratopath-LRG.jpg",""]],"h":"Hurricane keratopathy occurs in situations of high corneal epithelial cell turnover and migration. In this condition, the centripetal pattern of cell migration from the corneal limbus becomes visible. The cells usually make a clockwise whorl or vortex pattern as they move centrally. It has been hypothesized by Dua that this is due to the effects of electromagnetic fo","u":"pages/Hurricane-keratopathy/index.htm","cr":"Jesse Vislisel, MD; Matt Raecker, MD","src":"er"},{"t":"Thygeson's superficial punctate keratitis","im":[["E:pages/ThygesonPK/TPK-1-LRG.jpg",""],["E:pages/ThygesonPK/TPK-2-LRG.jpg",""],["E:pages/ThygesonPK/TPK-3-LRG.jpg",""]],"h":"In 1950, Dr. Phillips Thygeson reported a case series of 26 patients. These patients classically have a history of cyclical exacerbations and remissions with symptoms of foreign body sensation, photophobia, burning, tearing and occasionally blurring of vision. Symptoms are commonly bilateral but asymmetric. On exam, there are multiple slightly elevated corneal lesions","u":"pages/ThygesonPK/index.htm","cr":"Lucas Lenci, MD; Blake Perry, MD","src":"er"},{"t":"Corneal Delle","im":[["E:pages/Delle/delle-LRG.jpg","This patient developed persistent nasal chemosis after Mohs surgery for basal cell carcinoma."]],"h":"This patient developed persistent nasal chemosis after Mohs surgery for basal cell carcinoma.","u":"pages/Delle/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Pannus","im":[["E:photos/pannus-LRG.jpg",""],["E:photos-earlier/pannus.jpg","Pannus from failure of corneal limbal stem cells."]],"h":"Douglas B. Critser Corneal pannus is subepithelial fibrovascular tissue ingrowth from the limbus onto the cornea. It typically results from inflammation, which may be causes by a number of events such as infection or chronic irritation.","u":"pages/pannus.html","cr":"Austin R. Fox, MD","src":"er"},{"t":"Limbal stem cell deficiency","im":[["E:photos/Limbal-Stem-cell-deficiency-for-1-LRG.jpg",""],["E:photos/Limbal-Stem-cell-deficiency-2-LRG.jpg",""]],"h":"","u":"pages/limbal-stem-cell-deficiency.htm","cr":"Austin Fox, MD","src":"er"},{"t":"Stellate corneal epithelial iron line after radial keratotomy (RK)","im":[["E:pages/stellate-iron-p-RK/stellate-iron-line-RK-LRG.jpg","Radially oriented corneal incisions from prior radial keratotomy (RK) with a characteristic central stellate corneal epithelial iron line"]],"h":"Radially oriented corneal incisions from prior radial keratotomy (RK) with a characteristic central stellate corneal epithelial iron line","u":"pages/stellate-iron-p-RK/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Cornea verticillata","im":[["E:pages/Verticillata/OD-951-LRG.jpg","Right Eye"],["E:pages/Verticillata/OS-spec-951-LRG.jpg","Left Eye"],["E:pages/Verticillata/ODslit-951-LRG.jpg","Right Eye"]],"h":"Cornea verticillata, also known as vortex keratopathy, describes a pattern of whorl- shaped opacities within the basal corneal epithelium. They are most commonly located in the inferior paracentral region, are non-elevated, and can range from white to brown in color. These changes are usually not visually significant. Cornea verticillata is often caused by the use of certain systemic medications, the most common of w","u":"pages/Verticillata/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Amiodarone vortex keratopathy","im":[["E:photos/amiodaroneKeratopathyOD.jpg",""]],"h":"","u":"pages/amiodarone-keratopathy.htm","cr":"Kimberly Winges, MD","src":"er"},{"t":"Fabry Disease","im":[["E:pages/fabry/verticillata-358-Fabry-LRG.jpg","Cornea verticillata in a young female which led to the diagnosis of Fabry disease."],["E:pages/fabry/FABRY-OD-LRG.jpg","Cornea verticillata in a patient with known Fabry disease.Right Eye"],["E:pages/fabry/FABRY-OS-LRG.jpg","Cornea verticillata in a patient with known Fabry disease.Left Eye"]],"h":"Fabry disease is an X-linked dominant sphingolipidosis caused by a deficiency in alpha-galactosidase A which results in accumulation of ceramide trihexoside in select body tissues. Ocular findings include cornea verticillata, conjunctival aneurysms, cataracts, retinal vascular changes and optic atrophy. (Contributor: Jeffrey D. Welder, MD) Corneal verticillata","u":"pages/fabry/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Neurotrophic Ulcer Secondary to 5th and 7th Cranial Nerve Palsies","im":[["E:pages/Neurotrophic-Ulcer/1-ulcer-LRG.jpg",""],["E:pages/Neurotrophic-Ulcer/2-ulcer.-LRG.jpg",""],["E:pages/Neurotrophic-Ulcer/3-ulcer-diffuse-illumination-LRG.jpg",""]],"h":"This is a 51-year-old woman was referred to the ophthalmology clinic from otolaryngology with progressive blurred vision in the right eye after resection of large petroclival meningioma 1 month prior. She had lagopthalmos and incomplete blink with significantly decreased corneal sensation. She was found to have a corneal ulcer with a gray, heaped-up rim, surrounding whi","u":"pages/Neurotrophic-Ulcer/index.htm","cr":"Lindsay McConnell, MD Luke Lenci, MD","src":"er"}]},{"n":"Corneal dystrophies, degenerations & ectasia","b":"Stromal dystrophies, Fuchs, band keratopathy, keratoconus and deposits.","items":[{"t":"Meesmann Epithelial Corneal Dystrophy","im":[["W:photos/meesmann-epithelial-corneal-dystrophy/EBMD.MECD1-LRG.jpg",""],["W:photos/meesmann-epithelial-corneal-dystrophy/EBMD.MECD2-LRG.jpg",""],["W:photos/meesmann-epithelial-corneal-dystrophy/EBMD.MECD3-LRG.jpg",""]],"h":"Meesmann epithelial corneal dystrophy (aka, juvenile hereditary epithelial dystrophy) is an autosomal dominant condition with a mutation in the gene keratin K3 (KRT3) at loc","u":"pages/Meesmann-epithelial-corneal-dystrophy/index.htm","cr":"Lorraine M. Provencher, MD","src":"er"},{"t":"Reis-Bucklers corneal dystrophy","im":[["E:photos/Reis-Bucklers-1.JPG",""],["E:photos/Reis-Bucklers-2.JPG",""]],"h":"52-year-old female presented with Reis-Bucklers corneal dystrophy. She was diagnosed at age 5 and has suffered from chronic recurrent erosion syndrome. Family history is notable for father, brother and two sisters with corneal dystrophy.","u":"pages/Reis-Bucklers.htm","cr":"Jeffrey Welder, MD","src":"er"},{"t":"Avellino Dystrophy","im":[["E:pages/Avellino/Avellino-Dystrophy-OD-sclerotic-scatter-LRG.jpg","Avellino Dystrophy OD"],["E:pages/Avellino/avellino-dystrophy-os-sclerotic-scatter-LRG.jpg","Avellino Dystrophy OS"],["E:pages/Avellino-dystrophy/avellino-LRG.jpg","Avellino Dystrophy Zoomed"]],"h":"This 23-year-old female patient has granular type II (Avellino) corneal dystrophy and recurrent erosions. She has a strong family history of this autosomal dominant corneal dystrophy. In both eyes, there are linear lattice deposits and granular deposits in the central and paracentral anterior stroma with clear intervening stroma between the deposits. The right eye (top) has undergone phototherapeut","u":"pages/Avellino/index.htm","cr":"Caroline W. Wilson, MD and Mark A. Greiner, MD","src":"er"},{"t":"Granular corneal dystrophy","im":[["E:pages/Granular-corneal-dystrophy/GCD-OS-diffuse-LRG.jpg","Slit lamp photo, OS, demonstrate gray-white breadcrumb-like opacities in the anterior cornea, which is classic for granular dystrophy."],["E:pages/Granular-corneal-dystrophy/GCD-OD-diffuse-LRG.jpg","Slit lamp photo, OD, demonstrate gray-white breadcrumb-like opacities in the anterior cornea, which is classic for granular dystrophy."]],"h":"Slit lamp photo, OS, demonstrate gray-white breadcrumb-like opacities in the anterior cornea, which is classic for granular dystrophy.","u":"pages/Granular-corneal-dystrophy/index.htm","cr":"David Phillips, MD","src":"er"},{"t":"Granular corneal dystrophy type 1","im":[["E:pages/Granular-corneal-dystrophy/GCD-OS-slit.jpg",""],["E:pages/Granular-corneal-dystrophy/granular-dystrophy-TP-1-TV-LRG.jpg","photo above by T. Venckus"],["E:pages/Granular-corneal-dystrophy/granular-dystrophy-TP-1SK-LRG.jpg","photo above by S. Karakas"]],"h":"","u":"pages/granular-corneal-dystrophy-type-1.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Lattice corneal dystrophy","im":[["E:photos/lattice-corneal-dystrophy-1.jpg",""],["E:photos/lattice-corneal-dystrophy-2.jpg",""],["E:pages/imgs/R_7dMNCXQYdup7FAZ_lattice%20dystrophy1.png",""]],"h":"","u":"pages/lattice-corneal-dystrophy.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Corneal macular dystrophy","im":[["E:photos/macular-dystrophy-OD.jpg","right eye"],["E:photos/macular-dystrophy.jpg","right eye"]],"h":"right eye","u":"pages/macular-corneal-dystrophy.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Fleck Corneal Dystrophy","im":[["E:pages/Fleck-Corneal-Dystrophy/Fleck-1-LRG.jpg",""],["E:pages/Fleck-Corneal-Dystrophy/Fleck-2-LRG.jpg",""]],"h":"Fleck Corneal Dystrophy (a.k.a. Francois-Neetens speckled corneal dystrophy) is an autosomal dominant disorder caused by a mutation in phosphoinositide kinase (gene locus 2q34) that results in the accumulation of glycosaminoglycans and complex lipids in swollen vacuolated keratocytes. Clinically, subtle, yet distinctive, small, translucent, gray-white, dandruff-like flakes are seen scattered throug","u":"pages/Fleck-Corneal-Dystrophy/index.htm","cr":"T.J. Clark, MD","src":"er"},{"t":"Schnyder Corneal Dystrophy","im":[["E:pages/Schnyder-dystrophy/schnyder-OD-LRG.jpg",""],["E:pages/Schnyder-dystrophy/schnyder-OS-LRG.jpg",""],["E:pages/Schnyder-dystrophy/schnyder-OD-SS-LRG.jpg",""]],"h":"","u":"pages/Schnyder-dystrophy/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Posterior Polymorphous Corneal Dystrophy (PPMD)","im":[["E:pages/PPMD/PPMD-a-LRG.jpg","Classic appearance of these lesions with direct illumination"],["E:pages/PPMD/PPMD-b-LRG.jpg","Classic appearance of these lesions with retroillumination"],["E:pages/PPMD/PPMD-snail-track-LRG.jpg","Patient 2a"]],"h":"Posterior polymorphous corneal dystrophy (PPMD, PPCD) is a rare, bilateral, autosomal dominant inherited corneal dystrophy. The corneal abnormality in PPMD occurs at the level of Descemet's membrane and endothelium, and rarely will result in corneal edema or elevated intraocular pressure. The three main patterns in which PPMD may present include endothelial vesicle-like lesions, band lesions, and diffuse deep stromal","u":"pages/PPMD/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Guttae in Fuchs' endothelial corneal dystrophy","im":[["E:pages/guttae/guttae-LRG.jpg",""]],"h":"","u":"pages/guttae/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Fuch's Endothelial Corneal Dystrophy","im":[["E:photos/fuchs/Fuchs_022005slit1.jpg","Slit beam view of cornea in a patient with Fuch's corneal dystrophy. By overlying the slit beam with the reflected image of the tungsten fil"],["E:photos/fuchs/Fuchs_022005slitZoom.jpg","Here, the characteristic corneal endothelial guttata are well visualized."]],"h":"Slit beam view of cornea in a patient with Fuch's corneal dystrophy. By overlying the slit beam with the reflected image of the tungsten filament on the cornea, the examiner can highlight the endothelial surface just to the side of the combined bright spot in the slit beam.","u":"pages/Fuchs-Endothelial-Corneal-Dystrophy.html","cr":"Brendan K. Penaluna, Jordan Graff, MD, Andrew Doan, MD, PhD","src":"er"},{"t":"Polymorphic amyloid degeneration of the cornea","im":[["E:pages/Amyloid-degeneration/1-LRG-PAD.jpg","polymorphic amyloid degeneration in a patient before surgery"],["E:pages/Amyloid-degeneration/2-LRG-PAD-RR.jpg","polymorphic amyloid degeneration in a patient before surgery"],["E:pages/Amyloid-degeneration/3-LRG-PAD.jpg","polymorphic amyloid degeneration in a patient after she underwent superficial keratectomy"]],"h":"polymorphic amyloid degeneration in a patient before surgery","u":"pages/Amyloid-degeneration/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Band Keratopathy","im":[["W:pages/band-keratopathy/band-keratopathy-hyperparathyr-LRG.jpg","-A"],["W:pages/band-keratopathy/band-keratopathy-hyperparathyr-slit-LRG.jpg","-B"],["W:pages/band-keratopathy/band-keratopathy-hyperparathyr-SS-LRG.jpg","-C"]],"h":"Calcific band keratopathy (BK) results from calcium hydroxyapetite deposition in the superficial cornea, mainly Bowman layer. It can be caused by chronic ocular inflammation, hypercalcemia, hyperphosphatemia, chronic exposure to mercurial vapors or preservatives, silicone oil, primary hereditary transmission. It is often idiopathic. BK usually begins as fine, yellow-white deposits in the periphery","u":"pages/band-keratopathy/index.htm","cr":"Jesse Vislisel, MD Brice, Critser, CRA","src":"er"},{"t":"Calcific band keratopathy","im":[["E:pages/BK-1/Fig-1-LRG.jpg",""]],"h":"Calcific band keratopathy (BK) is a corneal degeneration that is characterized by deposition of calcium within the superficial cornea, mainly within Bowman's layer. BK usually begins as fine, yellow-white deposits in the periphery that may coalesce over time to form a horizontal band across the cornea.","u":"pages/BK-1/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Calcific band keratopathy with lucent holes","im":[["E:pages/BK-holes/BK-LRG-B27-RV.jpg",""],["E:pages/BK-holes/Fig-4--LRG.jpg",""]],"h":"","u":"pages/BK-holes/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Calcific band keratopathy associated with juvenile idiopathic arthritis","im":[["E:pages/BK-JIA/BK-JIA-LRG.jpg",""],["E:pages/BK-JIA/BK-JIA-slit-LRG.jpg",""]],"h":"","u":"pages/BK-JIA/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Calcific band keratopathy, late:","im":[["E:pages/BK-late/late-BK-LRG.jpg",""]],"h":"Calcific band keratopathy (BK) is a corneal degeneration that is characterized by deposition of calcium within the superficial cornea, mainly within Bowman's layer. BK usually begins as fine, yellow-white deposits in the periphery that may coalesce over time to form a horizontal band across the cornea. This photograph shows late BK with a chalky, white consistency.","u":"pages/BK-late/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Band keratopathy","im":[["E:photos/band/band6-371X340.jpg","This is a chronically inflamed eye with a cataracta complicata and a chronic, smouldering uveitis. Band keratopathy occurs commonly in such"],["E:photos/band/band7.jpg","This photo shows a more advanced stage of bandshaped keratopathy with incipient calcium deposits. Bandshaped keratopathy most frequently occ"],["E:photos/band/bandshaped3.jpg","In chronically inflamed eyes, calcium deposition is common beneath the corneal epithelium. The photo shows a classic example of bandshaped k"]],"h":"Retired Clinical Assistant Professor of Ophthalmology, University of Rochester School of Medicine and Dentistry *Dr. Caccamise has very generously shared his images of","u":"pages/band-keratopathy.htm","cr":"Meagan Seay, DO and Nasreen Syed, MD","src":"er"},{"t":"Lipid keratopathy","im":[["E:pages/Lipid-keratopathy/Lipid-keratopathy-LRG.jpg",""],["E:pages/Lipid-keratopathy/lipidK-fig2-1-LRG.jpg",""],["E:pages/Lipid-keratopathy/lipidK-fig2-2-LRG.jpg",""]],"h":"","u":"pages/Lipid-keratopathy/index.htm","cr":"Kurt Chamberlain, MS3; Justin Risma, MD","src":"er"},{"t":"Lipid Keratopathy, post-trauma","im":[["E:photos/lipo/LipidKeratopathy1.jpg",""],["E:photos/lipo/LipidKeratopathy2.jpg",""]],"h":"US Military Flight Surgeon This 46yo Afghani male presented with the appearance of a Secondary Lipid Keratopathy in his left eye. He had suffered a serious blast injury many years prior, which may have been the inciting event. Additional corneal scarring can also be seen.","u":"pages/Lipid-Keratopathy-post-trauma.html","cr":"David W Hayes, DO","src":"er"},{"t":"Terrien Marginal Degeneration","im":[["E:LARGE/Terriens3L.jpg",""],["E:LARGE/Terriens2L.jpg",""],["W:pages/terrien-update/LRG-Terrien-CC.jpg","a"]],"h":"","u":"pages/terrien.htm","cr":"Justin Risma, MD","src":"er"},{"t":"Pellucid marginal degeneration","im":[["E:pages/Pellucid-marginal-degeneration/pellucid-OD-LRG.PNG","These slitlamp photographs demonstrate the corneal protrusion above the area of inferior thinning in a patient with pellucid m"],["E:pages/Pellucid-marginal-degeneration/pellucid-OS-LRG.PNG","OS These slitlamp photographs demonstrate the corneal protrusion above the area of inferior thinning in a patient with pellucid m"]],"h":"These slitlamp photographs demonstrate the corneal protrusion above the area of inferior thinning in a patient with pellucid marginal degeneration.","u":"pages/Pellucid-marginal-degeneration/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Keratoconus","im":[["W:photos/Keratoconus/Fig1-LRG.jpg","Slit lamp photograph of the left eye of a patient with keratoconus shows the cone-shaped cornea in right gaze."],["W:photos/Keratoconus/Fig2-LRG.jpg","Slit lamp photograph of the left eye of a patient with keratoconus shows the cone-shaped cornea creating an indentation or bowing"],["W:photos/Keratoconus/Fig3-LRG.jpg","Scheimpflug imaging demonstrates the cone-shaped cornea of keratoconus. Advanced corneal thinning can be appreciated in the centra"]],"h":"Keratoconus is a bilateral corneal ectasia characterized by central thinning and bulging of the cornea resulting in a cone-shaped protrusion. This patient demonstrates multiple characteristic signs of the condition. Keratoconus Keratoconus Contributor: William Charles Caccamise, Sr, MD,Retired Clinical Assistant Professor of Ophthal","u":"pages/keratoconus/index.htm","cr":"Austin R. Fox, MD; A. Tim Johnson, MD, PhD","src":"er"},{"t":"Vogt's striae in keratoconus","im":[["E:photos/Vogts-striae/L/Vogts-striae-LRG.jpg",""],["E:photos/Vogts-striae/L/Vogts-striae-1-LRG.jpg",""],["E:photos/Vogts-striae/L/Vogts-striae-2-LRG.jpg",""]],"h":"Vogt's striae are vertical (rarely horizontal) fine, whitish lines in the deep/posterior stroma and Descemet's membrane commonly found in patients with keratoconus. It may be asymmetric depending on the degree of keratoconus in each eye. There is a positive correlation between the orientation of the lines with the steepest axis of the cornea and the mechanism is thought to be related to mechanical s","u":"pages/vogts-striae.htm","cr":"Christopher A. Kirkpatrick, MD","src":"er"},{"t":"Fleischer ring in keratoconus","im":[["E:photos/Fleischer-ring-classic.jpg","This is a 26 year old male patient with keratoconus demonstrating a prominent Fleischer ring around the base of the cone. Other typical sign"]],"h":"This is a 26 year old male patient with keratoconus demonstrating a prominent Fleischer ring around the base of the cone. Other typical signs are also seen including Vogt's striae in the center and stromal scarring at the apex from episodes of hydrops.","u":"pages/fleischer-ring-keratoconus-classic.html","cr":"Matt Ward, MD","src":"er"},{"t":"Corneal Hydrops","im":[["E:photos/corneal-hydrops/Fig1-Oblique-slit-lamp-acute-corneal-hydrops.png","Oblique slit-lamp view of acute corneal hydrops highlighting significant apical corneal edema"],["E:photos/corneal-hydrops/Fig2-anterior-slit-lamp-acute-corneal-hydrops.png","Anterior slit-lamp view"],["E:pages/Corneal-Hydrops/hydrops-JT-LRG.jpg","Acute corneal hydrops with severe inferior corneal stromal edema and overlying microcystic edema and bullae in the setting of advanc"]],"h":"Oblique slit-lamp view of acute corneal hydrops highlighting significant apical corneal edema","u":"pages/Corneal-Hydrops/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Corneal clouding in Hurler's syndrome","im":[["E:pages/Hurlers-syndrome/Hurler-OD-LRG.jpg","Right Eye"],["E:pages/Hurlers-syndrome/Hurler-OS-LRG.jpg","Left Eye"],["E:pages/Hurlers-syndrome/Hurler-OD-slit-LRG.jpg","Right Eye - Slit Lamp"]],"h":"Cloudy corneas noted in a 12-year-old patient with Hurler's syndrome, also known as mucopolysaccharidosis type-1 (MPS-I). His alpha-L-iduronidase activity was found to be 0 (normal 0.17 - 0.54). The patient underwent hematopoietic stem cell transplant at the age of 14 months. Corneal clouding is thought to be due to direct infiltration of glycosaminoglycan in th","u":"pages/Hurlers-syndrome/index.htm","cr":"David Phillips, MD and Jesse Vislisel, MD","src":"er"},{"t":"Cystinosis","im":[["E:photos/cyst-cysti/cystinosis-1.jpg","Refractile crystal deposition throughout the corneal stroma in a patient with a confirmed CTNS mutation"],["E:photos/cyst-cysti/cystinosis-2.jpg","Refractile crystal deposition throughout the corneal stroma in a patient with a confirmed CTNS mutation"],["E:photos/cyst-cysti/cystinosis-3.jpg","Slit Lamp of refractile crystal deposition throughout the corneal stroma in a patient with a confirmed CTNS mutation"]],"h":"Refractile crystal deposition throughout the corneal stroma in a patient with a confirmed CTNS mutation","u":"pages/cystinosis.htm","cr":"Christopher A Kirkpatrick, MD","src":"er"},{"t":"Kayser-Fleischer Ring in Wilson's Disease","im":[["E:photos/Kayser-Fleischer-Ring-Wilson%27s-Disease/Sunflower-Cataract-OD-LRG.jpg","Slit lamp photographs of sunflower cataracts of the right eye. Note the ring-shaped, anterior capsular opacities that resemble a"],["E:photos/Kayser-Fleischer-Ring-Wilson%27s-Disease/Sunflower-Cataract-OS-LRG.jpg","Slit lamp photographs of sunflower cataracts of the left eye. Note the ring-shaped, anterior capsular opacities that resemble a \""],["E:photos/Kayser-Fleischer-Ring-Wilson%27s-Disease/SlitLamp-OD-Fig2a-LRG.jpg","Slit lamp photographs of a Kayser-Fleischer ring. Note the prominent golden/copper hue of the peripheral corneal endothelium—a re"]],"h":"Slit lamp photographs of sunflower cataracts of the right eye. Note the ring-shaped, anterior capsular opacities that resemble a \"sunflower,\" a finding that is classically associated with Wilson's Disease.","u":"pages/kayser-fleischer-ring-wilsons-disease.htm","cr":"Thomas J.E. Clark, MD","src":"er"},{"t":"Corneal deposits secondary to ciprofloxacin eye drops","im":[["E:photos/Cipro-corneal-deposits/Cipro-Corneal-deposits-1.JPG","Image: Brice Critser, CRA"],["E:photos/Cipro-corneal-deposits/Cipro-Corneal-deposits-2.JPG","Image: Stefani Karakas, CRA"]],"h":"45-year-old female with Pseudomonas keratitis who developed corneal depositis secondary to topical ciprofloxacin use. The depositis usually resolve on their own over time.","u":"pages/cipro-corneal-deposits.htm","cr":"Elizabeth Gauger, MD and Anna Kitzmann, MD","src":"er"},{"t":"Corneal and lenticular pigmentation from long-term chlorpromazine use","im":[["W:photos/chlorpromazine/slit-lamp-chlorpromazine-LRG.jpg",""],["W:photos/chlorpromazine/slit-lamp-chlorpromazine-2-LRG.jpg measurement is less than 11 mm in the gr"],["W:photos/microph11.jpg","The cornea measured 9.5mm in diameter. A measurement less than 11mm is considered microcornea. In this case, it is part of a microphthalmos."]],"h":"Retired Clinical Assistant Professor of Ophthalmology, University of Rochester School of Medicine and Dentistry *Dr. Caccamise has very generously shared his images of patients taken while operating during the \"eye season\" in rural India as well as those from his private practice during the 1960's and 1970's. Many of his images are significant for their historical perspective and for techniques and conditions seen in","u":"pages/microcornea/index.htm","cr":"William Charles Caccamise, Sr, MD","src":"er"},{"t":"Sclerocornea","im":[["E:photos/sclero/sclerocornea.jpg",""]],"h":"This 30-year-old male presented with congenital anophthalmia on the left and sclerocornea on the right. When these two conditions are associated there is also an increased likelihood of dermoid, glaucoma and developmental delay.","u":"pages/sclerocornea.htm","cr":"Matt Ward, MD","src":"er"}]},{"n":"Keratitis","b":"Bacterial, fungal, Acanthamoeba, herpetic and immune keratitis.","items":[{"t":"Bacterial Keratitis","im":[["E:photos/MonocularCornUlcer6.jpg",""]],"h":"","u":"pages/Bacterial-Keratitis.html","cr":"Jordan M. Graff, MD","src":"er"},{"t":"Pseudomonas keratitis","im":[["E:pages/Pseudomonas-keratitis/pseudomonas-keratitis-LRG.jpg",""],["E:pages/Pseudomonas-keratitis/pseudomonas-keratitis-slit-LRG.jpg",""]],"h":"","u":"pages/Pseudomonas-keratitis/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Pseudomonas keratitis","im":[["W:pages/Pseudomonas-keratitis/pseudomonas-keratitis-81YO.JPG","81-year-old female with a prior failing PKP presented with pseudomonas keratitis within the graft presumably due to bullous keratopathy."]],"h":"81-year-old female with a prior failing PKP presented with pseudomonas keratitis within the graft presumably due to bullous keratopathy.","u":"pages/pseudomonas-keratitis-81.html","cr":"John J. Chen, MD, PhD","src":"er"},{"t":"Pseudomonas keratitis (suppurative)","im":[["E:photos-earlier/keratitis_01232005.jpg",""],["E:photos-earlier/keratitis2_01232005.jpg",""]],"h":"Patient developed a 7th nerve palsy, exposure keratopathy, and then severe suppurative pseudomonas keratitis.","u":"pages/pseudomonas-keratitis-suppurative.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Corneal Satellite Infiltrates","im":[["E:pages/Corneal-Satellite-Infiltrates/infiltrates-1-LRG.jpg",""],["E:pages/Corneal-Satellite-Infiltrates/infiltrates-2-LRG.jpg",""],["E:pages/Corneal-Satellite-Infiltrates/infiltrates-3-LRG.jpg",""]],"h":"These photographs show satellite infiltrates associated with a central corneal ulcer secondary to culture-negative, Gram-negative rod bacterial keratitis. While historically associated with fungal keratitis, satellite infiltrates have been reported in cases of Acanthamoeba, nontuberculous mycobacterium, and bacterial (including Pseudomonas) keratitis.","u":"pages/Corneal-Satellite-Infiltrates/index.htm","cr":"T.J. Clark, MD","src":"er"},{"t":"Nocardia farcinica keratitis in a contact lens wearer","im":[["E:photos/Nocardia/Fig1-LRG.jpg","Slit lamp photography of the right eye. This photograph demonstrates multifocal stromal infiltrates in the mid-periphery extending"],["E:photos/Nocardia/Fig2-LRG.jpg","Slit lamp photography of the right eye. This photograph shows a moderate amount of white blood cell recruitment surrounding the st"],["E:photos/Nocardia/Fig3-LRG.jpg","Slit lamp photography of the right eye. This photograph demonstrates a focal lesion in the nasal mid-periphery without feathery bo"]],"h":"A 52-year-old male with a 35+ year history of hard and soft contact lens wear, poor lens hygiene, including overnight wear and recent hot tub exposure, presented with decreased vision in the left eye and eye pain. On presentation, his visual acuity was 20/20 OD and 20/60 OS, with intraocular pressures of 15 and 13 mmHg, respectively. Slit-lamp examination revealed multifocal, wreath-like","u":"pages/nocardiafarcinica-keratitis.htm","cr":"Brittni A. Scruggs, MD","src":"er"},{"t":"Acanthamoeba keratitis","im":[["E:pages/acanthamoeba/N-acanthamoeba-LRG-sk.jpg","Concentric ring infiltrate in a contact lens wearer with early Acanthamoeba keratitis."],["E:pages/acanthamoeba/N-acanthamoeba-slit-LRG-sk.jpg","- Slit Lamp: Concentric ring infiltrate in a contact lens wearer with early Acanthamoeba keratitis."],["E:pages/acanthamoeba/N-acanthamoeba-zoom-LRG-sk.jpg","- Enhanced Zoom: Concentric ring infiltrate in a contact lens wearer with early Acanthamoeba keratitis."]],"h":"Acanthamoeba keratitis is a rare parasitic infection of the cornea that primarily occurs in contact lens wearers. The infection may be limited to the epithelium in its early stages, resulting in epithelial dendrites and punctate epitheliopathy. Later stromal involvement classically results in a","u":"pages/acanthamoeba/index.htm","cr":"Jesse Vislisel, MD; Jordan Graff, MD; Meagan Seay, DO","src":"er"},{"t":"Infectious Crystalline Keratopathy","im":[["E:photos/Infectious-crystalline-keratopathy/ICK_slit-lamp-LRG.jpg","Slit lamp photograph of the right eye shows mild injection, penetrating keratoplasty graft with 1 x 1 mm epithelialized melt with"],["E:photos/Infectous-Crystalline-Keratopathy.jpg",""],["E:photos-earlier/ICK.jpg",""]],"h":"Slit lamp photograph of the right eye shows mild injection, penetrating keratoplasty graft with 1 x 1 mm epithelialized melt with white crystalline infiltrate sprouted within stroma extending 2.5 mm x 2.5 mm and large keratic precipitates posterior to involved area. Patient was also noted to have central striae, stromal edema, and Descemet's folds with no cell, 1+ flare, and inferonasal membranes along endo","u":"pages/Infectious-Crystalline-Keratopathy.htm","cr":"Lauren E. Hock, MD and Mark A. Greiner, MD","src":"er"},{"t":"Herpes simplex virus (HSV) epithelial kerat /index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Ghost dendrites","im":[["E:pages/Ghost-dendrites/ghost-dendrite-LRG.jpg",""]],"h":"Ghost dendrites may remain after resolution of herpes simplex virus (HSV) epithelial keratitis due to residual subepithelial infiltration and scarring in the region of the previous dendritic ulcer. To learn more about HSV keratitis, read the EyeRounds case report.","u":"pages/Ghost-dendrites/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Subepithelial corneal haze after herpes zoster virus (HZV) keratitis","im":[["E:pages/Anterior-stromal-haze-HZV/HZV-LRG-subepi-haze.jpg","Corneal haze can be seen as a reflective region when illuminated with a broad slit beam."],["E:pages/Anterior-stromal-haze-HZV/HZV-LRG-subepi-haze-slit.jpg","Corneal haze is most easily visible when using the slit beam seen using the slit beam"],["E:pages/Anterior-stromal-haze-HZV/HZV-LRG-subepi-haze-slit-zoom.jpg","Corneal haze is most easily visible when using the slit beam seen using the slit beam - Zoomed"]],"h":"Corneal haze can be seen as a reflective region when illuminated with a broad slit beam.","u":"pages/Anterior-stromal-haze-HZV/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Varicella-zoster virus (VZV) epithelial keratitis, pseudodendrites","im":[["E:pages/VZV-keratitis/VZV-keratitis-LRG.jpg",""]],"h":"Varicella-zoster virus (VZV) is a Herpes virus responsible for chicken pox and shingles. With corneal epithelial involvement, the virus can cause punctate or dendritic epithelial keratitis. The pseudodendrites caused by VZV can be differentiated clinically from \"true\" dendrites caused by Herpes simplex virus (HSV). In contrast to HSV dendrites, VZV pseudodendrites","u":"pages/VZV-keratitis/index.htm","cr":"Jeff Welder, MD;Jesse Vislisel, MD","src":"er"},{"t":"Varicella-zoster virus (VZV) disciform keratitis","im":[["E:pages/VZV-disciform-keratitis/VZV-disciform-LRG.jpg",""],["E:pages/VZV-disciform-keratitis/VZV-disciform-slit-LRG.jpg",""]],"h":"Varicella-zoster virus (VZV) is the herpesvirus responsible for chicken pox and shingles. Disciform keratitis presents as a round or ovoid region of stromal and epithelial corneal edema, often with associated keratic precipitates underlying the involved area. It is primarily caused by a herpetic endotheliitis and cases of disciform keratitis caused by he","u":"pages/VZV-disciform-keratitis/index.htm","cr":"Jesse Vislisel, MD, Jordan Graff, MD, Meagan Seay, DO","src":"er"},{"t":"Herpes Zoster Ophthalmicus","im":[["E:photos-earlier/V1.jpg",""],["E:photos/forehead.jpg",""],["E:photos-earlier/V21.jpg",""]],"h":"Vesicular rash on an erythematous base. Notice that this rash is in the V1 distribution on the left side of the face (top 2 photos) and V2 distribution on the right side of the face (bottom 2 photos). Also note how the rash is divided down face midline.","u":"pages/Herpes-Zoster.html","cr":"Jordan Graff, MD","src":"er"},{"t":"Interstitial Keratitis Secondary to Syphillis","im":[["E:pages/Interstitial-Keratitis-Second-2-Syphillis/IK-LRG.jpg",""],["E:pages/Interstitial-Keratitis-Second-2-Syphillis/IK-2-LRG.jpg",""],["E:pages/Interstitial-Keratitis-Second-2-Syphillis/IK-3-LRG.jpg",""]],"h":"This is a 73-year-old male who presented initially for trabeculectomy surgery. Upon examination, the patient was found to have a corneal stromal scar with prominent ghost vessels. The patient was sent for blood work which returned positive for syphillis serologies. He was referred to infectious diseases and treated. He was having no acute symptoms further sugg","u":"pages/Interstitial-Keratitis-Second-2-Syphillis/index.htm","cr":"Lucas Lenci, MD; Prashant Parekh, MD","src":"er"},{"t":"Cogan's syndrome","im":[["E:pages/Cogan/Cogan-OD-LRG.jpg",""],["E:pages/Cogan/Cogan-OS-LRG.jpg",""]],"h":"","u":"pages/Cogan/index.htm","cr":"Christopher Kirkpatrick, MD","src":"er"},{"t":"Peripheral ulcerative keratitis (PUK)","im":[["E:pages/PUK/PUK-external-LRG.jpg",""],["E:pages/PU ract/posterior-polar-3-LRG.jpg",""],["E:pages/posterior-polar-cataract/posterior-polar-RR-LRG.jpg",""]],"h":"","u":"pages/posterior-polar-cataract/index.htm","cr":"Lindsay McConnell, MD","src":"er"},{"t":"Bilateral posterior polar cataracts","im":[["E:photos/posterior-polar-cataracts-bilateral/L/posterior-polar-cataracts-bilateral-1-LRG.jpg",""],["E:photos/posterior-polar-cataracts-bilateral/L/posterior-polar-cataracts-bilateral-2-LRG.jpg",""],["E:photos/posterior-polar-cataracts-bilateral/L/posterior-polar-cataracts-bilateral-4-LRG.jpg",""]],"h":"Posterior polar cataracts are lens opacities that involve the posterior subcapsular cortex and posterior capsule. They are important to recognize prior to cataract surgery because the posterior capsule may be weak or absent in that area, leading to an increased risk of surgical complications. To minimize this risk, surgeons should avoid hydrodissection or other maneuvers that place excessive pressure on the posterior","u":"pages/posterior-polar-cataracts-bilateral.htm","cr":"Justin Risma, MD","src":"er"},{"t":"Posterior Polar Cataract with Traumatic Posterior Capsule Rupture","im":[["E:pages/imgs/R_52yD6GTszTfvlEG_PC_Rupture_External.png","Diffuse illumination slit lamp photograph of a posterior polar cataract with posterior capsular rupture."],["E:pages/imgs/R_52yD6GTszTfvlEG_PC_Rupture_Retroillumination.png","Slit lamp photograph showing retro-illumination of a posterior polar cataract with posterior capsular rupture."]],"h":"A 16-year-old male with a known history of bilateral posterior polar cataracts and baseline visual acuity of 20/20-1 without correction in each eye sustained a traumatic impact to the right eye from a thrown water bottle. On initial evaluation after trauma, his visual acuity was decreased to 20/200 without correction (20","u":"pages/Posterior_Polar_Cataract_with_Traumatic_Posterior_Capsule_Rupture.html","cr":"Nicolas J Heckenlaible MD; Patrick J Donegan MD; Lindsay M De Andrade MD","src":"er"},{"t":"Posterior subcapsular cataract","im":[["E:photos-earlier/PSC_01242005.jpg",""],["E:photos-earlier/PSC_01242005zoom2.jpg",""]],"h":"The cataract changes are confined primarily to the posterior capsule. Only minimal changes exist in the anterior, inferior capsule. Note the absence of nuclear changes. This patient is a diabetic male whose vision decreased dramatically over the course of about a month. Glare was a significant complaint.","u":"pages/Posterior-subcapsular-cataract-2.html","cr":"Jordan Graff, MD","src":"er"},{"t":"Posterior subcapsular cataract--retroillumination","im":[["E:photos/cataract/Cataract21.jpg","Posterior subcapsular plaque - red reflex"]],"h":"Posterior subcapsular plaque - red reflex","u":"pages/Posterior-subcapsular-cataract-retroillumination.html","cr":"Jordan Graff, MD","src":"er"},{"t":"Posterior subcapsular cataract","im":[["E:photos-earlier/PSC-cataract.jpg","Thin fibrotic membrane on the posterior lens capsule. Seen commonly in diabetic patients and after pars plana vitrectomy."],["E:photos/posterior_subcapsular_catartact/Fig1a-posterior-subcapsular-cataract.jpg",""],["E:photos/posterior_subcapsular_catartact/Fig1b-posterior-subcapsular-cataract.jpg",""]],"h":"Nicole Radunzel A 53-year-old female with a past medical history of Type 1 diabetes mellitus presented for blurry vision in her left eye. On exam, she was noted to have granular lenticular opacities adjacent to the posterior capsule of the natural crystalline lens in the right eye. A","u":"pages/posterior-subcapsular-cataract.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Nuclear sclerotic cataract","im":[["E:pages/Nuclear-sclerotic-cataract/NSC-LRG.jpg",""],["E:pages/Nuclear-sclerotic-cataract/NSC-slit-LRG.jpg",""]],"h":"","u":"pages/Nuclear-sclerotic-cataract/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Brunescent cataract, mature","im":[["E:photos/cataract/brunescent-cataract.jpg",""]],"h":"Updated: March 24, 2017 A brunescent, or brown, cataract is often correlated with the maturity of a cataract and can cause decreased visual acuity. Brunescent cataracts can cause poor contrast and color discrimination, especially at the blue end of the visible light spectrum. Brunescent cataracts may also have surgical","u":"pages/brunescent-cataract-mature.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Brunescent cataract","im":[["E:photos/cataract/brunescent-cataract-(1).jpg",""],["E:photos/cataract/brunescent-cataract-(2).jpg",""],["E:pages/imgs/R_5TVzZ5QGZsIAPuh_brunescent%20cataract%201.png",""]],"h":"","u":"pages/Brunescent-cataract.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Mature Cataract","im":[["E:photos/cataract/advanced-cataract.jpg","Mature Cataract removed via ECCE."],["E:photos-earlier/mature-cataract.jpg","Patient with light perception vision from dense cataract."],["E:photos-earlier/NLPCataractOS.jpg","This patient with mature cataract (nuclear sclerotic and cortical changes) had only bare light perception vision."]],"h":"Contributor: Elizabeth Gauger, MD","u":"pages/Mature-Cataract.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Mature cortical cataract","im":[["E:LARGE/mature-cortical-LRG.jpg",""],["E:photos/mature-cortical-2.jpg",""]],"h":"","u":"pages/mature-cortical-cataract.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Morgagnian cataract","im":[["E:pages/Morgagnian/Morgagnian-LRG.jpg",""],["E:pages/Morgagnian/Morgagnian-2-LRG.jpg",""]],"h":"","u":"pages/Morgagnian/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Morgagnian Cataract","im":[["E:photos/cataract/Morgagnian-Cataract-1.JPG",""],["E:photos/cataract/Morgagnian-Cataract-2.JPG",""]],"h":"59-year-old female with decreased vision secondary to Morgagnian cataract. See Related EyeRounds case: Maltry AC, Kitzmann AS. Morgagnian cataract. EyeRounds.org. January 13, 2012; Available from https://eyerounds.org/cases/146-Morgagnian-Cataract.htm. A Morgagnian cataract is one that has crossed the state of maturity and has become \"hypermature\".","u":"pages/morgagnian-cataract-146.html","cr":"Amanda Maltry, MD","src":"er"},{"t":"Morgagnian cataract with absent cortex","im":[["W:LARGE/morgagnian-2013-1-L.jpg",""],["W:LARGE/morgagnian-2013-2-L.jpg",""]],"h":"A Morgagnian cataract is a hypermature cataract in which there is typically liquefaction of the lens cortex with dense sclerosis of the nucleus. This presentation is typical for the brunescent lens nucleus that is inferiorly displaced within the capsule, but atypical in that there is no lens cortex remaining, the previously liquified cortex has migrated through the intact capsule, leaving only a su","u":"pages/morgagnian-cataract-absent-cortex.htm","cr":"Christopher A. Kirkpatrick, MD and Anna Kitzmann, MD","src":"er"},{"t":"Oil droplet cataract","im":[["E:photos-earlier/oil-droplet-cataract.jpg","45-year-old with slow, progressive loss of vision in both eyes (20/200). Pinholes to 20/25 but cannot be refracted. Retinoscopy shows oil dr"],["E:pages/imgs/OilDroplet_Diffuse_Illumination_PHS.jpg","Diffuse illumination slit lamp photograph of an oil-droplet cataract showing central nuclear yellow opacity of the lens with dark clearing s"],["E:pages/imgs/OilDroplet_Optical_Cross_Section_PHS.jpg","Optical section slit lamp photograph of the right eye showing a 3+ oil-droplet cataract with the central yellow opacified nucleus surrounded"]],"h":"The patient was a 57-year-old man with vision loss in the right eye (OD) greater than left eye (OS) in the setting of a craniopharyngioma, which was resected 16 years prior. His visual acuity had been no light perception OD and 20/20 OS since the procedure. Oil droplet cataract Oil droplet cataract Category(ies): Cataract, Lens Contributors: Peter H. Sanchez, MD, and Ryan J. Diel, MD Photographer: Alex Steggall 3","u":"pages/oil-droplet-cataract.html","cr":"Andrew Doan, MD, PhD The patient was a 57-year-old man with vision loss in the right eye (OD","src":"er"},{"t":"\"Y-suture\" Cataract","im":[["E:photos/Y-suture-cataract.jpg",""]],"h":"This is a 46-year-old male with a promient Y-suture cataract. This is a congenital lens opacity that occurs at the location of closure of the fetal lenticular nucleus. The anterior sutures are in the shape of a Y and the posterior sutures are an inverted Y. These are rarely visually signficant.","u":"pages/y-suture-cataract.htm","cr":"Matt Ward, MD","src":"er"},{"t":"Cataract with refractile bodies","im":[["E:photos-earlier/refractile-cataract.jpg","Cataract with refractile bodies (Andrew Doan, MD, PhD)"],["E:photos-earlier/Lens_RefractileBodies1.jpg","Cataract with refractile bodies (ordan M. Graff, M.D)"],["E:photos-earlier/Lens_RefractileBodies2.jpg","Cataract with refractile bodies (ordan M. Graff, M.D)"]],"h":"Cataract with refractile bodies (Andrew Doan, MD, PhD)","u":"pages/cataract-with-refractile-bodies.html","cr":"Andrew Doan, MD, PhD and Jordan Graff, MD","src":"er"},{"t":"Chlorpromazine-induced cataract","im":[["E:pages/chlorpromazine-cataract/chlorpromazine-cataract-LG.JPG",""],["E:pages/chlorpromazine-cataract/chlorpromazine-cataract2-LG.JPG",""]],"h":"","u":"pages/chlorpromazine-cataract/index.htm","cr":"Jaclyn Haugsdal, MD","src":"er"},{"t":"Traumatic rosette cataract","im":[["E:photos-earlier/rosettecataractredglow13.jpg",""]],"h":"Dr. Swaranjit Singh Bhatti, Bhatti Eye Clinic This is a traumatic rosette cataract seen in fundal retroillumination (against the fundal red glow) on the slit lamp.The leaf like \"rosette\" pattern is pathognomonic of a traumatic cataract and the clear zone outside the affect lens lamellae indicate that the trauma occurred several years before as clear lens fibres have been laid down in the periphery subseq","u":"pages/traumatic-rosette-cataract.html","cr":"Dr. Swaranjit Singh Bhatti, Bhatti Eye Clinic This is a trau","src":"er"},{"t":"Unique Electric Cataract","im":[["E:pages/imgs/R_6DZgDi4gTSONRVL_2days_electric_cataract.jpg","Slit lamp photo at two days post injury."],["E:pages/imgs/R_6DZgDi4gTSONRVL_6mon_electric_cataract.jpg","Slit lamp photo at six months post injury."]],"h":"Slit lamp photos of a 32-year-old male with cataracts sustained after 270-volt electrocution injury. The cataracts appeared as a ring within the lens nucleus in a circumferential pattern following the natural lens architecture. Patient had no subjective visual symptoms. Appearance of the cataracts was stable at 2 days and 6 months post injury. The pa","u":"pages/electric-cataract.htm","cr":"Thomas D. Meram, MD; Ryan J. Diel, MD","src":"er"},{"t":"Lens Fluting","im":[["E:pages/Lens-Fluting/lens-fluting-LRG.jpg",""]],"h":"A true excessively flat soft contact lens (or soft contact lens skirt as is the case in this hybrid lens) may have too much material to rest all of its surface touching the conjunctiva. The extra or excess material can \"flute\" up causing a wrinkle at the edge of the lens and/or a bubble. Such a lens is generally uncomfortable because it moves excessively with the blink and bec","u":"pages/Lens-Fluting/index.htm","cr":"Tressa Larson OD","src":"er"},{"t":"Ectopia lentis in Marfan's syndrome","im":[["E:photos/ectopia-lentis-marfan-syn.JPG","This patient had mature cataractous lenses in both eyes that had dislocated completely and were freely floating in the vitreous. Of interest"]],"h":"This patient had mature cataractous lenses in both eyes that had dislocated completely and were freely floating in the vitreous. Of interest, he experienced severe vision loss when lying down as the lenses settled over his macula. Due to significant axial myopia, he only required +4.00 D of lens correction in each eye to achieve 20/20 acuity. Now that's a body that knows how to take care of itself!","u":"pages/ectopia-lentis-marfan-syn.html","cr":"Matt Ward, MD","src":"er"},{"t":"Marfan's Syndrome","im":[["E:photos-earlier/Marfan_022005sublux1.jpg","Lens subluxation is readily evident in this dilated view of a patient with Marfan's syndrome."],["E:photos-earlier/Marfan_022005Lens1.jpg","This close view of the subluxed lens allows visualization of the zonules."],["E:photos-earlier/Marfan_022005LensesOU.jpg","Both lenses are seen here, side by side. Supero-temporal dislocation of the lens is evident in both eyes."]],"h":"Lens subluxation is readily evident in this dilated view of a patient with Marfan's syndrome.","u":"pages/Marfans-Syndrome.html","cr":"Jordan Graff, MD","src":"er"},{"t":"Crystalline Lens Subluxation With Absence of Zonules","im":[["E:pages/imgs/subluxation_1.webp","Superonasal crystalline lens subluxation with absent zonules"],["E:pages/imgs/subluxation_2.webp","Superonasal subluxation of crystalline lens with absent zonules and posterior subcapsular cataract"]],"h":"Al Salama, Najlaa A 34-year-old highly myopic (-9.50 D OD) patient presented with presumed traumatic subluxation of the phakic lens in the right eye. The patient denied prior ocular trauma; however, clinical findings raised a strong suspicion for occult remote trauma. Slit lamp examination demonstrated superonasal lens subluxation with at least 180 degrees of absent zonular support. The lens contour was not truncated","u":"pages/Crystalline-Lens-Subluxation-Absence-Zonules.htm","cr":"Caitlin M. Hackl MD, Patrick J. Donegan MD, Ryan J. Diel MD","src":"er"}]},{"n":"Trauma & foreign bodies","b":"Chemical and thermal burns, foreign bodies and penetrating injury.","items":[{"t":"Alkali chemical burn","im":[["E:pages/Alkali-chemical-burn/alkali-1-LRG.jpg",""],["E:pages/Alkali-chemical-burn/alkali-2-LRG.jpg",""]],"h":"","u":"pages/Alkali-chemical-burn/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Chemical burn","im":[["E:photos/alkali-burn.jpg",""]],"h":"","u":"pages/chemical-burn.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Thermal corneal burn","im":[["E:photos/cornea-misc/Corneal-burn-1.jpg",""],["E:photos/cornea-misc/Corneal-burn-2.jpg",""],["E:photos/cornea-misc/Corneal-burn-3.jpg",""]],"h":"","u":"pages/corneal-burn-thermal.htm","cr":"Justin Risma, MD","src":"er"},{"t":"Metallic corneal foreign body","im":[["E:pages/metallic-FB-cornea/metallic-FB-LRG.jpg","This photograph shows a metallic foreign body lodged within corneal stroma."],["E:pages/metallic-FB-cornea/metallic-FB-slit-LRG.jpg","The depth of penetration is visible in the slit beam."]],"h":"This photograph shows a metallic foreign body lodged within corneal stroma.","u":"pages/metallic-FB-cornea/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Corneal foreign body","im":[["E:photos/fb.jpg",""]],"h":"","u":"pages/corneal-foreign-body.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Foreign body","im":[["E:photos/farmer/FarmerConjFB2.jpg","This farmer had been bothered by red eye, foreign body sensation, tearing, and irritation for several days."],["E:photos/farmer/FarmerConjFB.jpg","The localized conjunctival and epithelial defect suggested a focal irritant."],["E:photos/farmer/FarmerConjFB3.jpg","The tiny shred of a thistle is evident on the tarsal surface of the upper lid."]],"h":"This farmer had been bothered by red eye, foreign body sensation, tearing, and irritation for several days.","u":"pages/foreign-body.html","cr":"Jordan Graff, MD","src":"er"},{"t":"Ferrous foreign body: Rust ring","im":[["E:photos/FerrousFB_RustRing1.jpg",""],["E:photos/FerrousFB_RustRing2.jpg",""]],"h":"","u":"pages/Ferrous-foreign-body-Rust-ring.html","cr":"Jordan M. Graff, MD","src":"er"},{"t":"Subconjunctival metallic foreign body","im":[["E:pages/Foreign-Body-Subconj/Metallic-subconj-FB2-LRG.jpg","This patient presented with a subconjunctival metallic foreign body after working on metal without safety glasses. The foreign body was remo"]],"h":"This patient presented with a subconjunctival metallic foreign body after working on metal without safety glasses. The foreign body was removed at the slit lamp.","u":"pages/Foreign-Body-Subconj/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Subconjunctival foreign bodies","im":[["E:pages/Subconj-FB/subconj-fb-LRG.jpg",""] "er"},{"t":"Adherent leukoma and epithelial inclusion cyst after penetrating trauma","im":[["E:pages/Adherent-Leukoma/adherent-leukoma-iris-cyst-BC-LRG.jpg","A dense corneal opacity with the incorporation of iris tissue"],["E:pages/Adherent-Leukoma/sp-mini-pkp-RV-LRG.jpg","The wound was found to be Seidel positive and a mini-penetrating keratoplasty (mini-PKP), was performed. The iris cyst was later aspirated a"],["E:pages/Adherent-Leukoma/Adherent-leukoma-post-LRG.jpg","The patient has maintained 20/25 acuity postoperatively with minimal regrowth of the cyst."]],"h":"Brice Critser, CRA; Randy Verdick, FOPS","u":"pages/Adherent-Leukoma/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Traumatic aniridia and cataract","im":[["E:photos/Traumatic-aniridia-cataract/traumatic-aniridia-cataract-LRG.jpg",""],["E:photos/Traumatic-aniridia-cataract/traumatic-aniridia-cataract-2-LRG.jpg",""]],"h":"","u":"pages/traumatic-aniridia-cataract.htm","cr":"Elizabeth Gauger, MD","src":"er"},{"t":"Traumatic cataract with iridodialysis and lens coloboma","im":[["E:LARGE/traumatic-cataract-LRG.jpg",""]],"h":"","u":"pages/traumatic-cataract-iridodialysis.htm","cr":"Christopher A Kirkpatrick, MD","src":"er"},{"t":"Iridodialysis and traumatic cataract after firecracker injury","im":[["E:photos/Iridodialysis-traumatic-cataract-firecracker.PNG",""]],"h":"Iridodialysis is the result of a tear in the iris root. It may be repaired surgically or with cosmetic contact lenses if large or symptomatic. This cataract's rosette pattern is classically seen after contusion injuries. It is due to separation of lens fibers around lens sutures.","u":"pages/Iridodialysis-traumatic-cataract-firecracker.htm","cr":"Jesse Vislisel, MD","src":"er"}]},{"n":"After surgery","b":"Grafts, refractive surgery, keratoprostheses, IOLs and post-operative findings.","items":[{"t":"Penetrating keratoplasty (PK)","im":[["E:pages/PK/2A-LRG-POM3-sp-PKP-for-KCN.jpg","Interrupted sutures"],["E:pages/PK/2B-LRG-POM12-sp-PKP-for-ulcer-scar.jpg","Interrupted sutures"],["E:pages/PK/2C-LRG-PKP-running.jpg","Running Sutures"]],"h":"Interrupted sutures","u":"pages/PK/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Donor cornea prepared for penetrating keratoplasty (PK) transplantation","im":[["E:pages/Donor-cornea-for-PK/Donor-cornea-LRG.jpg","donor cornea has been prepared for penetrating keratoplasty (PK)"]],"h":"donor cornea has been prepared for penetrating keratoplasty (PK)","u":"pages/Donor-cornea-for-PK/index.htm","cr":"Chase Liaboe, Jesse Vislisel, MD","src":"er"},{"t":"Kaye dots in a penetrating keratoplasty graft","im":[["E:pages/Kaye-dots/kaye-dots-LRG.jpg",""]],"h":"","u":"pages/Kaye-dots/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Khodadoust Line (Corneal Endothelial Rejection)","im":[["W:photos/Khodadoust-line/Khouda1-LRG.jpg",""],["W:photos/Khodadoust-line/Khouda2-LRG.jpg",""],["E:pages/Khodadoust2/Khadadoust-line-scatter-LRG.jpg",""]],"h":"Jody Troyer This is another example of a Khoudadoust line (endothelial rejection) in a patient with a long-standing penetrating keratoplasty. A slitlamp photograph using sclerotic scatter technique demonstrates inferior to superior progression of endothelial rejection with keratitic precipitates at the leading edge. The overlying stroma is hazy and edematous with evident Descemet's fold","u":"pages/Khodadoust2/index.htm","cr":"Lorraine Provencher, MD; Tara McGehee, MD","src":"er"},{"t":"Khodadoust Line (Corneal Endothelial Rejection)","im":[["E:photos/Khodadoust-line/Khodadoust-slit-LARGE.JPG",""],["E:photos/Khodadoust-line/Khodadoust-ext-LRG.JPG",""],["E:photos/Khodadoust-line/Khodadoust-closer-LRG.JPG",""]],"h":"","u":"pages/khodadoust-line.htm","cr":"Elizabeth Gauger, MD","src":"er"},{"t":"Descemet Membrane Endothelial Keratoplasty (DMEK)","im":[["E:pages/DMEK/8A-LRG-sp-DMEK-for-Fuchs.jpg","post-operative appearance of patientd who underwent DMEK for Fuchs endothelial corneal dystrophy at 1 week post-operatively with"],["
