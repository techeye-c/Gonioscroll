ation clearly outlines the PCO. Vision dropped below 20/40 from 20/20 after cataract surgery. A surgical laser was used to cut the membrane and the patient was 20/20 again."],["E:pages/imgs/PCO_Eyerounds_1.jpg","Slit lamp photo of left eye demonstrating superior posterior capsular opacification of the intraocular lens implant with broad-beam illumination."]],"h":"Allie Copple 71 y/o female with pseudophakia OU, dry eye syndrome OU, and history of posterior capsular opacification OD s/p Neodymium: yttrium aluminum garnet (Nd:YAG) laser capsulotomy. She presents for her annual exam with complaints of hazy vision OS. Exam notable for visual acuity 20/20 OD and 20/30 OS with pinhole improvement to 20/20 OS. Slit lamp exam was notable for PCO OS superiorly around the lens-haptic junction extending inferiorly towards the visual axis.","u":"pages/posterior-capsular-opacity-PCO-following-cataract-surgery.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Anterior capsular phimosis","im":[["E:pages/Capsular-Phimosis/phimosis-LRG.jpg","Non-visually-significant anterior capsular phimosis after cataract surgery.Photographer: Stefani Karakas, CRA"],["E:pages/Capsular-Phimosis/phimosis-preop-BC.jpg","Visually-significant anterior capsular phimosis in a patient who previously underwent penetrating keratoplasty for type II granular (Avellino) corneal dystrophyPhotographer: D. Brice Critser, CRA"],["E:pages/Capsular-Phimosis/phimosis-immediate-postop-LRG.jpg","Postoperative appearance of the patient in Figure 2 immediately YAG laser anterior capsulotomy. Visual acuity improved from 20/40 to 20/25 after the procedure.Photographer: Antoinette Venckus, CRA"]],"h":"Anterior capsular phimosis is the centripetal fibrosis and contraction of the capsulorhexis after cataract extraction. Individuals with zonular laxity are at increased risk for this condition. Mild to moderate amounts of phimosis are usually not visually significant, but severe cases may require treatment by Nd:YAG laser anterior capsulotomy. Anterior capsular phimosis Anterior capsular phimosis Category(ies): Cataract, Lens Contributor: Alina Husain, MD and Thomas A. Oetting MD Photographer: Najla Al Salama, CRA Anterior capsular phimosis Anterior capsular phimosis Category(ies): Cataract, Lens Contributor: Reiker G. Ricks, MD, Tina Hendricks, MD Photographer: Alexandria Copple Patient with visually significant anterior capsule contraction syndrome in the right eye following cataract surgery. A YAG capsulotomy was attempted but did not achieve an adequate opening of the anterior capsule. Therefore, anterior segment revision surgery was planned to address the visually significant anterior capsular opacification (ACO).","u":"pages/Capsular-Phimosis/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Capsular folds secondary to posterior capsule opacification","im":[["E:photos/PCO-capsular-folds.jpg","Revised June 6, 2016, with thanks to Dr. Luis Alberto Real, Cirujano Oftalmólogo, Especializado en la Clínica Barraquer, Sub-especializado en el IOBA, Valladolid, España"]],"h":"This patient has an iris-sutured posterior-chamber intraocular lens, placed secondary to zonular weakness. This image, taken one month after the procedure, shows prominent capsular phimosis with radial folds and central 2-3+ capsular opacification. This was treated using a Nd:YAG laser posterior capsulotomy.","u":"pages/capsular-folds.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Late Capsular Block with Posterior Capsular Fibrosis","im":[["E:pages/imgs/R_3SwQ5vonCQtBgmo_capsule%20block.png",""]],"h":"A 44-year-old pseudophakic female presented with progressive worsening vision after uncomplicated cataract surgery 8 years prior. The patient has a history of proliferative diabetic retinopathy with prior vitrectomy and developed cataracts early. On exam, there were thick posterior capsular opacities with a capsular block appearance and fluid noted beyond the intraocular lens.","u":"pages/Late_Capsular_Block_with_Posterior_Capsular_Fibrosis.html","cr":"Mahsaw Mansoor, MD","src":"er"},{"t":"Layered intracapsular hemorrhage following phacoemulsification GATT","im":[["E:pages/imgs/R_1TFPVtU3gW1demt_Retroillumination_calcium_deposits.png","Retroillumation of calcium deposits on a 3-piece silicone intraocular lens."],["E:pages/imgs/R_1TFPVtU3gW1demt_Calcium_deposits.png","Broad beam illumination of calcium deposits on the posterior surface of a 3-piece silicone intraocular lens."]],"h":"A 74-year-old female with history of proliferative diabetic retinopathy in both eyes (OU), lamellar hole in the left eye (OS), POAG status post Ahmed tube in the right eye (OD), full thickness macular hole OD status post vitrectomy, and cataract extraction with implantation of AMO 9002, 3-piece silicone intraocular lenses OU 15 years ago was referred for a several month history of blurry and decreased vision OS. She had already undergone YAG-laser capsulotomy OS by an outside provider without improvement in her visual acuity. On presentation, her vision was 20/200 OS. Her exam was notable for granular, white deposits on the posterior surface of the lens OS. She had already undergone explantation of the OD silicone lens for a similar process. She was consented for intraocular lens exchange OS with a MA50BM lens. Calcium deposits of silicone intraocular lenses have been described in case reports. In this case, the patient did have trace asteroid hyalosis OU, which is often present in patients who develop silicone intraocular lens calcification.","u":"pages/Calcific_Deposits_on_an_Intraocular_Lens.html#gsc.tab=0","cr":"Peter H. Sanchez MD; Bilal Ahmed MD; Thomas Oetting MD","src":"er"},{"t":"Lens material in the anterior chamber causing chronic uveitis","im":[["E:pages/lens-material-in-AC/Displaced-lens-material-LRG.jpg",""],["E:pages/lens-material-in-AC/Displaced-lens-material-slit-LRG.jpg",""],["E:pages/lens-material-in-AC/Displaced-lens-material-slit-2-LRG.jpg",""]],"h":"Lens material can cause intraocular inflammation when not isolated by the lens capsule. This patient was referred with chronic, refractory uveitis of unknown etiology, but on exam he was found to have a large piece of displaced lens material in the anterior chamber. In the photographs, a large piece of cataractous lens nuclear material is present inferiorly. The anterior chamber uveitis is not easily visible, but the corneal edema and Descemet's folds can be visualized using the slit beam.","u":"pages/lens-material-in-AC/index.htm","cr":"Jesse Vislisel, MD; Anna Kitzmann, MD","src":"er"},{"t":"Retained Lens Fragment","im":[["E:pages/imgs/R_16hBs75OJXMshhv_Slide1.jpg",""],["E:pages/imgs/R_16hBs75OJXMshhv_Slide2.jpg",""]],"h":"A 72-year-old man presented one week after uncomplicated cataract surgery for progressive photophobia and blurry vision in the surgical eye. On exam, there was a retained lens fragment in the anterior chamber. Small pieces of nuclear or cortical lens material can sometimes be hidden in the ciliary sulcus at the end of cataract surgery. Patients present with an inflammatory picture. Often times cortical material can be observed and treated medically with anti-inflammatory topical treatment. Nuclear material, as in this case, however, often requires surgical intervention with removal of the lenticular remnant.","u":"pages/Retained_Lens_Fragment_.html","cr":"Mahsaw Mansoor, MD","src":"er"},{"t":"Ointment in anterior chamber after cataract surgery","im":[["E:pages/Ointment-in-AC/ointment-1-LRG.JPG",""],["E:pages/Ointment-in-AC/ointment-2-LRG.JPG",""]],"h":"A patient presented one month following uncomplicated cataract surgery due to the presence of a buoyant tan substance in the anterior chamber which was present since postoperative day one. This was felt to represent Maxitrol® ointment wicked through a short wound into the eye. Remarkably, there was no anterior chamber inflammation. The patient was taken to the operating room and the prior clear corneal incision was used to burp the ointment from the eye followed by irrigation of the anterior chamber.","u":"pages/Ointment-in-AC/index.htm","cr":"Jeffrey Welder, MD","src":"er"},{"t":"Anterior chamber perfluoro-N-octane (PFO) bubbles","im":[["E:pages/PFO-bubbles-2/AC-PFO-2-LRG.jpg",""]],"h":"Perfluoro-n-octane (PFO) is a dense liquid (specific gravity of 1.76) that is used for the intraoperative management of retinal detachments. Due to its density, low viscosity, and immiscibility in water, the PFO is able to displace sub-retinal fluid and blood anteriorly, allowing for retinal unfolding and stabilization during repair. PFO has been observed to be safe and effective in the management of retinal detachments. Possible complications include increased intraocular pressure, hypotony, decreased visual acuity, retained PFO, need for re-operation, and cataract formation. However, complication rates after the use of PFO were shown to be comparable to other intraoperative retinal attachment management options. PFO may decrease the need for a posterior retinotomy; post-operative surgical complications such as bleeding and membrane formation may also decrease due to PFO management. Reference: Scott IU, Flynn HW, Murray TG, Feuer WJ, and Perfluoron Study Group. 2003. Outcomes of surgery for retinal detachment associated with proliferative vitreoretinopathy using perfluoro-n-octane: a multicenter study. American Journal of Ophthalmology. 136(3):454-463. Scott IU, Murray TG, Flynn Jr. HW, Feuer WJ, Schiffman JC, and Perfluoron Study Group. 2002. Outcomes and complications associated with giant retinal tear management using perfluoro-n-octane. American Journal of Ophthalmology. 109:10:1828-1833.","u":"pages/PFO-bubbles-2/index.htm","cr":"Jeffrey D. Welder, MD","src":"er"},{"t":"Retained perfluorocarbon liquid in the anterior chamber","im":[["E:photos/PFO-in-AC/PFO-2-LRG.jpg",""]],"h":"Perfluorocarbon liquids (PFCLs) are utilized intraoperatively in retinal detachment surgery. They have a high specific gravity and thus can be used to displace subretinal fluid and manipulate giant retinal tears. Incomplete removal can lead to retained PFCL in the subretinal space, vitreous cavity, or anterior chamber. Retained PFCL in the anterior chamber has been reported to cause inflammation, secondary glaucoma, and corneal toxicity. This 17-year-old male sustained an open globe injury at age 11, and subsequently underwent open globe repair, phacoemulsifcation with intraocular lens placement, and pars plana vitrectomy for tractional retinal detachment. Postoperatively, he was noted to have a large amount of PFCL in the anterior chamber. He reported intermittent visual blurring and he had mildly elevated intraocular pressure, but his cornea remained clear and he had no evidence of persistent intraocular inflammation. He was treated with topical aqueous suppressants and opted to forgo removal of the retained PFCL.","u":"pages/PFO-in-AC.htm","cr":"Justin Risma, MD","src":"er"},{"t":"Subconjunctival silicone oil","im":[["E:pages/subconj-silicone-oil/subconj-silicone-oil--LRG.jpg","External slit lamp photograph"],["E:pages/subconj-silicone-oil/subconj-silicone-oil-1-LRG.jpg","anterior segment OC"]],"h":"89-year-old female status post retinal detachment repair and later removal of silicone oil, now with subconjunctival silicone oil after the procedure (external slit lamp photograph and anterior segment OCT).","u":"pages/subconj-silicone-oil/index.htm","cr":"Jesse Meredith Baker, MD","src":"er"},{"t":"Hyperoleon","im":[["E:pages/imgs/hyperoleon2.jpg","Slit lamp photograph of the left eye showing hyperoleon."],["E:pages/imgs/hyperoleon1.jpg","Slit lamp photograph of the left eye showing hyperoleon and brunescent cataract with narrow white light beam illumination."]],"h":"Alex Steggall Oct 16, 2025 A 60-year-old man presented with 6 months of worsening vision in the left eye, described as “looking through milk.” He had a history of macula-involving rhegmatogenous retinal detachment associated with a giant retinal tear repaired by pars plana vitrectomy and scleral buckle with 1,000 centistoke silicone oil tamponade before being lost to follow up for 1.5 years due to poor access to care. On exam, visual acuity was 20/800 and the intraocular pressure was elevated at 30 mm Hg. Slit lamp exam revealed a hyperoleon and a brunescent cataract. Hyperoleon refers to emulsified silicone oil that has migrated to the anterior chamber. Due to the low density of oil relative to water, the emulsified bubbles float superiorly and give the appearance of an inverted hypopyon. The patient was started on topical intraocular pressure lowering therapy and coordinated for silicone oil removal with anterior chamber washout.","u":"pages/hyperoleon.htm","cr":"Ella Gehrke, MD","src":"er"},{"t":"Vitreous strand to paracentesis causing subtle peaked pupil early in case","im":[["E:pages/imgs/early_vitreous_loss.png","Vitreous prolapse that extends to a paracentesis such as in this case can cause peaking of the pupil. In this case the vitreous presented early in the case making the surgery very difficult. The caractous lens was removed by converting to an ECCE supplemented with an anterior vittectomy."]],"h":"Here is an example of a subtle peaked pupil early during cataract surgery. The patient has an essentially invisible strand ov vitreous that is going to the paracentesis from a peripheral point which is causing peaking of the pupil.","u":"pages/vitreous_strand_to_paracentesis_causing_subtle_peaked_pupil_early_in_case.html#gsc.tab=0","cr":"Thomas A. Oetting, MS, MD","src":"er"},{"t":"Iris incarceration in an old extracapsular wound","im":[["E:pages/Iris-incarceration/iris-incarceration-LRG.jpg",""]],"h":"This 73-year-old male had a complicated extracapsular cataract extraction 40 years ago for bilateral cataracts and was left aphakic. There is uveal tissue incarcerated in the old superior wound. This makes secondary intraocular lens placement difficult and potentially high risk.","u":"pages/Iris-incarceration/index.htm","cr":"Angela McAllister, MD","src":"er"},{"t":"Iridencleisis","im":[["E:pages/iridencleisis/iridencleisis-1-LRG.jpg",""],["E:pages/iridencleisis/iridencleisis-5-LRG.jpg",""],["E:pages/iridencleisis/iridencleisis-13-LRG.jpg",""]],"h":"Iridencleisis is a historic glaucoma filtering surgery that is no longer used. It is a free-filtering procedure that creates a full-thickness fistula between the anterior chamber and the subconjunctival space through an anterior sclerostomy. This procedure is unique in that it involves entrapping a pillar of iris tissue into the sclerostomy to act as a wick to hold the sclerostomy open. This procedure was abandoned in part due to the theoretical risk of sympathetic ophthalmia development in an eye with incarcerated uveal tissue. In this patient note the superior sector iridectomy (unfortunately already dilated) and pigment visible in the superior bleb. Gonioscopy shows iris tissue incarcerated in the sclerostomy with visible ciliary processes posterior to this.","u":"pages/iridencleisis/index.htm","cr":"Christopher A. Kirkpatrick, MD","src":"er"},{"t":"Suture iris reconstruction using McCannel suture technique","im":[["E:pages/McCannel/Iris-reconstruction-7mm-preop-LRG.jpg",""],["E:pages/McCannel/Iris-reconstruction-2-LRG.jpg",""]],"h":"This patient had persistent mydriasis and traumatic cataract after blunt ocular trauma. These photographs show his appearance shortly after cataract extraction and suture iris reconstruction using the McCannel suture technique and Siepser slipknots.","u":"pages/McCannel/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"CustomFlex iris prosthesis and penetrating keratoplasty (PKP) for acanthamoeba keratitis","im":[["https://webeye.ophth.uiowa.edu/eyeforum/cases-i/case211/L/8-prosthetic-iris-LRG.jpg",""]],"h":"The CustomFlex prosthesis is an artificial iris made of a foldable silicone elastomer. The device is custom-made to match the contralateral eye in patients with unilateral defects or designed from patient selection in the case of bilateral aniridia. This photo shows the appearance of one of these devices that was implanted in a patient who experienced persistent mydriasis after acanthamoeba keratitis. The patient also has a full-thickness corneal transplant. Read the related case report for more information about aniridia and its management.","u":"pages/CustomFlex-prosthesis/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Ophtec 311 iris reconstruction intraocular lens after iris melanoma resection","im":[["E:pages/ophtec-311-after-iris-melanoma/Ophthec-311-preop-LRG.jpg",""],["E:pages/ophtec-311-after-iris-melanoma/Ophthec-311-LRG.jpg",""]],"h":"The Ophtec 311 intraocular lens implant features a colored body and haptics to simulate the appearance of an iris. These photographs show the pre- and post-operative appearance of a patient with a large iris defect after resection of an iris melanoma who subsequently underwent cataract extraction and implantation of an Ophtec 311 lens.","u":"pages/ophtec-311-after-iris-melanoma/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Post-operative angle closure glaucoma due to intraocular gas expansion","im":[["E:photos/angle-closure-intraoc-gas.jpg",""]],"h":"This 73-year-old woman presented with eye pain and nasuea/vomiting one day after pars plana vitrectomy for a macula-off rhegmatogenous retinal detachment that included gas-fluid exchange with 10% C3F8. Her intraocular pressure was 50 mm Hg. As evidenced in this photograph, she had 360 degrees of iridocorneal touch. The anterior chamber was extremely shallow and only present directly over the lens. There was a small hyphema. The view to the posterior chamber was poor, but it appeared there was a 100% gas bubble. It was felt her angle closure was secondary to posterior pressure from over-expansion of intraocular gas. A component of aqueous misdirection was also considered a possibility, though the patient already had undergone a vitrectomy. Pupillary block was also on the differential, but typically the central anterior chamber is not this flat in pupillary block. Multiple vitreous taps were performed, but these were not adequate to maintain a normal pressure. Eventually, an air-fluid exchange was performed and the size of the gas bubble was decreased to 25%. The anterior chamber was also reformed with balanced salt solution. Her pressure normalized and she eventually did well.","u":"pages/angle-closure-IO-gas-Expand.htm","cr":"Justin Risma, MD","src":"er"},{"t":"Epithelial downgrowth","im":[["E:photos/epithelial-downgrowth-RR.jpg",""]],"h":"Epithelial downgrowth is a rare complication of intraocular surgery or penetrating ocular trauma. Epithelial invasion into the anterior chamber occurs when non-keratinized epithelial cells migrate through a surgical or traumatic corneal wound. Once in the anterior chamber, epithelial cell migration may lead to corneal decompensation, recalcitrant glaucoma, and occasionally invade the posterior pole. Treatments are generally limited and when employed are often ineffective. Epithelial downgrowth Epithelial downgrowth Contributors: Jesse Vislisel, MD Photographer: Stefani Karakas, CRA Epithelial downgrowth is a condition in which corneal or conjunctival epithelial cells are introduced into the eye by penetrating trauma or surgery. An epithelial membrane then grows over the internal structures of the eye and can often be visible as a translucent membrane growing over the corneal endothelium. This patient had an intracapsular cataract extraction performed in the past and a recent secondary anterior chamber intraocular lens placed. She subsequently developed elevated intraocular pressure secondary to epithelial downgrowth, visible here as a faint membrane over her superior cornea. The demarcation of this membrane and the diffuse microcystic edema of the cornea can be more easily seen on the retroillumination photograph.","u":"pages/epithelial-downgrowth.htm","cr":"Ryan J. Diel, MD, Mark A. Greiner, MD, Jennifer J. Ling, MD","src":"er"},{"t":"Exposed Gore-Tex Suture With Inferotemporal Lens Dislocation","im":[["E:pages/imgs/gore_tex_1.webp","Inferotemporal lens dislocation with exposed Gore-Tex suture"],["E:pages/imgs/gore_tex_2.webp","Exposed Gore-Tex suture"],["E:pages/imgs/gore_tex_3.webp","Exposed Gore-Tex suture"]],"h":"A monocular patient presented after an outside provider identified inferotemporal exposure of a Gore-Tex suture in the left eye. Ocular history is significant for pars plana vitrectomy for vitreous hemorrhage in the left eye, prior IOL repositioning with Gore-Tex lasso fixation, and subsequent scleral patch graft. The fellow eye has a history of retinal detachment repair with vitrectomy and scleral buckle, complicated by a dense central disciform scar and vision of CF at 3 feet. On examination, the scleral-fixated intraocular lens is dislocated inferotemporally in the direction of the exposed suture, and the patient reports seeing the lens edge. The sclera underlying the area of suture exposure appears thin, with concern for chronic inflammation.","u":"pages/exposed-gore-tex-suture-inferotemporal-lens-dislocation.html","cr":"Caitlin M. Hackl MD, Patrick J. Donegan MD, Ryan J. Diel MD","src":"er"}]},{"n":"Contact lenses","b":"Lens fit, deposits and complications.","items":[{"t":"Circle Contact Lens","im":[["E:pages/Circle-Contact-Lens/circle-lens1-LRG.jpg",""],["E:pages/Circle-Contact-Lens/circle-lens2-LRG.jpg",""]],"h":"Circle contact lenses are soft contact lenses with a limbal ring that is larger than the patient's visible iris. The look is very dramatic and is favored by anime enthusiasts for making people look more doll or anime character-like. The Etafilcon A® lens (in photo) is a 1-day replacement lens that is currently the only FDA-approved circle lens in the US.","u":"pages/Circle-Contact-Lens/index.htm","cr":"Tressa Larson, OD","src":"er"},{"t":"Soft Contact Lens","im":[["E:pages/SoftCL/Soft-CL-1-LRG.jpg",""],["E:pages/SoftCL/Soft-CL-2-LRG.jpg",""]],"h":"Monthly soft contact lenses are a staple for anyone involved in prescribing contact lenses. The lenses should move a small amount with the blink, particularly on up gaze. A lens that moves excessively may be uncomfortable and may result in variable vision, but if the patient is happy with it, excessive movement is not a health problem.","u":"pages/SoftCL/index.htm","cr":"Tressa Larson, OD","src":"er"},{"t":"Makeup on toric soft contact lens","im":[["E:pages/makeup-on-CL/Makeup-on-toric-soft-contact-lens-LRG.jpg",""]],"h":"Many makeup wearers choose to line the inside of their eyelids posterior to the lash line with eyeliner. If the patient is a contact lens wearer, as in this image, the surface integrity of the contact lens can be compromised resulting in increased risk of infection as bacteria more easily bond to a disrupted surface. It can also decrease comfort of the lens and cause irritation of the palpebral conjunctiva as blinking causes the conjunctiva to rub across the roughened surface. The effect can heightened in a toric contact lens wearer since the rotational stabilization required for the toric optics prevents the lens from rotating and keeps the irritant rubbing on the same tissues. In addition to the contact lens complications, makeup can block the meibomian glands and exacerbate dry eye, the effect is worsened if the eyeliner used is waterproof.","u":"pages/makeup-on-CL/index.htm","cr":"","src":"er"},{"t":"Lipid Deposits on Scleral Rigid Gas Permeable (RGP) Lens","im":[["E:pages/lipid-deposits-scleral-RGP/lipid-deposit-scleral.jpg",""]],"h":"Lipid deposits may indicate an issue with the meibomian glands or the need to change to another type of conditioning solution.","u":"pages/lipid-deposits-scleral-RGP/index.htm","cr":"Tressa Larson, OD","src":"er"},{"t":"Scratched Scleral Rigid Gas Permeable (RGP) Lens","im":[["E:pages/Scratched-Scleral-RGP/Scratched-Scleral-RGP1-LRG.jpg",""],["E:pages/Scratched-Scleral-RGP/Scratched-Scleral-RGP-2-LRG.jpg",""]],"h":"The most likely cause of scratches in any type of contact lens is cleaning. Scratches occur when using abrasive cleaners, with excessive rubbing, rough fingers, and dirty hands. All can result in decreased comfort and vision.","u":"pages/Scratched-Scleral-RGP/index.htm","cr":"Tressa Larson, OD","src":"er"},{"t":"Surface Coating Loss on Scleral Lens","im":[["E:pages/Surface-Coating-Loss-on-Scleral-Lens/non-wetting-scleral-LRG.jpg",""]],"h":"Inappropriate cleaners, excessive rubbing, cosmetic supplies, and the long-term result of cleaning appropriately will eventually strip the surface coating off of any lens.","u":"pages/Surface-Coating-Loss-on-Scleral-Lens/index.htm","cr":"Tressa Larson, OD","src":"er"},{"t":"Appropriate Scleral Lens Sagittal Depth","im":[["E:photos/appropriate-scleral-lens-sagittal-depth/Perfect-Sag-Scleral-w-debris-LRG.jpg",""]],"h":"Scleral contact lenses rest on the sclera, vaulting over the entire cornea and limbus to avoid irritating or scarring those tissues. The amount of space between the lens and the cornea is typically referred to as sag. Sagittal depth actually refers to the entire contact lens from the center of the lens to the plane that the edges circumscribe. Various brands of scleral contact lenses allow you to manipulate the sag in different ways in order to achieve the desired vault over the cornea. Some brands allow you to actually specify the sagittal depth where others require you to manipulate the base curve. A steeper base curve typically results in increased sagittal depth where a flatter base curve reduces it. Regardless of how you achieve clearance over the corneal surface, there is an ideal amount of space between cornea and lens. Larger diameter sclerals typically have deeper sag. We must clear the cornea by enough space that if there are small variations in corneal shape or if the lens settles deeper into the squishy conjunctival tissue that we remain vaulted over the cornea and the limbus. Too much sag is not desirable because it reduces oxygen transmission (think Dk/t where the thickness of the saline layer between the cornea and the lens is t) and reduces BCVA. Good sagittal depth for a scleral lens is typically between 100-500 um centrally. Typical scleral lens thickness is between 250-500 um so if you know the center thickness of your lens you can use this to eyeball it in the slit lamp, but it is much more satisfying to measure it with OCT. In the slit lamp image you see here, the saline layer has debris in it making it appear speckled which made it easier to appreciate. Having fluorescein in this saline makes it much, much easier to see.","u":"pages/appropriate-scleral-lens-sagittal-depth.htm","cr":"Tressa Larson OD","src":"er"},{"t":"EyePrint Pro® over mini penetrating keratoplasty (PKP)","im":[["E:pages/EyePrint-Pro-over-mini-PKP/3-pt2-b-LRG.jpg",""],["E:pages/EyePrint-Pro-over-mini-PKP/3-pt2-a-LRG.jpg",""]],"h":"Scleral lenses are the gold-standard for the treatment of Terrien's Marginal Degeneration because they protect the delicate peripheral cornea from injury and also encourage vascularization of thinned areas of cornea which strengthens the area and also helps to prevent further injury. This patient had a globe rupture in the setting of Terrien's Marginal degeneration and underwent a tectonic mini-PKP. Once a globe has been ruptured such as this, scleral lenses are extremely difficult to fit as they are typically designed with either oblate or prolate corneas in mind. With EyePrint Pro®, a mold of the eye is taken that is used to generate a 3-D computer model of the shape of the eye (centered on cornea, about 20 mm in diameter). To create a fully custom lens, the optics are overlayed and the desired corneal clearance is customized.","u":"pages/EyePrint-Pro-over-mini-PKP/index.htm","cr":"Tressa Larson, OD","src":"er"}]}]};

  slides.push(rec);
  const car=el.querySelector('.car');
  car.addEventListener('scroll',()=>{const k=Math.round(car.scrollLeft/Math.max(1,car.clientWidth)); if(k!==rec.ik&&k<rec.imgs.length){rec.ik=k; el.querySelectorAll('.dots i').forEach((d,j)=>d.classList.toggle('on',j===k)); const c=el.querySelector('.imgn'); if(c)c.textContent=(k+1)+' / '+rec.imgs.length; if(slides[cur]===rec) seeImg(rec,k);}},{passive:true});
  car.addEventListener('click',e=>{const f=e.target.closest('figure'); if(!f)return; const vis=[...car.children].filter(x=>!x.classList.contains('gonefig')); openLB(rec,Math.max(0,vis.indexOf(f)));});

  el.querySelectorAll('.car figcaption').forEach(fc=>fc.addEventListener('click',e=>{ e.stopPropagation(); fc.classList.toggle('open'); }));

});

let viewT=null;
function markOver(s){ const hx=s.el.querySelector('.hx'); if(hx&&!hx.classList.contains('open')) hx.classList.toggle('over',hx.scrollHeight>hx.clientHeight+4); }
addEventListener('resize',()=>{ const s=slides[cur]; if(s&&s.kind==='img') markOver(s); });
function seeImg(rec,k){ if(!rec.seenSet.has(k)){ rec.seenSet.add(k); TRK.seen(rec.v,k,rec.imgs.length); } }
function startView(rec){ rec.dwell=0; rec.counted=false; rec.seenSet=new Set(); seeImg(rec,rec.ik||0); viewT=setInterval(()=>{ if(slides[cur]!==rec||document.hidden) return; rec.dwell++; TRK.addTime(rec.v,1); if(!rec.counted&&rec.dwell>=3&&rec.seenSet.size>=rec.imgs.length){ rec.counted=true; TRK.watch(rec.v); } },1000); }
function stepImg(rec,d){ const car=rec.el.querySelector('.car'); const k=Math.max(0,Math.min(rec.imgs.length-1,(rec.ik||0)+d)); car.scrollTo({left:k*car.clientWidth,behavior:'smooth'}); }
let cur=-1, muted=true, rate=1, lastI=null;
const RMIN=0.25, RMAX=4;
const fmt=s=>{s=Math.max(0,s||0);const m=Math.floor(s/60),x=Math.floor(s%60);return m+':'+String(x).padStart(2,'0')};
function paintSeek(rec,fromInput){
  const v=rec.vid, d=v.duration;
  if(!fromInput && !rec.drag && isFinite(d) && d>0) rec.rng.value=Math.round(v.currentTime/d*1000);
  rec.rng.style.setProperty('--p',(rec.rng.value/10)+'%');
  rec.tm.textContent=fmt(v.currentTime)+' / '+(isFinite(d)?fmt(d):'–:––');
}
function seekBy(rec,s){const v=rec.vid; if(!isFinite(v.duration))return; v.currentTime=Math.max(0,Math.min(v.duration-0.05,v.currentTime+s)); paintSeek(rec);}
(function tick(){const s=slides[cur]; if(s&&s.type==='clip'&&s.loaded&&s.vid) paintSeek(s); requestAnimationFrame(tick)})();
function setRate(r){
  rate=Math.round(Math.max(RMIN,Math.min(RMAX,r))*4)/4;
  document.getElementById('sVal').textContent=rate+'×';
  document.getElementById('speed').classList.toggle('on',rate!==1);
  document.getElementById('sUp').disabled=rate>=RMAX; document.getElementById('sDown').disabled=rate<=RMIN;
  document.getElementById('sUp').style.opacity=rate>=RMAX?.35:1; document.getElementById('sDown').style.opacity=rate<=RMIN?.35:1;
  const s=slides[cur]; if(s&&s.type==='clip'&&s.vid) s.vid.playbackRate=rate;
  if(LS) try{LS.setItem('gonioscroll_rate',rate)}catch(e){}
}
function load(rec){ if(rec.kind==='img'){ if(rec.loaded)return; rec.el.querySelectorAll('img[data-src]').forEach(i=>{ if(!i.getAttribute('src')) i.src=i.dataset.src; }); rec.loaded=true; return; } if(rec.type!=='clip'||rec.loaded)return; rec.vid.preload='auto'; rec.vid.src=CDN+rec.v+'#t=0.001'; rec.loaded=true; }
// iOS Safari ignores preload until a video has played, so briefly play the upcoming clip (muted, off-screen) to start buffering it
function warm(rec){
  if(rec&&rec.kind==='img'){ load(rec); return; }
  if(!rec||rec.type!=='clip'||rec.warmed) return; load(rec); rec.warmed=true;
  const v=rec.vid; v.muted=true;
  const stop=()=>{ v.removeEventListener('playing',stop); if(slides[cur]!==rec){ v.pause(); try{ v.currentTime=0.001; }catch(e){} } };
  v.addEventListener('playing',stop); const p=v.play(); if(p) p.catch(()=>{ v.removeEventListener('playing',stop); });
}
function unload(rec){ if(rec.kind==='img'){ if(!rec.loaded)return; rec.el.querySelectorAll('img').forEach(i=>i.removeAttribute('src')); rec.loaded=false; return; } if(rec.type!=='clip'||!rec.loaded)return; rec.vid.pause(); rec.vid.removeAttribute('src'); rec.vid.load(); rec.loaded=false; rec.retried=0; rec.warmed=false; }
function togglePlay(rec){ if(rec.kind==='img'){ openLB(rec,rec.ik||0); return; } const v=rec.vid; if(v.paused){v.play().catch(()=>{});rec.el.classList.remove('paused')} else {v.pause();rec.el.classList.add('paused')} }
function activate(i){
  if(i===cur)return; cur=i;
  slides.forEach((s,j)=>{ if(Math.abs(j-i)<=2) load(s); else unload(s); if(j!==i&&s.type==='clip'&&s.loaded&&s.vid) s.vid.pause(); });
  clearInterval(viewT);
  const s=slides[i];
  // warm the next clip in the direction of travel (and the one after a chapter card)
  const dir=(typeof lastI==='number'&&i<lastI)?-1:1; lastI=i;
  setTimeout(()=>{ if(cur!==i) return; let k=i+dir; while(slides[k]&&slides[k].type!=='clip'&&Math.abs(k-i)<3) k+=dir; warm(slides[k]); if(dir<0){ let f=i+1; while(slides[f]&&slides[f].type!=='clip'&&f-i<3) f++; warm(slides[f]); } }, s.type==='clip'?600:0);
  if(s.kind==='img'){ markOver(s); const im=s.el.querySelector('img'); if(im&&!im.complete) s.el.classList.add('loading'); startView(s); }
  if(s.type==='clip'&&s.vid){ const v=s.vid; v.muted=muted; v.playbackRate=rate; if(!v.paused||v.readyState>=3) s.el.classList.remove('loading'); else s.el.classList.add('loading'); s.el.classList.remove('paused'); v.play().then(()=>s.el.classList.remove('loading')).catch(()=>{ if(!muted){muted=true;v.muted=true;v.play().catch(()=>{});updMute();} }); }
  const ci=s.ch; const c=CH[ci];
  document.getElementById('chapname').innerHTML = (ci>=0&&IMGSEC&&document.body.classList.contains('quiz')&&s.type==='clip') ? `${SECS[SEC].icon} ${SECS[SEC].name}` : ci>=0 ? `${ci+1}. ${esc(c.n)}${s.type==='clip'&&!IMGSEC?' <span>· '+esc(s.g)+'</span>':''}` : (i===0?(IMGSEC?SECS[SEC].icon+' '+SECS[SEC].name:'GonioScroll'):(!IMGSEC&&i===1)?'0. History':'End');
  document.getElementById('count').textContent = s.type==='clip' ? `${s.n} / ${total}` : '';
  document.getElementById('bar').style.width = (100*i/(slides.length-1))+'%';
  document.getElementById('bSrc').style.visibility = s.type==='clip'?'visible':'hidden';
  if(LS) try{LS.setItem(IDXKEY,i)}catch(e){}
  if(typeof onSlideChange==='function') onSlideChange(s);
}
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>=0.6)activate(slides.findIndex(s=>s.el===e.target))})},{root:feed,threshold:[0.6]});

T.el.addEventListener('change',e=>{ const c=e.target.closest('[data-ts]'); if(c){ T.secs[c.dataset.ts]=c.checked; saveSecs(); const l=T.el.querySelector('[data-t=secall]'); if(l) l.textContent=Object.values(T.secs).every(Boolean)?'Only '+SECS[SEC].name:'Everything'; } });
T.el.addEventListener('keydown',e=>{e.stopPropagation(); if(e.key==='Escape')closeTest()});
document.getElementById('bTest').onclick=()=>openTest(); document.getElementById('bTest2').onclick=()=>openTest();
document.getElementById('startTest').onclick=()=>openTest('sec');
document.addEventListener('click',e=>{ const b=e.target.closest('[data-testall]'); if(b){ e.preventDefault(); document.getElementById('menu').classList.remove('open'); openTest('all'); } });

// ---------- Progress screen + per-clip stats ----------
const PG={el:document.getElementById('prog')};
const fmtDur=s=>{s=Math.round(s||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h ${m}m`:m?`${m}m`:`${s}s`};
function statLine(v){
  const r=TRK.get(v); if(!r) return '<span class="st0">Not watched yet</span>';
  const isImg=v.includes(':');
  const parts=[`👁 ${r.w}× ${isImg?'viewed':'watched'}`];
  if(r.w===0) parts[0]=`👁 ${Math.round(TRK.coverage(v)*100)}% seen`;
  if(r.qa) parts.push(`✓ ${r.qc}/${r.qa} questions`);
  if(r.ta) parts.push(`🎲 ${r.tc}/${r.ta} in tests`);
  return parts.join(' · ');
}
function paintStat(s){ if(s&&s.type==='clip'){ const e=s.el.querySelector('.stat'); if(e) e.innerHTML=statLine(s.v); } }
TRK.on(v=>{ slides.forEach(s=>{ if(s.type==='clip'&&(v==null||s.v===v)) paintStat(s); }); if(PG.el.classList.contains('open')) renderProg(); });
slides.forEach(paintStat);
slides.forEach(s=>{ if(s.type==='clip'&&s.vid) TRK.attach(s.vid,()=>slides[cur]===s?s.v:null); }); // only count the clip on screen (not pre-loading ones)

function cellClass(v){ const r=TRK.get(v); if(!r) return 'c0'; if(r.w>=3) return 'c3'; if(r.w===2) return 'c2'; if(r.w===1) return 'c1'; return TRK.coverage(v)>0?'cp':'c0'; }
function accClass(v){ const r=TRK.get(v); if(!r) return ''; const a=r.qa+r.ta, c=r.qc+r.tc; if(!a) return ''; return c/a>=0.75?'ag':c/a>=0.4?'aa':'ar'; }
function renderProg(){
  const clips=slides.filter(s=>s.type==='clip'), uniq=[...new Map(clips.map(s=>[s.v,s])).values()];
  let watched=0, seen=0, secs=0, qa=0,qc=0,ta=0,tc=0, totalLen=0;
  uniq.forEach(s=>{ const r=TRK.get(s.v); if(!r) return; if(r.w>0) watched++; seen+=TRK.coverage(s.v); secs+=r.s; qa+=r.qa; qc+=r.qc; ta+=r.ta; tc+=r.tc; });
  const pv=100*seen/uniq.length, pct=pv>0&&pv<10?pv.toFixed(1):Math.round(pv);
  const quiz=document.body.classList.contains('quiz');
  const chRows=CH.map((c,ci)=>{ const cs=clips.filter(s=>s.ch===ci); const w=cs.filter(s=>(TRK.get(s.v)||{}).w>0).length; const cov=cs.reduce((a,s)=>a+TRK.coverage(s.v),0)/cs.length;
    return `<div class="pch"><div class="pchh"><button class="tlink" data-p="ch" data-i="${c.start}">${ci+1}. ${esc(c.n)}</button><span>${w}/${cs.length} watched · ${Math.round(cov*100)}% seen</span></div>
    <div class="pbar"><i style="width:${Math.round(cov*100)}%"></i></div>
    <div class="grid">${cs.map(s=>{const r=TRK.get(s.v)||{};return `<button class="cell ${cellClass(s.v)} ${accClass(s.v)}" data-p="go" data-i="${slides.indexOf(s)}" title="#${s.n}${quiz?'':' '+esc(s.t)} — watched ${r.w||0}×, ${Math.round(TRK.coverage(s.v)*100)}% seen${r.qa?`, questions ${r.qc}/${r.qa}`:''}${r.ta?`, tests ${r.tc}/${r.ta}`:''}">${r.w>1?r.w:''}</button>`}).join('')}</div></div>`; }).join('');
  const secRows=Object.entries(SECS).map(([k,s])=>{ const keys=k==='gonio'?[...new Set(CH_GONIO.flatMap(c=>c.g.flatMap(g=>g[1].map(it=>it[1]))))]:[...new Set(DATA2[k].flatMap(c=>c.items.map(it=>secKey(k,it))))]; let w=0,cov=0; keys.forEach(x=>{const r=TRK.get(x); if(r&&r.w>0)w++; cov+=TRK.coverage(x);}); const pc=Math.round(100*cov/keys.length); return `<button data-sec="${k}" class="${k===SEC?'cur':''}"><b>${s.icon} ${s.name}</b>${w}/${keys.length} ${k==='gonio'?'watched':'viewed'} · ${pc}%<i><u style="width:${pc}%"></u></i></button>`; }).join('');
  PG.el.querySelector('.tin').innerHTML=`<div class="th"><h2>📊 Your progress</h2><button class="tx" data-p="close">×</button></div>
  <div class="psecs">${secRows}</div><h3 style="margin:4px 0 8px">${SECS[SEC].icon} ${SECS[SEC].name}</h3><div class="pkpi"><div><b>${pct}%</b><span>of all footage seen</span></div><div><b>${watched}/${uniq.length}</b><span>${IMGSEC?'cases viewed':'clips fully watched'}</span></div><div><b>${fmtDur(secs)}</b><span>watch time</span></div><div><b>${qa?Math.round(100*qc/qa)+'%':'–'}</b><span>quiz Qs correct (${qc}/${qa})</span></div><div><b>${ta?Math.round(100*tc/ta)+'%':'–'}</b><span>test answers correct (${tc}/${ta})</span></div></div>
  <div class="plegend"><span><i class="cell c0"></i>not seen</span><span><i class="cell cp"></i>partly seen</span><span><i class="cell c1"></i>watched 1×</span><span><i class="cell c2"></i>2×</span><span><i class="cell c3"></i>3×+</span><span><i class="cell c1 ag"></i>≥75% correct</span><span><i class="cell c1 aa"></i>40–74%</span><span><i class="cell c1 ar"></i>&lt;40%</span></div>
  <p class="tm2" style="font-size:13px">${IMGSEC?'A case counts as viewed once you have looked at all its images for at least 3 seconds.':'A clip counts as watched when you\'ve played at least 90% of it in one go (scrubbing doesn\'t count).'} Tap any square to jump to that clip.</p>
  ${chRows}
  <div class="pbox"><h3>🚫 Removed from the pile</h3>${(()=>{ const items=Object.entries(HID).filter(([k,v])=>v.h); if(!items.length) return '<p class="tm2" style="font-size:13px">Nothing removed. Use <b>🚫 Remove</b> under a case (or X on a keyboard) to take it out of the feed, quizzes and tests. In the zoom view, 🚫 removes a single image.</p>'; return `<div class="hidlist">${items.map(([k,v])=>`<div><span>${esc(v.n||k.slice(2))}<small>${SECS[v.s]?SECS[v.s].icon+' '+SECS[v.s].name:''}${k.startsWith('i|')?' · image '+(v.img||''):''}</small></span><button class="tlink" data-p="unhide" data-k="${esc(k)}">Restore</button></div>`).join('')}</div><button class="tgo sec" data-p="unhideall">Restore all (${items.length})</button>`; })()}</div>
  <div class="pbox" id="syncbox"></div>
  <div class="pbox"><h3>Manual backup</h3>
  <p class="tm2" style="font-size:13px">${TRK.persistent?'Progress is saved automatically in this browser on this device. Clearing browser data, private browsing, or opening the file in a different browser or device starts fresh, so keep a backup.':'This browser is blocking storage, so progress will be lost when you close the page. Download a backup before you leave.'}</p>
  <div class="pbtns"><button class="tgo" data-p="dl">⬇ Download backup file</button><button class="tgo sec" data-p="copy">Copy backup code</button><label class="tgo sec">⬆ Restore from file<input type="file" accept=".json,application/json" hidden id="pfile"></label><button class="tgo sec" data-p="paste">Paste backup code</button></div>
  <div id="ppaste" style="display:none"><textarea id="ptext" placeholder="Paste a backup code here"></textarea><button class="tgo" data-p="doimport">Restore</button></div>
  <p id="pmsg" class="tm2"></p>
  <button class="tlink" data-p="reset" style="color:#e0605a">Reset all progress…</button></div>`;
  if(window.SYNC) SYNC.renderPanel();
  PG.el.querySelector('#pfile').onchange=e=>{const f=e.target.files[0]; if(!f) return; f.text().then(doImport)};
}
function backupText(){ let quiz={}; try{quiz=JSON.parse(localStorage.getItem('gonioscroll_q')||'{}')}catch(e){} return TRK.exportJSON({quiz,hidden:HID}); }
function mergeBackup(text,manual){
  const {o,wiped}=TRK.importJSON(typeof text==='string'?text.trim():text,manual);
  if(wiped){ Object.keys(QS).forEach(k=>delete QS[k]); slides.forEach(s=>{s.qPopped=false}); }
  if(o.quiz){ Object.entries(o.quiz).forEach(([k,arr])=>{ QS[k]=QS[k]||[]; (arr||[]).forEach((v,i)=>{ if(v!=null&&QS[k][i]==null) QS[k][i]=v; }); }); }
  if(o.hidden) mergeHidden(o.hidden);
  saveQS(); score(); return o;
}
function doImport(text){
  const m=PG.el.querySelector('#pmsg');
  try{ mergeBackup(text,true); renderProg(); PG.el.querySelector('#pmsg').textContent='✓ Restored and merged with your current progress.'; if(window.SYNC) SYNC.soon(); }
  catch(e){ m.textContent='✗ That doesn\'t look like a GonioScroll backup.'; }
}
function openProg(){ if(window.SYNC) SYNC.soon(); const s=slides[cur]; if(s&&s.type==='clip'&&s.vid) s.vid.pause(); qcard.classList.remove('open'); TRK.save(); renderProg(); PG.el.classList.add('open'); PG.el.scrollTop=0; }
function closeProg(){ PG.el.classList.remove('open'); const s=slides[cur]; if(s&&s.type==='clip'&&s.vid) s.vid.play().catch(()=>{}); }
let resetArm=0;
PG.el.addEventListener('click',e=>{
  const b=e.target.closest('[data-p]'); if(!b) return; const a=b.dataset.p, m=PG.el.querySelector('#pmsg');
  if(a==='close') closeProg();
  else if(a==='go'||a==='ch'){ PG.el.classList.remove('open'); go(+b.dataset.i); }
  else if(a==='dl'){ const blob=new Blob([backupText()],{type:'application/json'}); const u=URL.createObjectURL(blob); const l=document.createElement('a'); l.href=u; l.download=`gonioscroll-progress-${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); m.textContent='Backup downloaded. If nothing appeared, use "Copy backup code" instead.'; }
  else if(a==='copy'){ const t=backupText(); (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>m.textContent='✓ Backup code copied. Paste it into a note or email to yourself.').catch(()=>{ PG.el.querySelector('#ppaste').style.display='block'; const ta=PG.el.querySelector('#ptext'); ta.value=t; ta.select(); m.textContent='Select-all and copy the code in the box.'; }); }
  else if(a==='paste'){ PG.el.querySelector('#ppaste').style.display='block'; PG.el.querySelector('#ptext').value=''; PG.el.querySelector('#ptext').focus(); }
  else if(a==='doimport') doImport(PG.el.querySelector('#ptext').value);
  else if(a==='unhide'){ setHid(b.dataset.k,0); applyHidden(); renderProg(); toast('Restored'); }
  else if(a==='unhideall'){ Object.keys(HID).forEach(k=>{ if(HID[k].h) setHid(k,0); }); applyHidden(); renderProg(); toast('All restored'); }
  else if(a==='reset'){ if(Date.now()-resetArm<4000){ TRK.reset(); if(window.SYNC) SYNC.soon(true); Object.keys(QS).forEach(k=>delete QS[k]); saveQS(); score(); slides.forEach(s=>{s.qPopped=false}); m.textContent='Progress reset.'; renderProg(); } else { resetArm=Date.now(); b.textContent='Tap again to permanently reset everything'; } }
});
PG.el.addEventListener('keydown',e=>{ e.stopPropagation(); if(e.key==='Escape') closeProg(); });
document.getElementById('bProg').onclick=openProg; document.getElementById('bProg2').onclick=openProg;

// ---------- Cloud sync via a secret GitHub Gist ----------
const SYNC=(function(){
  const CK='gonioscroll_sync', FILE='gonioscroll-progress.json', API='https://api.github.com';
  let cfg={}; try{ cfg=JSON.parse(localStorage.getItem(CK)||'{}')||{}; }catch(e){}
  let busy=false, again=false, lastRev=-1, status='', err='', timer=null;
  const saveCfg=()=>{ try{ localStorage.setItem(CK,JSON.stringify(cfg)); }catch(e){} };
  const on=()=>!!(cfg.token&&cfg.gist);
  async function api(path,opts={}){
    const r=await fetch(API+path,{...opts,headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opts.body?{'Content-Type':'application/json'}:{})}});
    if(r.status===401||r.status===403){ const e=new Error(r.status===401?'GitHub rejected the token (expired or revoked?)':'Token lacks the "gist" permission, or rate-limited'); e.auth=true; throw e; }
    if(!r.ok){ const e=new Error('GitHub error '+r.status); e.status=r.status; throw e; }
    return r.status===204?null:r.json();
  }
  const payload=()=>{ let quiz={}; try{ quiz=JSON.parse(localStorage.getItem('gonioscroll_q')||'{}'); }catch(e){} return JSON.stringify(TRK.exportObj({quiz,hidden:HID}),null,0); };
  async function create(){ const g=await api('/gists',{method:'POST',body:JSON.stringify({description:'GonioScroll progress (synced automatically — do not edit)',public:false,files:{[FILE]:{content:payload()}}})}); cfg.gist=g.id; cfg.url=g.html_url; saveCfg(); }
  async function sync(){
    if(!on()) return; if(busy){ again=true; return; } busy=true; err=''; status='Syncing…'; paint();
    try{
      let g; try{ g=await api('/gists/'+cfg.gist); }catch(e){ if(e.status===404){ await create(); g=null; } else throw e; }
      if(g){ const f=g.files&&g.files[FILE];
        if(f){ let text=f.content; if(f.truncated) text=await (await fetch(f.raw_url)).text(); if(text&&text.trim()) mergeBackup(text); }
        await api('/gists/'+cfg.gist,{method:'PATCH',body:JSON.stringify({files:{[FILE]:{content:payload()}}})});
      }
      lastRev=TRK.rev(); cfg.last=Date.now(); saveCfg(); status='';
    }catch(e){ err=e.message||String(e); if(e.auth){ cfg.paused=true; saveCfg(); } }
    busy=false; paint(); if(again){ again=false; setTimeout(sync,500); }
  }
  function soon(force){ if(!on()||cfg.paused) return; clearTimeout(timer); timer=setTimeout(sync,force?50:800); }
  // push our own counters when the page is hidden (keepalive so it survives closing the tab)
  document.addEventListener('visibilitychange',()=>{ if(document.hidden&&on()&&!cfg.paused&&TRK.rev()!==lastRev){
    try{ fetch(API+'/gists/'+cfg.gist,{method:'PATCH',keepalive:true,headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({files:{[FILE]:{content:payload()}}})}); lastRev=TRK.rev(); }catch(e){} }
    else if(!document.hidden) soon(); });
  setInterval(()=>{ if(on()&&!cfg.paused&&TRK.rev()!==lastRev&&!document.hidden) sync(); },60000);
  async function connect(token){
    cfg={token:token.trim()}; err=''; status='Connecting…'; paint();
    try{
      const u=await api('/user'); cfg.login=u.login;
      // reuse an existing GonioScroll gist if there is one
      let found=null; for(let page=1;page<=5&&!found;page++){ const list=await api('/gists?per_page=100&page='+page); found=list.find(g=>g.files&&g.files[FILE]); if(list.length<100) break; }
      if(found){ cfg.gist=found.id; cfg.url=found.html_url; saveCfg(); await sync(); status=''; }
      else { await create(); cfg.last=Date.now(); lastRev=TRK.rev(); saveCfg(); status=''; }
      toast('☁ Sync connected as @'+cfg.login);
    }catch(e){ err=e.message; cfg={}; saveCfg(); }
    status=''; paint();
  }
  function disconnect(){ cfg={}; saveCfg(); err=''; status=''; paint(); }
  const ago=t=>{ if(!t) return 'never'; const s=Math.round((Date.now()-t)/1000); return s<10?'just now':s<60?s+'s ago':s<3600?Math.round(s/60)+' min ago':new Date(t).toLocaleString(); };
  function paint(){ ['bProg','bProg2'].forEach(id=>{const e=document.getElementById(id); if(e) e.classList.toggle('synced',on()&&!cfg.paused&&!err);}); if(document.getElementById('prog').classList.contains('open')) renderPanel(); }
  function renderPanel(){
    const box=document.getElementById('syncbox'); if(!box) return;
    if(!on()){
      box.innerHTML=`<h3>☁ Sync across devices</h3>
      <p class="tm2" style="font-size:13px">Saves your progress to a secret gist on your GitHub account so every device stays in step automatically. You need to set this up once on each device.</p>
      <ol class="steps">
        <li>Sign in to GitHub (a free account is fine).</li>
        <li><a href="https://github.com/settings/tokens/new?scopes=gist&description=GonioScroll%20sync" target="_blank" rel="noopener">Open this pre-filled token page ↗</a>. Only <b>gist</b> should be ticked. Set an expiry (e.g. 1 year), then press <b>Generate token</b>.</li>
        <li>Copy the token (it starts with <code>ghp_</code>) and paste it below. Use the <b>same token</b> on every device, or make one per device.</li>
      </ol>
      <div class="tform"><input class="tans" id="stok" type="password" placeholder="ghp_…" autocomplete="off" spellcheck="false"><button data-s="connect">Connect</button></div>
      ${status?`<p class="tm2">${status}</p>`:''}${err?`<p class="serr">✗ ${esc(err)}</p>`:''}
      <p class="tm2" style="font-size:12px;margin-top:10px">The token is kept only in this browser. It can create and edit your gists, so revoke it on GitHub if you lose a device. The gist contains only watch counts and scores.</p>`;
    } else {
      const devs=TRK.devices();
      box.innerHTML=`<h3>☁ Sync is on</h3>
      <p class="tm2" style="font-size:13px">Signed in as <b>@${esc(cfg.login||'?')}</b> · last synced <b>${status||ago(cfg.last)}</b>${cfg.paused?' · <b style="color:#f87171">paused</b>':''}</p>
      ${err?`<p class="serr">✗ ${esc(err)}${cfg.paused?' Paste a new token to resume.':''}</p>`:''}
      <div class="devs">${devs.map(d=>`<div><span>${d.me?'📍':'💻'} ${esc(d.name)}${d.me?' <small>(this device)</small>':''}</span><small>${d.n} clips with activity${d.at&&!d.me?' · seen '+ago(d.at):''}</small></div>`).join('')}</div>
      ${cfg.paused?`<div class="tform"><input class="tans" id="stok" type="password" placeholder="New token ghp_…"><button data-s="connect">Reconnect</button></div>`:''}
      <div class="pbtns" style="margin-top:10px"><button class="tgo" data-s="now">Sync now</button><button class="tgo sec" data-s="off">Turn off on this device</button></div>
      <p class="tm2" style="font-size:12px;margin-top:8px">Totals add up across devices. ${cfg.url?`<a href="${cfg.url}" target="_blank" rel="noopener">View the gist ↗</a>`:''}</p>`;
    }
  }
  document.getElementById('prog').addEventListener('click',e=>{
    const b=e.target.closest('[data-s]'); if(!b) return; const a=b.dataset.s;
    if(a==='connect'){ const v=(document.getElementById('stok').value||'').trim(); if(!v){ err='Paste your token first.'; renderPanel(); return; } connect(v); }
    else if(a==='now'){ cfg.paused=false; saveCfg(); sync(); }
    else if(a==='off'){ disconnect(); }
  });
  document.getElementById('prog').addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='stok'){ e.preventDefault(); document.querySelector('[data-s=connect]').click(); } });
  if(on()) setTimeout(sync,1200);
  paint();
  return { soon, sync, renderPanel, on, cfg:()=>cfg };
})();
window.SYNC=SYNC;


// auto-hide the time bar when the mouse is idle or leaves the window (desktop only)
(function(){
  if(!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  let idleT, overSeek=false;
  const dragging=()=>slides.some(s=>s.drag)||!!document.querySelector('.seek input:active');
  const sleep=()=>{ if(!overSeek&&!dragging()) document.body.classList.add('idle'); };
  const wake=()=>{ document.body.classList.remove('idle'); clearTimeout(idleT); idleT=setTimeout(sleep,2500); };
  document.addEventListener('mousemove',e=>{ overSeek=!!e.target.closest('.seek'); wake(); },{passive:true});
  document.addEventListener('mousedown',wake,{passive:true});
  document.documentElement.addEventListener('mouseleave',()=>{ overSeek=false; clearTimeout(idleT); if(!dragging()) document.body.classList.add('idle'); });
  document.addEventListener('keydown',e=>{ if(/^Arrow(Left|Right)$|^[,.]$/.test(e.key)) wake(); });
  idleT=setTimeout(sleep,2500);
})();
// resume
let jumpKey=null; try{ jumpKey=sessionStorage.getItem('gs_jump'); sessionStorage.removeItem('gs_jump'); }catch(e){}
const jumpIdx=jumpKey?slides.findIndex(x=>x.v===jumpKey):-1;
const saved=jumpIdx>=0?jumpIdx:(LS?+LS.getItem(IDXKEY):0);
if(saved>1&&saved<slides.length){go(saved);const s=slides[saved];toast('Resumed'+(s.type==='clip'?` at clip ${s.n}`:''),'Start over',()=>go(0))}
else activate(0);
</script>
