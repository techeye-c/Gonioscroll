recessive fashion and is characterized by decreased melanin and subnormal vision since birth. Findings on exam include hypopigmentation of the skin, hair, and irides with diffuse iris transillumination defects on retroillumination, as seen in the photograph. Decreased acuity can be attributed to foveal hypoplasia which is apparent as an abnormally small or absent foveal depression as seen in this optical coherence tomography (OCT) render. Albinism can also be limited solely to the eyes in ocular albinism which most commonly has X-linked recessive inheritance. OMIM #203200 OMIM, additional","u":"pages/oculocutaneous-albinism.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Temporal laser peripheral iridotomy","im":[["E:pages/Temporal-LPI/Temporal-LPI-LRG.jpg",""]],"h":"Laser peripheral iridotomy (LPI) is indicated to treat or prevent pupillary block glaucoma. A patent iridotomy allows aqueous humor from the posterior chamber to reach the anterior chamber, bypassing any potential pupillary block and preventing the iris from billowing forward and occluding the trabecular meshwork. The iridotomy should be positioned as peripheral as possible to decrease the risk of posterior synechiae or cataract, but not so far peripheral that one is unable to confirm its patency. Patency is best confirmed by direct visualization as opposed to transillumination, because even non-patent iridotomies can transilluminate. LPIs have traditionally been placed superiorly, under the upper eyelid, to decrease the risk of post-operative dysphotopsias. However, in our experience, LPIs placed temporally are much less likely to result in these visual disturbances. This was confirmed in a prospective randomized clinical trial. It is hypothesized that for superiorly placed LPIs, even those completely covered by the upper eyelid, light may be refracted through the iridotomy by the tear meniscus created at the margin of the upper eyelid.","u":"pages/Temporal-LPI/index.htm","cr":"Kurt Chamberlain MS3,, Justin Risma, MD, Wallace L Alward, MD","src":"er"}]},{"n":"Lens & cataract","b":"Congenital, age-related and secondary cataracts; lens position.","items":[{"t":"Congenital nuclear cataract","im":[["E:pages/congen-nuclear-cataract/nuclear-cataract-OD-LRG.jpg",""],["E:pages/congen-nuclear-cataract/nuclear-cataract-OD-RR-LRG.jpg",""],["E:pages/congen-nuclear-cataract/nuclear-cataract-OD-slit-LRG.jpg",""]],"h":"Congenital nuclear cataracts may involve the entire nucleus, or a portion of it as seen in this photograph. These photographs also show a mild persistent pupillary membrane which is most visible in the red reflex.","u":"pages/congen-nuclear-cataract/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Congenital Cataract, Sutural","im":[["E:photos/congenital/CongenitalCataractSuture_01212005.jpg","This congenital cataract follows the embryonic suture lines of the lens. Other congenital opacities are noted in the lens as well."]],"h":"This congenital cataract follows the embryonic suture lines of the lens. Other congenital opacities are noted in the lens as well.","u":"pages/Congenital-Cataract-Sutural.html","cr":"Jordan Graff, MD","src":"er"},{"t":"Congenital lamellar / zonular cataract in a child","im":[["E:photos/congenital/congenital-cataract.jpg","Congenital lamellar / zonular cataract in a child"]],"h":"Congenital lamellar / zonular cataract in a child","u":"pages/congenital-lamellar-zonular-cataract-.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Coppock Cataract","im":[["E:photos/coppock/Coppock-Cataract-1.JPG",""],["E:photos/coppock/Coppock-Cataract-2.JPG",""],["E:photos/coppock/Coppock-Nettleship-1.gif","Nettleship (1906) Figure 1: Typical form of the cataract. Illustration from 1888, showing the lens appearance of William Coppock."]],"h":"21-year-old female with history of bilateral congenital cataracts. This is called a \"Coppock cataract,\" also known as a \"central pulverulent cataract.\" It refers to a pulverulent disc-like opactiy involving the embryonal and fetal nucleus with many tiny white dots in the lamellar portion of the lens. It is usually bilateral and dominantly inherited. The patient's mother and older sister also have nearly identical-appearing cataracts. These cataracts were not removed, because in this case, they were non-amblyogenic. Patients with this type of congenital cataract often have excellent visual acuity and are unaware that they even have a cataract. This patient has 20/20 visual acuity. Historical Images from Nettleship 1906","u":"pages/coppock.htm","cr":"Elizabeth Gauger, MD","src":"er"},{"t":"Cerulean Cataract","im":[["E:photos/cataract/Cerulean-cataract3.jpg",""],["E:photos/cataract/Cerulean-cataract5.jpg",""],["E:photos/cataract/Cerulean-Cataract.jpg",""]],"h":"This is a congenital cataract that is rarely visually significant and strikingly beautiful. Cerulean is a sky blue color, the word deriving from the Latin word for 'heaven' and also related to copper--imagine the blue color on tarnished copper.","u":"pages/cerulean-cataract.htm","cr":"Justin Risma, MD","src":"er"},{"t":"Christmas Tree Cataract","im":[["E:photos/Christmas-cataract/Christmas-tree-cataract-LARGE.jpg",""]],"h":"Christmas tree decoration cataract or polychromatic cataract","u":"pages/christmas-tree-cataract.htm","cr":"Elizabeth Gauger, MD and Anna Kitzmann, MD","src":"er"},{"t":"Anterior polar cataract","im":[["E:pages/Anterior-Polar-Cataract/Anterior-Polar-OD-(1)-LRG.jpg",""],["E:pages/Anterior-Polar-Cataract/Anterior-Polar-OS-(1)-LRG.jpg",""],["E:pages/Anterior-Polar-Cataract/Anterior-Polar-OD-(2)-LRG.jpg",""]],"h":"Anterior polar cataracts are congenital opacities involving the anterior capsule and subcapsular cortex. They are typically small, bilateral, symmetric, non-progressive, and not visually significant. The patient in these photographs had anterior polar cataracts that were more prominent in the left eye than the right. Only the left cataract was visually significant.","u":"pages/Anterior-Polar-Cataract/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Anterior polar cataract","im":[["E:photos-earlier/slide-2_small.jpg","Andrew Doan, MD, PhD"],["E:photos/anterior-polar-cataract/AnteriorPolarCataract1_03142005.jpg","Jordan M. Graff, MD"],["E:photos/anterior-polar-cataract/AnteriorPolarCataract2_03142005.jpg","Jordan M. Graff, MD"]],"h":"Andrew Doan, MD, PhD Jordan M. Graff, MD The anterior polar cataract is prototypically presented in this photo. (William Charles Caccamise, Sr, MD) This cataract is usually stationary. The cause is unknown but some have related it to the pupillary membrane system or a defect during development.Occasionally it may be inherited as an autosomal dominant. (William Charles Caccamise, Sr, MD) The patient should be assured of the generally benign nature of the congenital anterior polar cataract. (William Charles Caccamise, Sr, MD)","u":"pages/anterior-polar-cataract.html","cr":"Andrew Doan, MD, PhD, Jordan Graff, MD","src":"er"},{"t":"Anterior subcapsular cataract","im":[["E:pages/Anterior-subcapsular-Cataract/anterior-subcapsular-RR-LRG.jpg",""],["E:pages/Anterior-subcapsular-Cataract/anterior-subcapsular-slit-LRG.jpg",""],["E:pages/Anterior-subcapsular-Cataract/Anterior_Subcapsular_Cataract_1.png","Juvenile anterior subcapsular cataract OS in a 37-year-old adult reporting symptoms of glare with 20/20-2 vision uncorrected."]],"h":"Anterior subcapsular cataracts (ASC) form after anterior lens epithelial cells become necrotic from a variety of causes including iritis, keratitis, inflammation associated with atopic dermatitis, irradiation, or electrical burns. The opacification of the lens is due to a migration of adjacent epithelial cells into the damaged area and subsequent transformation of these cells into a plaque of multiple layers of myofibroblasts. The most posterior layer of these cells remain epithelial cells and will produce a new lens capsule. Over time the myofibroblasts resolve leaving a wrinkled appearance to the lens capsule. A duplication cataract occurs when a cortical cataract develops in the same area as the ASC. Anterior subcapsular cataract Anterior subcapsular cataract Category(ies): Cataract, Lens Contributor: Alina Husain MD and Jaclyn M. Haugsdal, MD Photographer: Najla Al Salama, CRA","u":"pages/Anterior-subcapsular-Cataract/index.htm","cr":"Hanna Beebe, MD","src":"er"},{"t":"Combined Anterior Polar, Posterior Subcapsular and Cortical Cataract","im":[["E:pages/combined-cataract/1-cataract-combo-LRG.jpg",""],["E:pages/combined-cataract/2-cataract-combo.jpg",""],["E:pages/combined-cataract/3-cataract-combo.jpg",""]],"h":"This is a 40-year-old male referred for cataract evaluation. He complained of blurred vision and photosensitivity. His visual acuity is 20/400 in this eye. On exam he had a unilateral anterior polar cataract combined with central posterior subcapsular cataract with mild cortical changes. He elected to proceed with cataract extraction.","u":"pages/combined-cataract/index.htm","cr":"Lindsay McConnell, MD","src":"er"},{"t":"Posterior Polar Cataract","im":[["E:pages/posterior-polar-cataract/posterior-polar-3-LRG.jpg",""],["E:pages/posterior-polar-cataract/posterior-polar-RR-LRG.jpg",""]],"h":"Posterior polar cataracts are a form of congenital cataract commonly associated with posterior capsule changes. They can be autosomal dominant or sporadic and are more commonly bilateral. They are rarely visually significant and are usually stable, but may progress over time. This 42-year-old patient was referred from an outside provider with complaints of blurred vision at distance and near in addition to being bothered by glare. He had 2.5 mm concentric posterior polar opacities in both eyes and elected to undergo cataract extraction.","u":"pages/posterior-polar-cataract/index.htm","cr":"Lindsay McConnell, MD","src":"er"},{"t":"Bilateral posterior polar cataracts","im":[["E:photos/posterior-polar-cataracts-bilateral/L/posterior-polar-cataracts-bilateral-1-LRG.jpg",""],["E:photos/posterior-polar-cataracts-bilateral/L/posterior-polar-cataracts-bilateral-2-LRG.jpg",""],["E:photos/posterior-polar-cataracts-bilateral/L/posterior-polar-cataracts-bilateral-4-LRG.jpg",""]],"h":"Posterior polar cataracts are lens opacities that involve the posterior subcapsular cortex and posterior capsule. They are important to recognize prior to cataract surgery because the posterior capsule may be weak or absent in that area, leading to an increased risk of surgical complications. To minimize this risk, surgeons should avoid hydrodissection or other maneuvers that place excessive pressure on the posterior capsule. Bilateral posterior polar cataracts are generally familial and inherited in an autosomal dominant fashion, while unilateral posterior polar cataracts are generally sporadic and may be associated with persistent fetal vasculature, lenticonus, or lentiglobus.","u":"pages/posterior-polar-cataracts-bilateral.htm","cr":"Justin Risma, MD","src":"er"},{"t":"Posterior Polar Cataract with Traumatic Posterior Capsule Rupture","im":[["E:pages/imgs/R_52yD6GTszTfvlEG_PC_Rupture_External.png","Diffuse illumination slit lamp photograph of a posterior polar cataract with posterior capsular rupture."],["E:pages/imgs/R_52yD6GTszTfvlEG_PC_Rupture_Retroillumination.png","Slit lamp photograph showing retro-illumination of a posterior polar cataract with posterior capsular rupture."]],"h":"A 16-year-old male with a known history of bilateral posterior polar cataracts and baseline visual acuity of 20/20-1 without correction in each eye sustained a traumatic impact to the right eye from a thrown water bottle. On initial evaluation after trauma, his visual acuity was decreased to 20/200 without correction (20/30-2 with pinhole). Anterior segment exam revealed multiple corneal abrasions in the visual axis of the right eye but was otherwise unremarkable. He was prescribed erythromycin ointment and advised to return in 1 week. He was lost to follow up and returned six months later with continued decrease in vision in his right eye. At this time, his visual acuity was 20/200 without correction (20/60 with pinhole). There was no additional improvement with refraction. Slit lamp examination revealed an ellipsoid rupture of the posterior capsule with known posterior polar cataract in addition to outpouching of a focal cortical cataract. Dilated fundus examination was unremarkable. The patient was recommended to proceed with cataract extraction and intraocular lens placement with support from a retinal specialist given the expected complicated nature of the case.","u":"pages/Posterior_Polar_Cataract_with_Traumatic_Posterior_Capsule_Rupture.html","cr":"Nicolas J Heckenlaible MD; Patrick J Donegan MD; Lindsay M De Andrade MD","src":"er"},{"t":"Posterior subcapsular cataract","im":[["E:photos-earlier/PSC_01242005.jpg",""],["E:photos-earlier/PSC_01242005zoom2.jpg",""]],"h":"The cataract changes are confined primarily to the posterior capsule. Only minimal changes exist in the anterior, inferior capsule. Note the absence of nuclear changes. This patient is a diabetic male whose vision decreased dramatically over the course of about a month. Glare was a significant complaint.","u":"pages/Posterior-subcapsular-cataract-2.html","cr":"Jordan Graff, MD","src":"er"},{"t":"Posterior subcapsular cataract--retroillumination","im":[["E:photos/cataract/Cataract21.jpg","Posterior subcapsular plaque - red reflex"]],"h":"Posterior subcapsular plaque - red reflex","u":"pages/Posterior-subcapsular-cataract-retroillumination.html","cr":"Jordan Graff, MD","src":"er"},{"t":"Posterior subcapsular cataract","im":[["E:photos-earlier/PSC-cataract.jpg","Thin fibrotic membrane on the posterior lens capsule. Seen commonly in diabetic patients and after pars plana vitrectomy."],["E:photos/posterior_subcapsular_catartact/Fig1a-posterior-subcapsular-cataract.jpg",""],["E:photos/posterior_subcapsular_catartact/Fig1b-posterior-subcapsular-cataract.jpg",""]],"h":"Nicole Radunzel A 53-year-old female with a past medical history of Type 1 diabetes mellitus presented for blurry vision in her left eye. On exam, she was noted to have granular lenticular opacities adjacent to the posterior capsule of the natural crystalline lens in the right eye. A diagnosis of posterior subcapsular cataract (PSC) was made. Factors such as diabetes mellitus, chlorpromazine use, or corticosteroids increase the risk of PSC formation. [1] In comparison to other cataract types, glare and decreased near acuity may be more common presenting symptoms. These types of cataracts are best viewed with slit lamp biomicroscopy retroillumination; care should be taken to achieve line of focus on the posterior capsule, or the cataract can be readily missed.","u":"pages/posterior-subcapsular-cataract.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Nuclear sclerotic cataract","im":[["E:pages/Nuclear-sclerotic-cataract/NSC-LRG.jpg",""],["E:pages/Nuclear-sclerotic-cataract/NSC-slit-LRG.jpg",""]],"h":"The patient was a 57-year-old man with vision loss in the right eye (OD) greater than left eye (OS) in the setting of a craniopharyngioma, which was resected 16 years prior. His visual acuity had been no light perception OD and 20/20 OS since the procedure.","u":"pages/Nuclear-sclerotic-cataract/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Brunescent cataract, mature","im":[["E:photos/cataract/brunescent-cataract.jpg",""]],"h":"Updated: March 24, 2017 A brunescent, or brown, cataract is often correlated with the maturity of a cataract and can cause decreased visual acuity. Brunescent cataracts can cause poor contrast and color discrimination, especially at the blue end of the visible light spectrum. Brunescent cataracts may also have surgical implications, as complication rates for mature, brunescent cataracts, such as posterior capsular tear, are higher compared to other cataracts. Dense cataracts often require longer surgery times, which may compromise the corneal endothelium and result in significant post-operative inflammation. Notice there is liquefaction of the lens.","u":"pages/brunescent-cataract-mature.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Brunescent cataract","im":[["E:photos/cataract/brunescent-cataract-(1).jpg",""],["E:photos/cataract/brunescent-cataract-(2).jpg",""],["E:pages/imgs/R_5TVzZ5QGZsIAPuh_brunescent%20cataract%201.png",""]],"h":"Sarah Skiles, CRAPosted: 06/03/2024A 74-year-old man presented for cataract surgery consultation. On exam, there were red colored dense lenticular opacities consistent with brunescent nuclear sclerotic changes. Special considerations for cataract surgery in these patients include an anticipation that a lot of phacoemulsification energy will need to be employed. Alternatives include extracapsular cataract surgery or manual small incision cataract surgery.","u":"pages/Brunescent-cataract.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Mature Cataract","im":[["E:photos/cataract/advanced-cataract.jpg","Mature Cataract removed via ECCE."],["E:photos-earlier/mature-cataract.jpg","Patient with light perception vision from dense cataract."],["E:photos-earlier/NLPCataractOS.jpg","This patient with mature cataract (nuclear sclerotic and cortical changes) had only bare light perception vision."]],"h":"Mature Cataract removed via ECCE. Patient with light perception vision from dense cataract. This patient with mature cataract (nuclear sclerotic and cortical changes) had only bare light perception vision.","u":"pages/Mature-Cataract.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Mature cortical cataract","im":[["E:LARGE/mature-cortical-LRG.jpg",""],["E:photos/mature-cortical-2.jpg",""]],"h":"In a mature cortical cataract, also known as a \"white cataract,\" the entire lens cortex has become opacified. Water clefts are visible as less opaque radial wedges within the lens. These lenses can swell as a result of increased water uptake, at which point they are called intumescent cataracts.","u":"pages/mature-cortical-cataract.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Morgagnian cataract","im":[["E:pages/Morgagnian/Morgagnian-LRG.jpg",""],["E:pages/Morgagnian/Morgagnian-2-LRG.jpg",""]],"h":"Morgagnian cataracts are advanced cortical cataracts in which the nucleus is freely mobile within liquefied cortex. In this photo, a brunescent nucleus can be seen sunken to the bottom of the capsular bag with the white, liquefied cortex visible superiorly.","u":"pages/Morgagnian/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Morgagnian Cataract","im":[["E:photos/cataract/Morgagnian-Cataract-1.JPG",""],["E:photos/cataract/Morgagnian-Cataract-2.JPG",""]],"h":"59-year-old female with decreased vision secondary to Morgagnian cataract. See Related EyeRounds case: Maltry AC, Kitzmann AS. Morgagnian cataract. EyeRounds.org. January 13, 2012; Available from https://eyerounds.org/cases/146-Morgagnian-Cataract.htm. A Morgagnian cataract is one that has crossed the state of maturity and has become \"hypermature\".","u":"pages/morgagnian-cataract-146.html","cr":"Amanda Maltry, MD","src":"er"},{"t":"Morgagnian cataract with absent cortex","im":[["W:LARGE/morgagnian-2013-1-L.jpg",""],["W:LARGE/morgagnian-2013-2-L.jpg",""]],"h":"A Morgagnian cataract is a hypermature cataract in which there is typically liquefaction of the lens cortex with dense sclerosis of the nucleus. This presentation is typical for the brunescent lens nucleus that is inferiorly displaced within the capsule, but atypical in that there is no lens cortex remaining, the previously liquified cortex has migrated through the intact capsule, leaving only a sunken, hard nucleus in an empty capsular bag","u":"pages/morgagnian-cataract-absent-cortex.htm","cr":"Christopher A. Kirkpatrick, MD and Anna Kitzmann, MD","src":"er"},{"t":"Oil droplet cataract","im":[["E:photos-earlier/oil-droplet-cataract.jpg","45-year-old with slow, progressive loss of vision in both eyes (20/200). Pinholes to 20/25 but cannot be refracted. Retinoscopy shows oil droplet cataract. Slit lamp shows a black, empty space between lens cortex and lens nucleus. Difficult to see without looking at the red reflex."],["E:pages/imgs/OilDroplet_Diffuse_Illumination_PHS.jpg","Diffuse illumination slit lamp photograph of an oil-droplet cataract showing central nuclear yellow opacity of the lens with dark clearing surrounding the oil-droplet."],["E:pages/imgs/OilDroplet_Optical_Cross_Section_PHS.jpg","Optical section slit lamp photograph of the right eye showing a 3+ oil-droplet cataract with the central yellow opacified nucleus surrounded by an area of dark clearing followed by the cortical and capsular layers anteriorly."]],"h":"The patient was a 57-year-old man with vision loss in the right eye (OD) greater than left eye (OS) in the setting of a craniopharyngioma, which was resected 16 years prior. His visual acuity had been no light perception OD and 20/20 OS since the procedure. Oil droplet cataract Oil droplet cataract Category(ies): Cataract, Lens Contributors: Peter H. Sanchez, MD, and Ryan J. Diel, MD Photographer: Alex Steggall 39 y/o female presented for evaluation of blurry vision in the right eye and difficulties with glare at night. She denied any history of ocular trauma, diabetes, or steroid use. Her uncorrected visual acuity OD was 20/1250 with improvement to 20/200 with pinhole. Uncorrected OS was 20/20-1. Her subjective refraction was -15.50 +1.00 x 137 OD (20/150) and -0.50 +0.50 x 090 OS (20/20). Her exam was notable for a 3+ oil-droplet cataract OD. Lens-calculations were performed and showed axial eye-lengths of 23.05 mm OD and 22.94 mm OS. She was offered cataract extraction with intraocular lens implantation. Oil droplet cataract Oil droplet cataract Category(ies): Cataract, Lens Contributors: Nicolas J. Heckenlaible, MD and Ryan J. Diel, MD Photographer: Alexandra D. Copple, CRA A 67-year-old woman presents for evaluation of gradually progressive blurred vision, both at near and distance, as well as bothersome nighttime glare. She has no history of trauma, diabetes, or steroid use, and no ocular history besides refractive error and corneal astigmatism. Visual acuity in the presented eye is 20/200 with correction, 20/70-2 with pinhole, and >20/400 with glare. Her exam was notable for 2+ oil droplet cataract. She received corneal topography and IOL calculations and was ultimately offered cataract extraction with toric intraocular lens implantation.","u":"pages/oil-droplet-cataract.html","cr":"Andrew Doan, MD, PhD The patient was a 57-year-old man with vision loss in the right eye (OD","src":"er"},{"t":"\"Y-suture\" Cataract","im":[["E:photos/Y-suture-cataract.jpg",""]],"h":"This is a 46-year-old male with a promient Y-suture cataract. This is a congenital lens opacity that occurs at the location of closure of the fetal lenticular nucleus. The anterior sutures are in the shape of a Y and the posterior sutures are an inverted Y. These are rarely visually signficant.","u":"pages/y-suture-cataract.htm","cr":"Matt Ward, MD","src":"er"},{"t":"Cataract with refractile bodies","im":[["E:photos-earlier/refractile-cataract.jpg","Cataract with refractile bodies (Andrew Doan, MD, PhD)"],["E:photos-earlier/Lens_RefractileBodies1.jpg","Cataract with refractile bodies (ordan M. Graff, M.D)"],["E:photos-earlier/Lens_RefractileBodies2.jpg","Cataract with refractile bodies (ordan M. Graff, M.D)"]],"h":"Cataract with refractile bodies (Andrew Doan, MD, PhD) Cataract with refractile bodies (ordan M. Graff, M.D)","u":"pages/cataract-with-refractile-bodies.html","cr":"Andrew Doan, MD, PhD and Jordan Graff, MD","src":"er"},{"t":"Chlorpromazine-induced cataract","im":[["E:pages/chlorpromazine-cataract/chlorpromazine-cataract-LG.JPG",""],["E:pages/chlorpromazine-cataract/chlorpromazine-cataract2-LG.JPG",""]],"h":"Stellate, anterior subcapsular cataract with granular, brown deposits along the suture lines in a patient taking chlorpromazine.","u":"pages/chlorpromazine-cataract/index.htm","cr":"Jaclyn Haugsdal, MD","src":"er"},{"t":"Traumatic rosette cataract","im":[["E:photos-earlier/rosettecataractredglow13.jpg",""]],"h":"Dr. Swaranjit Singh Bhatti, Bhatti Eye Clinic This is a traumatic rosette cataract seen in fundal retroillumination (against the fundal red glow) on the slit lamp.The leaf like \"rosette\" pattern is pathognomonic of a traumatic cataract and the clear zone outside the affect lens lamellae indicate that the trauma occurred several years before as clear lens fibres have been laid down in the periphery subsequently.","u":"pages/traumatic-rosette-cataract.html","cr":"Dr. Swaranjit Singh Bhatti, Bhatti Eye Clinic This is a trau","src":"er"},{"t":"Unique Electric Cataract","im":[["E:pages/imgs/R_6DZgDi4gTSONRVL_2days_electric_cataract.jpg","Slit lamp photo at two days post injury."],["E:pages/imgs/R_6DZgDi4gTSONRVL_6mon_electric_cataract.jpg","Slit lamp photo at six months post injury."]],"h":"Slit lamp photos of a 32-year-old male with cataracts sustained after 270-volt electrocution injury. The cataracts appeared as a ring within the lens nucleus in a circumferential pattern following the natural lens architecture. Patient had no subjective visual symptoms. Appearance of the cataracts was stable at 2 days and 6 months post injury. The patient has no known history of congenital cataracts; however, a baseline exam was not available.","u":"pages/electric-cataract.htm","cr":"Thomas D. Meram, MD; Ryan J. Diel, MD","src":"er"},{"t":"Lens Fluting","im":[["E:pages/Lens-Fluting/lens-fluting-LRG.jpg",""]],"h":"A true excessively flat soft contact lens (or soft contact lens skirt as is the case in this hybrid lens) may have too much material to rest all of its surface touching the conjunctiva. The extra or excess material can \"flute\" up causing a wrinkle at the edge of the lens and/or a bubble. Such a lens is generally uncomfortable because it moves excessively with the blink and because the eyelids hit that elevated material as they traverse the surface of the eye.","u":"pages/Lens-Fluting/index.htm","cr":"Tressa Larson OD","src":"er"},{"t":"Ectopia lentis in Marfan's syndrome","im":[["E:photos/ectopia-lentis-marfan-syn.JPG","This patient had mature cataractous lenses in both eyes that had dislocated completely and were freely floating in the vitreous. Of interest, he experienced severe vision loss when lying down as the lenses settled over his macula. Due to significant axial myopia, he only required +4.00 D of lens correction in each eye to achieve 20/20 acuity. Now that's a body that knows how to take care of itself!"]],"h":"This patient had mature cataractous lenses in both eyes that had dislocated completely and were freely floating in the vitreous. Of interest, he experienced severe vision loss when lying down as the lenses settled over his macula. Due to significant axial myopia, he only required +4.00 D of lens correction in each eye to achieve 20/20 acuity. Now that's a body that knows how to take care of itself!","u":"pages/ectopia-lentis-marfan-syn.html","cr":"Matt Ward, MD","src":"er"},{"t":"Marfan's Syndrome","im":[["E:photos-earlier/Marfan_022005sublux1.jpg","Lens subluxation is readily evident in this dilated view of a patient with Marfan's syndrome."],["E:photos-earlier/Marfan_022005Lens1.jpg","This close view of the subluxed lens allows visualization of the zonules."],["E:photos-earlier/Marfan_022005LensesOU.jpg","Both lenses are seen here, side by side. Supero-temporal dislocation of the lens is evident in both eyes."]],"h":"Lens subluxation is readily evident in this dilated view of a patient with Marfan's syndrome. This close view of the subluxed lens allows visualization of the zonules. Both lenses are seen here, side by side. Supero-temporal dislocation of the lens is evident in both eyes.","u":"pages/Marfans-Syndrome.html","cr":"Jordan Graff, MD","src":"er"},{"t":"Crystalline Lens Subluxation With Absence of Zonules","im":[["E:pages/imgs/subluxation_1.webp","Superonasal crystalline lens subluxation with absent zonules"],["E:pages/imgs/subluxation_2.webp","Superonasal subluxation of crystalline lens with absent zonules and posterior subcapsular cataract"]],"h":"Al Salama, Najlaa A 34-year-old highly myopic (-9.50 D OD) patient presented with presumed traumatic subluxation of the phakic lens in the right eye. The patient denied prior ocular trauma; however, clinical findings raised a strong suspicion for occult remote trauma. Slit lamp examination demonstrated superonasal lens subluxation with at least 180 degrees of absent zonular support. The lens contour was not truncated, arguing against a congenital lens coloboma. Additionally, focal inferotemporal iridodonesis was present in the area of zonular loss, which is atypical for coloboma. Trace phacodonesis was noted. The iris was slightly ovoid toward 1:30 without transillumination defects. A 2+ superonasal posterior subcapsular cataract and epicapsular stars were observed. Findings are most consistent with traumatic superonasal subluxation of the crystalline lens in a high myope with significant zonular dialysis and associated cataract.","u":"pages/Crystalline-Lens-Subluxation-Absence-Zonules.htm","cr":"Caitlin M. Hackl MD, Patrick J. Donegan MD, Ryan J. Diel MD","src":"er"}]},{"n":"Trauma & foreign bodies","b":"Chemical and thermal burns, foreign bodies and penetrating injury.","items":[{"t":"Alkali chemical burn","im":[["E:pages/Alkali-chemical-burn/alkali-1-LRG.jpg",""],["E:pages/Alkali-chemical-burn/alkali-2-LRG.jpg",""]],"h":"This patient experienced a severe alkali chemical injury resulting in corneal opacification, pannus, and symblepharon formation. These photographs were taken 6 months after the injury.","u":"pages/Alkali-chemical-burn/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Chemical burn","im":[["E:photos/alkali-burn.jpg",""]],"h":"","u":"pages/chemical-burn.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Thermal corneal burn","im":[["E:photos/cornea-misc/Corneal-burn-1.jpg",""],["E:photos/cornea-misc/Corneal-burn-2.jpg",""],["E:photos/cornea-misc/Corneal-burn-3.jpg",""]],"h":"Randy Verdick, FOPS This 68-year-old female presented a few hours after accidentally touching her eye with a hot curling iron. Her visual acuity was 20/200 and she had a very large area of opacified, irregular corneal epithelium which was loose in some areas. We applied an antibiotic ointment and placed a pressure patch. The next day, her visual acuity was 20/70 and there was a moderate epithelial defect, but a large portion of previously opacified epithelium had completely cleared. We placed a bandage contact lens and treated her with topical antibiotic drops. At one week, her visual acuity had returned to baseline and her cornea appeared clear without stromal scarring.","u":"pages/corneal-burn-thermal.htm","cr":"Justin Risma, MD","src":"er"},{"t":"Metallic corneal foreign body","im":[["E:pages/metallic-FB-cornea/metallic-FB-LRG.jpg","This photograph shows a metallic foreign body lodged within corneal stroma."],["E:pages/metallic-FB-cornea/metallic-FB-slit-LRG.jpg","The depth of penetration is visible in the slit beam."]],"h":"This photograph shows a metallic foreign body lodged within corneal stroma. The depth of penetration is visible in the slit beam.","u":"pages/metallic-FB-cornea/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Corneal foreign body","im":[["E:photos/fb.jpg",""]],"h":"","u":"pages/corneal-foreign-body.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Foreign body","im":[["E:photos/farmer/FarmerConjFB2.jpg","This farmer had been bothered by red eye, foreign body sensation, tearing, and irritation for several days."],["E:photos/farmer/FarmerConjFB.jpg","The localized conjunctival and epithelial defect suggested a focal irritant."],["E:photos/farmer/FarmerConjFB3.jpg","The tiny shred of a thistle is evident on the tarsal surface of the upper lid."]],"h":"This farmer had been bothered by red eye, foreign body sensation, tearing, and irritation for several days. The localized conjunctival and epithelial defect suggested a focal irritant. The tiny shred of a thistle is evident on the tarsal surface of the upper lid.","u":"pages/foreign-body.html","cr":"Jordan Graff, MD","src":"er"},{"t":"Ferrous foreign body: Rust ring","im":[["E:photos/FerrousFB_RustRing1.jpg",""],["E:photos/FerrousFB_RustRing2.jpg",""]],"h":"","u":"pages/Ferrous-foreign-body-Rust-ring.html","cr":"Jordan M. Graff, MD","src":"er"},{"t":"Subconjunctival metallic foreign body","im":[["E:pages/Foreign-Body-Subconj/Metallic-subconj-FB2-LRG.jpg","This patient presented with a subconjunctival metallic foreign body after working on metal without safety glasses. The foreign body was removed at the slit lamp."]],"h":"This patient presented with a subconjunctival metallic foreign body after working on metal without safety glasses. The foreign body was removed at the slit lamp.","u":"pages/Foreign-Body-Subconj/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Subconjunctival foreign bodies","im":[["E:pages/Subconj-FB/subconj-fb-LRG.jpg",""]],"h":"This patient was referred for the evaluation of a pigmented conjunctival lesion, but upon examination he was found to have multiple black subconjunctival foreign bodies. These presumably were embedded during a motorcycle accident years prior.","u":"pages/Subconj-FB/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Siderosis bulbi","im":[["E:photos/iris-siderosis/acquired-hyperchromic-heterochromia-OD-1.jpg",""],["E:photos/iris-siderosis/acquired-hyperchromic-heterochromia-OD-2.jpg",""],["E:pages/siderosis-bulbi/1-siderosis-LRG.jpg",""]],"h":"February 13, 2023 These external photographs demonstrate an acquired hyperchromic heterochromia due to a traumatic intraocular iron foreign body in the right eye. Chronic deposition of iron within the iris stroma resulted in the gradual darkening of the native light-colored iris. Entry #2 Contributor: Justin Risma, MD Photographer: Ed Heffron Siderosis bulbi is caused by retention and oxidation of an iron-containing intraocular foreign body. Clinical features include cataract, rust-colored anterior subcapsular deposits, iris heterochromia (affected side is darker), pupillary mydriasis, and depressed electroretinogram (ERG) amplitudes. Other potential sequelae include pigmentary retinopathy, retinal microangiopathy, and open-angle glaucoma. If the cataract and foreign body are removed and there is no macular trauma, the visual prognosis is excellent. These photos demonstrate iris heterochromia and rust-colored anterior subcapsular deposits in a patient with a history of metal-on-metal ocular trauma. An iris defect and a full-thickness corneal wound are also present inferiorly.","u":"pages/siderosis-bulbi/index.htm","cr":"Joanna IM. Silverman, MD; Timothy M. Boyce, MD","src":"er"},{"t":"Penetrating ocular trauma","im":[["E:pages/Penetrating-ocular-trauma/cornea-LRG.jpg",""],["E:pages/Penetrating-ocular-trauma/cornea-1-LRG.jpg",""]],"h":"Brice Critser This 37 year-old-male was using a compressed air wire wheel brush when a wire came loose and was lodged in the cornea. He was not wearing safety glasses. The wire was removed in the operating room where it was found to penetrate fully through the cornea and required one corneal suture. Interestingly, the wire was removed about three hours after this incident and a rust ring had already formed. The vision at last exam was 20/40 and no signs of infection were present.","u":"pages/Penetrating-ocular-trauma/index.htm","cr":"Penetrating ocular trauma","src":"er"},{"t":"Descemet's membrane rupture secondary to forceps injury","im":[["E:pages/forceps-injury/Forceps-scar-LRG.jpg","This photograph shows obliquely-oriented ruptures in Descemet's membrane resulting from forceps injury in a 4-year-old girl. The patient had anisometropic amblyopia."]],"h":"Birth trauma from forceps delivery can cause breaks in Descemet's membrane and secondary corneal edema. The edema usually clears over time, but the ruptures in Descemet's membrane persist. The residual corneal changes can result in anisometropia and the main cause of vision loss after such an injury is anisometropic amblyopia. Descemet's membrane ruptures from forceps injury tend to be oriented vertically or obliquely, while those secondary to congenital glaucoma (Haab's striae) are most commonly horizontal.","u":"pages/forceps-injury/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Adherent leukoma and epithelial inclusion cyst after penetrating trauma","im":[["E:pages/Adherent-Leukoma/adherent-leukoma-iris-cyst-BC-LRG.jpg","A dense corneal opacity with the incorporation of iris tissue"],["E:pages/Adherent-Leukoma/sp-mini-pkp-RV-LRG.jpg","The wound was found to be Seidel positive and a mini-penetrating keratoplasty (mini-PKP), was performed. The iris cyst was later aspirated and ethanol was injected into the capsule to prevent regrowth."],["E:pages/Adherent-Leukoma/Adherent-leukoma-post-LRG.jpg","The patient has maintained 20/25 acuity postoperatively with minimal regrowth of the cyst."]],"h":"A dense corneal opacity with the incorporation of iris tissue The wound was found to be Seidel positive and a mini-penetrating keratoplasty (mini-PKP), was performed. The iris cyst was later aspirated and ethanol was injected into the capsule to prevent regrowth. The patient has maintained 20/25 acuity postoperatively with minimal regrowth of the cyst.","u":"pages/Adherent-Leukoma/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Traumatic aniridia and cataract","im":[["E:photos/Traumatic-aniridia-cataract/traumatic-aniridia-cataract-LRG.jpg",""],["E:photos/Traumatic-aniridia-cataract/traumatic-aniridia-cataract-2-LRG.jpg",""]],"h":"59-year-old male with past ocular history of radial keratotomy (RK) in both eyes, presented to our clinic after sustaining an injury to his right eye with a wrench. Initially there was nearly a complete hyphema and no view of iris, lens, or posterior pole. B scan echography did not show any posterior pathology. Several months later, after the hyphema had resolved, the patient returned with the exam seen below. His vision was hand motions at this time and he was noted to have a traumatic cataract in the right eye. Interestingly, the iris was noted to be missing on exam. There was no evidence of even a small iris stump on gonioscopy. Previous photos of the patient confirmed that he did, at one time, have both a clear lens and complete iris. He was also noted to have pigment on his RK scars. After discussion amongst several faculty, the current hypothesis is that he may have had an open globe with the initial injury, and the iris may have prolapsed through one of his RK scars. This may have been inadvertently wiped from the eye by the patient, prior to his seeking medical care. The RK wound may have then self-sealed. This patient was referred to another ophthalmologist for cataract extraction and insertion of a pupillary prosthesis.","u":"pages/traumatic-aniridia-cataract.htm","cr":"Elizabeth Gauger, MD","src":"er"},{"t":"Traumatic cataract with iridodialysis and lens coloboma","im":[["E:LARGE/traumatic-cataract-LRG.jpg",""]],"h":"This is a traumatic cataract with an iridodialysis (separation of the iris from it's attachment to the ciliary body) from a blunt injury during childhood. There is an anterior cortical cataract with evidence of capsular compromise and adhesion of the displaced iris to this area. There is also a lens pseudo-coloboma (lessened convexity along the equator) inferotemporally secondary to zonular dehiscence (not shown).","u":"pages/traumatic-cataract-iridodialysis.htm","cr":"Christopher A Kirkpatrick, MD","src":"er"},{"t":"Iridodialysis and traumatic cataract after firecracker injury","im":[["E:photos/Iridodialysis-traumatic-cataract-firecracker.PNG",""]],"h":"Iridodialysis is the result of a tear in the iris root. It may be repaired surgically or with cosmetic contact lenses if large or symptomatic. This cataract's rosette pattern is classically seen after contusion injuries. It is due to separation of lens fibers around lens sutures.","u":"pages/Iridodialysis-traumatic-cataract-firecracker.htm","cr":"Jesse Vislisel, MD","src":"er"}]},{"n":"After surgery","b":"Grafts, refractive surgery, keratoprostheses, IOLs and post-operative findings.","items":[{"t":"Penetrating keratoplasty (PK)","im":[["E:pages/PK/2A-LRG-POM3-sp-PKP-for-KCN.jpg","Interrupted sutures"],["E:pages/PK/2B-LRG-POM12-sp-PKP-for-ulcer-scar.jpg","Interrupted sutures"],["E:pages/PK/2C-LRG-PKP-running.jpg","Running Sutures"]],"h":"(D) These images show the post-operative appearance of 4 different patients after penetrating keratoplasty (PK), or full-thickness corneal transplantation. PK grafts may be secured using interrupted sutures (A, B), running sutures (C), or a combination of both (D). Sutures are usually removed during the post-operative period. Grafts may remain clear for decades with proper care, as seen in this patient 30 years after the procedure with all sutures removed (E, F). Read the related article for more information regarding modern corneal transplantation techniques.","u":"pages/PK/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Donor cornea prepared for penetrating keratoplasty (PK) transplantation","im":[["E:pages/Donor-cornea-for-PK/Donor-cornea-LRG.jpg","donor cornea has been prepared for penetrating keratoplasty (PK)"]],"h":"Chase Liaboe This donor cornea has been prepared for penetrating keratoplasty (PK) and placed in storage media. Read the related article for more information regarding the selection and preparation of tissue for corneal transplantation.","u":"pages/Donor-cornea-for-PK/index.htm","cr":"Chase Liaboe, Jesse Vislisel, MD","src":"er"},{"t":"Kaye dots in a penetrating keratoplasty graft","im":[["E:pages/Kaye-dots/kaye-dots-LRG.jpg",""]],"h":"Kaye dots are white punctate epithelial opacities located in the epithelium anterior to the suture line of a corneal graft. The dots represent epithelial cells in various stages of degeneration on histopathology and it has been hypothesized that they may result from an epithelial response to the area of tissue angulation. Kaye dots are not visually significant and do not bear any clinical significance.","u":"pages/Kaye-dots/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Khodadoust Line (Corneal Endothelial Rejection)","im":[["W:photos/Khodadoust-line/Khouda1-LRG.jpg",""],["W:photos/Khodadoust-line/Khouda2-LRG.jpg",""],["E:pages/Khodadoust2/Khadadoust-line-scatter-LRG.jpg",""]],"h":"Jody Troyer This is another example of a Khoudadoust line (endothelial rejection) in a patient with a long-standing penetrating keratoplasty. A slitlamp photograph using sclerotic scatter technique demonstrates inferior to superior progression of endothelial rejection with keratitic precipitates at the leading edge. The overlying stroma is hazy and edematous with evident Descemet's folds due to acute endothelial dysfunction. The uninvolved superior corneal stroma is compact and clear Khodadoust Line Khodadoust Line Contributor: Jeffrey Welder, MD; Matthew Raecker, MD Photographer: Brice Critser, CRA A 24-year-old female presented with acute allograft rejection after self-discontinuing her topical steroid drops after penetrating keratoplasty for keratoconus. The figure shows corneal decompensation with inferior corneal edema and haze and a faint horizontal endothelial linear opacitiy which is more distinct with sclerotic scatter lighting. This opacity is a rejection line consistent of white blood cells on the endothlium and is also known as a Khodadoust line. This sign represents graft rejection and if left untreated will march across the graft. Khodadoust Line (Corneal Endothelial Rejection) Khodadoust Line (Corneal Endothelial Rejection) Contributor: Elizabeth Gauger, MD Photographer: Brice Critser, CRA 56-year-old female status post full-thickness corneal transplant presented to our clinic with signs of endothelial cell rejection. This can be seen clinically as a Khodadoust line (arrow), which represents white blood cells on the endothelium. This \"rejection line\" usually begins in one area of the cornea and marches across the endothelium over time. In this particular patient, the rejection line began inferonasally and has now migrated all the way to the superior cornea. One can see that the cornea inferior to the line is much more edematous and hazy as compared with the cornea superior to the Khodadoust line, where the cornea is still relatively clear and the endothelium relatively unaffected. The slit beam is shown to illustrate that this line is indeed on the corneal endothelium. Khodadoust LineKhodadoust LineCategory(ies): Cornea / External Eye Disease, UveitisContributor: Mahsaw Mansoor, MDPhotographer: Sarah Skiles, CRAPosted: 06/04/2024A 21-year-old female presented with acute worsening of vision after full-thickness corneal transplant in the right eye. Her medical history was pertinent for recent influenza vaccination. On exam, there were signs of endothelial rejection with keratic precipitates in a linear fashion on the endothelium, commonly known as a Khodadoust line after Iranian ophthalmologist, Dr. Ali Khodadoust. Superior progression of endothelial rejection with keratitic precipitates at the leading edge.","u":"pages/Khodadoust2/index.htm","cr":"Lorraine Provencher, MD; Tara McGehee, MD","src":"er"},{"t":"Khodadoust Line (Corneal Endothelial Rejection)","im":[["E:photos/Khodadoust-line/Khodadoust-slit-LARGE.JPG",""],["E:photos/Khodadoust-line/Khodadoust-ext-LRG.JPG",""],["E:photos/Khodadoust-line/Khodadoust-closer-LRG.JPG",""]],"h":"56-year-old female status post full-thickness corneal transplant presented to our clinic with signs of endothelial cell rejection. This can be seen clinically as a Khodadoust line (arrow), which represents white blood cells on the endothelium. This \"rejection line\" usually begins in one area of the cornea and marches across the endothelium over time. In this particular patient, the rejection line began inferonasally and has now migrated all the way to the superior cornea. One can see that the cornea inferior to the line is much more edematous and hazy as compared with the cornea superior to the Khodadoust line, where the cornea is still relatively clear and the endothelium relatively unaffected. The slit beam is shown to illustrate that this line is indeed on the corneal endothelium. Contributor: Lorraine Provencher, MD and Tara McGehee, MD Photographer: Jody Troyer This is another example of a Khoudadoust line (endothelial rejection) in a patient with a long-standing penetrating keratoplasty. A slitlamp photograph using sclerotic scatter technique demonstrates inferior to superior progression of endothelial rejection with keratitic precipitates at the leading edge. The overlying stroma is hazy and edematous with evident Descemet's folds due to acute endothelial dysfunction. The uninvolved superior corneal stroma is compact and clear","u":"pages/khodadoust-line.htm","cr":"Elizabeth Gauger, MD","src":"er"},{"t":"Descemet Membrane Endothelial Keratoplasty (DMEK)","im":[["E:pages/DMEK/8A-LRG-sp-DMEK-for-Fuchs.jpg","post-operative appearance of patientd who underwent DMEK for Fuchs endothelial corneal dystrophy at 1 week post-operatively with residual anterior chamber gas bubbles"],["E:pages/DMEK/8B-LRG-sp-DMEK-for-Fuchs-slit-2.jpg","post-operative appearance of patientd who underwent DMEK for Fuchs endothelial corneal dystrophy at 1 week post-operatively with residual anterior chamber gas bubbles"],["E:pages/DMEK/8C-LRG-sp-DMEK.jpg","post-operative appearance of patientd who underwent DMEK for Fuchs endothelial corneal dystrophy at 2 weeks post-operatively with complete resorption of the gas"]],"h":"Descemet Membrane Endothelial Keratoplasty (DMEK) is a partial-thickness cornea transplant procedure that involves selective removal of the patient's Descemet membrane and endothelium, followed by transplantation of donor corneal endothelium and Descemet membrane without additional stromal tissue from the donor.","u":"pages/DMEK/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Graft edge lift after Descemet's membrane endothelial keratoplasty (DMEK)","im":[["E:pages/DMEK-edge-lift/graft-edge-lift.jpg",""]],"h":"Descemet's membrane endothelial keratoplasty (DMEK) is a subtype of corneal transplantation in which a very thin donor lenticule consisting of Descemet's membrane and endothelium is transplanted into the recipient eye. During the surgery, a gas bubble is placed into the anterior chamber to press the graft against the posterior surface of the host cornea, resulting in adherence. Graft \"edge lift\" refers to non-adherence of peripheral areas of the graft. If the graft is oriented correctly with the endothelium facing toward the anterior chamber, it will roll, or scroll, toward the host corneal stroma. These photographs show an inferior edge lift of a DMEK graft, visible as a thin layer illuminated by the slit beam just deep to the corneal stroma with scrolling inferiorly. The anterior segment OCT shows another view of the edge lift.","u":"pages/DMEK-edge-lift/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Corneal edema with Descemet's membrane folds after DMEK","im":[["E:pages/D-folds-p-DMEK/D-folds-sp-DMEK-LRG.jpg",""],["E:pages/D-folds-p-DMEK/D-folds-sp-DMEK-guttae-LRG.jpg",""]],"h":"TThis patient had residual corneal edema with prominent Descemet's membrane folds visible on the posterior corneal surface on her first postoperative day after undergoing Descemet's membrane endothelial keratoplasty (DMEK). In the first photograph, the anterior chamber is 70% filled with SF6 gas and a superotemporal limbal suture can be seen. Anterior segment OCT verifies that the lenticule is in place and also shows the folds on the posterior corneal surface. After several days, the corneal edema eventually cleared and guttae were visible centrally in the graft tissue, consistent with Fuchs' endothelial dystrophy of the donor. These guttae are visible in the second photograph and this is likely the cause for delayed corneal clearing. Despite this, the patient still achieved 20/20 acuity.","u":"pages/D-folds-p-DMEK/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Acquired interface fluid after DSAEK graft rejection","im":[["E:pages/acquired-interface-fluid/acquired-interface-fluid-LRG.jpg",""],["E:pages/acquired-interface-fluid/acquired-interface-fluid-slit-LRG.jpg",""]],"h":"Interface fluid between a corneal endothelial graft and host cornea is commonly seen intraoperatively and in the immediate post-operative period, but resolves as the graft pumps fluid away from the interface. This patient had massive corneal edema after an episode of acute allograft rejection of her DSAEK graft, resulting in acquired fluid accumulation in the graft-host interface. This fluid is visible in the slit beam as a black crescent between the graft and host tissue.","u":"pages/acquired-interface-fluid/index.htm","cr":"Jesse Vislisel, MD; Mark Greiner, MD","src":"er"},{"t":"Candida growth within DSAEK interface","im":[["E:pages/Candida-DSAEK-interface/fungus-DSAEK-interface-LRG.jpg",""],["E:pages/Candida-DSAEK-interface/fungus-DSAEK-interface-SS-LRG.jpg",""],["E:pages/Candida-DSAEK-interface/fungus-DSAEK-interface-slit-LRG.jpg",""]],"h":"Performing routine corneal cultures on the donor corneal rim at the time of keratoplasty is controversial among corneal surgeons. This patient underwent Descemet stripping automated endothelial keratoplasty (DSAEK) for Fuchs corneal endothelial dystrophy and cultures on the donor rim grew Candida albicans. Three months after the procedure, the patient was noted to have Candida growth within the interface between the graft and host tissue despite prophylactic anti-fungal therapy. The fungus was resistant to further medical therapy and recurred after repeat DSAEK and intracameral voriconazole. He subsequently required a penetrating keratoplasty (PKP) which successfully eradicated the infection.","u":"pages/Candida-DSAEK-interface/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Graft-host interface candida infection after descemet stripping automated endothelial keratoplasty","im":[["E:photos/candida.png","This photo shows four small infiltrates present in the graft host interface of the right eye."]],"h":"This patient had a history of Fuchs' endothelial dystrophy. He underwent a descemet stripping automated endothelial keratoplasty (DSAEK) of the right eye. The donor cornea rim was cultured and found to be positive for candida. Despite treatment with topical amphoteracin B and oral fluconazole the patient developed infiltrates between the graft and host cornea. He had a repeat DSAEK with intracameral voriconazole. The pathology from the initial graft tissue confirmed budding yeast. Unfortunately, the candida returned in the subsequent graft host interface and the patient ultimately underwent full thickness cornea transplant.","u":"pages/Candida.htm","cr":"Angela McAllister, MD","src":"er"},{"t":"Deep Anterior Lamellar Keratoplasty (DALK)","im":[["E:pages/DALK/5-LRG-POM1-sp-DALK-for-KCN.jpg","The post-operative appearance of a patient who underwent DALK for keratoconus."],["E:pages/DALK/6-LRG-POY3-sp-DALK-for-KCN.jpg","A clear DALK graft 3 years after the procedure with all sutures removed."],["E:pages/DALK/2---DALK-99074863-400px.jpg","A clear DALK graft 3 years after the procedure with all sutures removed."]],"h":"Deep anterior lamellar keratoplasty (DALK) is a partial-thickness cornea transplant procedure that involves selective transplantation of the corneal stroma, leaving the native Descemet membrane and endothelium in place. Read the related article for more information regarding modern corneal transplantation techniques.","u":"pages/DALK/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Tectonic mini-penetrating keratoplasty (PKP)","im":[["E:pages/tectonic-mini-PKP/mini-pkp-LRG.jpg",""],["E:pages/tectonic-mini-PKP/mini-pkp-slit-LRG.jpg",""]],"h":"","u":"pages/tectonic-mini-PKP/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Penetrating sclerokeratoplasty","im":[["E:pages/Sclerokeratoplasty/sclerokeratoplasty-acanth-slit-LRG.jpg",""],["E:pages/Sclerokeratoplasty/sclerokeratoplasty-acanth-zoom-LRG.jpg",""]],"h":"Penetrating sclerokeratoplasty involves the transplantation of the entire cornea and adjacent scleral rim. This patient underwent the procedure for refractory acanthamoeba sclerokeratitis. The sutures holding the graft in place can be seen in the sclera around the graft. The pupillary margin is irregular secondary to central posterior synechiae from intraocular inflammation secondary to the infection. A glaucoma seton is visible in the anterior chamber superonasally.","u":"pages/Sclerokeratoplasty/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"RK (radial keratotomy)","im":[["E:photos-earlier/RK2_01312005.jpg",""]],"h":"","u":"pages/RK-radial-keratotomy.html","cr":"Jordan Graff, MD","src":"er"},{"t":"RK (radial keratotomy) with tear star","im":[["E:photos-earlier/RKtearStarIron2_20041.jpg",""],["E:photos-earlier/RKtearStarIron_20041.jpg",""]],"h":"The familiar radial incision lines of RK are visable. Additionally, in this case, a characteristic star-shaped iron deposit has formed centrally. This is called a \"tear star\" and occurs in some patients with RK. This tear star has no effect on vision.","u":"pages/RK-radial-keratotomy-with-tear-star.html","cr":"Jordan Graff, MD","src":"er"},{"t":"AK (astigmatic keratotomy)","im":[["E:photos/RKandAK1_VA2004h1027.jpg",""]],"h":"Radial corneal incisions have been made, as with standard RK. However, horizontal incisions were performed in this patient for astigmatic correction.","u":"pages/AK-astigmatic-keratotomy.html","cr":"Jordan M. Graff, MD","src":"er"},{"t":"Hexagonal Keratotomy","im":[["E:photos/hexagonal-keratotomy.jpg","This patient had also previously had radial and astigmatic keratotomy surgery in this eye with resultant corneal scars outside of the hexagonal keratotomy pattern in radial and transverse orientations."]],"h":"Hexagonal keratotomy is a historic refractive surgical technique in which six linear incisions are made into the stroma of the peripheral cornea in a hexagonal pattern that encircles the central cornea in an attempt to correct hyperopia.","u":"pages/Hexagonal-keratotomy.htm","cr":"Christopher Kirkpatrick, MD and Anna Kitzmann, MD","src":"er"},{"t":"Conductive keratoplasty (CK) scars","im":[["E:pages/conductive-keratoplasty/Conductive-keratoplasty-scars-LRG.jpg",""],["E:pages/conductive-keratoplasty/Conductive-keratoplasty-scars-slit-LRG.jpg",""]],"h":"Conductive keratoplasty (CK) is a refractive procedure in which regions of the cornea are heated to cause collagen shrinkage and change the corneal shape to correct mild to moderate hyperopia. This patient has multiple circular anterior stromal scars as evidence of his past conductive keratoplasty. Some of these scars are visible in these wide and narrow slit beam photographs.","u":"pages/conductive-keratoplasty/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Conductive Keratoplasty","im":[["E:pages/imgs/R_7dhuIxpQtR0wgPL_CK1.jpg",""],["E:pages/imgs/R_7dhuIxpQtR0wgPL_CK2.jpg",""]],"h":"A 65-year-old woman presented for routine eye evaluation. On clinical examination, there were round stromal scars in the peripheral cornea consistent with her history of prior conductive keratoplasty (CK). CK is a procedure that applies heat to the peripheral corneal stroma causing shrinkage and resultant central steepening. It can be used to treat low hyperopia and presbyopia. The peripheral round scars are well seen on retroillumination. \"","u":"pages/Conductive_Keratoplasty.html","cr":"Mahsaw Mansoor, MD","src":"er"},{"t":"Epikeratophakia","im":[["E:pages/Epikeratophakia/epikeratophakia-OD-LRG.jpg","OD - eye still has an epikeratophakia graft"],["E:pages/Epikeratophakia/epikeratophakia-OS-removed-LRG.jpg","OS - eye graft was later removed and an anterior chamber intraocular lens was placed"],["E:pages/Epikeratophakia/epikeratophakia-OD-slit-LRG.jpg","Slit Lamp - eye still has an epikeratophakia graft"]],"h":"When epikeratoplasty is performed in an aphakic patient, it is termed epikeratophakia. This is a historical refractive procedure in which the corneal epithelium is removed and a lathed donor lenticule is placed onto the recipient cornea and secured with sutures until it heals into place. It has been referred to as \"a living contact lens.\" It is no longer routinely performed given the advantages of modern laser refractive procedures. This patient is aphakic bilaterally secondary to removal of congenital cataracts as a child. He underwent the epikeratophakia procedure in both eyes 30 years prior to these photographs. The graft in the left eye was later removed and an anterior chamber intraocular lens was placed, though the original corneal scars from the epikeratoplasty are still visible in that eye. The right eye still has an epikeratophakia graft (easily visible on the anterior cornea in the slit beam photograph), but the vision is now limited by irregular astigmatism and corneal edema secondary to endothelial cell loss.","u":"pages/Epikeratophakia/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Grene Lasso after ALK","im":[["E:photos/Grene-lasso.jpg","This is a 53-year-old man who underwent automated lamellar keratectomy (ALK) in 1995 for myopia"]],"h":"ALK was in vogue in the pre-LASIK era (late 1980s) and consisted of a microkeratome free cap cut followed by a second lamellar excision (depth determined by a nomogram) of anterior stroma with the microkeratome to flatten the cornea after which the original cap was replaced. The procedure was notoriously unpredictable and in this case the patient had an over-correction which left him hyperopic. Dr. R. Bruce Grene described a procedure[1] in which two 10-0 Mersilene sutures were passed in purse-string fashion around the central cornea and tied down tight to vault the anterior cornea inducing myopia to treat hyperopic over-corrections after radial keratotomy (RK). This patient eventually had endothelial dysfunction for which a penetrating keratoplasty was performed. Endothelial keratoplasty could have been considered, but there was signficant irregular astigmatism and optical distortion with prior ALK and lasso that PKP was felt to provide the best vision. He is now 20/20 in the eye with an RGP contact lens.","u":"pages/Grene-Lasso-after-ALK.htm","cr":"Matthew Ward, MD","src":"er"},{"t":"Epithelial ingrowth after LASIK","im":[["E:pages/epithelial-ingrowth/Fig-1-epi-ingrowth-LRG.jpg","Nests of epithelium can be seen approaching the visual axis beneath the LASIK flap. This case occured after microkeratome-assisted LASIK and multiple enhancement procedures"],["E:pages/epithelial-ingrowth/epith-ingrowth-LASIK-LRG.jpg","Epithelial ingrowth after LASIK performed in the setting of epithelial basement membrane dystrophy. The patient developed edema of the LASIK flap and recurrent erosion syndrome, requiring lifting of the flap and removal of the epithelial ingrowth"],["E:pages/epithelial-ingrowth/epith-ingrowth-LASIK-OS-slit-LRG.jpg","Jesse Vislisel, MDPhotographer: Brice Critser, CRA"]],"h":"Epithelial ingrowth occurs when the corneal epithelial cells grow within the lamellar interface beneath the LASIK flap. This may result in an inflammatory response, corneal edema, irregular astigmatism, or melting of the LASIK flap. When mild and peripheral, it may be observed. When progressive or severe, the LASIK flap must be lifted and the epithelium scraped from the bed. Recurrent cases may require suturing of the LASIK flap.","u":"pages/epithelial-ingrowth/index.htm","cr":"Jesse Vislisel, MD and Matt Ward, MD","src":"er"},{"t":"Post-PRK Haze","im":[["E:photos/Post-PRK-haze.jpg",""]],"h":"44-year-old female who is status-post PRK in both eyes (2010) with enhancement in the right eye (OD) in 2011 for myopia. She presented with blurred vision OD to 20/25 from 20/20. Slit lamp examination revealed classic post-PRK haze centrally","u":"pages/post-PRK-haze-classic.htm","cr":"Jeffrey Welder, MD","src":"er"},{"t":"Intrastromal corneal ring segments","im":[["W:photos/intrastromal/intrastromal-corneal-rings.jpg",""],["W:photos/intrastromal/intrastromal-corneal-rings-2.jpg",""]],"h":"Toni Venckus These crescentic/semi-circular shaped ring segments are implanted into the midperipheral corneal stroma for the purpose of refractive error correction or management of keratoconus. In the era of improved laser refractive surgery techniques, these implants are no longer commonly used for refractive correction, but indications include correction of mild to moderate myopia by mechanism of flattening the central cornea by varying degrees depending on the size/thickness of ring segment implanted. These removable rings are implanted into the corneal stromal tunnel created by mechanical or femtosecond laser techniques.","u":"pages/intacs.htm","cr":"Christopher Kirkpatrick, MD, Anna Kitzmann, MD","src":"er"},{"t":"Orthokeratology","im":[["E:pages/orthokeratology/orthokeratology-top-LRG.jpg",""],["E:pages/orthokeratology/orthokeratology-bottom-LRG.jpg",""]],"h":"Orthokeratology is known variously as corneal molding, corneal reshaping therapy, vision shaping therapy and other monikers. In orthokeratology, typically a myopic eye is fitted with an rigid gas permeable lens that is very flat centrally, but has a reverse curve (steeper than the base curve) in the mid periphery. The lens then flattens and rearranges the corneal epithelium such that the shape of the anterior cornea changes from prolate to oblate. This results in a temporary reduction or elimination of myopic refraction. Users must wear the lenses for about eight hours at least every 2-3 nights to maintain the shape. The fit seen here is ideal: there is slight pooling in the area outside of the visual axis compared to the center and there is seal off adjacent to the periphery.","u":"pages/orthokeratology/index.htm","cr":"Tressa Larson OD","src":"er"},{"t":"AlphaCor keratoprosthesis","im":[["E:pages/Alphacor/AlphaCor-RPM-LRG.jpg","Photo credit: Tracy Aly, CRA"],["E:pages/Alphacor/AlphaCor-postop-LRG.jpg","Photo credit: Stephanie Karakas, CRA"],["E:pages/Alphacor/AlphaCor-postop-slit-LRG.jpg","Photo credit: Stephanie Karakas, CRA"]],"h":"The AlphaCor is a type of keratoprosthesis implant used for patients that are not candidates for traditional penetrating keratoplasty. In our practice at the University of Iowa, the Boston Keratoprosthesis (KPro) has now replaced the use of the AlphaCor. This patient developed a dense retroprosthetic membrane behind her AlphaCor keratoprosthesis, as visible in the first photograph. The latter photographs show the post-operative appearance after surgical removal of the membrane. For more information on modern keratoplasty techniques, read the related tutorial.","u":"pages/Alphacor/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Boston Keratoprosthesis (KPro) for congenital aniridia","im":[["https://webeye.ophth.uiowa.edu/eyeforum/cases-i/case211/L/3a-OS-TA-LRG.jpg",""],["https://webeye.ophth.uiowa.edu/eyeforum/cases-i/case211/L/3b-OD-LRG.jpg",""],["https://webeye.ophth.uiowa.edu/eyeforum/cases-i/case211/L/3c-OS-RR-LRG.jpg",""]],"h":"Congenital aniridia is a hereditary disease most commonly with autosomal dominant inheritance. These slit lamp photographs of a 12-year-old with congenital aniridia (Fig. 1 A, B) show conjunctivalization of the left cornea due to stem cell deficiency and a central corneal scar. There is iris hypoplasia in both eyes. The patient has a congenital cataract in the right eye and is aphakic in the left eye after having undergone cataract surgery. The cataract and corneal scars are more easily demonstrated on retroillumination. Also note the visible inferior border of the crystalline lens and zonules in the right eye, a feature not visible in individuals with normal irides. The lower photos (Fig. 2) show the appearance of the left eye after placement of a Boston Keratoprosthesis (KPro). Please see the related case report for more information about congenital aniridia.","u":"pages/KPro-for-aniridia/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Corneal melt around Boston type I keratoprosthesis","im":[["E:pages/kPro-melt/ASOCT-KPro-melt-1-LRG.jpg","Corneal melt with thinning of the tissue surrounding the device stem."],["E:pages/kPro-melt/ASOCT-KPro-melt-2-LRG.jpg","Corneal melt with tissue retraction away from the device stem (arrow)."]],"h":"Boston keratoprosthesis devices require regular monitoring to assess for the presence of complications such as infection and corneal melt. Anterior segment optical coherence tomography (OCT) is a useful study to assess for the presence of corneal thinning or melt. We regularly use OCT to monitor the status of the cornea around the device.","u":"pages/kPro-melt/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Boston Type 2 Keratoprosthesis (KPro)","im":[["E:pages/type-2-kpro/KPro2-LRG.jpg",""]],"h":"The Boston Type 2 Keratoprosthesis (KPro) is an artificial device used to replace the cornea in the setting of diseases with severe, recurrent scarring in which other types of corneal transplants are not a viable option. A complete tarsorrhaphy is performed and the polymethylmethacrylate (PMMA) optic of the device projects through an opening created in the upper eyelid. The device in this photograph was placed in a patient with severe ocular cicatricial pemphigoid (OCP). A surgical video demonstrating the placement of the Boston Type 2 KPro in a different patient with OCP can be seen.","u":"pages/type-2-kpro/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Candida infection of a Boston Type I Keratoprosthesis (KPro)","im":[["E:pages/Candida-kPro/candida-KPro-before-BC-LRG.jpg","Boston Type I Keratoprosthesis"],["E:pages/Candida-kPro/candidaKPro-SK-LRG.jpg","KPro with infected implant"],["E:pages/Candida-kPro/candida-KPro-slit-SK-LRG.jpg","Slitlamp view of Fig 2a"]],"h":"The Boston Type I Keratoprosthesis is a prosthetic corneal replacement used to restore vision in individuals with severe corneal disease and contraindications to traditional keratoplasty techniques. Like other artificial implants in the body, the KPro may be a nidus for infection. Fungal infections may occur around the device stem and appear milky-white, as seen in these photographs. Also shown is a photograph prior to the infection for comparison (figure 1).","u":"pages/Candida-kPro/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Anterior chamber intraocular lens (ACIOL) implant","im":[["E:pages/ACIOL/ACIOL-315-LRG.jpg","OS: AC IOL placed with iris bombe with no patent peripheral iridotomy"],["E:pages/ACIOL/ACIOL-369-LRG.jpg","OD: Bombe resolved after placement of post op Laser peripheral iridotomy (LPI) at 9 oclock. LPI was placed near haptic where iris was posterior to avoid corneal injury during the LPI procedure."]],"h":"OS: AC IOL placed with iris bombe with no patent peripheral iridotomy OD: Bombe resolved after placement of post op Laser peripheral iridotomy (LPI) at 9 oclock. LPI was placed near haptic where iris was posterior to avoid corneal injury during the LPI procedure.","u":"pages/ACIOL/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Artisan(claw) intraocular lens","im":[["E:photos/claw_artisan_lens.jpg",""]],"h":"This intraocular lens (seen here in the anterior chamber) is a versatile lens that can be implanted in the anterior chamber or the posterior chamber. Originating in Holland, as the Worst lobster claw lens (invented by Dr Jan Worst), and commonly used in India for about 30 yearsyrs, it has now been rediscovered as a refractive intraocular lens (the Verisyse lens) and renamed for regular use as the artisan lens","u":"pages/artisanclaw-intraocular-lens.html","cr":"Dr. Swaranjit Singh Bhatti, Bhatti Eye Clinic","src":"er"},{"t":"Verisyse phakic intraocular lens implant for high myopia","im":[["https://webeye.ophth.uiowa.edu/eyeforum/cases-i/case210/PIOL-Fig-2a-LRG.jpg","Slit lamp photograph of the Verisyse lens 1 year after surgery."],["https://webeye.ophth.uiowa.edu/eyeforum/cases-i/case210/PIOL-Fig-2b-LRG.jpg","Slit lamp photograph of the Verisyse lens 1 year after surgery."]],"h":"The Verisyse lens is an iris-fixated anterior chamber lens that is marketed as the Artisan lens outside of the US. It is a phakic intraocular lens implant for the correction of myopia. It is available as an alternative to laser refractive surgery and may be an option for patients who are poor candidates for laser surgery. These images show the appearance of a Verisyse lens implant in a patient with a preoperative refraction of -15.00 D.","u":"pages/Verisyse-phakic-IOL/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Visian Implantable Collamer Lens (ICL) implant","im":[["https://webeye.ophth.uiowa.edu/eyeforum/cases-i/case210/PIOL-Fig-3-LRG.JPG",""],["E:pages/Visian/Visian-LRG.JPG",""]],"h":"The Visian Implantable Collamer Lens (ICL) is a sulcus-supported phakic intraocular lens implant designed to be placed in the posterior chamber between the iris and natural crystalline lens. These photographs show the appearance of a Visian ICL used to correct myopia. The implanted lens can be seen in the slit beam (white arrow) just anterior to the natural crystalline lens (blue arrow). Read the related case report for more information about phakic intraocular lenses.","u":"pages/Visian/index.htm","cr":"Jesse Vislisel, MD, Tressa Larson, MA, OD","src":"er"},{"t":"EVO+ Visian Implantable Collamer Lens (ICL) Implant","im":[["E:pages/imgs/OD_Slit_Lamp_photo.png","Slit lamp examination of the right eye 1 month post-op demonstrates the inserted ICL in a 26-year old patient."],["E:pages/imgs/OS_Slit_Lamp_photo_2.png","Slit lamp examination of the left eye 1 month post-op demonstrates the inserted ICL in a 26-year old patient. The central port can be more clearly seen in this image."]],"h":"Implantable Collamer Lens (ICL) are a minimally invasive technique to correct myopia with or without astigmatism. Implantation of these devices is reversible and can be used in patients who do not qualify for corneal refractive procedures, such as LASIK or PRK. Traditional models require a peripheral iridotomy to permit aqueous humor flow and decrease risk of pupillary block or cataract formation. Approved by the Food and Drug Administration (FDA) in 2022, the EVO+ Visian ICL includes a 0.36 mm central port which intrinsically allows for aqueous humor flow, eliminating the need for peripheral iridotomy. Some patients report ring-shaped dysphotopsias from this central port. Neuroadaptation typically occurs 3-6 months after implantation. Reference: EVO ICL Patient Information Booklet. Patient brochure. STAAR Surgical Company. 2021. Accessed June 6, 2026. https://www.staar.com/file/MKT-0475-Rev-1-US-EVO-PIB.pdf Eom Y, Kim DW, Ryu D, et al. Ring-shaped dysphotopsia associated with posterior chamber phakic implantable collamer lenses with a central hole. Acta Ophthalmol. 2017;95(3):e170-e178. doi:10.1111/aos.13248","u":"pages/EVO-Visian-Implantable-Collamer-Lens(ICL)-Implant.htm","cr":"Sabah Munir, MSPH; Lauren A. Tomlinson, MD","src":"er"},{"t":"Decentered posterior chamber intraocular lens","im":[["E:photos/decentered-IOL/decentered-IOL-LRG.jpg",""],["E:photos/decentered-IOL/decentered-IOL-rr-LRG.jpg",""],["E:photos/decentered-IOL.webp","Decentered intraocular lens"]],"h":"","u":"pages/decentered-IOL.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Subluxated posterior chamber intraocular lens implant","im":[["E:pages/imgs/R_71TU3497v7BdshU_Screenshot%202025-06-19%20at%203.02.40%20PM.png","Retroillumination on slit lamp examination showed inferonasal subluxation of PCIOL along with 2+ posterior capsular opacification"],["E:pages/imgs/R_71TU3497v7BdshU_Screenshot%202025-06-19%20at%203.11.38%20PM.png","Diffuse illumination on slit lamp examination showed inferonasal subluxation of PCIOL"]],"h":"A 70-year-old man presented to the clinic 2 years after right-sided cataract extraction with a posterior chamber intra-ocular lens (PCIOL) implant performed at an outside hospital. He reported blurriness as well as seeing a \"half-moon shadow\" in his right eye vision. Slit lamp examination of his right eye showed inferonasal subluxation of his PCIOL along with 2+ posterior capsular opacification and cortical material within the capsular bag. He was taken to the OR for an IOL exchange procedure. Intra-operatively, a posterior capsular tear was encountered which was complicated by the IOL protruding out of the tear and vitreous prolapse. He underwent IOL explantation and anterior vitrectomy followed by placement of a new IOL in the sulcus with capture by the anterior capsule. Final visual acuity one month after surgery was 20/20-1.","u":"pages/Subluxated_posterior_chamber_intraocular_lens_implant.html","cr":"Noor-Us-Sabah Ahmad, MD","src":"er"},{"t":"Opacification of Hydrophilic Intraocular Lens","im":[["E:pages/imgs/IOL_opacification1.png",""],["E:pages/imgs/IOL_opacification2.png",""],["E:pages/imgs/IOL_opacification3.png",""]],"h":"A 64-year-old man with a history of bilateral pseudophakia and partial-thickness corneal transplantation in both eyes presented for progressive vision loss in the left eye. The patient underwent uncomplicated cataract surgery several years ago and then subsequently, more recently, had uncomplicated Descemet membrane endothelial keratoplasty (DMEK) for Fuchs' endothelial dystrophy. On exam, there was a centered intraocular lens in the capsular bag. The intraocular lens had a stippled central opacification extending through the visual axis on the anterior lens surface. On further investigation, the intraocular lens was confirmed to be an Akreos MI60 hydrophilic lens. It was suspected that the lens had opacified after exposure to intraocular gas following DMEK surgery. This is a relatively uncommon complication, but a dreaded one, of hydrophilic intraocular lenses that is the result of calcium phosphate deposits on the ocular surface. This patient will undergo intraocular lens exchange with a planned pars plana vitrectomy.","u":"pages/Opacification_of_Hydrophilic_Intraocular_Lens.html","cr":"Mahsaw Mansoor MD","src":"er"},{"t":"Calcific Deposits on an Intraocular Lens","im":[["E:pages/imgs/R_7lmEbXdFKOfPy5r_Boese_atlas_pics.jpeg","A 72-year-old woman presented with widely fluctuating visual acuity following an uncomplicated phacoemulsification combined with 360° gonioscopy-assisted transluminal trabeculotomy (GATT). Post-operatively, her course was notable for a 2.5mm hyphema, which cleared within a week. On follow-up examination at three months, she had a persistent intracapsular hemorrhage with a superficial layer of dehemoglobinized blood in her right eye (Figure 1A). She underwent a neodymium-aluminum-garnet (Nd:YAG) capsulotomy with immediate clearance of the blood (Figure 1B)."]],"h":"A 72-year-old woman presented with widely fluctuating visual acuity following an uncomplicated phacoemulsification combined with 360° gonioscopy-assisted transluminal trabeculotomy (GATT). Post-operatively, her course was notable for a 2.5mm hyphema, which cleared within a week. On follow-up examination at three months, she had a persistent intracapsular hemorrhage with a superficial layer of dehemoglobinized blood in her right eye (Figure 1A). She underwent a neodymium-aluminum-garnet (Nd:YAG) capsulotomy with immediate clearance of the blood (Figure 1B). Two weeks following the capsulotomy, she had complete resolution of her fluctuating visual acuity. Transient hyphema following GATT is common, but in rare instances the blood can travel posteriorly where it can become sequestered in the space between the intraocular lens and posterior capsule. In this case, not only did the intracapsular blood not clear, but time allowed the dehemoglobinized blood to separate into a superficial white layer.","u":"pages/Layered_intracapsular_hemorrhage_following_phacoemulsification_GATT.html#gsc.tab=0","cr":"Christian A. Mays, MD; Erin A. Boese, MD","src":"er"},{"t":"Aftercataract (Elschnig's pearls)","im":[["E:photos/hanging-elschnig-pearl/Hanging-Elschnig-Pearl.jpg","Hanging Elschnig Pearl"],["E:photos/elscnigspearls003.jpg",""]],"h":"Kaleigh Haus September 18, 2023 Our patient is a 47-year-old male with a history of myotonic muscular dystrophy and bilateral cataract extraction with implantation of intraocular lens. This was complicated by the development of bilateral dense posterior capsular opacities that were resistant to YAG capsulotomy (attempted twice in the right eye prior to this presentation). He presented with 2 days of “a line in my vision that changes angles when I move my head.” During the slit lamp exam, he was noted to have a large Elschnig pearl suspended in his central visual axis which swung with his eye movements as demonstrated in the video above. Aftercataract (Elschnig's pearls) Aftercataract (Elschnig's pearls) Category(ies): Cataract Contributor: Dr. Swaranjit Singh Bhatti, Bhatti Eye Clinic February 8, 2008 This variety of aftercataract occurs typically in eyes with very little or no postoperative inflammation. It is due to random proliferation of the cells which produce lens fibres, along the posterior capsule.These aborted lens fibres glisten like precious stones in retroillumination.","u":"pages/Aftercataract-Elschnigs-pearls.html","cr":"C.Y. Lewis, MD","src":"er"},{"t":"Posterior capsular opacity (PCO) following cataract surgery","im":[["E:photos-earlier/PCO.jpg","1) Slit lamp showing PCIOL with a membrane forming behind lens."],["E:photos-earlier/PCO_retro.jpg","2) retroillumin
