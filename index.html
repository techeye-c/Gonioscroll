es/Ozurdex/Ozurdex-in-the-AC-2-LRG.jpg",""]],"h":"This patient presented with marked corneal edema one month after the intra-vitreal injection of a dexamethasone implant (Ozurdex®) for macular edema. He was aphakic due to a prior open globe injury and repair. He had also undergone vitrectomy for a prior retinal detachment. On our initial exam, the implant was not visible in the anterior chamber. However, the patient said he slept face down and every morning when he awoke, he could see something white on his eye in the mirror. During our exam, we had the patient look down to the floor for a few minutes. At that time, the implant was readily seen in his anterior chamber. The implant was urgently removed in order to decrease the risk of continued endothelial decompensation. According to the package insert, the Ozurdex is contraindicated in aphakic patients and patients with an anterior chamber intraocular lens who do not have an intact posterior capsule. Some reports suggest that all patients with a compromised capsule and a history of vitrectomy, even those with a posterior chamber intraocular lens, are at risk for corneal edema secondary to migration of the Ozurdex into the anterior chamber.","u":"pages/Ozurdex/index.htm","cr":"Justin Risma, MD","src":"er"},{"t":"Megalocornea","im":[["E:pages/Megalocornea/megalocornea-LRG.jpg",""],["E:pages/Megalocornea/megalocornea-oblique-LRG.jpg",""],["E:pages/Megalocornea/megalocornea-oblique-2-LRG.jpg",""]],"h":"Megalocornea is a condition in which there is a bilateral, non-progressive enlargement in corneal diameter ( >13 mm in adults, >12 mm in newborns). The condition usually follows an X-linked inheritance pattern. OMIM #309300","u":"pages/Megalocornea/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Microcornea","im":[["E:pages/microcornea/microcornea-LRG.jpg",""],["W:photos-earlier/microcornea-OU.jpg","Except for the microcornea, no other general or ocular abnormality was evident. In microcornea, the measurement is less than 11 mm in the greatest diameter.In this patient, the right cornea was slightly smaller than the left cornea - both were smaller than normal."],["W:photos/microph11.jpg","The cornea measured 9.5mm in diameter. A measurement less than 11mm is considered microcornea. In this case, it is part of a microphthalmos. The word nanophthalmos is a synonym for microphthalmos."]],"h":"Retired Clinical Assistant Professor of Ophthalmology, University of Rochester School of Medicine and Dentistry *Dr. Caccamise has very generously shared his images of patients taken while operating during the \"eye season\" in rural India as well as those from his private practice during the 1960's and 1970's. Many of his images are significant for their historical perspective and for techniques and conditions seen in settings in undeveloped areas.","u":"pages/microcornea/index.htm","cr":"William Charles Caccamise, Sr, MD","src":"er"},{"t":"Sclerocornea","im":[["E:photos/sclero/sclerocornea.jpg",""]],"h":"This 30-year-old male presented with congenital anophthalmia on the left and sclerocornea on the right. When these two conditions are associated there is also an increased likelihood of dermoid, glaucoma and developmental delay.","u":"pages/sclerocornea.htm","cr":"Matt Ward, MD","src":"er"}]},{"n":"Keratitis","b":"Bacterial, fungal, Acanthamoeba, herpetic and immune keratitis.","items":[{"t":"Bacterial Keratitis","im":[["E:photos/MonocularCornUlcer6.jpg",""]],"h":"","u":"pages/Bacterial-Keratitis.html","cr":"Jordan M. Graff, MD","src":"er"},{"t":"Pseudomonas keratitis","im":[["E:pages/Pseudomonas-keratitis/pseudomonas-keratitis-LRG.jpg",""],["E:pages/Pseudomonas-keratitis/pseudomonas-keratitis-slit-LRG.jpg",""]],"h":"Pseudomonas aeruginosa is the most common cause of bacterial keratitis in contact lens wearers. It classically results in stromal necrosis exhibiting a shaggy surface and adherent mucopurulent exudate..","u":"pages/Pseudomonas-keratitis/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Pseudomonas keratitis","im":[["W:pages/Pseudomonas-keratitis/pseudomonas-keratitis-81YO.JPG","81-year-old female with a prior failing PKP presented with pseudomonas keratitis within the graft presumably due to bullous keratopathy."]],"h":"81-year-old female with a prior failing PKP presented with pseudomonas keratitis within the graft presumably due to bullous keratopathy.","u":"pages/pseudomonas-keratitis-81.html","cr":"John J. Chen, MD, PhD","src":"er"},{"t":"Pseudomonas keratitis (suppurative)","im":[["E:photos-earlier/keratitis_01232005.jpg",""],["E:photos-earlier/keratitis2_01232005.jpg",""]],"h":"Patient developed a 7th nerve palsy, exposure keratopathy, and then severe suppurative pseudomonas keratitis.","u":"pages/pseudomonas-keratitis-suppurative.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Corneal Satellite Infiltrates","im":[["E:pages/Corneal-Satellite-Infiltrates/infiltrates-1-LRG.jpg",""],["E:pages/Corneal-Satellite-Infiltrates/infiltrates-2-LRG.jpg",""],["E:pages/Corneal-Satellite-Infiltrates/infiltrates-3-LRG.jpg",""]],"h":"These photographs show satellite infiltrates associated with a central corneal ulcer secondary to culture-negative, Gram-negative rod bacterial keratitis. While historically associated with fungal keratitis, satellite infiltrates have been reported in cases of Acanthamoeba, nontuberculous mycobacterium, and bacterial (including Pseudomonas) keratitis.","u":"pages/Corneal-Satellite-Infiltrates/index.htm","cr":"T.J. Clark, MD","src":"er"},{"t":"Nocardia farcinica keratitis in a contact lens wearer","im":[["E:photos/Nocardia/Fig1-LRG.jpg","Slit lamp photography of the right eye. This photograph demonstrates multifocal stromal infiltrates in the mid-periphery extending along the limbus. There is prominent ciliary flush, diffuse conjunctival injection, and a superior pannus."],["E:photos/Nocardia/Fig2-LRG.jpg","Slit lamp photography of the right eye. This photograph shows a moderate amount of white blood cell recruitment surrounding the stromal opacities in addition to small, branching-type lesions extending from the stromal opacities. Several satellite lesions are present"],["E:photos/Nocardia/Fig3-LRG.jpg","Slit lamp photography of the right eye. This photograph demonstrates a focal lesion in the nasal mid-periphery without feathery borders but with surrounding inflammation. Ciliary flush is evident with diffuse 2+ injection. There are complete epithelial defects overlying these lesions (not photographed)."]],"h":"Visual acuity was 20/60 OD, and her anterior segment examination is documented in Figures 1-3. She was started on two fortified topical antibiotics, topical amphotericin, oral valacyclovir, and a topical cycloplegic, and corneal cultures were collected. Confocal microscopy showed numerous activated keratocytes without definitive hyphae or amoebic cysts (Fig 4). Corneal cultures were positive for >100 colonies of Nocardia farcinica. Topical amikacin 10 mg/mL and oral trimethoprim-sulfamethoxazole were added to her regimen. Within two weeks, her symptoms resolved and vision improved to 20/15 OD. Her drops were slowly tapered over three months. Nocardia keratitis (NK) is a rare cause of bacterial keratitis that mimics fungal infections and, as a result, is often diagnostically challenging. Nocardia are gram-positive, aerobic bacteria of the actinomycetes order that are found in microflora of soil, dust, decaying vegetation, etc (1). NK classically leads to a wreath-like arrangement of patchy, anterior stromal infiltrates in the setting of trauma, contact lens use, or LASIK (1, 2). The course of NK is usually slowly progressive; however, these infections are commonly recalcitrant unless Nocardia-specific treatment (e.g., amikacin and sulphonamides) is initiated early (1, 2). Topical corticosteroids should be avoided prior to adequate treatment of Nocardia (1). Nocardia Keratitis in a Contact Lens WearerNocardia Keratitis in a Contact Lens WearerCategory(ies): Cornea / External Eye DiseaseContributor: Ella J. Gehrke, MD; Lupe Torres, MD; Kanwal Singh Matharu, MD Photographer: Brooke MuthPosted: 03/03/2025A 52-year-old male with a 35+ year history of hard and soft contact lens wear, poor lens hygiene, including overnight wear and recent hot tub exposure, presented with decreased vision in the left eye and eye pain. On presentation, his visual acuity was 20/20 OD and 20/60 OS, with intraocular pressures of 15 and 13 mmHg, respectively. Slit-lamp examination revealed multifocal, wreath-like infiltrates consistent with microbial keratitis. Corneal cultures grew >100 colonies of Nocardia species. The patient was started on polyhexamethylene biguanide, erythromycin, and amikacin 2.5% for treatment of Nocardia keratitis.","u":"pages/nocardiafarcinica-keratitis.htm","cr":"Brittni A. Scruggs, MD","src":"er"},{"t":"Acanthamoeba keratitis","im":[["E:pages/acanthamoeba/N-acanthamoeba-LRG-sk.jpg","Concentric ring infiltrate in a contact lens wearer with early Acanthamoeba keratitis."],["E:pages/acanthamoeba/N-acanthamoeba-slit-LRG-sk.jpg","- Slit Lamp: Concentric ring infiltrate in a contact lens wearer with early Acanthamoeba keratitis."],["E:pages/acanthamoeba/N-acanthamoeba-zoom-LRG-sk.jpg","- Enhanced Zoom: Concentric ring infiltrate in a contact lens wearer with early Acanthamoeba keratitis."]],"h":"Acanthamoeba keratitis is a rare parasitic infection of the cornea that primarily occurs in contact lens wearers. The infection may be limited to the epithelium in its early stages, resulting in epithelial dendrites and punctate epitheliopathy. Later stromal involvement classically results in a partial or complete paracentral ring infiltrate, radial perineuritis, and pain out of proportion to the appearance on exam. Scleritis and uveitis may also be present. Reference: Krachmer, Jay H., Mark J. Mannis, Edward J. Holland. Cornea. St. Louis: Mosby, 2011.","u":"pages/acanthamoeba/index.htm","cr":"Jesse Vislisel, MD; Jordan Graff, MD; Meagan Seay, DO","src":"er"},{"t":"Infectious Crystalline Keratopathy","im":[["E:photos/Infectious-crystalline-keratopathy/ICK_slit-lamp-LRG.jpg","Slit lamp photograph of the right eye shows mild injection, penetrating keratoplasty graft with 1 x 1 mm epithelialized melt with white crystalline infiltrate sprouted within stroma extending 2.5 mm x 2.5 mm and large keratic precipitates posterior to involved area. Patient was also noted to have central striae, stromal edema, and Descemet's folds with no cell, 1+ flare, and inferonasal membranes along endothelium and iris. Corneal scraping was negative."],["E:photos/Infectous-Crystalline-Keratopathy.jpg",""],["E:photos-earlier/ICK.jpg",""]],"h":"This 73-year-old male patient presented to the Cornea service with a one-week history of right eye redness and pain. He had a remote history of open globe with multiple subsequent penetrating keratoplasties and a recent macula-involving retinal detachment all in the right eye with resulting hand motions vision. He was diagnosed with suture-related infectious crystalline keratopathy with associated epithelialized stromal melt. The dense crystals seen within the deep stroma represent arborizing aggregates of an infectious agent, often alpha-hemolytic streptococcus or Candida albicans, and often originating from a suture track. Microbial colonies proliferate within stromal lamellar spaces and are shielded by a biofilm [1]. Corneal cultures are often negative. Lack of host inflammatory response may be due to chronic immunosuppression, tear film irregularity, or suture [2].","u":"pages/Infectious-Crystalline-Keratopathy.htm","cr":"Lauren E. Hock, MD and Mark A. Greiner, MD","src":"er"},{"t":"Herpes simplex virus (HSV) epithelial keratitis, dendrite","im":[["E:pages/HSV-dendrite/HSV-dendrite-LRG.jpg","HSV-dendrite"]],"h":"Dendritic ulcers are the classic lesion associated with herpes simplex virus (HSV) epithelial keratitis. This photograph portrays the typical appearance of these ulcers - swollen epithelium along the margins of a positive-staining, dendritic corneal ulcer with terminal bulbs at the ends of the branches. This contrasts with the appearance of Varicella-zoster virus (VZV) pseudodendrites.","u":"pages/HSV-dendrite/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Herpes simplex virus (HSV) geographic epithelial keratitis","im":[["E:pages/HSV-keratitis/HSV-LRG.jpg",""],["E:pages/HSV-keratitis/HSV-ghost-LRG.jpg",""]],"h":"This patient was on chronic topical steroids after undergoing a deep lamellar endothelial keratoplasty (DLEK) when she developed Herpes simplex virus (HSV) epithelial keratitis. The dendritic ulcer is visible using the sclerotic scatter technique (top) and it becomes readily apparent with fluorescein staining (middle image). HSV dendritic ulcers have terminal bulbs and their base stains positively with fluorescein. They can coalesce to form larger geographic ulcers, as seen centrally here, especially in the presence of topical steroids. After resolution of the keratitis, residual subepithelial infiltration and scarring can be seen just deep to the area of the previous ulcer, resulting in \"ghost dendrites\", as seen in the bottom photo. Reference: Krachmer, Jay H., Mark J. Mannis, Edward J. Holland. Cornea. St. Louis: Mosby, 2011.","u":"pages/HSV-keratitis/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Herpes simplex virus (keratitis)","im":[["E:photos-earlier/HSV.jpg","HSV dendrite with terminal bulbs."]],"h":"HSV dendrite with terminal bulbs.","u":"pages/herpes-simplex-virus-keratitis.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Herpes Simplex Virus (HSV) epithelial keratitis","im":[["E:photos/Herpes/HSV-epithelial-keratitis.jpg","55-year-old female with Herpes Simplex Virus epithelial keratitis"]],"h":"55-year-old female with Herpes Simplex Virus epithelial keratitis","u":"pages/HSV-epithelial-keratitis.htm","cr":"C. Blake Perry, MD","src":"er"},{"t":"Herpes simplex virus Keratitis","im":[["W:photos/Herpes/HSV.jpg",""],["W:photos/Herpes/HSV-epithelial-keratitis-2-LRG.jpg",""],["W:photos-earlier/HSV_022005short-dendrites12.jpg",""]],"h":"This photo exhibits multiple branching epithelial dendritic lesions due to herpes simplex virus (HSV). This particular patient had a history of herpetic keratitis, and reactivation of the virus was likely due, in part, to immunosuppression from the initiation of systemic chemotherapy for metastatic adenocarcinoma. Contributor: Jordan M. Graff, MD Not all cases of HSV keratitis have the large, arborating brightly staining dendrites seen in classic text-book examples. The lesions in this case of documented HSV keratitis are multiple, smaller, and with less impressive branching. However, the clinician should recognize the dendritic appearance. The overall context of the patient's clinical presentation helps to make the diagnosis (pain, photophobia, blurred vision, tearing, epithelial vessicles, decreased corneal sensation). Contributor: Jeffrey D. Welder, MD","u":"pages/HSV-Keratitis.html","cr":"Alison Bozung, OD","src":"er"},{"t":"Herpes simplex virus (keratitis) & HSV iritis","im":[["E:photos-earlier/redeye.jpg",""],["E:photos/dendrite.jpg",""],["E:photos/follicular.jpg",""]],"h":"This patient had 1+ cell/trace flare associated with unilateral red eye, follicular conjunctivitis, and early corneal dendrite.","u":"pages/herpes-simplex-virus-keratitis--HSV-iritis.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Herpes simplex virus (HSV) disciform keratitis","im":[["E:pages/Disciform-keratitis/Disciform-LRG.jpg",""],["E:pages/Disciform-keratitis/Disciform-SS-LRG.jpg",""],["E:pages/Disciform-keratitis/Disciform-slit-LRG.jpg",""]],"h":"Herpetic disciform keratitis is a primary endotheliitis resulting in both stromal and epithelial edema in a round (disciform) distribution with keratic precipitates underlying the area of edema. The corneal edema and keratic precipitates appear to be out of proportion to the degree of anterior chamber inflammation, in contrast to uveitis with secondary corneal decompensation. Disciform keratitis may be caused by both herpes simplex and herpes zoster viruses.","u":"pages/Disciform-keratitis/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Ghost dendrites","im":[["E:pages/Ghost-dendrites/ghost-dendrite-LRG.jpg",""]],"h":"Ghost dendrites may remain after resolution of herpes simplex virus (HSV) epithelial keratitis due to residual subepithelial infiltration and scarring in the region of the previous dendritic ulcer. To learn more about HSV keratitis, read the EyeRounds case report.","u":"pages/Ghost-dendrites/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Subepithelial corneal haze after herpes zoster virus (HZV) keratitis","im":[["E:pages/Anterior-stromal-haze-HZV/HZV-LRG-subepi-haze.jpg","Corneal haze can be seen as a reflective region when illuminated with a broad slit beam."],["E:pages/Anterior-stromal-haze-HZV/HZV-LRG-subepi-haze-slit.jpg","Corneal haze is most easily visible when using the slit beam seen using the slit beam"],["E:pages/Anterior-stromal-haze-HZV/HZV-LRG-subepi-haze-slit-zoom.jpg","Corneal haze is most easily visible when using the slit beam seen using the slit beam - Zoomed"]],"h":"Subepithelial, or anterior stromal, corneal haze may result after superficial corneal inflammation. It can be seen as a reflective region when illuminated with a broad slit beam, but is most easily visible when using the slit beam. These photographs show the appearance of a patient with anterior stromal haze after herpes zoster virus (HZV) keratitis. The depth of the opacification is visible in the slit beam.","u":"pages/Anterior-stromal-haze-HZV/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Varicella-zoster virus (VZV) epithelial keratitis, pseudodendrites","im":[["E:pages/VZV-keratitis/VZV-keratitis-LRG.jpg",""]],"h":"Varicella-zoster virus (VZV) is a Herpes virus responsible for chicken pox and shingles. With corneal epithelial involvement, the virus can cause punctate or dendritic epithelial keratitis. The pseudodendrites caused by VZV can be differentiated clinically from \"true\" dendrites caused by Herpes simplex virus (HSV). In contrast to HSV dendrites, VZV pseudodendrites are smaller in size, elevated without central ulceration, they do not have terminal bulbs, and have relative lack of central staining. Elevated mucous plaques may occur weeks to months after resolution of the original pseudodendrites. Residual corneal hypoesthesia after the infection can be severe.","u":"pages/VZV-keratitis/index.htm","cr":"Jeff Welder, MD;Jesse Vislisel, MD","src":"er"},{"t":"Varicella-zoster virus (VZV) disciform keratitis","im":[["E:pages/VZV-disciform-keratitis/VZV-disciform-LRG.jpg",""],["E:pages/VZV-disciform-keratitis/VZV-disciform-slit-LRG.jpg",""]],"h":"Varicella-zoster virus (VZV) is the herpesvirus responsible for chicken pox and shingles. Disciform keratitis presents as a round or ovoid region of stromal and epithelial corneal edema, often with associated keratic precipitates underlying the involved area. It is primarily caused by a herpetic endotheliitis and cases of disciform keratitis caused by herpes simplex virus (HSV) and VZV are clinically indistinguishable. This patient had a recent history of zoster in a V1 distribution with classic findings of disciform keratitis, including underlying keratic precipitates that are not easily visible in this photograph.","u":"pages/VZV-disciform-keratitis/index.htm","cr":"Jesse Vislisel, MD, Jordan Graff, MD, Meagan Seay, DO","src":"er"},{"t":"Herpes Zoster Ophthalmicus","im":[["E:photos-earlier/V1.jpg",""],["E:photos/forehead.jpg",""],["E:photos-earlier/V21.jpg",""]],"h":"Vesicular rash on an erythematous base. Notice that this rash is in the V1 distribution on the left side of the face (top 2 photos) and V2 distribution on the right side of the face (bottom 2 photos). Also note how the rash is divided down face midline.","u":"pages/Herpes-Zoster.html","cr":"Jordan Graff, MD","src":"er"},{"t":"Interstitial Keratitis Secondary to Syphillis","im":[["E:pages/Interstitial-Keratitis-Second-2-Syphillis/IK-LRG.jpg",""],["E:pages/Interstitial-Keratitis-Second-2-Syphillis/IK-2-LRG.jpg",""],["E:pages/Interstitial-Keratitis-Second-2-Syphillis/IK-3-LRG.jpg",""]],"h":"This is a 73-year-old male who presented initially for trabeculectomy surgery. Upon examination, the patient was found to have a corneal stromal scar with prominent ghost vessels. The patient was sent for blood work which returned positive for syphillis serologies. He was referred to infectious diseases and treated. He was having no acute symptoms further suggesting this was a chronic process. These lesions, when acute, present with neovascularization of the stroma, which some refer to as a salmon patch. Patients are also generally symptomatic initially with symptoms of photophbia, redness, and pain. Over time there is regression of these vessels leaving the images as seen above as a classic example of interstitial keratitis. The differential diagnoses is quite broad, but in the US the most common etiologies are HSV and syphillis.","u":"pages/Interstitial-Keratitis-Second-2-Syphillis/index.htm","cr":"Lucas Lenci, MD; Prashant Parekh, MD","src":"er"},{"t":"Cogan's syndrome","im":[["E:pages/Cogan/Cogan-OD-LRG.jpg",""],["E:pages/Cogan/Cogan-OS-LRG.jpg",""]],"h":"Cogan's syndrome is a rare, idiopathic, chronic inflammatory disorder characterized vestibuloauditory dysfunction and interstitial keratitis. Some evidence suggests an autoimmune mechanism, but the true etiology unknown. The classic ophthalmic feature is interstitial keratitis causing patchy, granular corneal stromal infiltrates that may result in anterior stromal and subepithelial scarring. Patients may have other signs of ocular inflammation including uveitis, conjunctivitis, episcleritis, scleritis or retinal vasculitis. The inner ear disease associated with Cogan's syndrome can manifest as vertigo, ataxia, tinnitus or hearing loss. Anti-inflammatory and/or immunosuppressive therapy are the treatments based on the clinical features. This young patient presented initially for bilateral hearing loss without visual complaints. Cogan's syndrome was on the differential and he was sent for ophthalmic evalution. He was found to have bilateral, patchy granular corneal opacities in the mid-stroma peripherally with a clear central cornea in each eye. He was asymptomatic from this with 20/20 vision in each eye. There were no other signs of ocular inflammation.","u":"pages/Cogan/index.htm","cr":"Christopher Kirkpatrick, MD","src":"er"},{"t":"Peripheral ulcerative keratitis (PUK)","im":[["E:pages/PUK/PUK-external-LRG.jpg",""],["E:pages/PUK/PUK-slit-LRG.jpg",""],["E:pages/PUK/PUK-addon-LRG.jpg","Contributed by Lorraine Provencher, MD"]],"h":"Peripheral ulcerative keratitis (PUK) is an autoimmune-mediated corneal infiltration associated with systemic autoimmune and inflammatory diseases. It is most commonly associated with rheumatoid arthritis, but can also be associated with Wegener's granulomatosis, polyarteritis nodosa, lupus, scleroderma, and other inflammatory diseases. PUK is usually unilateral and peripheral, due to the proximity to the conjunctival vasculature. There is typically an epithelial defect overlying the infiltrate and associated corneal stromal thinning or melting. The lesions will stain positively with fluorescein if there is an overlying epithelial defect. The patient in these photographs was later diagnosed with Wegener's granulomatosis upon systemic rheumatologic workup.","u":"pages/PUK/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Peripheral ulcerative keratitis (PUK) in rheumatoid arthritis","im":[["E:photos-earlier/PUK_01222005.jpg","Peripheral corneal melt associated with inflammation."]],"h":"Peripheral corneal melt associated with inflammation.","u":"pages/peripheral-ulcerative-keratitis-PUK-in-rheumatoid-arthritis.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Peripheral Ulcerative Keratitis","im":[["E:pages/imgs/R_5hlHbRdZ6CE9NlL_PUK1.png",""],["E:pages/imgs/R_5hlHbRdZ6CE9NlL_PUK2.png",""],["E:pages/imgs/R_5hlHbRdZ6CE9NlL_PUK3.png",""]],"h":"A 67-year-old man with presented with bilateral ocular redness, pain and decreased vision. On exam there was a crescent-shaped corneal ulceration with secondary keratolysis and scleritis. Despite aggressive medical therapy, the keratolysis progressed ultimately resulting in corneal perforation with prolapse of uveal tissue. The patient underwent emergent sclerokeratoplasty.","u":"pages/Peripheral_Ulcerative_Keratitis.html","cr":"Mahsaw Mansoor, MD","src":"er"},{"t":"Descemetocele","im":[["E:pages/Descemetocele/LRG-descemetocele-zoom.jpg",""],["E:pages/Descemetocele/LRG-descemetocele-slit.jpg",""]],"h":"A descemetocele is an area of extreme, focal corneal thinning where only Descemet membrane remains. These photographs show a descemetocele that developed after a sterile corneal melt in the setting of ocular rosacea.","u":"pages/Descemetocele/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Cyanoacrylate adhesive for corneal perforation secondary to peripheral ulcerative keratitis (PUK)","im":[["E:pages/Cyanoacrylate-PUK/PUK-slit-LRG.jpg",""],["E:pages/Cyanoacrylate-PUK/PUK-LRG.jpg",""],["E:pages/Cyanoacrylate-PUK/PUK-glue-LRG.jpg",""]],"h":"Cyanoacrylate adhesive is a synthetic compound that rapidly polymerizes upon contact with the dry ocular surface. It is useful to temporarily provide tectonic support for ocular perforations up to 2-3 mm in diameter and has been demonstrated to have antibacterial properties (1). The top photographs show the appearance of a patient upon presentation with peripheral ulcerative keratitis in the setting of poorly-controlled rheumatoid arthritis. The severe corneal thinning continued to progress despite medical therapy, resulting in corneal perforation. The bottom photographs show the appearance after stabilization with cyanoacrylate adhesive and several days of oral prednisone and doxycycline. Reference: (1) Eiferman RA, Snyder JW: Antibacterial effect of cyanoacrylate glue. Arch Ophthalmol. 1983;101:958-960. PMID: 6683097","u":"pages/Cyanoacrylate-PUK/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Diffenbachia picta Organic Crystalline Keratitis","im":[["E:pages/imgs/Diffenbachia_external_diffuse.png","Diffuse illumination slit lamp photograph of superficial organic crystalline foreign bodies from Diffenbachia picta plant sap, with additional microcystic edema secondary to irrigation."],["E:pages/imgs/Diffenbachia_near.png","Diffuse illumination high magnification slit lamp photograph of organic crystalline foreign bodies from Diffenbachia picta plant sap, with additional microcystic edema secondary to irrigation."],["E:pages/imgs/Diffenbachia_near_subsequent.png","Diffuse illumination slit lamp photograph of organic crystalline foreign bodies from Diffenbachia picta plant sap, approximately 1 week after exposure."]],"h":"Najlaa Al Salama A 75-year-old male with a history of bilateral LASIK was trimming a houseplant of the species Diffenbachia picta when sap from the plant was inadvertently introduced onto the surface of the right eye. Copious irrigation at a local ED achieved clearance of organic debris and partial improvement in foreign body sensation. On his initial ophthalmic examination 2 days after exposure, visual acuity in the affected eye was 20/20-3 uncorrected at distance and intraocular pressure was 13. Anterior segment examination demonstrated an intact LASIK flap and numerous needle-shaped organic crystalline foreign bodies embedded in the epithelium and Bowman’s layer, along with expected post-irrigation microcystic corneal edema. The remainder of the examination was unremarkable. In keeping with prior case reports,[1,2] the patient was prescribed prednisolone acetate 1% and moxifloxacin both four times daily in the affected eye. At 1 week follow-up, his vision was 20/25 uncorrected at distance, intraocular pressure was 20, and his eye was asymptomatic. The cornea demonstrated interval resolution of microcystic edema and a substantial decrease in the burden of embedded particles, though a handful remained in the subepithelium. The topical antibiotic was discontinued, and a taper of the topical steroid was initiated.","u":"pages/Diffenbachia-picta-Organic-Crystalline-Keratitis.html","cr":"Nicolas J Heckenlaible MD and Kenneth M Goins MD","src":"er"}]},{"n":"Sclera","b":"Scleritis and scleromalacia.","items":[{"t":"Anterior Scleritis","im":[["E:photos/Anterior-scleritis.jpg",""]],"h":"62-year-old male with anterior scleritis which presented after discontinuation of a course of anti-inflammatory medications for nephrolithiasis. Patient had marked tenderness over the area, as well as 1+ cell and trace flare in the anterior chamber. Note the violaceous hue in the area of the injected vessels. Photograph taken after instillation of phenylephrine 2.5% eye drop.","u":"pages/anterior-scleritis.htm","cr":"Pavlina Kemp, MD","src":"er"},{"t":"Nodular anterior scleritis","im":[["E:LARGE/nodular-scleritis-L.jpg","This photograph displays dilated, inflamed scleral vasculature and a prominent scleral nodule inferior to the limbus."],["E:photos/Nodular-anterior-scleritis-photo-LRG.jpg",""]],"h":"This photograph displays dilated, inflamed scleral vasculature and a prominent scleral nodule inferior to the limbus.","u":"pages/nodular-anterior-scleritis.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Scleritis","im":[["E:photos/sclero/scleritis.jpg","Note the injection of scleral vessels and violaceous hue (can be seen better with natural sunlight)."]],"h":"Note the injection of scleral vessels and violaceous hue (can be seen better with natural sunlight).","u":"pages/scleritis.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Scleritis (2)","im":[["E:photos/sclero/Scleritis13-1.JPG",""],["E:photos/sclero/Scleritis13-2.JPG",""],["E:pages/imgs/A10A52E3_DF54_481C_B484_2790FDE63AD2_1_201_a.jpeg","This 25-year-old female with a medical history of relapsing polychondritis presented with a red painful eye"]],"h":"This 25-year-old female with a medical history of relapsing polychondritis presented with a red painful eye","u":"pages/Scleritis13.htm","cr":"Jeffrey D. Welder, MD","src":"er"},{"t":"Scleromalacia in Rheumatoid Arthritis","im":[["E:pages/Scleromalacia-in-RA/external-OD-LRG.jpg",""],["E:pages/Scleromalacia-in-RA/external-OS-LRG.jpg",""],["E:pages/Scleromalacia-in-RA/temporal-thinning-OD-LRG.jpg",""]],"h":"This patient is an 88-year-old female with a history of rheumatoid arthritis who presented with bilateral eye pain. An external photo of the right eye shows dilated episcleral vessels traversing 360 degrees around the limbus. There is significant scleromalacia around the senile calcific plaque temporally with a deep furrow extending roughly 90% through the sclera. Underlying uvea can be seen on the close-up photo of the right eye. Less advanced scleromalacia is seen nasally. The left eye also exhibits dilated episcleral vessels surrounding the limbus as well as scleromalacia nasally and temporally. Both eyes have an irregular cornea reflex due to significant dryness which also likely contributed to the melt. Rheumatoid arthritis (RA) should be high on the differential diagnosis of patients who present with scleromalacia. Autoimmune damage to the lacrimal gland can result in severe dry eye in patients with RA.","u":"pages/Scleromalacia-in-RA/index.htm","cr":"William Flanary, MD","src":"er"},{"t":"Scleromalacia perforans","im":[["E:pages/Scleromalacia-perforans/scleromalacia-perforans-1-LRG.jpg",""],["E:pages/Scleromalacia-perforans/scleromalacia-perforans-2-LRG.jpg",""]],"h":"64-year-old female with rheumatoid arthritis and a history of scleritis with severe scleromalacia with diffuse purple hue from increased uveal visibility. In the top picture there is a large area of uveal protrusion with only a thin layer of conjunctiva overlying the uvea.","u":"pages/Scleromalacia-perforans/index.htm","cr":"Jeffrey Welder, MD","src":"er"},{"t":"Scleromalacia","im":[["W:photos/Scleromalacia-and-Anterior-Staphyloma-LRG.jpg",""],["E:LARGE/scleromalacia-SG-L.jpg",""]],"h":"A 63-year-old man presented to the ophthalmology clinic for evaluation of a blind painful left eye. He had a complicated left cataract surgery 45 years ago that resulted in subsequent ocular decompensation and scleromalacia, a degenerative thinning of sclera that allows visualization of the underlying pigmented uvea (Panels A-C). The scleromalacia led to anterior staphyloma, where the protrusion caused eyelid displacement (Panel D) so severe that it touched the lens of his glasses. Scleromalacia can be caused by other conditions including systemic connective tissue diseases (most commonly rheumatoid arthritis) and inflammatory processes such as vasculitis or infection; local trauma to the sclera may also be an inciting factor [1]. Loss of scleral connective tissue decreases the structural integrity of the globe; as such, scleromalacia confers an increased rupture risk with minor trauma. It is recommended that patients with this condition wear protective eyewear at all times. Contributor: Jesse Vislisel, MD Photographer: Stefani Karakas, CRA Scleromalacia is a degenerative thinning of the sclera. This photo shows an anterior staphyloma secondary to scleromalacia in a patient with primary congenital glaucoma. In this case, eyelid displacement from the anterior staphyloma was resulting in exposure keratopathy. Reference: Sims J. Scleritis: presentations, disease associations and management. Postgrad Med J 2012;88(1046):713-718. https://PubMed.gov/22977282. DOI: 10.1136/postgradmedj-2011-130282","u":"pages/scleromalacia-staphyloma-glaucoma.htm","cr":"Kelly H. Yom, BA; Aaron M. Ricca, MD; Audrey C. Ko, MD","src":"er"},{"t":"Scleromalacia","im":[["E:LARGE/scleromalacia-LRG.jpg",""]],"h":"Scleromalacia occurs in the setting of necrotizing scleritis. This patient has very thin medial sclera of the right eye, with pigmented uveal tissue readily visible. Note the domed elevation of the tissue. A systemic workup revealed Wegener's granulomatosis as the cause of this patient's necrotizing scleritis.","u":"pages/scleromalacia.htm","cr":"Matt Weed, MD","src":"er"},{"t":"Scleromalacia with transillumination defect in the setting of chronic scleral buckle exposure","im":[["E:pages/Scleral-transillumination-defects/Scleral-TID-1-LRG.jpg",""],["E:pages/Scleral-transillumination-defects/Scleral-TID-2-LRG.jpg",""]],"h":"The patient was a 57-year-old man with vision loss in the right eye (OD) greater than left eye (OS) in the setting of a craniopharyngioma, which was resected 16 years prior. His visual acuity had been no light perception OD and 20/20 OS since the procedure.","u":"pages/Scleral-transillumination-defects/Index.htm","cr":"Jonathan L. Hager, MD","src":"er"}]},{"n":"Anterior chamber & uveitis","b":"Keratic precipitates, hypopyon, hyphema and endophthalmitis.","items":[{"t":"Keratic precipitates (KP) in juvenile idiopathic arthritis (JIA)","im":[["E:pages/KP-Keratic-precipitates-in-JIA/keratitis-RA-ppt-LRG.jpg",""],["E:pages/KP-Keratic-precipitates-in-JIA/keratitis-RA-ppt-slit-LRG.jpg",""]],"h":"Keratic precipitates (KP) are inflammatory cellular deposits on the corneal endothelium, often seen in the setting of intraocular inflammation. The KP in this photograph were seen in a patient with reactivation of juvenile idiopathic arthritis-associated anterior uveitis.","u":"pages/KP-Keratic-precipitates-in-JIA/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Mutton Fat Keratic Precipitates (KP)","im":[["E:pages/KP-Mutton-Fat-keratic-PPT/mutton-fat-KP-1-LRG.JPG",""],["E:pages/KP-Mutton-Fat-keratic-PPT/mutton-fat-KP-2-LRG.JPG",""],["E:pages/KP-Mutton-Fat-keratic-PPT/mutton-fat-KP-3-LRG.JPG",""]],"h":"This is a 51-year-old female that presented with severe ocular pain and photophobia. She presented acutely and had evidence of mutton-fat keratic precipitates (KP) on exam. She was later diagnosed with sarcoidosis. KP are collections of inflammatory cells on the corneal endothelium. When these coalesce and become large with a yellowish color, they are described as mutton-fat KP. These are typically associated with granulomatous inflammation. Mutton Fat Keratic Precipitates (KP) Mutton Fat Keratic Precipitates (KP) Category(ies): Cornea, Uveitis Contributors: Thomas D. Meram, MD and Christopher Sales, MD, MPH Photographer: Meghan Menzel, CRA A 68-year-old female presented to the emergency department with a chief complaint of blurry vision in the left eye. Slit lamp examination was significant for 2+ cell, flare, and mutton fat keratic precipitates in the distribution of Arlt’s triangle. The posterior segment exam was unremarkable. Workup was significant for positive HSV2 serum IgG. Keratic precipitates are clumps of inflammatory cells, that due to gravity and convection currents within the anterior chamber, settle in a wedge-shaped distribution on the inferior corneal endothelium. They are typically associated with, although not pathognomonic for, granulomatous inflammation.","u":"pages/KP-Mutton-Fat-keratic-PPT/index.htm","cr":"Lucas Lenci, MD","src":"er"},{"t":"Mutton Fat KP (keratoprecipitates)","im":[["E:photos-earlier/MuttonFatKP_03062005.jpg","Large, fatty clumps of WBC have collected on the endothelial surface of this transplanted cornea"]],"h":"Though mutton fat KP can be associated with several disorders, in the case of this patient with additional edema, DM folds, and pain in an eye with a corneal graft, there is significant concern for graft rejection.","u":"pages/Mutton-Fat-KP-keratoprecipitates.html","cr":"Jordan Graff, MD","src":"er"},{"t":"Grant syndrome (Syndrome of precipitates on the trabecular meshwork)","im":[["https://webeye.ophth.uiowa.edu/eyeforum/cases-i/case188/grant-1.jpg",""]],"h":"Gonioscopy photograph showing pigmented deposits on anterior trabecular meshwork in a patient with Grant syndrome (Syndrome of precipitates on the trabecular meshwork).","u":"pages/grants.htm","cr":"Brad Sacher, MD","src":"er"},{"t":"Anterior vitreous inflammation in autoimmune retinopathy","im":[["E:photos/Anterior-vitreous-Inflammation.jpg",""]],"h":"Anterior vitreous inflammatory cells are visible in the slit lamp beam between the crystalline lens and the underlying vitreous veils. This patient has a diagnosis of autoimmune retinopathy with positive testing for antiretinal autoantibodies.","u":"pages/anterior-vitreous-inflammation.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Reverse hypopyon","im":[["E:pages/reverse-hypopyon/reverse-hypopyon-slit.jpg",""]],"h":"A \"reverse hypopyon\" can form when emulsified silicone oil used during vitreoretinal surgery enters the anterior chamber of the eye. The silicone oil floats in the aqueous to look like a layered hypopyon in the upper portion of the anterior chamber. Also visible in this photograph is an inferior peripheral iridectomy and sectoral iris nevus.","u":"pages/reverse-hypopyon/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Leukemic pseudohypopyon","im":[["E:pages/Leukemic%20pseudohypopyon/leukemichypopyon_slitlamp-LRG.jpg","Slit lamp photograph of the left eye shows mild injection, clear cornea, and presence of a 3.5 mm blood-tinged pseudohypopyon in the anterior chamber with 4+ fine cell and no fibrin. Leukemic pseudohypoyon may present bilaterally, but this patient's right eye was unaffected"],["E:pages/Leukemic%20pseudohypopyon/leukemic-hypopyon_iris-LRG.jpg","Slit lamp photograph of the iris of the left eye highlights the presence of gelatinous fibrovascular lesions along the pupillary margin and peripheral iris."]],"h":"Pseudohypopyon is a relatively rare manifestation of leukemia. It occurs most often in patients with acute lymphoblastic leukemia and may be seen during a blast crisis or as a sign of relapse [1]. Rapid development of an atypical, blood-stained hypopyon that fails to respond to corticosteroid therapy is classic for leukemic pseudohypopyon [2]. Pseudohypopyon is distinguished from infectious or inflammatory hypopyon by the absence of an associated fibrin reaction. This pseudohypopyon was the first sign of this 56-year-old patient's acute lymphoblastic leukemia relapse. Timely anterior chamber aspiration with cytology and systemic malignancy work-up are paramount to ensuring appropriate diagnosis and treatment. Reference: Yi, D.H., et al., Acute unilateral leukemic hypopyon in an adult with relapsing acute lymphoblastic leukemia. Am J Ophthalmol, 2005. 139(4): p. 719-21. Ramsay, A. and S. Lightman, Hypopyon uveitis. Surv Ophthalmol, 2001. 46(1): p. 1-18","u":"pages/Leukemic%20pseudohypopyon/leukemic-pseudohypopyon.htm","cr":"Lauren E. Hock, MD; James C. Folk, MD","src":"er"},{"t":"Leukemic pseudohypopyon","im":[["E:photos/leukemic-hypopyon/leukemichypopyon_slitlamp-LRG.jpg","Slit lamp photograph of the left eye shows mild injection, clear cornea, and presence of a 3.5 mm blood-tinged pseudohypopyon in the anterior chamber with 4+ fine cell and no fibrin. Leukemic pseudohypoyon may present bilaterally, but this patient's right eye was unaffected."],["E:photos/leukemic-hypopyon/leukemic-hypopyon_iris-LRG.jpg","Slit lamp photograph of the iris of the left eye highlights the presence of gelatinous fibrovascular lesions along the pupillary margin and peripheral iris."]],"h":"Pseudohypopyon is a relatively rare manifestation of leukemia. It occurs most often in patients with acute lymphoblastic leukemia and may be seen during a blast crisis or as a sign of relapse [1]. Rapid development of an atypical, blood-stained hypopyon that fails to respond to corticosteroid therapy is classic for leukemic pseudohypopyon [2]. Pseudohypopyon is distinguished from infectious or inflammatory hypopyon by the absence of an associated fibrin reaction. This pseudohypopyon was the first sign of this 56-year-old patient's acute lymphoblastic leukemia relapse. Timely anterior chamber aspiration with cytology and systemic malignancy work-up are paramount to ensuring appropriate diagnosis and treatment. Reference: Yi, D.H., et al., Acute unilateral leukemic hypopyon in an adult with relapsing acute lymphoblastic leukemia. Am J Ophthalmol, 2005. 139(4): p. 719-21. Ramsay, A. and S. Lightman, Hypopyon uveitis. Surv Ophthalmol, 2001. 46(1): p. 1-18.","u":"pages/leukemic-pseudohypopyon.htm","cr":"Lauren E. Hock, MD; James C. Folk, MD","src":"er"},{"t":"Traumatic hyphema","im":[["E:pages/Hyphema/hyphema-1-LRG.jpg",""],["E:pages/Hyphema/hyphema-slit-LRG.jpg",""]],"h":"A hyphema is a collection of blood in the anterior chamber. Patients are at risk of elevated intraocular pressure and subsequent re-bleeding. Corneal blood staining may occur. This patient presented with a layered hyphema after blunt eye trauma.","u":"pages/Hyphema/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Hyphema following aborted iStent procedure","im":[["E:photos/hyphema-istent/Fig1.jpg","External photograph of the left eye shows a contracting post-operative hyphema two weeks after an iStent® trabecular micro-bypass procedure. The surgery had been aborted due to development of a hyphema and poor view. A hyphema is a rare complication during iStent insertion but has been reported in several publications [1-7]. However, microhyphemas observed on gonioscopy after the iStent procedure are more commonly seen."]],"h":"External photograph of the left eye shows a contracting post-operative hyphema two weeks after an iStent® trabecular micro-bypass procedure. The surgery had been aborted due to development of a hyphema and poor view. A hyphema is a rare complication during iStent insertion but has been reported in several publications [1-7]. However, microhyphemas observed on gonioscopy after the iStent procedure are more commonly seen.","u":"pages/hyphema-istent.htm","cr":"Austin R. Fox, MD, and Michael Griess, MD","src":"er"},{"t":"The Sympathizing Eye: Panuveitis Secondary to Sympathetic Ophthalmia","im":[["E:photos/sympathizing-eye/slitlamp-os-LRG.jpg","Slitlamp photography, left eye. There was 1+ cell and 1+ flare in the anterior chamber with trace nuclear sclerosis (left image). The vitreous exam was remarkable for significant anterior vitritis (right images)."]],"h":"This is a 46-year-old monocular man who presented with floaters, peripheral vision loss, and decreased central acuity in his left eye. Nine months prior to presentation, the right eye had suffered a penetrating globe injury with retinal detachment and was enucleated within four weeks of the injury. His slit lamp exam demonstrated anterior and posterior chamber cell (Figure 1). Dilated fundus exam revealed vitreous strands, grade III disc edema, and multiple, discrete, peripheral hypopigmented lesions consistent with Dalen-Fuchs nodules (i.e., lymphocytes and epithelioid histiocytes present between the RPE and Bruch membrane) (Figure 2). Fluorescein angiography demonstrated staining of the multiple peripheral lesions and leakage from the optic nerve and vessels in the posterior pole (Figure 3). Despite initial treatment with mycophenolate mofetil (CellCept) for several months, the patient experienced worsening peripheral vision and persistent vitreous inflammation. He underwent surgical placement of a ﬂuocinolone acetonide intravitreal implant (Retisert) for local, long-term inflammation control. Sympathetic ophthalmia (SO) is a rare, granulomatous panuveitis that usually occurs within one year of penetrating trauma to the fellow eye, likely as a result of uveoretinal antigens entering the conjunctival lymphatics [1, 2]. In addition to trauma, pars plana vitrectomy and other intraocular procedures are associated with increased SO risk [2]. Other characteristic findings of SO that were not present in this case include serous retinal detachments and mutton-fat keratic precipitates. Please refer to the Eye Rounds case on sympathetic ophthalmia for further information regarding work-up, differential diagnosis, pathophysiology, and management.","u":"pages/sympathizing-eye.htm","cr":"Brittni A. Scruggs, MD, PhD and Ian C. Han, MD","src":"er"},{"t":"Pan-endophthalmitis","im":[["E:photos-earlier/OD_06012004.jpg","1) Endophthalmitis from infected glaucoma trabeculectomy."],["E:photos/globe2_06012004.jpg","3) Enucleated globe."]],"h":"1) Endophthalmitis from infected glaucoma trabeculectomy. 3) Enucleated globe.","u":"pages/pan-endophthalmitis.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Delayed postoperative fungal endophthalmitis","im":[["E:pages/endophthalmitis-sp/Fungal-Endo-LRG.jpg",""]],"h":"70-year-old female who presented 3 years after cataract surgery with anterior and intermediate inflammation and decreased vision. Anterior slit lamp exam showed diffuse, mild conjunctival injection. She had dense fibrinous and cellular debris in the anterior chamber, which deposited on the corneal endothelium centrally and inferiorly. There was also neovascularization of the nasal iris. A vitreous tap was performed, in addition to injection of intravitreal vancomycin and amphotericin. The diagnosis of fungal endophthalmitis was made when curvularia species grew from her vitreous biopsy.","u":"pages/endophthalmitis-sp/index.htm","cr":"Johanna M. Dijkstal, MD","src":"er"},{"t":"Traumatic endophthalmitis","im":[["E:photos/facial/face-small.jpg","1) Presents with unilateral eye pain and redness after being poked in the eye with a sharp object one week previous."],["E:photos-earlier/hypopion.jpg","2) 1 mm layered hypopyon (WBCs)"],["E:photos/conj/conj.jpg","3) Scleral defect seen on slit lamp examination."]],"h":"1) Presents with unilateral eye pain and redness after being poked in the eye with a sharp object one week previous. 2) 1 mm layered hypopyon (WBCs) 3) Scleral defect seen on slit lamp examination.","u":"pages/traumatic-endophthalmitis.html","cr":"Andrew Doan, MD, PhD","src":"er"}]},{"n":"Iris & angle","b":"Neovascularisation, angle closure, pigment, ICE, dysgenesis and iris tumours.","items":[{"t":"Rubeosis iridis or neovascularization of the iris in diabetes","im":[["E:pages/NVI/NVI-LRG.jpg",""],["E:pages/NVI/nvi7-LRG.jpg",""],["E:pages/NVI/nvi2-LRG.jpg",""]],"h":"This is a 57-year-old man with a past medical history of diabetes mellitus type 2, who presented to the ophthalmology clinic for decreased vision. His most recent hemoglobin A1c was 12.8%. Upon applanation his intraocular pressures were 11 mmHg OD and 32 mmHg OS. Both eyes had fine vessels coursing along the iris surface in an irregular path directed radially towards the angle. His anterior segment exam demonstrated tufts of vessels along the pupillary margin in the left eye and fine vessel extending from the angle at 3 o'clock. There was a 1 mm layered hyphema in the left eye. On gonioscopy, he had a 35 degree angle and 360 degrees of neovascularization of the angle in both eyes. Posterior segment exam showed severe proliferative diabetic retinopathy in both eyes. Neovascularization of the iris (NVI), also known as rubeosis iridis, is when small fine, blood vessels develop on the anterior surface of the iris in response to retinal ischemia. These changes most often develop at the pupillary border, but it is important to perform gonioscopy in order to investigate for involvement of the angle. Patients with NVI are prone to spontaneous hyphemas as these blood vessels are fragile and lend to bleeding. Patients with proliferative diabetic retinopathy who develop NVI are often treated with panretinal photocoagulation with or without an intravitreal injection of an anti-VEGF medication.","u":"pages/NVI/index.htm","cr":"Johanna Beebe, MD;Jaclyn Haugsdal, MD","src":"er"},{"t":"Rubeosis iridis","im":[["E:photos-earlier/Rubeosis1.jpg",""],["E:photos-earlier/Rubeosis2.jpg",""]],"h":"This patient had severe ischemic disease in the left eye with resultant anterior segment neovascularization and associated neovascular glaucoma. The extensive rubeosis is seen here.","u":"pages/Rubeosis-iridis.html","cr":"David W Hayes, DO","src":"er"},{"t":"Iris Bombe","im":[["E:photos/bombe1.jpg",""],["E:photos/bombe2.jpg",""],["E:photos/irisbombe1-LRG.jpg",""]],"h":"Iris bombe is a condition in which there is apposition of the iris to the lens or anterior vitreous, preventing aqueous from flowing from the posterior to the anterior chamber. The pressure in the posterior chamber rises, resulting in anterior bowing of the peripheral iris and obstruction of the trabecular meshwork. This may result in an acute attack of angle closure glaucoma. Also note in this photograph a Seton tube inferiorly that is occluded by the iris bowing forward and the iris contacting the corneal endothelium peripherally. Contributor: Austin R. Fox, MD Photographer: Douglas B. Critser Despite multiple laser peripheral iridotomies, iris bombe developed in this patient with chronic iridocyclitis and central posterior synechiae.","u":"pages/iris-bombe.htm","cr":"Christopher Kirkpatrick, MD","src":"er"},{"t":"Acute Angle Closure Glaucoma","im":[["E:photos/angle-closure.jpg",""],["E:photos/SLE1.jpg",""],["E:photos/SLE2.jpg",""]],"h":"Patient awoke with severe pain OD, headache, decreased vision OD, and nausea. Photo shows unilateral redeye with hazy cornea. Right eye was very firm with a pressure of 70+ mmHg. Refractive error was +1.50 to +2.00 sphere in each eye. Examination of the left eye showed a narrow anterior chamber by comparing the width between slit beams. Von Herrick Test showed a narrow angle in the left eye. Distance between slit beams should be at least 1/2 of the corneal thickness (~250 microns). Gonioscopy demonstrated a closed angle OS too. Laser peripheral iridotomies (LPI) were performed on both eyes. Aqueous suppressants were started OD and the pressure dropped.","u":"pages/acute-angle-closure.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Glaukomflecken and iris atrophy after acute angle closure glaucoma","im":[["E:photos/glaukomflecken.jpg",""],["E:pages/glaukomflecken/AACG-atrophy-LRG.jpg",""],["E:pages/glaukomflecken/AACG-Glaucomflecken-LRG.jpg",""]],"h":"Glaukomflecken are small anterior subcapsular opacities secondary to lens epithelial necrosis resulting from acute angle closure glaucoma. These photographs from two different patients show central glaukomflecken and iris atrophy secondary to prior episodes of acute angle closure glaucoma..","u":"pages/glaukomflecken/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Pigment dispersion syndrome","im":[["E:photos-earlier/IrisTransilluminationDefects-PDS.jpg","1) Iris transillumination defects in a radial pattern (backbowing of iris rubs on lens zonules)."],["E:photos-earlier/SS_01222005.jpg","3) Scheie's stripe: pigment on the lens capsule"]],"h":"1) Iris transillumination defects in a radial pattern (backbowing of iris rubs on lens zonules). 3) Scheie's stripe: pigment on the lens capsule","u":"pages/pigment-dispersion-syndrome-glaucoma.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Scheie stripe in pigment dispersion syndrome","im":[["E:pages/Scheie-stripe/scheie-1-LRG.jpg",""],["E:pages/Scheie-stripe/scheie-2-LRG.jpg",""]],"h":"This is a 29-year-old, moderately myopic male who presented with elevated intraocular pressure in both eyes. Upon dilation, a Scheie stripe was noted, which is pigment deposition along the insertion of the zonular fibers to the lens. He was diagnosed with pigment dispersion syndrome.","u":"pages/Scheie-stripe/index.htm","cr":"Johanna M. Dijkstal, MD","src":"er"},{"t":"Pseudoexfoliation syndrome","im":[["E:photos/pseudoexfoliation-syndrome/PXFIOL1.jpg",""],["E:photos/pseudoexfoliation-syndrome/PXFIOL2-LRG.jpg",""],["E:pages/pseudoexfoliation-syndrome/1-PXF3-BC-LRG.jpg","Deposition of exfoliative material on the anterior lens capsule with intervening clear space. (higher resolution image of 1b not available)"]],"h":"Deposition of exfoliative material on the anterior lens capsule with intervening clear space. (higher resolution image of 1b not available)","u":"pages/pseudoexfoliation-syndrome/index.htm","cr":"Lorraine M. Provencher, MD","src":"er"},{"t":"pseudoexfoliation glaucoma (PXF)","im":[["E:photos-earlier/pupil_03172004.jpg","1) pseudoexfoliation material on pupil margin"],["E:photos-earlier/pupil2_03172004.jpg","2) bullseye lesion on lens capsule"],["E:photos-earlier/PXFa04292004.jpg","3) Sampaolesi's line on gonioscopy"]],"h":"Pseudoexfoliation syndrome (PXF) is an age-related disease characterized by an accumulation of grey and white fibrillar extracellular material in ocular tissues. The extracellular material is thought to be produced by lens capsule, ciliary body, corneal endothelium, zonules, and the iris. PXF is one of the most common causes of secondary open angle glaucoma, i.e. pseudoexfoliation glaucoma (PXG). Aggregation of extracellular material can cause congestion of the trabecular meshwork, leading to an increase in intraocular pressure. Patients affected by PXG may have a poor response to medical treatment and may go on to require laser or surgical therapy. Reference: Plateroti P, Plateroti AM, Abdolrahimzadeh S, Scuderi G. 2015. Pseudoexfoliation syndrome and pseudoexfoliation glaucoma: a review of literature with updates and surgical management. Journal of Ophthalmology. 2015:1-9.","u":"pages/pseudoexfoliation-glaucoma.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Pseudoexfoliation zonular dehiscence","im":[["E:photos-earlier/PXF2.jpg","Patient with pseudoexfoliation syndrome who had a cataract extraction and placement of an intraocular lens. Many years later, there was zonular dehiscence."]],"h":"Patient with pseudoexfoliation syndrome who had a cataract extraction and placement of an intraocular lens. Many years later, there was zonular dehiscence.","u":"pages/pseudoexfoliation-zonular-dehiscence.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Essential iris atrophy, iridocorneal endothelial (ICE) syndrome","im":[["E:pages/essential-iris-atrophy/essential-iris-atrophy-LRG.jpg",""],["E:pages/imgs/R_3rPHdZFXI74mgps_ICE1.png",""],["E:pages/imgs/R_3rPHdZFXI74mgps_ICE2.png",""]],"h":"Essential iris atrophy is one of the subtypes of iridocorneal endothelial (ICE) syndrome. In this condition, an abnormally proliferating corneal endothelium grows across the trabecular meshwork and iris to form broad peripheral anterior synechiae (PAS), ectropion uveae, and iris stretch and melt holes. This photograph shows corectopia with a superotemporal iris melt hole in a patient with essential iris atrophy. The patient also had extensive PAS on gonioscopy. Essential Iris AtrophyEssential Iris AtrophyCategory(ies): Glaucoma / IrisContributor: Mahsaw Mansoor, MDPhotographer: Jody Troyer, CRAPosted: 06/04/2024 Essential iris atrophy, iridocorneal endothelial (ICE) syndrome Essential iris atrophy, iridocorneal endothelial (ICE) syndrome Category(ies): Glaucoma / Iris Contributor: Emma M. Hartness, MD; Patrick Donegan, MD; Marc Toeteberg-Harms, MD Photographer: Jennifer A. Lynch Posted: 8/3/2026 A 54-year-old woman was originally referred to the glaucoma service by the optometry clinic for right pupil dyscoria. Examination originally showed a mild beaten-bronze appearance of the corneal endothelium, peripheral anterior synechiae extending past Schwalbe line, and a slight nasal peaking of the iris which progressed over several years into a horizontal ovoid dyscoria. She developed intraocular hypertension and was treated with one drop of timolol in the morning in the right eye.","u":"pages/essential-iris-atrophy/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Iridocorneal endothelial syndrome (ICE) early essential iris atrophy","im":[["E:photos-earlier/pupil05032004.jpg","Corectopic (i.e., oval) left pupil ."],["E:photos/cornea-misc/cornea205032004.jpg","Cornea with hammered silver appearance of endothelium."]],"h":"Corectopic (i.e., oval) left pupil . Cornea with hammered silver appearance of endothelium.","u":"pages/iridocorneal-endothelial-syndrome-ICE-essential-iris-atrophy.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"High peripheral anterior synechia in iridocorneal endothelial syndrome","im":[["W:LARGE/peripheral-anterior-synechia-L.jpg","This gonioscopic photo demonstrates a high PAS which extends to Schwalbe's line and is characteristic of ICE syndrome."],["E:photos/PAS/Fig2-gonioscopic-OD-PAS.jpg","Gonioscopic photography of the right eye shows high peripheral anterior synechiae (PAS) noted by the black arrow and visible ciliary processes (between the white arrows)."],["E:photos/PAS/Fig3-gonioscopic-OD-crystalline-lens.jpg","Gonioscopic photography of the right eye provides a unique view of the ciliary processes (white arrow) and zonules of the crystalline lens (grey arrow) due to high PAS."]],"h":"Peripheral anterior synechiae (PAS) are adhesions of the peripheral iris to the structures in the angle of the anterior chamber. They may be associated with a variety of conditions such as angle closure glaucoma, neovascular glaucoma, uveitis, and iridocorneal endothelial (ICE) syndrome. High peripheral anterior synechia in iridocorneal endothelial syndrome High peripheral anterior synechia in iridocorneal endothelial syndrome Category(ies): Glaucoma/iris Contributor: Andrew Goldstein, MD; and Erin Boese, MD Photographer: Jody Troyer, CRA This series of images was obtained in a 30-year-old female who presented for evaluation of an abnormal pupil and was subsequently diagnosed with iridocorneal endothelial (ICE) syndrome.","u":"pages/Peripheral-anterior-synechiae.htm","cr":"Justin Risma, MD","src":"er"},{"t":"Iridoschisis","im":[["E:pages/imgs/R_1luyQuwDL3wkJJ2_iridoschisis1.png",""],["E:pages/imgs/R_1luyQuwDL3wkJJ2_iridoschisis2.png",""],["E:pages/imgs/R_1luyQuwDL3wkJJ2_iridoschisis3.png",""]],"h":"A 74-year-old man presented for evaluation of narrow angle glaucoma in both eyes. On exam there was notable iridoschisis of the inferior iris in both eyes. This is a rare condition in which the anterior iris stroma separates from the deeper tissues. The fragments of iris can rub on the cornea and result in pigment deposition and corneal decompensation. Glaucoma can develop from an angle closure mechanism as a result of pupillary block or from an open angle mechanism as pigment is liberated into the trabecular meshwork.","u":"pages/Iridoschisis_2.html","cr":"Mahsaw Mansoor, MD","src":"er"},{"t":"Axenfeld-Rieger syndrome","im":[["W:photos/Axenfeld-Rieger/AR1-LRG.jpg",""]],"h":"OMIM #180500 Alward, W. L. M. Axenfeld-Rieger syndrome in the age of molecular genetics. Am. J. Ophthal. 130: 107-115, 2000. [PubMed: 11004268])","u":"pages/Axenfeld-Rieger/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Peters anomaly","im":[["https://eyerounds.org/cases-i/case187/Peter-Fig-3-LRG.jpg","Small, bilateral corneal opacities with associated iridocorneal adhesions in a patient with Peters anomaly."],["https://eyerounds.org/cases-i/case187/Peter-Fig-2-LRG.jpg","Corneal opacification due to Peters anomaly affecting the right eye more prominently than the left."]],"h":"Peters anomaly is a rare congenital disorder in the spectrum of anterior segment dysgenesis. Findings include corneal opacities and absence of normal posterior corneal structures. Iridocorneal or corneolenticular adhesions may be present.","u":"pages/Peters/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Congenital aniridia","im":[["https://webeye.ophth.uiowa.edu/eyeforum/cases-i/case211/L/1a-OD-LRG.jpg","Slit lamp photographs - corneal pannus"],["https://webeye.ophth.uiowa.edu/eyeforum/cases-i/case211/L/1b-OS-LRG.jpg","Slit lamp photographs - corneal pannus"],["https://webeye.ophth.uiowa.edu/eyeforum/cases-i/case211/L/1c-OD-LRG.jpg","Slit lamp photographs - subepithelial haze"]],"h":"Congenital aniridia is a hereditary disease most commonly with autosomal dominant inheritance. These slit lamp photographs of a 17-year-old with aniridia show corneal pannus, subepithelial haze, and iris hypoplasia. There is fluorescein uptake of the pannus due to leaky intracellular junctions. The patient also has small anterior polar cataracts. The macular OCT shows absence of the normal foveal depression, consistent with foveal hypoplasia","u":"pages/Congen-Aniridia/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Congenital aniridia(2)","im":[["https://webeye.ophth.uiowa.edu/eyeforum/cases-i/case211/L/4a-aniridia-preop-LRG.jpg","This patient with congenital aniridia has 3-piece posterior chamber intraocular lenses in both eyes"],["https://webeye.ophth.uiowa.edu/eyeforum/cases-i/case211/L/4b-aniridia-preop-OS-LRG.jpg","This patient with congenital aniridia has 3-piece posterior chamber intraocular lenses in both eyes"],["https://webeye.ophth.uiowa.edu/eyeforum/cases-i/case211/L/4c-aniridia-preop-RR-LRG.jpg","They are seen on retroillumination"]],"h":"Congenital aniridia is a hereditary disease most commonly with autosomal dominant inheritance. These slit lamp photographs show iris hypoplasia and corneal scarring in a patient with congenital aniridia. This patient underwent cataract surgery and has 3-piece posterior chamber intraocular lenses in both eyes which are easily visible with retroillumination.","u":"pages/congen-aniridia-2/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Iris coloboma","im":[["E:pages/iris-coloboma/iris-coloboma-LRG.jpg",""],["E:photos/coloboma/Coloboma-temporal-iris-lens-cataract.JPG","This patient presented with a temporal anterior segment coloboma in his right eye. This is unusual as colobomas are typically inferonasal, where the optic fissure fails to close completely during development."],["E:photos/bridgeColo.jpg","The pyriform shape of the microcornea together with its pointing in the direction of the fetal fissure indicates that a coloboma of the iris is present. The coloboma is in a special category, i.e. the bridge coloboma. Through computer manipulation, an attempt has been made to make visible the thin bridge of iris tissue that crosses the coloboma gap to complete the pupil in that area. One must look very carefully to see this bridge. Of course, with the slit-lamp it is readily visible."]],"h":"\"Typical\" iris colobomas are located in the inferonasal quadrant. They are caused by failure of the embryonic fissure to close in the 5th week of gestation, resulting in a \"keyhole-shaped\" pupil. They may be associated with colobomas of the ciliary body, choroid, retina, or optic nerve. \"Atypical\" iris colobomas are not caused by embryonic fissure closure defects and thus are not associated with other colobomas. Older Images Historical images, Iris Coloboma Contributor: Contributor: William Charles Caccamise, Sr, MD, Retired Clinical Assistant Professor of Ophthalmology, University of Rochester School of Medicine and Dentistry *Dr. Caccamise has very generously shared his images of patients taken while operating during the \"eye season\" in rural India as well as those from his private practice during the 1960's and 1970's. Many of his images are significant for their historical perspective and for techniques and conditions seen in settings in undeveloped areas.","u":"pages/iris-coloboma/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Iris coloboma","im":[["E:pages/imgs/R_3sgZa2cgWEBiXkq_Iris%20coloboma3.png",""],["E:pages/imgs/R_3sgZa2cgWEBiXkq_Iris%20coloboma1.png",""],["E:pages/imgs/R_3sgZa2cgWEBiXkq_Iris%20coloboma2.png",""]],"h":"A 20-year-old man presented for routine follow up of congenital nystagmus. Anterior segment examination revealed an iris coloboma in both eyes. In the right eye, there was concomitant congenital cataract. Colobomas are developmental defects that result from incomplete closure of the embryonic fissure. Colobomas can involve the iris, ciliary body, choroid, retina, and optic nerve. Colobomas are located in the inferonasal quadrant.","u":"pages/Iris_coloboma.html","cr":"Mahsaw Mansoor, MD","src":"er"},{"t":"Temporal iris and lens coloboma associated with cataract","im":[["E:photos/coloboma/Coloboma-temporal-iris-lens-cataract.JPG",""]],"h":"This patient presented with a temporal anterior segment coloboma in his right eye. This is unusual as colobomas are typically inferonasal, where the optic fissure fails to close completely during development.","u":"pages/coloboma-temporal-iris-lens-cataract.html","cr":"Matthew Ward, MD","src":"er"},{"t":"Lisch nodules","im":[["E:pages/Lisch/Lisch-nodules-LRG.jpg","Photos of patient by Brice Critser, CRA"],["E:pages/Lisch/Lisch-nodules-68-LRG.jpg","Photos of patient by Brice Critser, CRA"],["E:pages/Lisch/Lisch-nodules-90-LRG.jpg","Photos of patient 3 by Ed Heffron"]],"h":"Lisch nodules are melanocytic hamartomas of the iris, often associated with neurofibromatosis (NF) I. They are usually elevated and tan in appearance. Their incidence in NF1 increases with age and their prevalence raises by about 10% per year of life, up to age 9. These photographs show the various appearances of these nodules in 3 different patients with NF1. Lisch nodules Lisch nodules Category(ies): Glaucoma, Iris, Pediatrics Contributor: Caitlin M. Hackl MD, Patrick J. Donegan MD, Ryan J. Diel MD Photographer: Copple, Alexandra D The patient is a 38-year-old female with Neurofibromatosis 1. Slit lamp photography demonstrates Lisch nodules bilaterally.","u":"pages/Lisch/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Sturge-Weber Syndrome","im":[["E:photos/episcleral-venous-pressure.jpg","3) Dilated episcleral vessels due to increased episcleral venous pressure."]],"h":"3) Dilated episcleral vessels due to increased episcleral venous pressure.","u":"pages/Sturge-Weber-Syndrome.html","cr":"Andrew Doan, MD, PhD 1) port wine stain along dermatomal distribution Enlarge Download 2)Choroidal hemangioma ","src":"er"},{"t":"Iris pigment epithelial cysts","im":[["E:photos/iris/iris-pigment-epithelial-cysts.JPG","The central cysts above were seen in a 62-year-old female with a history of angle closure glaucoma (perhaps due to enlargement of the cysts)."],["E:pages/iris-pigment-epithelial-cysts/iris-pigment-epithel-cyst-slit-LRG.jpg","On slit lamp examination , an elevation of the inferior iris is seen. It appears as the iris is being pushed or bowed forward from a posterior mass. Folds in the iris can be seen."],["E:pages/iris-pigment-epithelial-cysts/iris-pigment-epithel-cyst-LRG.jpg","On slit lamp examination , an elevation of the inferior iris is seen. It appears as the iris is being pushed or bowed forward from a posterior mass. Folds in the iris can be seen."]],"h":"These cysts are fairly rare and classified as central (3%), midzonal (21%), peripheral (73%), and dislodged (3%). The majority of iris pigment epithelial cysts are benign and do not require any treatment. Reference: Lois N, Shields CL, Shields JA, Mercado G. Primary cysts of the iris pigment epithelium. Clinical features and natural course in 234 patients. Ophthalmology. 1998 Oct;105(10):1879-85.","u":"pages/iris-pigment-epithelial-cysts/index.htm","cr":"Matt Ward, MD","src":"er"},{"t":"Anterior chamber epithelial inclusion cyst","im":[["E:photos/epithelial-inclusion-cyst-express-shunt.jpg",""],["E:photos/epithelial-inclusion-cyst-express-shunt-2.jpg",""],["E:photos/epithelial-inclusion-cyst-express-shunt-gonio.jpg",""]],"h":"Epithelial inclusion cysts result when corneal or conjunctival epithelial cells are introduced into the eye from penetrating trauma or surgery. In contrast to the sheet-like growth pattern of epithelial downgrowth, these cysts occur when the cells conform to a more localized, cystic shape. This patient underwent an ExPress glaucoma shunt placement (visible superiorly) and later developed this rapidly expanding epithelial inclusion cyst inferiorly.","u":"pages/epithelial-inclusion-cyst-anterior.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Iris Melanocytoma","im":[["E:pages/iris-melanocytoma/iris-melanocytoma-1-LRG.jpg","Slit lamp examination, demonstrates a dark brown, pigmented lesion in the peripheral iris extending from 6:30 to 8 o'clock. Notably, there is no neovascularization of the iris and the pupil is round. Diagnosis was confirmed by biopsy."],["E:pages/iris-melanocytoma/melanocytoma2-TV-LRG.jpg",""],["E:pages/iris-melanocytoma/melanocytoma-slit-TV-LRG.jpg",""]],"h":"A melanocytoma is a specific type of uveal tract nevus, termed \"magnocellular nevus\", characterized clinically by its jet-black coloration and histologically by its heavily pigmented, large, polygonal, bland cells. Clinically, melanocytomas most often present as asymptomatic pigmented lesions. Melanocytomas can occur anywhere along the uveal tract, but are most commonly found in the juxtapapillary region of the choroid (see","u":"pages/iris-melanocytoma/index.htm","cr":"Thomas J.E. Clark, MD","src":"er"},{"t":"Iris Melanoma","im":[["E:photos/iris-melanoma/iris-melanoma-primary-LRG.jpg","Primary lesion presentation, 2005"],["E:photos/iris-melanoma/iris-melanoma-evolution-LRG.jpg","Evolution of primary lesion, 2019"],["E:photos/iris-melanoma/iris-melanoma-elevation-LRG.jpg","Elevation of the iris melanoma"]],"h":"Laura Fuhrmeister 93-year-old woman presented with progression of longstanding iris nevus. Her original presentation in 2005 is shown in Figure 1. Figures 2 and 3 demonstrate frank enlargement of the primary lesion at 6 o'clock and local metastasis, with erosion through the angle into the sclera at 8o'clock (Figures 4 and 5). Pigmented keratic precipitates are suspicious for anterior chamber seeding (Figure 6). High frequency anterior segment imaging demonstrates further angle invasion (arc of high reflectivity; Figure 7). Contributor: Andrew Doan, MD, PhD 3 patients with iris melanomas. The last patient had a recurrence 20 years later after an iridocyclectomy. Contributor: John Chen, MD, PhD Photographer: D. Brice Critser, CRA 81-year-old female with a slowly enlarging iris lesion found to be an iris melanoma originating from an iris nevus.","u":"pages/iris-melanoma.html","cr":"David A. Ramirez, MD; Mark A. Greiner, MD","src":"er"},{"t":"Ring Melanoma","im":[["E:pages/Ring-Melanoma/Ring-melanoma-LRG.jpg",""],["E:pages/imgs/R_7QVBCICVQk77sWZ_IMG_2490.jpeg","Slit lamp exam of the right eye shows several areas of inferior irregular iris pigmentation. There are additionally areas of pigmented extrascleral extension."],["E:pages/imgs/R_7QVBCICVQk77sWZ_IMG_2491.jpeg","Gonioscopy exam shows a deeply pigmented angle mass."]],"h":"This is an 81-year-old gentleman who was referred to the University of Iowa glaucoma service for a history of acquired heterochromia, in addition to progressively elevated intraocular pressures. Upon presentation his anterior slit lamp exam showed a deep anterior chamber with 2+ pigmented cell. There was diffuse, velvet-like pigment on the iris in a circumferential fashion and also neovascularization. He had a posterior chamber intraocular lens. Gonioscopy revealed thick pigment overlying the entire iridocorneal angle for 360 degrees, causing his elevated IOP due to obstruction of the trabecular meshwork. Ocular echography revealed a ciliochoroidal lesion measuring 17mm at its base and 6mm in height. He was diagnosed with a ciliochoroidal melanoma leading to ring melanoma which prompted an immediate metastatic work up and subsequent enucleation. Ring MelanomaRing MelanomaCategory(ies): Glaucoma / IrisContributor: Bilal Ahmed, MD; Sean Rivera, MD; Nathaniel Sears, MDPhotographer: Jody Troyer, CRAPosted: 01/10/2025A 58 year old woman presented for evaluation and treatment of an iris/ciliary body melanoma of the right eye. She initially noted scleral pigmentation which she initially thought was due to mascara. Upon presenting to her local ophthalmologist for worsening right eye pain, her IOP was elevated and she was found to have a pigmented lesion in the angle. Extensive, deep pigment was visualized 360 degrees in the angle on gonioscopy exam. There was also evidence of iris freckles and deep scleral pigment on slit lamp examination concerning for extraocular extension. The patient underwent high frequency anterior segment echography which demonstrated a lobular ring-like structure from 3-7 o'clock in the ciliary body with medium reflectivity which was consistent with an iridociliary melanoma. The patient ultimately underwent enucleation for local tumor control as plaque brachytherapy was unlikely to treat the extensive angle and extrascleral involvement.","u":"pages/Ring-Melanoma/index.htm","cr":"Johanna Beebe, MD","src":"er"},{"t":"Traumatic iris sphincter tears","im":[["E:pages/iris-spincter-tears/iris-spincter-tears-LRG.jpg",""],["E:pages/iris-spincter-tears/iris-spincter-tears-2-LRG.jpg",""],["E:pages/iris-spincter-tears/iris-spincter-tears-retroillumine-LRG.jpg",""]],"h":"Tears in the iris sphincter may occur after blunt eye trauma and result in persistent mydriasis. These photos, taken 4 days after blunt trauma to the eye, show multiple scalloped tears in the iris sphincter along the pupillary margin inferiorly and temporally. Also visible is the traumatic anterior subcapsular cataract.","u":"pages/iris-spincter-tears/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Iridodialysis","im":[["E:photos-earlier/iridodialysis2.jpg","retroillumination - Iridodialysis from BB gun injury"],["E:photos-earlier/irido.jpg","Patient with blunt trauma resulting in tear of the iris."],["E:photos-earlier/irido1.jpg","Patient with blunt trauma resulting in tear of the iris."]],"h":"retroillumination - Iridodialysis from BB gun injury Patient with blunt trauma resulting in tear of the iris.","u":"pages/iridodialysis-2.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Angle recession and cyclodialysis after blunt trauma","im":[["E:photos/angle-recession-cyclodialysis-cleft%20.PNG",""],["E:pages/imgs/R_5gdt6tzWURiV6cZ_Cyclodialysis%20cleft.jpg","A 65-year-old woman presented for evaluation of hypotony after cataract surgery in her left eye. On examination, the patient’s intraocular pressure was 1-2 mmHg and on gonioscopy there was a large, mature cyclodialysis cleft nasally (white arrows). Cyclodialysis is the result of disinsertion of the scleral spur from the ciliary body, which creates a direct passageway from the anterior chamber to the suprachoroidal space."]],"h":"Traumatic angle recession on gonioscopic photos: This patient developed angle recession and a cyclodialysis cleft after racketball impact to the eye. Angle recession results from separation of the longitudinal and circular muscles of the ciliary body. Note the broad band of visible ciliary body face. He also had a cyclodialysis cleft, or separation of ciliary body from the scleral spur, which appears as a broad white band at the junction of the ciliary body and scleral spur. Ultrasound biomicroscopy (UBM) of a traumatic cyclodialysis cleft Ultrasound biomicroscopy (UBM) of a traumatic cyclodialysis cleft Contributor: Ze Zhang, MD Traumatic cyclodialysis cleft on high frequency ultrasound biomicroscopy: This patient presented with hypotony after blunt trauma. Please note the separation of the ciliary body from the scleral spur, leading to a direct communication between the anterior chamber and the supraciliary space. Also note the blood in the angle which extends into the supraciliary space through the cleft. Cyclodialysis CleftCyclodialysis CleftCategory(ies): Glaucoma / IrisContributor: Mahsaw Mansoor, MDPhotographer: Jody Troyer, CRAPosted: 06/03/2024A 65-year-old woman presented for evaluation of hypotony after cataract surgery in her left eye. On examination, the patient’s intraocular pressure was 1-2 mmHg and on gonioscopy there was a large, mature cyclodialysis cleft nasally (white arrows). Cyclodialysis is the result of disinsertion of the scleral spur from the ciliary body, which creates a direct passageway from the anterior chamber to the suprachoroidal space.","u":"pages/angle-recession-cyclodialysis-cleft.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Haab striae in primary congenital glaucoma","im":[["E:pages/Haab/Haabs-striae-OD-LRG.jpg",""],["E:pages/Haab/Haabs-striae-OS-LRG.jpg",""]],"h":"Randy Verdick, FOPS Haab striae are curvilinear breaks in Descemet's membrane, resulting acutely from stretching of the cornea in primary congenital glaucoma. They are typically oriented horizontally or concentric to the limbus in contrast to Descemet's tears, resulting from birth trauma, that are usually vertical or obliquely oriented.","u":"pages/Haab/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Congenital Glaucoma","im":[["E:photos/congenital/CongenitalGlaucoma_1.jpg","\"Congenital glaucoma in a 11-year-old Afghani boy. Please note the bilateral buphthalmos.\""],["E:photos/congenital/CongenitalGlaucoma_2.jpg","Primary congenital glaucoma (also termed \"Infantile Glaucoma\") is associated with Haab striae, seen here in slit lamp view of the cornea."],["E:photos/congenital/CongenitalGlaucoma_3.jpg","Larger and closer view provides greater detail of these extensive, circumferential breaks in Descemet's membrane."]],"h":"I am a Navy flight surgeon currently serving my second tour here in SW Asia. Due to my interest in Ophthalmology I am working closely with an Egyptian field hospital where I see about 45 local Afghani's a day. As you can imagine in a country of 30 million and very few ophthalmologist, the pathology is amazing. The EyeRounds Editorial Board welcomes this submission of US NAVY Flight Surgeon Dr. David Hayes, practicing abroad:","u":"pages/Congenital-Glaucoma.html","cr":"David W. Hayes, DO","src":"er"},{"t":"Oculocutaneous albinism","im":[["E:LARGE/oculocutaneous-albinism-2-LARGE.jpg",""],["E:LARGE/oculocutaneous-albinism-LARGE.jpg",""]],"h":"This 7-year-old girl presented with decreased vision and nystagmus and was diagnosed with oculocutaneous albinism (OCA). OCA is typically inherited in an autosomal
