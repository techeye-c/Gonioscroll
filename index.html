inked dominant condition that is characterized by the triad of round, depigmented chorioretinal lacunae, agenesis of the corpus collosum, and infantile spasms. It can also be associated with optic nerve colobomas and microphthalmos. The condition is almost always seen in females as it is usually lethal in males.","u":"pages/Aicardi/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Chorioretinal coloboma","im":[["E:pages/chorioretinal-coloboma/chorioretinal-coloboma-EH-LG.jpg","photo above by Ed Heffron"],["E:pages/chorioretinal-coloboma/chorioretinal-coloboma-CMT-LG.jpg","photo above by Cindy Montague"]],"h":"Chorioretinal colobomas are caused by failure of the embryonic fissure to close during development. They have a yellow-white appearance, often with hyperpigmented margins. They are most common in the inferonasal quadrant and may be associated with colobomas of the iris and optic nerve. The below photographs show chorioretinal colobomas from two different patients.","u":"pages/chorioretinal-coloboma/index.htm","cr":"Jesse Vislisel, MD","src":"er"}]},{"n":"Tumours & masses","b":"Choroidal and retinal tumours, hamartomas and metastases.","items":[{"t":"Choroidal malignant melanoma in a \"collar button\" configuration","im":[["https://eyerounds.org/cases-i/case190/LARGE/Fig1.jpg",""],["https://eyerounds.org/cases-i/case190/LARGE/fig2.jpg",""],["https://eyerounds.org/cases-i/case190/LARGE/fig4.jpg",""]],"h":"Choroidal malignant melanoma with disruption of Bruch's membrane and nodular eruption in a \"collar button\" shape. B-scan ultrasonography shows the peaked choroidal mass with adjacent exudative retinal detachment. A-scan shows low to medium internal reflectivity. The gross and histopathology specimens are demonstrated in the bottom two photographs. Read the full case report for more information on this patient and choroidal malignant melanoma.","u":"pages/Choroidal-malignant-melanoma-collar-button.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Choroidal malignant melanoma with orange pigment","im":[["https://eyerounds.org/cases-i/case190/LARGE/fig9a.jpg",""],["https://eyerounds.org/cases-i/case190/LARGE/fig9b.jpg",""]],"h":"Mildly elevated pigmented choroidal mass with orange pigment and adjacent subretinal fluid visible on optical coherence tomography (OCT). The patient also had associated visual symptoms. These features are suggestive of choroidal malignant melanoma as opposed to benign pigmented lesions. Read the full case report for more information on choroidal malignant melanoma.","u":"pages/Choroidal-malignant-melanoma-orange-pigment.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Ciliochoroidal Melanoma","im":[["E:pages/Ciliochoroidal-Melanoma/melanoma-1-LRG.jpg",""],["E:pages/Ciliochoroidal-Melanoma/melanoma-2-LRG.jpg",""]],"h":"A large ciliochoroidal melanoma noted at the slit lamp with visible striae from traction on the posterior lens capsule. The patient had recent cataract surgery with an outside provider.","u":"pages/Ciliochoroidal-Melanoma/index.htm","cr":"David Phillips, MD","src":"er"},{"t":"Circumscribed choroidal hemangioma","im":[["E:pages/choroidal-hemangioma-circumscribed/1a-CH-LRG.jpg","OCT"],["E:pages/choroidal-hemangioma-circumscribed/1b-CH-LRG.jpg","- Optical coherence tomography (OCT) section through the macula demonstrating sub-retinal fluid prior to treatment. Visual acuity 20/70."],["E:pages/choroidal-hemangioma-circumscribed/1f-CH-post-tx.jpg","- OCT eight months after treatment showing complete resorption of fluid - visual acuity 20/30."]],"h":"Choroidal hemangiomas are benign vascular hamartomas that can be diffuse (as seen in the case of Sturge-Weber syndrome) or circumscribed as shown here. They typically are red-orange in color with indistinct margins and are located in the posterior pole. There may be overlying retinal pigmented epithelium (RPE) changes or orange pigment. The lesions may have associated intraretinal or subretinal fluid. They display high internal reflectivity on A-scan echography. To learn more about choroidal hemangiomas, read the related case report. Entry 1 Contributor: Jesse Vislisel, MD Photographers: Randy Verdick, FOPS (figs. 1a, 1b); Antionette Venckus, CRA (fig. 1f) These photographs show the appearance of a circumscribed choroidal hemangioma before and after treatment with photodynamic therapy (PDT). The lesion appeared as an elevated choroidal mass with overlying orange plaques and RPE atrophy. Vascular leakage from the lesion resulted in macular edema overlying the lesion, as seen in the OCT, and surrounding subretinal fluid resulting in an exudative retinal detachment, as seen on the B-scan echography. A-scan echography revealed high internal reflectivity, which is typical for these lesions. Overlying fibrosis can be seen in the post-treatment photograph. The treatment resulted in a reduction in tumor height and decreased subretinal fluid. It was successful in decreasing the patient's metamorphopsia. Entry 2 Contributor: Eric Chin, MD These photographs show the appearance of circumscribed choroidal hemangiomas in two different patients (Figures 2a and 2b are one patient, figures 2c and 2d are another). Entry 3 Contributor: Greg Zablocki, Retina Consultants of Colorado, P.C. This patient presented with a visually-significant choroidal hemangioma. The patient underwent photodynamic therapy employing the technique of Michels et al. After infusion of 6mg/m2 of verteporfin (Visudyne) intravenously the lesion was illuminated for 163 seconds with the activating laser. Two months later vision had improved from 20/70 to 20/30 and the sub-retinal fluid had resolved clinically and on OCT. Reference: Verteporfin therapy for choroidal hemangioma: a long-term follow-up, Michels, et al Retina. 2005;25(6):697-703","u":"pages/choroidal-hemangioma-circumscribed/index.htm","cr":"Jesse Vislisel, MD, Eric Chin, MD","src":"er"},{"t":"Choroidal osteoma","im":[["E:pages/osteoma/osteoma-LRG.jpg","OCT scan portrays a highly-reflective lesion at the level of the choroid with associated subretinal fluid."],["E:pages/osteoma/osteoma-Ascan-cropped-LRG.jpg","The A-scan shows the high reflectivity of the mass."],["W:photos-earlier/ODage7_04072004.jpg",""]],"h":"Choroidal osteomas are benign neoplasms in which areas of the choroid are replaced with mature bone. The tumors are most commonly solitary, unilateral, and juxtapapillary in location which helps differentiate them from idiopathic sclerochoroidal calcification. They appear clinically as ovoid subretinal lesions, ranging from yellow-white to orange-red in color, sometimes with overlying pigmentary changes. Other choroidal osteoma images Other choroidal osteoma images Contributor: Glen Bianchi, MD and Andrew Doan, MD, PhD, University of Iowa Other choroidal osteoma images Other choroidal osteoma images Contributor: Andrew Doan, MD, PhD, and Tom Fisher, University of Iowa","u":"pages/osteoma/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Carcinosarcoma choroidal metastasis","im":[["E:photos/Carcinosarcoma-choroidal-metastasis/MET-LRG.jpg",""],["E:photos/Carcinosarcoma-choroidal-metastasis/A-Scan-LRG.png",""]],"h":"This patient presented with photopsias and was found to have an amelanotic, mildly elevated choroidal mass with irregular borders. OCT revealed an area of choroidal elevation with loculated areas of overlying subretinal fluid. The \"lumpy-bumpy\" appearance and loculated fluid collections are common with choroidal metastasis due to tumor involution in areas with insufficient blood supply. B-scan demonstrates a slightly lobulated area of mild choroidal elevation. In contrast to melanoma, choroidal metastases usually exhibit medium-high internal reflectivity on A-scan. This lesion had high internal reflectivity. Systemic workup was performed and revealed a previously undiagnosed uterine carcinosarcoma with systemic metastases. The primary tumor is undiagnosed at the time of presentation in approximately 1/3 of choroidal metastases.","u":"pages/carcinosarcoma-choroidal-metastasis.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Mantle cell lymphoma with choroidal metastasis","im":[["E:photos/choroid-lymphoma-metastasis/L/Lymphoma-retinal-detachment-1-LRG.jpg",""],["E:photos/choroid-lymphoma-metastasis/L/Lymphoma-retinal-detachment-2-LRG.jpg",""],["E:photos/choroid-lymphoma-metastasis/L/Lymphoma-retinal-detachment-ascan-LRG.jpg",""]],"h":"This 60-year-old woman with mantle cell lymphoma was found to have lymphoma metastasis to the choroid. The large, solid, lobular mass can be seen approaching the optic nerve. The mass had low internal reflectivity on A-scan ultrasonography. B-scan showed diffuse infiltration of the choroid becoming elevated near the optic disc. An associated retinal detachment can be visualized inferiorly. OCT shows a diffuse shallow retinal detachment with the irregular, \"lumpy-bumpy\" infiltration of the choroid.","u":"pages/choroid-mantle-cell-lymphoma-metastasis.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Langerhans histiocytosis with choroidal infiltrates","im":[["E:pages/Langerhans-histiocytosis/Histiocytosis-X-montage-OD-LRG.jpg","Right eye"],["E:pages/Langerhans-histiocytosis/Histiocytosis-X-montage-OS-LRG.jpg","Left eye"]],"h":"Randy Verdick, FOPS Langerhans histiocytosis is the result of clonal expansion of Langerhans cells. Rarely, it can result in choroidal mass lesions, such as these, if the choroid is infiltrated.","u":"pages/Langerhans-histiocytosis/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Retinal hemangioblastoma associated with Von-Hippel Lindau syndrome","im":[["E:pages/Retinal-hemangioblastoma-VHL/Angioma-1-LRG.jpg","On follow up, she is found to have a moderately sized hemangioma just inferior to the largest previously treated lesion."],["E:pages/Retinal-hemangioblastoma-VHL/Angioma-2-LRG.jpg","There is a second, early hemangioma superonasal to the large chorioretinal scar"]],"h":"This patient is a 76-year-old woman with Von-Hippel Lindau syndrome. In additional to the many small hemangiomas that were previously treated, she had a large superotemporal hemangioma that was treated more than 10 years prior with cryotherapy and photocoagulation. On follow up, she is found to have a moderately sized hemangioma just inferior to the largest previously treated lesion. There is a second, early hemangioma superonasal to the large chorioretinal scar seen on the montage photo. Capillary hemangiomas in the peripheral retina can often be observed as they are known to spontaneously regress or remain stable for years. Commonly used treatment modalities include argon laser photocoagulation, cryotherapy, and photodynamic therapy. Some studies suggest a benefit to using anti-VEGF as an adjunctive therapy.","u":"pages/Retinal-hemangioblastoma-VHL/index.htm","cr":"William Flanary, MD","src":"er"},{"t":"Von Hippel-Lindau Disease","im":[["E:photos/Von-Hipple-Lindau.jpg",""]],"h":"31-year-old female with Von Hippel-Lindau disease with an optic nerve capillary hemangioblastoma and a small capillary hemangioblastoma status post laser along the inferior temporal arcade.","u":"pages/von-hipple-lindau.htm","cr":"C. Blake Perry, MD","src":"er"},{"t":"Retinal Cavernous Hemangiomas","im":[["E:LARGE/retinal-cavernous-hemangioma-1-LARGE.jpg","Image 1: Right Eye (OD): unremarkable vitreous; 0.1 cup-to-disc ratio and a healthy optic nerve rim; flat and dry macula; normal vessels. Inferiorly from 5:00 to clockwise 6:30 in the mid-periphery, there are two almost contiguous clusters of red dilated saccules in the retina, with central gray-white surface gliosis. There are two similar but smaller lesions at 4:00 and 7:00. Surrounding all these lesions are smaller isolated dilated saccular aneurysms in the retina. The surrounding retinal arteries and venules are of normal caliber. Specifically, there is no vasculitis, no vitreous cell or heme, no PVD, no lipid, and no subretinal fluid."],["E:LARGE/retinal-cavernous-hemangioma-2-LARGE.jpg","Image 2: OD: High magnification view of the inferonasal right eye in the mid-periphery."]],"h":"9-year-old boy with an unremarkable birth and childhood history, presented with a history of incidental findings suggestive of retinal cavernous hemangiomas in the right eye seen during routine optometric exam. He has no history of patching. No visual complaints, and no history of trauma. Of note, his father has a history of many cavernous hemangiomas involving the brain, with associated headaches and seizures. His paternal grandmother also had intracranial and liver cavernous hemangiomas. BCVA cc: OD 20/20; OS 20/20 IOP: 15 and 20 SLE: unremarkable, both eyes (OU) The left eye, not shown, was unremarkable. The optic nerve had a 0.1 cup-to-disc ratio and a healthy pink rim. The macula was flat and dry, and the vessels were normal. The periphery was intact. There were no vitreous opacities or heme. No PVD or cells. Upon further work-up with pediatric neurology and neurosurgery, this patient was found to have multiple small intracranial hemangiomas, including in the cerebellum. Retinal Cavernous Hemangiomas Retinal cavernous hemangiomas are rare vascular hamartomas, composed of dark intraretinal aneurysms with characteristic \"cluster-of-grapes\" appearance. Usually unilateral and rarely increase in size. Almost always asymptomatic, although macular involvement or vitreous hemorrhage has been reported. Skin and central nervous system hemangiomas may co-exist, and autosomal dominant pedigrees have been reported. Genotyping for three known cerebral cavernous malformation, or CCM, genes can establish a hereditary cause. Caution: do not confuse this with retinal capillary hemangiomas (i.e. discrete tumors with feeder vessels) which is classically seen with von Hippel Lindau disease.","u":"pages/retinal-cavernous-hemangioma.htm","cr":"Eric Chin, MD","src":"er"},{"t":"Retinal astrocytoma","im":[["E:photos/Astrocytoma.JPG","Retinal astrocytoma in a 35-year-old female with a history of tuberous sclerosis"]],"h":"Retinal Astrocytoma is a rare benign glioma that typically occurs in childhood and adolescence. Most patients have no visual disturbance with initial presentation. Symptoms usually occur with tumor involvement of the macula. Retinal astrocytomas typically appear white in color, opaque, or translucent, with varying degrees of thickness. Tumors are typically comprised of large, fibrous astrocytes containing small, oval nuclei. Larger tumors may develop areas of calcification. Retinal astrocytomas may be unilateral or bilateral. Patients can sometimes present with an astrocytoma as a manifestation of tuberous sclerosis, which is more commonly seen with bilateral astrocytomas. Retinal astrocytomas rarely become malignant, and treatment is usually observation. Tumors that continue to grow or cause symptoms may require surgical intervention.","u":"pages/retinal-astrocytoma.html","cr":"Justin Risma, MD","src":"er"},{"t":"Tuberous sclerosis","im":[["E:photos-earlier/lesion.jpg","Fundus Photo Astrocytic harmartoma: white, semitransparent, mulberry-appearing tumor of retina or ON. Calcification with age. Occurs in the CNS."],["E:photos-earlier/lesion_mag.jpg","Fundus Photo Closeup Astrocytic harmartoma: white, semitransparent, mulberry-appearing tumor of retina or ON. Calcification with age. Occurs in the CNS."]],"h":"Fundus Photo Astrocytic harmartoma: white, semitransparent, mulberry-appearing tumor of retina or ON. Calcification with age. Occurs in the CNS. Fundus Photo Closeup Astrocytic harmartoma: white, semitransparent, mulberry-appearing tumor of retina or ON. Calcification with age. Occurs in the CNS.","u":"pages/tuberous-sclerosis.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Vitreous seeding from retinoblastoma","im":[["E:pages/Rb-seeding/Rb-seeding-LRG.jpg",""],["E:pages/Rb-seeding/Rb-seeding-2-LRG.jpg",""]],"h":"Retinoblastoma is a neuroendocrine tumor that occurs in young children. The tumors may present with vitreous seeding, or free-floating buds of tumor cells within the vitreous. Reference:","u":"pages/Rb-seeding/index.htm","cr":"Jesse Vislisel, MD; Kevin Gertsch, MD","src":"er"},{"t":"Idiopathic sclerochoroidal calcification","im":[["E:pages/sclerochoroidal-calcification/OD-fundus-LRG.jpg","right eye"],["E:pages/sclerochoroidal-calcification/OS-fundus-LRG.jpg","left eye"],["E:pages/sclerochoroidal-calcification/OD-ascan-LRG.jpg","right eye"]],"h":"Sclerochoroidal calcification results from the deposition of calcium salts in the sclera and choroid which may be idiopathic, secondary to hypercalcemia, or associated with Gitelman or Bartter syndromes. The lesions are most commonly bilateral and located peripherally in the superotemporal quadrant, often along the arcades. They are frequently multiple. These features help to differentiate them from choroidal osteomas which are usually solitary, unilateral, juxtapapillary, and seen in younger adults. Reference: Shields JA, Shields CL. CME review: sclerochoroidal calcification: the 2001 Harold Gifford Lecture. Retina. 2002 ;22(3):251-61.","u":"pages/sclerochoroidal-calcification/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Idiopathic sclerochoroidal calcification","im":[["E:LARGE/Sclerochoroidal-calcification-OD-L.jpg","Right Eye"],["E:LARGE/Sclerochoroidal-calcification-OS-L.jpg","Left Eye"]],"h":"Sclerochoroidal calcification results from the deposition of calcium salts in the sclera and choroid which may be idiopathic, secondary to hypercalcemia, or associated with Gitelman or Bartter syndromes. The lesions are most commonly bilateral and located peripherally in the superotemporal quadrant, often along the arcades. They are frequently multiple. These features help to differentiate them from choroidal osteomas which are usually solitary, unilateral, juxtapapillary, and seen in younger adults. Reference: Shields JA, Shields CL. CME review: sclerochoroidal calcification: the 2001 Harold Gifford Lecture. Retina. 2002 ;22(3):251-61.","u":"pages/sclerochoroidal-calcification.htm","cr":"Jesse Vislisel, MD","src":"er"}]},{"n":"Trauma, surgery & the vitreous","b":"Commotio, ruptures, retained material, choroidal detachments and vitreous findings.","items":[{"t":"Commotio retinae","im":[["E:photos/commotio.jpg","from BB gun injury. commotio retinae = 'bruising' of retina"]],"h":"from BB gun injury. commotio retinae = 'bruising' of retina","u":"pages/commotio-retinae.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Choroidal Rupture","im":[["W:photos/choroidal-rupture-macular-hole/choroidal-rupture-LRG.jpg",""],["W:photos/choroidal-rupture-macular-hole/choroidal-rupture-nerve-LRG.jpg",""],["W:photos/choroidal-rupture-macular-hole/macular-hole-LRG.jpg",""]],"h":"Doreen Dykhuizen This patient experienced blunt eye injury after bungee cord recoil. Color fundus montage photograph of the right eye shows a macular hole and peripapillary choroidal ruptures extending into the macula. There is subretinal hemorrhage and fluid inferior to the macular hole and in the peripapillary region. Optical coherence tomography (Heidelberg) demonstrates a partial-thickness macular hole with subretinal heme. Retinal Dialysis and Choroidal Rupture after Blunt Trauma Retinal Dialysis and Choroidal Rupture after Blunt Trauma Category(ies): Trauma,Retina / Vitreous Contributor: Nicolas J. Heckenlaible, MD and Timothy M. Boyce, MD Photographer: Madigan M. Peimann A 42-year-old woman sustained blunt trauma directly to her left globe after being kicked by a goat. On presentation, she was found to have multiple ocular injuries including a hyphema, ocular hypertension, iridodialysis, traumatic iritis, and vitreous hemorrhage. Upon clearance of her hyphema and vitreous hemorrhage after 14 days, she was found to have a retinal detachment and was referred to our center. Fundus examination demonstrated an arcuate choroidal rupture nasal to the optic nerve. There was a retinal dialysis from 2-4 o’clock with subretinal fluid from 1-5 o’clock that spared the macula. She underwent successful urgent retinal detachment repair with primary scleral buckle procedure. Contributor: Andrew Doan, MD, PhD","u":"pages/choroidal-rupture.html","cr":"Austin R. Fox, MD","src":"er"},{"t":"Sclopetaria","im":[["E:photos/Sclopetaria3.JPG",""],["E:photos/Sclopetaria.JPG",""],["E:pages/imgs/Chorioretinitis_Sclopetaria_Image_1.png","A subconjunctival metallic foreign body is seen posterior to a scarred area of the plica semilunaris representing a likely entry wound that had self-sealed"]],"h":"18-year-old male who suffered an ocular injury from a BB discharged from a BB gun. The BB entered the medial aspect of the orbit, but did not penetrate the globe. The photo shows inferonasal sclopetaria with associated intraretinal and pre-retinal hemorrhage. Sclopetaria is often seen after high-velocity injury to the orbit. Also note the extensive commotio retinae, or retinal whitening, especially in the macula and around the optic disc. No retinal holes or tears were identified. Chorioretinitis Sclopetaria Chorioretinitis Sclopetaria Category(ies): Retina, Trauma Contributor: Noor-Us-Sabah Ahmad, MD; Oladipupo Anibire, MD; Chad \"Cy\" Lewis, MD, MPH; Andrew Pouw, MD Photographer: Najala Al-Salama A woman in her 40s presented due to persistent redness and foreign body sensation several weeks after an ocular injury from a pellet gun. She was found to have a nasal subconjunctival metallic foreign body with scarring of the plica semilunaris (Figure 1). Dilated fundus exam showed mild vitreous hemorrhage and a nasal peripheral region of hypopigmented scarring as well as intra- and subretinal hemorrhage, consistent with chorioretinitis sclopetaria (Fgiure 2). Chorioretinitis sclopetaria is a full-thickness rupture and retraction of the retina and choroid due to blunt trauma from a high velocity projectile, often leaving visible bare sclera at the injury site. This patient’s subconjunctival pellet was successfully surgically removed, and there was no evidence of scleral laceration or intraocular penetration. Ultra-widefield imaging on follow up 2 weeks later showed interval improvement in the intra- and subretinal hemorrhage with chorioretinal atrophy (Figure 3).","u":"pages/Sclopetaria.htm","cr":"Elizabeth Gauger, MD","src":"er"},{"t":"Retinal detachment with chronic intraocular foreign body","im":[["E:pages/Retinal-detach-chronic-IOFB/RD-w-IOFB-LRG.jpg",""]],"h":"This patient presented with acute photopsias and a retinal detachment was identified superiorly but incidentally a large metallic intraocular foreign body (IOFB) was noted on dilated exam. There was a history of remote ocular trauma to this eye while grinding metal 3 years prior. There was no evidence of heterochromia but there was mild pigment dusting on the lens that was rust colored and consistent with siderosis. The IOFB is not visible in the fundus photograph, but is seen as a hyperechoic mass opposite the retinal detachment on the B-scan ultrasound. The IOFB was removed with a rare earth magnet via pars plana approach. The retina was re-attached with perfluoro-n-octane (PFO) liquid, endolaser, air-fluid exchange, and 18% perfluoropropane (C3F8) gas. The only causative break found in the retina was at the site of the IOFB.","u":"pages/Retinal-detach-chronic-IOFB/index.htm","cr":"David Phillips, MD","src":"er"},{"t":"Intravitreal Triamcinolone","im":[["E:photos/intravit-triamcinolone-1.jpg","Dilated fundus exam of the right eye immediately following intravitreal injection of 2 mg (0.05 mL) triamcinolone in the inferotemporal quadrant. The view is hazy from the recent injection, as well as intentional focus in the vitreous. The yellow clumps represent triamcinolone in the vitreous cavity."],["E:photos/intravit-triamcinolone-2.jpg","The purpose of these images is to demonstrate what triamcinolone looks like immediately following injection into the vitreous. Triamcinolone acetonide (Kenalog) is a steroid that may be used for macular edema secondary to diabetes, vein occlusions, inflammatory conditions, etc. The dose use varies, however 2 mg (or 0.05 mL) and 4 mg ( or 0.10 mL) are commonly used, studied, and well tolerated Intravitreal triamcinolone is injected via a similar technique as anti-VEGF therapy; however, it is sometimes preferably injected inferotemporally due to its visibly apparent (non-transparent or “milky”) consistency. Also, a slightly larger gauge needle is sometimes needed (eg 27 or 30 gauge) due to lar"]],"h":"A 57-year-old female presented with chronic diabetic macular edema despite monthly and recent anti-VEGF therapy. The patient received 2 mg intravitreal triamcinolone because she was pseudophakic, had healthy optic nerves with normal intraocular pressure, and had no history of glaucoma. Her vision in the affected right eye was 20/60, and her intraocular pressure was 14 by tonopen.","u":"pages/intravitreal-triamcinolone.htm","cr":"Eric Chin, MD","src":"er"},{"t":"Subretinal perfluoro-N-octane (PFO) bubbles","im":[["E:photos/PFO-bubbles-fundus.jpg",""]],"h":"67-year-old male with subretinal perfluoro-N-octane (PFO) bubbles after incomplete PFO removal during retinal detachment repair at an outside facility. The patient was symptomatic with decreased visual acuity, metamorphopsias, and small central and paracentral scotomata. PFO is a heavy liquid used to flatten the retina during vitreoretinal surgery, and it should be removed intraoperatively to prevent subretinal migration.","u":"pages/PFO-bubbles.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Choroidal Detachments","im":[["E:pages/choroidal-detachments/HAK.jpg","Choroidal Detachment: Hemorrhagic, Appositional/Kissing"],["E:pages/choroidal-detachments/HNA-mid.jpg","Hemorrhagic, Non-Appositional"],["E:pages/choroidal-detachments/SAK.jpg","Serous, Appositional/Kissing"]],"h":"Full Entry Full Entry Full Entry Additional Entry Choroidal Detachments Choroidal Detachments Category(ies): Retina, Vitreous Contributors: : H. Culver Boldt, MD and Robert B. Dinn, MD, University of Iowa","u":"pages/choroidal-detachments/index.htm","cr":"Eric Chin, MD","src":"er"},{"t":"Choroidal Detachment: Hemorrhagic, Appositional/Kissing","im":[["E:pages/choroidal-detachments/Choroidal-detachments-1.jpg","Right eye: dense large appositional hemorrhagic choroidals; no retinal detachment; no liquefaction or layering of blood clot."],["E:pages/choroidal-detachments/Choroidal-detachments-2.jpg","Right eye: dense large appositional hemorrhagic choroidals; no retinal detachment; no liquefaction or layering of blood clot."],["E:pages/choroidal-detachments/Choroidal-detachments-3.jpg","Right eye: dense large appositional hemorrhagic choroidals; no retinal detachment; no liquefaction or layering of blood clot."]],"h":"Echographer: Laura Fuhrmeister 32-year-old male with end-stage renal disease (on dialysis) secondary to advanced diabetes, presented with sudden onset pain and decreased vision in the right eye since three days prior. He was found to have hand motions vision and elevated intraocular pressure (~50-60). He denied any trauma or recent eye surgeries. He has a history of proliferative diabetic retinopathy, who was treated with panretinal photocoagulation in both eyes in the past. Hematology and rheumatology were both consulted, but no underlying primary etiology was found. Hemorrhage in the suprachoroidal space may occur spontaneously (as in this case), intraoperatively, or traumatically. It may also be associated with intraocular vascular anomalies. Clinically findings include one or more dome-shaped choroidal protrusions. The intraocular pressure is often elevated, and there may be anterior movement of the iris, lens, and/or vitreous body. The red reflex may be blunted, and there may be conjunctival hemorrhage. Breakthrough vitreous hemorrhage is also possible. Surgery (i.e. drainage only when the blood is liquefied) is sometimes the treatment for kissing choroidal detachments in order to prevent secondary traction or rhegmatogenous retinal detachments. This patient was closely monitored and treated with oral prednisone 80 mg daily. There was gradual resolution of the hemorrhage over the following two months; however, his vision remains poor (LP).","u":"pages/choroidal-detachments/HAK.htm","cr":"Eric Chin MD","src":"er"},{"t":"Choroidal Detachment: Hemorrhagic, Non-Appositional","im":[["E:pages/choroidal-detachments/Choroidal-detachments-13-LRG.jpg","Right Eye: appositional serous choroidal detachments"],["E:pages/choroidal-detachments/Choroidal-detachments-14-LRG.jpg","Right Eye: appositional serous choroidal detachments"]],"h":"Laura Warner 76-year-old male with hypertension and pseudophakia OU, presented to the retina clinic for cotton wool spots in the right eye. Several lab studies were done, in addition to carotid dopplers, all of which were unremarkable. An anterior chamber (AC) tap was done to rule out infectious etiologies (e.g. HSV, VZV). His vision in the right eye was 20/25 and IOP was 12. His slit lamp exam was unremarkable. At one week follow-up, his vision was 20/40 and his IOP was 17. he said he had moderate discomfort immediately following his injection, but otherwise no other complaints. On exam he was found to have a localized hemorrhagic choroidal detachment in the superotemporal quadrant (see fundus photo). We presume from the history and sequence of events that his localized choroidal detachment resulted from his AC tap. This was observed and resolved over the following weeks. Summary: Hemorrhagic choroidal detachments involve blood accumulation in the suprachoroidal space due to rupture of choroidal vessels. Unlike serous choroidal effusions, which are typically painless, hemorrhagic choroidals have an abrupt onset often with severe pain. Choroidal detachments are often managed conservatively. Often they resolve on their own.","u":"pages/choroidal-detachments/HNA.htm","cr":"Eric Chin, MD","src":"er"},{"t":"Uveal Effusion Syndrome","im":[["E:photos/Uveal-effusion/Fig1-LRG.jpg",""]],"h":"Susan J. Wright Uveal effusion syndrome is a rare entity involving the idiopathic collection of serous fluid in the suprachoroidal space. The condition is more common in middle-aged men. Serous retinal detachment and suprachoroidal collection of serous fluid may be seen and confirmed with transillumination of the globe or ultrasonography. Other examination findings may include leopard-spotted changes in the retinal pigment epithelium (indicating chronicity), normal intraocular pressure (as opposed to hypotonous choroidal effusion), vitreous cell, dilation of episcleral blood vessels, and blood in Schlemm's canal. Due to the idiopathic nature, the diagnosis is made after excluding other causes of effusion such as inflammation or infection, neoplasm, or trauma. Effective treatment often involves sclerotomy, quadrantic sclerectomy, and/or decompression of vortex veins. Medical management with steroids and surgical management with scleral bucking and pars plana vitrectomy are less effective in reducing the effusion and treating the retinal detachment. Visual decline and often severe vision loss usually occurs without treatment.","u":"pages/uveal-effusion.htm","cr":"Austin Fox, MD","src":"er"},{"t":"Synchysis Scintillans and a Crystal Pseudohypopyon","im":[["E:pages/Synchysis-scintillans-crystal-pseudohypopion/crystals-LRG.jpg",""],["E:pages/Synchysis-scintillans-crystal-pseudohypopion/crystals2-LRG.jpg",""]],"h":"This is a 37-year-old female with a past ocular history significant for a congenital cataract in the left eye. Several months prior to her presentation she had a total retinal detachment in the left eye and subsequently developed neovascular glaucoma. Her clinical course was complicated by both vitreous hemorrhage and a hyphema. Upon presentation to the University of Iowa's Glaucoma service she was found bare light perception vision. Anterior slit lamp exam showed an anterior chamber with a pseudohypopyon of refractile crystals, in addition to 4+ dispersed refractile crystals in both the anterior chamber and vitreous, a finding also known as synchysis scintillans. She had prominent ectropion uvea and her lens had subluxed into the posterior segment. Unfortunately, the left eye was painful and the patient requested evaluation for enucleation.","u":"pages/Synchysis-scintillans-crystal-pseudohypopion/index.htm","cr":"Johanna Beebe, MD","src":"er"},{"t":"Dislocated crystalline lens","im":[["E:pages/dislocated-lens/Dropped-Natural-Lens-LRG.jpg","Optos ultra-widefield image of a dislocated crystalline lens lying on the inferior retina. Also visible is cobblestone degeneration inferiorly."]],"h":"Optos ultra-widefield image of a dislocated crystalline lens lying on the inferior retina. Also visible is cobblestone degeneration inferiorly.","u":"pages/dislocated-lens/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Dislocated intraocular lens implant","im":[["E:pages/dislocated-IOL/Dropped-IOL-LRG.jpg","Optos ultra-widefield image of a dislocated intraocular lens implant with intact capsule."]],"h":"Optos ultra-widefield image of a dislocated intraocular lens implant with intact capsule.","u":"pages/dislocated-IOL/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Displaced intraocular lens","im":[["E:pages/displaced-IOL/displaced-IOL-LRG.jpg","This single piece intraocular lens became displaced post-operatively in a pediatric patient and was found lying on the retina."]],"h":"This single piece intraocular lens became displaced post-operatively in a pediatric patient and was found lying on the retina.","u":"pages/displaced-IOL/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Persistent fetal vasculature (PFV)","im":[["E:pages/PFV/PFV-LRG.jpg","In this photograph, a stalk can be seen emanating from the optic disc into the vitreous with tenting of the surrounding retina and dragging of the macula. The associated cataract has been removed surgically."],["E:photos-earlier/PHPV.jpg",""]],"h":"Persistent fetal vasculature (PFV), previously called persistent hyperplastic primary vitreous (PHPV), is a congenital defect that results when the fetal hyaloid vasculature fails to regress. The condition is almost always unilateral and associated with microphthalmia. Variable degrees of vascular remnants may remain, ranging from an isolated retrolenticular membrane to a complete stalk connecting the optic nerve to the lens as in this case. Other associated findings can include enlongated ciliary processes, prominent radial vessels or neovascularization on the iris surface, shallow anterior chamber with narrow-angle glaucoma, vitreous hemorrhage, and retinal detachment. Contributor: Andrew Doan, MD, PhD, University of Iowa","u":"pages/PFV/index.htm","cr":"Jesse Vislisel, MD","src":"er"}]}],"oct":[{"n":"The normal OCT","b":"Learn the layers: vitreoretinal interface, inner retina, outer retina, RPE/Bruch's, choroid.","items":[{"t":"Normal macula (SD-OCT)","im":[["https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9f/SD-OCT_Macula_Cross-Section.png/1280px-SD-OCT_Macula_Cross-Section.png",""]],"h":"The healthy macula of a 24 year old male (cross-section view). This image is released to Wikimedia with patient consent. Imaged in-vivo with an Optovue iVue Spectral Domain Optical Coherence Tomographer (SD-OCT) at the office of Drs. Harry Wiessner, Steven Davis, Daniel Wiessner, and Eric Wiessner i","u":"https://commons.wikimedia.org/wiki/File:SD-OCT_Macula_Cross-Section.png","cr":"Wies6014 · CC BY-SA 4.0","src":"wm"},{"t":"Normal macula – horizontal & vertical scans","im":[["https://thumb.wikimedia.org/wikipedia/commons/thumb/6/65/Spectral_Domain_OCT_-_Macula_Cross-Sections.png/1280px-Spectral_Domain_OCT_-_Macula_Cross-Sections.png",""]],"h":"The healthy macula of a 24 year old male (cross-section views). This image is released to Wikimedia with patient consent. Imaged in-vivo with an Optovue iVue Spectral Domain Optical Coherence Tomographer (SD-OCT) at the office of Drs. Harry Wiessner, Steven Davis, Daniel Wiessner, and Eric Wiessner","u":"https://commons.wikimedia.org/wiki/File:Spectral_Domain_OCT_-_Macula_Cross-Sections.png","cr":"Wies6014 · CC BY-SA 4.0","src":"wm"},{"t":"Normal macular OCT","im":[["https://thumb.wikimedia.org/wikipedia/commons/thumb/4/44/OCT_Cross_section_retina_scan.jpg/1280px-OCT_Cross_section_retina_scan.jpg",""]],"h":"Optical Coherence Tomography cross sectional scan of retina. Right eye, 53 year old male.","u":"https://commons.wikimedia.org/wiki/File:OCT_Cross_section_retina_scan.jpg","cr":"Bobjgalindo · CC BY-SA 4.0","src":"wm"},{"t":"Normal OCT with infrared fundus overlay","im":[["C:6/6a/Ocular_OCT_OS_IR30_overlay.jpg",""]],"h":"Fundus OCT scan of the left eye's retina of a 28 year old male","u":"https://commons.wikimedia.org/wiki/File:Ocular_OCT_OS_IR30_overlay.jpg","cr":"Ktkvtsh · CC BY-SA 4.0","src":"wm"},{"t":"Normal optic disc (OCT)","im":[["https://thumb.wikimedia.org/wikipedia/commons/thumb/0/08/Spectral_Domain_OCT_-_Optic_Disc_Cross-Sections.png/1280px-Spectral_Domain_OCT_-_Optic_Disc_Cross-Sections.png",""]],"h":"The healthy optic disc (optic nerve head) of a 24 year old male (cross-section view). This image is released to Wikimedia with patient consent. Imaged in-vivo with an Optovue iVue Spectral Domain Optical Coherence Tomographer (SD-OCT) at the office of Drs. Harry Wiessner, Steven Davis, Daniel Wiessn","u":"https://commons.wikimedia.org/wiki/File:Spectral_Domain_OCT_-_Optic_Disc_Cross-Sections.png","cr":"Wies6014 · CC BY-SA 4.0","src":"wm"}]},{"n":"Vitreomacular interface","b":"Adhesion, traction, membranes and holes.","items":[{"t":"Vitreomacular adhesion, traction and macular hole (IVTS classification)","im":[["https://thumb.wikimedia.org/wikipedia/commons/thumb/9/98/Classification_of_Vitreomacular_Adhesion%2C_Traction%2C_and_Macular_Hole_%28IVTS_2013%29.jpg/1280px-Classification_of_Vitreomacular_Adhesion%2C_Traction%2C_and_Macular_Hole_%28IVTS_2013%29.jpg",""]],"h":"Classification of Vitreomacular Adhesion, Traction, and Macular Hole (IVTS 2013)","u":"https://commons.wikimedia.org/wiki/File:Classification_of_Vitreomacular_Adhesion,_Traction,_and_Macular_Hole_(IVTS_2013).jpg","cr":"Yoanmb · CC BY-SA 4.0","src":"wm"},{"t":"Epiretinal membrane","im":[["C:a/a2/EpiretinalMembrane_OCT.png",""]],"h":"Epiretinal membrane, OCT image. 89-year-old man.","u":"https://commons.wikimedia.org/wiki/File:EpiretinalMembrane_OCT.png","cr":"Jmarchn · CC BY-SA 3.0","src":"wm"},{"t":"Epiretinal membrane","im":[["E:photos/ERM/ERM-3.JPG","3 Optical coherence tomography of the right eye reveals an epiretinal membrane and diffuse retinal thickening of the macula."],["E:photos/ERM/ERM-4.JPG","Optical coherence tomography of the left eye reveals trace retinal thickening and epiretinal membrane"]],"h":"Randy Verdick, FOPS A 66-year-old pseudophakic female presented with worsening blurry vision and metamorphopsia, right eye more than left eye. She also complained of monocular diplopia in the right eye. She denied pain or irritation. Her visual acuity was 20/60 in the right eye and 20/50-2 in the left eye, with no improvement with pinholes in either eye. Epiretinal Membranes An epiretinal membrane (ERM) is a semi-translucent, avascular, fibrocellular membrane on the inner retinal surface along the internal limiting membrane of the retina. ERMs may be idiopathic, or secondary to a variety of conditions such as retinal vascular occlusions, uveitis, trauma, intraocular surgery, and retinal breaks. Contracture of ERMs produces distortion and wrinkling of the inner surface of the retina. It is also called “cellophane maculopathy” or “pre-retinal macular fibrosis” when mild; “surface wrinkling retinopathy” or “retinal striae” when moderate; or “macular pucker” when severe. Epiretinal membrane Epiretinal membrane Category(ies): Retina, Vitreous Contributor: Peter H. Sanchez, MD, Chad \"Cy\" Lewis, MD, MPH, and Jaclyn M. Haugsdal, MD Photographer: Meghan Menzel, CRA, and Mike Edrington, CRA A man in his 70's presented for annual examination and was found to have 20/30 visual acuity in the right eye in absence of any subjective distortion. Imaging showed retinal vascular tortuosity and striae in the macula in association with a broad epiretinal membrane with visible traction.","u":"pages/epiretinal-membrane.htm","cr":"Eric Chin, MD","src":"er"},{"t":"Vitreoretinal Traction (VRT) and Cystoid Macular Edema (CME)","im":[["E:photos-earlier/12754_004Vitreoretinal-TractionCF.jpg","Vitreoretinal traction with associated macular edema is evident in the fundus of this patient's left eye. The posterior hyaloid traction edema are well seen in the correlating OCT image."],["E:photos/Vitreomacular-Traction-LRG.jpg",""]],"h":"Jody Troyer This patient presented with blurry vision and visual distortion in one eye, and vitreomacular traction was discovered by optical coherence tomography (OCT) imaging. Vitreomacular traction occurs as the result of vitreomacular adhesions in a detaching posterior vitreous. Hyaloid traction causes symptoms of decreased visual acuity and metamorphopsia and may lead to the development of a foveal pseudocyst. Treatment includes observation, intravitreous injection (fluid, air/gas, or ocriplasmin), or pars plana vitrectomy with membrane peel and gas bubble.","u":"pages/Vitreoretinal-Traction-VRT-and-CME.html","cr":"Thomas A. Weingeist, PhD, MD","src":"er"},{"t":"Full-thickness macular hole","im":[["https://thumb.wikimedia.org/wikipedia/commons/thumb/4/42/Macular_Hole_side_x_side.jpg/1280px-Macular_Hole_side_x_side.jpg",""]],"h":"Optical coherence tomography (OCT) of macular hole on the right pupil.","u":"https://commons.wikimedia.org/wiki/File:Macular_Hole_side_x_side.jpg","cr":"Betty Wills (Atsme) · CC BY-SA 4.0","src":"wm"},{"t":"Lamellar hole with foveal schisis","im":[["E:photos/lamellar-hole/lamellar-hole-w-foveal-schisis-2a.jpg","Cirrus OCT OD: epiretinal membrane with lamellar hole and foveal schisis."]],"h":"20/50; OS 20/25 • IOP: 19 and 21 • SLE: PCIOL OU Discussed surgery versus observation. The patient elected for observation of his epiretinal membrane and lamellar hole. Lamellar Holes •A lamellar hole represents an aborted (or partial thickness) macular hole. •Seen on slit lamp biomicroscopy as a round central inner retinal defect without thickening, cystic change, or subretinal fluid. •An overlying operculum is often seen (but not present in this case). •Mechanism is secondary to vitreofoveal separation with loss of the inner retinal layers, but with a preserved and intact outer photoreceptor layer. •Vision is usually good (20/20-20/30) and patients are often asymptomatic, when no other confounding variables such as an epiretinal membrane are present. •Fluorescein angiography shows no abnormal fluorescence.","u":"pages/lamellar-hole-w-foveal-schisis.htm","cr":"Eric Chin MD","src":"er"}]},{"n":"Fluid & the macula","b":"Where is the fluid? Intraretinal, subretinal or sub-RPE.","items":[{"t":"Central serous chorioretinopathy","im":[["C:2/2d/Macular_OCT_depicting_Central_Serous_Chorioretinopathy_in_the_Left_Eye.png",""]],"h":"Spectral-domain optical coherence tomography (SD-OCT) is a commonly used method used for in-office assessment of microscopic changes in retinal structure that cannot be appreciated on funduscopic examination. This SD-OCT of the macula shows an abnormal, optically empty foveal cyst between the retina","u":"https://commons.wikimedia.org/wiki/File:Macular_OCT_depicting_Central_Serous_Chorioretinopathy_in_the_Left_Eye.png","cr":"Ashley Ireland, OD · CC BY-SA 3.0","src":"wm"},{"t":"Central serous chorioretinopathy (thick choroid)","im":[["https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1f/Central_serous_chorioretinopathy_with_increased_choroidal_thickness.png/1280px-Central_serous_chorioretinopathy_with_increased_choroidal_thickness.png",""]],"h":"This optical coherence tomography (OCT) imaging displays a case of central serous chorioretinopathy with subretinal fluid. The choroid is markedly thickened below the fovea, demarcated by white arrowheads.","u":"https://commons.wikimedia.org/wiki/File:Central_serous_chorioretinopathy_with_increased_choroidal_thickness.png","cr":"Jay Chhablani, Giulio Barteselli · CC BY-SA 3.0","src":"wm"},{"t":"Central Serous Retinopathy (CSR)","im":[["E:photos/CSR/CSR_02072005OCTPatel.jpg","OCT images demonstrate a discrete blister of fluid underneath the RPE just temporal to the foveal depression. This defines the PED. The overlying serous retinal detachement is also evident."]],"h":"CSR (sometimes called Central Serous Chorioretinopathy or CSCR) is seen most commonly in male & female patients between the ages of 20 and 40 years of age. Contributor: Christopher C. Robinson, MD A classic \"smokestack\" of leakage from the choroid is seen is this fluorescein angiogram. The fluid leaks into the subretinal space causing decreased visual acuity. Central serous retinopathy (CSR) is typically found in young males. There is a documented association with stress and steroid use.","u":"pages/Central-Serous-Retinopathy-CSR.html","cr":"Austin R. Fox, MD","src":"er"},{"t":"Diabetic macular oedema","im":[["C:5/5d/Macular_edema_LE_Man_61years_Diabetic.jpg",""]],"h":"Macular edema in a man of 61 years with type 2 diabetes, left eye, OCT","u":"https://commons.wikimedia.org/wiki/File:Macular_edema_LE_Man_61years_Diabetic.jpg","cr":"Jmarchn · CC BY-SA 3.0","src":"wm"},{"t":"Diabetic macular oedema (fellow eye)","im":[["C:4/49/Macular_edema_RE_Man_61years_Diabetic.jpg",""]],"h":"Macular edema in a man of 61 years with type 2 diabetes, left eye, OCT","u":"https://commons.wikimedia.org/wiki/File:Macular_edema_RE_Man_61years_Diabetic.jpg","cr":"Jmarchn · CC BY-SA 3.0","src":"wm"},{"t":"Hypotony Maculopathy","im":[["E:pages/HypotonyMaculopathy/Hypotony-maculopathy-LRG.jpg","The OCT image shows diffuse choroidal folds and central subretinal fluid."]],"h":"44-year-old male with hypotony maculopathy of the left eye after suffering a traumatic cyclodialysis cleft from a fireworks injury. The OCT image shows diffuse choroidal folds and central subretinal fluid. There was also optic disc edema as shown in the fundus photograph. Hypotony is defined as an intraocular pressure low enough to result in decreased vision; mechanisms include corneal edema, cystoid macular edema, maculopathy, choroidal folds and optic disc edema. Risk factors for hypotony maculopathy include male gender, young age, myopia, and glaucoma filtering surgery.","u":"pages/HypotonyMaculopathy/index.htm","cr":"Jeffrey Welder, MD","src":"er"},{"t":"Idiopathic juxtafoveal telangiectasia","im":[["E:pages/juxtafoveal-telangiectasia/JXT-OCT-LRG.jpg","Optical coherence tomography"],["E:photos/VMT-in-JXT/VMT-OCT-OD-LRG.jpg","OCT OD"],["E:photos/VMT-in-JXT/VMT-OCT-OS-LRG.jpg","OCT OS"]],"h":"Idiopathic juxtafoveal telangiectasia type II (aka macular telangiectasia) is a rare idiopathic condition that is characterized by telangiectatic vessels in the juxtafoveolar region, most commonly temporal to the fovea, of both eyes. Additional findings include graying of the parafoveal retina, superficial crystalline deposits, subfoveal cavities, and right-angle vessels. Symptoms include blurred vision, metamorphopsia and paracentral scotomas. Fluorescein angiography will highlight the parafoveal telangiectatic vessels that show early hyperfluorescence with late leakage. OCT will show subfoveal cystoid spaces without cystoid macular edema. Fundus autofluorescence is very diagnostic in that the normal hypoautofluorescence at the fovea is lost and will show abnormally increased foveal autofluorescence. These findings are all demonstrated in the left eye of the patient shown here with very similar findings in the right eye Juxtafoveal telangiectasia Contributor: Andrew Doan, MD, PhD Vitreoretinal traction (VRT) in the setting of Juxtafoveal Telangiectasia Contributor: Aaron M. Ricca, MD A 78-year-old man presented to our clinic with progressive blurring of his central vision in both eyes. Color fundus photography demonstrated a gray sheen temporal to the fovea in both eyes, which is characteristic of juxtafoveal telangiectasia (JXT). In his fovea in both eyes, there was a large, elevated round pseudo-hole due to concurrent vitreomacular traction as demonstrated by optical coherence tomography. The fundus autofluorescence images showed an absence of normal foveal hypofluorescence, replaced by an area of hyperfluorescence, a finding that is virtually pathognomonic for JXT. Reference: Ryan SJ. Retina. 5th ed. London: Saunders/Elsevier; 2013.","u":"pages/juxtafoveal-telangiectasia/index.htm","cr":"Christopher Kirkpatrick, MD","src":"er"},{"t":"Pentosan Polysulfate Maculopathy","im":[["E:pages/imgs/Pentosan_Polysulfate_Maculopathy_oct_ou.png","Optical coherence tomography (OCT) demonstrating diffuse RPE excrescences and outer retinal atrophy."]],"h":"A 62-year-old woman taking pentosan polysulfate (PPS) for interstitial cystitis (200 mg twice daily for 20 years; cumulative dose >2,500 g) underwent a baseline dilated exam. She reported several years of nyctalopia. Examination showed pigmentary retinal pigment epithelium (RPE) stippling with nummular macular atrophy extending toward the temporal optic disc margins (Figure 1). Fundus autofluorescence (FAF) demonstrated a speckled pattern of macular hyper- and hypoautofluorescence with peripapillary involvement (Figure 2). Optical coherence tomography (OCT) revealed diffuse RPE excrescences and outer retinal atrophy (Figure 3). Findings were consistent with pentosan polysulfate (PPS)–associated maculopathy. PPS (Elmiron) is the only FDA-approved oral therapy for interstitial cystitis. A dose-dependent pigmentary maculopathy was first described in 2018 and can mimic age-related macular degeneration and pattern dystrophies. The risk of maculopathy rises with cumulative PPS exposure (≈20–40% beyond 1,500 g), and progressive damage may continue even after drug cessation. Patients may be asymptomatic or report prolonged dark adaptation, blurred vision, or metamorphopsia. Management includes counseling regarding PPS discontinuation in coordination with the prescriber and continued ophthalmic surveillance for treatable complications (e.g., cystoid macular edema, choroidal neovascularization).","u":"pages/Pentosan_Polysulfate_Maculopathy.htm","cr":"Joanna I.M. Silverman, MD","src":"er"},{"t":"Acute Macular Neuroretinopathy (AMN)","im":[["E:pages/Acute-macular-neuroretinopathy/AMN-OCT-LRG.png",""]],"h":"Acute macular neuroretinopathy (AMN) is a rare disease of unknown etiology that most commonly affects young to middle-aged females. The patient typically presents with the acute-onset of one or multiple paracentral scotomas that affect one or both eyes. This is typically the only symptom and visual acuity is unaffected. Fundus findings include 1 or more reddish-brown petalloid perifoveal lesions with the tip pointed toward the fovea that become visible days to months after the onset of symptoms. Lesions are typically better identified with infrared imaging. OCT through the lesions commonly show disruption of the inner segment/outer segment (IS/OS) junction (ellipsoid zone). There is no known treatment and symptoms may not resolve. Reference Bhavsar KV, Lin S, Rahimy E, Joseph A, Freund KB, Sarraf D, Cunningham ET Jr. Acute macular neuroretinopathy: A comprehensive review of the literature. Surv Ophthalmol. 2016 Sep-Oct;61(5):538-65. http://pubmed.gov/26973287. Previous Entry Feb 8, 2008 Contributor: James M. Coombs, MD 44-year-old female with acute onset of paracentral scotomas in right eye (corresponded directly to Amsler grid findings)","u":"pages/Acute-macular-neuroretinopathy/index.htm","cr":"Christopher Kirkpatrick, MD","src":"er"},{"t":"X-linked retinoschisis (XLRS)","im":[["E:LARGE/XLRS-OCT-OD-L.jpg",""],["E:LARGE/XLRS-OCT-OS-L.jpg",""]],"h":"X-linked retinoschisis (XLRS) is an X-linked recessive condition caused by a mutation in the RS1 gene. It results in splitting of the foveal and sometimes peripheral neurosensory retina. Clinically, this appears as cystic spaces and radial striae in the central macula, as seen in these photographs. The splitting is even more apparent on OCT. Over time, patients with XLRS develop decreased acuity with a central scotoma as seen in these Goldmann visual fields.","u":"pages/XLRS.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Optic nerve pit maculopathy","im":[["E:photos/Optic-nerve-pit-maculopathy/L/Optic-nerve-pit-maculopathy-OCT-LRG.jpg",""]],"h":"Optic nerve pits are colobomatous defects in the optic nerve, most common inferotemporally. Most optic nerve pits are asymptomatic, but they can occasionally cause serous macular detachments as seen in this fundus photograph. A large window defect can be seen in the macula on fluorescein angiography due to atrophy of the retinal pigmented epithelium. The OCT scan shows extensive subretinal fluid extending from the optic nerve.","u":"pages/optic-nerve-pit-maculopathy.htm","cr":"Jesse Vislisel, MD","src":"er"}]},{"n":"AMD on OCT","b":"Drusen, PEDs, CNV and RPE rips.","items":[{"t":"Drusen","im":[["C:a/ad/Drusen_in_OCT.png",""]],"h":"Drusen in Optical Coherence Tomography","u":"https://commons.wikimedia.org/wiki/File:Drusen_in_OCT.png","cr":"Ipoliker · CC BY-SA 3.0","src":"wm"},{"t":"Soft drusen vs reticular pseudodrusen","im":[["C:0/06/Coupe_OCT_drusens_s%C3%A9reux_et_pseudo-r%C3%A9ticul%C3%A9s.jpg",""]],"h":"différence anatomique entre drusens séreux et pseudo-réticulés","u":"https://commons.wikimedia.org/wiki/File:Coupe_OCT_drusens_s%C3%A9reux_et_pseudo-r%C3%A9ticul%C3%A9s.jpg","cr":"Yoanmb · CC BY-SA 4.0","src":"wm"},{"t":"Dry age-related macular degeneration","im":[["C:3/3c/Optical_coherence_tomography_of_human_retina.gif",""]],"h":"A high-resolution spectral-domain OCT scan (3x3-mm) of a dry age-related macular degeneration eye showing geographic atrophy and drusen in macula on both cross-sectional and en face fly-through.","u":"https://commons.wikimedia.org/wiki/File:Optical_coherence_tomography_of_human_retina.gif","cr":"NextOptics · CC BY-SA 4.0","src":"wm"},{"t":"Exudative (wet) age-related macular degeneration","im":[["C:6/6c/Degeneraci%C3%B3n_macular_asociada_edad.png",""]],"h":"Fig 2. Degeneración macular asociada con la edad, exudativa.","u":"https://commons.wikimedia.org/wiki/File:Degeneraci%C3%B3n_macular_asociada_edad.png","cr":"Heiferman MJ, Fawzi AA · CC BY 4.0","src":"wm"},{"t":"Drusenoid Pigment Epithelial Detachment (PED)","im":[["E:photos/drusenoid-PED/Figure-2-A-and-B-Drusenoid-PED.jpg","(A) An ocular coherence tomography (OCT) photo of the right eye demonstrates a drusenoid PED. Using the scale (blue arrow), the length of RPE elevation is shown to easily surpasses the threshold of 350 microns. Notice the relatively uniform isoreflective quality of the drusen. Of note, there is some hyperreflective material (pigment migration) in the outer nuclear outer nuclear layer overlying the drusenoid PED. (B) An OCT photo of the same eye at a different radial section demonstrates similar findings."]],"h":"August 11, 2023 77-year-old female referred to retina service for management of dry age-related macular degeneration in both eyes. The patient is found to have a drusenoid pigment epithelial detachment (PED) in the right eye. Drusenoid PEDs are drusen that span more than 350 microns contiguously.","u":"pages/drusenoid-PED.htm","cr":"Sean Rodriguez, MD","src":"er"},{"t":"Retinal Pigment Epithelial Rip","im":[["E:photos/RP/RPE-rip-3.jpg","Image 3. OCT, Right eye. Red arrow points to an area where the RPE ends abruptly. White arrow points to an area of \"scrolled\" RPE adjacent to moderate subretinal fluid."],["E:photos/RP/RPE-rip-4.jpg","Image 4. OCT, Right eye, alternate view."],["E:photos/RP/RPE-rip-5.jpg","Image 5. OCT, left eye. Full thickness macular hole with adjacent and underlying large high-risk drusen"]],"h":"This patient is a 78-year-old man with known history of high-risk non-exudative age-related macular degeneration, and full-thickness macular hole in the left eye, presented for annual follow-up. He noted rapid decline in vision in his formerly better-seeing right eye since three months prior to presentation. No pain or irritation. He has no history of prior intravitreal injections. No other complaints. BCVA cc: right eye (OD) 20/160 (previously 20/32-1) left eye (OS) 20/125-2 (previously 20/160) with eccentric fixation IOP: OD 15, OS 14 Comments RPE detachments have known to develop RPE rips, either spontaneously or following laser photocoagulation, photodynamic therapy, or intravitreal injection. They usually occur at or along the edge of the serous RPE detachment. Mechanisms include fibrovascular contraction of choroidal neovascular membranes, mechanical forces from vitreomacular traction or interruption of tight junctions due to anti-VEGF therapy. An incidence of 10% has been reported as part of the natural history of macular degeneration. Improvement in visual acuity may occur after treatment (usually anti-VEGF or photodynamic therapy) despite RPE rips, but the patient and clinician need to be aware of this situation, as it may warrant close follow-up and re-treatment in cases of deterioration.","u":"pages/RPE-rip.htm","cr":"Eric Chin, MD","src":"er"}]},{"n":"Vascular occlusion & ischaemia","b":"Inner retinal whitening, thinning and paracentral lesions.","items":[{"t":"Central Retinal Artery Occlusion (CRAO)","im":[["E:pages/CRAO/CRAO-inner-retinal-edema-LRG.jpg","OCT OD"],["E:pages/CRAO/OS-normal-LRG.jpg","OCT OS"],["E:pages/CRAO/CRAO-delayed-filling.jpg",""]],"h":"Central retinal artery occlusion (CRAO) occurs when occlusion of the central retinal artery, a branch of the ophthalmic artery, results in infarction of the inner retina with subsequent, typically severe, vision loss. The picture above exhibits a CRAO with sparing of the foveal retina due to the presence of a cilioretinal artery. A cilioretinal artery has been found to be present in 49.5% of patients. The cilioretinal artery branches off the ophthalmic artery and supplies the inner retina in these individuals. This is in contradistinction to the posterior ciliary arteries, which branch off the ophthalmic artery and supply the choroid and outer retina. Patients with a cilioretinal artery may have preserved central vision in the unfortunate event of a CRAO. Contributor: David Phillips, MD Photographer: Andrea Starkweather This middle-aged male presented with an abrupt decrease in vision in the right eye 4 days prior. Note the retinal whitening, classic cherry red spot, and scatted cotton wool spots. The OCT shows inner retinal edema in the right eye (OD) compared to the normal retinal OCT in the left (OS). Also note the delayed filling of the macular arteries on the fluorescein angiogram. Central Retinal Artery Occlusion (CRAO) with Cilioretinal Artery SparingCentral Retinal Artery Occlusion (CRAO) with Cilioretinal Artery SparingCategory(ies): Retina / VitreousContributor: Mahsaw Mansoor, MDPhotographer: Jody Troyer, CRAPosted: 06/04/2024A 34-year-old female with history of recent methamphetamine use presented with several hours of painless vision loss in the right eye. Exam was significant for retinal whitening with sparing of the nasal macula due to vascular preservation via the cilioretinal artery.","u":"pages/CRAO/index.htm","cr":"Thomas A. Weingeist, PhD, MD","src":"er"},{"t":"Branch Retinal Artery Occlusion (BRAO)","im":[["E:photos/BRAO-OU-OCT.jpg","Optical coherence tomography (OCT) of both eyes. The right eye (left side image) is notable for the presence of an epiretinal membrane. The left eye (right side image) is significant for diffuse inner retina edema and thickening along the inferior arcade."]],"h":"Optical coherence tomography (OCT) of both eyes. The right eye (left side image) is notable for the presence of an epiretinal membrane. The left eye (right side image) is significant for diffuse inner retina edema and thickening along the inferior arcade.","u":"pages/BRAO/index.htm","cr":"Ryan J. Diel, MD; Zachary Mortensen, MD; A. Tim Johnson, MD","src":"er"},{"t":"Cilioretinal Artery Occlusion","im":[["E:photos/Cilioretinal-Artery-Occlusion/OCT-retinal-edema-1-LRG.jpg","Optical coherence tomography shows retinal edema of the inner retinal layers superior to the fovea in the distribution of the cilioretinal artery."],["E:photos/Cilioretinal-Artery-Occlusion/OCT-retinal-edema-2-LRG.jpg","Optical coherence tomography shows retinal edema of the inner retinal layers superior to the fovea in the distribution of the cilioretinal artery."],["E:photos/cilioretinal-artery-occlusion-color.jpg","The University of Iowa 71-year-old woman presenting with a cilioretinal artery occlusion. Note the retinal whitening secondary to inner retinal edema in the distribution of cilioretinal artery perfusion. There is a prominent cherry-red spot due to intact choroidal circulation."]],"h":"Susan Wright A 67-year-old man with history of type 2 diabetes mellitus, hyperlipidemia, and uncontrolled hypertension presented with a central visual field deficit of sudden onset in his right eye. Visual acuity on presentation was 20/25 in both eyes, and funduscopic examination revealed an isolated cilioretinal artery occlusion (CLRAO) in his right eye (Figure 1). Work-up revealed significant right internal carotid artery stenosis (>50%). A right carotid endarterectomy was performed, and vascular risk factors were optimized. Visual acuity was stable at 20/25 one month after presentation. CLRAO accounts for ~5-7% of retinal artery occlusions and is usually associated with a central retinal vein occlusion (CRVO) or anterior ischemic optic neuropathy (AION). [1-3] Less commonly, CLRAOs may occur as an isolated phenomenon as in this case. Isolated CLRAOs typically have a better visual prognosis than those associated with a CRVO or AION with 90% of patients achieving a visual acuity of 20/40 or better. [3] Reference: Brown GC, Shields JA. Cilioretinal arteries and retinal arterial occlusion. Arch Ophthalmol. 1979;97:84–92. Hayreh SS. Pathogenesis of occlusion of the central retinal vessels. Am J Ophthalmol 1971;72:998–1011 Brown GC, Moffat K, Cruess A, Magargal LE, Goldberg RE. Cilioretinal artery obstruction. Retina. 1983;3(3):182-7","u":"pages/cilioretinal-artery-occlusion.htm","cr":"Austin Fox, MD and Stephen Russell, MD","src":"er"},{"t":"Purtscher Retinopathy","im":[["W:photos/purtschers-retinopathy/od-oct-OPT.jpg",""],["W:photos/Purtschers-OCT-1-LRG.jpg",""],["W:photos/Purtschers-OCT-2-LRG.jpg",""]],"h":"This 21 year old male noted a significant unilateral decrease in vision two days after an all-terrain vehicle (ATV) roll-over accident in which he suffered head trauma and a fractured rib. Radiating superficial retinal ischemia is seen here with scattered blot hemorrhages and venous dilation in the right eye. His left eye was unaffected. True Purtscher's Retinopathy was originally described in cases of known head-trauma, but this clinical picture can also be seen in a variety of disease mechanisms including chest compression, long-bone fracture, acute pancreatitis, and connective tissue disorders amongst others. Contributor: Matthew Benage, MD Photographer: Sarah Greenwalt This is an impressive example of Purtscher's retinopathy following unrestrained motor vehicle accident. He suffered T5-T7 fracture, brain contusion, rib fracture, and mandibular fracture. He presented to clinic due to complaint of profound vision loss following his accident. On exam, he was noted to have Purtscher's retinopathy. Note the significant inner retinal edema on OCT and whitening, arteriolar hemorrhage, and edema of the fundus. Purtscher's retinopathy typically follows trauma in the absence of direct trauma to the globe. Common causes are long bone fracture, chest compression injuries, air embolization, childbirth, as well as pancreatitis and connective tissue disorders. Clinical presentation is variable, with some patients presenting with profound vision loss and others with minimal changes. A relative afferent pupillary defect may or may not be present. Clinical findings are cotton wool spots, retinal hemorrhages, and Purtscher's flecken, which are areas of whitening in the inner retina between the retinal arterioles and venules. OCT displays hyperreflectivity of the inner retinal layers due to inner retinal edema. Prognosis is variable and largely depends on the extent of retinal involvement. Contributor: Jesse Vislisel, MD Photographer: Antoinette Venckus, CRA; Stefani Karakas, CRA Purtscher retinopathy is the appearance of cotton wool spots, hemorrhages, and retinal edema located predominantly around the optic disc. It is caused by complement activation after acute crushing injuries to the head or thorax. Similar-appearing Purtscherlike retinopathy can be caused by a variety of etiologies including acute pancreatitis, chronic renal failure, autoimmune diseases, fat embolism, amniotic fluid embolism, retrobulbar anesthesia, and orbital steroid injection. Below are images of two separate patients with Purtscher retinopathy after compressive injuries to the chest. Contributor: Patrick Donegan, MD Purtscher retinopathy is an occlusive microvasculopathy which classically results from head trauma, chest compression, or long bone fracture. This 25-year-old patient was involved in a high speed, roll-over motor vehicle crash and sustained both head trauma and chest compression injury resulting in a rib fracture. Visual acuity in the affected eye was 20/250 eccentrically.","u":"pages/purtscher/index.htm","cr":"Alison Bozung, OD","src":"er"},{"t":"Leukemic retinopathy","im":[["E:photos/leukemic/Leukemic-Retinopathy-3.jpg","Image 3: OCT OD: irregularities of outer retinal layer in the fovea with scant patchy areas of inner retinal edema and opacifications"],["E:photos/leukemic/Leukemic-Retinopathy-4.jpg","Image 4: OCT OS: early lamellar hole; scattered patchy areas of inner retinal opacifications in the parafoveal region"]],"h":"Retinopathy associated with leukemia typically occurs in acute disease. Patients may develop dilation, tortuosity, and beading of the retinal veins; vascular sheathing; cotton-wool spots; flame-shaped hemorrhages; Roth spots; sub-hyaloid and sub-internal limiting membrane hemorrhages. These changes are similar to those seen with severe anemia. A 60-year-old female was referred for bilateral retinal hemorrhages. She noticed blurry since two months prior when she hit her head. She said her right eye gradually improved, but the left eye remained poor. She was told that this may be related to her blood pressure, but it was found to be normal (i.e. 118/70). She had a past ocular history of myopia, and a past medical history of hypertension. BCVA with correction: • OD: 20/125 • OS: 20/40 IOP: OD 13; OS 14 SLE: anterior segment unremarkable; 1+ NS OU; no AC cells; no vitreous cells The patient presented with bilateral retinal hemorrhages and scattered Roth spots. A fluorescein angiogram was done which ruled out retinal venous occlusions and showed no evidence of vasculitis. Upon further history, she reported mild fatigue and bruising on the upper and lower extremities for the past few weeks. CBC, ESR, CRP, ANA were ordered, significant for the following: WBC: 354.1 (normal 3.7-10.5) RBC: 2.37 (normal 4-5.20) Hb: 7.3 (normal 11.9-15.5) Hct: 22 (normal 35-47%) Plt: 81 (normal 150-400) BP was checked in the clinic: 129/66 Patient was immediately referred to the hematology and oncology service. She was diagnosed with leukocytosis consistent with chronic myeloid leukemia, later found to be positive for the Philadelphia (Ph+) chromosome. She was started on chemotherapy, and her follow-up fundus photos are shown below.","u":"pages/leukemic-retinopathy.htm","cr":"Eric Chin MD","src":"er"}]},{"n":"Inherited retinal disease","b":"Ellipsoid zone loss, vitelliform lesions and foveal hypoplasia.","items":[{"t":"Sectoral retinitis pigmentosa","im":[["E:pages/sectoral-RP/Sectoral-RP-OCT-OS-LRG.jpg","OS - The OCT shows marked outer retinal and retinal pigmented epithelial (RPE) thinning in the affected area."],["E:pages/sectoral-RP/Sectoral-RP-OCT-OD-LRG.jpg","OD - The OCT shows marked outer retinal and retinal pigmented epithelial (RPE) thinning in the affected area."],["E:pages/sectoral-RP/Sectoral-RP-GVF-OS-lrg.jpg","OS - The Goldmann visual fields show superior scotomata that correspond to this area of degeneration. The OCT shows marked outer retinal and retinal pigmented epithelial (RPE) thinning in the affected area.."]],"h":"Sectoral retinitis pigmentosa (RP) is a variant of RP in which there is a regional distribution of the retinal degeneration. It can be differentiated from acquired pigmentation (due to trauma, inflammation, or vascular insult) by its symmetry between the eyes. These photos depict segmental RP in a patient with autosomal dominant RP secondary to a rhodopsin defect. Note the prominent areas of chorioretinal atrophy with bone-spicule-like pigmentation along the inferotemporal arcade. The Goldmann visual fields show superior scotomata that correspond to this area of degeneration. The OCT shows marked outer retinal and retinal pigmented epithelial (RPE) thinning in the affected area.","u":"pages/sectoral-RP/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Retinitis pigmentosa sine pigmento","im":[["E:photos/Retinitis-pigmentosa-sine-pigmento/L/Retinitis-pigmentosa-sine-pigmento-OCT-OD.jpg",""],["E:photos/Retinitis-pigmentosa-sine-pigmento/M/Retinitis-pigmentosa-sine-pigmento-OCT-OS.jpg",""]],"h":"Retinitis pigmentosa sine pigmento is a variant of retinitis pigmentosa in which there is an absence of the characteristic peripheral bone-spicule-like pigmentary changes. Other features of the condition are still seen in this photograph including arteriolar attenuation and atrophy of the retinal pigmented epithelium. The OCT shows a perifoveal loss of the photoreceptors and retinal pigmented epithelium. Ring scotomata are visible on the Goldmann visual fields.","u":"pages/retinitis-pigmentosa-sine-pigmento.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Autosomal Recessive Best Disease","im":[["E:photos/best/Best-AR-od-OCT.jpg",""],["E:photos/best/Best-AR-os-OCT.jpg",""]],"h":"These are photographs from a 6-year-old boy with no known past medical history who presented for decreased visual acuity in both eyes (OU) that was first noticed when he failed his preschool vision screening at age four. His visual acuity with correction was 20/200+2 OD and 20/80+1 OS, without pinhole improvement. Confrontational visual fields, intraocular pressure, extraocular movements, and slit lamp exam were all unremarkable. On dilated fundus exam,there was a large (slightly less than 1 disc diameter) white elevated fibrotic scar in the fovea with overlying pigmentation and surrounding edema OU. The near periphery demonstrated the extrafoveal yellow-colored vitelliform lesions that are characteristic of autosomal recessive Best disease. These likely represent lipofuscin accumulation. Optical coherence tomography showed a large fibrovascular pigment epithelial detachment in each fovea (due to chronic inactive choroidal neovascular membranes OU), associated with parafoveal subretinal fluid, and overlying cystic retinal edema OU. There was loss of the inner segment/outer segment junction in this same area centrally OU. Autosomal recessive Best disease is usually caused by two \"mild\" mutations in the BEST1 gene. OMIM #153700 Right eye Left eye Right eye Left eye","u":"pages/Best-disease-autosomal-recessive.htm","cr":"Pamela C. Carter, MD","src":"er"},{"t":"Pattern dystrophy","im":[["E:photos/pattern-dystrophy-2/Pattern-dystrophy-2-OCT-OD-LRG.jpg",""],["E:photos/pattern-dystrophy-2/Pattern-dystrophy-2-OCT-OS-LRG.jpg",""]],"h":"Montage color fundus photographs are from a 63-year-old patient with molecularly-confirmed pattern dystrophy, which is an autosomal dominant, inherited retinal degeneration due to a mutation in the RDS/peripherin gene located on chromosome 6. Pattern dystrophy presents with a varying appearance of lipofuscin deposition and retinal atrophy with retinal pigment epithelial changes in the central macula, as demonstrated above. The disease demonstrates variable expressivity, and macular findings range from subtle to striking. Patients should be monitored with dilated fundus examination, as they are at risk for developing a choroidal neovascular membrane. Contributor: Aaron M. Ricca, MD Images are from a 42-year-old female with molecularly-proven pattern dystrophy. A mutation in the RDS/peripherin gene causes pigmentary changes at the level of the retinal pigment epithelium in various fundus \"patterns.\" These different phenotypes are often grouped into the following types of dystrophies: butterfly-shaped, adult-onset vitelliform, peculiar foveomacular, reticular, and fundus pulverulentus. The above patient is an example of adult-onset vitelliform dystrophy. The fundus photos show the small foveal vitelliform lesion, and the optical coherence tomograms demonstrate the subretinal hyper-reflective material, without concern for a neovascular membrane. Contributor: Andrew Doan, MD, PhD This is a 40-year-old patient with a diagnosis of pattern dystrophy. The patient has good vision (20/25 in both eyes) and symmetric foveal retinal pigmented epithelium (RPE) hyperpigmentation in a butterfly pattern in both eyes. Reference: Ryan SJ. Retina. 5th ed. London: Saunders/Elsevier; 2013.","u":"pages/pattern-dystrophy.html","cr":"Aaron M. Ricca, MD","src":"er"},{"t":"Grouped congenital albinotic spots of the retinal pigmented epithelium (polar bear tracks)","im":[["E:pages/polar-bear-tracks/polarbeartrackOCT-LRG.jpg","Optical coherence tomography (OCT) demonstrates a disruption of the highly-reflective signal from the ellipsoid zone in the region of the lesions, as indicated by the orange line on the scan."]],"h":"Congenital albinotic spots of the retinal pigmented epithelium (CASRPE) can be configured in solitary or grouped configurations. Groups of the spots, as seen here, are commonly referred to as \"polar bear tracks\" due to their color and resemblance of animal footprints. It is believed that these spots may develop secondary to deposition of an abnormal white material in retinal pigmented epithelial (RPE) cells rather than the usual darkly pigmented melanin. The lesions are flat, sharply circumscribed, placoid, chalky white, and lie at the level of the RPE. Optical coherence tomography (OCT) demonstrates a disruption of the highly-reflective signal from the ellipsoid zone in the region of the lesions, as indicated by the orange line on the scan. Reference: Gass JD. Focal congenital anomalies of the retinal pigment epithelium. Eye (1989) 3;1-18. Kim DY, Hwang JC, Moore AT, Bird AC, Tsang SH. Fundus Autofluorescence and Optical Coherence Tomography of Congenital Grouped Albinotic Spots. Retina. Sep 2010; 30(8): 1217–1222.","u":"pages/polar-bear-tracks/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Oculocutaneous albinism","im":[["E:LARGE/oculocutaneous-albinism-OCT-LARGE.jpg",""]],"h":"This 7-year-old girl presented with decreased vision and nystagmus and was diagnosed with oculocutaneous albinism (OCA). OCA is typically inherited in an autosomal recessive fashion and is characterized by decreased melanin and subnormal vision since birth. Findings on exam include hypopigmentation of the skin, hair, and irides with diffuse iris transillumination defects on retroillumination, as seen in the photograph. Decreased acuity can be attributed to foveal hypoplasia which is apparent as an abnormally small or absent foveal depression as seen in this optical coherence tomography (OCT) render. Albinism can also be limited solely to the eyes in ocular albinism which most commonly has X-linked recessive inheritance. OMIM #203200 OMIM, additional","u":"pages/oculocutaneous-albinism.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Congenital aniridia","im":[["https://webeye.ophth.uiowa.edu/eyeforum/cases-i/case211/L/2-OCT-LRG.jpg","Macular OCT revealed an absence of the normal foveal depression, consistent with foveal hypoplasia."]],"h":"Congenital aniridia is a hereditary disease most commonly with autosomal dominant inheritance. These slit lamp photographs of a 17-year-old with aniridia show corneal pannus, subepithelial haze, and iris hypoplasia. There is fluorescein uptake of the pannus due to leaky intracellular junctions. The patient also has small anterior polar cataracts. The macular OCT shows absence of the normal foveal depression, consistent with foveal hypoplasia","u":"pages/Congen-Aniridia/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Marshall Syndrome","im":[["E:photos/marshall-syndrome/oct-fig3-LRG.jpg","Optical coherence tomography of the macula, OU. Posterior staphylomas are present OU, and the retina is attached OU. There is no intraretinal or subretinal fluid OU. There is marked thinning of the choroid and retina OU, especially in regions corresponding to atrophy along the inferior arcades OU. Mild epiretinal membranes are present centrally OU."]],"h":"This patient had a lifelong history of profound hearing loss and vision loss in the left eye (OS) greater than right eye (OD) in the setting of Marshall syndrome with high myopia and aphakic glaucoma in both eyes (OU). She underwent strabismus surgery for esotropia as a child and bilateral extracapsular cataract extraction when she was 27-years-old. Her visual acuity progressively decreased to 20/600 OD and hand motions OS due to myopic degeneration OU. Dilated funduscopic examination showed numerous, scattered chorioretinal atrophic regions, vascular attenuation, and large posterior staphylomas OU (Figure 1). Goldmann visual fields showed a small, preserved central island of vision OU (Figure 2). Optical coherence tomography of the macula showed staphylomatous changes with severe retinal and choroidal thinning OU (Figure 3). Marshall syndrome is a rare autosomal dominant syndrome that presents with pathologic myopia, congenital cataracts, sensorineural hearing loss, hypertelorism, and a flattened nasal bridge. Patients with Marshall syndrome have COL11A1 gene mutations leading to abnormalities in the production of collagen; mutations in this gene are also found in Type 2 Stickler's syndrome. Strabismus, retinal detachments, arthritis, and ectodermal abnormalities are common in Marshall syndrome [1].","u":"pages/marshall-syndrome.htm","cr":"Brittni A. Scruggs, MD, PhD and John H. Fingert, MD, PhD","src":"er"}]},{"n":"Inflammation & tumours","b":"Placoid disease, uveitis, choroidal masses and metastases.","items":[{"t":"Acute posterior multifocal placoid pigment epitheliopathy (APMPPE)","im":[["E:pages/APMPPE/APMPPE-2-LRG.jpg","Optical coherence tomography OD: Disruption of the outer retinal layers."]],"h":"APMPPE is one of the white dot syndromes that occurs in young healthy adults and similarly affects males and females. It is usually bilateral, although may be worse in one eye. APMPPE is generally a self-limited condition that requires no treatment and has a good prognosis. A 47-year-old female presents with a four day history of fluttering bright spots in the right eye. She denies a viral prodrome or headaches. Acute posterior multifocal placoid pigment epitheliopathy (APMPPE) Acute posterior multifocal placoid pigment epitheliopathy (APMPPE) Category(ies): Retina / Vitreous,Uveitis Contributor: Mahsaw Mansoor, MD Photographer: Jody Troyer, CRA Posted: 06/04/2024 A 36-year-old woman presented with progressive vision loss in both eyes following a viral infection. On exam, there were placoid areas of whitening throughout the posterior pole of both eyes. On fluorescein angiography, the lesions on exam demonstrated early blocking defects and late staining. Acute
