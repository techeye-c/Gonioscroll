ascular anomalies.","items":[{"t":"Intraretinal Microvascular Abnormality (IrMA)","im":[["E:pages/IRMA/IRMA-fundus-OS.jpg","his picture represents a young insulin dependent diabetic patient with severe non-proliferative diabetic retinopathy. There is great representation of IRMA perifoveally, but most impressively just inferior to the fovea."],["E:pages/IRMA/IRMA-LRG.jpg","r>This is a 21 year-old male with poorly controlled type 1 diabetes mellitus with very severe non-proliferative diabetic retinopathy. He has diffuse IRMA throughout the macula extending beyond the arcades. Dot blot hemorrhages and flame hemorrhages are also seen. There are two large cotton wool spots along the inferior arcade."]],"h":"Intraretinal microvascular abnormalities (or IrMAs) are shunt vessels and appear as abnormal branching or dilation of existing blood vessels (capillaries) within the retina that act to supply areas of non-perfusion in diabetic retinopathy. These vessels represent either new vessel growth within the retina or remodeling of pre-existing vessels through endothelial cell proliferation stimulated by hypoxia bordering areas of capillary nonperfusion. IRMA is one of the defining features of severe non-proliferative diabetic retinopathy based on the \"4-2-1\" criteria from the Early Treatment Diabetic Retinopathy Study (ETDRS) [1]. When compared to neovascularization (NV) in proliferative disease, IRMAs are slightly larger in caliber with a more broad arrangement and are always contained to the intraretinal layers. Conversely, NV tends to be much finer and delicate in caliber, and is sometimes more focal in location depending on its severity. In severe cases, NV tends to grow along the posterior hyaloid interface especially around the optic nerve (i.e. NVD) and periphery (i.e. NVE). On fluorescein angiography, NV will often show late leakage whereas IRMAs traditionally do not leak.","u":"pages/IRMA/index.htm","cr":"Chris Kirkpatrick, MD","src":"er"},{"t":"Diabetic Macular Edema (DME)","im":[["E:photos/Diabetic-Macular-Edema-LRG.jpg",""],["E:photos/Diabetic-Macular-Edema-2-LRG.jpg",""],["E:photos/Diabetic-Macular-Edema-3-LRG.jpg",""]],"h":"This patient has a history of severe non-proliferative retinopathy and recurrent diabetic macular edema in both eyes due to type II diabetes mellitus. On the optical coherence tomogram below, there are parafoveal intraretinal cysts with exudates. Diabetic macular edema can result in diffuse or focal areas of swelling and retinal thickening and may be associated with hard exudates. Diabetic macular edema is often classified based on the Early Treatment Diabetic Retinopathy Study (ETDRS), which defined clinically significant diabetic macular edema. However, these findings are based on the funduscopic examination and in classifying this edema based on optical coherence tomography (OCT), the term center-involving macular edema is often used. Treatment includes the use of anti-VEGF drugs but may also include the use of focal or grid pattern photocoagulation or pars plana vitrectomy. Reference: Diabetic macular edema. In: Basic and clinical science course (BCSC) Section 12: Retina and vitreous. Chapter 5 Retinal vascular disease: diabetic retinopathy. San Francisco, CA: American Academy of Ophthalmology. 2016-2017 p92-100","u":"pages/diabetic-macular-edema.htm","cr":"Ben J. Janson, MD","src":"er"},{"t":"Circinate Ring of Lipid Exudates","im":[["E:pages/imgs/cirinate_ring_lipid_exudates_1.png","There is a pigmented choroidal lesion (red arrow) centered along the inferotemporal arcade with fading pigment, surrounding RPE atrophy, and prominent macular edema superior to the lesion. There is a circinate ring of lipid in the macula (yellow arrow)."],["E:pages/imgs/circinate_ring_lipid_exudates_2.jpg","There is prominent cystoid macular edema (blue arrow) and a circinate ring of lipid exudates in the macula (yellow arrow)."]],"h":"Color fundus photograph and Optical Coherence Tomography (OCT) images of the right eye of a patient with a treated choroidal melanoma and radiation retinopathy. This patient underwent I-125 plaque brachytherapy and subsequently developed radiation retinopathy and optic neuropathy with associated cystoid macular edema (blue arrow) and a circinate ring of lipid in the macula (yellow arrows). Lipid exudates (hard exudates) are associated with conditions causing chronic vascular leakage such as diabetic retinopathy, retinal vein occlusion, and radiation retinopathy. The exudates are often configured in a circinate (ring-like) pattern. *Red arrow indicates treated tumor.","u":"pages/Circinate_Ring_Lipid_Exudates.html","cr":"Reiker Ricks, MD; Paige Noble, MD; Elaine Binkley, MD","src":"er"},{"t":"Proliferative diabetic retinopathy (PDR)","im":[["E:pages/proliferative-diabetic-retinopathy/PDR-OS-LRG.jpg",""],["E:pages/proliferative-diabetic-retinopathy/Prolif-DR-1-LRG.jpg","Optos® fundus photo, right eye"],["E:photos/DR/dr2.jpg","Seen are neovascularization, cotton wool spots, microaneurysms, and intraretinal hemorrhages."]],"h":"Samantha Jacobo The left eye shows severe neovascularization of the disc (NVD) that extends down along the inferior arcade with tufts of neovascularization elsewhere (NVE) along both the inferior and superior arcades. The right eye had similar findings. Severe Proliferative Diabetic Retinopathy Severe Proliferative Diabetic Retinopathy Contributor: Morgan Bertsch, BS and Tyler B.S. Risma, MD Posted May 11, 2017 This patient is a 32-year-old female with poorly controlled type I diabetes mellitus and severe proliferative diabetic retinopathy. She had not had panretinal photocoagulation at the time of presentation. Eventually this patient developed severe vitreous hemorrhage and traction retinal detachments in both eyes. Optos® widefield fluorescein angiography demonstrates delayed arteriovenous transit time, extensive neovascularization of the disc and huge areas of capillary nonperfusion. Proliferative diabetic retinopathy Proliferative diabetic retinopathy Contributor: Andrew Doan, MD, PhD, University of Iowa February 8, 2008 Proliferative diabetic retinopathy - advanced, uncontrolled Proliferative diabetic retinopathy - advanced, uncontrolled","u":"pages/proliferative-diabetic-retinopathy/index.htm","cr":"Christopher Kirkpatrick, MD","src":"er"},{"t":"Severe Proliferative Diabetic Retinopathy","im":[["E:pages/Severe-Proliferative-Diabetic-Retinopathy/PDR-nest-OD-LRG.png","Right Eye"],["E:pages/Severe-Proliferative-Diabetic-Retinopathy/PDR-nest-OS-LRG.PNG","Right Eye"]],"h":"Brice Critser The patient is a 45-year-old woman with poorly controlled type I diabetes mellitus who presents with hand motion vision bilaterally. She has had panretinal photocoagulation in both eyes. The severe neovascularization obscures the optic nerves and has resulted in bilateral tractional retinal detachments involving the maculae. The detachment in the left eye has been present for too long to salvage with surgical intervention.","u":"pages/Severe-Proliferative-Diabetic-Retinopathy/index.htm","cr":"William Flanary, MD","src":"er"},{"t":"Traction retinal detachment secondary to proliferative diabetic retinopathy","im":[["E:photos/traction-ret-detach/traction-retinal-detachment-LARGE.jpg","This photo shows a tractional retinal detachment secondary to proliferative diabetic retinopathy. There are fibrovascular bands encircling the arcades that are fovea (macula) threatening. Please note the neovascularization of the disc (NVD) originating from the inferonasal edge of the optic disc."]],"h":"This photo shows a tractional retinal detachment secondary to proliferative diabetic retinopathy. There are fibrovascular bands encircling the arcades that are fovea (macula) threatening. Please note the neovascularization of the disc (NVD) originating from the inferonasal edge of the optic disc.","u":"pages/traction-RD.htm","cr":"Elizabeth Gauger, MD","src":"er"},{"t":"Hypertensive retinopathy","im":[["E:photos/Hypertensive-Retinopathy-OD.JPG","Hypertensive retinopathy: 37-year-old male with optic disc edema, cotton wool spots, flame hemorrhages, dot blot hemorrhages, arteriovenous nicking, and exudates. He was asymptomatic and his vision was 20/20 in both eyes. Blood pressure in clinic was 198/142."]],"h":"Hypertensive retinopathy: 37-year-old male with optic disc edema, cotton wool spots, flame hemorrhages, dot blot hemorrhages, arteriovenous nicking, and exudates. He was asymptomatic and his vision was 20/20 in both eyes. Blood pressure in clinic was 198/142.","u":"pages/hypertensive-retinopathy.html","cr":"Jaci Haugsdal, (4th year medical student) and Justin Risma, MD","src":"er"},{"t":"Malignant Hypertension","im":[["E:photos/malignant-HTN.jpg","Fundus Photo. Patient is a 52-year-old male with malignant hypertension"]],"h":"Fundus Photo. Patient is a 52-year-old male with malignant hypertension","u":"pages/malignant-hypertension.htm","cr":"C. Blake Perry, MD","src":"er"},{"t":"Radiation retinopathy","im":[["E:photos/radiation-retinopathy.jpg",""],["E:photos/Radiation-Retinopathy-janson-LRG.jpg",""],["E:photos/Radiation-Retinopathy-2-LRG.jpg",""]],"h":"Radiation retinopathy is a slowly-progressive microangiopathy that occurs after prior exposure to radiation. Findings are similar to diabetic retinopathy and include microaneurysms, retinal hemorrhages, exudates, and cotton wool spots as seen in this photograph. Occasionally the condition can lead to areas of capillary nonperfusion and retinal neovascularization which was not apparent in this patient. Contributor: Ben Janson, MD Photographer: Andrea Hoback This patient has a history of intracranial malignancy treated with chemotherapy, radiation, and resection and developed blurry vision in the both eyes 6 months following treatment. Color montage photos of both eyes depict numerous scattered dot and blot hemorrhages, flame hemorrhages along the arcades, exudates, and cotton wool spots. In the left eye, there is a pre-retinal hemorrhage overlying the optic nerve and tracking inferiorly. Radiation retinopathy has a delayed onset after external beam or plaque brachytherapy. Typical radiation doses of 30-35 grays are required for radiation retinopathy to occur, but doses of as little as 15 grays have resulted in radiation retinopathy. Typically, patients present with decreased visual acuity. On examination, there are hemorrhages, cotton wool spots, and macular edema. Other vascular diseases, like diabetic retinopathy, may appear similarly and should be in the differential diagnosis.","u":"pages/radiation-retinopathy.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Non-proliferative sickle cell retinopathy","im":[["E:pages/Non-proliferative-sickle-cell-retinopathy/Atlas-1-LRG.jpg","Photo demonstrates an elevated, round hypopigmented (salmon colored) lesion in the inferior retinal periphery with surrounding hyperpigmentation. This lesion represents a previous intraretinal hemorrhage, which has since hemolyzed and now appears as a \"salmon patch.\""],["E:pages/Non-proliferative-sickle-cell-retinopathy/Atlas-2-LRG.jpg","Photo demonstrates a flat, salmon colored, ovoid lesion in the nasal retinal periphery that also represents a \"salmon patch.\"\""]],"h":"Photo demonstrates an elevated, round hypopigmented (salmon colored) lesion in the inferior retinal periphery with surrounding hyperpigmentation. This lesion represents a previous intraretinal hemorrhage, which has since hemolyzed and now appears as a \"salmon patch.\" Photo demonstrates a flat, salmon colored, ovoid lesion in the nasal retinal periphery that also represents a \"salmon patch.\"\"","u":"pages/Non-proliferative-sickle-cell-retinopathy/index.htm","cr":"Prashant K. Parekh, MD","src":"er"},{"t":"Central Retinal Vein Occlusion (CRVO)","im":[["W:photos-earlier/12C.jpg","1 & 2 Ischemic CRVO"],["W:photos-earlier/12B.jpg","3& 4 Non-Ischemic CRVO"]],"h":"1 & 2 Ischemic CRVO 3& 4 Non-Ischemic CRVO","u":"pages/CRVO/index.htm","cr":"Robert B. Dinn, MD, Erin E. O'Malley, MD","src":"er"},{"t":"Central retinal vein occlusion with cilioretinal artery occlusion","im":[["E:pages/CRVO-w-CLRAO/CRVO-CLRAO-LRG.jpg",""]],"h":"Cilioretinal artery occlusion (CLRAO) often occurs in the setting of a central retinal vein occlusion (CRVO). This lack of perfusion in the cilioretinal artery results from a functional hemodynamic block as the low perfusion pressure of the choroid, which supplies the cilioretinal artery, is unable to overcome the elevated venous pressure which results from the CRVO. The central retinal artery, however, is still able to perfuse due to its baseline higher perfusion pressure and ability to autoregulate its intraluminal pressure. In this photo, there are diffusely scattered intraretinal hemorrhages and cotton wool spots with associated venous distention and tortuosity secondary to the CRVO. Note the area of retinal whitening extending from the temporal disc into the macula in the region perfused by the cilioretinal artery. The fluorescein angiogram confirms that this is a cilioretinal artery as it fills with the choroid, prior to the filling of the central retinal artery.","u":"pages/CRVO-w-CLRAO/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Branched Retinal Vein Occlusion (BRVO)","im":[["E:photos/BRVO2005.jpg",""],["E:photos/BRVO/Fig1-optos-widefield-OS-NVE.jpg",""]],"h":"Classic sectoral hemorrhages are well-visualized in this case of Branched Retinal Vein Occlusion (BRVO). This condition is commonly associated with hypertension. BRVO (Branched Retinal Vein Occlusion) BRVO (Branched Retinal Vein Occlusion) Category(ies): Retina Contributor: Andrew Goldstein, MD and Michael D. Abramoff, MD, PhD Contributor: Sarah Skiles, CRA Posted: April 7, 2022 This series of images was obtained in a 69-year-old man who presented for a routine eye examination and reported a remote history of branch retinal vein occlusion (BRVO). He was asymptomatic with an uncorrected distance visual acuity of 20/20 in both eyes. On his initial examination he was noted to have a large area of peripheral neovascularization elsewhere (NVE). Scatter laser photocoagulation was applied to the large area of capillary non-perfusion anterior to the NVE in order to reduce the risk of hemorrhage. Figure 1: Optos widefield imaging of the left eye demonstrates superior temporal retinal neovascularization elsewhere (NVE) as indicated by the white arrow. Figure 2: Optos widefield fluorescein angiography during the arteriovenous phase demonstrates neovascularization with mild leakage and capillary non-perfusion of the surrounding retina (marked by white stars). Figure 3: Optos widefield fluorescein angiography during the late phase shows continued superior temporal hyperfluorescence due to leakage from the neovascular vessels.","u":"pages/Branched-Retinal-Vein-Occlusion.html","cr":"Christopher C. Robinson, MD and Jordan M. Graff, MD","src":"er"},{"t":"BRVO (Branched Retinal Vein Occlusion)","im":[["E:photos/BRVO_1.jpg",""]],"h":"In this photo, the classic appearance of a BRVO is illustrated. There was no associated macular edema in this patient.","u":"pages/BRVO-Branched-Retinal-Vein-Occlusion.html","cr":"Robert Dinn, MD","src":"er"},{"t":"Central Retinal Artery Occlusion (CRAO)","im":[["W:photos/CRAO-CRVO/CRAOcilioretinalsparinglowres.jpg","Sparing of the fovea due to a ciliary retinal artery in the presence of a CRAO secondary to a cardiac myxoma."],["E:pages/CRAO/CRAO-OD-LRG.jpg","OCT OS"],["E:pages/imgs/R_7fCGzZgmHmDr1Zv_CRAO%20with%20ciliary%20sparing.png",""]],"h":"Central retinal artery occlusion (CRAO) occurs when occlusion of the central retinal artery, a branch of the ophthalmic artery, results in infarction of the inner retina with subsequent, typically severe, vision loss. The picture above exhibits a CRAO with sparing of the foveal retina due to the presence of a cilioretinal artery. A cilioretinal artery has been found to be present in 49.5% of patients. The cilioretinal artery branches off the ophthalmic artery and supplies the inner retina in these individuals. This is in contradistinction to the posterior ciliary arteries, which branch off the ophthalmic artery and supply the choroid and outer retina. Patients with a cilioretinal artery may have preserved central vision in the unfortunate event of a CRAO. Contributor: David Phillips, MD Photographer: Andrea Starkweather This middle-aged male presented with an abrupt decrease in vision in the right eye 4 days prior. Note the retinal whitening, classic cherry red spot, and scatted cotton wool spots. The OCT shows inner retinal edema in the right eye (OD) compared to the normal retinal OCT in the left (OS). Also note the delayed filling of the macular arteries on the fluorescein angiogram. Central Retinal Artery Occlusion (CRAO) with Cilioretinal Artery SparingCentral Retinal Artery Occlusion (CRAO) with Cilioretinal Artery SparingCategory(ies): Retina / VitreousContributor: Mahsaw Mansoor, MDPhotographer: Jody Troyer, CRAPosted: 06/04/2024A 34-year-old female with history of recent methamphetamine use presented with several hours of painless vision loss in the right eye. Exam was significant for retinal whitening with sparing of the nasal macula due to vascular preservation via the cilioretinal artery.","u":"pages/CRAO/index.htm","cr":"Thomas A. Weingeist, PhD, MD","src":"er"},{"t":"Branch Retinal Artery Occlusion (BRAO)","im":[["E:photos/BRAO-OU-color-fundus.jpg","Optical coherence tomography (OCT) of both eyes. The right eye (left side image) is notable for the presence of an epiretinal membrane. The left eye (right side image) is significant for diffuse inner retina edema and thickening along the inferior arcade."],["W:photos/BRAO-OD-1-month.JPG","1 month later, the retinal whitening and edema resolved. (Chen, 2012)"],["W:photos/brao.jpg","Arrow denotes emboli in inferior arteriole. (Doan, 2004)"]],"h":"Color fundus photograph of both eyes of a 79 year-old male presenting with acute onset left eye vision loss of the superior-nasal quadrant. The right eye (left side image) demonstrates an epiretinal membrane nasal to the fovea. The left eye (right side image) demonstrates a yellow plaque (indicated by the white arrow) lodged within the inferior retinal artery overlying the optic disc. Diffuse areas of retinal whiteni","u":"pages/BRAO/index.htm","cr":"Ryan J. Diel, MD; Zachary Mortensen, MD; A. Tim Johnson, MD","src":"er"},{"t":"Hollenhorst plaque in Branch Retinal Artery Occlusion (BRAO)","im":[["E:photos/Hollenhorst-plaque-2.jpg","BRAO left eye. Two Hollenhorst plaques can be visualized: one in the first bifurcation of the central retinal artery and another along the inferotemporal arcade arteriorle at a branch point."],["E:photos/Hollenhorst-plaque-in-Branch-Retinal-Artery-Occlusion-.jpg","Note the macular whitening indicating macular ischemia."]],"h":"BRAO left eye. Two Hollenhorst plaques can be visualized: one in the first bifurcation of the central retinal artery and another along the inferotemporal arcade arteriorle at a branch point. Note the macular whitening indicating macular ischemia.","u":"pages/Hollenhorst-plaque.htm","cr":"Elizabeth Gauger, MD","src":"er"},{"t":"Hollenhorst plaque with branch retinal artery occlusion (BRAO) causing a cherry red spot","im":[["E:photos/BRAO-cherry-red-spot.jpg","This was an interesting case in which a cholesterol (Hollenhorst) plaque became lodged in an inferior branch of the central retinal artery that perfused both the superior and inferior macula. Unfortunately for this patient this resulted in significant central vision loss."]],"h":"The cherry red spot occurs because the choroidal and retinal circulation is separate. The richly vascularized sub-foveal choriocapillaris remains perfused after CRAO, but the surrounding retina becomes opaque due to edema as the tissue becomes ischemic.","u":"pages/Hollenhorst-plaque-BRAO-cherry-red-spot.htm","cr":"Matt Ward, MD","src":"er"},{"t":"BRAO due to fibrin embolus","im":[["E:photos/Fibrin/Fibrinemboluscolor.jpg",""],["E:photos/Fibrin/Fibrinembolusfa2.jpg",""],["E:photos/Fibrin/Fibrinembolusfa3.jpg",""]],"h":"","u":"pages/BRAO-due-to-fibrin-embolus.html","cr":"Mark H. Haimann, MD","src":"er"},{"t":"Incidental Retinal Embolus","im":[["E:photos/Retinal-Embolus-LRG.jpg",""],["E:pages/imgs/Calcium_Embolus_Atlas.jpg","Fundus photo demonstrating a calcium embolus overlying the right optic disc with severely attenuated inferotemporal and inferonasal arcades."]],"h":"This patient was referred for evaluation of a macular hole in the left eye after a decrease in visual acuity over 6 weeks. In addition to the macular hole, an incidental yellow-orange plaque was visible within a vessel of the inferotemporal arcades within the inferotemporal macula. The patient had a history of recent cardiac surgery. The inner layers of the retina gain their blood supply from the central retinal artery, and in some cases, the fovea is supplied by the cilioretinal artery. Patients with an embolism may be asymptomatic, like this patient, when a peripheral arteriole is occluded. Common embolic sources are cholesterol (Hollenhorst plaque), platelet-fibrin, or calcific emboli, and all of these emboli are related to underlying vascular disease. Additional sources of emboli include fat, septic, and talc emboli. If these emboli lodge in larger vessels, a branch retinal artery occlusion (BRAO) or central retinal artery occlusion (CRAO) may occur. No known therapy has been effective in improving visual damage. Incidental Retinal Embolus Incidental Retinal Embolus Category(ies): Retina/Vitreous Contributor: Emma M. Hartness, MD; Mahmoud KhalafAllah, MD, PhD; Matthew J. Thurtell, MBBS, MSc Photographer: Najla Al-Salama, CRA An 81-year-old female with a past ocular history of a branch retinal artery occlusion of the right eye and past medical history of giant cell arteritis, hyperlipidemia, hypertension, and myocardial infarction presented for follow-up and an embolic plaque was incidentally noted during her fundus examination. The plaque was characterized as a calcium embolus given its dull, white, non-reflective appearance, rather than a cholesterol embolus, which typically displays a brighter, yellow-orange appearance with refractile crystals.","u":"pages/incidental-retinal-embolus.htm","cr":"Ben J. Janson, MD","src":"er"},{"t":"Cilioretinal Artery Occlusion","im":[["E:photos/Cilioretinal-Artery-Occlusion/cilioretinal-artery-LRG.jpg","Optical coherence tomography shows retinal edema of the inner retinal layers superior to the fovea in the distribution of the cilioretinal artery."]],"h":"Susan Wright A 67-year-old man with history of type 2 diabetes mellitus, hyperlipidemia, and uncontrolled hypertension presented with a central visual field deficit of sudden onset in his right eye. Visual acuity on presentation was 20/25 in both eyes, and funduscopic examination revealed an isolated cilioretinal artery occlusion (CLRAO) in his right eye (Figure 1). Work-up revealed significant right internal carotid artery stenosis (>50%). A right carotid endarterectomy was performed, and vascular risk factors were optimized. Visual acuity was stable at 20/25 one month after presentation. CLRAO accounts for ~5-7% of retinal artery occlusions and is usually associated with a central retinal vein occlusion (CRVO) or anterior ischemic optic neuropathy (AION). [1-3] Less commonly, CLRAOs may occur as an isolated phenomenon as in this case. Isolated CLRAOs typically have a better visual prognosis than those associated with a CRVO or AION with 90% of patients achieving a visual acuity of 20/40 or better. [3] Reference: Brown GC, Shields JA. Cilioretinal arteries and retinal arterial occlusion. Arch Ophthalmol. 1979;97:84–92. Hayreh SS. Pathogenesis of occlusion of the central retinal vessels. Am J Ophthalmol 1971;72:998–1011 Brown GC, Moffat K, Cruess A, Magargal LE, Goldberg RE. Cilioretinal artery obstruction. Retina. 1983;3(3):182-7","u":"pages/cilioretinal-artery-occlusion.htm","cr":"Austin Fox, MD and Stephen Russell, MD","src":"er"},{"t":"Acute Macular Neuroretinopathy (AMN)","im":[["E:pages/Acute-macular-neuroretinopathy/AMN-LRG.jpg",""],["E:pages/Acute-macular-neuroretinopathy/AMN_2008a.jpg",""]],"h":"Acute macular neuroretinopathy (AMN) is a rare disease of unknown etiology that most commonly affects young to middle-aged females. The patient typically presents with the acute-onset of one or multiple paracentral scotomas that affect one or both eyes. This is typically the only symptom and visual acuity is unaffected. Fundus findings include 1 or more reddish-brown petalloid perifoveal lesions with the tip pointed toward the fovea that become visible days to months after the onset of symptoms. Lesions are typically better identified with infrared imaging. OCT through the lesions commonly show disruption of the inner segment/outer segment (IS/OS) junction (ellipsoid zone). There is no known treatment and symptoms may not resolve. Reference Bhavsar KV, Lin S, Rahimy E, Joseph A, Freund KB, Sarraf D, Cunningham ET Jr. Acute macular neuroretinopathy: A comprehensive review of the literature. Surv Ophthalmol. 2016 Sep-Oct;61(5):538-65. http://pubmed.gov/26973287. Previous Entry Feb 8, 2008 Contributor: James M. Coombs, MD 44-year-old female with acute onset of paracentral scotomas in right eye (corresponded directly to Amsler grid findings)","u":"pages/Acute-macular-neuroretinopathy/index.htm","cr":"Christopher Kirkpatrick, MD","src":"er"},{"t":"Purtscher Retinopathy","im":[["W:photos/purtschers-retinopathy/purtschers-OD-LRG.jpg",""],["W:photos/purtschers-retinopathy/purtschers-OS.jpg",""],["W:photos/Purtscher.jpg",""]],"h":"This 21 year old male noted a significant unilateral decrease in vision two days after an all-terrain vehicle (ATV) roll-over accident in which he suffered head trauma and a fractured rib. Radiating superficial retinal ischemia is seen here with scattered blot hemorrhages and venous dilation in the right eye. His left eye was unaffected. True Purtscher's Retinopathy was originally described in cases of known head-trauma, but this clinical picture can also be seen in a variety of disease mechanisms including chest compression, long-bone fracture, acute pancreatitis, and connective tissue disorders amongst others. Contributor: Matthew Benage, MD Photographer: Sarah Greenwalt This is an impressive example of Purtscher's retinopathy following unrestrained motor vehicle accident. He suffered T5-T7 fracture, brain contusion, rib fracture, and mandibular fracture. He presented to clinic due to complaint of profound vision loss following his accident. On exam, he was noted to have Purtscher's retinopathy. Note the significant inner retinal edema on OCT and whitening, arteriolar hemorrhage, and edema of the fundus. Purtscher's retinopathy typically follows trauma in the absence of direct trauma to the globe. Common causes are long bone fracture, chest compression injuries, air embolization, childbirth, as well as pancreatitis and connective tissue disorders. Clinical presentation is variable, with some patients presenting with profound vision loss and others with minimal changes. A relative afferent pupillary defect may or may not be present. Clinical findings are cotton wool spots, retinal hemorrhages, and Purtscher's flecken, which are areas of whitening in the inner retina between the retinal arterioles and venules. OCT displays hyperreflectivity of the inner retinal layers due to inner retinal edema. Prognosis is variable and largely depends on the extent of retinal involvement. Contributor: Jesse Vislisel, MD Photographer: Antoinette Venckus, CRA; Stefani Karakas, CRA Purtscher retinopathy is the appearance of cotton wool spots, hemorrhages, and retinal edema located predominantly around the optic disc. It is caused by complement activation after acute crushing injuries to the head or thorax. Similar-appearing Purtscherlike retinopathy can be caused by a variety of etiologies including acute pancreatitis, chronic renal failure, autoimmune diseases, fat embolism, amniotic fluid embolism, retrobulbar anesthesia, and orbital steroid injection. Below are images of two separate patients with Purtscher retinopathy after compressive injuries to the chest. Contributor: Patrick Donegan, MD Purtscher retinopathy is an occlusive microvasculopathy which classically results from head trauma, chest compression, or long bone fracture. This 25-year-old patient was involved in a high speed, roll-over motor vehicle crash and sustained both head trauma and chest compression injury resulting in a rib fracture. Visual acuity in the affected eye was 20/250 eccentrically.","u":"pages/purtscher/index.htm","cr":"Alison Bozung, OD","src":"er"},{"t":"Valsalva Retinopathy with Sub-ILM hemorrhages in the setting of pancytopenia and pneumonia","im":[["E:photos/Valsalva-retinopathy.jpg",""]],"h":"TThis is a 62-year-old man with a history of diffuse large B-cell lymphoma who had undergone autologous bone marrow transplantation and noted vision loss after a coughing episode while admitted for pancytopenia and pneumonia. The photo was taken 1 month after onset of symptoms and demonstrates hemorrhages in multiple layers of the retina, but most prominently beneath the internal limiting membrane as demonstrated by spectral domain OCT (distinct from sub-hyaloid or pre-retinal hemorrhage). At 1 month, the red cells had taken on a pale white color. Initial vision was 20/70 OD and 20/40 OS improving to 20/20 OD and stable at 20/40 OS 3 months after onset of symptoms with observation.","u":"pages/Valsalva-Retinopathy.htm","cr":"Matt Ward, MD","src":"er"},{"t":"Multi-level retinal hemorrhage secondary to acute immune thrombocytopenic purpura (ITP) exacerbation","im":[["E:photos/immune-thrombocytopenic-purpura/Fundus-bilateral-peripapillary-retinal-hemorrhages-LRG.jpg",""]],"h":"She was found to have a platelet count of 0 and a small concomitant intracranial hemorrhage, though the latter was thought to be noncontributory to her retinal findings. Fundus photos demonstrate superficial, intraretinal, and subretinal involvement, including flame hemorrhage that indicate involvement of the sub-ILM layer, as well as disc hemorrhage. She unfortunately was lost to follow-up, but per her Hematology clinic notes, her visual symptoms have improved after receiving IVIG, Decadron, and Rituxan infusions. Treatment for her ITP is ongoing. Despite ITP being a disease of impaired coagulability, retinal hemorrhage is exceptionally rare. Beyond retinal hemorrhage, additional ocular manifestations of ITP include vitreous hemorrhage secondary to intracranial bleeding (similar to Terson’s syndrome), NAION, optic tract hemorrhage, and subconjunctival hemorrhage. Fundus photos demonstrating bilateral, multi-level peripapillary retinal hemorrhages OS>OD in a 21-year-old female with acute immune thrombocytopenic purpura (ITP) exacerbation.","u":"pages/immune-thrombocytopenic-purpura.htm","cr":"Joanna IM Silverman, MD","src":"er"},{"t":"Sub-inner limiting membrane hemorrhage in leukemic retinopathy","im":[["E:LARGE/sub-ILM-hemorrhage-LRG.png",""]],"h":"This large sub-inner limiting membrane (ILM) macular hemorrhage occurred in a 31 year-old male with acute myeloid leukemia who was recently treated with chemotherapy and developed disseminated intravascular coagulation and severe thrombocytopenia and anemia. Note the glistening light reflex from the ILM overlying the hemorrhage.","u":"pages/sub-ILM-hemorrhage.htm","cr":"Justin Risma, MD","src":"er"},{"t":"Leukemic retinopathy","im":[["E:photos/leukemic/Leukemic-Retinopathy-1.jpg","Image 3: OCT OD: irregularities of outer retinal layer in the fovea with scant patchy areas of inner retinal edema and opacifications"],["E:photos/leukemic/Leukemic-Retinopathy-2.jpg","Image 2: OS: many central and paracentral superficial hemorrhages, some with a white center (ie Roth spots); no cystoid macular edema"],["E:photos/leukemic/Leukemic-Retinopathy-5.jpg","Images 5-8"]],"h":"Retinopathy associated with leukemia typically occurs in acute disease. Patients may develop dilation, tortuosity, and beading of the retinal veins; vascular sheathing; cotton-wool spots; flame-shaped hemorrhages; Roth spots; sub-hyaloid and sub-internal limiting membrane hemorrhages. These changes are similar to those seen with severe anemia. A 60-year-old female was referred for bilateral retinal hemorrhages. She noticed blurry since two months prior when she hit her head. She said her right eye gradually improved, but the left eye remained poor. She was told that this may be related to her blood pressure, but it was found to be normal (i.e. 118/70). She had a past ocular history of myopia, and a past medical history of hypertension. BCVA with correction: • OD: 20/125 • OS: 20/40 IOP: OD 13; OS 14 SLE: anterior segment unremarkable; 1+ NS OU; no AC cells; no vitreous cells The patient presented with bilateral retinal hemorrhages and scattered Roth spots. A fluorescein angiogram was done which ruled out retinal venous occlusions and showed no evidence of vasculitis. Upon further history, she reported mild fatigue and bruising on the upper and lower extremities for the past few weeks. CBC, ESR, CRP, ANA were ordered, significant for the following: WBC: 354.1 (normal 3.7-10.5) RBC: 2.37 (normal 4-5.20) Hb: 7.3 (normal 11.9-15.5) Hct: 22 (normal 35-47%) Plt: 81 (normal 150-400) BP was checked in the clinic: 129/66 Patient was immediately referred to the hematology and oncology service. She was diagnosed with leukocytosis consistent with chronic myeloid leukemia, later found to be positive for the Philadelphia (Ph+) chromosome. She was started on chemotherapy, and her follow-up fundus photos are shown below.","u":"pages/leukemic-retinopathy.htm","cr":"Eric Chin MD","src":"er"},{"t":"Terson syndrome","im":[["E:pages/Terson/terson-LRG.jpg","This photo shows a patient with a large sub-ILM hemorrhage."]],"h":"Terson syndrome is the presence of vitreous or sub-internal limiting membrane (ILM) hemorrhage after acute intracranial hemorrhage. It has been hypothesized that the bleeding results when a sudden rise in intracranial pressure causes rupture of retinal and peripapillary vessels.","u":"pages/Terson/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Non-accidental trauma-Bilateral Retinal Hemorrhages","im":[["E:photos/Non-accidental-trauma/Fig1-LRG.jpg","Color fundus of the Right eye (OD) demonstrating numerous dot-blot and flame hemorrhages extending from the posterior pole to the ora."],["E:photos/Non-accidental-trauma/Fig2-LRG.jpg","Color fundus of the Left eye (OS) demonstrating numerous dot-blot and flame hemorrhages extending from the posterior pole to the ora."],["E:photos/NonAccidentalTrauma-OD.jpg","Color fundus of the Right eye (OD)"]],"h":"Retinal hemorrhages (RHs) are present throughout the macula and periphery of both eyes in this 4-month-old child. The differential diagnosis for retinal hemorrhages in an infant includes non-accidental trauma, sepsis, coagulopathy, leukemia, uncontrolled hypertension, cardiopulmonary resuscitation, and hyperviscosity syndromes, amongst others (1). It is prudent to rule out other causes by history, physical exam, and laboratory testing. If intracranial pathology (e.g., subdural hematoma) is present without an identifiable etiology, one must suspect repetitive shaking or repetitive impact (resulting in repetitive rotational forces on the head) as the most likely cause of the RHs. Bilateral hemorrhages in multiple levels of the retina (i.e., pre, intra, and subretinal) and paramacular folds further raise the suspicion of child abuse. The number of hemorrhages and extent into the periphery (to the ora) also increase the likelihood that non-accidental trauma has occurred. The primary mechanism of RHs in child abuse is mechanical with resultant shearing and damage to the retinal blood vessels, with or without direct blunt injury to the child. It is known that a correlation exists between the severity of ocular and intracranial injury and the presence of numerous RHs (2). Contributor: Pavlina Kemp, MD 6 month-old girl found unresponsive and evaluated in the setting of a work-up of suspected non-accidental trauma. Fundus exam shows retinal nerve fiber layer hemorrhages OS > OD.","u":"pages/non-accidental-trauma.htm","cr":"Brittni A. Scruggs, MD, PhD","src":"er"},{"t":"Retinal Arterial Venous Malformation","im":[["E:pages/imgs/retinal_arterial_venous_malformation_OD_AVM.jpg","right eye fundus photo showing a large arterial venous malformation with severe tortuosity at the superior arcade and moderate tortuosity at the inferior arcade OD"],["E:pages/imgs/retinal_arterial_venous_malformation_OS.jpg","left eye fundus photo showing moderately dilated and tortuous retinal vasculature"]],"h":"Brooke Muth A 64-year-old woman was found on routine examination to have severe tortuosity of the superior arcade vessels in the right eye consistent with an arterial venous malformation (AVM). The other eye had moderately dilated and tortuous retinal vasculature. Retinal AVMs can be seen in isolation as an acquired anomaly or as an ophthalmic finding in Wyburn-Mason Syndrome, a rare congenital disorder characterized by AVMs in the retina and brain. Vision loss in AVMs may occur due to complications such as vascular occlusion. In this patient, MRI/MRA brain was negative for brain AVMs, and regular surveillance was advised.","u":"pages/retinal_arterial_venous_malformation.htm","cr":"Lauren A. Tomlinson, MD; Jonathan F. Russell, MD, PhD","src":"er"},{"t":"Coats Disease","im":[["E:pages/imgs/R_6Hh2iyq1pqj36ru_Coats%20disease.jpg",""]],"h":"An 8-year-old boy was evaluated for unilateral retinal vascular abnormalities. On exam, he had clusters of retinal telangiectasias (white arrows) in the far periphery with extrafoveal exudation (orange arrows). This is consistent with a diagnosis of Coats disease, stage 2A. \"","u":"pages/Coats_Disease.html","cr":"Mahsaw Mansoor, MD","src":"er"},{"t":"Familial Exudative Vitreoretinopathy (FEVR)(3)","im":[["E:pages/FEVR/FEVR-LRG.jpg","This photograph shows a fibrovascular stalk, wrapped in a fold of retina, that originates from the optic disc and stretches across the macula in a patient with FEVR"]],"h":"Familial exudative vitreoretinopathy (FEVR) is an inherited condition that most commonly has autosomal dominant inheritance. It is characterized by failure of the temporal retina to vascularize, similar to retinopathy of prematurity. FEVR results in fibrovascular proliferation causing retinal folds, temporal dragging of the macula, and tractional retinal detachments. OMIM: 133780","u":"pages/FEVR/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Familial Exudative Vitreoretinopathy (FEVR)(1)","im":[["W:photos/FEVR-OD-Composite.jpg","Right Eye"],["W:photos/FEVR-OS-Composite.jpg","Left Eye"]],"h":"These fundus photos are from a 4 week-old baby boy who has familial exudative vitreoretinopathy (FEVR) manifesting bilateral retinal detachments with tractional and exudative components, as well as preretinal neovascularization and subretinal hemorrhage and lipid exudate. OMIM: 133780","u":"pages/FEVR.htm","cr":"Lorna Grant, MD","src":"er"},{"t":"Familial exudative vitreoretinopathy (FEVR)(2)","im":[["E:pages/FEVR-2/FEVR-LRG.jpg","This montage photograph shows significant dragging of the macula with temporal displacement of the fovea."]],"h":"Familial exudative vitreoretinopathy (FEVR) is an retinal condition that most commonly has autosomal dominant inheritance. It is characterized by failure of the temporal retina to vascularize, similar to retinopathy of prematurity. FEVR results in fibrovascular proliferation causing retinal folds, temporal dragging of the macula, and tractional retinal detachments. OMIM: 133780","u":"pages/FEVR-2/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Vascular sheathing in idiopathic retinal vasculitis","im":[["E:pages/vasculitis/vasculitis-OD-LRG.JPG","Right Eye"],["E:pages/vasculitis/vasculitis-OS-LRG.JPG","Left Eye"],["E:pages/vasculitis/vasculitis-OD-montage-LRG.JPG","Right Eye"]],"h":"Vasculitis. At the time of these photographs, the patient had active vasculitis in the right eye while the left was inactive. He has prominent vascular sheathing and scattered retinal pigmented epithelium (RPE) changes. The fluorescein angiogram shows scattered leakage in the right eye and window defects in the area of RPE atrophy in the left eye.","u":"pages/vasculitis/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Retinal Periphlebitis","im":[["W:pages/Retinal-Periphlebitis/top-LRG.jpg",""],["W:pages/Retinal-Periphlebitis/middle-LRG.jpg",""],["W:pages/Retinal-Periphlebitis/bottom.jpg",""]],"h":"Andrea Starkweather Retinal periphlebitis is a vasculitis of the peripheral retinal vasculature. The faint silvery glow surrounding the peripheral retinal veins in these montage photos depict this. This case is a young female that presented with non-specific visual complaints and was found to have bilateral retinal periphlebitis. The etiology was undetermined and she was sent on to Neurology to be worked up for multiple sclerosis which can be associated with this condition.","u":"pages/Retinal-Periphlebitis/index.htm","cr":"Tressa Larson, OD","src":"er"}]},{"n":"Inflammation & infection","b":"White dot syndromes, granulomatous disease and infectious retinitis.","items":[{"t":"Acute posterior multifocal placoid pigment epitheliopathy (APMPPE)","im":[["E:pages/APMPPE/APMPPE-1-LRG.jpg","Color fundus photo, right eye (OD): Multiple creamy yellow-white lesions throughout the macula. There is mild vitritis on exam and mild disc"],["E:pages/imgs/R_3B8QpptNLQDPn3d_APMPPE2.png",""],["E:pages/imgs/R_3B8QpptNLQDPn3d_APMPPE1.png",""]],"h":"APMPPE is one of the white dot syndromes that occurs in young healthy adults and similarly affects males and females. It is usually bilateral, although may be worse in one eye. APMPPE is generally a self-limited condition that requires no treatment and has a good prognosis. A 47-year-old female presents with a four day history of fluttering bright spots in the right eye. She denies a viral prodrome or headaches. Acute posterior multifocal placoid pigment epitheliopathy (APMPPE) Acute posterior multifocal placoid pigment epitheliopathy (APMPPE) Category(ies): Retina / Vitreous,Uveitis Contributor: Mahsaw Mansoor, MD Photographer: Jody Troyer, CRA Posted: 06/04/2024 A 36-year-old woman presented with progressive vision loss in both eyes following a viral infection. On exam, there were placoid areas of whitening throughout the posterior pole of both eyes. On fluorescein angiography, the lesions on exam demonstrated early blocking defects and late staining. Acute posterior multifocal placoid pigment epitheliopathy (APMPPE) Acute posterior multifocal placoid pigment epitheliopathy (APMPPE) Category(ies): Retina / Vitreous Contributor: Alina Husain MD, Saloni Kapoor MD, Elliott H. Sohn MD, Timothy M. Boyce MD Photographer: Madigan M. Peimann Posted: 08/11/2026 A 39-year-old woman with a history of multiple sclerosis on ofatumumab (CD20 inhibitor) presented with progressive vision loss, left greater than right, for one week. The patient reported a history of a self-limited upper respiratory infection five weeks prior. On exam, she had creamy placoid lesions in the posterior pole and periphery. The peripheral lesions appeared subacute due to pigmentary changes and atrophy. Workup included an anterior chamber tap that was negative for CMV, VZV, HSV-1 and HSV-2 by PCR testing. Additional laboratory testing was notable for negative syphilis total antibody, negative quantiferon-TB gold and a mildly elevated platelet count. MRI/MRA of the Brain WWO Contrast and MRI Orbit WWO contrast demonstrated no evidence of CNS vasculitis or evidence of new or active demyelination. She started on prednisone 60 mg daily after infectious testing returned negative.","u":"pages/APMPPE/index.htm","cr":"Angela McAllister, MD","src":"er"},{"t":"Multiple evanescent white dot syndrome (MEWDS)","im":[["E:pages/MEWDS/MEWDS-fundus-LRG.jpg","As seen in the photograph, the condition causes multiple, discrete, gray-white spots in the outer retina or retinal pigmented epithelium (RPE). There are pathognomonic granular changes within the fovea. Mild intraocular inflammation may be present."],["E:pages/MEWDS/MEWDS1.jpg","Fundus, right (normal)"],["E:pages/MEWDS/MEWDS2.jpg","Fundus, eft (abnormal)"]],"h":"As seen in the photograph, the condition causes multiple, discrete, gray-white spots in the outer retina or retinal pigmented epithelium (RPE). There are pathognomonic granular changes within the fovea. Mild intraocular inflammation may be present. Fundus, right (normal) Fundus, eft (abnormal)","u":"pages/MEWDS/index.htm","cr":"Jesse Vislisel, MD; Karen Gehrs, MD","src":"er"},{"t":"Punctate inner choroiditis (PIC)","im":[["E:pages/PIC/PIC-LRG.jpg",""]],"h":"Punctate inner choroiditis/choroidopathy (PIC) is an inflammatory disorder most common in otherwise healthy, young, white, myopic women. The condition results in small (100-200 µm) yellow-white chorioretinal lesions in the posterior pole, rarely extending to the midperiphery. The lesions progress to deep, punched-out chorioretinal scars, often with surrounding hyperpigmentation. In contrast to some similar conditions, there is no associated vitritis. Fluorescein angiography shows early hyperfluorescence and late staining of the lesions, as seen in these photographs. The disease course is self-limited and there is generally a good visual prognosis, though vision can be limited in the presence of choroidal neovascularization.","u":"pages/PIC/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Birdshot chorioretinopathy","im":[["E:photos/birdshotChorioretinopathy-colorOD.jpg",""],["E:photos/birdshotChorioretinopathy-colorOS.jpg",""],["E:pages/imgs/R_7CkruHXiWbETghX_Birdshot1.png",""]],"h":"47-year-old female referred for decreased vision left eye(OS)>right eye(OD) and uveitis, both eyes (OU) diagnosed 5 days prior by an outside provider. Anterior segment exam was notable for 2+ cell and flare OU and 2+ vitreous cells OU. Fundus exam demonstrated multiple deep round yellow-white lesions. Fluorescein angiography was notable for diffuse disc leakage OU. A diagnosis of birdshot choroiditis was made and the patient was treated with oral prednisone with resolution of symptoms. Blood testing was positive for HLA A29. Right eye Left eye Right eye Left eye Birdshot ChorioretinopathyBirdshot ChorioretinopathyCategory(ies): Retina / Vitreous,UveitisContributor: Mahsaw Mansoor, MDPhotographer: Antoinette Venckus, CRAPosted: 06/04/2024A 43-year-old woman presented with progressive photophobia, new floaters, and nyctalopia in both eyes. On posterior segment examination at presentation she had optic nerve swelling, perivenular sheathing, an multiple yellow deep choroidal lesions extending radially. She also showed severe diffuse late leakage on fluorescein angiography. The clinical exam and retinal imaging are consistent with the diagnosis of birdshot chorioretinopathy. Subsequent testing for HLA-A29 was positive.","u":"pages/Birdshot-chorioretinopathy.htm","cr":"Jeffrey D. Welder, MD","src":"er"},{"t":"Serpiginous choroidopathy","im":[["E:pages/Serpiginous-choroidopathy/serpiginous-OD-LRG.jpg",""],["E:pages/Serpiginous-choroidopathy/serpiginous-OS-LRG.jpg",""],["E:pages/Serpiginous-choroidopathy/serpiginous-OD-plus-10-yrs-LRG.jpg",""]],"h":"Serpiginous choroidopathy is a chronic, recurrent, typically bilateral inflammatory disease of the chorioretinal pigmented epithelium. It is characterized by atrophic scars with active, yellow-gray borders, often extending in a serpent-like pattern from the optic disc. These photographs show the progression of the disease over a 10-year time period (the most recent photographs are located on the bottom). To read more about this serpiginous choroidopathy and this patient, see the full case report","u":"pages/Serpiginous-choroidopathy/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Serpiginous choroidopathy","im":[["E:LARGE/serpiginous-CR-LARGE.jpg",""]],"h":"Randy Verdick, FOPSt Serpiginous choroidopathy is a chronic, recurrent, typically bilateral inflammatory disease of the chorioretinal pigmented epithelium. It is characterized by atrophic scars with active, yellow-gray borders, often extending in a serpent-like pattern from the optic disc.","u":"pages/Serpiginous-choroidopathy.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Sarcoidosis with choroidal infiltrates","im":[["E:pages/Sarcoidosis-w-choroidal-infiltrates/sarcoidosis-choroidopathy-LRG.jpg",""],["E:pages/Sarcoidosis-w-choroidal-infiltrates/Sarcoidosis-Macula-LRG.jpg",""]],"h":"76-year-old female with biopsy proven systemic sarcoidosis presented for routine eye exam and the numerous flat yellowish lesion were noted in the fundus of the left eye more so than the right. She was started on methotrexate which controlled her infiltrates. The methotrexate was stopped and she developed photopsias and the lesions appeared more active. Thus the methotrexate was restarted with resolution of symptoms and control of lesion growth was obtained after several months. The three slightly brighter more superfical lesion in the inferior nasal periphery where felt to be inactive presumed ocular histoplasmosis scars. Choroidal granulomas manifesting as the sole lesion in ocular sarcoidosis has been previously described [1]. The differential includes lymphoma infiltrate or syphilitic lesions but review of systems, previous diagnosis of sarcoidosis, and the improvement on immunosuppresion make these extremely unlikely.","u":"pages/Sarcoidosis-w-choroidal-infiltrates/index.htm","cr":"David Phillips, MD","src":"er"},{"t":"Sarcoid Uveitis","im":[["E:photos/sarcoid-uveitis.jpg","35-year-old African American woman with newly-diagnosed sarcoid uveitis. Note the mutton-fat keratic precipitates, large Busacca nodule, and central posterior synechiae."]],"h":"35-year-old African American woman with newly-diagnosed sarcoid uveitis. Note the mutton-fat keratic precipitates, large Busacca nodule, and central posterior synechiae.","u":"pages/sarcoid-uveitis.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"The Sympathizing Eye: Panuveitis Secondary to Sympathetic Ophthalmia","im":[["E:photos/sympathizing-eye/pseudocolor-fundus-os-LRG.jpg","Slitlamp photography, left eye. There was 1+ cell and 1+ flare in the anterior chamber with trace nuclear sclerosis (left image). The vitreous exam was remarkable for significant anterior vitritis (right images)."]],"h":"This is a 46-year-old monocular man who presented with floaters, peripheral vision loss, and decreased central acuity in his left eye. Nine months prior to presentation, the right eye had suffered a penetrating globe injury with retinal detachment and was enucleated within four weeks of the injury. His slit lamp exam demonstrated anterior and posterior chamber cell (Figure 1). Dilated fundus exam revealed vitreous strands, grade III disc edema, and multiple, discrete, peripheral hypopigmented lesions consistent with Dalen-Fuchs nodules (i.e., lymphocytes and epithelioid histiocytes present between the RPE and Bruch membrane) (Figure 2). Fluorescein angiography demonstrated staining of the multiple peripheral lesions and leakage from the optic nerve and vessels in the posterior pole (Figure 3). Despite initial treatment with mycophenolate mofetil (CellCept) for several months, the patient experienced worsening peripheral vision and persistent vitreous inflammation. He underwent surgical placement of a ﬂuocinolone acetonide intravitreal implant (Retisert) for local, long-term inflammation control. Sympathetic ophthalmia (SO) is a rare, granulomatous panuveitis that usually occurs within one year of penetrating trauma to the fellow eye, likely as a result of uveoretinal antigens entering the conjunctival lymphatics [1, 2]. In addition to trauma, pars plana vitrectomy and other intraocular procedures are associated with increased SO risk [2]. Other characteristic findings of SO that were not present in this case include serous retinal detachments and mutton-fat keratic precipitates. Please refer to the Eye Rounds case on sympathetic ophthalmia for further information regarding work-up, differential diagnosis, pathophysiology, and management.","u":"pages/sympathizing-eye.htm","cr":"Brittni A. Scruggs, MD, PhD and Ian C. Han, MD","src":"er"},{"t":"Ocular Toxoplasmosis","im":[["E:LARGE/Ocular-toxoplasmosis-1-LRG.jpg","Dilated fundus examination of the right eye showed a well-circumscribed small old peripheral pigmented scar just beyond the inferotemporal arcades, with a patchy area of active chorioretinitis inferiorly. There was no hemorrhage or vitritis."],["E:LARGE/Ocular-toxoplasmosis-2-LRG.jpg","-b: Higher magnification inferotemporally showed an old pigmented scar with an adjacent area of active chorioretinitis. The yellow arrows point to faint Kyrieleis' vascular plaques."],["E:LARGE/Ocular-toxoplasmosis-3-LRG.jpg","-b: Higher magnification inferotemporally showed an old pigmented scar with an adjacent area of active chorioretinitis. The yellow arrows point to faint Kyrieleis' vascular plaques."]],"h":"A 20-year-old male was referred by an optometrist because of a pigmented scar in the right eye. The patient complained of black spots in his vision for the past week. He had no pain or irritation. He was born in Peru, but came to the United States at the age of 14 and lived in Tennessee on a farm and had been exposed to many cats in the past. He had no other complaints or medical problems. Vision with correction: OD 20/25-1; OS 20/20 Intraocular pressure: normal OU Slit lamp examination OU: unremarkable; no AC cells; no posterior synechiae; clear lens Ocular Toxoplasmosis Toxoplasmic retinochoroiditis lesions have similar fundus characteristics, whether they result from congenital or acquired infections. Acute and new lesions are usually intensely white, focal lesions with overlying vitreous inflammatory haze. Active lesions with a severe vitreous inflammatory reaction will have the classic \"headlight in the fog\" appearance.[2] Patients with active toxoplasmic retinochoroiditis may develop retinal vasculitis with vascular sheathing and hemorrhages in response to reactions between circulating antibodies and local Toxoplasma gondii antigens.[3] Typically, hyperpigmented scars of old and inactive lesions are present with recurrent \"satellite lesions\" at the border of healed scar. As a lesion heals, its borders become more defined and hyperpigmented. Large scars will have an atrophic center devoid of all retinal and choroidal elements. The underlying sclera gives the lesion its white center.[4] \"Kyrieleis plaques\" describe nodular peri-arteritis or a beaded pattern of vascular inflammation. These plaques are predominately associated with toxoplasmosis infections but were originally reported in association with ocular tuberculosis in 1933.[5] It may be less commonly seen with syphilis, tuberculosis, cytomegalovirus, herpes zoster, and others. Reference: Rothova A. Ocular manifestations of toxoplasmosis (Review). Curr Opin Ophthalmol 2003;14(6):384-388. Smith JR, Cunningham Jr ET. Atypical presentations of ocular toxoplasmosis (Review). Curr Opin Ophthalmol 2002;13:387-392. Hovakimyan A, Cunningham Jr ET: Ocular toxoplasmosis (Review). Ophthalmol Clin North Am 2002;15(3):327-332. Kyrieleis W. Uber atypische gerfaesstuberkulose der netzhaut (periarteritis \"nodosa\" tuberculosa). Arch Augenheilkd 1933;107:182-90. Holland GN, Crespi CM, ten Dam-van Loon N, et al. Analysis of recurrence patterns associated with toxoplasmic retinochoroiditis. Am J Ophthalmol 2008;145(6):1007-1013.","u":"pages/ocular-toxoplasmosis.htm","cr":"Eric Chin, MD and Christi Carter, MD","src":"er"},{"t":"Ocular toxoplasmosis (2)","im":[["E:photos/toxoplasmosis/toxoplasma-1-LRG.jpg","Active lesions have a classic \"headlight in fog\" appearance with a focal, white, fluffy lesion adjacent to an old scar visible through the associated granulomatous uveitis and vitritis as seen in Figure 1"],["E:photos/toxoplasmosis/toxoplasma-scars-2-LRG.jpg","Inactive lesions appear as a chorioretinal scar in the posterior pole, often within the macula as seen in Figure 2."],["E:photos/toxoplasmosis/ocular-toxoplasmosis-new-LRG.jpg","Congenital toxoplasmosis with macular chorioretinal scar seen in a 69-year-old woman who presented with severe primary open angle glaucoma of both eyes. Vision had been limited to CF @2 ft in the affected eye since birth."]],"h":"Toxoplasmosis is the most common cause of posterior uveitis. Active lesions have a classic \"headlight in fog\" appearance with a focal, white, fluffy lesion adjacent to an old scar visible through the associated granulomatous uveitis and vitritis as seen in Figure 1. Inactive lesions appear as a chorioretinal scar in the posterior pole, often within the macula as seen in Figure 2. Contributor: Lauren E. Hock, MD Photographer: Meghan Menzel","u":"pages/ocular-toxoplasmosis-2.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Ocular toxocariasis","im":[["E:pages/toxocara/toxocara-LRG.jpg","Classic localized granuloma located over the optic nerve"]],"h":"Ocular toxocariasis is caused by infection with the second-stage larvae of the roundworms Toxocara canis or Toxocara cati. The infection can have three primary presentations: 1) chronic endophthalmitis, 2) localized granuloma, and 3) peripheral granuloma. These photographs show a classic localized granuloma located over the optic nerve. Also shown are the appearance of the granuloma on B-scan echography and optical coherence tomography (OCT).","u":"pages/toxocara/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Cytomegalovirus (CMV) Retinitis","im":[["W:photos/CMV-Retinitis/CMV-1-LRG.jpg","Right eye – multiple cotton wool spots adjacent to the nerve and throughout the macula, consistent with HIV retinopathy"],["W:photos/CMV-Retinitis/CMV-2-LRG.jpg","Left eye - broad retinal whitening and intraretinal hemorrhages along the superior arcades, with cotton wool spots adjacent to the nerve consistent with CMV retinitis and HIV retinopathy"],["W:photos/CMV-Retinitis/CMV-3-LRG.jpg","Right Eye: resolution of cotton wool spotsVision sc: 20/50"]],"h":"(images 3 & 4) 41-year-old male with HIV, presented with blurry vision in the left eye. His CD4 count at presentation was 2 cells/mm3 (normal 500-1,000 Visual acuity OD sc: 20/40, PH to 20/30 OS sc: 20/100, PH to 20/50 OP: 15 and 14 SLE: OD normal; OS: AC quiet; 2+ vitreous cell June The patient was treated with intravitreal foscarnet in the left eye, and five days of intravenous ganciclovir while as an inpatient for other systemic manifestations. He was discharged on oral valganciclovir (induction dose 900 mg BID for two weeks) then 900 mg daily maintenance until CD4 count was above 50. At future follow-up in October 2011, the patient had resolution of his CMV retinitis and HIV retinopathy but with persistently low CD4 count of 1. It was thought that valganciclovir contributed to his low CD4 count, and was therefore discontinued. October Summary: CMV Retinitis CMV retinitis is the most common opportunistic ocular infection and the leading cause of visual loss in AIDs patients. It represents about 90% of all infectious retinitis in this patient population. CMV retinitis usually results from reactivation of a latent CMV infection. Individuals with a CD4 lymphocyte count below 50, a plasma HIV-1 RNA level greater than 100,000, or who have been previously diagnosed with opportunistic infections are at particular risk. Patients may be asymptomatic, or have floaters, photopsias, and/or scotomas. Systemic treatment options include intravenous ganciclovir, foscarnet, or cidofovir. Oral ganciclovir or valganciclovir may also be used. Localized ocular treatment may include intravitreal ganciclovir, foscarnet, or cidofovir.","u":"pages/CMV-Retinitis/index.htm","cr":"Eric Chin, MD","src":"er"},{"t":"Acute Retinal Necrosis","im":[["E:pages/imgs/R_3e5dpU77mkhr8x6_ARN.png",""]],"h":"A 65-year-old man presented with new onset cobwebs, floaters, and decreased vision in the right eye. He had underlying diabetes mellitus with known non-proliferative diabetic retinopathy but was otherwise immunocompetent. On dilated fundus examination there was moderate vitritis with sheet like patches of homogeneous peripheral whitening anterior to the equator, consistent with acute retinal necrosis (ARN). There is no visible vitreous traction or retinal tear or detachment. There is also vascular sheathing predominantly of the arterioles, which favors an underlying etiology of varicella zoster virus as the cause of ARN.","u":"pages/Acute_Retinal_Necrosis.html","cr":"Mahsaw Mansoor, MD","src":"er"},{"t":"Syphillitic punctate inner retinitis","im":[["E:photos/syphillitic/syphillitic-punctate-inner-retinitis.jpg",""],["E:photos/syphillitic/syphillitic-palmar-rash.jpg",""],["E:photos/syphillitic/sypillitic-sole-of-foot-rash.jpg",""]],"h":"Photos include patient's palm and soles of feet which had classic syphillis rash.","u":"pages/Syphillitic-punctate-inner-retinitis.htm","cr":"Jordan Rixen, MD","src":"er"},{"t":"Endophthalmitis","im":[["E:photos-earlier/post-trab.jpg","post-trabeculectomy"]],"h":"post-trabeculectomy","u":"pages/endophthalmitis.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Diffuse Unilateral Subacute Neuroretinitis (DUSN) - Nematode","im":[["E:photos/DUSN/DUSN-macular.jpg","Nematode in the macula and macular inflammation"],["E:photos/DUSN/DUSN-macular-outtake.jpg","Nematode in the macula and macular inflammation"],["E:photos/DUSN/DUSN-macular-outtake.jpg","Nematode in the periphery before laser"]],"h":"This 45-year-old male presented with blurry vision in his left eye and was referred to the University of Iowa for unilateral uveitis. A subretinal nematode was identified on exam next to a crop of yellow-white macular lesions. He was diagnosed with diffuse unilateral subacute neuroretinitis (DUSN), likely secondary to raccoon roundworm (Baylisascaris procyonis) as the patient was an avid outdoorsman and hunter. The nematode was killed by laser and the patient completed albendazole 400mg/day for 30 days. Included are photos demonstrating the nematode in two different locations and after laser treatment.","u":"pages/Diffuse-Unilateral-Subacute-Neuroretinitis.htm","cr":"David Phillips, MD","src":"er"},{"t":"Choroidal effusion in posterior scleritis","im":[["E:pages/choroidal-effusion/choroidals-1-LG.jpg",""],["E:pages/choroidal-effusion/choroidals-2-LG.jpg",""],["E:pages/imgs/R_7GXsMwlC67wWnCx_Serous%20choroidal.png",""]],"h":"Choroidal effusions, also known as serous choroidal detachments, represent an accumulation of fluid in the suprachoroidal space. This image shows the presence of choroidal effusions in the setting of posterior scleritis. Also pictured are the appearance of the choroidal effusions on B-scan ultrasonography and an MRI that was obtained for other reasons. Serous choroidals related to hypotonySerous choroidals related to hypotonyCategory(ies): Glaucoma / IrisContributor: Mahsaw Mansoor, MDPhotographer: Nicole RadunzelPosted: 06/04/2024A 73-year-old woman presented with decreased vision in the right eye. The decreased vision was found to be related to serous choroidal detachments in the setting of hypotony related to opening of a Baerveldt seton tube shunt.","u":"pages/choroidal-effusion/index.htm","cr":"Jesse Vislisel, MD","src":"er"}]},{"n":"Inherited & developmental","b":"Macular dystrophies, rod-cone dystrophies and syndromic retinopathies.","items":[{"t":"Stargardt disease","im":[["E:photos/bullseye_01222005.jpg","1) Bullseye maculopathy."],["E:photos/flecks_01222005.jpg","2) Pisciform flecks in the retina."]],"h":"20-year-old male with molecularly confirmed Stargardt disease (ABCA4 mutation). Note the diffuse yellow pisciform flecks within the arcades and central macular mottling in both eyes. OMIM #248200, #600110, #603786 Stargardt's Disease (macular dystrophy) Stargardt's Disease (macular dystrophy) Contributor: Andrew Doan, MD, PhD Ed Stone, MD, PhD teaches the following: A photoreceptor cell-specific ATP-binding transporter gene (ABCR) is mutated in recessive Stargardt macular dystrophy. Most common mutation is Gly1961Glu Clinical features: • bullseye maculopathy • vermillion (orange) fundus and masked choroid • pisciform flecks (due to lipofuscin A2E deposits) → If flecks are seen, then patients will usually decline to 20/200 vision within 1 year • patients with no flecks do much better, but may develop flecks later-- less than 20/200 vision in 5 yrs after becoming 20/40. If patients are 20/40, then they'll be 20/200 in 5 years on average. Patients have exuberant response to incidental ocular trauma- keloid scars in macular. Avoid contact sports. FFA demonstrates masked choroid. Heidelberg autofluoresence is present. OMIM #248200, #600110, #603786","u":"pages/Stargardt-disease-13.htm","cr":"Jeffrey D. Welder, MD","src":"er"},{"t":"Best Vitelliform Macular Dystrophy","im":[["E:photos/best/best_01222005.jpg",""]],"h":"Note the egg-yolk appearance & pseudohypopyon. Vision 20/30 OD and OS.","u":"pages/Best-Vitelliform-Macular-Dystrophy.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Autosomal Recessive Best Disease","im":[["E:photos/best/Best-AR-od.jpg",""],["E:photos/best/Best-AR-os.jpg",""]],"h":"These are photographs from a 6-year-old boy with no known past medical history who presented for decreased visual acuity in both eyes (OU) that was first noticed when he failed his preschool vision screening at age four. His visual acuity with correction was 20/200+2 OD and 20/80+1 OS, without pinhole improvement. Confrontational visual fields, intraocular pressure, extraocular movements, and slit lamp exam were all unremarkable. On dilated fundus exam,there was a large (slightly less than 1 disc diameter) white elevated fibrotic scar in the fovea with overlying pigmentation and surrounding edema OU. The near periphery demonstrated the extrafoveal yellow-colored vitelliform lesions that are characteristic of autosomal recessive Best disease. These likely represent lipofuscin accumulation. Optical coherence tomography showed a large fibrovascular pigment epithelial detachment in each fovea (due to chronic inactive choroidal neovascular membranes OU), associated with parafoveal subretinal fluid, and overlying cystic retinal edema OU. There was loss of the inner segment/outer segment junction in this same area centrally OU. Autosomal recessive Best disease is usually caused by two \"mild\" mutations in the BEST1 gene. OMIM #153700 Right eye Left eye Right eye Left eye","u":"pages/Best-disease-autosomal-recessive.htm","cr":"Pamela C. Carter, MD","src":"er"},{"t":"Pattern dystrophy","im":[["E:photos/Pattern-dystrophy/Pattern-dystrophy-OD-montage-LRG.jpg",""],["E:photos/Pattern-dystrophy/Pattern-dystrophy-OS-montage-LRG.jpg",""],["E:photos/pattern-dystrophy-2/Pattern-dystrophy-2-color-OD-LRG.jpg",""]],"h":"Montage color fundus photographs are from a 63-year-old patient with molecularly-confirmed pattern dystrophy, which is an autosomal dominant, inherited retinal degeneration due to a mutation in the RDS/peripherin gene located on chromosome 6. Pattern dystrophy presents with a varying appearance of lipofuscin deposition and retinal atrophy with retinal pigment epithelial changes in the central macula, as demonstrated above. The disease demonstrates variable expressivity, and macular findings range from subtle to striking. Patients should be monitored with dilated fundus examination, as they are at risk for developing a choroidal neovascular membrane. Contributor: Aaron M. Ricca, MD Images are from a 42-year-old female with molecularly-proven pattern dystrophy. A mutation in the RDS/peripherin gene causes pigmentary changes at the level of the retinal pigment epithelium in various fundus \"patterns.\" These different phenotypes are often grouped into the following types of dystrophies: butterfly-shaped, adult-onset vitelliform, peculiar foveomacular, reticular, and fundus pulverulentus. The above patient is an example of adult-onset vitelliform dystrophy. The fundus photos show the small foveal vitelliform lesion, and the optical coherence tomograms demonstrate the subretinal hyper-reflective material, without concern for a neovascular membrane. Contributor: Andrew Doan, MD, PhD This is a 40-year-old patient with a diagnosis of pattern dystrophy. The patient has good vision (20/25 in both eyes) and symmetric foveal retinal pigmented epithelium (RPE) hyperpigmentation in a butterfly pattern in both eyes. Reference: Ryan SJ. Retina. 5th ed. London: Saunders/Elsevier; 2013.","u":"pages/pattern-dystrophy.html","cr":"Aaron M. Ricca, MD","src":"er"},{"t":"North Carolina macular dystrophy","im":[["E:LARGE/NCMD-a-OD-L.jpg","Right Eye"],["E:LARGE/NCMD-a-OS-L.jpg","Right Eye"],["E:LARGE/NCMD-b-OD-L.jpg","Right Eye"]],"h":"North carolina macular dystrophy is an autosomal dominant condition resulting in congenital, stationary macular abnormalities. These photographs show the varying expressivity of the disease in two family members. Mild disease can present with central macular yellow-white drusen-like lesions at the level of the retinal pigmented epithelium. More severely affected individuals can exhibit severe macular dystrophy, often surrounded by a characteristic white, atrophic ring (visible sclera).","u":"pages/north-carolina-macular-dystrophy.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Sorsby macular dystrophy","im":[["E:LARGE/Sorsby-OD-L.jpg","Right Eye"],["E:LARGE/Sorsby-OS-L.jpg","Left Eye"]],"h":"Sorsby macular dystrophy is an autosomal dominant condition caused by a mutation in the TIMP3 gene. Patients with this condition typically maintain normal acuity until their 40's when they develop severe, bilateral choroidal neovascular membranes. The macular lesions later have a \"pseudo-inflammatory\" appearance with geographic atrophy and dense clumps of black pigmentation, as seen in these photographs.","u":"pages/sorsby.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Sectoral retinitis pigmentosa","im":[["E:pages/sectoral-RP/sectoral-RP-OS-lrg.jpg","OS - These photos depict segmental RP in a patient with autosomal dominant RP secondary to a rhodopsin defect. Note the prominent areas of c"],["E:pages/sectoral-RP/sectoral-RP-OD-lrg.jpg","OD - These photos depict segmental RP in a patient with autosomal dominant RP secondary to a rhodopsin defect. Note the prominent areas of c"]],"h":"Sectoral retinitis pigmentosa (RP) is a variant of RP in which there is a regional distribution of the retinal degeneration. It can be differentiated from acquired pigmentation (due to trauma, inflammation, or vascular insult) by its symmetry between the eyes. These photos depict segmental RP in a patient with autosomal dominant RP secondary to a rhodopsin defect. Note the prominent areas of chorioretinal atrophy with bone-spicule-like pigmentation along the inferotemporal arcade. The Goldmann visual fields show superior scotomata that correspond to this area of degeneration. The OCT shows marked outer retinal and retinal pigmented epithelial (RPE) thinning in the affected area.","u":"pages/sectoral-RP/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Retinitis pigmentosa sine pigmento","im":[["E:photos/Retinitis-pigmentosa-sine-pigmento/M/Retinitis-pigmentosa-sine-pigmento-OD.jpg",""],["E:photos/Retinitis-pigmentosa-sine-pigmento/L/Retinitis-pigmentosa-sine-pigmento-OS.jpg",""]],"h":"Retinitis pigmentosa sine pigmento is a variant of retinitis pigmentosa in which there is an absence of the characteristic peripheral bone-spicule-like pigmentary changes. Other features of the condition are still seen in this photograph including arteriolar attenuation and atrophy of the retinal pigmented epithelium. The OCT shows a perifoveal loss of the photoreceptors and retinal pigmented epithelium. Ring scotomata are visible on the Goldmann visual fields.","u":"pages/retinitis-pigmentosa-sine-pigmento.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Usher syndrome","im":[["E:LARGE/Usher-OD-LRG.jpg","right eye"],["E:LARGE/Usher-OS-LRG.jpg","left eye"]],"h":"Usher syndrome is an autosomal recessive condition that results in retinitis pigmentosa with associated congenital hearing loss. There are three main types of Usher syndrome. Type 1 is associated with profound congenital sensorineural hearing loss and poor vestibular function, most commonly caused by mutation in the MYO7A gene. Type 2 results in mild congenital hearing loss with normal vestibular function and is most commonly caused by a mutation in the USH2A gene. Type 3 is rare and can have slowly progressive hearing loss. It is most commonly caused by a mutation in the USH3A gene. Similar to other types of retinitis pigmentosa, fundus features include peripheral retinal atrophy with bone-spicule-like pigmentation, vascular attenuation, and waxy-pallor of the optic disc.","u":"pages/usher.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Bardet-Biedl Syndrome","im":[["E:photos/Bardet-Biedl-OD.jpg",""],["E:photos/Bardet-Biedl-OS.jpg",""]],"h":"Bardet-Biedl syndrome is an autosomal recessive condition most commonly due to a mutation in the BBS1 gene. It results in pigmentary retinopathy (usually pigment mottling without bone-spicule-like pigmentation) with macular atrophy and vascular attenuation as seen in these photos. The syndrome can be associated with systemic findings including ulnar polydactyly, obesity, mild developmental delay, and hypogonadism. Right eye Left eye","u":"pages/bardet-biedl.htm","cr":"Jesse M. Vislisel, MD","src":"er"},{"t":"Batten Disease","im":[["E:photos/Batten-Disease-1-LARGE.jpg",""],["E:photos/Batten-Disease-2-LARGE.jpg",""],["E:pages/imgs/R_3WtVXxh8ctEPeyg_Battons_bullseye_maculopathy_1.JPG","Visual acuity at presentation was 20/40. Initial fundus photo shows a parafoveal hyperpigmentation consistent with bullseye maculopathy. The disc is pink, and there is normal vascular caliber."]],"h":"7-year-old female with molecularly confirmed CLN3-associated Batten Disease. Fundus photos demonstrate mild optic nerve pallor, central macular mottling, attenuated arterioles and peripheral retinal granularity. There was 1+ vitreous cell present. Vision was 20/800 in the right eye and hand motion in the left. Batten disease is a fatal autosomal recessive neurodegenerative disease and is the most common neuronal ceroid lipofuscinosis. OMIM #204200 Right eye Left eye Bullseye maculopathy in Batten Disease Bullseye maculopathy in Batten Disease Category(ies): Inherited Eye Diseases, Retina / Vitreous Contributor: Ella J. Gehrke, MD; Arlene V. Drack, MD Photographer: Douglas B. Critser, CRA, OCT-C, FOPS Posted: 02/19/2025 Fundus photographs from the left eye (OS) of a 9-year-old female with molecularly confirmed CLN3-associated Batten disease.","u":"pages/batten-disease.htm","cr":"Jeffrey D. Welder, MD","src":"er"},{"t":"Choroideremia","im":[["E:photos/choroidal/choroideremia-OD.jpg",""],["E:photos/choroidal/choroideremia-OS.jpg",""]],"h":"18-year-old male with molecularly confirmed choroideremia. Genetic testing revealed the prescence of a hemizygous deletion of exons 1 and 2 of the CHM gene. Note that there is preservation of the choroid and retinal pigment epithelium (RPE) in the macula with pigment mottling centrally and peripheral loss of the choroid and RPE. This patient had 20/20 vision in both eyes with constricted visual fields. OMIM #303100\" Right eye Left eye","u":"pages/Choroideremia.htm","cr":"Jeffrey D. Welder, MD","src":"er"},{"t":"Gyrate atrophy","im":[["E:photos/gyrate-atrophy/gyrate-atrophy-OD.png","Right eye"],["E:photos/gyrate-atrophy/gyrate-atrophy-OS.png","Left eye"]],"h":"Gyrate atrophy is an autosomal recessive disease resulting from a deficiency of ornithine aminotransferase. By the second decade of life, patients exhibit scalloped areas of choroidal and retinal atrophy that begin peripherally and progresses toward the posterior pole. The diagnosis is supported by increased plasma and urine ornithine levels. OMIM #258870","u":"pages/gyrate-atrophy.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Leber Congenital Amaurosis, RPE65-associated","im":[["E:photos/LCA/LCA-OD-fig1.jpg",""],["E:photos/LCA/LCA-OS-fig2.jpg",""]],"h":"These images accompany a case report. OMIM #204100 and *180069","u":"pages/LCA.htm","cr":"Brian Privett, MD","src":"er"},{"t":"LCHADD: long chain 3-hydroxyacyl CoA dehydrogenase deficiency","im":[["E:photos/LCHADD.jpg","7-year-old female with long chain 3-hydroxyacyl CoA dehydrogenase deficiency (LCHADD), Vision 20/40"]],"h":"7-year-old female with long chain 3-hydroxyacyl CoA dehydrogenase deficiency (LCHADD), Vision 20/40","u":"pages/LCHADD.htm","cr":"C. Blake Perry, MD","src":"er"},{"t":"X-linked retinoschisis (XLRS)","im":[["E:LARGE/XLRS-OD-L.jpg",""],["E:LARGE/XLRS-OS-L.jpg",""]],"h":"X-linked retinoschisis (XLRS) is an X-linked recessive condition caused by a mutation in the RS1 gene. It results in splitting of the foveal and sometimes peripheral neurosensory retina. Clinically, this appears as cystic spaces and radial striae in the central macula, as seen in these photographs. The splitting is even more apparent on OCT. Over time, patients with XLRS develop decreased acuity with a central scotoma as seen in these Goldmann visual fields.","u":"pages/XLRS.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Kearns-Sayre syndrome","im":[["E:pages/imgs/R_1n6l01nUZ3oxNkL_EXT-9-GAZE.png","Severe limitation in all ductions bilaterally."],["E:pages/imgs/R_1n6l01nUZ3oxNkL_FP-OD.png","Right eye with normal optic nerve and salt-and-pepper retinopathy."],["E:pages/imgs/R_1n6l01nUZ3oxNkL_FP-OS.png","Left eye with normal optic nerve and salt-and-pepper retinopathy."]],"h":"25 year-old female presented with bilateral ptosis since age 18, severe ophthalmoplegia, and salt-and-pepper retinopathy. She also had short stature at 5'1.8\", fatigue, and weakness of her face, neck, and proximal extremities. She had undergone previous surgery for bilateral upper eyelid ptosis. She had poor levator function of both eyes. ERG showed global photoreceptor dysfunction. Biopsy was taken of her left deltoid muscle that showed scattered atrophic fibers that were COX-negative/SDH-positive and scattered ragged-red fibers. Special staining and electron microscopy showed mitochondrial aggregates, composed of numerous abnormal mitochondria with varying morphologies. Besides weakness and anxiety, she had no other neurological or psychiatric disorders. Workup was negative for hearing, endocrine, or cardiac disorders. A diagnosis of Kearns-Sayre syndrome was made based on her ocular findings with onset before age 20 and short stature. Genetic testing was negative for mitochondrial deletions.","u":"pages/Kearns-Sayre_syndrome.html#gsc.tab=0l","cr":"Lindsay Y Chun MD and Edward F Linton MD","src":"er"},{"t":"Pseudoxanthoma elasticum","im":[["E:LARGE/PXE-OD-LARGE.jpg","Right Eye"],["E:LARGE/PXE-OS-LARGE.jpg","Left Eye"]],"h":"Pseudoxanthoma elasicum (PXE, Gronblad-Strandberg syndrome) is due to a mutation in the ABCC6 gene and most commonly follows an autosomal recessive inheritance pattern. It is the most common cause of angioid streaks, or breaks in a thickened and calcified Bruch membrane, visible as dark red-brown bands radiating from the optic discs in these photos. Note the stippled, peau d'orange appearance of the fundi which is typical for this disorder.","u":"pages/PXE.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Aicardi syndrome","im":[["E:pages/Aicardi/Aicardi-1-LRG.jpg",""],["E:pages/Aicardi/Aicardi-2-LRG.jpg",""]],"h":"Aicardi syndrome is an X-l
