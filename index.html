ce/fungus-DSAEK-interface-slit-LRG.jpg",""]],"h":"","u":"pages/Candida-DSAEK-interface/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Graft-host interface candida infection after descemet stripping automated endothelial keratoplasty","im":[["E:photos/candida.png","This photo shows four small infiltrates present in the graft host interface of the right eye."]],"h":"This photo shows four small infiltrates present in the graft host interface of the right eye.","u":"pages/Candida.htm","cr":"Angela McAllister, MD","src":"er"},{"t":"Deep Anterior Lamellar Keratoplasty (DALK)","im":[["E:pages/DALK/5-LRG-POM1-sp-DALK-for-KCN.jpg","The post-operative appearance of a patient who underwent DALK for keratoconus."],["E:pages/DALK/6-LRG-POY3-sp-DALK-for-KCN.jpg","A clear DALK graft 3 years after the procedure with all sutures removed."],["E:pages/DALK/2---DALK-99074863-400px.jpg","A clear DALK graft 3 years after the procedure with all sutures removed."]],"h":"The post-operative appearance of a patient who underwent DALK for keratoconus.","u":"pages/DALK/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Tectonic mini-penetrating keratoplasty (PKP)","im":[["E:pages/tectonic-mini-PKP/mini-pkp-LRG.jpg",""],["E:pages/tectonic-mini-PKP/mini-pkp-slit-LRG.jpg",""]],"h":"","u":"pages/tectonic-mini-PKP/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Penetrating sclerokeratoplasty","im":[["E:pages/Sclerokeratoplasty/sclerokeratoplasty-acanth-slit-LRG.jpg",""],["E:pages/Sclerokeratoplasty/sclerokeratoplasty-acanth-zoom-LRG.jpg",""]],"h":"","u":"pages/Sclerokeratoplasty/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"RK (radial keratotomy)","im":[["E:photos-earlier/RK2_01312005.jpg",""]],"h":"","u":"pages/RK-radial-keratotomy.html","cr":"Jordan Graff, MD","src":"er"},{"t":"RK (radial keratotomy) with tear star","im":[["E:photos-earlier/RKtearStarIron2_20041.jpg",""],["E:photos-earlier/RKtearStarIron_20041.jpg",""]],"h":"The familiar radial incision lines of RK are visable. Additionally, in this case, a characteristic star-shaped iron deposit has formed centrally. This is called a \"tear star\" and occurs in some patients with RK. This tear star has no effect on vision.","u":"pages/RK-radial-keratotomy-with-tear-star.html","cr":"Jordan Graff, MD","src":"er"},{"t":"AK (astigmatic keratotomy)","im":[["E:photos/RKandAK1_VA2004h1027.jpg",""]],"h":"Radial corneal incisions have been made, as with standard RK. However, horizontal incisions were performed in this patient for astigmatic correction.","u":"pages/AK-astigmatic-keratotomy.html","cr":"Jordan M. Graff, MD","src":"er"},{"t":"Hexagonal Keratotomy","im":[["E:photos/hexagonal-keratotomy.jpg","This patient had also previously had radial and astigmatic keratotomy surgery in this eye with resultant corneal scars outside of the hexago"]],"h":"Hexagonal keratotomy is a historic refractive surgical technique in which six linear incisions are made into the stroma of the peripheral cornea in a hexagonal pattern that encircles the central cornea in an attempt to correct hyperopia.","u":"pages/Hexagonal-keratotomy.htm","cr":"Christopher Kirkpatrick, MD and Anna Kitzmann, MD","src":"er"},{"t":"Conductive keratoplasty (CK) scars","im":[["E:pages/conductive-keratoplasty/Conductive-keratoplasty-scars-LRG.jpg",""],["E:pages/conductive-keratoplasty/Conductive-keratoplasty-scars-slit-LRG.jpg",""]],"h":"","u":"pages/conductive-keratoplasty/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Conductive Keratoplasty","im":[["E:pages/imgs/R_7dhuIxpQtR0wgPL_CK1.jpg",""],["E:pages/imgs/R_7dhuIxpQtR0wgPL_CK2.jpg",""]],"h":"","u":"pages/Conductive_Keratoplasty.html","cr":"Mahsaw Mansoor, MD","src":"er"},{"t":"Epikeratophakia","im":[["E:pages/Epikeratophakia/epikeratophakia-OD-LRG.jpg","OD - eye still has an epikeratophakia graft"],["E:pages/Epikeratophakia/epikeratophakia-OS-removed-LRG.jpg","OS - eye graft was later removed and an anterior chamber intraocular lens was placed"],["E:pages/Epikeratophakia/epikeratophakia-OD-slit-LRG.jpg","Slit Lamp - eye still has an epikeratophakia graft"]],"h":"OD - eye still has an epikeratophakia graft","u":"pages/Epikeratophakia/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Grene Lasso after ALK","im":[["E:photos/Grene-lasso.jpg","This is a 53-year-old man who underwent automated lamellar keratectomy (ALK) in 1995 for myopia"]],"h":"ALK was in vogue in the pre-LASIK era (late 1980s) and consisted of a microkeratome free cap cut followed by a second lamellar excision (depth determined by a nomogram) of anterior stroma with the microkeratome to flatten the cornea after which the original cap was replaced. The procedure was notoriously unpredictable and in this case the patient had an over-correction which left him hyperopic. Dr. R. Bruce Grene des","u":"pages/Grene-Lasso-after-ALK.htm","cr":"Matthew Ward, MD","src":"er"},{"t":"Epithelial ingrowth after LASIK","im":[["E:pages/epithelial-ingrowth/Fig-1-epi-ingrowth-LRG.jpg","Nests of epithelium can be seen approaching the visual axis"],["E:pages/epithelial-ingrowth/epith-ingrowth-LASIK-LRG.jpg","Brice Critser, CRA Epithelial ingrowth after LA"],["E:pages/epithelial-ingrowth/epith-ingrowth-LASIK-OS-slit-LRG.jpg","Jesse Vislisel, MDPhotographer: Brice Critser, CRA"]],"h":"Epithelial ingrowth occurs when the corneal epithelial cells grow within the lamellar interface beneath the LASIK flap. This may result in an inflammatory response, corneal edema, irregular astigmatism, or melting of the LASIK flap. When mild and peripheral, it may be observed. When progressive or severe, the LASIK flap must be lifted and the epithelium scraped from","u":"pages/epithelial-ingrowth/index.htm","cr":"Jesse Vislisel, MD and Matt Ward, MD","src":"er"},{"t":"Post-PRK Haze","im":[["E:photos/Post-PRK-haze.jpg",""]],"h":"","u":"pages/post-PRK-haze-classic.htm","cr":"Jeffrey Welder, MD","src":"er"},{"t":"Intrastromal corneal ring segments","im":[["W:photos/intrastromal/intrastromal-corneal-rings.jpg",""],["W:photos/intrastromal/intrastromal-corneal-rings-2.jpg",""]],"h":"Toni Venckus These crescentic/semi-circular shaped ring segments are implanted into the midperipheral corneal stroma for the purpose of refractive error correction or management of keratoconus. In the era of improved laser refractive surgery techniques, these implants are no longer commonly used for refractive correction, but indications include correction of mild to moderate myopia by","u":"pages/intacs.htm","cr":"Christopher Kirkpatrick, MD, Anna Kitzmann, MD","src":"er"},{"t":"Orthokeratology","im":[["E:pages/orthokeratology/orthokeratology-top-LRG.jpg",""],["E:pages/orthokeratology/orthokeratology-bottom-LRG.jpg",""]],"h":"Orthokeratology is known variously as corneal molding, corneal reshaping therapy, vision shaping therapy and other monikers. In orthokeratology, typically a myopic eye is fitted with an rigid gas permeable lens that is very flat centrally, but has a reverse curve (steeper than the base curve) in the mid periphery. The lens then flattens and rearranges the corneal epithelium such that the shape of the anterior co","u":"pages/orthokeratology/index.htm","cr":"Tressa Larson OD","src":"er"},{"t":"AlphaCor keratoprosthesis","im":[["E:pages/Alphacor/AlphaCor-RPM-LRG.jpg","Photo credit: Tracy Aly, CRA"],["E:pages/Alphacor/AlphaCor-postop-LRG.jpg","Photo credit: Stephanie Karakas, CRA"],["E:pages/Alphacor/AlphaCor-postop-slit-LRG.jpg","Photo credit: Stephanie Karakas, CRA"]],"h":"Photo credit: Tracy Aly, CRA","u":"pages/Alphacor/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Boston Keratoprosthesis (KPro) for congenital aniridia","im":[["https://webeye.ophth.uiowa.edu/eyeforum/cases-i/case211/L/3a-OS-TA-LRG.jpg",""],["https://webeye.ophth.uiowa.edu/eyeforum/cases-i/case211/L/3b-OD-LRG.jpg",""],["https://webeye.ophth.uiowa.edu/eyeforum/cases-i/case211/L/3c-OS-RR-LRG.jpg",""]],"h":"","u":"pages/KPro-for-aniridia/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Corneal melt around Boston type I keratoprosthesis","im":[["E:pages/kPro-melt/ASOCT-KPro-melt-1-LRG.jpg","Corneal melt with thinning of the tissue surrounding the device stem."],["E:pages/kPro-melt/ASOCT-KPro-melt-2-LRG.jpg","Corneal melt with tissue retraction away from the device stem (arrow)."]],"h":"Boston keratoprosthesis devices require regular monitoring to assess for the presence of complications such as infection and corneal melt. Anterior segment optical coherence tomography (OCT) is a useful study to assess for the presence of corneal thinning or melt. We regularly use OCT to monitor the status of the cornea around the device.","u":"pages/kPro-melt/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Boston Type 2 Keratoprosthesis (KPro)","im":[["E:pages/type-2-kpro/KPro2-LRG.jpg",""]],"h":"","u":"pages/type-2-kpro/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Candida infection of a Boston Type I Keratoprosthesis (KPro)","im":[["E:pages/Candida-kPro/candida-KPro-before-BC-LRG.jpg","Boston Type I Keratoprosthesis"],["E:pages/Candida-kPro/candidaKPro-SK-LRG.jpg","KPro with infected implant"],["E:pages/Candida-kPro/candida-KPro-slit-SK-LRG.jpg","Slitlamp view of Fig 2a"]],"h":"Boston Type I Keratoprosthesis","u":"pages/Candida-kPro/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Anterior chamber intraocular lens (ACIOL) implant","im":[["E:pages/ACIOL/ACIOL-315-LRG.jpg","OS: AC IOL placed with iris bombe with no patent peripheral iridotomy"],["E:pages/ACIOL/ACIOL-369-LRG.jpg","OD: Bombe resolved after placement of post op Laser peripheral iridotomy (LPI) at 9 oclock. LPI was placed near haptic where iris was poster"]],"h":"This set of pictures shows what happens when an AC IOL is placed without a patent iridotomy.","u":"pages/ACIOL/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Artisan(claw) intraocular lens","im":[["E:photos/claw_artisan_lens.jpg",""]],"h":"This intraocular lens (seen here in the anterior chamber) is a versatile lens that can be implanted in the anterior chamber or the posterior chamber. Originating in Holland, as the Worst lobster claw lens (invented by Dr Jan Worst), and commonly used in India for about 30 yearsyrs, it has now been rediscovered as a refractive intraocular lens (the Verisyse lens) and renamed for regular use as the artisan lens","u":"pages/artisanclaw-intraocular-lens.html","cr":"Dr. Swaranjit Singh Bhatti, Bhatti Eye Clinic","src":"er"},{"t":"Verisyse phakic intraocular lens implant for high myopia","im":[["https://webeye.ophth.uiowa.edu/eyeforum/cases-i/case210/PIOL-Fig-2a-LRG.jpg","Slit lamp photograph of the Verisyse lens 1 year after surgery."],["https://webeye.ophth.uiowa.edu/eyeforum/cases-i/case210/PIOL-Fig-2b-LRG.jpg","Slit lamp photograph of the Verisyse lens 1 year after surgery."]],"h":"The Verisyse lens is an iris-fixated anterior chamber lens that is marketed as the Artisan lens outside of the US. It is a phakic intraocular lens implant for the correction of myopia. It is available as an alternative to laser refractive surgery and may be an option for patients who are poor candidates for laser surgery. These images show the appearance of a Verisyse lens implant in a patient with a preoperative ref","u":"pages/Verisyse-phakic-IOL/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Visian Implantable Collamer Lens (ICL) implant","im":[["https://webeye.ophth.uiowa.edu/eyeforum/cases-i/case210/PIOL-Fig-3-LRG.JPG",""],["E:pages/Visian/Visian-LRG.JPG",""]],"h":"The Visian Implantable Collamer Lens (ICL) is a sulcus-supported phakic intraocular lens implant designed to be placed in the posterior chamber between the iris and natural crystalline lens. These photographs show the appearance of a Visian ICL used to correct myopia. The implanted lens can be seen in the slit beam (white arrow) just anterior to the natural cryst","u":"pages/Visian/index.htm","cr":"Jesse Vislisel, MD, Tressa Larson, MA, OD","src":"er"},{"t":"EVO+ Visian Implantable Collamer Lens (ICL) Implant","im":[["E:pages/imgs/OD_Slit_Lamp_photo.png","Slit lamp examination of the right eye 1 month post-op demonstrates the inserted ICL in a 26-year old patient."],["E:pages/imgs/OS_Slit_Lamp_photo_2.png","Slit lamp examination of the left eye 1 month post-op demonstrates the inserted ICL in a 26-year old patient. The central port can be more c"]],"h":"Implantable Collamer Lens (ICL) are a minimally invasive technique to correct myopia with or without astigmatism. Implantation of these devices is reversible and can be used in patients who do not qualify for corneal refractive procedures, such as LASIK or PRK. Traditional models require a peripheral iridotomy to permit aqueous humor flow and decrease risk of pupillary bl","u":"pages/EVO-Visian-Implantable-Collamer-Lens(ICL)-Implant.htm","cr":"Sabah Munir, MSPH; Lauren A. Tomlinson, MD","src":"er"},{"t":"Decentered posterior chamber intraocular lens","im":[["E:photos/decentered-IOL/decentered-IOL-LRG.jpg",""],["E:photos/decentered-IOL/decentered-IOL-rr-LRG.jpg",""],["E:photos/decentered-IOL.webp","Decentered intraocular lens"]],"h":"","u":"pages/decentered-IOL.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Subluxated posterior chamber intraocular lens implant","im":[["E:pages/imgs/R_71TU3497v7BdshU_Screenshot%202025-06-19%20at%203.02.40%20PM.png","Retroillumination on slit lamp examination showed inferonasal subluxation of PCIOL along with 2+ posterior capsular opacification"],["E:pages/imgs/R_71TU3497v7BdshU_Screenshot%202025-06-19%20at%203.11.38%20PM.png","Diffuse illumination on slit lamp examination showed inferonasal subluxation of PCIOL"]],"h":"A 70-year-old man presented to the clinic 2 years after right-sided cataract extraction with a posterior chamber intra-ocular lens (PCIOL) implant performed at an outside hospital. He reported blurriness as well as seeing a \"half-moon shadow\" in his right eye vision. Slit lamp examination of his right eye showed inferonasal s","u":"pages/Subluxated_posterior_chamber_intraocular_lens_implant.html","cr":"Noor-Us-Sabah Ahmad, MD","src":"er"},{"t":"Opacification of Hydrophilic Intraocular Lens","im":[["E:pages/imgs/IOL_opacification1.png",""],["E:pages/imgs/IOL_opacification2.png",""],["E:pages/imgs/IOL_opacification3.png",""]],"h":"","u":"pages/Opacification_of_Hydrophilic_Intraocular_Lens.html","cr":"Mahsaw Mansoor MD","src":"er"},{"t":"Calcific Deposits on an Intraocular Lens","im":[["E:pages/imgs/R_7lmEbXdFKOfPy5r_Boese_atlas_pics.jpeg","A 72-year-old woman presented with widely fluctuating visual acuity following an uncomplicated phacoemulsification combined with 360° gonios"]],"h":"A 72-year-old woman presented with widely fluctuating visual acuity following an uncomplicated phacoemulsification combined with 360° gonioscopy-assisted transluminal trabeculotomy (GATT). Post-operatively, her course was notable for a 2.5mm hyphema, which cleared within a week. On follow-up examination at three months, she had a persistent intracapsular hemorrhage with a super","u":"pages/Layered_intracapsular_hemorrhage_following_phacoemulsification_GATT.html#gsc.tab=0","cr":"Christian A. Mays, MD; Erin A. Boese, MD","src":"er"},{"t":"Aftercataract (Elschnig's pearls)","im":[["E:photos/hanging-elschnig-pearl/Hanging-Elschnig-Pearl.jpg","Hanging Elschnig Pearl"],["E:photos/elscnigspearls003.jpg",""]],"h":"Kaleigh Haus September 18, 2023 Our patient is a 47-year-old male with a history of myotonic muscular dystrophy and bilateral cataract extraction with implantation of intraocular lens. This was complicated by the development of bilateral dense posterior capsular opacities that were resistant to YAG capsulotomy (attempted twice in the right eye prior to this presentation). He presented with 2 days of “a line in my vis","u":"pages/Aftercataract-Elschnigs-pearls.html","cr":"C.Y. Lewis, MD","src":"er"},{"t":"Posterior capsular opacity (PCO) following cataract surgery","im":[["E:photos-earlier/PCO.jpg","1) Slit lamp showing PCIOL with a membrane forming behind lens."],["E:photos-earlier/PCO_retro.jpg","2) retroillumination clearly outlines the PCO. Vision dropped below 20/40 from 20/20 after cataract surgery. A surgical laser was used to cu"],["E:pages/imgs/PCO_Eyerounds_1.jpg","Slit lamp photo of left eye demonstrating superior posterior capsular opacification of the intraocular lens implant with broad-beam illumina"]],"h":"Allie Copple 71 y/o female with pseudophakia OU, dry eye syndrome OU, and history of posterior capsular opacification OD s/p Neodymium: yttrium aluminum garnet (Nd:YAG) la","u":"pages/posterior-capsular-opacity-PCO-following-cataract-surgery.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Anterior capsular phimosis","im":[["E:pages/Capsular-Phimosis/phimosis-LRG.jpg","Non-visually-significant anterior capsular phimosis after cataract surgery.Photographer: Stefani Karakas, CRA"],["E:pages/Capsular-Phimosis/phimosis-preop-BC.jpg","Visually-significant anterior capsular phimosis in a patient who previously underwent penetrating keratoplasty for type II granula"],["E:pages/Capsular-Phimosis/phimosis-immediate-postop-LRG.jpg","Postoperative appearance of the patient in Figure 2 immediately YAG laser anterior capsulotomy. Visual acuity improved from 20/40"]],"h":"Non-visually-significant anterior capsular phimosis after cataract surgery.Photographer: Stefani Karakas, CRA","u":"pages/Capsular-Phimosis/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Capsular folds secondary to posterior capsule opacification","im":[["E:photos/PCO-capsular-folds.jpg","Revised June 6, 2016, with thanks to Dr. Luis Alberto Real, Cirujano Oftalmólogo, Especializado en la Clínica Barraquer, Sub-especializado e"]],"h":"Revised June 6, 2016, with thanks to Dr. Luis Alberto Real, Cirujano Oftalmólogo, Especializado en la Clínica Barraquer, Sub-especializado en el IOBA, Valladolid, España","u":"pages/capsular-folds.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Late Capsular Block with Posterior Capsular Fibrosis","im":[["E:pages/imgs/R_3SwQ5vonCQtBgmo_capsule%20block.png",""]],"h":"","u":"pages/Late_Capsular_Block_with_Posterior_Capsular_Fibrosis.html","cr":"Mahsaw Mansoor, MD","src":"er"},{"t":"Layered intracapsular hemorrhage following phacoemulsification GATT","im":[["E:pages/imgs/R_1TFPVtU3gW1demt_Retroillumination_calcium_deposits.png","Retroillumation of calcium deposits on a 3-piece silicone intraocular lens."],["E:pages/imgs/R_1TFPVtU3gW1demt_Calcium_deposits.png","Broad beam illumination of calcium deposits on the posterior surface of a 3-piece silicone intraocular lens."]],"h":"A 74-year-old female with history of proliferative diabetic retinopathy in both eyes (OU), lamellar hole in the left eye (OS), POAG status post Ahmed tube in the right eye (OD), full thickness macular hole OD status post vitrectomy, and cataract extraction with implantation of AMO 9002, 3-piece silicone intraocular lenses OU 15 years ago was referred for a several month history of","u":"pages/Calcific_Deposits_on_an_Intraocular_Lens.html#gsc.tab=0","cr":"Peter H. Sanchez MD; Bilal Ahmed MD; Thomas Oetting MD","src":"er"},{"t":"Lens material in the anterior chamber causing chronic uveitis","im":[["E:pages/lens-material-in-AC/Displaced-lens-material-LRG.jpg",""],["E:pages/lens-material-in-AC/Displaced-lens-material-slit-LRG.jpg",""],["E:pages/lens-material-in-AC/Displaced-lens-material-slit-2-LRG.jpg",""]],"h":"Lens material can cause intraocular inflammation when not isolated by the lens capsule. This patient was referred with chronic, refractory uveitis of unknown etiology, but on exam he was found to have a large piece of displaced lens material in the anterior chamber. In the photographs, a large piece of cataractous lens nuclear material is present inferiorly. The anterio","u":"pages/lens-material-in-AC/index.htm","cr":"Jesse Vislisel, MD; Anna Kitzmann, MD","src":"er"},{"t":"Retained Lens Fragment","im":[["E:pages/imgs/R_16hBs75OJXMshhv_Slide1.jpg",""],["E:pages/imgs/R_16hBs75OJXMshhv_Slide2.jpg",""]],"h":"","u":"pages/Retained_Lens_Fragment_.html","cr":"Mahsaw Mansoor, MD","src":"er"},{"t":"Ointment in anterior chamber after cataract surgery","im":[["E:pages/Ointment-in-AC/ointment-1-LRG.JPG",""],["E:pages/Ointment-in-AC/ointment-2-LRG.JPG",""]],"h":"A patient presented one month following uncomplicated cataract surgery due to the presence of a buoyant tan substance in the anterior chamber which was present since postoperative day one. This was felt to represent Maxitrol® ointment wicked through a short wound into the eye. Remarkably, there was no anterior chamber inflammation. The patient was taken to the operating room and the prior clear corneal incision was u","u":"pages/Ointment-in-AC/index.htm","cr":"Jeffrey Welder, MD","src":"er"},{"t":"Anterior chamber perfluoro-N-octane (PFO) bubbles","im":[["E:pages/PFO-bubbles-2/AC-PFO-2-LRG.jpg",""]],"h":"Perfluoro-n-octane (PFO) is a dense liquid (specific gravity of 1.76) that is used for the intraoperative management of retinal detachments. Due to its density, low viscosity, and immiscibility in water, the PFO is able to displace sub-retinal fluid and blood anteriorly, allowing for retinal unfolding and stabilization during repair. PFO has been observed to be safe and effective in the managemen","u":"pages/PFO-bubbles-2/index.htm","cr":"Jeffrey D. Welder, MD","src":"er"},{"t":"Retained perfluorocarbon liquid in the anterior chamber","im":[["E:photos/PFO-in-AC/PFO-2-LRG.jpg",""]],"h":"","u":"pages/PFO-in-AC.htm","cr":"Justin Risma, MD","src":"er"},{"t":"Subconjunctival silicone oil","im":[["E:pages/subconj-silicone-oil/subconj-silicone-oil--LRG.jpg","External slit lamp photograph"],["E:pages/subconj-silicone-oil/subconj-silicone-oil-1-LRG.jpg","anterior segment OC"]],"h":"89-year-old female status post retinal detachment repair and later removal of silicone oil, now with subconjunctival silicone oil after the procedure (external slit lamp photograph and anterior segment OCT).","u":"pages/subconj-silicone-oil/index.htm","cr":"Jesse Meredith Baker, MD","src":"er"},{"t":"Hyperoleon","im":[["E:pages/imgs/hyperoleon2.jpg","Slit lamp photograph of the left eye showing hyperoleon."],["E:pages/imgs/hyperoleon1.jpg","Slit lamp photograph of the left eye showing hyperoleon and brunescent cataract with narrow white light beam illumination."]],"h":"Alex Steggall Oct 16, 2025 A 60-year-old man presented with 6 months of worsening vision in the left eye, described as “looking through milk.” He had a history of macula-involving rhegmatogenous retinal detachment associated with a giant retinal tear repaired by pars plana vitrectomy and scleral buckle with 1,000 centistoke silicone oil tamponade before being lost to follow up for 1.5 y","u":"pages/hyperoleon.htm","cr":"Ella Gehrke, MD","src":"er"},{"t":"Vitreous strand to paracentesis causing subtle peaked pupil early in case","im":[["E:pages/imgs/early_vitreous_loss.png","Vitreous prolapse that extends to a paracentesis such as in this case can cause peaking of the pupil. In this case the vitreous presented ea"]],"h":"Here is an example of a subtle peaked pupil early during cataract surgery. The patient has an essentially invisible strand ov vitreous that is going to the paracentesis from a peripheral point which is causing peaking of the pupil.","u":"pages/vitreous_strand_to_paracentesis_causing_subtle_peaked_pupil_early_in_case.html#gsc.tab=0","cr":"Thomas A. Oetting, MS, MD","src":"er"},{"t":"Iris incarceration in an old extracapsular wound","im":[["E:pages/Iris-incarceration/iris-incarceration-LRG.jpg",""]],"h":"","u":"pages/Iris-incarceration/index.htm","cr":"Angela McAllister, MD","src":"er"},{"t":"Iridencleisis","im":[["E:pages/iridencleisis/iridencleisis-1-LRG.jpg",""],["E:pages/iridencleisis/iridencleisis-5-LRG.jpg",""],["E:pages/iridencleisis/iridencleisis-13-LRG.jpg",""]],"h":"Iridencleisis is a historic glaucoma filtering surgery that is no longer used. It is a free-filtering procedure that creates a full-thickness fistula between the anterior chamber and the subconjunctival space through an anterior sclerostomy. This procedure is unique in that it involves entrapping a pillar of iris tissue into the sclerostomy to act as a wick to hold the sclerostomy open. This proced","u":"pages/iridencleisis/index.htm","cr":"Christopher A. Kirkpatrick, MD","src":"er"},{"t":"Suture iris reconstruction using McCannel suture technique","im":[["E:pages/McCannel/Iris-reconstruction-7mm-preop-LRG.jpg",""],["E:pages/McCannel/Iris-reconstruction-2-LRG.jpg",""]],"h":"","u":"pages/McCannel/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"CustomFlex iris prosthesis and penetrating keratoplasty (PKP) for acanthamoeba keratitis","im":[["https://webeye.ophth.uiowa.edu/eyeforum/cases-i/case211/L/8-prosthetic-iris-LRG.jpg",""]],"h":"","u":"pages/CustomFlex-prosthesis/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Ophtec 311 iris reconstruction intraocular lens after iris melanoma resection","im":[["E:pages/ophtec-311-after-iris-melanoma/Ophthec-311-preop-LRG.jpg",""],["E:pages/ophtec-311-after-iris-melanoma/Ophthec-311-LRG.jpg",""]],"h":"","u":"pages/ophtec-311-after-iris-melanoma/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Post-operative angle closure glaucoma due to intraocular gas expansion","im":[["E:photos/angle-closure-intraoc-gas.jpg",""]],"h":"","u":"pages/angle-closure-IO-gas-Expand.htm","cr":"Justin Risma, MD","src":"er"},{"t":"Epithelial downgrowth","im":[["E:photos/epithelial-downgrowth-RR.jpg",""]],"h":"Epithelial downgrowth is a rare complication of intraocular surgery or penetrating ocular trauma. Epithelial invasion into the anterior chamber occurs when non-keratinized epithelial cells migrate through a surgical or traumatic corneal wound. Once in the anterior chamber, epithelial cell migration may lead to corneal decompensation, recalcitrant glaucoma, and occasionally invade the posterior pol","u":"pages/epithelial-downgrowth.htm","cr":"Ryan J. Diel, MD, Mark A. Greiner, MD, Jennifer J. Ling, MD","src":"er"},{"t":"Exposed Gore-Tex Suture With Inferotemporal Lens Dislocation","im":[["E:pages/imgs/gore_tex_1.webp","Inferotemporal lens dislocation with exposed Gore-Tex suture"],["E:pages/imgs/gore_tex_2.webp","Exposed Gore-Tex suture"],["E:pages/imgs/gore_tex_3.webp","Exposed Gore-Tex suture"]],"h":"A monocular patient presented after an outside provider identified inferotemporal exposure of a Gore-Tex suture in the left eye. Ocular history is significant for pars plana vitrectomy for vitreous hemorrhage in the left eye, prior IOL repositioning with Gore-Tex lasso fixation, and subsequent scleral patch graft. The fellow eye has a history of","u":"pages/exposed-gore-tex-suture-inferotemporal-lens-dislocation.html","cr":"Caitlin M. Hackl MD, Patrick J. Donegan MD, Ryan J. Diel MD","src":"er"}]},{"n":"Contact lenses","b":"Lens fit, deposits and complications.","items":[{"t":"Circle Contact Lens","im":[["E:pages/Circle-Contact-Lens/circle-lens1-LRG.jpg",""],["E:pages/Circle-Contact-Lens/circle-lens2-LRG.jpg",""]],"h":"Circle contact lenses are soft contact lenses with a limbal ring that is larger than the patient's visible iris. The look is very dramatic and is favored by anime enthusiasts for making people look more doll or anime character-like. The Etafilcon A® lens (in photo) is a 1-day replacement lens that is currently the only FDA-approved circle lens in the US.","u":"pages/Circle-Contact-Lens/index.htm","cr":"Tressa Larson, OD","src":"er"},{"t":"Soft Contact Lens","im":[["E:pages/SoftCL/Soft-CL-1-LRG.jpg",""],["E:pages/SoftCL/Soft-CL-2-LRG.jpg",""]],"h":"Monthly soft contact lenses are a staple for anyone involved in prescribing contact lenses. The lenses should move a small amount with the blink, particularly on up gaze. A lens that moves excessively may be uncomfortable and may result in variable vision, but if the patient is happy with it, excessive movement is not a health problem.","u":"pages/SoftCL/index.htm","cr":"Tressa Larson, OD","src":"er"},{"t":"Makeup on toric soft contact lens","im":[["E:pages/makeup-on-CL/Makeup-on-toric-soft-contact-lens-LRG.jpg",""]],"h":"Many makeup wearers choose to line the inside of their eyelids posterior to the lash line with eyeliner. If the patient is a contact lens wearer, as in this image, the surface integrity of the contact lens can be compromised resulting in increased risk of infection as bacteria more easily bond to a disrupted surface. It can also decrease comfort of the lens and cause irritation of the palpebral conjunctiva as bl","u":"pages/makeup-on-CL/index.htm","cr":"","src":"er"},{"t":"Lipid Deposits on Scleral Rigid Gas Permeable (RGP) Lens","im":[["E:pages/lipid-deposits-scleral-RGP/lipid-deposit-scleral.jpg",""]],"h":"Lipid deposits may indicate an issue with the meibomian glands or the need to change to another type of conditioning solution.","u":"pages/lipid-deposits-scleral-RGP/index.htm","cr":"Tressa Larson, OD","src":"er"},{"t":"Scratched Scleral Rigid Gas Permeable (RGP) Lens","im":[["E:pages/Scratched-Scleral-RGP/Scratched-Scleral-RGP1-LRG.jpg",""],["E:pages/Scratched-Scleral-RGP/Scratched-Scleral-RGP-2-LRG.jpg",""]],"h":"The most likely cause of scratches in any type of contact lens is cleaning. Scratches occur when using abrasive cleaners, with excessive rubbing, rough fingers, and dirty hands. All can result in decreased comfort and vision.","u":"pages/Scratched-Scleral-RGP/index.htm","cr":"Tressa Larson, OD","src":"er"},{"t":"Surface Coating Loss on Scleral Lens","im":[["E:pages/Surface-Coating-Loss-on-Scleral-Lens/non-wetting-scleral-LRG.jpg",""]],"h":"Inappropriate cleaners, excessive rubbing, cosmetic supplies, and the long-term result of cleaning appropriately will eventually strip the surface coating off of any lens.","u":"pages/Surface-Coating-Loss-on-Scleral-Lens/index.htm","cr":"Tressa Larson, OD","src":"er"},{"t":"Appropriate Scleral Lens Sagittal Depth","im":[["E:photos/appropriate-scleral-lens-sagittal-depth/Perfect-Sag-Scleral-w-debris-LRG.jpg",""]],"h":"Scleral contact lenses rest on the sclera, vaulting over the entire cornea and limbus to avoid irritating or scarring those tissues. The amount of space between the lens and the cornea is typically referred to as sag. Sagittal depth actually refers to the entire contact lens from the center of the lens to the plane that the edges circumscribe. Various br","u":"pages/appropriate-scleral-lens-sagittal-depth.htm","cr":"Tressa Larson OD","src":"er"},{"t":"EyePrint Pro® over mini penetrating keratoplasty (PKP)","im":[["E:pages/EyePrint-Pro-over-mini-PKP/3-pt2-b-LRG.jpg",""],["E:pages/EyePrint-Pro-over-mini-PKP/3-pt2-a-LRG.jpg",""]],"h":"Scleral lenses are the gold-standard for the treatment of Terrien's Marginal Degeneration because they protect the delicate peripheral cornea from injury and also encourage vascularization of thinned areas of cornea which strengthens the area and also helps to prevent further injury. This patient had a globe rupture in the setting of Terrien's Marginal degeneration and under","u":"pages/EyePrint-Pro-over-mini-PKP/index.htm","cr":"Tressa Larson, OD","src":"er"}]}]};

["The ISNT rule describes normal neuroretinal rim thickness as…",["Inferior ≥ Superior ≥ Nasal ≥ Temporal","Superior ≥ Inferior ≥ Temporal ≥ Nasal","Temporal ≥ Nasal ≥ Inferior ≥ Superior","Equal in all quadrants"],"Breaking the ISNT pattern, especially inferior or superior thinning, is suspicious for glaucoma, though many normal discs don't follow it exactly."],
["Cup size should always be judged relative to…",["Overall disc size: a large disc normally has a large cup","Patient age only","Refractive error only","Intraocular pressure"],"Megalopapillae have big physiological cups but a healthy rim. Small, crowded discs may have no cup at all, the 'disc at risk' for NAION."],

"Congenital anomalies":[
["Optic nerve hypoplasia is associated with which syndrome (septo-optic dysplasia)?",["Absent septum pellucidum with pituitary hormone deficiency","Wilms tumour","Café-au-lait spots","Port-wine stain"],"Look for the 'double ring' sign. Children with hypoplasia need endocrine and neuroimaging assessment."],
["Optic disc pits are classically associated with…",["Serous macular detachment or schisis (pit maculopathy)","Central retinal artery occlusion","Disc haemorrhage","Optic neuritis"],"Pits are usually temporal, and fluid may track from the pit into or under the macula."],

["A splinter disc haemorrhage in glaucoma…",["Signals progression risk and is often followed by a matching notch or RNFL defect","Means the diagnosis is wrong","Requires urgent neuroimaging","Is caused by raised ICP"],"They're especially common in normal tension glaucoma and usually lie inferotemporally or superotemporally."]],
"The swollen disc":[
["Papilloedema specifically means…",["Disc swelling caused by raised intracranial pressure","Any swollen optic disc","Swelling from ischaemia","Swelling from inflammation"],"Use 'disc swelling' or 'oedema' for other causes. Papilloedema needs urgent neuroimaging, followed by an LP if the imaging allows."],
["Early papilloedema usually preserves…",["Visual acuity and colour vision (until late)","Nothing; acuity drops at once","Only colour vision","Only the pupil response"],"An enlarged blind spot comes first. Vision loss is late or from complications, unlike optic neuritis or NAION."],
["A 72-year-old with jaw claudication and pale, chalky-white disc swelling most likely has…",["Arteritic AION from giant cell arteritis","NAION","Papilloedema","Optic neuritis"],"Check ESR, CRP and platelets, and start high-dose steroids straight away. The other eye is at risk."]],
"Disc drusen (pseudopapilloedema)":[
["Which test best confirms buried optic disc drusen?",["B-scan ultrasound, EDI-OCT or autofluorescence","Fluorescein dye only","Visual acuity","Colour vision"],"Drusen are calcified and hyperechoic on B-scan. OCT shows hyporeflective cores with a hyperreflective rim."],
["Optic disc drusen are associated with…",["Visual field defects and angioid streaks (pseudoxanthoma elasticum)","Raised ICP","Diabetes","Optic neuritis"],"They can cause slowly progressive field loss and, rarely, NAION or CNV."]],
"Optic atrophy & compressive neuropathy":[
["Band (bow-tie) atrophy of the disc indicates damage to…",["Fibres crossing at the chiasm (nasal retina) in the eye with a temporal field loss","The papillomacular bundle only","The superior arcuate fibres","The optic tract only"],"Nasal and macular fibres enter the disc nasally and temporally, so their loss leaves horizontal pallor."],
["Optociliary shunt vessels with progressive vision loss suggest…",["Optic nerve sheath meningioma (or chronic CRVO or papilloedema)","Glaucoma","Diabetic retinopathy","Myopia"],"The classic triad is vision loss, optic atrophy and optociliary shunts."],
["Leber hereditary optic neuropathy is…",["Maternally inherited, from a mitochondrial DNA mutation, mostly in young men","Autosomal dominant (OPA1)","X-linked recessive","Caused by raised ICP"],"The acute phase shows peripapillary telangiectasia without leakage. Dominant optic atrophy (OPA1) causes temporal pallor."]],

["Astrocytic hamartomas of the disc or retina suggest…",["Tuberous sclerosis","Neurofibromatosis type 2","Sturge-Weber syndrome","Marfan syndrome"],"They can be calcified ('mulberry') or translucent and flat."]]

    return `<div class="pch"><div class="pchh"><button class="tlink" data-p="ch" data-i="${c.start}">${ci+1}. ${esc(c.n)}</button><span>${w}/${cs.length} watched · ${Math.round(cov*100)}% seen</span></div>
    <div class="pbar"><i style="width:${Math.round(cov*100)}%"></i></div>
    <div class="grid">${cs.map(s=>{const r=TRK.get(s.v)||{};return `<button class="cell ${cellClass(s.v)} ${accClass(s.v)}" data-p="go" data-i="${slides.indexOf(s)}" title="#${s.n}${quiz?'':' '+esc(s.t)} — watched ${r.w||0}×, ${Math.round(TRK.coverage(s.v)*100)}% seen${r.qa?`, questions ${r.qc}/${r.qa}`:''}${r.ta?`, tests ${r.tc}/${r.ta}`:''}">${r.w>1?r.w:''}</button>`}).join('')}</div></div>`; }).join('');
  const secRows=Object.entries(SECS).map(([k,s])=>{ const keys=k==='gonio'?[...new Set(CH_GONIO.flatMap(c=>c.g.flatMap(g=>g[1].map(it=>it[1]))))]:[...new Set(DATA2[k].flatMap(c=>c.items.map(it=>secKey(k,it))))]; let w=0,cov=0; keys.forEach(x=>{const r=TRK.get(x); if(r&&r.w>0)w++; cov+=TRK.coverage(x);}); const pc=Math.round(100*cov/keys.length); return `<button data-sec="${k}" class="${k===SEC?'cur':''}"><b>${s.icon} ${s.name}</b>${w}/${keys.length} ${k==='gonio'?'watched':'viewed'} · ${pc}%<i><u style="width:${pc}%"></u></i></button>`; }).join('');
  PG.el.querySelector('.tin').innerHTML=`<div class="th"><h2>📊 Your progress</h2><button class="tx" data-p="close">×</button></div>
  <div class="psecs">${secRows}</div><h3 style="margin:4px 0 8px">${SECS[SEC].icon} ${SECS[SEC].name}</h3><div class="pkpi"><div><b>${pct}%</b><span>of all footage seen</span></div><div><b>${watched}/${uniq.length}</b><span>${IMGSEC?'cases viewed':'clips fully watched'}</span></div><div><b>${fmtDur(secs)}</b><span>watch time</span></div><div><b>${qa?Math.round(100*qc/qa)+'%':'–'}</b><span>quiz Qs correct (${qc}/${qa})</span></div><div><b>${ta?Math.round(100*tc/ta)+'%':'–'}</b><span>test answers correct (${tc}/${ta})</span></div></div>
  <div class="plegend"><span><i class="cell c0"></i>not seen</span><span><i class="cell cp"></i>partly seen</span><span><i class="cell c1"></i>watched 1×</span><span><i class="cell c2"></i>2×</span><span><i class="cell c3"></i>3×+</span><span><i class="cell c1 ag"></i>≥75% correct</span><span><i class="cell c1 aa"></i>40–74%</span><span><i class="cell c1 ar"></i>&lt;40%</span></div>
  <p class="tm2" style="font-size:13px">${IMGSEC?'A case counts as viewed once you have looked at all its images for at least 3 seconds.':'A clip counts as watched when you\'ve played at least 90% of it in one go (scrubbing doesn\'t count).'} Tap any square to jump to that clip.</p>
  ${chRows}
  <div class="pbox" id="syncbox"></div>
  <div class="pbox"><h3>Manual backup</h3>
  <p class="tm2" style="font-size:13px">${TRK.persistent?'Progress is saved automatically in this browser on this device. Clearing browser data, private browsing, or opening the file in a different browser or device starts fresh, so keep a backup.':'This browser is blocking storage, so progress will be lost when you close the page. Download a backup before you leave.'}</p>
  <div class="pbtns"><button class="tgo" data-p="dl">⬇ Download backup file</button><button class="tgo sec" data-p="copy">Copy backup code</button><label class="tgo sec">⬆ Restore from file<input type="file" accept=".json,application/json" hidden id="pfile"></label><button class="tgo sec" data-p="paste">Paste backup code</button></div>
  <div id="ppaste" style="display:none"><textarea id="ptext" placeholder="Paste a backup code here"></textarea><button class="tgo" data-p="doimport">Restore</button></div>
  <p id="pmsg" class="tm2"></p>
  <button class="tlink" data-p="reset" style="color:#e0605a">Reset all progress…</button></div>`;
  if(window.SYNC) SYNC.renderPanel();
  PG.el.querySelector('#pfile').onchange=e=>{const f=e.target.files[0]; if(!f) return; f.text().then(doImport)};
}
function backupText(){ let quiz={}; try{quiz=JSON.parse(localStorage.getItem('gonioscroll_q')||'{}')}catch(e){} return TRK.exportJSON({quiz}); }
function mergeBackup(text,manual){
  const {o,wiped}=TRK.importJSON(typeof text==='string'?text.trim():text,manual);
  if(wiped){ Object.keys(QS).forEach(k=>delete QS[k]); slides.forEach(s=>{s.qPopped=false}); }
  if(o.quiz){ Object.entries(o.quiz).forEach(([k,arr])=>{ QS[k]=QS[k]||[]; (arr||[]).forEach((v,i)=>{ if(v!=null&&QS[k][i]==null) QS[k][i]=v; }); }); }
  saveQS(); score(); return o;
}
function doImport(text){
  const m=PG.el.querySelector('#pmsg');
  try{ mergeBackup(text,true); renderProg(); PG.el.querySelector('#pmsg').textContent='✓ Restored and merged with your current progress.'; if(window.SYNC) SYNC.soon(); }
  catch(e){ m.textContent='✗ That doesn\'t look like a GonioScroll backup.'; }
}
function openProg(){ if(window.SYNC) SYNC.soon(); const s=slides[cur]; if(s&&s.type==='clip') s.vid.pause(); qcard.classList.remove('open'); TRK.save(); renderProg(); PG.el.classList.add('open'); PG.el.scrollTop=0; }
function closeProg(){ PG.el.classList.remove('open'); const s=slides[cur]; if(s&&s.type==='clip') s.vid.play().catch(()=>{}); }
let resetArm=0;
PG.el.addEventListener('click',e=>{
  const b=e.target.closest('[data-p]'); if(!b) return; const a=b.dataset.p, m=PG.el.querySelector('#pmsg');
  if(a==='close') closeProg();
  else if(a==='go'||a==='ch'){ PG.el.classList.remove('open'); go(+b.dataset.i); }
  else if(a==='dl'){ const blob=new Blob([backupText()],{type:'application/json'}); const u=URL.createObjectURL(blob); const l=document.createElement('a'); l.href=u; l.download=`gonioscroll-progress-${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); m.textContent='Backup downloaded. If nothing appeared, use "Copy backup code" instead.'; }
  else if(a==='copy'){ const t=backupText(); (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>m.textContent='✓ Backup code copied. Paste it into a note or email to yourself.').catch(()=>{ PG.el.querySelector('#ppaste').style.display='block'; const ta=PG.el.querySelector('#ptext'); ta.value=t; ta.select(); m.textContent='Select-all and copy the code in the box.'; }); }
  else if(a==='paste'){ PG.el.querySelector('#ppaste').style.display='block'; PG.el.querySelector('#ptext').value=''; PG.el.querySelector('#ptext').focus(); }
  else if(a==='doimport') doImport(PG.el.querySelector('#ptext').value);
  else if(a==='reset'){ if(Date.now()-resetArm<4000){ TRK.reset(); if(window.SYNC) SYNC.soon(true); Object.keys(QS).forEach(k=>delete QS[k]); saveQS(); score(); slides.forEach(s=>{s.qPopped=false}); m.textContent='Progress reset.'; renderProg(); } else { resetArm=Date.now(); b.textContent='Tap again to permanently reset everything'; } }
});
PG.el.addEventListener('keydown',e=>{ e.stopPropagation(); if(e.key==='Escape') closeProg(); });
document.getElementById('bProg').onclick=openProg; document.getElementById('bProg2').onclick=openProg;

// ---------- Cloud sync via a secret GitHub Gist ----------
const SYNC=(function(){
  const CK='gonioscroll_sync', FILE='gonioscroll-progress.json', API='https://api.github.com';
  let cfg={}; try{ cfg=JSON.parse(localStorage.getItem(CK)||'{}')||{}; }catch(e){}
  let busy=false, again=false, lastRev=-1, status='', err='', timer=null;
  const saveCfg=()=>{ try{ localStorage.setItem(CK,JSON.stringify(cfg)); }catch(e){} };
  const on=()=>!!(cfg.token&&cfg.gist);
  async function api(path,opts={}){
    const r=await fetch(API+path,{...opts,headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opts.body?{'Content-Type':'application/json'}:{})}});
    if(r.status===401||r.status===403){ const e=new Error(r.status===401?'GitHub rejected the token (expired or revoked?)':'Token lacks the "gist" permission, or rate-limited'); e.auth=true; throw e; }
    if(!r.ok){ const e=new Error('GitHub error '+r.status); e.status=r.status; throw e; }
    return r.status===204?null:r.json();
  }
  const payload=()=>{ let quiz={}; try{ quiz=JSON.parse(localStorage.getItem('gonioscroll_q')||'{}'); }catch(e){} return JSON.stringify(TRK.exportObj({quiz}),null,0); };
  async function create(){ const g=await api('/gists',{method:'POST',body:JSON.stringify({description:'GonioScroll progress (synced automatically — do not edit)',public:false,files:{[FILE]:{content:payload()}}})}); cfg.gist=g.id; cfg.url=g.html_url; saveCfg(); }
  async function sync(){
    if(!on()) return; if(busy){ again=true; return; } busy=true; err=''; status='Syncing…'; paint();
    try{
      let g; try{ g=await api('/gists/'+cfg.gist); }catch(e){ if(e.status===404){ await create(); g=null; } else throw e; }
      if(g){ const f=g.files&&g.files[FILE];
        if(f){ let text=f.content; if(f.truncated) text=await (await fetch(f.raw_url)).text(); if(text&&text.trim()) mergeBackup(text); }
        await api('/gists/'+cfg.gist,{method:'PATCH',body:JSON.stringify({files:{[FILE]:{content:payload()}}})});
      }
      lastRev=TRK.rev(); cfg.last=Date.now(); saveCfg(); status='';
    }catch(e){ err=e.message||String(e); if(e.auth){ cfg.paused=true; saveCfg(); } }
    busy=false; paint(); if(again){ again=false; setTimeout(sync,500); }
  }
  function soon(force){ if(!on()||cfg.paused) return; clearTimeout(timer); timer=setTimeout(sync,force?50:800); }
  // push our own counters when the page is hidden (keepalive so it survives closing the tab)
  document.addEventListener('visibilitychange',()=>{ if(document.hidden&&on()&&!cfg.paused&&TRK.rev()!==lastRev){
    try{ fetch(API+'/gists/'+cfg.gist,{method:'PATCH',keepalive:true,headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({files:{[FILE]:{content:payload()}}})}); lastRev=TRK.rev(); }catch(e){} }
    else if(!document.hidden) soon(); });
  setInterval(()=>{ if(on()&&!cfg.paused&&TRK.rev()!==lastRev&&!document.hidden) sync(); },60000);
  async function connect(token){
    cfg={token:token.trim()}; err=''; status='Connecting…'; paint();
    try{
      const u=await api('/user'); cfg.login=u.login;
      // reuse an existing GonioScroll gist if there is one
      let found=null; for(let page=1;page<=5&&!found;page++){ const list=await api('/gists?per_page=100&page='+page); found=list.find(g=>g.files&&g.files[FILE]); if(list.length<100) break; }
      if(found){ cfg.gist=found.id; cfg.url=found.html_url; saveCfg(); await sync(); status=''; }
      else { await create(); cfg.last=Date.now(); lastRev=TRK.rev(); saveCfg(); status=''; }
      toast('☁ Sync connected as @'+cfg.login);
    }catch(e){ err=e.message; cfg={}; saveCfg(); }
    status=''; paint();
  }
  function disconnect(){ cfg={}; saveCfg(); err=''; status=''; paint(); }
  const ago=t=>{ if(!t) return 'never'; const s=Math.round((Date.now()-t)/1000); return s<10?'just now':s<60?s+'s ago':s<3600?Math.round(s/60)+' min ago':new Date(t).toLocaleString(); };
  function paint(){ ['bProg','bProg2'].forEach(id=>{const e=document.getElementById(id); if(e) e.classList.toggle('synced',on()&&!cfg.paused&&!err);}); if(document.getElementById('prog').classList.contains('open')) renderPanel(); }
  function renderPanel(){
    const box=document.getElementById('syncbox'); if(!box) return;
    if(!on()){
      box.innerHTML=`<h3>☁ Sync across devices</h3>
      <p class="tm2" style="font-size:13px">Saves your progress to a secret gist on your GitHub account so every device stays in step automatically. You need to set this up once on each device.</p>
      <ol class="steps">
        <li>Sign in to GitHub (a free account is fine).</li>
        <li><a href="https://github.com/settings/tokens/new?scopes=gist&description=GonioScroll%20sync" target="_blank" rel="noopener">Open this pre-filled token page ↗</a>. Only <b>gist</b> should be ticked. Set an expiry (e.g. 1 year), then press <b>Generate token</b>.</li>
        <li>Copy the token (it starts with <code>ghp_</code>) and paste it below. Use the <b>same token</b> on every device, or make one per device.</li>
      </ol>
      <div class="tform"><input class="tans" id="stok" type="password" placeholder="ghp_…" autocomplete="off" spellcheck="false"><button data-s="connect">Connect</button></div>
      ${status?`<p class="tm2">${status}</p>`:''}${err?`<p class="serr">✗ ${esc(err)}</p>`:''}
      <p class="tm2" style="font-size:12px;margin-top:10px">The token is kept only in this browser. It can create and edit your gists, so revoke it on GitHub if you lose a device. The gist contains only watch counts and scores.</p>`;
    } else {
      const devs=TRK.devices();
      box.innerHTML=`<h3>☁ Sync is on</h3>
      <p class="tm2" style="font-size:13px">Signed in as <b>@${esc(cfg.login||'?')}</b> · last synced <b>${status||ago(cfg.last)}</b>${cfg.paused?' · <b style="color:#f87171">paused</b>':''}</p>
      ${err?`<p class="serr">✗ ${esc(err)}${cfg.paused?' Paste a new token to resume.':''}</p>`:''}
      <div class="devs">${devs.map(d=>`<div><span>${d.me?'📍':'💻'} ${esc(d.name)}${d.me?' <small>(this device)</small>':''}</span><small>${d.n} clips with activity${d.at&&!d.me?' · seen '+ago(d.at):''}</small></div>`).join('')}</div>
      ${cfg.paused?`<div class="tform"><input class="tans" id="stok" type="password" placeholder="New token ghp_…"><button data-s="connect">Reconnect</button></div>`:''}
      <div class="pbtns" style="margin-top:10px"><button class="tgo" data-s="now">Sync now</button><button class="tgo sec" data-s="off">Turn off on this device</button></div>
      <p class="tm2" style="font-size:12px;margin-top:8px">Totals add up across devices. ${cfg.url?`<a href="${cfg.url}" target="_blank" rel="noopener">View the gist ↗</a>`:''}</p>`;
    }
  }
  document.getElementById('prog').addEventListener('click',e=>{
    const b=e.target.closest('[data-s]'); if(!b) return; const a=b.dataset.s;
    if(a==='connect'){ const v=(document.getElementById('stok').value||'').trim(); if(!v){ err='Paste your token first.'; renderPanel(); return; } connect(v); }
    else if(a==='now'){ cfg.paused=false; saveCfg(); sync(); }
    else if(a==='off'){ disconnect(); }
  });
  document.getElementById('prog').addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='stok'){ e.preventDefault(); document.querySelector('[data-s=connect]').click(); } });
  if(on()) setTimeout(sync,1200);
  paint();
  return { soon, sync, renderPanel, on, cfg:()=>cfg };
})();
window.SYNC=SYNC;


// auto-hide the time bar when the mouse is idle or leaves the window (desktop only)
(function(){
  if(!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  let idleT, overSeek=false;
  const dragging=()=>slides.some(s=>s.drag)||!!document.querySelector('.seek input:active');
  const sleep=()=>{ if(!overSeek&&!dragging()) document.body.classList.add('idle'); };
  const wake=()=>{ document.body.classList.remove('idle'); clearTimeout(idleT); idleT=setTimeout(sleep,2500); };
  document.addEventListener('mousemove',e=>{ overSeek=!!e.target.closest('.seek'); wake(); },{passive:true});
  document.addEventListener('mousedown',wake,{passive:true});
  document.documentElement.addEventListener('mouseleave',()=>{ overSeek=false; clearTimeout(idleT); if(!dragging()) document.body.classList.add('idle'); });
  document.addEventListener('keydown',e=>{ if(/^Arrow(Left|Right)$|^[,.]$/.test(e.key)) wake(); });
  idleT=setTimeout(sleep,2500);
})();
// resume
const saved=LS?+LS.getItem(IDXKEY):0;
if(saved>1&&saved<slides.length){go(saved);const s=slides[saved];toast('Resumed'+(s.type==='clip'?` at clip ${s.n}`:''),'Start over',()=>go(0))}
else activate(0);
</script>
</body>
