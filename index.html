 posterior multifocal placoid pigment epitheliopathy (APMPPE) Acute posterior multifocal placoid pigment epitheliopathy (APMPPE) Category(ies): Retina / Vitreous Contributor: Alina Husain MD, Saloni Kapoor MD, Elliott H. Sohn MD, Timothy M. Boyce MD Photographer: Madigan M. Peimann Posted: 08/11/2026 A 39-year-old woman with a history of multiple sclerosis on ofatumumab (CD20 inhibitor) presented with progressive vision loss, left greater than right, for one week. The patient reported a history of a self-limited upper respiratory infection five weeks prior. On exam, she had creamy placoid lesions in the posterior pole and periphery. The peripheral lesions appeared subacute due to pigmentary changes and atrophy. Workup included an anterior chamber tap that was negative for CMV, VZV, HSV-1 and HSV-2 by PCR testing. Additional laboratory testing was notable for negative syphilis total antibody, negative quantiferon-TB gold and a mildly elevated platelet count. MRI/MRA of the Brain WWO Contrast and MRI Orbit WWO contrast demonstrated no evidence of CNS vasculitis or evidence of new or active demyelination. She started on prednisone 60 mg daily after infectious testing returned negative.","u":"pages/APMPPE/index.htm","cr":"Angela McAllister, MD","src":"er"},{"t":"The Sympathizing Eye: Panuveitis Secondary to Sympathetic Ophthalmia","im":[["E:photos/sympathizing-eye/OCT-macula-LRG.jpg","Slitlamp photography, left eye. There was 1+ cell and 1+ flare in the anterior chamber with trace nuclear sclerosis (left image). The vitreous exam was remarkable for significant anterior vitritis (right images)."]],"h":"This is a 46-year-old monocular man who presented with floaters, peripheral vision loss, and decreased central acuity in his left eye. Nine months prior to presentation, the right eye had suffered a penetrating globe injury with retinal detachment and was enucleated within four weeks of the injury. His slit lamp exam demonstrated anterior and posterior chamber cell (Figure 1). Dilated fundus exam revealed vitreous strands, grade III disc edema, and multiple, discrete, peripheral hypopigmented lesions consistent with Dalen-Fuchs nodules (i.e., lymphocytes and epithelioid histiocytes present between the RPE and Bruch membrane) (Figure 2). Fluorescein angiography demonstrated staining of the multiple peripheral lesions and leakage from the optic nerve and vessels in the posterior pole (Figure 3). Despite initial treatment with mycophenolate mofetil (CellCept) for several months, the patient experienced worsening peripheral vision and persistent vitreous inflammation. He underwent surgical placement of a ﬂuocinolone acetonide intravitreal implant (Retisert) for local, long-term inflammation control. Sympathetic ophthalmia (SO) is a rare, granulomatous panuveitis that usually occurs within one year of penetrating trauma to the fellow eye, likely as a result of uveoretinal antigens entering the conjunctival lymphatics [1, 2]. In addition to trauma, pars plana vitrectomy and other intraocular procedures are associated with increased SO risk [2]. Other characteristic findings of SO that were not present in this case include serous retinal detachments and mutton-fat keratic precipitates. Please refer to the Eye Rounds case on sympathetic ophthalmia for further information regarding work-up, differential diagnosis, pathophysiology, and management.","u":"pages/sympathizing-eye.htm","cr":"Brittni A. Scruggs, MD, PhD and Ian C. Han, MD","src":"er"},{"t":"Ocular toxocariasis","im":[["E:pages/toxocara/toxocara-OCT-LRG.jpg","Appearance of the granuloma on OCT"]],"h":"Ocular toxocariasis is caused by infection with the second-stage larvae of the roundworms Toxocara canis or Toxocara cati. The infection can have three primary presentations: 1) chronic endophthalmitis, 2) localized granuloma, and 3) peripheral granuloma. These photographs show a classic localized granuloma located over the optic nerve. Also shown are the appearance of the granuloma on B-scan echography and optical coherence tomography (OCT).","u":"pages/toxocara/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Choroidal osteoma","im":[["E:pages/osteoma/osteoma-OCT-cropped-LRG.jpg","OCT scan portrays a highly-reflective lesion at the level of the choroid with associated subretinal fluid."]],"h":"Choroidal osteomas are benign neoplasms in which areas of the choroid are replaced with mature bone. The tumors are most commonly solitary, unilateral, and juxtapapillary in location which helps differentiate them from idiopathic sclerochoroidal calcification. They appear clinically as ovoid subretinal lesions, ranging from yellow-white to orange-red in color, sometimes with overlying pigmentary changes. Other choroidal osteoma images Other choroidal osteoma images Contributor: Glen Bianchi, MD and Andrew Doan, MD, PhD, University of Iowa Other choroidal osteoma images Other choroidal osteoma images Contributor: Andrew Doan, MD, PhD, and Tom Fisher, University of Iowa","u":"pages/osteoma/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Circumscribed choroidal hemangioma","im":[["E:pages/choroidal-hemangioma-circumscribed/1c-CH-OCT-LRG.png","OCT"],["E:pages/choroidal-hemangioma-circumscribed/3c-Tx-Choroidal-Hemangioma.jpg","- Optical coherence tomography (OCT) section through the macula demonstrating sub-retinal fluid prior to treatment. Visual acuity 20/70."],["E:pages/choroidal-hemangioma-circumscribed/3d-Tx-Choroidal-Hemangioma.jpg","- OCT eight months after treatment showing complete resorption of fluid - visual acuity 20/30."]],"h":"Choroidal hemangiomas are benign vascular hamartomas that can be diffuse (as seen in the case of Sturge-Weber syndrome) or circumscribed as shown here. They typically are red-orange in color with indistinct margins and are located in the posterior pole. There may be overlying retinal pigmented epithelium (RPE) changes or orange pigment. The lesions may have associated intraretinal or subretinal fluid. They display high internal reflectivity on A-scan echography. To learn more about choroidal hemangiomas, read the related case report. Entry 1 Contributor: Jesse Vislisel, MD Photographers: Randy Verdick, FOPS (figs. 1a, 1b); Antionette Venckus, CRA (fig. 1f) These photographs show the appearance of a circumscribed choroidal hemangioma before and after treatment with photodynamic therapy (PDT). The lesion appeared as an elevated choroidal mass with overlying orange plaques and RPE atrophy. Vascular leakage from the lesion resulted in macular edema overlying the lesion, as seen in the OCT, and surrounding subretinal fluid resulting in an exudative retinal detachment, as seen on the B-scan echography. A-scan echography revealed high internal reflectivity, which is typical for these lesions. Overlying fibrosis can be seen in the post-treatment photograph. The treatment resulted in a reduction in tumor height and decreased subretinal fluid. It was successful in decreasing the patient's metamorphopsia. Entry 2 Contributor: Eric Chin, MD These photographs show the appearance of circumscribed choroidal hemangiomas in two different patients (Figures 2a and 2b are one patient, figures 2c and 2d are another). Entry 3 Contributor: Greg Zablocki, Retina Consultants of Colorado, P.C. This patient presented with a visually-significant choroidal hemangioma. The patient underwent photodynamic therapy employing the technique of Michels et al. After infusion of 6mg/m2 of verteporfin (Visudyne) intravenously the lesion was illuminated for 163 seconds with the activating laser. Two months later vision had improved from 20/70 to 20/30 and the sub-retinal fluid had resolved clinically and on OCT. Reference: Verteporfin therapy for choroidal hemangioma: a long-term follow-up, Michels, et al Retina. 2005;25(6):697-703","u":"pages/choroidal-hemangioma-circumscribed/index.htm","cr":"Jesse Vislisel, MD, Eric Chin, MD","src":"er"},{"t":"Carcinosarcoma choroidal metastasis","im":[["E:photos/Carcinosarcoma-choroidal-metastasis/OCT-LRG.jpg",""]],"h":"This patient presented with photopsias and was found to have an amelanotic, mildly elevated choroidal mass with irregular borders. OCT revealed an area of choroidal elevation with loculated areas of overlying subretinal fluid. The \"lumpy-bumpy\" appearance and loculated fluid collections are common with choroidal metastasis due to tumor involution in areas with insufficient blood supply. B-scan demonstrates a slightly lobulated area of mild choroidal elevation. In contrast to melanoma, choroidal metastases usually exhibit medium-high internal reflectivity on A-scan. This lesion had high internal reflectivity. Systemic workup was performed and revealed a previously undiagnosed uterine carcinosarcoma with systemic metastases. The primary tumor is undiagnosed at the time of presentation in approximately 1/3 of choroidal metastases.","u":"pages/carcinosarcoma-choroidal-metastasis.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Mantle cell lymphoma with choroidal metastasis","im":[["E:photos/choroid-lymphoma-metastasis/L/Lymphoma-retinal-detachment-OCT-LRG.jpg",""]],"h":"This 60-year-old woman with mantle cell lymphoma was found to have lymphoma metastasis to the choroid. The large, solid, lobular mass can be seen approaching the optic nerve. The mass had low internal reflectivity on A-scan ultrasonography. B-scan showed diffuse infiltration of the choroid becoming elevated near the optic disc. An associated retinal detachment can be visualized inferiorly. OCT shows a diffuse shallow retinal detachment with the irregular, \"lumpy-bumpy\" infiltration of the choroid.","u":"pages/choroid-mantle-cell-lymphoma-metastasis.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Combined Hamartoma of the Retina and RPE, Peri-Papillary","im":[["E:pages/CHRRPE/2-CPHRRPE-LRG.jpg","Image 2. OS: OCT, peripapillary ERM with striae and distortion extending thru fovea. Optic nerve head is elevated with high reflective internal reflectivity and mild surrounding retinal edema."],["E:pages/CHRRPE/3-CPHRRPE-LRG.jpg","Image 3. OS: OCT, peripapillary ERM with striae and distortion extending thru fovea. Optic nerve head is elevated with high reflective internal reflectivity and mild surrounding retinal edema."],["E:pages/CHRRPE/4-CPHRRPE-LRG.jpg","Image 4. OS: OCT, peripapillary ERM with striae and distortion extending thru fovea. Optic nerve head is elevated with high reflective internal reflectivity and mild surrounding retinal edema."]],"h":"A 29-year-old male was referred to our clinic because of chronic disc edema in the left eye, since at least 9 months prior. He has had decreased vision in the affected left eye since about four years prior, with gradual worsening over the years. He works as an electrician, and had a history of \"severe electrical shock\" in 2010 which caused him to faint. He has very occasional pain in the right eye that last for 5-10 minutes, and a superotemporal scotoma in the left eye. There is no family history of any eye diseases, and he has no other complaints. Visual acuity OD 20/20 sc OS 20/60 sc, 20/40 sc ph IOP: OD 17, OS 19 SLE: trace NS OU, otherwise unremarkable Summary: Peripapillary Combined Hamartoma of the Retina and Retinal Pigment Epithelium The lesion is most highly consistent with a peripapillary combined hamartoma of the retina and retinal pigment epithelium OS. The lesion distorts the fovea and the peripapillary retina. There is severe contraction of the membrane at the inferonasal edge of the disc with focal areas of axoplasmic flow stasis that probably represent damage to the nerve fiber layer in this area and explain the superotemporal visual field defect. This is a benign tumor that can affect vision. The epiretinal membrane will continue to contract and cause more vision loss. Vitrectomy and membranectomy has sometimes improved vision, but the epiretinal membranes tend to be tightly adherent and the prognosis for vision improvement is probably less than that for a typical epiretinal membrane. Combined hamartomas can be associated with neurofibromatosis (NF) type 2 and in one case report, with NF type 1. This has potential implications for family genetic counseling.","u":"pages/CHRRPE/index.htm","cr":"Eric Chin MD","src":"er"}]},{"n":"Detachment, trauma & myopia","b":"Subretinal fluid, ruptures and staphylomas.","items":[{"t":"Rhegmatogenous Retinal Detachment","im":[["E:photos/Retinal-detach/mac-off1-LRG.jpg",""],["E:photos/Retinal-detach/mac-off2-LRG.jpg",""]],"h":"71-year-old man presented with 2 weeks of blurred vision and curtain-like vision loss obscuring the inferior portion of his left visual field. Visual acuity was 20/50+2. Fundoscopy (see image) demonstrated a large horseshoe break at 12:30 at the equator, with a slightly rolled edge and a bridging vessel. There was subretinal fluid from 10:00 clockwise to 3:00, extending posteriorly to just involve the center of the fovea. This macula-involving rhegmatogenous retinal detachment was repaired surgically. Three months later, his vision improved to 20/20. Figure 2 Figure 2 Category(ies): Retina, Vitreous Contributor: Jesse Vislisel, MD Photographer: Cindy Montague, CRA Figure 3 Figure 3 Category(ies): Retina, Vitreous Contributor: Lucas T. Lenci MD, Elaine Binkley MD, Jessica Watson MD, Culver Boldt MD Photographer: Brice Critser, CRA This is a patient who presented with an inferior visual field defect and multiple flashes and floaters. These images demonstrate an excellent example of a large, superior horseshoe tear with a bullous retinal detachment. Figure 4 Figure 4 Category(ies): Retina, Vitreous Contributor: Tressa Larson, OD FAAO Photographer: Andrea Starkweather These OCT images show an inferior, macula-off, chronic rhegmatogenous retinal detachment.","u":"pages/Rhegmatogenous-ret-detach.htm","cr":"Zachary Q. Mortensen, MD","src":"er"},{"t":"Rhegmatogenous Retinal Detachment, Macula-Off","im":[["E:LARGE/rhegmato-ret-detach-macula-off-2-LRG.jpg","Image 2: OD OCT: normal"],["E:LARGE/rhegmato-ret-detach-macula-off-5-LRG.jpg","Image 5: OCT OS: limited quality, macula-off retinal detachment without a macular hole."]],"h":"Patient • A 62 year old female with a history of uncomplicated cataract surgery in both eyes, presented to the comprehensive clinic for decreased vision in the left eye since one day prior. She said her nasal field of vision had become abruptly and increasingly blurry while doing the laundry. She denied any flashes, floaters, or other complaints. She denied prior trauma or recent falls. She had no family history of retinal detachments. • Vision: OD 20/25-3; OS 20/100+1 • IOP: 14 and 13 • Manifest refraction prior to cataract surgery: º OD: -13.25 +0.75 045 º OS: -9.25 +0.50 040 º Slit lamp exam: Posterior chamber intraocular lenses and posterior capsular opacities, both eyes The patient underwent a scleral buckle, 25-gauge pars plana vitrectomy, laser indirect ophthalmoscopy, air-fluid exchange, and injection of 22% SF6, in the left eye. The right eye was also treated with prophylactic laser indirect ophthalmoscopy intraoperatively. Risk Factors for Retinal Detachments Age* High myopia* Co-morbid eye conditions, such as lattice degeneration* Prior eye surgery* Prior retinal detachment Family history of retinal detachment Trauma *Risk factors seen in our patient are highlighted in bold.","u":"pages/rhegmatogenous-ret-detach-macula-off.htm","cr":"Eric Chin, MD","src":"er"},{"t":"Choroidal Rupture","im":[["W:photos/choroidal-rupture-macular-hole/macular-hole-oct-LRG.jpg",""]],"h":"Doreen Dykhuizen This patient experienced blunt eye injury after bungee cord recoil. Color fundus montage photograph of the right eye shows a macular hole and peripapillary choroidal ruptures extending into the macula. There is subretinal hemorrhage and fluid inferior to the macular hole and in the peripapillary region. Optical coherence tomography (Heidelberg) demonstrates a partial-thickness macular hole with subretinal heme. Retinal Dialysis and Choroidal Rupture after Blunt Trauma Retinal Dialysis and Choroidal Rupture after Blunt Trauma Category(ies): Trauma,Retina / Vitreous Contributor: Nicolas J. Heckenlaible, MD and Timothy M. Boyce, MD Photographer: Madigan M. Peimann A 42-year-old woman sustained blunt trauma directly to her left globe after being kicked by a goat. On presentation, she was found to have multiple ocular injuries including a hyphema, ocular hypertension, iridodialysis, traumatic iritis, and vitreous hemorrhage. Upon clearance of her hyphema and vitreous hemorrhage after 14 days, she was found to have a retinal detachment and was referred to our center. Fundus examination demonstrated an arcuate choroidal rupture nasal to the optic nerve. There was a retinal dialysis from 2-4 o’clock with subretinal fluid from 1-5 o’clock that spared the macula. She underwent successful urgent retinal detachment repair with primary scleral buckle procedure. Contributor: Andrew Doan, MD, PhD","u":"pages/choroidal-rupture.html","cr":"Austin R. Fox, MD","src":"er"},{"t":"Retinal Dialysis and Choroidal Rupture after Blunt Trauma","im":[["W:photos/choroidal-rupture-macular-hole/macular-hole-oct-LRG.jpg",""]],"h":"Doreen Dykhuizen This patient experienced blunt eye injury after bungee cord recoil. Color fundus montage photograph of the right eye shows a macular hole and peripapillary choroidal ruptures extending into the macula. There is subretinal hemorrhage and fluid inferior to the macular hole and in the peripapillary region. Optical coherence tomography (Heidelberg) demonstrates a partial-thickness macular hole with subretinal heme. Retinal Dialysis and Choroidal Rupture after Blunt Trauma Retinal Dialysis and Choroidal Rupture after Blunt Trauma Category(ies): Trauma,Retina / Vitreous Contributor: Nicolas J. Heckenlaible, MD and Timothy M. Boyce, MD Photographer: Madigan M. Peimann A 42-year-old woman sustained blunt trauma directly to her left globe after being kicked by a goat. On presentation, she was found to have multiple ocular injuries including a hyphema, ocular hypertension, iridodialysis, traumatic iritis, and vitreous hemorrhage. Upon clearance of her hyphema and vitreous hemorrhage after 14 days, she was found to have a retinal detachment and was referred to our center. Fundus examination demonstrated an arcuate choroidal rupture nasal to the optic nerve. There was a retinal dialysis from 2-4 o’clock with subretinal fluid from 1-5 o’clock that spared the macula. She underwent successful urgent retinal detachment repair with primary scleral buckle procedure. Contributor: Andrew Doan, MD, PhD","u":"pages/choroidal-rupture.html#gsc.tab=0:~:text=Retinal%20Dialysis%20and%20Choroidal%20Rupture%20after%20Blunt%20Trauma","cr":"Austin R. Fox, MD","src":"er"},{"t":"Pathologic myopia with bilateral posterior staphylomas","im":[["E:pages/Pathologic-Myopia/myopic-degen-OCT-OD-LRG.JPG","Fundus OD."],["E:pages/Pathologic-Myopia/myopic-degen-OCT-OS-LRG.JPG","Fundus OS."]],"h":"Randy Verdick, FOPS Pathologic myopia is defined as myopia over -8.00 D or an axial eye length >32.5 mm. These eyes may undergo progressive elongation with development of degenerative changes of the retina, retinal pigmented epithelium (RPE), and choroid. These photographs show the fundus findings in two eyes with a spherical prescription of -17.00 D. Note the tilted optic discs, peripapillary atrophy, central macular RPE thinning with several discrete regions of RPE atrophy in the left eye, and bilateral posterior staphylomas (the central maculae appear blurred as they are out of the plane of focus). The OCT images show the staphylomas more clearly as a bowing of the posterior structures of the eye.","u":"pages/Pathologic-Myopia/index.htm","cr":"Jesse Vislisel, MD","src":"er"}]},{"n":"Optic nerve OCT","b":"RNFL thinning, swelling and drusen on OCT.","items":[{"t":"Bayoneting of vessels and bean-pot cupping in advanced glaucoma","im":[["E:pages/Bean%20Pot%20Cupping/OCT-LRG.jpg","Optical coherence tomography analysis of the optic nerve head (ONH), retinal nerve fiber layer (RNFL), and ganglion cell layer fiber layer of both eyes. Left image: Both eyes demonstrate marked ONH cupping and diffuse RNFL loss. Right image: Both eyes demonstrate marked ganglion cell loss of the macula."]],"h":"Glaucoma is an optic neuropathy characterized by remodeling of the optic nerve head with loss of neural tissue resulting in distinctive visual field defects [1]. It is the leading cause of irreversible blindness worldwide, and by the year 2040, an estimated 111.8 million individuals will be affected [2]. Historically, visualization of the optic nerve head has been used to assess disease severity. The optic nerve head contains a cup which is delineated by the neuroretinal rim. Normal cup-disc ratios range from 0.1 to 0.4, but as neural rim tissue is lost, the cup progressively enlarges and the underlying lamina cribrosa becomes more apparent [1]. In severely advanced glaucoma with complete loss of retinal tissue, retinal vessels may disappear as they make a sharp turn into the cup, termed bayoneting or \"bean-pot\" cupping. Deeper vessels as they re-emerge may appear out of focus [3].","u":"pages/Bean%20Pot%20Cupping/bean-pot-cupping.htm","cr":"Ryan J. Diel, MD, Brittni A. Scruggs, MD, PhD","src":"er"},{"t":"Megalopapillae and severe glaucoma","im":[["E:pages/Megalopapillae-severe-glaucoma/megalopapillae-severe-glaucoma-OCT-LRG.jpg","This OCT shows bilateral megalopapillae with a disc area of 4.18 mm2 in the right eye and severe cupping in this 44-year-old African male with juvenile open glaucoma, initially diagnosed at age 24."]],"h":"This OCT shows bilateral megalopapillae with a disc area of 4.18 mm2 in the right eye and severe cupping in this 44-year-old African male with juvenile open glaucoma, initially diagnosed at age 24.","u":"pages/Megalopapillae-severe-glaucoma/index.htm","cr":"Elisabeth Aponte, MD","src":"er"},{"t":"Optic Disc Notch and Retinal Nerve Fiber Layer Defect in Primary Open Angle Glaucoma","im":[["E:photos/inf-notch/inf-notch-NFL-defect-macula.PNG","The optic nerve shows moderate cupping but there is a prominent inferior notch. The normal sheen of the nerve fiber layer is absent in a distribution radiating temporally from this notch due to cellular loss. The notch and nerve fiber layer defect can be more easily visualized on optical coherence tomography."],["E:photos/inf-notch/inf-notch-NFL-defect-OCT-orig.PNG","Humphrey visual field shows a corresponding superior arcuate scotoma."]],"h":"The optic nerve shows moderate cupping but there is a prominent inferior notch. The normal sheen of the nerve fiber layer is absent in a distribution radiating temporally from this notch due to cellular loss. The notch and nerve fiber layer defect can be more easily visualized on optical coherence tomography. Humphrey visual field shows a corresponding superior arcuate scotoma.","u":"pages/inf-notch-NFL-defect-HVF.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Idiopathic Intracranial Hypertension (IIH, Pseudotumor Cerebri)","im":[["E:pages/imgs/R_15Xz1btqzJt4omd_OD_OCT.png","In the right eye nerve OCT there is intraretinal schisis next to the right nerve and in the papillomacular bundle, and abrupt RPE atrophy."],["E:pages/imgs/R_15Xz1btqzJt4omd_OS_OCT.png","In the left eye nerve OCT there is abrupt RPE atrophy as seen in the right eye."]],"h":"In the right eye nerve OCT there is intraretinal schisis next to the right nerve and in the papillomacular bundle, and abrupt RPE atrophy. In the left eye nerve OCT there is abrupt RPE atrophy as seen in the right eye.","u":"pages/IIH.htm","cr":"Kimberly Winges, MD","src":"er"},{"t":"Non-arteritic anterior ischemic optic neuropathy (NAION)","im":[["E:photos/NAION/Fig7-OCT-optic-nerves-bilateral-superior-RNFL-bundle-loss.jpg","OCT of the optic nerves showed bilateral superior RNFL bundle loss corresponding with the above photo. (Fig. 7)"]],"h":"March 22, 2023 45-year-old man who awoke with left sided inferior visual field loss. Seventeen months after first presentation, his visual acuities were 20/15-1 OD and 20/50-2 OS. Funduscopic examination showed superior segmental optic disc (asterisk) pallor and loss of the RNFL bundle superiorly (black arrow) versus normal RNFL inferiorly (green arrow) in both eyes. (Fig. 5 and 6) Contributor: Andrew Doan, MD, PhD and Sohan S. Hayreh, MD, PhD This patient experienced bilateral vision loss on awakening. She had bilateral optic nerve swelling with the visual fields below.","u":"pages/non-arteritic-anterior-ischemic-optic-neuropathy-NAION.html","cr":"Noor-Us-Sabah Ahmad, MD; Salma Dawoud, MD","src":"er"},{"t":"Neuroretinitis","im":[["E:pages/Neuroretinitis/Neuroretinitis-1b.jpg","Oct Day 1"],["E:pages/Neuroretinitis/Neuroretinitis-2b.jpg","Oct Day 7"],["E:pages/Neuroretinitis/Neuroretinitis-3b.jpg","Oct Day 21"]],"h":"Patient presented with sudden onset decreased vision in his left eye. Fundus photos show the progression of macular star at presentation (Figure 1), 1 week later (Figure 2), and three weeks later (Figure 3). Ocular Coherence Tomography at these same visits shows significant outer retinal fluid in the nasal macula reaching the fovea center. The OCTs show gradual resolution of the intraretinal fluid and deposition of hyper-reflective material in the outer plexiform layer at the fovea, called the nerve fiber layer of Henle, and fluid here gives the classic appearance of a \"macular star\". The patient was serum positive for Bartonella henselae (Cat Scratch Disease). Neuroretinitis 2: Bartonella Neuroretinitis Neuroretinitis 2: Bartonella Neuroretinitis1 Contributor: Jeffrey Welder, MD 34-year-old female diagnosed with Bartonella neuroretinitis and cilioretinal artery occlusion of the left eye. She presented with a \"gray spot\" in her vision. Exam revealed an RAPD OS. Photos demonstrate appearance on presentation, 1 week, 3 weeks, 4 weeks, and 8 weeks after presentation. Patient was treated with oral Azithromycin at 5 weeks after presentation when positive bartonella serology returned. Photo sequence: Neuroretinitis 3 Neuroretinitis 3 Contributor: Justin Risma, MD Neuroretinitis 4 Neuroretinitis 4 Contributor: James M. Coombs, MD Neuroretinitis 5 Neuroretinitis 5 Contributor: Andrew Doan, MD, PhD","u":"pages/Neuroretinitis/index.htm","cr":"Tyler B.S. Risma, MD; Morgan Bertsch, BS; Jeffrey Welder, MD","src":"er"},{"t":"Anomalous appearing optic nerves in both eyes","im":[["E:photos/Drusen-ON-or-disc/optic-disc-drusen-fundus-5yo-1.jpg",""]],"h":"5 year old girl anomalous appearing optic nerves in both eyes, which appeared elevated on stereoscopic exam, concerning for optic disc edema.","u":"pages/anomalous-optic-nerves.htm","cr":"Pavlina S. Kemp, MD","src":"er"},{"t":"Bow-tie (band) atrophy secondary to compressive optic neuropathy","im":[["E:photos/bow-tie-atrophy/OCT.jpg","Ocular coherence tomography of the macula showed diffuse ganglion cell layer (GCL) thinning OD and nasal GCL thinning OS."]],"h":"Susan J. Wright The patient was a 57-year-old man with vision loss in the right eye (OD) greater than left eye (OS) in the setting of a craniopharyngioma, which was resected 16 years prior. His visual acuity had been no light perception OD and 20/20 OS since the procedure. Summary: Contrast-enhanced magnetic resonance imaging (MRI) of the brain and orbits showed a stable tiny ring-enhancing cystic lesion anterior to the pituitary infundibulum and atrophy of the right greater than left optic nerves. The presence of bow-tie, or band, atrophy suggests that there is a compressive optic neuropathy from an anterior chiasmal and/or medial, posterior optic nerve lesion. This clinical sign warrants further evaluation with magnetic resonance imaging (MRI) or computed tomography (CT) in a patient with unexplained vision loss. Unilateral band atrophy can also be seen in a patient with a unilateral optic tract lesion.","u":"pages/bow-tie-atrophy.htm","cr":"Brittni A. Scruggs, MD, PhD; Matthew J. Thurtell, MD","src":"er"},{"t":"Optic Disc Drusen","im":[["W:photos/optic-disc-drusen/1b-SD-OCT-ou-LRG.jpg","Spectral domain optical coherence tomography (SD-OCT). Buried optic disc drusen are denoted by the white arrows. Buried optic disc drusen are characterized as oval hyporeflective voids with overlying scattered hyperreflective dots [1]. Optic disc drusen should be differentiated from blood vessels seen in cross-section (red arrow) with underlying shadowing [2]."],["W:photos/optic-disc-drusen/1d-ultrasound-echography-ou-LRG.jpg","Ultrasound echography. In cases of extruded/exposed optic disc drusen, the drusen are easily visible on fundus exam, SD-OCT, and/or autofluorescence as demonstrated in A-C. Ultrasound echography may be needed to idenitify very deep calcified drusen. Calcified drusen are seen on ultrasound as hyperechoic with posterior shadowing (white arrows) [1]."]],"h":"Nicole M. Radunzel (photography) and Laura L. Warner (echography) Color fundus photography (A), spectral domain optical coherence tomography (B), fundus autofluorescence (C), and ultrasound echography (D) of the right and left eyes in a 28 year-old female who presented for evaluation of pseudopapilledema and blurry vision Contributor: Robert B Dinn, MD and Wallace L. M. Alward, MD , University of Iowa","u":"pages/Optic-Disc-Drusen.html","cr":"Bethlehem Wole, BS","src":"er"},{"t":"Leber’s Hereditary Optic Neuropathy","im":[["E:photos/Lebers_2023/Fig.%205.jpg",""],["E:photos/Lebers_2023/Fig.%206.jpg",""]],"h":"Nicole Radunzel, Paul Swihart (perimetry) March 22, 2023 The patient was a 53-year-old male found to have Leber’s hereditary optic neuropathy (positive for mutation 11778). Fundus photos showed congestion of both optic nerves with telangiectic vessels visible. (Fig 1 and 2) Goldmann visual field testing showed a ceco-central scotoma in the right eye on presentation which stayed stable on subsequent follow-up. (Fig. 3) Five years later, a large ceco-central scotoma developed in the left eye. (Fig. 4) Vision was 20/25 OD and 20/100 OS. There was a history of alcohol use before each of the two episodes of visual loss. OCT showed thickening of the RNFL layer despite thinning of the underlying GCL bilaterally, characteristic of Leber’s. (Fig. 5 and 6) RNFL thickening can be seen in Leber’s even prior to development of visual symptoms and in carriers of the mutation.1 Reference: Barboni P, Savini G, Feuer WJ, et al. Retinal nerve fiber layer thickness variability in Leber hereditary optic neuropathy carriers. Eur J Ophthalmol. 2012;22(6):985-991.","u":"pages/lebers-hereditary-optic-neuropathy.htm","cr":"Noor-Us-Sabah Ahmad, MD; Salma Dawoud, MD","src":"er"},{"t":"Tuberous Sclerosis with Optic Nerve Hamartoma","im":[["E:photos/Noncalcified-astrocytic-hamartoma-rp/hamartoma-2.jpg",""],["E:photos/Optic-Nerve-hamartoma/Fig2.jpg",""]],"h":"Retinal astrocytic hamartomas are the most common ocular finding of tuberous sclerosis complex. Note the obvious calcified astrocytic hamartomas in both eyes, commonly referred to a \"mulberry lesions\" due to their multinodular appearance. The right fundus also contains a more subtle non-calcified astrocytic hamartoma which can be spotted as a hazy area overlying the superotemporal arcade. Noncalcified Astrocytic Hamartoma in the setting of Retinitis Pigmentosa Noncalcified Astrocytic Hamartoma in the setting of Retinitis Pigmentosa Contributor: Morgan Bertsch, BS and Tyler B.S. Risma, MD This patient with a history of autosomal recessive retinitis pigmentosa (RP) presented with an amelanotic juxtapapillary retinal lesion consistent with noncalcified astrocytic hamartoma of the left eye. Astrocytic hamartomas are typically associated with tuberous sclerosis or neurofibromatosis, but unilateral solitary lesions have been seen in otherwise normal patients. Several cases of bilateral and unilateral astrocytic hamartomas in the setting of RP have been documented. Calcified astrocytic hamartomas appear as white nodular lesions with patchy calcifications overlying the optic disc with a classic \"mulberry\" appearance. Non-calcified astrocytic hamartomas appear as flat, soft, smooth-appearing, translucent or semi-translucent lesions. It is important to differentiate a calcified astrocytic hamartoma from optic nerve drusen, which is more commonly found in association with RP. Tuberous Sclerosis with Optic Nerve Hamartoma Tuberous Sclerosis with Optic Nerve Hamartoma Contributor: Aaron M. Ricca MD This patient is a 9-year-old female with tuberous sclerosis and an optic nerve hamartoma of the right eye, which in this case appears similar to unilateral optic disc swelling. She has subretinal fluid adjacent to the optic nerve and over the domed hamartoma, as visualized on optical coherence tomography (OCT) of the retina. Note that she has atrophy of the retinal pigmented epithelium (RPE) in the area of subretinal fluid in a \"water mark\" fashion. A large choroidal nevus is visible under the inferior arcade. Fortunately, her visual acuity remains 20/20, as the subretinal fluid spares the fovea.","u":"pages/retinal-astrocytic-hamartomas.htm","cr":"Jesse Vislisel, MD","src":"er"}]},{"n":"Anterior segment OCT","b":"Cornea, grafts, angle and implants.","items":[{"t":"Normal cornea (AS-OCT)","im":[["https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0f/Spectral_Domain_OCT_-_Corneal_Cross-Section_%28and_Pachymetry_Map%29.png/1280px-Spectral_Domain_OCT_-_Corneal_Cross-Section_%28and_Pachymetry_Map%29.png",""]],"h":"The healthy cornea of a 24 year old male (cross-section view). Corneal epithelium, stroma, and endothelium can be clearly seen. Below, a pachymetry map has been calculated from other cross-section data on the same cornea. Central corneal thickness in this patient is lower than average. This image is","u":"https://commons.wikimedia.org/wiki/File:Spectral_Domain_OCT_-_Corneal_Cross-Section_(and_Pachymetry_Map).png","cr":"Wies6014 · CC BY-SA 4.0","src":"wm"},{"t":"Corneal Hydrops","im":[["E:pages/Corneal-Hydrops/hydrops-OCT-LRG.jpg","Anterior segment OCT of the patient in Figure 1 demonstrating the severe stromal edema in the area of involvement with underlying det"],["E:pages/Corneal-Hydrops/Hydrops-OCT-fig3LRG.jpg","Anterior segment OCT of a patient with keratoconus and severe corneal hydrops. These images demonstrate the large, cystic accumulati"],["E:pages/Corneal-Hydrops/Hydrops-OCT-2-LRG.jpg","Acute corneal hydrops with severe inferior corneal stromal edema and overlying microcystic edema and bullae in the setting of advanced keratoconus. These photographs were taken 1 week after onset of the episode."]],"h":"Jody Troyer Corneal hydrops is the acute onset of corneal edema due to a break in Descemet membrane. This condition may be seen in individuals with advanced keratoconus or other forms of corneal ectasia. Recovery may take weeks to months with medical therapy, but may be accelerated by the placement of air or gas into the anterior chamber to slow the influx of aqueous into the cornea. Scarring, and sometimes corneal flattening, will occur after resolution of the episode. Entry #1 Entry #1 Contributor: Matthew Meyer, MD Photographer: Sarah Skiles February 12, 2024 Oblique slit-lamp view of acute corneal hydrops highlighting significant apical corneal edema with corresponding anterior slit-lamp view and corneal tomography. Entry #2 Entry #2 Contributor: Jesse Vislisel, MD Photographer: Jody Troyer","u":"pages/Corneal-Hydrops/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Band keratopathy","im":[["E:photos/band/Cornea_ASOCT.jpg","This is a chronically inflamed eye with a cataracta complicata and a chronic, smouldering uveitis. Band keratopathy occurs commonly in such eyes."]],"h":"Retired Clinical Assistant Professor of Ophthalmology, University of Rochester School of Medicine and Dentistry *Dr. Caccamise has very generously shared his images of patients taken while operating during the \"eye season\" in rural India as well as those from his private practice during the 1960's and 1970's. Many of his images are significant for their historical perspective and for techniques and conditions seen in settings in undeveloped areas.","u":"pages/band-keratopathy.htm","cr":"Meagan Seay, DO and Nasreen Syed, MD","src":"er"},{"t":"Granular corneal dystrophy","im":[["E:pages/Granular-corneal-dystrophy/GCD-OS-OCT-lrg.jpg","Slit lamp photo, OS, demonstrate gray-white breadcrumb-like opacities in the anterior cornea, which is classic for granular dystrophy."]],"h":"This 30-year-old Chinese female presented for evaluation of granular corneal dystrophy. She had a strong family history of cornea problems suggesting an autosomal dominant inheritance which supported the diagnosis of BIGH3 (Transforming Growth Factor Beta 1 gene, TGFβ1) related disease. Vision was 20/20 in both eyes.","u":"pages/Granular-corneal-dystrophy/index.htm","cr":"David Phillips, MD","src":"er"},{"t":"Corneal edema with Descemet's membrane folds after DMEK","im":[["E:pages/D-folds-p-DMEK/D-folds-sp-DMEK-OCT-LRG.jpg",""]],"h":"TThis patient had residual corneal edema with prominent Descemet's membrane folds visible on the posterior corneal surface on her first postoperative day after undergoing Descemet's membrane endothelial keratoplasty (DMEK). In the first photograph, the anterior chamber is 70% filled with SF6 gas and a superotemporal limbal suture can be seen. Anterior segment OCT verifies that the lenticule is in place and also shows the folds on the posterior corneal surface. After several days, the corneal edema eventually cleared and guttae were visible centrally in the graft tissue, consistent with Fuchs' endothelial dystrophy of the donor. These guttae are visible in the second photograph and this is likely the cause for delayed corneal clearing. Despite this, the patient still achieved 20/20 acuity.","u":"pages/D-folds-p-DMEK/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Descemet Membrane Endothelial Keratoplasty (DMEK)","im":[["E:pages/DMEK/4---DMEK-edge-lift-05583822%5B1%5D-LRG.jpg","post-operative appearance of patientd who underwent DMEK for Fuchs endothelial corneal dystrophy at 1 week post-operatively with residual anterior chamber gas bubbles"]],"h":"Descemet Membrane Endothelial Keratoplasty (DMEK) is a partial-thickness cornea transplant procedure that involves selective removal of the patient's Descemet membrane and endothelium, followed by transplantation of donor corneal endothelium and Descemet membrane without additional stromal tissue from the donor.","u":"pages/DMEK/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Graft edge lift after Descemet's membrane endothelial keratoplasty (DMEK)","im":[["E:pages/DMEK-edge-lift/graft-edge-lift-2-LRG.jpg",""],["E:pages/DMEK-edge-lift/graft-edge-lift-OCT-LRG.jpg",""]],"h":"Descemet's membrane endothelial keratoplasty (DMEK) is a subtype of corneal transplantation in which a very thin donor lenticule consisting of Descemet's membrane and endothelium is transplanted into the recipient eye. During the surgery, a gas bubble is placed into the anterior chamber to press the graft against the posterior surface of the host cornea, resulting in adherence. Graft \"edge lift\" refers to non-adherence of peripheral areas of the graft. If the graft is oriented correctly with the endothelium facing toward the anterior chamber, it will roll, or scroll, toward the host corneal stroma. These photographs show an inferior edge lift of a DMEK graft, visible as a thin layer illuminated by the slit beam just deep to the corneal stroma with scrolling inferiorly. The anterior segment OCT shows another view of the edge lift.","u":"pages/DMEK-edge-lift/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Deep Anterior Lamellar Keratoplasty (DALK)","im":[["https://webeye.ophth.uiowa.edu/eyeforum/tutorials/Cornea-Transplant-Intro/1--DALK-detachment-99074863-400px.jpg","Anterior segment optical coherence tomography demonstrating the redundant host Descemet membrane and endothelium in poor appositi"]],"h":"Deep anterior lamellar keratoplasty (DALK) is a partial-thickness cornea transplant procedure that involves selective transplantation of the corneal stroma, leaving the native Descemet membrane and endothelium in place. Read the related article for more information regarding modern corneal transplantation techniques.","u":"pages/DALK/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Corneal melt around Boston type I keratoprosthesis","im":[["E:pages/kPro-melt/ASOCT-KPro-normal-LRG.jpg","Normal appearance of Boston type I keratoprosthesis device on anterior segment OCT."],["E:pages/kPro-melt/5---KPRO-98227362-LRG.jpg","Anterior segment optical coherence tomography demonstrating the appearance of a Boston Type I Kpro with healthy corneal tissue sur"]],"h":"Boston keratoprosthesis devices require regular monitoring to assess for the presence of complications such as infection and corneal melt. Anterior segment optical coherence tomography (OCT) is a useful study to assess for the presence of corneal thinning or melt. We regularly use OCT to monitor the status of the cornea around the device.","u":"pages/kPro-melt/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Peters anomaly","im":[["https://eyerounds.org/cases-i/case187/Peters-anomaly-OCT.jpg","Anterior segment optical coherence tomography (OCT) in a neonate with Peters anomaly. Note the iridocorneal adhesions and the regi"]],"h":"Peters anomaly is a rare congenital disorder in the spectrum of anterior segment dysgenesis. Findings include corneal opacities and absence of normal posterior corneal structures. Iridocorneal or corneolenticular adhesions may be present.","u":"pages/Peters/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Post-operative angle closure glaucoma following Descemet’s Membrane Endothelial Keratoplasty (DMEK)","im":[["E:photos/angle-closure-OCT.jpg",""]],"h":"This is an anterior segment OCT of a patient that underwent DMEK and cataract surgery the day prior. Intraoperatively, the anterior chamber was filled 80-90% with SF6 20% gas to hold the graft in place. She presented the following day with sudden onset of acute eye pain with headaches. OCT showed that the angle was closed with evidence of iridocorneal touch shown. Mechanistically, this was thought to be caused by either the anterior chamber gas tracking through the pupil into the posterior chamber and prolapsing the iris forward to close the angle or prolapsing the IOL forward to induce pupillary block. By the time the patient was repositioned and examined at the slit lamp, the gas had tracked back into the anterior chamber either through the patent peripheral iridotomy or pupil and the chamber was deep with a normal intraocular pressure.","u":"pages/angle-closure-post-DMEK.htm","cr":"Christopher Kirkpatrick, MD","src":"er"},{"t":"Phacomorphic Angle Closure and Anterior Lens Dislocation due to Repeated Blunt Trauma","im":[["E:photos/Angle-closure-traumatic-cataract/Fig2-LRG.jpg",""]],"h":"This 46-year-old female patient had a history of repeated self-induced blunt force trauma to both eyes. She initially presented with anterior lens dislocation with pupillary block in her right eye (Figure 1). She then presented seven months later in angle closure and with a mature cataract in her left eye (OS). Blunt trauma causes abrupt anteroposterior shortening and resultant equatorial stretching that may lead to zonular rupture and lens dislocation [1]. Phacomorphic angle closure may occur when a mature cataract pushes the iris forward, which is demonstrated on her anterior segment optical coherence tomography (Figure 2). Her lens thickness (LT) OS was 5.36 mm; the average LT for patients between 36 and 50 years is 4.05 ± 0.20 mm [2]. Lensectomy is the definitive treatment for both phacomorphic angle closure and pupillary block secondary to lens dislocation. Slit lamp photograph of the right eye shows 3+ diffuse injection with the crystalline lens filling the anterior chamber, lenticulocorneal touch, stromal edema, 360 degree iridocorneal touch, and posterior capsule opacification. Intraocular pressure was 40 mmHg at presentation. Anterior segment optical coherence tomography (AS-OCT) of the left eye. The perpendicular distance between the anterior pole of the lens and the horizontal line between the scleral spurs on AS-OCT (i.e., lens vault, LV) was greater than 1042 microns. Based on a study by Moghimi, et al., the average LV value in controls is 391.7 +/- 377.4 microns, and an LV greater than 1042 microns increases the risk of developing phacomorphic angle closure 12 times [3]. This parameter distinguishes phacomorphic angle closure from that of acute primary angle closure [3].","u":"pages/angle-closure-traumatic-cataract.htm","cr":"Lauren E. Hock, MD and A. Tim Johnson, MD, PhD","src":"er"},{"t":"EVO+ Visian Implantable Collamer Lens (ICL) Implant","im":[["E:pages/imgs/AS_OCT.png","Anterior segment ocular coherence tomography (AS-OCT) demonstrates a 720 micron distance, or \"vault\", between the implant and the natural le"]],"h":"Implantable Collamer Lens (ICL) are a minimally invasive technique to correct myopia with or without astigmatism. Implantation of these devices is reversible and can be used in patients who do not qualify for corneal refractive procedures, such as LASIK or PRK. Traditional models require a peripheral iridotomy to permit aqueous humor flow and decrease risk of pupillary block or cataract formation. Approved by the Food and Drug Administration (FDA) in 2022, the EVO+ Visian ICL includes a 0.36 mm central port which intrinsically allows for aqueous humor flow, eliminating the need for peripheral iridotomy. Some patients report ring-shaped dysphotopsias from this central port. Neuroadaptation typically occurs 3-6 months after implantation. Reference: EVO ICL Patient Information Booklet. Patient brochure. STAAR Surgical Company. 2021. Accessed June 6, 2026. https://www.staar.com/file/MKT-0475-Rev-1-US-EVO-PIB.pdf Eom Y, Kim DW, Ryu D, et al. Ring-shaped dysphotopsia associated with posterior chamber phakic implantable collamer lenses with a central hole. Acta Ophthalmol. 2017;95(3):e170-e178. doi:10.1111/aos.13248","u":"pages/EVO-Visian-Implantable-Collamer-Lens(ICL)-Implant.htm","cr":"Sabah Munir, MSPH; Lauren A. Tomlinson, MD","src":"er"},{"t":"Appropriate Scleral Lens Sagittal Depth","im":[["E:photos/appropriate-scleral-lens-sagittal-depth/perfect-sag_09640126-LRG.jpg",""],["E:photos/appropriate-scleral-lens-sagittal-depth/perfect_sag_04841281-LRG.jpg",""]],"h":"Scleral contact lenses rest on the sclera, vaulting over the entire cornea and limbus to avoid irritating or scarring those tissues. The amount of space between the lens and the cornea is typically referred to as sag. Sagittal depth actually refers to the entire contact lens from the center of the lens to the plane that the edges circumscribe. Various brands of scleral contact lenses allow you to manipulate the sag in different ways in order to achieve the desired vault over the cornea. Some brands allow you to actually specify the sagittal depth where others require you to manipulate the base curve. A steeper base curve typically results in increased sagittal depth where a flatter base curve reduces it. Regardless of how you achieve clearance over the corneal surface, there is an ideal amount of space between cornea and lens. Larger diameter sclerals typically have deeper sag. We must clear the cornea by enough space that if there are small variations in corneal shape or if the lens settles deeper into the squishy conjunctival tissue that we remain vaulted over the cornea and the limbus. Too much sag is not desirable because it reduces oxygen transmission (think Dk/t where the thickness of the saline layer between the cornea and the lens is t) and reduces BCVA. Good sagittal depth for a scleral lens is typically between 100-500 um centrally. Typical scleral lens thickness is between 250-500 um so if you know the center thickness of your lens you can use this to eyeball it in the slit lamp, but it is much more satisfying to measure it with OCT. In the slit lamp image you see here, the saline layer has debris in it making it appear speckled which made it easier to appreciate. Having fluorescein in this saline makes it much, much easier to see.","u":"pages/appropriate-scleral-lens-sagittal-depth.htm","cr":"Tressa Larson OD","src":"er"},{"t":"Conjunctival lymphangiectasis","im":[["E:photos/conjunctival-lymphangiectasis/conj-lymphangiectasis-3.jpg",""]],"h":"The patient was a 57-year-old man with vision loss in the right eye (OD) greater than left eye (OS) in the setting of a craniopharyngioma, which was resected 16 years prior. His visual acuity had been no light perception OD and 20/20 OS since the procedure.The below pictures show this condition in a young, asymptomatic patient. Included is an anterior segment OCT centered over the area of interest.","u":"pages/conjunctival-lymphangiectasis.htm","cr":"Christopher A Kirkpatrick, MD","src":"er"},{"t":"Epithelial downgrowth","im":[["E:photos/epithelial-downgrowth/epithelial-cells-OCT-LRG.jpg","Optical coherence tomography of the anterior segment demonstrating a hyperreflective sheet of presumed epithelial cells extending"]],"h":"Epithelial downgrowth is a rare complication of intraocular surgery or penetrating ocular trauma. Epithelial invasion into the anterior chamber occurs when non-keratinized epithelial cells migrate through a surgical or traumatic corneal wound. Once in the anterior chamber, epithelial cell migration may lead to corneal decompensation, recalcitrant glaucoma, and occasionally invade the posterior pole. Treatments are generally limited and when employed are often ineffective. Epithelial downgrowth Epithelial downgrowth Contributors: Jesse Vislisel, MD Photographer: Stefani Karakas, CRA Epithelial downgrowth is a condition in which corneal or conjunctival epithelial cells are introduced into the eye by penetrating trauma or surgery. An epithelial membrane then grows over the internal structures of the eye and can often be visible as a translucent membrane growing over the corneal endothelium. This patient had an intracapsular cataract extraction performed in the past and a recent secondary anterior chamber intraocular lens placed. She subsequently developed elevated intraocular pressure secondary to epithelial downgrowth, visible here as a faint membrane over her superior cornea. The demarcation of this membrane and the diffuse microcystic edema of the cornea can be more easily seen on the retroillumination photograph.","u":"pages/epithelial-downgrowth.htm","cr":"Ryan J. Diel, MD, Mark A. Greiner, MD, Jennifer J. Ling, MD","src":"er"},{"t":"Focal Scleral Nodule","im":[["E:pages/imgs/R_1WCmzs1rCWcV0GG_Fig_2_Scleral_Nodule_OCT_Mac_OD.jpeg","Dedicated OCT line scan over the lesion shows hyporeflective lesion in the sclera resulting in domed elevation of the overlying choroid and retina, without subretinal fluid."]],"h":"Focal scleral nodules (previously called solitary idiopathic choroiditis or unifocal helioid choroiditis) are rare, amelanotic, intrascleral lesions localized to the posterior segment of the eye. They are often elevated and yellow or white in color. These lesions are typically asymptomatic and are incidentally found on dilated fundus exam. It is uncertain whether the lesions are congenital or the result of an old inflammatory process. In the case shown here, there was overlying retinal pigment epithelium disruption without subretinal fluid. If asymptomatic, these lesions are observed without intervention. Reference(s): Shields JA, Shields CL, Demirci H, Hanovar S. Solitary idiopathic choroiditis: the Richard B. Weaver lecture. Arch Ophthalmol. 2002 Mar;120(3):311-9. doi: 10.1001/archopht.120.3.311. PMID: 11879134. Fung AT, Waldstein SM, Gal-Or O, Pellegrini M, Preziosa C, Shields JA, Welch RJ, Dolz-Marco R, Sarraf D, Nagiel A, Lalane R, Jung JJ, Ghazi NG, Ramtohul P, Arnold JJ, Sakurada Y, Choudhry N, Balaratnasingam C, Freund KB, Shields CL. Focal Scleral Nodule: A New Name for Solitary Idiopathic Choroiditis and Unifocal Helioid Choroiditis. Ophthalmology. 2020 Nov;127(11):1567-1577. Epub 2020 Apr 22. PMID: 32507351. Fung AT, Kaliki S, Shields CL, Mashayekhi A, Shields JA. Solitary idiopathic choroiditis: findings on enhanced depth imaging optical coherence tomography in 10 cases. Ophthalmology. 2013 Apr;120(4):852-8. Epub 2012 Dec 12. PMID: 23246121.","u":"pages/Focal_Scleral_Nodule.html","cr":"Lauren A. Tomlinson MD; Nicole A. Somani MD","src":"er"}]}],"slit":[{"n":"Normal anatomy & harmless variants","b":"Normal cornea, lens and iris first — then findings you should recognise and leave alone.","items":[{"t":"Normal cornea","im":[["E:pages/Normal-Cornea/normal-cornea-LRG.jpg",""],["E:pages/Normal-Cornea/normal-cornea-2-LRG.jpg",""]],"h":"These slit lamp photographs show the appearance of the normal adult cornea. Notice its clarity and smooth, regular contour.","u":"pages/Normal-Cornea/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Clear crystalline lens","im":[["E:pages/Clear-Lens-normal/clear-lens-LRG.jpg",""]],"h":"This slit lamp photo shows the clear crystalline lens of an 11-year-old child. The normal Y-sutures of the lens are faintly visible in the photograph.","u":"pages/Clear-Lens-normal/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Zonules of Zinn","im":[["E:photos-earlier/Zonules_0220051.jpg","In this photograph, a few pigment flecks, likely shed from the iris, can be seen attached to the zonules."]],"h":"The zonules can be readily visualized in the dilated pupil of this patient with Marfan's syndrome (see Marfan's syndrome in this atlas). The Zonules (of Zinn) are a ring of fibrous strands, composed mainly of elastin microfibrils, that extend from the cilary body to the equator of the lens capsule and thus suspending the lens in place.","u":"pages/Zonules-of-Zinn.html","cr":"Jordan Graff, MD","src":"er"},{"t":"Iris processes","im":[["E:pages/Iris-processes/iris-processes-LRG.jpg",""]],"h":"Iris processes are fine, lacy projections of peripheral iris tissue extending to the scleral spur or trabecular meshwork. They are a benign finding and are often seen in otherwise normal eyes.","u":"pages/Iris-processes/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Posterior embryotoxon","im":[["E:photos-earlier/posterior-embryotoxon.jpg","Present in 10-15% of the normal population. Occurs in Axenfeld-Rieger Syndrome. This is an anteriorly displaced and prominent Schwalbe's line."]],"h":"Present in 10-15% of the normal population. Occurs in Axenfeld-Rieger Syndrome. This is an anteriorly displaced and prominent Schwalbe's line.","u":"pages/posterior-embryotoxon.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Corneal arcus (arcus senilis)","im":[["E:pages/Arcus/arcus-senilis-LRG.jpg",""]],"h":"Corneal arcus, also known as arcus senilis or gerontoxon, is a common degenerative change of the peripheral cornea in older adults, but may be a sign of hyperlipoproteinemia in individuals under 40 years of age. Arcus results from the deposition of lipids in the peripheral cornea, typically beginning superiorly and inferiorly and eventually encircling the entire corneal circumference as seen in this photograph. The patient in this photo also has an area of temporal iris atrophy laterally adjacent to a laser peripheral iridotomy (LPI).","u":"pages/Arcus/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Enlarged corneal nerves / Prominent corneal nerves","im":[["E:pages/Enlarged-corneal-nerves/Enlarged-corneal-nerves-LRG.jpg",""],["E:pages/Enlarged-corneal-nerves/Enlarged-corneal-nerves-CLOSE.jpg",""]],"h":"Prominent corneal nerves can be seen in many conditions including multiple endocrine neoplasia (MEN) type 2a and 2b, keratoconus, Fuch's dystrophy, leprosy, neurofibromatosis, Refsum disease, Riley-Day dysautonomia, acanthamoeba perineuritis, posterior polymorphous dystrophy, and multiple myeloma (as in this patient). They appear as fine, branching, linear, stromal opacities that extend from the limbus to the central cornea in a radial fashion.","u":"pages/Enlarged-corneal-nerves/index.htm","cr":"Justin Risma, MD","src":"er"},{"t":"Mittendorf dot","im":[["E:photos/Mittendorf-dot.jpg",""]],"h":"A Mittendorf dot is a small, circular opacity on the posterior lens capsule, classically nasal in location, which represents the anterior attachment of the hyaloid artery. The hyaloid artery is present during gestation and typically regresses completely. Failure to do so can lead to benign findings, such as a Mittendorf dot or a Bergmeister's papilla, or pathologic changes as seen in persistent fetal vasculature syndrome.","u":"pages/mittendorf-dots.htm","cr":"Matt Weed, MD","src":"er"},{"t":"Persistent pupillary membranes (1)","im":[["E:LARGE/Persistent-pupillary-membrane.PNG","Intricate webs with attachments to the lens"],["E:LARGE/Persistent-pupillary-membrane-2-LARGE.jpg","The patient's other eye."]],"h":"Persistent pupillary membranes are the result of remnants of the tunica vasculosa lentis, a vascular network that surround the lens during embryogenesis. They can vary in presentation from a few fine iris strands bridging the pupil to intricate webs with attachments to the lens.","u":"pages/persistent-pupillary-membrane.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Persistent Pupillary Membrane (2)","im":[["E:LARGE/persistent-pupillary-13-L.jpg",""]],"h":"Persistent pupillary membrane is an embryologic remnant of the tunica vasculosa lentis, the vascular bed that surrounded the lens during fetal development. This is an atypical presentation with only one single, fine iris strand that has fibrosed to the anterior lens capsule.","u":"pages/persistent-pupillary-membrane-2.htm","cr":"Christopher A Kirkpatrick, MD","src":"er"},{"t":"Epicapsular stars and persistent pupillary membrane","im":[["E:photos/epicapsular/epicapsular-stars.PNG","Epicapsular stars"],["E:photos/epicapsular/epicapsular-stars-close-up.png","Epicapsular stars (Close-up of stars)"]],"h":"Epicapsular stars are tiny, stellate, pigmented opacities on the anterior lens capsule. Persistent pupillary membranes are fine iris strands extending across the pupil to other areas of iris (type I) or to the lens (type II) as seen in this photo. Both are remnants of the tunica vasculosa lentis, a vacular network that surrounds the lens during embryogenesis.","u":"pages/epicapsular-stars.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Kunkmann-Wolffian bodies","im":[["E:pages/Kunkmann-Wolffian/Kunkmann-Wolffian-LRG.jpg",""]],"h":"Kunkmann-Wolffian bodies are hypopigmented areas of peripheral iris stromal hyperplasia in patients without Down syndrome. They are clinically indistinguishable from Brushfield spots which are seen in individuals with Down syndrome.","u":"pages/Kunkmann-Wolffian/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Down's Syndrome with Brushfield's spots on the iris","im":[["E:photos/downs.jpg",""]],"h":"Frequently seen in Down's syndrome patients, but can also been seen infrequently in children unaffected by Down's syndrome.","u":"pages/Downs-Syndrome-with-brushfields-spots-on-the-iris.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Iris mammillations","im":[["E:pages/mammillations/iris-mammillations-LRG.jpg",""]],"h":"Iris mammillations are diffuse, tiny, nodules that cover the iris surface. They are most commonly unilateral and are usually seen in darkly pigmented irides or overlying iris nevi. Mammillations can be associated with oculodermal melanocytosis or phakomatosis pigmentovascularis (PPV) type IIb and neurofibromatosis (NF) type I. They are usually sporadic, but can have autosomal dominant inheritance.","u":"pages/mammillations/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Iris nevus","im":[["E:photos/diffuse-iris-nevus.jpg","Iris nevus, diffuse"],["E:pages/iris-nevus/iris-nevus-3-LRG.jpg","Iris Nevus, diffuseThis is an example of a circumscribed iris nevus. On slit lamp examination, a well-circumscribed, brown mass is situated on the inferior iris without distortion of the surrounding iris architecture or pupil. There is no prominent vascularity to the lesion or \"sentinel vessels\" seen on the adjacent conjunctiva./figcaption>"],["E:pages/iris-nevus/iris-nevus-4-LRG.jpg","Iris Nevus, diffuseOn gonioscopy, the lesion appears to sit on top of the iris without distorting or disrupting the normal iris architecture. There is no extension into the surrounding trabecular meshwork/figcaption>"]],"h":"Iris nevi typically appear as hyperpigmented regions of the iris with minimal disruption of the normal iris architecture. However, they may occasionally be associated with ectropion uveae or sectoral cataract. There are two types of iris nevi, Circumscribed or Diffuse. Circumscribed iris nevi are discrete and often nodular. Diffuse iris nevi, as shown in the first photograph, involve an entire sector or rarely the entire iris. Iris nevi have low risk for malignant transformation. In a large case series, only 8% of iris nevi referred for evaluation at an ocular oncology center transformed into melanoma. An ABCDEF mnemonic was proposed by Shields to help remember the risk factors for growth: Age < 40 Blood (hyphema) Clock hour inferior (4:00 to 9:00) Diffuse configuration Ectropion uveae Feathery tumor margin [1]","u":"pages/iris-nevus/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Icterus/jaundice","im":[["E:photos/icterus-jaundice/conjunctival-icterus-1-LRG.jpg",""],["E:photos/icterus-jaundice/conjunctival-icterus-2-LRG.jpg",""],["E:photos/icterus-jaundice/conjunctival-icterus-3-LRG.jpg",""]],"h":"The image shows conjunctival icterus in a 49-year-old Hispanic female with decompensated alcoholic cirrhosis with severe alcoholic hepatitis. Bilirubin level is at 30 mg/dL (normal limit <=1.2 mg/dL). In addition to the yellowed conjunctiva, note the surrounding jaundiced skin. The yellow hue is better appreciated when seen in natural light and when juxtaposed with the white paper and/or the examiner's finger. The deposits of bilirubin are contained in the conjunctiva, and the color is accentuated by the white scleral background. Thus \"scleral icterus\" is technically an incorrect term.","u":"pages/icterus-jaundice.html","cr":"Zachary Q. Mortensen, MD","src":"er"},{"t":"Conjunctival concretions","im":[["E:photos/conj/ConjConcret.jpg","Asymptomatic concretions within the inferior conjunctiva"]],"h":"Asymptomatic concretions within the inferior conjunctiva","u":"pages/conjunctival-concretions.html","cr":"Jordan Graff, MD","src":"er"},{"t":"Pinguecula","im":[["E:pages/Pinguecula/pinguecula-3.LRG.jpg",""],["E:pages/Pinguecula/Pinguecula.jpg",""]],"h":"Pingueculae are yellow-white, subepithelial conjunctival deposits that are typically found in the nasal or temporal anterior bulbar conjunctiva. They can occasionally become pigmented or calcified. Pingueculae are benign and often the result of ultraviolet light exposure.","u":"pages/Pinguecula/index.htm","cr":"Jesse Vislisel, MD, Meagan Seay, DO","src":"er"},{"t":"Conjunctival varix","im":[["E:pages/Conj-Varix/conj-varix-LRG.jpg",""]],"h":"Conjunctival varices are abnormally dilated venous channels within the conjunctiva. They are typically freely mobile relative to the sclera. These venous malformations are usually asymptomatic and do not require any specific treatment. They can be excised for cosmetic reasons, but one should be aware that they may have orbital extensions.","u":"pages/Conj-Varix/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Conjunctival lymphangiectasis","im":[["E:photos/conjunctival-lymphangiectasis/conj-lymphangiectasis-1-LRG.jpg",""],["E:photos/conjunctival-lymphangiectasis/conj-lymphangiectasis-2.jpg",""]],"h":"The patient was a 57-year-old man with vision loss in the right eye (OD) greater than left eye (OS) in the setting of a craniopharyngioma, which was resected 16 years prior. His visual acuity had been no light perception OD and 20/20 OS since the procedure.The below pictures show this condition in a young, asymptomatic patient. Included is an anterior segment OCT centered over the area of interest.","u":"pages/conjunctival-lymphangiectasis.htm","cr":"Christopher A Kirkpatrick, MD","src":"er"}]},{"n":"Lids & conjunctiva","b":"Blepharitis, conjunctivitis patterns, allergy and the red eye.","items":[{"t":"Blepharitis","im":[["E:pages/blepharitis/Blepharitis.jpg",""]],"h":"Blepharitis is inflammation of the eyelid margins, often associated with staphylococcal colonization or seborrheic dermatitis. Findings include scaling and crusting around eyelashes on the anterior lid margin, as seen in this photograph, with resulting ocular surface irritation and inflammation.","u":"pages/blepharitis/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Blepharitis and meibomian gland dysfunction","im":[["E:photos/blepharitis.jpg",""]],"h":"There is some lower lid laxity, but I am pulling down on the lower lid for the photograph.","u":"pages/blepharitis-and-meibomian-gland-dysfunction.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Meibomian Gland Disease","im":[["E:pages/Meibomian-gland-disease/MGD-1b.jpg","Classic appearance of inlammed lid margin with insipated meibomian gland orifice. Contributed by Jordan M. Graff, MD and Ryen D. Fons, MS3 When the lid is pulled toward the examiner, the raised and inflammed area surrounding the gland can be better appreciated."],["E:pages/Meibomian-gland-disease/MGD-1a.jpg","Classic appearance of inlammed lid margin with insipated meibomian gland orifice. Contributed by Jordan M. Graff, MD and Ryen D. Fons, MS3With mild pressure on the lid margin, thick purulent material is expressed from the orifice."],["E:pages/Meibomian-gland-disease/MDG-fig-2-top-LRG.jpg","Meibomian Gland Disease Contributor & Photographer: Tressa Larson OD FAAO"]],"h":"Often invisible under the palpebral conjunctiva, the meibomian glands make the oil layer of the tear film. In meibomian gland disease, the glands often widen in response to stress and then begin to atrophy. Figures 2 through 4. Contributor & Photographer: Tressa Larson OD FAAO Figure 2. Meibomian Gland Disease Figure 2. Meibomian Gland Disease In meibomian gland disease, the glands often widen in response to stress and then begin to atrophy. Infrared images such the ones in figure 2 allow better visualization of the meibomian glands than the white light view. The right is the original image and the left is an enhanced version. This patient has severe meibomian gland disease. The glands nasal and temporal have dropped out entirely and the remaining glands are very short and tortuous. Figure 3. Blunted Meibomian gland on the lower lid Figure 3. Blunted Meibomian gland on the lower lid In these images it is possible to see the blunted meibomian glands on the lower lid and to see that they only extend about a quarter or halfway up the tarsal plate. Figure 4. Complete atrophy of Meibomian glands Figure 4. Complete atrophy of Meibomian glands This patient had such severe meibomian gland disease that the glands are completely atrophied. You can see where the glands used to be.","u":"pages/Meibomian-gland-disease/index.htm","cr":"Jordan M. Graff, MD; Ryen D. Fons, MS3; Tressa Larson OD","src":"er"},{"t":"Chalazion","im":[["E:photos/chalazion/Chalazion_01242005.jpg",""],["E:photos/chalazion/Chalazion2_01242005.jpg",""]],"h":"","u":"pages/Chalazion-2-.html","cr":"Jordan Graff, MD","src":"er"},{"t":"Chalazia","im":[["E:pages/Chalazia/chalazia-LRG.jpg",""]],"h":"Chalazia consist of granulomatous inflammation resulting from obstruction of the meibomian or Zeis glands in the eyelid. They typically present as painful, erythematous nodules on the eyelids. This child has multiple chalazia bilaterally.","u":"pages/Chalazia/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Rosacea","im":[["E:pages/rosacea/Rosacea-OD-LRG.jpg","Bilateral rosacea keratitis with inferior pannus formation and Salzmann-like changes. Also note the irregular lid margins with marked telangectasia and abnormal meibomian gland secretions. There is also prominent anterior blepharitis."],["E:pages/rosacea/Rosacea-OS-LRG.jpg","Bilateral rosacea keratitis with inferior pannus formation and Salzmann-like changes. Also note the irregular lid margins with marked telangectasia and abnormal meibomian gland secretions. There is also prominent anterior blepharitis."],["E:pages/rosacea/Rosacea-keratitis-LRG.jpg","Corneal ulcer secondary to ocular rosacea"]],"h":"Category(ies): Cornea, External Disease Rosacea, sometimes referred to as acne rosacea, is a chronic dermatologic condition characterized by sebaceous gland dysfunction of the face, neck, and shoulders. Patients may experience vasomotor lability and facial flushing with consumption of alcohol, hot beverages, spicy foods, or other substances. Rhinophyma is a characteristic sign, but may not be present until late in the disease. Ocular manifestations are present in 50% of cases. They include recalcitrant blepharitis, meibomian gland dysfunction, telangiectasia of the eyelid margin, and recurrent chalazia. Longstanding ocular surface inflammation can result in chronic conjunctivitis, episcleritis, iridocyclitis, keratitis, marginal corneal infiltrates, or corneal ulceration. The keratitis associated with rosacea is most commonly inferior, presumably due to the accumulation of inflammatory cytokines in the tear film above the lower lid. It results in the formation of broad, \"spade-shaped\" pannus with vessels extending into gray or white peripheral stroma, occasionally with subepithelial infiltrates at the leading edge. Findings are usually bilateral, but may be asymmetric. Krachmer, Jay H., Mark J. Mannis, and Edward J. Holland. Cornea. St. Louis, Mo: Mosby, 2011. Akpek EK, Merchant A, Pinar V, Foster CS. Ocular rosacea: patient characteristics and follow-up. Ophthalmology. 1997 Nov;104(11):1863-7. PubMed PMID: 9373118.","u":"pages/rosacea/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Distichiasis","im":[["E:pages/distichiasis/distichiasis-OS-LRG.jpg",""],["E:pages/distichiasis/distichiasis-enlarged-LRG.jpg",""],["E:pages/distichiasis/distichiasis-OD-LRG.jpg",""]],"h":"Distichiasis is the congenital or acquired presence of a partial or complete second row of eyelashes arising from the meibomian gland orifices. This is made possible because the meibomian glands and lash follicles differentiate from a common pilosebacious unit. Acquired causes occur after trauma or chronic irritation to the eyelid margin. Distichiasis Distichiasis Category(ies): Occuplastics Contributor: Patrick Donegan, MD; Thomas A. Oetting, MS, MD Photographer: Sarah Skiles, CRA April 16, 2024 Patient with history of allergic conjunctivitis presenting for one-month postoperative clinic appointment after cataract surgery with no symptoms. The clinician observed incidental distichiasis of the upper lid with no corneal damage.","u":"pages/distichiasis/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Hypertrichiasis","im":[["E:photos-earlier/hypertrichiasis.jpg","Hypertrichiasis from prostaglandin analog use in glaucoma"]],"h":"Hypertrichiasis from prostaglandin analog use in glaucoma","u":"pages/hypertrichiasis.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Molluscum contagiosum","im":[["E:photos/molluscum/molluscum-contagiosum-4-LRG.jpg",""],["E:photos/molluscum/molluscum-contagiosum-5-LRG.jpg",""],["E:photos/molluscum/Molluscum-contagiosum-2.png",""]],"h":"Molluscum lesions appear as shiny white or yellow papules with a central umbilication. They are caused by the poxvirus and can result in follicular conjunctivitis due to shedding of toxic viral particles. Contributor: Meagan Seay, DO and Nasreen Syed, MD Molluscum contagiosum is caused by the poxvirus and appears clinically as a waxy, dome-shaped nodule with a central umbilication. It may cause follicular conjunctivitis, if not treated. Histologically, eosinophilic inclusion bodies containing virus migrate to the surface and release viral particles.","u":"pages/molluscum-contagiosum.htm","cr":"Alison Bozung, OD","src":"er"},{"t":"Follicular Conjunctivitis","im":[["E:pages/follicular-conjunctivitis/follicular-conj-1-LRG.jpg","Patient 1Patient has folliculosis due to viral conjunctivitis."],["E:pages/follicular-conjunctivitis/follicular-conj-slit-1-LRG.jpg","Patient 1"],["E:pages/follicular-conjunctivitis/follicular-conj-2b-LRG.jpg","Patient 2"]],"h":"(patient 2) Conjunctival follicles are round collections of lymphocytes, often most prominent in the inferior fornix. Blood vessels may overly the follicles, but are not a prominent component within them. This helps differentiate follicles from conjunctival papillae. These photographs come from two different patients with different presentations of follicular conjunctivitis.","u":"pages/follicular-conjunctivitis/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Adenoviral conjunctivitis","im":[["E:photos/Adenovirus3.jpg",""]],"h":"Crusting, lid edema, conjunctival injection, and follicular conjunctivitis","u":"pages/Adenoviral-conjunctivitis.html","cr":"Jordan M. Graff, MD","src":"er"},{"t":"Epidemic (adenoviral) keratoconjunctivitis","im":[["E:photos/epidemic-adenoviral-keratoconjunctivitis-1.jpg",""],["E:photos/epidemic-adenoviral-keratoconjunctivitis-2.jpg",""]],"h":"29-year-old woman with 10 days of ocular redness, swelling, burning, itching and watering, associated with palpable pre-auricular lymph nodes. Exam shows scattered subepithelial infiltrates involving the visual axis.","u":"pages/epidemic-adenoviral-keratoconjunctivitis.htm","cr":"Pavlina Kemp, MD","src":"er"},{"t":"Bacterial Conjunctivitis","im":[["E:photos/bacterial_conj.jpg",""]],"h":"","u":"pages/bacterial-conjunctivitis.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Chlamydia Trachomatis Infection","im":[["E:photos/Chlamydia-1-bulbar-follicles.jpg","Follicles on the bulbar conjunctiva, characteristic of Chlamydia trachomatis infection"],["E:photos/Chlamydia-2-follicles.jpg","Note the follicles in the inferior fornix"]],"h":"Follicles on the bulbar conjunctiva, characteristic of Chlamydia trachomatis infection Note the follicles in the inferior fornix","u":"pages/Chlamydia-trachomatis-infection.htm","cr":"Elizabeth Gauger, MD","src":"er"},{"t":"Herbert's pits (trachoma)","im":[["E:photos/Herberts-pits/L/Herberts-pits-LRG.jpg",""]],"h":"Trachoma is the most common cause of infectious blindess in the world. It is caused by the bacterium Chlamyida trachomatis which is spread by poor hygiene, contaminated water, and houseflies. Acute trachoma is characterized by a follicular conjunctivitis that is usually bilateral and usually more prominent on the superior tarsal conjunctiva. Follicles may also appear at the limbus, and when these heal, they form the pathognomonic cicatrial scars pictured here, known as Herbert's pits.","u":"pages/herberts-pits.htm","cr":"Justin Risma, MD","src":"er"},{"t":"Giant Papillary Conjunctivitis","im":[["E:photos/GPC_02032005Prosthesis21.jpg","Giant papillae are seen on the tarsal surface of the inverted superior lid."],["E:photos/GPC_02032005Prosthesis12.jpg","External view of the same patient. Note that the remaining conjunctival bed is relatively quite compared to the inflamed and irritated superior palpebral surface in Figure 1."]],"h":"Giant papillae are seen on the tarsal surface of the inverted superior lid.This patient recently underwent enucleation. Since being fit for her new prosthesis a few months ago, the patient has been noticing tearing and mucous discharge. Hyperemia and papillary hypertrophy (especially on the superior tarsus) are classic signs. Mucous strands are seen both in the tear film and between the giant papillae. In addition to prosthetic eyes, other foreign bodies may irritate the conjunctiva (including contact lenses, extruding scleral buckle elements, exposed sutures or filters) and can cause GPC.","u":"pages/Giant-Papillary-Conjunctivitis.html","cr":"Jordan Graff, MD","src":"er"},{"t":"Palpebral vernal keratoconjunctivitis (VKC)","im":[["E:pages/Palpebral-vernal-keratoconjunctivitis-VKC/palpebral-VKC-LRG.jpg","Cobblestone-like giant papillae can form on the upper tarsus"],["E:pages/Palpebral-vernal-keratoconjunctivitis-VKC/palpebral-VKC-shield-ulcer-LRG.jpg","Corneal changes may be associated with the tarsal lesions including superior pannus and superior or central \"shield ulcers\""]],"h":"Vernal keratoconjunctivitis (VKC) is a seasonal disorder, predominantly seen in male children with a history of atopy. It results in inflammation of the cornea and conjunctiva. There are two subtypes of VKC, palpebral and limbal. Palpebral VKC primarily involves the palpebral conjunctiva, resulting in diffuse papillary hypertrophy most prominent on the upper lid. In severe cases, as seen in the top photograph, cobblestone-like giant papillae can form on the upper tarsus. Corneal changes may be associated with the tarsal lesions including superior pannus and superior or central \"shield ulcers,\" as seen in the bottom photograph.","u":"pages/Palpebral-vernal-keratoconjunctivitis-VKC/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Limbal vernal keratoconjunctivitis (VKC)","im":[["W:photos/limbal-Vernal-keratoconjuctivitis-1.jpg","Severe VKC in a 17-year-old Afghani Male. Note the very large \"cobblestone\" papillae of the superior tarsal conjunctiva in both lids."],["W:photos/limbal-Vernal-keratoconjuctivitis-2.jpg",""],["E:photos-earlier/VKCwithGPC_1.jpg","Severe VKC in a 17-year-old Afghani Male. Note the very large \"cobblestone\" papillae of the superior tarsal conjunctiva in both lids."]],"h":"US Military Flight Surgeon Limbal vernal keratoconjunctivitis (VKC) Limbal vernal keratoconjunctivitis (VKC) Category(ies): Cornea, External Disease, Pediatrics Contributor: Jesse Vislisel, MD Photographer: Stefani Karakas, CRA Vernal keratoconjunctivitis (VKC) is a seasonal disorder, predominantly seen in male children with a history of atopy, which results in inflammation of the cornea and conjunctiva. Limbal VKC is most common in children of African or Asian descent and may occur alone or in combination with palpebral VKC. Clinical features include Horner-Trantas dots (raised, white accumulations of eosinophils at the limbus), gelatinous limbal follicles, and copious amounts of mucoid discharge. Reference: Koczman J, Oetting TA: Vernal Keratoconjunctivitis: 8-year-old asthmatic male with reduced vision. EyeRounds.org. June 25, 2007; Available from: http://www.EyeRounds.org/cases/70-Vernal-Keratoconjunctivitis-Atopic-Asthma.htm.","u":"pages/Vernal-Keratoconjunctivitis-limbal.html","cr":"Zachary Q. Mortensen, MD; Anthony T. Chung, MD","src":"er"},{"t":"Phlyctenular Conjunctivitis","im":[["E:photos/phlyctenular-conjunctivitis/od-01-LRG.jpg",""],["E:photos/phlyctenular-conjunctivitis/os-01-LRG.jpg",""],["E:photos/phlyctenular-conjunctivitis/os-03-LRG.jpg",""]],"h":"This 20 year old male was seen on call for redness and photophobia of the left eye. On examination, three distinct limbal phlyctenules were visible (in photographs, they are stained with fluorescein). He was treated with topical steroids, lid hygiene scrubs, and antibiotic ointment to the eye and eyelid margin. When he returned two weeks later, the phlyctenules had resolved in the left eye. Phlyctenulosis is the result of a hypersensitivity to microbial antigens. In the United States, Staphylococcus aureus is the most common organism. Phylctenulosis can also occur in tuberculosis endemic areas. Management of phlyctenular conjunctivitis requires aggressive lid hygiene for blepharitis along with topical steroids and often times, antibiotics.","u":"pages/phlyctenular-conjunctivitis.htm","cr":"Alison Bozung, OD","src":
