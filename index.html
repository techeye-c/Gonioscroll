s later, he presented with decrease in vision in the right eye with right optic disc edema involving the superior part of the optic"]],"h":"March 22, 2023 45-year-old man who awoke with left sided inferior visual field loss. Seventeen months after first presentation, his visual acuities were 20/15-1 OD and 20/50-2 OS. Funduscopic examination showed superior segmental optic disc (asterisk) pallor and loss of the RNFL bundle superiorly (black arrow) versus normal RNFL inferiorly (green arrow) in both eyes. (Fig. 5 and 6) Contributor: Andrew Doan, MD, PhD and Sohan S. Hayreh, MD, PhD This patient experienced bilateral vision loss on awakening. She had bilateral optic nerve swelling with the visual fields below.","u":"pages/non-arteritic-anterior-ischemic-optic-neuropathy-NAION.html","cr":"Noor-Us-Sabah Ahmad, MD; Salma Dawoud, MD","src":"er"},{"t":"Giant Cell Arteritis (Temporal Arteritis) - GCA","im":[["E:photos/GCA/GCAfig1a.jpg","1) Shows filling defect in the peripapillary choroid and adjacent optic disc area."],["E:photos/GCA/GCAfig1b.jpg","2) Shows complete occlusion of medial posterior ciliary artery occlusion and cilioretinal artery."],["E:photos/GCA/GCAfig2a.jpg","3) Shows typically seen optic disc edema and a splinter hemorrhage at the optic disc margin in non-arteritic AION."]],"h":"1) Shows filling defect in the peripapillary choroid and adjacent optic disc area. 2) Shows complete occlusion of medial posterior ciliary artery occlusion and cilioretinal artery. 3) Shows typically seen optic disc edema and a splinter hemorrhage at the optic disc margin in non-arteritic AION.","u":"pages/Giant-Cell-Arteritis-Temporal-Arteritis-GCA.html","cr":"Andrew Doan, MD, Sohan Hayreh, MD, PhD","src":"er"},{"t":"Neuroretinitis","im":[["E:pages/Neuroretinitis/Neuroretinitis-1a.jpg","Fundus Day 1"],["E:pages/Neuroretinitis/Neuroretinitis-2a.jpg","Fundus Day 7"],["E:pages/Neuroretinitis/Neuroretinitis-3a.jpg","Fundus Day 21"]],"h":"Patient presented with sudden onset decreased vision in his left eye. Fundus photos show the progression of macular star at presentation (Figure 1), 1 week later (Figure 2), and three weeks later (Figure 3). Ocular Coherence Tomography at these same visits shows significant outer retinal fluid in the nasal macula reaching the fovea center. The OCTs show gradual resolution of the intraretinal fluid and deposition of hyper-reflective material in the outer plexiform layer at the fovea, called the nerve fiber layer of Henle, and fluid here gives the classic appearance of a \"macular star\". The patient was serum positive for Bartonella henselae (Cat Scratch Disease). Neuroretinitis 2: Bartonella Neuroretinitis Neuroretinitis 2: Bartonella Neuroretinitis1 Contributor: Jeffrey Welder, MD 34-year-old female diagnosed with Bartonella neuroretinitis and cilioretinal artery occlusion of the left eye. She presented with a \"gray spot\" in her vision. Exam revealed an RAPD OS. Photos demonstrate appearance on presentation, 1 week, 3 weeks, 4 weeks, and 8 weeks after presentation. Patient was treated with oral Azithromycin at 5 weeks after presentation when positive bartonella serology returned. Photo sequence: Neuroretinitis 3 Neuroretinitis 3 Contributor: Justin Risma, MD Neuroretinitis 4 Neuroretinitis 4 Contributor: James M. Coombs, MD Neuroretinitis 5 Neuroretinitis 5 Contributor: Andrew Doan, MD, PhD","u":"pages/Neuroretinitis/index.htm","cr":"Tyler B.S. Risma, MD; Morgan Bertsch, BS; Jeffrey Welder, MD","src":"er"},{"t":"Bartonella Neuroretinitis","im":[["E:photos/bartonella/bartonella-1st.jpg",""],["E:photos/bartonella/bartonella1week.jpg",""],["E:photos/bartonella/bartonella3weeks.jpg",""]],"h":"34-year-old female diagnosed with Bartonella neuroretinitis and cilioretinal artery occlusion of the left eye. She presented with a \"gray spot\" in her vision. Exam revealed an RAPD OS. Photos demonstrate appearance on presentation, 1 week, 3 weeks, 4 weeks, and 8 weeks after presentation. Patient was treated with oral Azithromycin at 5 weeks after presentation when positive bartonella serology returned. Photo sequence: Initial presentation Week 1 Week 3 Week 4 Week 8","u":"pages/bartonella.htm","cr":"Jeffrey D. Welder, MD","src":"er"},{"t":"Lymphomatous infiltration of left optic nerve with central retinal artery occlusion (CRAO)","im":[["E:photos/Lymphomatous-optic-nerve/L/Lymphomatous-optic-nerve-CRVO-LRG.jpg",""],["E:photos/Lymphomatous-optic-nerve/L/Lymphomatous-optic-nerve-CRVO2-LRG.jpg",""]],"h":"The patient was a 57-year-old man with vision loss in the right eye (OD) greater than left eye (OS) in the setting of a craniopharyngioma, which was resected 16 years prior. His visual acuity had been no light perception OD and 20/20 OS since the procedure.","u":"pages/Lymphomatous-Infiltration-ON-CRVO.htm","cr":"Jon Hager, MD","src":"er"}]},{"n":"Disc drusen (pseudopapilloedema)","b":"Buried and visible drusen — the classic mimic of disc swelling.","items":[{"t":"Optic Disc Drusen","im":[["W:photos/optic-disc-drusen/color-fundus-ou-LRG.jpg","Spectral domain optical coherence tomography (SD-OCT). Buried optic disc drusen are denoted by the white arrows. Buried optic disc drusen are characterized as oval hyporeflective voids with overlying scattered hyperreflective dots [1]. Optic disc drusen should be differentiated from blood vessels seen in cross-section (red arrow) with underlying shadowing [2]."],["W:photos/optic-disc-drusen/1a-color-fundus-ou-LRG.jpg","Ultrasound echography. In cases of extruded/exposed optic disc drusen, the drusen are easily visible on fundus exam, SD-OCT, and/or autofluorescence as demonstrated in A-C. Ultrasound echography may be needed to idenitify very deep calcified drusen. Calcified drusen are seen on ultrasound as hyperechoic with posterior shadowing (white arrows) [1]."]],"h":"Nicole M. Radunzel (photography) and Laura L. Warner (echography) Color fundus photography (A), spectral domain optical coherence tomography (B), fundus autofluorescence (C), and ultrasound echography (D) of the right and left eyes in a 28 year-old female who presented for evaluation of pseudopapilledema and blurry vision Contributor: Robert B Dinn, MD and Wallace L. M. Alward, MD , University of Iowa","u":"pages/Optic-Disc-Drusen.html","cr":"Bethlehem Wole, BS","src":"er"},{"t":"Optic Nerve Drusen","im":[["W:photos/Drusen-ON-or-disc/optic-nerve-drusen-201207.jpg","This image describes a 52-year-old male with stable dense scattered inferior scotomas."]],"h":"This image describes a 52-year-old male with stable dense scattered inferior scotomas.","u":"pages/optic-nerve-drusen-201207.htm","cr":"Matthew C. Weed, MD","src":"er"},{"t":"Optic nerve drusen","im":[["E:photos/Drusen-ON-or-disc/drusen.jpg","Refractile drusen seen in optic nerve."]],"h":"Refractile drusen seen in optic nerve. severe visual loss from drusen, but VF stable for over 10 years. VF from 10 years previous.","u":"pages/optic-nerve-drusen.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Optic Nerve Head Drusen","im":[["E:photos/Drusen-ON-or-disc/ONH-drusen.jpg","36-year-old female with optic nerve head drusen."]],"h":"36-year-old female with optic nerve head drusen.","u":"pages/optic-nerve-head-drusen.htm","cr":"C. Blake Perry, MD","src":"er"},{"t":"Optic Disc Drusen with asteroid hyalosis","im":[["E:pages/imgs/R_5RMJ95g79HkXZjX_OU_FP.png","Optic nerve heads displaying the \"lumpy-bumpy\" appearance characteristic of optic disc drusen. The left eye media is partially obscured by asteroid hyalosis."],["E:pages/imgs/R_5RMJ95g79HkXZjX_ECHO.png","Right eye (OD): Mild vitreous opacities and buried, calcified optic disc drusen. Left eye (OS): Dense asteroid hyalosis and buried, calcified optic disc drusen."]],"h":"A 65-year-old man presenting with optic disc drusen of both eyes and asteroid hyalosis of the left eye. Related Article https://webeye.ophth.uiowa.edu/eyeforum/cases/72-Optic-Nerve-Drusen-Visual-Field-Loss.htm#gsc.tab=0","u":"pages/optic_disc_drusen_w_asteroid_hyalosis.html#gsc.tab=0","cr":"Lindsay Y Chun MD, Edward F Linton MD","src":"er"},{"t":"Angioid Streaks and Optic Disc Drusen in Pseudoxanthoma Elasticum","im":[["E:photos/angioid-streaks-1.jpg","Right Eye. Disk drusen (arrow heads); normal vessels; angioid streaks (arrows) emanating from the optic nerve"],["E:photos/angioid-streaks-2.jpg","Right Eye. Disk drusen"],["E:photos/angioid-streaks-3.jpg","Left eye: Disc drusen (arrow heads); normal vessels; angioid streaks (arrows) emanating from the optic nerve"]],"h":"16, OS 18 Angioid Streaks Named because of their resemblance to blood vessels. Result from crack-like breaks in weakened Bruch's membrane (\"peau d'orange\" appearance) that radiate out from the optic nerve. Seen with pseudoxanthoma elasticum (most commonly), Ehler's Danlos syndrome, Paget's disease, sickle cell anemia, or Idiopathic (\"PEPSI\"). Other associations include abetalipoproteinemia, acromegaly, diabetes mellitus, facial angiomatosis, hemochromatosis, hemolytic anemia, hereditary spherocytosis, hypercalcinosis, hyperphosphatemia, lead poisoning, myopia, neurofibromatosis, senile elastosis, Sturge-Weber syndrome, and tuberous sclerosis. Associated optic disc drusen are common. Usually asymptomatic even if they cross into the foveal area, but complications include choroidal neovascularization and choroidal rupture. Pseudoxanthoma Elasticum Also known as Gronblad-Strandberg syndrome. Caused by an autosomal recessive mutation in the ABCC6 gene on chromosome 16p13.1 Results in a fragmentation and mineralization of elastic-containing fibers in connective tissue. Small, yellowish papular lesions form and cutaneous laxity mainly affects the neck, axilla, groin, and flexural creases. Eye findings are present in almost all PXE patients, and usually noticed a few years after the onset of cutaneous lesions. Gastrointestinal and cardiovascular systems may also be affected.","u":"pages/angioid-streaks-optic-disc-drusen-pseudoxanthoma-elasticum.htm","cr":"Eric Chin, MD","src":"er"}]},{"n":"Optic atrophy & compressive neuropathy","b":"Pallor patterns and what causes them.","items":[{"t":"Bow-tie (band) atrophy secondary to compressive optic neuropathy","im":[["E:photos/bow-tie-atrophy/fig1.jpg","Ocular coherence tomography of the macula showed diffuse ganglion cell layer (GCL) thinning OD and nasal GCL thinning OS."]],"h":"Susan J. Wright The patient was a 57-year-old man with vision loss in the right eye (OD) greater than left eye (OS) in the setting of a craniopharyngioma, which was resected 16 years prior. His visual acuity had been no light perception OD and 20/20 OS since the procedure. Summary: Contrast-enhanced magnetic resonance imaging (MRI) of the brain and orbits showed a stable tiny ring-enhancing cystic lesion anterior to the pituitary infundibulum and atrophy of the right greater than left optic nerves. The presence of bow-tie, or band, atrophy suggests that there is a compressive optic neuropathy from an anterior chiasmal and/or medial, posterior optic nerve lesion. This clinical sign warrants further evaluation with magnetic resonance imaging (MRI) or computed tomography (CT) in a patient with unexplained vision loss. Unilateral band atrophy can also be seen in a patient with a unilateral optic tract lesion.","u":"pages/bow-tie-atrophy.htm","cr":"Brittni A. Scruggs, MD, PhD; Matthew J. Thurtell, MD","src":"er"},{"t":"Dominant optic atrophy","im":[["E:photos/Dominant-Optic-Atrophy/DOA-OD-LRG.jpg","Right Eye"],["E:photos/Dominant-Optic-Atrophy/DOA-OS-LRG.jpg","Left Eye"]],"h":"Dominant optic atrophy (Kjer syndrome), the most common inherited optic neuropathy, is an autosomal dominant condition caused by a mutation in the OPA1 gene. The condition typically results in mild to moderate bilateral vision loss with an insidious onset beginning in childhood. Note the symmetric temporal wedges of disc pallor in the photographs.","u":"pages/Dominant-optic-atrophy.htm","cr":"Jesse Vislisel","src":"er"},{"t":"Leber’s Hereditary Optic Neuropathy","im":[["E:photos/Lebers_2023/Fig.%201.png",""],["E:photos/Lebers_2023/Fig.%202.png",""]],"h":"Nicole Radunzel, Paul Swihart (perimetry) March 22, 2023 The patient was a 53-year-old male found to have Leber’s hereditary optic neuropathy (positive for mutation 11778). Fundus photos showed congestion of both optic nerves with telangiectic vessels visible. (Fig 1 and 2) Goldmann visual field testing showed a ceco-central scotoma in the right eye on presentation which stayed stable on subsequent follow-up. (Fig. 3) Five years later, a large ceco-central scotoma developed in the left eye. (Fig. 4) Vision was 20/25 OD and 20/100 OS. There was a history of alcohol use before each of the two episodes of visual loss. OCT showed thickening of the RNFL layer despite thinning of the underlying GCL bilaterally, characteristic of Leber’s. (Fig. 5 and 6) RNFL thickening can be seen in Leber’s even prior to development of visual symptoms and in carriers of the mutation.1 Reference: Barboni P, Savini G, Feuer WJ, et al. Retinal nerve fiber layer thickness variability in Leber hereditary optic neuropathy carriers. Eur J Ophthalmol. 2012;22(6):985-991.","u":"pages/lebers-hereditary-optic-neuropathy.htm","cr":"Noor-Us-Sabah Ahmad, MD; Salma Dawoud, MD","src":"er"},{"t":"Optic nerve sheath meningioma","im":[["E:photos/Optic-nerve-sheath-meningioma/ONSM-1a-LRG.jpg",""],["E:photos/Optic-nerve-sheath-meningioma/ONSM-1b-LRG.jpg",""]],"h":"This patient presented with slowly progressive painless vision loss in the right eye. Dilated fundus examination demonstrates mild chronic appearing disc edema and dilated veins in the right eye, while the left eye is unaffected. MRI T1-weighted images with contrast show enlargement and enhancement of the optic nerve sheath consistent with an optic nerve sheath meningioma. The attenuated optic nerve is surrounded by the enhancing mass causing a \"bull's eye\" appearance on coronal and \"tram track\" appearance on axial images (red arrows).","u":"pages/optic-nerve-sheath-meningioma.htm","cr":"John Chen, MD, PhD","src":"er"},{"t":"Optociliary shunt vessels","im":[["E:pages/Optociliary-Shunt-Vessels/optociliary-shunt-vessel-LRG.jpg",""],["E:pages/imgs/R_58XKuL3EmVasq8p_Optociliar%20Shunt%20vessels%20OD.png","Fundus photo of right eye showing large optic discs with large deep cups, neuroretinal rim pallor, and optociliary shunt vessels (white arrow)"],["E:pages/imgs/R_58XKuL3EmVasq8p_optociliary%20shunt%20vessels%20OS.png","Fundus photo of the left eye showing large optic discs with large deep cups, neuroretinal rim pallor, and optociliary shunt vessels (white arrow)"]],"h":"This 87-year-old male has alongstanding history of primary open angle glaucoma. His optic nerve is significantly cupped with a marked number of optociliary shunt vessels. There are several drusen in the peripapillary region. Optociliary shunt vessels are collateral vessels connecting the choroidal and the retinal vasculature. The differential diagnosis for acquired optociliary shunt vessels commonly includes central retinal vein occlusion, chronic glaucoma, chronic papilledema, or an optic nerve sheath meningioma. Optociliary shunt vessels can be differentiated from neovascularization of the disc by their large caliber and lack of leakage on fluorescein angiogram. Optociliary Shunt Vessels Optociliary Shunt Vessels Category(ies): Glaucoma / Iris,Neuro-ophthalmology Contributor: Noor-Us-Sabah Ahmad, MD; Patrick Donegan MD; Jaffer Naqvi, MD; Matthew Thurtell, MBBS, MSc Photographer: Michael T. Edrington, CRA Posted: 06/26/2025 This 60-year-old male patient has a history of severe glaucoma. Fundus photos show large optic discs with large deep cups and pallor of the neuroretinal rim bilaterally. Optociliary shunt vessels are present (white arrows). These are also known as retinochoroidal venous collaterals since they are collateral vessels that connect the retinal and choroidal circulation in cases of long-standing retinal venous congestion. The differential diagnosis for acquired optociliary shunt vessels commonly includes central retinal vein occlusion, chronic glaucoma, chronic papilledema, or an optic nerve sheath meningioma.","u":"pages/Optociliary-Shunt-Vessels/index.htm","cr":"Johanna Beebe, MD","src":"er"}]},{"n":"Tumours at the disc","b":"Pigmented and non-pigmented lesions on or beside the disc.","items":[{"t":"Melanocytoma","im":[["E:photos/melano/melanocytoma-1-LARGE.jpg",""],["E:photos/melano/melanocytoma-2-LARGE.jpg",""]],"h":"11-year-old pseudophakic male with melanocytoma of the right optic nerve incidentally noted on fundoscopic examination after ruptured globe repair. It has remained stable for 3¾ years. The pale appearance of the optic nerve is typical of aphakia.","u":"pages/melanocytoma.htm","cr":"Timothy Winter, DO","src":"er"},{"t":"Melanocytoma with associated choroidal nevus","im":[["E:photos/melano/Melanocytoma-choroidal-nevus.png",""]],"h":"Melanocytomas, also known as magnocellular nevi, are deeply pigmented benign tumors often appearing over the optic disc. They are derived from uveal dendritic melanocytes. The tumors may be associated with nerve fiber layer or choroidal involvement as is seen in this photo.","u":"pages/Melanocytoma-choroidal-nevus.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Tuberous Sclerosis with Optic Nerve Hamartoma","im":[["E:photos/retinal-astrocytic/hamartomas-OD.jpg","Right eye"],["E:photos/retinal-astrocytic/hamartomas-OS.jpg","Left eye"],["E:photos/retinal-astrocytic/hamartomas-OD-closeup.jpg","Left eye"]],"h":"Retinal astrocytic hamartomas are the most common ocular finding of tuberous sclerosis complex. Note the obvious calcified astrocytic hamartomas in both eyes, commonly referred to a \"mulberry lesions\" due to their multinodular appearance. The right fundus also contains a more subtle non-calcified astrocytic hamartoma which can be spotted as a hazy area overlying the superotemporal arcade. Noncalcified Astrocytic Hamartoma in the setting of Retinitis Pigmentosa Noncalcified Astrocytic Hamartoma in the setting of Retinitis Pigmentosa Contributor: Morgan Bertsch, BS and Tyler B.S. Risma, MD This patient with a history of autosomal recessive retinitis pigmentosa (RP) presented with an amelanotic juxtapapillary retinal lesion consistent with noncalcified astrocytic hamartoma of the left eye. Astrocytic hamartomas are typically associated with tuberous sclerosis or neurofibromatosis, but unilateral solitary lesions have been seen in otherwise normal patients. Several cases of bilateral and unilateral astrocytic hamartomas in the setting of RP have been documented. Calcified astrocytic hamartomas appear as white nodular lesions with patchy calcifications overlying the optic disc with a classic \"mulberry\" appearance. Non-calcified astrocytic hamartomas appear as flat, soft, smooth-appearing, translucent or semi-translucent lesions. It is important to differentiate a calcified astrocytic hamartoma from optic nerve drusen, which is more commonly found in association with RP. Tuberous Sclerosis with Optic Nerve Hamartoma Tuberous Sclerosis with Optic Nerve Hamartoma Contributor: Aaron M. Ricca MD This patient is a 9-year-old female with tuberous sclerosis and an optic nerve hamartoma of the right eye, which in this case appears similar to unilateral optic disc swelling. She has subretinal fluid adjacent to the optic nerve and over the domed hamartoma, as visualized on optical coherence tomography (OCT) of the retina. Note that she has atrophy of the retinal pigmented epithelium (RPE) in the area of subretinal fluid in a \"water mark\" fashion. A large choroidal nevus is visible under the inferior arcade. Fortunately, her visual acuity remains 20/20, as the subretinal fluid spares the fovea.","u":"pages/retinal-astrocytic-hamartomas.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Combined Hamartoma of the Retina and RPE, Peri-Papillary","im":[["E:pages/CHRRPE/1-CPHRRPE-LRG.jpg","Image 2. OS: OCT, peripapillary ERM with striae and distortion extending thru fovea. Optic nerve head is elevated with high reflective internal reflectivity and mild surrounding retinal edema."],["E:pages/CHRRPE/8-CPHRRPE-LRG.jpg","Image 3. OS: OCT, peripapillary ERM with striae and distortion extending thru fovea. Optic nerve head is elevated with high reflective internal reflectivity and mild surrounding retinal edema."]],"h":"A 29-year-old male was referred to our clinic because of chronic disc edema in the left eye, since at least 9 months prior. He has had decreased vision in the affected left eye since about four years prior, with gradual worsening over the years. He works as an electrician, and had a history of \"severe electrical shock\" in 2010 which caused him to faint. He has very occasional pain in the right eye that last for 5-10 minutes, and a superotemporal scotoma in the left eye. There is no family history of any eye diseases, and he has no other complaints. Visual acuity OD 20/20 sc OS 20/60 sc, 20/40 sc ph IOP: OD 17, OS 19 SLE: trace NS OU, otherwise unremarkable Summary: Peripapillary Combined Hamartoma of the Retina and Retinal Pigment Epithelium The lesion is most highly consistent with a peripapillary combined hamartoma of the retina and retinal pigment epithelium OS. The lesion distorts the fovea and the peripapillary retina. There is severe contraction of the membrane at the inferonasal edge of the disc with focal areas of axoplasmic flow stasis that probably represent damage to the nerve fiber layer in this area and explain the superotemporal visual field defect. This is a benign tumor that can affect vision. The epiretinal membrane will continue to contract and cause more vision loss. Vitrectomy and membranectomy has sometimes improved vision, but the epiretinal membranes tend to be tightly adherent and the prognosis for vision improvement is probably less than that for a typical epiretinal membrane. Combined hamartomas can be associated with neurofibromatosis (NF) type 2 and in one case report, with NF type 1. This has potential implications for family genetic counseling.","u":"pages/CHRRPE/index.htm","cr":"Eric Chin MD","src":"er"}]}],"fund":[{"n":"The normal fundus & variants","b":"Disc, macula, vessels and periphery — then findings that are normal or harmless.","items":[{"t":"Normal fundus","im":[["C:3/3d/Fundus_photograph-normal_retina_EDA06.JPG",""]],"h":"Fundus, photograph-normal retina Description: Fundus photograph-normal retina Credit: National Eye Institute, National Institutes of Health Ref#: EDA06","u":"https://commons.wikimedia.org/wiki/File:Fundus_photograph-normal_retina_EDA06.JPG","cr":"Wikimedia Commons · Public domain","src":"wm"},{"t":"Normal fundus - child","im":[["E:pages/normal-fundus-child/normal-child-fundus-LRG.jpg","Normal Child Fundus"]],"h":"This is the appearance of a normal fundus in a 10-year-old child. Notice the prominent sheen of the robust retinal nerve fiber layer, a normal finding in children. This is especially visible around the fovea and vasculature in this photograph.","u":"pages/normal-fundus-child/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Tapetal Sheen","im":[["E:LARGE/tapetal-sheen-OD-L.jpg","Right Eye"],["E:LARGE/tapetal-sheen-OS-L.jpg","Right Eye"]],"h":"Female carriers of X-linked recessive eye diseases may show variable expression of the disorders depending on the timing of X-inactivation. Patients with late X-inactivation have widely dispersed affected cells intermixed with unaffected cells, sometimes producing a characteristic tapetal reflex or \"metallic sheen\" as seen in this photograph. This patient is an asymptomatic carrier of X-linked retinitis pigmentosa who has two affected sons.","u":"pages/Tapetal-sheen.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Gunn's dots","im":[["E:photos/gunns-dots/Gunns-dots-OD-vlarge.jpg","A close up shot of the dots, superior to the optic disc, from the right eye"],["E:photos/gunns-dots/Gunns-dots-OS-vlarge.jpg","A close up shot of the dots, superior to the optic disc, from the left eye"]],"h":"Antoinette Venckus Gunn's dots, originally described by Marcus Gunn, are tiny white dots sometimes visible overlying the large vessels near the optic nerve or the nerve fiber layers. Their presence depends on lighting conditions, and they have no pathologic significance. They are visible reflections of the internal limiting membrane, created by the footplate of the Muller cells. The tiny white specks in these photos are best visualized at the 12:00 and 6:00 positions approximately 1 disc diameter from the optic nerve head.","u":"pages/gunns-dots.htm","cr":"Matt Weed, MD","src":"er"},{"t":"Allen Dots","im":[["E:photos/Allen-Dot/Allen-DotANIMATE.gif","(click on Figure links below to see higher resolution images) (Still Shots below)"],["E:photos/Allen-Dot/Allen-dot-1-LRG.jpg","OS: clear media, normal nerve, normal vessels, normal macula; multiple faint ill-defined black spots are seen in the mid-periphery"],["E:photos/Allen-Dot/Allen-dot-2-LRG.jpg","Black spots are highlighted with red circles."]],"h":"“Many black spots” 20-year-old male, otherwise healthy, presenting for routine follow-up. Black spots were seen incidentally on review of fundus photographs for eye disease in the contralateral eye. Vision OS: 20/20 cc Spectacle Rx: -4.00 sphere OU Allen Dots Some auxiliary lenses used with fundus photography cameras can cause “Allen Dots” which are faint artifactual darkened round spots at the center of a fundus image. They may be seen with single images, or with montage images as this case demonstrates. Allen dots are more commonly seen with myopes. They can potentially obscure detail in areas of interest (e.g. the fovea center). Slightly adjusting the patient’s fixation to de-center the Allen dot in less critical area is a potential solution. Seeing the dark spot (i.e. Allen dot) at the center of each (and sometimes every) photograph confirms that this is only an artifact. Also, they will not be seen with clinical exam (i.e. slit lamp biomicroscopy and indirect ophthalmoscopy).","u":"pages/Allen-dot.htm","cr":"Eric Chin, MD","src":"er"},{"t":"Choroidal nevi - variations","im":[["E:photos-earlier/nevus60degree4.jpg",""],["E:photos-earlier/NevusDrusen2.jpg",""],["W:photos/choroidal/ChoroidalNevus31.jpg",""]],"h":"","u":"pages/Choroidal-Nevus.html","cr":"Thomas A. Weingeist, PhD, MD","src":"er"},{"t":"Congenital hypertrophy of the retinal pigmented epithelium (CHRPE) in a \"bear tracks\" configuration","im":[["E:photos/bear-tracks.jpg",""],["E:pages/imgs/R_7b0H8ftOG0frzNk_bear%20tracks.png",""]],"h":"Congenital hypertrophy of the retinal pigmented epithelium (CHRPE) lesions are typically solitary, flat, well-demarcated, hyperpigmented lesions of the retina. They can occasionally be seen in a grouped configuration resembling the footprint of an animal, or \"bear tracks,\" as is seen in this photo. Both solitary lesions and \"bear tracks\" are benign. However, multiple, bilateral lesions can be associated with Gardner's syndrome, an autosomal dominant disease which invariably results in colon cancer by the fifth decade of life. Congenital hypertrophy of the retinal pigmented epithelium (CHRPE) in a \"bear tracks\" configuration Congenital hypertrophy of the retinal pigmented epithelium (CHRPE) in a \"bear tracks\" configuration Category(ies): Retina / VitreousContributor: Mahsaw Mansoor, MDPhotographer: Antoinette Venckus, CRAPosted: 06/06/2024","u":"pages/bear-tracks-CHRPE.htm","cr":"Jesse M. Vislisel, MD","src":"er"},{"t":"Congenital Hypertrophy of the Retinal Pigment Epithelium = CHRPE lesions","im":[["E:photos/CHRRPE/CHRPE-gross-specimen.jpg",""],["E:photos/CHRRPE/CHRPE-fundus.jpg",""],["E:photos/CHRRPE/CHRPE-lacuna.jpg",""]],"h":"Gross specimen of CHRPE lesion. Fundus photograph of classic lesion with areas of hyperpigmentation and lacunae or loss of RPE pigmentation H & E stain of area of lacuna H & E stain of hyperpigmented RPE","u":"pages/CHRPE-lesions.html","cr":"Thomas A. Weingeist, PhD, MD","src":"er"},{"t":"CHRPE (Congenital Hypertrophy of the Retinal Pigment Epithelium)- variations","im":[["E:photos/CHRRPE/CHRPE-fundus-color-flluor1.jpg",""],["E:photos/CHRRPE/CHRPE-fundus-31.jpg",""],["E:photos/CHRRPE/CHRPE-fungus-4.jpg",""]],"h":"CHRPE fundus and FFA CHPRE fundus - jet back, scalloped edge CHRPE fundus jet black round lesion CHRPE fundus flat, dark gray-black lesion CHRPE (Congenital Hypertrophy of the Retinal Pigment Epithelium)- variations CHRPE (Congenital Hypertrophy of the Retinal Pigment Epithelium)- variations Category(ies): Retina / Vitreous Contributors: Thomas D. Meram, MD; S. Bilal Ahmed, MD; Jaclyn M. Haugsdal, MD; Photographer: Alexandria Steggall Posted: 06/02/2025Congenital Hypertrophy of the Retinal Pigment Epithelium (CHRPE)","u":"pages/CHRPE-variations.html","cr":"Thomas A. Weingeist, PhD, MD","src":"er"},{"t":"Grouped congenital albinotic spots of the retinal pigmented epithelium (polar bear tracks)","im":[["E:pages/polar-bear-tracks/Polar-bear-tracks-LRG.jpg","Optical coherence tomography (OCT) demonstrates a disruption of the highly-reflective signal from the ellipsoid zone in the region of the lesions, as indicated by the orange line on the scan."],["E:pages/polar-bear-tracks/Polar-bear-tracks-montage-LRG.jpg",""]],"h":"Congenital albinotic spots of the retinal pigmented epithelium (CASRPE) can be configured in solitary or grouped configurations. Groups of the spots, as seen here, are commonly referred to as \"polar bear tracks\" due to their color and resemblance of animal footprints. It is believed that these spots may develop secondary to deposition of an abnormal white material in retinal pigmented epithelial (RPE) cells rather than the usual darkly pigmented melanin. The lesions are flat, sharply circumscribed, placoid, chalky white, and lie at the level of the RPE. Optical coherence tomography (OCT) demonstrates a disruption of the highly-reflective signal from the ellipsoid zone in the region of the lesions, as indicated by the orange line on the scan. Reference: Gass JD. Focal congenital anomalies of the retinal pigment epithelium. Eye (1989) 3;1-18. Kim DY, Hwang JC, Moore AT, Bird AC, Tsang SH. Fundus Autofluorescence and Optical Coherence Tomography of Congenital Grouped Albinotic Spots. Retina. Sep 2010; 30(8): 1217–1222.","u":"pages/polar-bear-tracks/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Pseudostreaks (Senile Atrophic Lines)","im":[["E:LARGE/Pseudostreaks-1-LARGE.jpg",""],["E:LARGE/Pseudostreaks-2-LARGE.jpg",""]],"h":"Pseudostreaks are also known as 'senile atrophic lines'. They are mild peripapillary streaks that are a separate entity than angioid streaks. They have a benign course and a slightly different clinical appearance (i.e. peripapillary heloicoidal choroidal atrophy). Pseudostreaks are unlikely to cause choroidal neovascularization, but may be associated with retinal telangiectasis. This 83-year-old female presented for age-related macular degeneration evaluation. She had noticed gradual decreased vision in her right eye worse than her left, but denied any acute changes. Her best corrected visual acuity was 20/200 in the right eye and 20/25 in the left eye. Fundus exam revealed bilateral helicoid peripapillary atrophy with senile streaks (arrows) emanating from the optic nerves. The macula of the right eye had atrophy and mild subretinal fibrosis, and the left eye had atrophy and mild pigmentary mottling.","u":"pages/pseudostreaks.htm","cr":"Eric Chin, MD","src":"er"},{"t":"Weiss Ring","im":[["E:LARGE/WeissRing-LRG.jpg","A Weiss ring is the result of vitreous detachment around the optic nerve head"]],"h":"A Weiss ring is the result of vitreous detachment around the optic nerve head","u":"pages/weiss-ring.html","cr":"Matthew Weed, MD","src":"er"},{"t":"Asteroid Hyalosis","im":[["E:photos/asteroid/asteroid-hyalosis-fundus.jpg",""],["E:photos/asteroid/Fig1-color-fundus-asteroid-hyalosis-OS-LRG.jpg","Color fundus photograph of asteroid hyalosis in the left eye. A clear view of the fundus may be difficult for the examiner, but the patient’s vision is rarely affected."],["E:photos/asteroid/Fig2a-Color-fundus-asteroid-bodies.jpg","Color fundus photographs of asteroid bodies in higher magnification."]],"h":"A 74-year-old female with a past medical history of hypertension and type 2 diabetes mellitus presented for annual eye examination. Dilated fundus examination revealed multiple sparking, yellow-white, and refractile opacities in the vitreous cavity of the left eye. The opacities moved with ocular movement. The patient was asymptomatic and a diagnosis of asteroid hyalosis was made. Asteroid hyalosis is a common benign cause of vitreous opacities. It has been associated with several systemic diseases including diabetes and hypertension, as is the case in our patient. [1] Asteroid opacities are composed of calcium, phospholipids, and phosphorous.[1] While seldom visually significant, it is clinically relevant to avoid selection of silicone intraocular lenses in these patients. Treatment is observation. Asteroid Hyalosis Asteroid Hyalosis Category(ies): Pathology, Retina / Vitreous Contributor: Marshall Henrie, MD Posted: April 16, 2024","u":"pages/asteroid-hyalosis.html","cr":"Jesse M. Vislisel, MD","src":"er"},{"t":"White Without Pressure (WWP)","im":[["E:pages/white-without-pressure/WWP-LRG-1.jpg",""],["E:pages/white-without-pressure/WWP-LRG-2.jpg",""],["E:pages/white-without-pressure/WWP-LRG-3.jpg",""]],"h":"A 20-year-old male was seen in the Retina Clinic for the possibility of retinitis pigmentosa, both eyes. Unrelated to this, the peripheral exam showed relatively symmetric white patches of retina inferiorly and inferotemporally that were visible without scleral indentation. Scleral depressed exam revealed that the retina was attached, and that there was no other peripheral retinal pathology. The vision and remainder of the exam was otherwise unremarkable. The exact cause of WWP is unknown. There has been controversy regarding its anatomical location, associated pathology, and its potential association with the development of retinal breaks.[1] Clinically, a white appearance of the equator and/or peripheral retina seen without scleral indentation. Margins are often sharply demarcated from normal retina. Frequently misdiagnosed as a retinal detachment or retinal schisis; however, scleral indentation reveals that the retina is apposed to the underlying RPE. Reports show that OCT corresponds to a distinct hyper-reflectance of the outer retina, likely the elipsoid zone on SD-OCT.[2]","u":"pages/white-without-pressure/index.htm","cr":"Eric Chin, MD","src":"er"}]},{"n":"Peripheral retina & detachment","b":"Lattice, schisis, breaks and detachments.","items":[{"t":"Lattice Degeneration of peripheral retina","im":[["E:photos/lattice-degeneration.jpg",""]],"h":"Lattice degeneration is a common atrophic disease of the peripheral retina characterized by oval or linear patches of retinal thinning associated with vitreoretinal interface abnormalities. Lattice degeneration is often bilateral and occurs in 6-10% of the general population and seen more commonly in myopic eyes. Although only a small percentage of patients with lattice degeneration will develop a detachment, lattice is found in 20-30% of eyes that present with a rhegmatogenous retinal detachment.","u":"pages/lattice-degeneration.htm","cr":"John J. Chen, MD, PhD","src":"er"},{"t":"Peri-Vascular Lattice Degeneration","im":[["E:LARGE/Perivascular-lattice-degen-1-LRG.jpg","OD: radial perivascular lattice with sclerotic vessels and hyperplastic retinal pigment epithelium"],["E:LARGE/Perivascular-lattice-degen-2-LRG.jpg","OD: higher magnification of radial perivascular lattice"],["E:LARGE/Perivascular-lattice-degen-3-LRG.jpg","OS: radial perivascular lattice"]],"h":"20/20 • IOP: normal • SLE: unremarkable • DFE: OD next slide Lattice Degeneration Histopathologically represents localized areas of inner retinal atrophy with loss of the internal limiting membrane, adherent vitreous to the edges of the lesion with an overlying pocket of liquefied vitreous, and sclerosis of the remaining retinal vessels. Lattice degeneration is seen in approximately 10% of the population, but rarely leads to rhegmatogenous retinal detachments. However, lattice degeneration is present in 20-40% of rhegmatogenous detachments. Radial Perivascular Lattice Degeneration Lattice lesions with retinal thinning and pigmentary disturbances along retinal vessels may be referred to as radial perivascular chorioretinal degeneration. Typically seen more posteriorly along retinal vessels in comparison to traditional peripheral lattice degeneration. May be an incidental finding, as in this case, or seen with hereditary vitreoretinal degenerations such as Stickler syndrome in which there is a high risk for rhegmatogenous retinal detachment.","u":"pages/perivascular-lattice-degeneration.htm","cr":"Eric Chin, MD","src":"er"},{"t":"Radial Lattice Degeneration in Stickler's syndrome","im":[["E:pages/Radial-lattice-Sticklers/radial-lattic-LRG.jpg",""]],"h":"Extensive radial lattice degeneration is noted in this patient with molecularly confirmed Stickler's syndrome (COL2A1 mutation), a condition with autosomal dominant inheritance. The patient has had a retinal detachment in this eye with repair via scleral buckle and cryotherapy, seen on the temporal aspect in this photo.","u":"pages/Radial-lattice-Sticklers/index.htm","cr":"David Phillips, MD","src":"er"},{"t":"Acquired Peripheral Retinoschisis","im":[["E:photos/AAION-CGA/AAION-GCA-OD-LRG.jpg",""],["E:photos/AAION-CGA/AAION-GCA-OS-LRG.jpg",""]],"h":"73-year-old male, with no prior past ocular history, presented at the referral of an optometrist for the possibility of retinoschisis in both eyes. He was asymptomatic without any flashes, floaters, or peripheral vision loss. He had no family history of any retinal problems. BCVA: OD 20/20, OS 20/30 with correction SLE: 3+ NS OU; no PVD OU DFE: normal without any peripheral retinal tears, holes, or detachments; inferotemporally there was a dome-shaped 'boggy-area' of elevated retina near the retina in both eyes. B-scan OU: mild vitreous opacities, dome-shaped retinal elevation inferotemporally consistent with retinoschisis.","u":"pages/AAION-GCA.htm","cr":"Eric Chin, MD","src":"er"},{"t":"Acquired Peripheral Retinoschisis","im":[["E:photos/acquired-peripheral-retinoschisis-1.jpg",""],["E:photos/acquired-peripheral-retinoschisis-2.jpg",""],["E:photos/acquired-peripheral-retinoschisis-3.jpg",""]],"h":"73-year-old male, with no prior past ocular history, presented at the referral of an optometrist for the possibility of retinoschisis in both eyes. He was asymptomatic without any flashes, floaters, or peripheral vision loss. He had no family history of any retinal problems. BCVA: OD 20/20, OS 20/30 with correction SLE: 3+ NS OU; no PVD OU DFE: normal without any peripheral retinal tears, holes, or detachments; inferotemporally there was a dome-shaped 'boggy-area' of elevated retina near the retina in both eyes. B-scan OU: mild vitreous opacities, dome-shaped retinal elevation inferotemporally consistent with retinoschisis. Acquired Peripheral Retinoschisis \"Retinoschisis\" is splitting of the neurosensory retina. It can resemble the appearance of a retinal detachment. The most common form of retinoschisis is \"acquired retinoschisis\", where the split is in the outer plexiform layer. The inferotemporal quadrant is most commonly involved. Most acquired retinoschisis remains stationary over many years, but some eyes do progress to rhegmatogenous retinal detachment. B-scan ultrasound is a useful adjunct to confirm splitting of the retinal layers in the periphery. Bilateral symmetry and an inferotemporal location are highly suggestive of retinoschisis. Also, A-scan measurements showing splitting of the retinal layers are helpful.","u":"pages/acquired-peripheral-retinoschisis.htm","cr":"Eric Chin, MD","src":"er"},{"t":"Bilateral Retinoschisis-Associated Retinal Detachments in Pars Planitis","im":[["E:pages/imgs/Fig1_Fundus_pars_plantis.jpg",""]],"h":"A 15-year-old female with pars planitis, controlled for 2 years on adalimumab and methotrexate, presented for a new-onset superonasal visual field defect in the left eye. Fundus photography (A, B) showed inferior retinoschisis (yellow arrows) with associated retinal detachments (white arrows) in both eyes. B-scan of the right eye showed a double-layer sign (C). OCT in the left eye confirmed subretinal fluid into the macula. Due to a demarcation line, the right eye was cautiously observed, and the left eye underwent emergent retinal detachment repair.","u":"pages/Bilateral-Retinoschisis-Associated-Retinal-Detachments-Pars-Planitis.htm#gsc.tab=0","cr":"Emma M. Hartness, BS; Scott A. Larson, MD","src":"er"},{"t":"Retinal Breaks/Holes with Proliferative Vitreoretinopathy and Chronic Recurrent Rhegmatogenous Retinal Detachment","im":[["E:LARGE/retinal-breaks-PVR-grade-C-1.jpg","Montage photo of her right eye: clear media; macula off bullous-retinal detachment with laser scars in the periphery. Multiple small and large retinal breaks at 1230, 6, 930, and 1030 o'clock. Proliferative vitreoretinopathy grade C2 (two-quadrants)."],["E:LARGE/retinal-breaks-PVR-grade-C-2.jpg","Focal PVR posterior to the equator with mild fixed folds highlighted with white lines"],["E:LARGE/retinal-breaks-PVR-grade-C-3.jpg",""]],"h":"69-year-old female referred by an outside retina specialist for a recurrent macula-off retinal detachment in the right eye. She was previously treated for a macula-off retinal detachment in the right eye 1.5 months prior to presentation with surgery. She had gradual vision loss over the prior few months. No falls or trauma. No other eye surgeries. No family history of retinal detachments. • BCVA: OD HM 5'; OS 20/25 • IOP: 18 and 16 • SLE: • OD: 2+ NS and optically empty vitreous • OS: 1+ NS with PVD Patient underwent elective 23-gauge pars plana vitrectomy, scleral buckle, and silicone oil placement in the right eye. Table 1: Classification of Retina Detachment with Proliferative Vitreoretinopathy, 1983 Grade Name Clinical Sign A Minimal Vitreous haze, vitreous pigment clumps B Moderate Wrinkling of inner retinal surface, rolled edge of retinal break, retinal stiffness, vessel tortuosity C Marked Full-thickness fixed retinal folds C-1 one quadrant C-2 two quadrants C-3 three quadrants D Massive Fixed retinal folds in four quadrants D-1 wide funnel shape D-2 narrow funnel shape D-2 closed funnel (optic nerve head not visible) Retina Society Terminology Committee: The classification of retinal detachment with proliferative vitreoretinopathy Ophthalmology 1983;90:121-125. Brinton DA, Wilkinson CP. Retinal Detachment Principles and Practice Third Edition. Oxford University Press. 2009. p108. Table 2: Classification of Proliferative Vitreoretinopathy, 1991* = number of clock-hours involved Grade Features A Vitreous haze, vitreous pigment clumps, pigment clusters on inferior retinal B Wrinkling of inner retinal surface, retinal stiffness, vessel tortuosity, rolled and irregular edge of retinal break, decreased mobility of vitreous CP1-12* Posterior to equator: focal, diffuse, or circumferential full-thickness folds, subretinal strands CA1-12* Anterior to equator: focal, diffuse, or circumferential full-thickness folds, subretinal strands, anterior displacement, condensed vitreous with strands Machemer R, Aaberg TM, Freeman HM, et al. An updated classification of retinal detachment with proliferative vitreoretinopathy. Am J Ophthalmic 1991;112:159-165. Brinton DA, Wilkinson CP. Retinal Detachment Principles and Practice Third Edition. Oxford University Press. 2009. p113. Table 3: Grade C Proliferative Vitreoretinopathy Described by Contraction Type, 1991 Type Location in Relation to Equator Features Focal Posterior Star folds posterior to vitreous base Diffuse Posterior Confluent star folds posterior to vitreous base: optic disc may not be visible Subretinal Posterior/anterior Proliferations under retina: annular strand near disc, linear strands, moth-eaten-appearing sheets Circumferential Anterior Contraction along posterior edge of vitreous base with central displacement of retina, peripheral retina stretched, posterior retina in radial folds Anterior displacement Anterior Vitreous base pulled anteriorly by proliferative tissue, peripheral retina trou","u":"pages/retinal-breaks-w-PVR-gradeC.htm","cr":"Eric Chin MD","src":"er"},{"t":"Rhegmatogenous Retinal Detachment","im":[["W:photos/Rhegmatogenous-retinal-detachment-LRG.jpg",""],["E:photos/RD/Rhegmatogenous-retinal-detachment.jpg","This photograph shows a superior rhegmatogenous retinal detachment that is not yet involving the macula."],["E:photos/RD/Rhegmatogenous-retinal-detachment-HST.jpg","The second photograph shows a closer view of the primary horseshoe tear with two smaller retinal tears nearby. Lattice degeneration and intr"]],"h":"71-year-old man presented with 2 weeks of blurred vision and curtain-like vision loss obscuring the inferior portion of his left visual field. Visual acuity was 20/50+2. Fundoscopy (see image) demonstrated a large horseshoe break at 12:30 at the equator, with a slightly rolled edge and a bridging vessel. There was subretinal fluid from 10:00 clockwise to 3:00, extending posteriorly to just involve the center of the fovea. This macula-involving rhegmatogenous retinal detachment was repaired surgically. Three months later, his vision improved to 20/20. Figure 2 Figure 2 Category(ies): Retina, Vitreous Contributor: Jesse Vislisel, MD Photographer: Cindy Montague, CRA Figure 3 Figure 3 Category(ies): Retina, Vitreous Contributor: Lucas T. Lenci MD, Elaine Binkley MD, Jessica Watson MD, Culver Boldt MD Photographer: Brice Critser, CRA This is a patient who presented with an inferior visual field defect and multiple flashes and floaters. These images demonstrate an excellent example of a large, superior horseshoe tear with a bullous retinal detachment. Figure 4 Figure 4 Category(ies): Retina, Vitreous Contributor: Tressa Larson, OD FAAO Photographer: Andrea Starkweather These OCT images show an inferior, macula-off, chronic rhegmatogenous retinal detachment.","u":"pages/Rhegmatogenous-ret-detach.htm","cr":"Zachary Q. Mortensen, MD","src":"er"},{"t":"Rhegmatogenous Retinal Detachment, Macula-Off","im":[["E:LARGE/rhegmato-ret-detach-macula-off-1-LRG.jpg","Image 1: OD: clear media; normal disc, vessels and macula; in the periphery, there were scattered areas of lattice degeneration (270 degrees"],["E:LARGE/rhegmato-ret-detach-macula-off-3-LRG.jpg","Image 3: OS: low magnification montage, rhegmatogenous macula-off retinal detachment (temporal to the white arrows); not shown, the patient"],["E:LARGE/rhegmato-ret-detach-macula-off-4-LRG.jpg","Image 4: OD: higher magnification of the rhegmatogenous retinal detachment that involves the macula."]],"h":"Patient • A 62 year old female with a history of uncomplicated cataract surgery in both eyes, presented to the comprehensive clinic for decreased vision in the left eye since one day prior. She said her nasal field of vision had become abruptly and increasingly blurry while doing the laundry. She denied any flashes, floaters, or other complaints. She denied prior trauma or recent falls. She had no family history of retinal detachments. • Vision: OD 20/25-3; OS 20/100+1 • IOP: 14 and 13 • Manifest refraction prior to cataract surgery: º OD: -13.25 +0.75 045 º OS: -9.25 +0.50 040 º Slit lamp exam: Posterior chamber intraocular lenses and posterior capsular opacities, both eyes The patient underwent a scleral buckle, 25-gauge pars plana vitrectomy, laser indirect ophthalmoscopy, air-fluid exchange, and injection of 22% SF6, in the left eye. The right eye was also treated with prophylactic laser indirect ophthalmoscopy intraoperatively. Risk Factors for Retinal Detachments Age* High myopia* Co-morbid eye conditions, such as lattice degeneration* Prior eye surgery* Prior retinal detachment Family history of retinal detachment Trauma *Risk factors seen in our patient are highlighted in bold.","u":"pages/rhegmatogenous-ret-detach-macula-off.htm","cr":"Eric Chin, MD","src":"er"},{"t":"Retinal detachment with proliferative vitreoretinopathy","im":[["E:LARGE/RDwithPVR-L.jpg",""],["E:pages/imgs/PVR_Star_Folds_2.png","Wide-field pseudocolor fundus photograph of the right eye shows a macula-involving rhegmatogenous retinal detachment associated with a prominent star fold temporally and a retinal tear in the inferotemporal periphery"],["E:pages/imgs/PVR_Star_Folds_1.png","Wide-field pseudocolor fundus photograph, left eye. There is a macula-involving retinal detachment due to inferior proliferative vitreoretinopathy with multiple star folds. There are laser scars from barricade of a prior retinal tear (superiorly) and detachment (inferiorly)."]],"h":"Proliferative vitreoretinopathy (PVR) is a condition characterized by tractional retinal membranes formed by glial, retinal pigmented epithelial, and other cells. It is the most common cause for failure of retinal detachment repair. These contractile membranes result in generalized retinal shrinkage, fixed retinal folds, and characteristic \"star folds,\" which are most evident from 4:00 to 11:00 in this photograph of a retinal detachment involving the macula. Retinal detachment with proliferative vitreoretinopathy Retinal detachment with proliferative vitreoretinopathy Category(ies): Retina, Vitreous Contributor: Alina Husain, MD; Justin Grassmeyer, MD, PhD; Elaine M. Binkley, MD; Ian Han, MD Photographer: Alexandria Steggall A 66-year-old female was found to have an acute-on-chronic macula-involving rhegmatogenous retinal detachment with Grade C proliferative vitreoretinopathy. The patient underwent retinal detachment repair utilizing 25-gauge vitrectomy with scleral buckle, endolaser, and 14% C3F8 tamponade. The preretinal membranes were peeled during surgery, resulting in relaxation of traction and retinal re-attachment. Retinal detachment with proliferative vitreoretinopathy Retinal detachment with proliferative vitreoretinopathy Category(ies): Retina, Vitreous Contributor: Alina Husain, MD; Justin Grassmeyer, MD, PhD; Elaine M. Binkley MD This patient is a 68-year-old male who presented with a macula-involving rhegmatogenous retinal detachment of the left eye due to rapid and aggressive development of proliferative vitreoretinopathy. Within the preceding month, the patient had undergone laser demarcation of a superior retinal tear, pars plana vitrectomy for vitreous hemorrhage, and laser demarcation of a localized inferior retinal detachment. He subsequently underwent retinal detachment repair utilizing 25-gauge pars plana vitrectomy, scleral buckle, inferior retinectomy, and silicone oil tamponade.","u":"pages/RDwithPVR.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Retinal Dialysis and Choroidal Rupture after Blunt Trauma","im":[["W:photos/choroidal-rupture-macular-hole/choroidal-rupture-LRG.jpg",""],["W:photos/choroidal-rupture-macular-hole/choroidal-rupture-nerve-LRG.jpg",""],["W:photos/choroidal-rupture-macular-hole/macular-hole-LRG.jpg",""]],"h":"Doreen Dykhuizen This patient experienced blunt eye injury after bungee cord recoil. Color fundus montage photograph of the right eye shows a macular hole and peripapillary choroidal ruptures extending into the macula. There is subretinal hemorrhage and fluid inferior to the macular hole and in the peripapillary region. Optical coherence tomography (Heidelberg) demonstrates a partial-thickness macular hole with subretinal heme. Retinal Dialysis and Choroidal Rupture after Blunt Trauma Retinal Dialysis and Choroidal Rupture after Blunt Trauma Category(ies): Trauma,Retina / Vitreous Contributor: Nicolas J. Heckenlaible, MD and Timothy M. Boyce, MD Photographer: Madigan M. Peimann A 42-year-old woman sustained blunt trauma directly to her left globe after being kicked by a goat. On presentation, she was found to have multiple ocular injuries including a hyphema, ocular hypertension, iridodialysis, traumatic iritis, and vitreous hemorrhage. Upon clearance of her hyphema and vitreous hemorrhage after 14 days, she was found to have a retinal detachment and was referred to our center. Fundus examination demonstrated an arcuate choroidal rupture nasal to the optic nerve. There was a retinal dialysis from 2-4 o’clock with subretinal fluid from 1-5 o’clock that spared the macula. She underwent successful urgent retinal detachment repair with primary scleral buckle procedure. Contributor: Andrew Doan, MD, PhD","u":"pages/choroidal-rupture.html#gsc.tab=0:~:text=Retinal%20Dialysis%20and%20Choroidal%20Rupture%20after%20Blunt%20Trauma","cr":"Austin R. Fox, MD","src":"er"},{"t":"Marshall Syndrome","im":[["E:photos/marshall-syndrome/color-fundus-fig1-LRG.jpg","Optical coherence tomography of the macula, OU. Posterior staphylomas are present OU, and the retina is attached OU. There is no intraretinal or subretinal fluid OU. There is marked thinning of the choroid and retina OU, especially in regions corresponding to atrophy along the inferior arcades OU. Mild epiretinal membranes are present centrally OU."]],"h":"This patient had a lifelong history of profound hearing loss and vision loss in the left eye (OS) greater than right eye (OD) in the setting of Marshall syndrome with high myopia and aphakic glaucoma in both eyes (OU). She underwent strabismus surgery for esotropia as a child and bilateral extracapsular cataract extraction when she was 27-years-old. Her visual acuity progressively decreased to 20/600 OD and hand motions OS due to myopic degeneration OU. Dilated funduscopic examination showed numerous, scattered chorioretinal atrophic regions, vascular attenuation, and large posterior staphylomas OU (Figure 1). Goldmann visual fields showed a small, preserved central island of vision OU (Figure 2). Optical coherence tomography of the macula showed staphylomatous changes with severe retinal and choroidal thinning OU (Figure 3). Marshall syndrome is a rare autosomal dominant syndrome that presents with pathologic myopia, congenital cataracts, sensorineural hearing loss, hypertelorism, and a flattened nasal bridge. Patients with Marshall syndrome have COL11A1 gene mutations leading to abnormalities in the production of collagen; mutations in this gene are also found in Type 2 Stickler's syndrome. Strabismus, retinal detachments, arthritis, and ectodermal abnormalities are common in Marshall syndrome [1].","u":"pages/marshall-syndrome.htm","cr":"Brittni A. Scruggs, MD, PhD and John H. Fingert, MD, PhD","src":"er"}]},{"n":"The macula","b":"Membranes, holes, serous detachments, folds and toxicity.","items":[{"t":"Epiretinal membrane","im":[["E:photos/ERM/ERM-1.JPG","3 Optical coherence tomography of the right eye reveals an epiretinal membrane and diffuse retinal thickening of the macula."],["E:photos/ERM/ERM-2.JPG","Optical coherence tomography of the left eye reveals trace retinal thickening and epiretinal membrane"],["E:pages/imgs/OD_OCT_ERM.PNG","High resolution vertical raster scan shows a partially separated epiretinal membrane with loss of foveal contour and schitic disruption of t"]],"h":"Randy Verdick, FOPS A 66-year-old pseudophakic female presented with worsening blurry vision and metamorphopsia, right eye more than left eye. She also complained of monocular diplopia in the right eye. She denied pain or irritation. Her visual acuity was 20/60 in the right eye and 20/50-2 in the left eye, with no improvement with pinholes in either eye. Epiretinal Membranes An epiretinal membrane (ERM) is a semi-translucent, avascular, fibrocellular membrane on the inner retinal surface along the internal limiting membrane of the retina. ERMs may be idiopathic, or secondary to a variety of conditions such as retinal vascular occlusions, uveitis, trauma, intraocular surgery, and retinal breaks. Contracture of ERMs produces distortion and wrinkling of the inner surface of the retina. It is also called “cellophane maculopathy” or “pre-retinal macular fibrosis” when mild; “surface wrinkling retinopathy” or “retinal striae” when moderate; or “macular pucker” when severe. Epiretinal membrane Epiretinal membrane Category(ies): Retina, Vitreous Contributor: Peter H. Sanchez, MD, Chad \"Cy\" Lewis, MD, MPH, and Jaclyn M. Haugsdal, MD Photographer: Meghan Menzel, CRA, and Mike Edrington, CRA A man in his 70's presented for annual examination and was found to have 20/30 visual acuity in the right eye in absence of any subjective distortion. Imaging showed retinal vascular tortuosity and striae in the macula in association with a broad epiretinal membrane with visible traction.","u":"pages/epiretinal-membrane.htm","cr":"Eric Chin, MD","src":"er"},{"t":"Lamellar hole with foveal schisis","im":[["E:photos/lamellar-hole/lamellar-hole-w-foveal-schisis-1.jpg","OD: clear media; optic nerve cupping with peripapillary pigment; multiple intermediate and large drusen throughout macula and peri"]],"h":"20/50; OS 20/25 • IOP: 19 and 21 • SLE: PCIOL OU Discussed surgery versus observation. The patient elected for observation of his epiretinal membrane and lamellar hole. Lamellar Holes •A lamellar hole represents an aborted (or partial thickness) macular hole. •Seen on slit lamp biomicroscopy as a round central inner retinal defect without thickening, cystic change, or subretinal fluid. •An overlying operculum is often seen (but not present in this case). •Mechanism is secondary to vitreofoveal separation with loss of the inner retinal layers, but with a preserved and intact outer photoreceptor layer. •Vision is usually good (20/20-20/30) and patients are often asymptomatic, when no other confounding variables such as an epiretinal membrane are present. •Fluorescein angiography shows no abnormal fluorescence.","u":"pages/lamellar-hole-w-foveal-schisis.htm","cr":"Eric Chin MD","src":"er"},{"t":"Macular hole, commotio retinae, and choroidal rupture after blunt eye injury","im":[["E:photos/macular-hole-choroidal-rupture-commotio.jpg",""]],"h":"This patient experienced blunt eye injury during a severe motor vehicle accident and has several retinal sequellae from the incident. Notable findings include a full-thickness macular hole and multiple arc-shaped choroidal ruptures in the inferotemporal macula. There is also a large area of hypopigmentation secondary to commotio retinae, or loss of retinal transparency secondary to photoreceptor disorganization.","u":"pages/Macular-hole-commotio-retinae-choroidal-rupture.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Central Serous Retinopathy (CSR)","im":[["E:photos/CSR/CSR-LRG.jpg","OCT images demonstrate a discrete blister of fluid underneath the RPE just temporal to the foveal depression. This defines the PED. The overlying serous retinal detachement is also evident."],["E:photos/CSR/CSR_02072005FFA2Patel.jpg","Late views with flourescein reveal the pooling of fluid within the serous detachement, correlating with the clinical appearance of the fundu"],["E:photos/CSR/CSRsmokestack.jpg",""]],"h":"CSR (sometimes called Central Serous Chorioretinopathy or CSCR) is seen most commonly in male & female patients between the ages of 20 and 40 years of age. Contributor: Christopher C. Robinson, MD A classic \"smokestack\" of leakage from the choroid is seen is this fluorescein angiogram. The fluid leaks into the subretinal space causing decreased visual acuity. Central serous retinopathy (CSR) is typically found in young males. There is a documented association with stress and steroid use.","u":"pages/Central-Serous-Retinopathy-CSR.html","cr":"Austin R. Fox, MD","src":"er"},{"t":"Bilateral serous retinal detachments from acute hypertensive retinopathy","im":[["E:photos/Bilateral-serous-retinal-detachments-acute-hypertensive-retinopathy/Serous-RD-3-LRG.jpg",""],["E:photos/Bilateral-serous-retinal-detachments-acute-hypertensive-retinopathy/Serous-RD-4-LRG.jpg",""]],"h":"The patient presented with acute onset of blurry vision in both eyes associated with blood pressures exceeding 190/140 mmHg. On dilated exam, both eyes had a flame hemorrhage along the vascular arcade and shifting subretinal fluid in the macula. Acute systemic hypertension more commonly manifests as flame shaped hemorrhages in the nerve fiber layer, but serous retinal detachments have also been reported.[1,2]","u":"pages/Bilateral-Serous-Retinal-Detachments-HTN-Retinopathy.htm","cr":"Ben J. Janson, MD","src":"er"},{"t":"Hypotony Maculopathy","im":[["E:pages/HypotonyMaculopathy/Hypotony-maculopathy-2-LRG.jpg","The OCT image shows diffuse choroidal folds and central subretinal fluid."]],"h":"44-year-old male with hypotony maculopathy of the left eye after suffering a traumatic cyclodialysis cleft from a fireworks injury. The OCT image shows diffuse choroidal folds and central subretinal fluid. There was also optic disc edema as shown in the fundus photograph. Hypotony is defined as an intraocular pressure low enough to result in decreased vision; mechanisms include corneal edema, cystoid macular edema, maculopathy, choroidal folds and optic disc edema. Risk factors for hypotony maculopathy include male gender, young age, myopia, and glaucoma filtering surgery.","u":"pages/HypotonyMaculopathy/index.htm","cr":"Jeffrey Welder, MD","src":"er"},{"t":"Choroidal folds","im":[["E:pages/choroidal-Folds/CF4-LRG.jpg",""],["E:pages/choroidal-Folds/CF5-LRG.jpg",""],["E:photos/choroidal/Choroidal-folds-1.jpg","Choroidal FoldsCan occur in the setting of hypotony, retinal detachment, or an orbital mass."]],"h":"Choroidal folds occur when there is relative indentation of the inner surface of the sclera, leading to folds of the choroid and RPE or choroidal congestion. Clinically, they appear as parallel, alternating yellow and dark bands upon examination of the posterior pole. Choroidal folds may be present in hypotony, external globe compression, ocular or orbital inflammation, tumors, neovascular membranes, and papilledema. In this case, choroidal folds occurred secondary to external globe compression by air extending inferiorly into the orbit from the frontal sinus. Contributor: Andrew Doan, MD, PhD","u":"pages/choroidal-folds.html","cr":"Matthew Benage, MD; Randy Kardon, MD, PhD","src":"er"},{"t":"Idiopathic juxtafoveal telangiectasia","im":[["E:pages/juxtafoveal-telangiectasia/JXT-OS-LRG.jpg","Optical coherence tomography"],["E:photos-earlier/jxt.jpg","Macular pigmentation and edema"],["E:photos/img-untitled/ffa1.jpg","Juxtafoveal telangiectasia with leakage"]],"h":"Idiopathic juxtafoveal telangiectasia type II (aka macular telangiectasia) is a rare idiopathic condition that is characterized by telangiectatic vessels in the juxtafoveolar region, most commonly temporal to the fovea, of both eyes. Additional findings include graying of the parafoveal retina, superficial crystalline deposits, subfoveal cavities, and right-angle vessels. Symptoms include blurred vision, metamorphopsia and paracentral scotomas. Fluorescein angiography will highlight the parafoveal telangiectatic vessels that show early hyperfluorescence with late leakage. OCT will show subfoveal cystoid spaces without cystoid macular edema. Fundus autofluorescence is very diagnostic in that the normal hypoautofluorescence at the fovea is lost and will show abnormally increased foveal autofluorescence. These findings are all demonstrated in the left eye of the patient shown here with very similar findings in the right eye Juxtafoveal telangiectasia Contributor: Andrew Doan, MD, PhD Vitreoretinal traction (VRT) in the setting of Juxtafoveal Telangiectasia Contributor: Aaron M. Ricca, MD A 78-year-old man presented to our clinic with progressive blurring of his central vision in both eyes. Color fundus photography demonstrated a gray sheen temporal to the fovea in both eyes, which is characteristic of juxtafoveal telangiectasia (JXT). In his fovea in both eyes, there was a large, elevated round pseudo-hole due to concurrent vitreomacular traction as demonstrated by optical coherence tomography. The fundus autofluorescence images showed an absence of normal foveal hypofluorescence, replaced by an area of hyperfluorescence, a finding that is virtually pathognomonic for JXT. Reference: Ryan SJ. Retina. 5th ed. London: Saunders/Elsevier; 2013.","u":"pages/juxtafoveal-telangiectasia/index.htm","cr":"Christopher Kirkpatrick, MD","src":"er"},{"t":"Laser Pointer Maculopathy","im":[["E:photos/Laser-pointer-maculopathy/righteye-opt.jpg","2 days after injury"],["E:photos/Laser-pointer-maculopathy/image2-opt.jpg","2 days after injury"],["E:photos/Laser-pointer-maculopathy/image3-opt.jpg",""]],"h":"This is a 16-year-old male who suffered a laser pointer injury to his right eye and subsequently found that he had a small central area of \"blackness\" that made it difficult to read. On fundus exam, the right eye showed a small, depigmented, circular defect just temporal to the center of the fovea. OCT showed a small cavitation at this location with IS/OS disruption. The Amsler grid was normal for the left eye but demonstrated a small central scotoma in the right eye. The exam was otherwise normal including 20/20 vision OU. On one month follow-up, Amsler grid testing demonstrated a reduced scotoma size, and the patient reported that he notices the deficit less. The visible lesion near the fovea had healed somewhat and appeared smaller on OCT and fundus exam.","u":"pages/laser-pointer-maculopathy.htm","cr":"Kristina Damisch, M2 and Alison Bozung, OD","src":"er"},{"t":"Macular Hemorrhage","im":[["E:photos/Macular-heme.jpg",""]],"h":"92-year-old female with history of non-exudative age-related macular degeneration presenting with large subretinal macular hemorrhage with preretinal breakthrough in the right eye. This was thought to represent either macroaneurysm or choroidal neovascularization; however, there was too much blockage on fluorescein angiography to distinguish the two causes.","u":"pages/Macular-Heme.htm","cr":"Jeffrey D. Welder, MD","src":"er"},{"t":"Pentosan Polysulfate Maculopathy","im":[["E:pages/imgs/Pentosan_Polysulfate_Maculopathy_fundus_photo_OU.png","Fundus photography of right and left eyes demonstrating pigmentary retinal pigment epithelium (RPE) stippling and nummular atrophy"]],"h":"A 62-year-old woman taking pentosan polysulfate (PPS) for interstitial cystitis (200 mg twice daily for 20 years; cumulative dose >2,500 g) underwent a baseline dilated exam. She reported several years of nyctalopia. Examination showed pigmentary retinal pigment epithelium (RPE) stippling with nummular macular atrophy extending toward the temporal optic disc margins (Figure 1). Fundus autofluorescence (FAF) demonstrated a speckled pattern of macular hyper- and hypoautofluorescence with peripapillary involvement (Figure 2). Optical coherence tomography (OCT) revealed diffuse RPE excrescences and outer retinal atrophy (Figure 3). Findings were consistent with pentosan polysulfate (PPS)–associated maculopathy. PPS (Elmiron) is the only FDA-approved oral therapy for interstitial cystitis. A dose-dependent pigmentary maculopathy was first described in 2018 and can mimic age-related macular degeneration and pattern dystrophies. The risk of maculopathy rises with cumulative PPS exposure (≈20–40% beyond 1,500 g), and progressive damage may continue even after drug cessation. Patients may be asymptomatic or report prolonged dark adaptation, blurred vision, or metamorphopsia. Management includes counseling regarding PPS discontinuation in coordination with the prescriber and continued ophthalmic surveillance for treatable complications (e.g., cystoid macular edema, choroidal neovascularization).","u":"pages/Pentosan_Polysulfate_Maculopathy.htm","cr":"Joanna I.M. Silverman, MD","src":"er"},{"t":"Chloroquine retinal toxicity","im":[["E:photos/chloroquine/chloroquine-OD.jpg",""],["E:photos/chloroquine/chloroquine-OS.jpg",""]],"h":"Retinal toxicity from chloroquine is now rare in the U.S. as the medication has been largely replaced by hydroxychloroquine. These photographs show the toxic effects of chloroqine after taking a dose of 500mg daily for 5 years. There is central macular atrophy and arteriolar attenuation in both eyes with a dense central scotoma apparent on the Goldmann visual fields. Patients on chloroquine and its derivatives should undergo regular screening exams so the medications can be discontinued at the first sign of retinal toxicity.","u":"pages/Chloroquine-retinal-toxicity.htm","cr":"Jesse Vislisel, MD","src":"er"}]},{"n":"Age-related macular degeneration","b":"Drusen and PEDs to CNV, RPE rips and polyps.","items":[{"t":"Age-related macular degeneration","im":[["E:photos/AMD/early-AMD-1-LRG.jpg","These fundus photos show early AMD of two different patients. There are a few (<15) intermediate-sized soft drusen predominantly in the inferior macula."],["E:photos/AMD/early-AMD-2-LRG.jpg","These fundus photos show early AMD of two different patients. There are several (>15) small hard drusen in the macula."],["E:photos/AMD/Intermediate_AMD-1-LRG.jpg","Eyes demonstrates intermediate AMD with high risk (i.e., large, confluent, soft drusen) non-neovascular, age-related macular degeneration. Ultimately, the patient progressed to category 4 AMD with development of a choroidal neovascular membrane in the left eye (not shown), which required serial intravitreal injections."]],"h":"Age-related macular degeneration (AMD) is the leading cause of blindness in elderly patients [1] and is classified as either non-exudative (i.e., dry) or exudative (i.e., wet or neovascular). The clinical manifestations of non-exudative AMD range from incidental findings of drusen to geographic atrophy causing significant vision loss, and approximately 15% of AMD patients ultimately transition to the wet form [2]. This conversion is due to the extension of choroidal vessels into the sub-retinal pigment epithelial (sub-RPE) or sub-retinal space via breaks in Bruch's membrane. AMD has been categorized by The Age-Related Eye Disease Study (AREDS) based on exam findings of hard drusen, soft drusen, RPE abnormalities, atrophy, and choroidal neovascularization [3]; the AREDS categories are as follows: Category 1 (No AMD): a few (5-15), small (<63µm) or no drusen without pigment changes. Category 2 (Early AMD): Several small drusen, few intermediate-sized (63-124µm) drusen, and/or pigmentary changes in one or both eyes Category 3 (Intermediate AMD): Extensive (i.e., 20 soft or 65 hard without any soft) intermediate-sized drusen, one large (>125µm) druse, and/or geographic atrophy not involving the macula in one or both eyes Category 4 (Advanced unilateral AMD): Advanced dry form (i.e., macula-involving geographic atrophy) or exudative form with choroidal neovascularization in one eye Category 4a: Advanced AMD in one eye with category 1, 2, or 3 AMD in the fellow eye Category 4b: Advanced AMD in one eye and decreased visual acuity (<20/32) secondary to AMD in the fellow eye; however, advanced AMD is not present in both eyes The importance of daily Amsler grid monitoring should be emphasized to maximize the opportunity to detect early development of wet AMD in either eye. The benefit of micronutrients (e.g., AREDS vitamins) in delaying the progression of AMD has been shown in patients with intermediate and advanced unilateral disease [4]. Patients should be informed of the association between smoking and an increased risk of developing AMD [5]. Early AMD (AREDS Category 2) Intermediate AMD (AREDS Category 3) Transition to Advanced Unilateral AMD (AREDS Category 4) Advanced Bilateral AMD","u":"pages/AMD.htm","cr":"Brittni A. Scruggs, MD, PhD","src":"er"},{"t":"Cuticular Drusen","im":[["E:photos/cuticular-drusen/cuticular-drusen-OD.jpg","OD"],["E:photos/cuticular-drusen/cuticular-drusen-OS.jpg","OS"],["E:photos/cuticular-drusen/cuticular-drusen-Add-OD.jpg","OD"]],"h":"Cuticular drusen, also known as basal laminar drusen, are a type of familial drusen characterized by many clumps of tiny, extramacular drusen. They are strongly associated with the Tyr402His variant of the complement factor H (CFH) gene. Acuity often remains good as long at the drusen remain outside of the fovea. Cuticular DrusenCuticular DrusenCategory(ies): Retina / VitreousContributor: Peter H. Sanchez, MD; Bilal Ahmed, MD; Jaclyn Haugsdal, MD; Photographer: Alexandra CopplePosted: 12/09/202456 year old female patient with evidence of extramacular drusen 360 degrees in both eyes consistent with cuticular drusen. OD and OS Widefield color fundus photographs demonstrate 360 degrees of cuticular drusen sparing the macula.","u":"pages/cuticular-drusen.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Drusenoid Pigment Epithelial Detachment (PED)","im":[["E:photos/drusenoid-PED/Figure-1-Fundus-photo-OD-Drusenoid-PED.jpg","(A) An ocular coherence tomography (OCT) photo of the right eye demonstrates a drusenoid PED. Using the scale (blue arrow), the length of RPE elevation is shown to easily surpasses the threshold of 350 microns. Notice the relatively uniform isoreflective quality of the drusen. Of note, there is some hyperreflective material (pigment migration) in the outer nuclear outer nuclear layer overlying the drusenoid PED. (B) An OCT photo of the same eye at a different radial section demonstrates similar findings."]],"h":"August 11, 2023 77-year-old female referred to retina service for management of dry age-related macular degeneration in both eyes. The patient is found to have a drusenoid pigment epithelial detachment (PED) in the right eye. Drusenoid PEDs are drusen that span more than 350 microns contiguously.","u":"pages/drusenoid-PED.htm","cr":"Sean Rodriguez, MD","src":"er"},{"t":"Age-Related Macular Degeneration with CNVM","im":[["E:photos/ARMD-CNVM-Color.jpg","Fundus photos shows a green-gray lesion in the central macula with surrounding hemorrhage."]],"h":"Fundus photos shows a green-gray lesion in the central macula with surrounding hemorrhage.","u":"pages/Age-Related-Macular-Degeneration-with-CNVM.html","cr":"Robert B. Dinn, MD and Karen Gehrs, MD","src":"er"},{"t":"Age-related Macular Degeneration with Choroidal Neovascular Membrane","im":[["E:photos/CNVM-121.jpg",""]],"h":"This was a classic lesion on FFA. Note the subretinal hemorrhages beneath the center of the macula and inferiorly distant from the fovea.","u":"pages/ARMD-with-CNVM.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Involuted choroidal neovascular membrane (CNVM) mimicking a granuloma in pseudoxanthoma elasticum (PXE)","im":[["W:pages/CNVM-PXE/PXE-w-involuted-CNVM-LRG.jpg","This photograph shows the appearance of an involuted choroidal neovascular membrane (CNVM) mimicking a granuloma in a patient with pseudoxanthoma elasticum (PXE)"],["W:pages/CNVM-PXE/PXE-w-active-CNVM-LRG.jpg","The appearance of the CNVM several years earlier while in its active state. Also visible in the photographs are the angioid streaks and peau d'orange fundus appearance which are typical of PXE"]],"h":"Randy Verdick, FOPS Involuted choroidal neovascular membranes (CNVMs) are included in the differential of chorioretinal granulomas. This photograph shows the appearance of an involuted choroidal neovascular membrane (CNVM) mimicking a granuloma in a patient with pseudoxanthoma elasticum (PXE). The bottom photograph shows the appearance of the CNVM several years earlier while in its active state. Also visible in the photographs are the angioid streaks and peau d'orange fundus appearance which are typical of PXE.","u":"pages/CNVM-PXE/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Retinal Pigment Epithelial Rip","im":[["E:photos/RP/RPE-rip-1.jpg","Image 3. OCT, Right eye. Red arrow points to an area where the RPE ends abruptly. White arrow points to an area of \"scrolled\" RPE adjacent to moderate subretinal fluid."],["E:photos/RP/RPE-rip-2.jpg","Image 2. Left eye. Full thickness macular hole with difficult to delineate margins, due to extensive large high-risk drusen and RPE clumping"]],"h":"This patient is a 78-year-old man with known history of high-risk non-exudative age-related macular degeneration, and full-thickness macular hole in the left eye, presented for annual follow-up. He noted rapid decline in vision in his formerly better-seeing right eye since three months prior to presentation. No pain or irritation. He has no history of prior intravitreal injections. No other complaints. BCVA cc: right eye (OD) 20/160 (previously 20/32-1) left eye (OS) 20/125-2 (previously 20/160) with eccentric fixation IOP: OD 15, OS 14 Comments RPE detachments have known to develop RPE rips, either spontaneously or following laser photocoagulation, photodynamic therapy, or intravitreal injection. They usually occur at or along the edge of the serous RPE detachment. Mechanisms include fibrovascular contraction of choroidal neovascular membranes, mechanical forces from vitreomacular traction or interruption of tight junctions due to anti-VEGF therapy. An incidence of 10% has been reported as part of the natural history of macular degeneration. Improvement in visual acuity may occur after treatment (usually anti-VEGF or photodynamic therapy) despite RPE rips, but the patient and clinician need to be aware of this situation, as it may warrant close follow-up and re-treatment in cases of deterioration.","u":"pages/RPE-rip.htm","cr":"Eric Chin, MD","src":"er"},{"t":"Polypoidal choroidal vasculopathy (PCV)","im":[["E:LARGE/Polypoidal-choroidal-vasculopathy-OD-L.jpg","Right Eye"],["E:LARGE/Polypoidal-choroidal-vasculopathy-OS-L.jpg","Left Eye"],["E:LARGE/Polypoidal-choroidal-vasculopathy-3-LRG.jpg","The photograph shows the fundus appearance after the patient later presented with an acute subretinal hemorrhage in the right eye."]],"h":"Polypoidal choroidal vasculopathy (PCV), also known as posterior uveal bleeding syndrome, is a condition characterized by chronic, multiple, recurrent serosanguinous retinal pigment epithelium detachments secondary to an abnormal network of underlying choroidal vessels. Multiple areas of subretinal hemorrhage are visible in these photos. They are surrounded by areas of yellow subretinal material which likely represents old hemorrhage.","u":"pages/Polypoidal-choroidal-vasculopathy.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Choroidal Rupture with Development of Choroidal Neovascular Membrane (CNVM)","im":[["E:pages/CR-in-CNVM/CR-with-CNVM-LRG.jpg",""]],"h":"This is a 40-year-old male who presented with acute onset of metamorphopsia in the left eye (OS). He was a baseball pitcher in college and had a straight line drive injury to the left eye 20 years prior. This same trauma had also occurred in the right eye (OD) the following year. He had no other ocular history including no history of ocular surgery. His visual acuity was 20/20 OD and 20/30 OS, with normal intraocular pressure OU. There was no relative afferent pupillary defect. Anterior segment exam was normal, except for 360 degrees of angle recession OD and 270 degrees of angle recession OS. Dilated fundus exam was normal OD. There was a curved, fibrotic scar concentric to the disc in the left eye with associated hyperpigmentation and overlying intraretinal hemorrhage. There was also atrophy superiorly. In the infratemporal macular there was a round fibrotic scar with signs of previous intraretinal fluid. OCT OS showed a pigment epithelial detachment with associated subretinal and intraretinal fluid. The patient was diagnosed with a choroidal neovascular membrane and treated with intravitreal avastin.","u":"pages/CR-in-CNVM/index.htm","cr":"Johanna Beebe, MD","src":"er"}]},{"n":"Diabetic & vascular retinopathy","b":"Diabetes, hypertension, vein and artery occlusions, haemorrhage patterns, v
