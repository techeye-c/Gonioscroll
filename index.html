["Angle Recession with Iridodialysis","V175.mp4","This young patient was hit with a BB pellet in a glancing blow that did not penetrate the eye or orbit. He presented with a count fingers vision and an intraocular pressure of 9 mmHg. He has an iridodialysis with angle recession. There is an area at 7 o'clock that looks like a cyclodialysis cleft. This patient's low pressure resolved spontaneously and his vision returned to normal.","angle-recession/angle-recession-with-iridodialysis.htm"],
["Angle Recession with Pigment Dispersion","V152.mp4","39 year-old man suffered severe head trauma six years before (he was in a motorcycle accident and hit a tree with his face). The right optic nerve is avulsed and the eye has no light perception. The left eye has 20/15 vision with mild ocular hypertension controlled on one medication. Both angles are recessed. The right has a flap tear in the ciliary body face and the left has pigment dispersion syndrome.","angle-recession/angle-recession-with-pigment-dispersion.htm"],
["Pigment Dispersion from Angle Recession","V088.mp4","This is a 67 year old male who has elevated intraocular pressures in both eyes, the right greater than the left. At age 13 he had severe blunt trauma to the right eye and had a very slow recovery and then a gradual decline again during his childhood. He had been treated for elevated intraocular pressure for over 20 years at the time these videos were taken. The patient has extensive angle recession and has a secondary pigment dispersion syndrome in the right eye. While his axial eye lengths are symmetrical his anterior chamber depth on the right side is deeper than the left (3.52 mm OD and 2.30 mm OS). Published: McKinney JK & Alward WL (1997) Arch Ophthalmol 115(11):1478-9; Ritch R & Alward WL (1993).","angle-recession/pigment-dispersion-from-angle-recession.htm","Pigmentary"]]],
["Cyclodialysis Cleft",[
["Cyclodialysis Cleft (1)","V039.mp4","This 43 year-old man was punched in this eye 5 years previously and has had decreased vision since that time. On initial examination he had 20/50 vision with an intraocular pressure of 8 mmHg. Gonioscopy was difficult but it appeared that there might be a cyclodialysis cleft inferiorly. The patient was treated with steroids in the hope of decreasing trabecular outflow. He was also placed on atropine to deepen the angle. On follow-up his intraocular pressure had not improved but the atropine had improved the view of his iridocorneal angle and it was clear that there was a cyclodialysis cleft at twelve o'clock.","cyclodialysis-cleft/cyclodialysis-cleft-1.htm"],
["Cyclodialysis Cleft (2)","V094.mp4","This 18 year-old woman was struck by a water balloon in her left eye. She presented with count fingers vision and an intraocular pressure of 4 mmHg. She had a 30% hyphema. After a period of hypotony her intraocular pressure gradually returned to a normal level without intervention. This video was taken five months after her injury and shows a cyclodialysis cleft that has healed on its own.","cyclodialysis-cleft/cyclodialysis-cleft-2.htm"],
["Cyclodialysis Cleft (3)","V186.mp4","This patient was struck in the eye with a bungee cord five months prior to this examination. He sustained a hyphema, which resolved. However two months later he had decreased visual acuity with optic nerve edema and retinal folds. On examination he had 20/300 vision in the right eye with an intraocular pressure of 7 mmHg.","cyclodialysis-cleft/cyclodialysis-cleft-3.htm"],
["Cyclodialysis Cleft (4)","V333.mp4","This patient was injured with a racquetball in the left eye 37 years before he was evaluated in our clinic. He did not have any examination at the time of injury. In 2012 he was found to have an elevated intraocular pressure with angle recession. On our examination we found the angle to be recessed with a very wide area of a cyclodialysis cleft that has clearly healed on its own.","cyclodialysis-cleft/cyclodialysis-cleft-4.htm"]]],
["Trauma",[
["Vossius Ring - slit lamp only","V132.mp4","This is a 15 year-old male who was hit in the eye with a football kicked from about 8 feet away. He presented with a hyphema and a visual acuity of hand motion. This video was taken 6 days after the injury and shows Vossius ring.","trauma/vossius-ring-slit-lamp-only.htm"],
["Iridodialysis - Slit lamp only","V185.mp4","This patient was in a car that struck a deer. The left eye had count fingers visual acuity and the large iridodialysis seen here. The pressure was 4 mmHg and the lens was dislocated into the vitreous. The patient underwent a pars plana vitrectomy and McCannel sutures (times four). Ultimately an aniridic style intraocular lens was placed but the patient's vision never improved over 20/400 due to retinal pathology.","trauma/iridodialysis-slit-lamp-only.htm"],
["Iridodialysis - Huge - slit lamp only","V130.mp4","47 year-old struck by rock in OD. Presented with CF vision and an IOP of 27 mmHg. His lens was dislocated. His IOP remained elevated despite maximum medical therapy and he underwent a pars plana vitrectomy, lensectomy and McCannel sutures x 6. The second video is nine years later. The IOP was 12 mmHg on three medications and the visual acuity with a contact lens was 20/20-3.","trauma/iridodialysis-huge-slit-lamp-only.htm"],
["Metallic FB in CB","V128.mp4","50 years before this video was shot this 70-year old patient was grinding high quality steel and felt something strike his left eye. He was not examined at that point and had been doing well for many years. He developed glaucoma in both eyes, which was more difficult to control in this left eye. Suddenly, 50 years after his injury he developed a peaked pupil. He was found to have metal in his ciliary body.","trauma/metallic-fb-in-cb.htm"]]],
["Hyphema",[
["Hyphema (slit lamp only)","V150.mp4","This 15 year-old African-American male had undergone fine needle aspiration for a lesion that was ultimately determined to be an adenoma of the non-pigmented epithelium of the ciliary body (see his pre-hemorrhage clip under Tumours). The patient's family denied a sickle cell history but later admitted that the patient's uncle died from sickle cell disease. The patient bled at the time of surgery and developed a large hyphema requiring anterior chamber washout and trabeculectomy.","hyphema/hyphema.htm"],
["Corneal Blood Staining (slit lamp only) - 1","V046.mp4","This 18 year-old man has had diabetes mellitus since age 4. He has had severe proliferative diabetic retinopathy and neovascular glaucoma for which he has undergone setons in both eyes. At the time of this video his intraocular pressure was 4 mmHg in this eye that has had no light perception for many months. This eye has had a long-standing hyphema of more than 6 months duration.","hyphema/corneal-blood-staining-1.htm"],
["Corneal Blood Staining (slit lamp only) - 2","V114.mp4","At age 37 this man was poked with a finger in the eye and had a 100% hyphema. During his management he had intraocular pressures as high as 60 mmHg. He was first seen in our clinic 6-months after the injury with an intraocular pressure of 20 mmHg and the corneal blood staining that can be seen clearly in this video. He ultimately required corneal transplantation because after 13 months this staining had not resolved.","hyphema/corneal-blood-staining-2.htm"],
["Corneal Blood Staining - Resolution","V181.mp4","This 11 year-old was struck by a twig in the right eye. He had a partial thickness corneal laceration and a 1.8 mm hyphema with an intraocular pressure of 18 mmHg and 20/250 vision. Four days later he developed the flu with violent vomiting. When he was seen he had light perception vision with a 100% hyphema. He underwent anterior chamber washout with a trabeculectomy. This was repeated with an iridectomy a week later. Ten days after his severe rebleed he was noted to have corneal blood staining. The video follows the course of the resolution of his blood staining over the course of 14 months. He eventually underwent cataract extraction with IOL placement and had 20/25 vision.","hyphema/corneal-blood-staining-3.htm"],
["Corneal Blood Staining - Resolution (short)","V226.mp4","This clip is an abbreviated version of the preceding clip. It shows the resolution of corneal blood staining over 14 months.","hyphema/corneal-blood-staining-4.htm"]]],
["Ghost Cells",[
["Ghost Cells","V072.mp4","","ghost-cells/ghost-cells.htm"]]],
["Foreign Body",[
["Fragment of Lens in Angle","V008.mp4","At age 35 was pounding metal on metal and sustained an intraocular foreign body. He underwent an immediate lensectomy and vitrectomy. Five years later he presented with an intraocular pressure of 60 mmHg. His iris had turned brown. No metal could be detected on X-ray but the ERG was unrecordable. Seven years later (12 years after the injury) he was found to have a brown foreign body in the anterior chamber that was presumed to be retained lens material discolored by iron.","foreign-body/fragment-lens-angle.htm"],
["Triamcinolone in Angle","V060.mp4","75 year-old man with age-related macular degeneration with a sub-foveal choroidal neovascular membrane. Had intravitreal triamcinolone (Kenalog). Seven days later he was found to have crystals in his anterior segment. There was no history of prior intraocular surgery. Courtesy of Young H. Kwon, MD, PhD, The University of Iowa","foreign-body/triamcinolone-in-angle.htm"],
["Silicone Oil in the Angle","V024.mp4","This 27 year-old male with type 1 diabetes mellitus underwent a pars plana vitrectomy with silicone oil for traction retinal detachment.","foreign-body/silicone-oil-angle.htm"],
["Perfluoro-n-octane in Angle","V023.mp4","58 year-old man who had a retinal detachment surgery 9 years before in which perfluoro-n-octane was used to flatten the retina.","foreign-body/perfluoro-octane-angle.htm"],
["Perfluoro-n-octane in the Anterior Chamber","V158.mp4","This 26 year-old man has Marfan syndrome and had bilateral pars plana vitrectomy, lensectomy with anterior chamber intraocular lenses. Perfluoro-n-octane (PFO) was used during his vitrectomy and one can see it in the anterior chamber at the haptic of the intraocular lens.","foreign-body/perfluoro-octane-anterior-chamber.htm"]]]]},
{n:"Cysts & tumours",b:"Benign cysts first, then nevi, melanoma, and the rest.",g:[
["Cyst",[
["Iris Cyst","V106.mp4","On routine eye examination this 33 year-old woman was found to have a mass in her right iris. This had never been noted before. The patient was asymptomatic. Her visual acuity and intraocular pressures were normal. By echography she has a fluid-filled cyst in her iris.","cyst/iris-cyst.htm"],
["Iris Stromal Cyst","V047.mp4","79yo male presented in 2003 with iris stromal cyst OD. This was noted on a routine eye examination and had not been noted three years before. On echography this lesion is cystic. In four years of follow-up there was no interval change.","cyst/iris-stromal-cyst.htm"],
["Iris Pigmented Epithelial Cysts","V223.mp4","On routine examination this 65 year-old female was found to have an area of fullness in the iris of her right eye. Here she was found to have multiple iris cysts in both eyes.","cyst/iris-pigmented-epithelial-cysts.htm"],
["Cyst of the Iris Pigment Epithelium","V190.mp4","When this patient was undergoing cataract extraction her surgeon noted a mass that had not been seen before and aborted the case. She has a cyst of the iris pigment epithelium that, on dilated examination, extends into the pupillary space.","cyst/cyst-iris-pigment-epithelium.htm"],
["PDS from Iris Cysts (1)","V107.mp4","This 42 year-old woman had elevated intraocular pressures with evidence of pigment dispersion. Rather than having the typical slit-like defects in the pigment epithelium that one would see in pigment dispersion syndrome she had large globular areas of pigment epithelial loss and on ultrasound biomicroscopy was found to have cysts of the iris pigment epithelium pushing the pigment epithelium against the zonules. The patient is seen 6-years later at which time one of the cysts has grown large enough to reach into the pupil. You can see that she has undergone a trabeculectomy for intractably elevated intraocular pressures. The video was taken not long after her trabeculectomy, which explains the blood subconjunctivally inferiorly. This patient was reported in the Archives of Ophthalmology volume 113, pages 1574-1575, 1995.","cyst/pds-from-iris-cysts-1.htm","Pigmentary"],
["PDS from Iris Cysts (2)","V133.mp4","This 47 year-old man presented with bilateral narrow angles. On examination he was found to have large iris cysts of the pigment epithelium. His intraocular pressures were normal in both eyes but there were portions of his iridocorneal angle that were closed and therefore an iridotomy was performed in the left eye. This video shows the patient before and after the iridotomy. This patient also had pigment dispersion caused by abrasion of the pigment epithelium against the lens zonules.","cyst/pds-from-iris-cysts-2.htm","Pigmentary"],
["Epithelial Inclusion Cyst (1)","V036.mp4","Presented at age 32 with a mass in the left eye. He had a vague history of trauma but was not sure which eye. Vision 20/25, IOP 18 mmHg. Underwent iridocyclectomy. At last follow-up, 3 years after surgery, he had no evidence of epithelium. His visual acuity was 20/15 and his IOP was 16 mmHg.","cyst/epithelial-inclusion-cyst-1.htm"],
["Epithelial Inclusion Cyst (2)","V201.mp4","This 25 year old man was struck in the right eye with a screwdriver 6 years before this video was taken. His visual acuity was light perception. He has had a normal intraocular pressure and as can be seen a dense white cataract as well as a small clear cyst in the anterior chamber. The patient had the lens and epithelial cyst removed with placement of a posterior chamber intraocular lens. When he was last seen, 9 months after his surgery he refracted to 20/20 and had no evidence of recurrence of the cyst, which had been removed intact.","cyst/epithelial-inclusion-cyst-2.htm"],
["Epithelial Inclusion Cyst with Debris","V327.mp4","This 58-year-old woman had a trabeculectomy in her left eye in March 2011. In December 2011, she was found to have a cyst in her inferior anterior chamber and a year later this had grown so she was referred to see us. The cyst was drained and the contents were consistent with an epithelial inclusion cyst. This is interesting in that one can see cellular debris moving within the cyst in convection currents.","cyst/epithelial-inclusion-cyst-debris.htm"]]],
["Tumor",[
["Probable Iris Nevus","V211.mp4","This patient had always noted speckles of brown pigmentation on her blue iris. Her ophthalmologist noticed that one of the nodules on the right iris appeared raised and referred her for evaluation and ultrasound.","tumor/probable-iris-nevus.htm"],
["Iris Nevus vs. Small Iris Melanoma","V055.mp4","This patient presented in 1999 at the age of 27 years old. At that time she said that she had always had a freckle in her right eye that her parents noted when she was a child. This lesion has been followed at the time of this video for 11 years with no change. It is either a thick iris nevus or a melanoma. On echography the lesion is 0.8 mm thick.","tumor/iris-nevus-vs-small-iris-melanoma.htm"],
["Nevus with Ectropion","V007.mp4","30 yo, mass present for 10 years. He has noted a recent change in size. An iridocyclectomy was performed. Pathologic examination demonstrated a spindle cell nevus.","tumor/nevus-with-ectropion.htm"],
["Intrastromal Amelanotic Iris Nevus","V120.mp4","This 53 year-old white male went to his optometrist complaining of decreased visual acuity in the right eye and was found to have a hyphema and an elevated intraocular pressure to 32 mmHg. When we saw him he had an amelanotic mass as seen here. His visual acuity was equal and normal in both eyes and his intraocular pressures were 16 mmHg OD and 17 mmHg OS. On echography this lesion was 1.9 mm thick and appeared to extend deep into the angle but not into the ciliary body. The lesion was vascular. It was recommended to this patient that he consider excision of this lesion but he refused any surgical management. 26 months later he returned because the lesion was bleeding intermittently. The lesion was resected and was found to be an intrastromal amelanotic iris nevus. Eight weeks after his surgery he had 20/25 vision and an intraocular pressure of 14 mmHg.","tumor/intrastromal-amelanotic-iris-nevus.htm"],
["Amelanotic Iris Lesion","V206.mp4","22 year-old female found to have this lesion on routine examination. Over four years of follow-up it had not changed.","tumor/amelanotic-iris-lesion.htm"],
["Atypical Nevus","V043.mp4","19-year-old white female with a history of a stable iris nevus in her right eye since age 2 years. Significant family history: both father and grandfather died of cutaneous melanoma. This iris lesion was stable until July 2002 when it started to enlarge. This baseline video was obtained. In 2007 the lesion was clearly larger. VA 20/20 IOP = 14 mm Hg bilaterally. She underwent enucleation. Pathologic diagnosis: \"Atypical iris nevus, most consistent with borderline spindle cell nevus type. Lesion extends into trabecular meshwork. Satellite lesions are present in the angle.\"","tumor/atypical-nevus.htm"],
["Melanocytoma","V010.mp4","Seen in 1996 at age 36 with a spot on his right eye for 1 - 2 years. Fine needle aspiration biopsy revealed melanocytoma. Followed 22 years without significant change.","tumor/melanocytoma.htm"],
["Iris Melanoma","V012.mp4","First seen at age 27 with a mass in the right eye that was first noted by the patient eight years ago. She was followed with standardized echography and clinical evaluation and after seven years was shown to have progressive growth. A fine needle aspiration biopsy showed a melanoma with spindle and epithelioid cells and so she underwent an iridocyclectomy. The margins of the wound were free of tumor and she has been followed for 14 years without recurrence. In the 13th post-operative year she developed a cataract that was removed with placement of a lens with an artificial iris.","tumor/iris-melanoma.htm"],
["Recurrent Iris Melanoma","V044.mp4","This 40 year-old female first presented in 1991 with a pigmented iris mass lesion OD. She underwent an iridectomy with excisional biopsy of the pigmented iris mass in 1992. She was doing well a year later and then was lost to follow-up for 11 years when she returned with recurrences on her iris. She underwent enucleation.","tumor/recurrent-iris-melanoma.htm"],
["Iris Melanoma - Huge","V176.mp4","This patient was seen in 1985 at age 66 with a pigmented flat iris lesion on his left eye. He was not seen again until 23 years later at age 89 when this mass had grown to the size seen here. His intraocular pressure had required three medications to keep it in a normal range. On ultrasound the mass extended 3 mm above the iris plane. Interestingly his referring physician had done a phacoemulsification three years earlier and, on ultrasound, the haptic of the IOL appeared to be engulfed in tumor. The patient refused enucleation and had radiation plaque therapy performed.","tumor/iris-melanoma-huge.htm"],
["Iris and Ciliary Body Melanoma","V214.mp4","A 57 year old woman noted a light spot on her iris 10 months before being seen at our institution. Her local optometrist had never seen this over the 3 years that the patient had been followed by him. The patient was healthy and had no history of other tumors. One can see a thick angle lesion on slit-lamp examination and gonioscopy. On echography the lesion appeared to be confined to the iris and anterior ciliary body however, in surgery the mass was larger than anticipated. The histopathology was that of a malignant melanoma with epithelioid cells extending to the clinically-uninvolved ciliary body. The patient was advised to consider enucleation and proceeded with this.","tumor/iris-and-ciliary-body-melanoma.htm"],
["Ciliary Body Melanoma - 1","V138.mp4","14 year-old noted to have a mass OS. Echo was highly reflective. The fine-needle aspiration biopsy was positive for melanoma. Enucleated, diagnosis spindle cell melanoma.","tumor/ciliary-body-melanoma-1.htm"],
["Ciliary Body Melanoma - 2","V142.mp4","This 36 year-old man has a history of superficial skin melanoma on his right forearm that was removed at age 21. A few months prior to this video he developed a red eye and was found to have cell and flare and was started on steroids. Two months later on follow-up this mass was noted. He had a decreasing visual acuity with myopic shift. On exam his visual acuity was 20/125 but refracted to 20/25 with -2.25 diopters of sphere. His intraocular pressure was normal at 13 mmHg. On ultrasound this lesion is 10 mm thick. The patient underwent metastatic workup and was found to have lesions in his brain, spleen and liver. He was treated with chemotherapy and radiation.","tumor/ciliary-body-melanoma-2.htm"],
["Ciliary Body Melanoma - 3","V221.mp4","The iris lesion in this 79 year old patient developed rather suddenly. He had been followed in the same practice for 35 years and three years before this video had undergone cataract extraction with no mention of an iris abnormality. We see a large mass that has broken through the iris and a really nice example of the value of infrared video transillumination to see the extent of this lesion posteriorly. This patient was returned to his home state for enucleation and an oncology evaluation.","tumor/ciliary-body-melanoma-3.htm"],
["Ciliary Body Melanoma - 4","V304.mp4","This 47 year old woman first noted a dark spot on her iris approximately 5 months before this video was taken. She seemed to have a large dark mass that pushes against her cornea and appears to push the iris out of the way rather than sit on top of the iris. On ultrasound this mass is quite large extending well posteriorly to the iris. The patient returned to her home state for oncology workup.","tumor/ciliary-body-melanoma-4.htm"],
["Ring Melanoma - 1","V009.mp4","71 year-old man referred for an IOP of 44 mmHg in his left eye. He had 20/30 vision. His ultrasound was compatible with ciliary body melanoma.","tumor/ring-melanoma.htm"],
["Ring Melanoma - 2","V191.mp4","This 86-year-old woman was found to have more prominent pigmentation of her left iris than previously. Her IOP climbed into the 20s and she was begun on glaucoma medications. Recently she had developed anemia and had colonoscopy during which time a suspicious lesion was identified. This lesion looks like an iris / ring melanoma.","tumor/ring-melanoma-2.htm"],
["Heterochromia Ring","V011.mp4","49 year-old referred for trabeculectomy with the diagnosis of pigmentary glaucoma. He had a history of elevated IOP in the right eye for 4 years. He had had pressures as high as 47 mmHg. At present he was on four medications and had undergone a trabeculoplasty. On examination he had an IOP of 38 mmHg and total cupping of the optic nerve with a 5-degree visual field. The patient underwent enucleation, which confirmed the diagnosis of diffuse melanoma.","tumor/heterochromia-ring.htm"],
["Adenoma of the Ciliary Body Non-Pigmented Epithelium","V006.mp4","This thirteen year-old male first noted a spot on the iris seven months before this evaluation. A fine needle aspiration biopsy was most consistent with a congenital iris cyst of epithelial origin. Five years later the lesion had grown substantially and an iridocyclectomy was performed. The mass was found to be an adenoma of the non-pigmented epithelium of the ciliary body.","tumor/adenoma-of-the-ciliary-body-non-pigmented-epithelium.htm"],
["Ciliary Body Adenoma","V324.mp4","This patient was discovered to have a mass on routine examination. It is noted that the mass is very closely intertwined with the haptic of her intraocular lens. A fine needle aspiration biopsy was performed that demonstrated a probable adenoma of the non-pigmented ciliary epithelium.","tumor/ciliary-body-ademona.htm"],
["Adenomatous Tumor of the Ciliary Body","V216.mp4","This 35 year old woman was first noted to have an iris lesion on the left side 3 to 4 months prior to presentation. She was in excellent health and has no history suggestive of another malignancy. On ultrasound the lesion measured 3.8 mm in height and one-third of the lesion was behind the ciliary body. A fine needle aspiration biopsy was performed that was not consistent with melanoma but contained eosinophils and macrophages suggesting a granulomatous process. A biopsy was attempted but the tumor was quite friable. Ultimately the entire mass was removed with iridocyclectomy. The pathology was suggestive of either a benign adenoma of the nonpigmented ciliary body epithelium or a metastatic lesion. The patient was evaluated for other primary tumors and none were found.","tumor/adenomatous-tumor-of-the-ciliary-body.htm"],
["Metastatic Breast Carcinoma","V126.mp4","Six years after a diagnosis of breast cancer this patient noted a lesion in her eye that led her to consult her ophthalmologist. The mass seen here was found to be highly reflective and vascular on standard echography. A chest x-ray revealed a lung lesion that was felt to be a metastatic breast tumor. The patient was started on Tamoxifen and was followed closer to her home.","tumor/metastatic-breast-carcinoma.htm"],
["Masquerade Syndrome (slit lamp only)","V332.mp4","This 60-year-old patient was diagnosed with glaucoma 12 years prior to being seen. He had a history of chronic uveitis in the right eye. In 2012 he was diagnosed with sarcoid based on a positive lung biopsy. In July 2012 he was seen in our glaucoma clinic with an intraocular pressure of 40 mmHg, 360° of peripheral anterior synechia and a cataract. He underwent cataract extraction with intraocular lens and Ahmed seton. Twelve weeks after his surgery he had a hypopyon with an atypical appearance. A tap and inject was performed and no growth was found. Parallel to this he developed epididymitis which worsened on oral steroids. He was also losing weight on oral steroids. A paracentesis demonstrated a high grade B-cell lymphoma and a PET scan showed lymphoma in the retroperitoneal abdominal wall and testes.","tumor/masquerade-syndrome-slit-lamp-only.htm"]]]]},
{n:"After surgery",b:"What the angle looks like after lasers, filters, tubes and MIGS — and when surgery causes the glaucoma.",g:[
["Post Surgical Appearance",[
["Pigment after LPI","V164.mp4","Inferior angle increased pigmentation after a laser iridotomy. Courtesy of Howard Cohn, MD, American Hospital of Paris","post-surgical-appearance/pigment-after-lpi.htm"],
["PAS from ALT","V144.mp4","This 74-year-old woman was diagnosed with POAG 18 years previously. She had undergone ALT seven years before this video. She was on four medications, including pilocarpine. The video demonstrates multiple PAS, presumably due to laser trabeculoplasty in an eye with a narrow angle.","post-surgical-appearance/pas-from-alt.htm"],
["Peripheral Ant Synechiae from Trabeculoplasty","V025.mp4","76 year-old woman diagnosed with primary open angle glaucoma at age 68. She had argon laser trabeculoplasty performed two years before this examination. The patient is hyperopic (+2.50 D OD and +4.00 D OS).","post-surgical-appearance/peripheral-ant-synechiae-from-trabeculoplasty.htm"],
["Internal Sclerostomy","V187.mp4","This 80-year-old patient had a trabeculectomy performed 13 years before. This brief clip shows an open internal sclerostomy.","post-surgical-appearance/internal-sclerostomy.htm"],
["Iris over Sclerostomy","V210.mp4","This patient had iris to a sclerostomy after trabeculectomy. The video shows the appearance before and after Nd:YAG laser treatment to open the sclerostomy site.","post-surgical-appearance/iris-over-sclerostomy.htm"],
["Iris into Sclerostomy - slit lamp only","V203.mp4","This patient has primary open angle glaucoma. At age 50 he underwent a trabeculectomy in his right eye and, 7 months later had a needling performed of the bleb. After the bleb needling he was referred in with the clinical appearance seen here. His iris is peaked and there is pigmented material inside the filtering bleb. Thankfully, his intraocular pressure was 9 mmHg and his visual acuity was 20/25.","post-surgical-appearance/iris-into-sclerostomy-slit-lamp-only.htm"],
["Appearance After Iridencleisis","V147.mp4","In 1959 this patient had an acute attack of angle closure at the age of 19 and underwent an iridencleisis in both eyes. One can see that there is a superior sector iridectomy through which iris is sutured into the filtering site and can be seen subconjunctivally. On gonioscopy one can see iris into the sclerostomy site.","post-surgical-appearance/appearance-after-iridencleisis.htm"],
["Bleeding after Trabeculectomy - slit lamp only","V054.mp4","85 year-old man who is one day out from a trabeculectomy. He has active bleeding in his anterior segment. This resolved with patching and his ultimate outcome was excellent with a final IOP of 10 mmHg.","post-surgical-appearance/bleeding-after-trabeculectomy-slit-lamp-only.htm"],
["Bleeding Trabeculectomy Site","V171.mp4","This patient at age 83 presented with hyphema in the left eye. He had undergone a trabeculectomy a decade earlier and had a phacoemulsification about 6-years earlier. One can see bleeding from the trabeculectomy site. Attempts at laser coagulation were unsuccessful but a surgical revision of the bleb resolved this patient's intermittent bleeding episodes.","post-surgical-appearance/bleeding-trabeculectomy-site.htm"],
["Bleb Leak (slit lamp only)","V194.mp4","This patient has undergone trabeculectomy elsewhere. He developed a bleb leak and had undergone a bleb revision. He presented at this time with a brisk leak. His intraocular pressure was 8 mmHg and his eye was well formed. This is a nice example of a positive Seidel test.","post-surgical-appearance/bleb-leak-slit-lamp-only.htm"],
["Suprachoroidal Hemorrhage","V135.mp4","This patient had undergone a trabeculectomy and early after surgery had developed a giant suprachoroidal hemorrhage allowing one to see the retina through the pupil.","post-surgical-appearance/suprachoroidal-hemorrhage.htm"],
["Nonpenetrating Surgery","V227.mp4","At age 31 this 35 year old Asian-American woman underwent nonpenetrating glaucoma surgery while visiting Japan. She had a history of normal tension glaucoma. At the time she was seen she was on three classes of medications in each eye with intraocular pressures of 10 mmHg OD and 11 mmHg OS.","post-surgical-appearance/nonpenetrating-surgery.htm"],
["Post Canaloplasty","V312.mp4","This patient had undergone a canaloplasty and has a prolene suture that clearly delineates Schlemm's canal.","post-surgical-appearance/post-canaloplasty.htm"],
["Trabectome","V141.mp4","This is a 64 year-old woman who had a trabectome performed two months prior to this video. This was done elsewhere and did not function. She subsequently underwent laser trabeculoplasty and was referred in with poorly controlled pressures despite the use of latanoprost and timolol. This is a very nice view of the cleft that's made with a trabectome.","post-surgical-appearance/trabectome.htm"],
["Corneal Decomp Due to Tube Shunt","V013.mp4","This patient has end-stage glaucoma. He had a Molteno seton performed when he was phakic and a subsequent Baerveldt seton when he was pseudophakic. He subsequently developed corneal decompensation. His inferior tube is in good position behind the trabecular meshwork but the superior tube comes through the peripheral cornea and probably led to the sectoral corneal decompensation.","post-surgical-appearance/corneal-decomp-due-to-tube-shunt.htm"],
["Retisert Implant","V331.mp4","This patient has chronic posterior uveitis for which he has undergone a Retisert implant. He was referred for uncontrollable steroid-induced glaucoma for which he underwent an Ahmed seton.","post-surgical-appearance/retisert-implant.htm"],
["Appearance after diode laser CPC","V195.mp4","This patient has traumatic aniridia after a fall. Her early post-trauma appearance is shown under ghost cells. She had diode laser cyclophotocoagulation for uncontrolled intraocular pressure. Because of her aniridia we can see clearly the effect that the laser has had on the ciliary body.","post-surgical-appearance/appearance-after-diode-laser-cpc.htm"],
["Bleeding from Cataract Incision","V018.mp4","80 year-old woman who had undergone an ECCE 10 years before awoke with blurred vision.","post-surgical-appearance/bleeding-from-cataract-incision.htm"],
["Inadvertent Filtering Bleb","V145.mp4","This patient underwent extracapsular cataract extraction in 1983. Since that time he had a chronic low intraocular pressure. When this video was taken 9-years after his surgery his intraocular pressure was 3 and he suffered from fluctuating visual acuity. He underwent repair of his surgical wound with an ultimate intraocular pressure of 14 mmHg.","post-surgical-appearance/inadvertent-filtering-bleb.htm"],
["Eroded Haptic","V301.mp4","This patient is an 86-year-old man who has had glaucoma for 20 years. This eye had an extracapsular cataract extraction with posterior chamber lens done 23 years before this video was taken. This eroded haptic into the anterior chamber was an incidental finding on gonioscopy and has caused him no difficulties whatsoever.","post-surgical-appearance/eroded-haptic.htm"]]],
["Post Surgical Glaucoma",[
["Pseudophakic Pupillary Block","V115.mp4","After cataract surgery this patient developed chronic inflammation that was diagnosed as P. acnes endophthalmitis for which he underwent lens exchange with a limited anterior vitrectomy and intravitreal antibiotics. One week later he was found to have an elevated intraocular pressure and evidence of iris bombé with the iris ballooning around his anterior chamber intraocular lens. After laser iridotomy this entirely resolved and his pressure returned to normal.","post-surgical-glaucoma/pseudophakic-pupillary-block.htm"],
["UGH Syndrome","V031.mp4","This 88 year-old woman had a cataract extraction in the right eye 21 years prior to this exam. She had an iris clip intraocular lens placed and was doing well until the day before presenting when she had sudden loss of vision in the right eye. She had an intraocular pressure of 8 mmHg with corneal guttata and Descemet's folds. She had pigmented vitreous cells.","post-surgical-glaucoma/ugh-syndrome.htm"],
["UGH Syndrome - slit lamp only","V149.mp4","This patient had extracapsular cataract extraction with intraocular lens performed in 1995. He developed chronic iritis and a sputtering hyphema from a lens rubbing on his iris vessels. He ultimately required intraocular lens exchange.","post-surgical-glaucoma/ugh-syndrome-slit-lamp-only.htm"]]],
["Epithelial Fibrous Downgrowth",[
["Epithelial Downgrowth","V103.mp4","This patient was referred for a glaucoma evaluation. She had a history of undergoing an intracapsular cataract extraction in 1979. In November 2004 she had a secondary anterior chamber intraocular lens placed and subsequently developed intractably elevated intraocular pressure. She was seen in this video 8 months after the anterior chamber intraocular lens was placed.","epithelial-downgrowth/epithelial-downgrowth.htm"],
["Fibrous Downgrowth","V307.mp4","This 45-year-old woman has primary open angle glaucoma and had undergone multiple surgeries in this eye including a trabeculectomy in 2007, which required a revision and then an Ahmed shunt surgery, which also required a revision. She was hypotonous for periods during her postoperative care. She was then seen by another physician who found that her Ahmed tube was impaled into her crystalline lens, which required her to have a shunt revision with a cataract extraction. She later underwent another Ahmed revision and subsequently a Baerveldt seton with a pars plana vitrectomy and the tube placed in the posterior segment. She was referred to the University of Iowa because of the corneal changes seen in this video.","epithelial-downgrowth/fibrous-downgrowth.htm"]]]]},
{n:"Miscellaneous",b:"The odd ones out.",g:[
["Miscellaneous",[
["Pupillary Membrane","V165.mp4","This 35 year-old Asian woman has excellent vision and normal intraocular pressure. This extensive remnant of her pupillary membrane was an incidental finding. The remainder of her eye examination was normal. Courtesy of: Howard Cohn, MD, American Hospital of Paris","miscellaneous/pupillary-membrane.htm"],
["Iris Flocculi","V179.mp4","This is a healthy 36 year-old man with a history of uveitis and glaucoma in the right eye for which he had a successful trabeculectomy five years earlier. He has iris flocculi in both eyes.","miscellaneous/iris-flocculi.htm"],
["AV Malformation","V231.mp4","This 37 year old was found to have a prominent iris vessel on his right iris during a routine examination. This vessel was found to be non-leaking on fluorescein angiography. This patient has arteriovenous malformation of the iris. A series of 14 cases was published by Shields et al., Archives of Ophthalmology, Vol. 124, pp. 370-375, 2006, describing it as a benign stationary condition with no apparent systemic associations or local complications.","miscellaneous/av-malformation.htm"],
["Congenital Microcoria","V200.mp4","This patient was seen at age 48 years with very small pupils. She had been born with pinpoint pupils. The pupils were unresponsive to dilation. She complained of worsening visual acuity. Evaluation was challenging because of her microcoria. After discussion with the patient we proceeded to perform a pupil stretching and sphincterotomy. Subsequently the patient's lens was removed and her visual acuity in this eye improved from 20/70 to 20/20. Ultimately the fellow eye was also done. Congenital microcoria is rare and often associated with angle abnormalities, as was the case in this patient. By definition the pupil is less than 2 mm in diameter and nonreactive or minimally reactive. Microcoria may be sporadic and, when seen as an inherited disorder, is typically autosomal dominant.","miscellaneous/congenital-microcoria.htm"],
["Coloboma","V143.mp4","69 year-old man with poor vision all his life. Had fluid under his right retina that required repeated draining and laser demarcation. At age 68 he developed elevated intraocular pressure and was begun on medication.","miscellaneous/coloboma.htm"],
["Sclerocornea - slit lamp only","V139.mp4","We first saw this child at 8-months of age. Before being seen she had already had two penetrating keratoplasties in her left eye. This video was taken at 4½ years of age at which time she had count fingers vision in the right eye and light perception vision in the left.","miscellaneous/sclerocornea-slit-lamp-only.htm"],
["Kayser-Fleischer Ring","V104.mp4","This 15 year-old boy was referred to the Ophthalmology Department during an evaluation for Wilson's disease. A Kayser-Fleischer ring can be seen at the slit lamp but is very obvious on gonioscopy.","miscellaneous/kaiser-fleischer-ring.htm"],
["Iris Roll - Trying to Dilate","V220.mp4","This 78 year old woman with primary open angle glaucoma has been on chronic cholinergics. Her pupil fails to dilate when given cycloplegic/mydriatic drops due to fibrosis of the sphincter. However the peripheral iris does get thrown into folds by the attempt at dilation.","miscellaneous/iris-roll-trying-to-dilate.htm"],
["Iris Retraction Syndrome","V177.mp4","This 44 year-old male was hit with a shotgun shell on the right eye as a child. He had not had much in the way of medical attention. Three years prior to being seen for this examination he had a decrease in vision in the right eye. On examination his visual acuity in this eye was light perception and his intraocular pressure was 56 mmHg. On ultrasound he has a total retinal detachment with a cyst indicating a long standing detachment. He was started on aqueous suppressants and latanoprost. When he returned his intraocular pressure had dropped to 5 mmHg and his iris was markedly backbowed. The marked backbowing in this iris is characteristic of the very unusual condition called iris retraction syndrome that requires a break in the retina as well as 360 degrees of central posterior synechia…","miscellaneous/iris-retraction-syndrome.htm"],
["Angle Closure from SCH","V086.mp4","This 78 year-old man awoke with acute pain in the right eye and an intraocular pressure of 61 mmHg. His visual acuity was light perception only. He has a shallow anterior chamber and a mid-dilated pupil with corneal edema. This patient has a posterior chamber intraocular lens and his fellow eye has a very deep angle (D40R). On ultrasound examination he was found to have a very large suprachoroidal hemorrhage. The patient has pre-existing macular degeneration with a neovascular membrane and is on Coumadin.","miscellaneous/angle-closure-from-sch.htm"],
["Stripped Descemet's","V096.mp4","This patient had a trabeculectomy and subsequent revision. The revision was performed two months prior to this video. He complained of decreased visual acuity post-operatively and was referred for evaluation. He has a totally detached Descemet's membrane. Of note, during his trabeculectomy revision he developed a completely flat anterior chamber that was deepened with viscoelastic.","miscellaneous/stripped-descemets.htm"],
["Air-filled Anterior Segment","V140.mp4","56 year-old woman with recurrent retinal detachments. The first detachment was fixed approximately two months prior to this video. Despite this she had a large inferior retinal detachment and was referred for treatment. She had a repeat scleral buckling procedure performed with an air fluid exchange. When seen later her entire globe was gas-filled with no visible aqueous – even on gonioscopy.","miscellaneous/air-filled-anterior-segment.htm"]]]]}
];

// Teaching questions: group -> [[question, [correct, wrong, wrong, wrong], explanation], ...]
var QB = {
"Basic Exam Technique":[
["Why can't the angle be seen at the slit lamp without a goniolens?",["Total internal reflection at the tear film–air interface","The limbus is opaque","The iris always covers it","The slit beam can't be angled far enough"],"Light from the angle exceeds the critical angle at the cornea–air interface and is reflected back. A goniolens replaces air with lens material and breaks that interface."],
["With a mirrored (indirect) goniolens, the mirror at 12 o'clock shows…",["The inferior angle","The superior angle","The nasal angle","The temporal angle"],"Indirect lenses show the angle opposite the mirror, so the superior mirror views the inferior angle."],
["The main practical advantage of a 4-mirror (Zeiss/Posner-style) lens is that it…",["Allows indentation gonioscopy","Gives a much larger image","Needs no slit lamp","Doesn't need topical anaesthetic"],"Its small contact area (smaller than the cornea), with no coupling fluid, lets you press on the cornea and push aqueous into the angle."],
["Why keep the slit beam short and off the pupil during gonioscopy?",["Light constricts the pupil and can make a narrow angle look open","It bleaches the trabecular meshwork","Bright light raises IOP","It causes corneal oedema"],"Miosis pulls the peripheral iris away from the angle, so a beam through the pupil can give a falsely open view."]],
"Normal Angle":[
["Order of angle structures from the cornea back to the iris:",["Schwalbe's line → trabecular meshwork → scleral spur → ciliary body band","Scleral spur → Schwalbe's line → trabecular meshwork → ciliary body band","Trabecular meshwork → Schwalbe's line → ciliary body band → scleral spur","Schwalbe's line → scleral spur → trabecular meshwork → ciliary body band"],"Schwalbe's line (end of Descemet's) is most anterior, then meshwork (pigmented posteriorly), the white scleral spur, and the ciliary body band."],
["Which landmark is the white band between the pigmented meshwork and the ciliary body band?",["Scleral spur","Schwalbe's line","Schlemm's canal","Iris root"],"The scleral spur is the key landmark: if you can see it, the angle is open at that point."],
["How do normal iris processes differ from PAS?",["They are fine, lacy strands that follow the angle concavity and let you see structures behind them","They are broad and opaque","They always reach Schwalbe's line","They open up on indentation"],"Iris processes are delicate and see-through. PAS are solid adhesions that hide the structures behind them and don't move away on indentation."],
["A circumferential vessel in the angle recess of a light iris that doesn't cross the scleral spur is most likely…",["The normal greater arterial circle of the iris","Angle neovascularisation","Blood in Schlemm's canal","An AV malformation"],"Normal vessels stay behind the spur. New vessels branch and run across the spur onto the meshwork."],
["A prominent, anteriorly displaced Schwalbe's line (posterior embryotoxon) is…",["Often seen as an isolated normal variant","Always associated with glaucoma","Diagnostic of ICE syndrome","A sign of previous trauma"],"It is found in a minority of normal eyes. It counts as Axenfeld-Rieger only when iris strands attach to it, with or without other anomalies."],
["Blood filling Schlemm's canal during gonioscopy in a normal eye is usually caused by…",["The lens compressing episcleral veins","Neovascularisation","Hypotony","Carotid-cavernous fistula"],"Pressure from the lens raises episcleral venous pressure above IOP, so blood refluxes into the canal. Spontaneous blood without lens pressure points to raised episcleral venous pressure."]],
"Angle Grading":[
["In Spaeth grading (e.g. D40f), the capital letter describes…",["Where the iris inserts","The angle width in degrees","Peripheral iris shape","Meshwork pigmentation"],"A–E give the iris insertion, from A (anterior to the meshwork) to E (extremely deep, well behind the spur)."],
["In Spaeth grading, the lower-case letter (f, b, c, p) describes…",["Peripheral iris contour","Iris insertion","Pigment grade","Lens used"],"f = flat, b = bowed/convex, c = concave, p = plateau."],
["A 'B' iris insertion means the iris inserts…",["Behind Schwalbe's line, at the level of the trabecular meshwork","At the scleral spur","Deep in the ciliary body band","Anterior to Schwalbe's line"],"B insertions are high and risk closure. C is at the spur, and D is behind the spur with the ciliary body band visible."],
["The trailing number in 'D40f1' grades…",["Pigmentation of the posterior trabecular meshwork (0–4)","Number of quadrants that are open","IOP band","Number of iris processes"],"Spaeth's 0–4 scale for meshwork pigmentation is often added as a suffix."]],
"Difficult Angles":[
["Which quadrant is usually the widest and most pigmented, and so the best place to orient yourself?",["Inferior","Superior","Nasal","Temporal"],"The inferior angle shows the landmarks most clearly. Find them there, then trace them around the eye."],
["The corneal wedge technique locates…",["Schwalbe's line, where the reflections from the front and back of the cornea meet","The scleral spur","The pupil margin","Schlemm's canal"],"A thin slit beam shows two corneal reflections that converge at Schwalbe's line, even in an unpigmented angle."],
["On indentation gonioscopy, an angle that stays closed suggests…",["Synechial closure (PAS)","Appositional closure","Plateau iris","A normal angle"],"Appositional closure opens when aqueous is pushed into the angle. PAS hold the iris against the meshwork."],
["Van Herick: a peripheral AC depth of less than ¼ of the corneal thickness suggests…",["A possibly occludable angle that needs gonioscopy","A wide-open angle","Angle recession","Nothing; it is normal"],"Van Herick is only a screen. Grade ≤1/4 means do gonioscopy."],
["'Looking over the hill' with a convex iris is done by…",["Having the patient look toward the mirror, or tilting the lens toward the angle being viewed","Pressing hard to indent","Dilating the pupil","Switching to a direct lens"],"This changes the viewing angle so you can see over a bowed iris without changing the angle itself."]],
"Pupillary Block":[
["Which ocular biometry is typical of primary pupillary-block angle closure?",["Short axial length, hyperopia and a thick lens","Long axial length and myopia","Flat cornea with a thin lens","Deep anterior chamber"],"Crowded anterior segments raise resistance to aqueous flow from the posterior to the anterior chamber at the pupil. Myopic cases are unusual (see the 'Narrow Angles' clip)."],
["First-line definitive treatment for pupillary-block angle closure:",["Laser peripheral iridotomy","Pilocarpine alone, long term","Selective laser trabeculoplasty","Cyclodiode"],"An iridotomy lets aqueous bypass the pupil, so the iris flattens. Lens extraction is increasingly used too."],
["Glaukomflecken are…",["Anterior subcapsular lens opacities from epithelial necrosis after very high IOP","Pigment on the endothelium","Iris stromal atrophy","Exfoliative material"],"They are a marker of a previous acute IOP rise, as are sectoral iris atrophy and a fixed, mid-dilated pupil."]],
"Peripheral Anterior Synechiae":[
["Which of these is LEAST likely to cause PAS?",["Pigment dispersion syndrome","Chronic angle closure","Anterior uveitis","Neovascularisation"],"Pigment dispersion syndrome has a deep, open angle with posterior iris bowing."],
["PAS after argon laser trabeculoplasty are more likely when burns are placed…",["Too posteriorly or in a narrow angle","On the anterior non-pigmented meshwork","At low power","On fewer than 90°"],"Posterior burns near the spur or iris root promote synechiae. ALT was aimed at the anterior meshwork."]],
"Plateau Iris Syndrome":[
["The classic sign of plateau iris on indentation gonioscopy is…",["The 'double hump' sign","A sampaolesi line","Iris bombé","A Scheie stripe"],"The peripheral hump is the iris draped over anteriorly placed ciliary processes; the central hump is the iris over the lens."],
["The mechanism of plateau iris is…",["Anteriorly positioned ciliary processes holding the peripheral iris forward","Pupillary block","A swollen lens","Posterior iris bowing"],"So the angle can stay narrow despite a patent iridotomy."],
["The angle remains narrow despite a patent iridotomy because of plateau iris. A useful laser option is…",["Argon laser peripheral iridoplasty","Repeat iridotomy","SLT","YAG capsulotomy"],"Iridoplasty contracts the peripheral iris stroma away from the angle. Lens extraction is another option."]],
"Phacomorphic":[

          for(let i=a;i<=b;i++) r.seg|=(1<<i);
          mark();
          if(!counted && pass>=0.9*d){ r.w++; counted=true; touch(k); }
        } else if(dt<-1){ if(counted){ pass=0; counted=false; } }
      }
      last=t;
    });
    vid.addEventListener('emptied',()=>{ last=null; pass=0; counted=false; });
    vid.addEventListener('seeking',()=>{ last=null; });
    vid.addEventListener('seeked',()=>{ last=vid.currentTime; if(counted && vid.currentTime<0.1*vid.duration){ pass=0; counted=false; } });
  }
  // image cases: mark image k of n as seen, count a 'view', add dwell time
  function seen(v,k,n){ const r=rec(v); const a=Math.floor(k/n*SEG), b=Math.max(a,Math.ceil((k+1)/n*SEG)-1); for(let i=a;i<=b&&i<SEG;i++) r.seg|=(1<<i); mark(); }
  function watch(v){ rec(v).w++; touch(v); }
  function addTime(v,dt){ rec(v).s+=dt; mark(); }
  function coverage(v){ const r=get(v); if(!r) return 0; let c=0; for(let i=0;i<SEG;i++) if(r.seg&(1<<i)) c++; return c/SEG; }
  function q(v,ok){ const r=rec(v); r.qa++; if(ok) r.qc++; touch(v); }
  function t(v,ok,delta){ const r=rec(v); if(delta){ r.tc+=delta; } else { r.ta++; if(ok) r.tc++; } touch(v); }
  const maxMerge=(a,b)=>{ const o={...(a||{})}; for(const [v,s] of Object.entries(b||{})){ const r=o[v]={...(o[v]||blank())}; F.forEach(f=>r[f]=Math.max(r[f]||0,s[f]||0)); r.seg=(r.seg|0)|(s.seg|0); r.last=Math.max(r.last||0,s.last||0); } return o; };
  function exportObj(extra){ save(); const devices={...OTH}; devices[META.dev]={name:META.name,at:Date.now(),stats:ST};
    return {app:'GonioScroll',version:2,savedAt:new Date().toISOString(),resetAt:META.resetAt,devices,...(extra||{})}; }
  function exportJSON(extra){ return JSON.stringify(exportObj(extra)); }
  // Merge a backup / synced file. Idempotent: importing the same data twice changes nothing.
  function importJSON(text,manual){
    const o=typeof text==='string'?JSON.parse(text):text; if(!o||(!o.devices&&!o.stats)) throw new Error('Not a GonioScroll backup');
    let wiped=false; const ra=o.resetAt||0;
    if(ra>META.resetAt){ ST={}; OTH={}; META.resetAt=ra; wiped=true; }
    else if(ra<META.resetAt && !manual){ return {o:{},wiped:false,stale:true}; } // synced data from before a reset: ignore it
    const devs=o.devices||{legacy:{name:'Imported backup',stats:o.stats}};
    for(const [id,d] of Object.entries(devs)){
      if(id===META.dev) ST=maxMerge(ST,d.stats);
      else OTH[id]={name:d.name||'Other device',at:Math.max((OTH[id]||{}).at||0,d.at||0),stats:maxMerge((OTH[id]||{}).stats,d.stats)};
    }
    mark(); save(); listeners.forEach(f=>f(null)); return {o,wiped};
  }
  function reset(){ ST={}; OTH={}; META.resetAt=Date.now(); mark(); save(); listeners.forEach(f=>f(null)); }
  function devices(){ const l=[{id:META.dev,name:META.name,me:true,n:Object.values(ST).filter(s=>s.w||s.qa||s.ta||s.seg).length}];
    for(const [id,d] of Object.entries(OTH)) l.push({id,name:d.name,at:d.at,n:Object.values(d.stats||{}).filter(s=>s.w||s.qa||s.ta||s.seg).length}); return l; }
  return { get, attach, seen, watch, addTime, coverage, q, t, save, exportJSON, exportObj, importJSON, reset, devices, on:f=>listeners.push(f), rev:()=>rev, persistent:!!store, dev:()=>META.dev };
})();

var DATA2={"disc":[{"n":"The normal disc & variants","b":"Learn the normal disc first: size, cup, rim colour and vessels — then variants that mimic disease.","items":[{"t":"Normal optic disc (right eye)","im":[["https://thumb.wikimedia.org/wikipedia/commons/thumb/3/37/Fundus_photograph_of_normal_right_eye.jpg/1280px-Fundus_photograph_of_normal_right_eye.jpg",""]],"h":"Fundus photograph of the right eye, showing a fundus with no sign of disease or pathology. It is seen from front so that left in each image is to the person's right. The gaze is into the camera, so the macula is in the center of the image, and the optic disk is located towards the nose (right in ima","u":"https://commons.wikimedia.org/wiki/File:Fundus_photograph_of_normal_right_eye.jpg","cr":"Mikael Häggström. · CC0","src":"wm"},{"t":"Normal optic disc (left eye)","im":[["https://thumb.wikimedia.org/wikipedia/commons/thumb/4/48/Fundus_photograph_of_normal_left_eye.jpg/1280px-Fundus_photograph_of_normal_left_eye.jpg",""]],"h":"Fundus photograph of the left eye, showing a fundus with no sign of disease or pathology. It is seen from front so that left in each image is to the person's right. The gaze is into the camera, so the macula is in the center of the image, and the optic disk is located towards the nose (left in image","u":"https://commons.wikimedia.org/wiki/File:Fundus_photograph_of_normal_left_eye.jpg","cr":"Mikael Häggström. · CC0","src":"wm"},{"t":"Myopic but healthy disc","im":[["https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/Fundus_photograph_of_a_healthy_right_eye_%28OD%29_from_a_myopic_Asian_male_patient._Age_23.png/1280px-Fundus_photograph_of_a_healthy_right_eye_%28OD%29_from_a_myopic_Asian_male_patient._Age_23.png",""]],"h":"Fundus photograph of a healthy right eye (OD) from a myopic Asian male patient. Age 23. Notice the scleral and pigment crescents from 7 to 11 o'clock. The white glial tissue indicates a healthy nerve fiber layer above the retinal blood vessels. The margins of the small cup within the disc are indist","u":"https://commons.wikimedia.org/wiki/File:Fundus_photograph_of_a_healthy_right_eye_(OD)_from_a_myopic_Asian_male_patient._Age_23.png","cr":"OptometrusPrime · CC BY-SA 2.0","src":"wm"},{"t":"Gray crescent of the optic nerve head","im":[["E:photos/Gray-crescent-optic-nerve-head/L/Gray-crescent-optic-nerve-head-L.jpg","This 34-year-old African American male might appear to have severe thinning of the temporal neuroretinal rim, but if the examiner traces the margin of the optic disc carefully and realizes there is a gray crescent, he will appreciate the rim of healthy optic nerve tissue temporally."]],"h":"Gray crescents of the optic nerve head are crescent-shaped areas of slate gray pigmentation in the substance of the peripheral optic nerve head. They are more common in African American patients, but are not associated with an increased risk of glaucoma. They are important to recognize and differentiate from peripapillary pigmentation, because failing to do so might lead one to misinterpret the width of the neuroretinal rim. This 34-year-old African American male might appear to have severe thinning of the temporal neuroretinal rim, but if the examiner traces the margin of the optic disc carefully and realizes there is a gray crescent, he will appreciate the rim of healthy optic nerve tissue temporally. Optical coherence tomography revealed normal thickness of the retinal nerve fiber layer in all quadrants surrounding the optic nerve head.","u":"pages/gray-crescent-ONH.htm","cr":"Justin Risma, MD","src":"er"},{"t":"Megalo-optic disk","im":[["E:photos-earlier/Megalodisk-copy.jpg","congenital anomaly, contralateral disk normal, visual acuity 20/20 in each eye"]],"h":"congenital anomaly, contralateral disk normal, visual acuity 20/20 in each eye","u":"pages/megalo-optic-disk.html","cr":"Thomas A. Weingeist, PhD, MD","src":"er"},{"t":"Situs Inversus of the Retinal Vessels","im":[["E:photos/Situs-inversus/SI-1-LRG.jpg",""],["E:photos/Situs-inversus/SI-2-LRG.jpg",""],["E:photos/Situs-inversus/si-3-LRG.jpg",""]],"h":"The patient was a 57-year-old man with vision loss in the right eye (OD) greater than left eye (OS) in the setting of a craniopharyngioma, which was resected 16 years prior. His visual acuity had been no light perception OD and 20/20 OS since the procedure. Figure 1 is a fundus photo from a patient who has significant situs inversus (note, the scarring in the macula is from prior laser treatment and unrelated to the situs inversus). Figure 2 is a fundus photo from a different patient who has moderate situs inversus. It is easiest to appreciate this vascular variation when it is compared to a normal fundus (Figure 3).","u":"pages/situs-inversus.htm","cr":"Elizabeth Gauger, MD and Eric Chin, MD","src":"er"},{"t":"Myelinated nerve fiber layer","im":[["E:photos/myelinated-NFL-A-BC.jpg","Fundus showing classic myelinated retinal nerve fiber layer. Photographer: Brice Critser, CRA"],["E:pages/i/OD_MNF.jpeg","Photographer: Alexandra Copple, CRA"],["E:pages/i/OS_MNF.jpeg","Fundus showing bilateral myelinated retinal nerve fiber layer (OS). Photographer: Alexandra Copple, CRA"]],"h":"Updated: March 4, 2026 August 18, 2025 Original: September 9, 2013 Myelination of the optic nerve fibers normally begins at the lateral geniculate body and ceases at the lamina cribosa. However, in some individuals areas of the retinal nerve fiber layer can also become myelinated. Classically, this finding is unilateral and peripapillary in location, appearing as a white, flame-shaped area with feathered borders as seen in the top photo. However, it can also present bilaterally in 7% of these patients as illustrated in the middle photo.(1) The bottom photo shows a less common presentation affecting a more extensive distribution of the peripheral nerve fibers. Note how the nerve fibers temporal to the macula respect the horizontal raphe, a concept not easily visualized under normal conditions. Reference Straatsma BR, Foos RY, Heckenlively JR, Taylor GN. Myelinated retinal nerve fibers. American journal of ophthalmology. 1981;91(1):25–38. Available at: http://www.ncbi.nlm.nih.gov/pubmed/7234927.","u":"pages/myelinated-NFL.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Myelinated nerve fiber layer with visual field defect","im":[["E:pages/myelinated-NFL-with-VF-defect/myelinated-RNFL-LRG.jpg",""]],"h":"Samantha Jacobs This is an example of a prominent myelinated nerve fiber layer. These can have corresponding visual field defects as seen here on Goldmann perimetry with depression of the I4e, I3e, and I2e isopters in the region of the myelination. This is an unusual case as it is located along the horizontal raphe; typically, the myelin is peripapillary in location.","u":"pages/myelinated-NFL-with-VF-defect/index.htm","cr":"Luke Lenci, MD","src":"er"},{"t":"Anomalous appearing optic nerves in both eyes","im":[["E:photos/Drusen-ON-or-disc/optic-disc-drusen-fundus-5yo-2.jpg",""]],"h":"5 year old girl anomalous appearing optic nerves in both eyes, which appeared elevated on stereoscopic exam, concerning for optic disc edema.","u":"pages/anomalous-optic-nerves.htm","cr":"Pavlina S. Kemp, MD","src":"er"},{"t":"Intrapapillary Hemorrhage","im":[["E:photos/intrapapillary-hemorrhage/fundus-OD-intrapapillary-hemorrhage-LRG.jpg","Color fundus photography of the right eye shows an intrapapillary hemorrhage of the superior portion of the optic nerve extending from 11:30-1:00 with adjacent hyperemia of the optic disc."]],"h":"Antoinette Venckus A 62-year-old female with primary open angle glaucoma was seen in the glaucoma clinic for follow-up and was incidentally found to have an intrapapillary hemorrhage in her right eye as shown below (figure 1). Intrapapillary hemorrhages are more common near the nasal border of the nerve in myopic eyes with tilted discs, and may be spontaneous or precipitated by acute disc edema, valsalva maneuver, or vitreopapillary traction [1]. The patient in this scenario was not myopic, and underwent echography to rule our optic nerve drusen or a vascular tumor. It was later revealed that she had been coughing recently, possible leading to a valsalva maneuver. These hemorrhages generally have a good prognosis and resolve spontaneously [1,2]. Of note, this hemorrhage is different than the typical peripapillary hemorrhage seen in normal tension glaucoma, which is located on the border of the border of the optic disc (see Optic Disc Hemorrhage in Normal Tension Glaucoma). Reference: Kokame GT, Yamamoto I, Kishi S, Tamura A, Drouilhet JH. Intrapapillary hemorrhage with adjacent peripapillary subretinal hemorrhage. Ophthalmology 2004;111(5):926-930. https://PubMed.gov/15121370. DOI: 10.1016/j.ophtha.2003.08.040 Moon IH, Lee SC, Kim M. Intrapapillary hemorrhage with concurrent peripapillary and vitreous hemorrhage in two healthy young patients. BMC Ophthalmol 2018;18(1):172. https://PubMed.gov/30005697. DOI: 10.1186/s12886-018-0833-z","u":"pages/intrapapillary-hemorrhage.htm","cr":"Heather A. Stiff, MD; David A. Ramirez, MD","src":"er"}]},{"n":"Congenital anomalies","b":"Discs that formed abnormally.","items":[{"t":"Optic nerve hypoplasia","im":[["E:photos-earlier/ON-hypoplasia.jpg",""]],"h":"","u":"pages/optic-nerve-hypoplasia.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Superior segmental optic nerve hypoplasia","im":[["E:pages/SSONH/SSONH-LRG.jpg",""]],"h":"Superior segmental optic nerve hypoplasia (SSONH), also known as topless disc syndrome, is a subcategory of optic nerve hypoplasia in which the findings are generally localized to the superior aspect of the disc. In this condition, there is superior disc pallor, a superior peripapillary scleral halo, superior retinal nerve fiber layer thinning, and the central retinal artery has a relatively superior entrance to the eye. The condition often results in a corresponding inferior visual field defect as demonstrated in this Goldmann visual field. A strong associated has been demonstrated between SSONH and maternal diabetes.","u":"pages/SSONH/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Optic Nerve Coloboma with Optic Pits","im":[["E:photos-earlier/OpticNerveLrg50degree.jpg","This is a very large optic nerve with optic nerve pits. Note that this is a 50 degree photo to give you an idea of the size and depth of the nerve. The intraocular pressure is normal."]],"h":"This is a very large optic nerve with optic nerve pits. Note that this is a 50 degree photo to give you an idea of the size and depth of the nerve. The intraocular pressure is normal.","u":"pages/Optic-Nerve-Coloboma-with-Optic-Pits.html","cr":"Armand P. Fasano, MD","src":"er"},{"t":"Optic nerve coloboma with peripapillary choroidal neovascular membrane","im":[["E:pages/ON-coloboma/Optic-nerve-coloboma-LRG.jpg","This young patient with an optic nerve coloboma has the appearance of disc cupping and developed a peripapillary choroidal neovascular membrane that was involuted at the time of this photograph."]],"h":"Colobomas of the optic nerve result from incomplete closure of the embryonic fissure during development of the eye. They may be associated with colobomas of the choroid, retina, or iris. Some colobomas can be confused with glaucomatous cupping of the optic disc.","u":"pages/ON-coloboma/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Optic nerve coloboma with staphyloma","im":[["E:pages/ON-coloboma-staphyloma/Optic-nerve-coloboma-staphyloma-LRG.jpg",""]],"h":"Randy Verdick, FOPS Colobomas of the optic nerve result from incomplete closure of the embryonic fissure during development of the eye. They may be associated with colobomas of the choroid, retina, or iris.","u":"pages/ON-coloboma-staphyloma/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Morning Glory Disc Anomaly with Peripapillary Staphyloma","im":[["E:photos/MorningGlory-Disc-Anomaly-1LARGE.JPG",""],["E:photos/MorningGlory-Disc-Anomaly-2LARGE.JPG",""]],"h":"This four-year-old female presented at age one with a left exotropia. Her vision is poor in this eye and she has a large relative afferent pupillary defect. Her left optic disc is enlarged and the vessels are straightened and radiate outward from a central glial tuft. These are features of morning glory disc anomaly. However, the patient also has a very deep excavation of the peripapillary sclera and atrophy of the overlying retina consistent with a peripapillary staphyloma. Morning glory disc is a non-hereditary congenital or developmental anomaly that is usually unilateral and occurs more frequently in females. Visual acuity can range between normal to no light perception, but is usually between 20/100 to 20/200. Associated problems include serous macular retinal detachments and basal enchephaloceles.","u":"pages/morning-glory-anomaly-peripapillary-staphyloma.htm","cr":"Justin Risma, MD","src":"er"},{"t":"Optic Nerve Pit","im":[["E:photos/optic-nerve-pit/Fig1-optic-nerve-pit-OD.jpg",""],["E:photos/optic-nerve-pit/Fig2-optic-nerve-pit-OS.jpg",""]],"h":"August 9, 2023 Bilateral optic nerve pits (black arrows) with some associated maculopathy right eye > left seen in a 12-year-old boy. An optic nerve pit is a congenital defect thought to arise from incomplete closure of the embryonic fissure during development and appears as an oval gray-white or black depression. It is a very rare condition (estimated prevalence of 1 in 11,000), bilateral in 15% cases, and equally prevalent in men and women. Optic nerve pits (black arrows) in the right and left eye, respectively. (Fig 1 and 2) Reference: Georgalas I, Ladas I, Georgopoulos G, Petrou P. Optic disc pit: a review. Graefes Arch Clin Exp Ophthalmol. 2011 Aug;249(8):1113-22. doi: 10.1007/s00417-011-1698-5. Epub 2011 Jun 3. PMID: 21638030.","u":"pages/optic-nerve-pit.htm","cr":"Noor-Us-Sabah Ahmad, MD; Salma Dawoud, MD","src":"er"},{"t":"Optic nerve pit maculopathy","im":[["E:photos/Optic-nerve-pit-maculopathy/L/Optic-nerve-pit-maculopathy-LRG.jpg",""]],"h":"Optic nerve pits are colobomatous defects in the optic nerve, most common inferotemporally. Most optic nerve pits are asymptomatic, but they can occasionally cause serous macular detachments as seen in this fundus photograph. A large window defect can be seen in the macula on fluorescein angiography due to atrophy of the retinal pigmented epithelium. The OCT scan shows extensive subretinal fluid extending from the optic nerve.","u":"pages/optic-nerve-pit-maculopathy.htm","cr":"Jesse Vislisel, MD","src":"er"}]},{"n":"Glaucomatous disc","b":"Cupping, notching, haemorrhages and rim loss.","items":[{"t":"Lamina cribrosa in primary open angle glaucoma","im":[["E:photos/lamina-cribrosa-POAG.jpg",""],["E:photos/lamina-cribrosa-POAG-closeup.jpg",""]],"h":"Cindy Montague This patient has a deep optic nerve head cup and prominent inferotemporal notch secondary to optic nerve damage from primary open angle glaucoma. The deep cup reveals the lamina cribrosa, a fenestrated region composed of connective tissue and elastic fibers. This mesh-like structure allows the ganglion cells forming the optic nerve to pass through the scleral wall.","u":"pages/lamina-cribrosa-in-POAG.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Optic Disc Notch and Retinal Nerve Fiber Layer Defect in Primary Open Angle Glaucoma","im":[["E:photos/inf-notch/inf-notch-NFL-defect-macula.PNG","The optic nerve shows moderate cupping but there is a prominent inferior notch. The normal sheen of the nerve fiber layer is absent in a distribution radiating temporally from this notch due to cellular loss. The notch and nerve fiber layer defect can be more easily visualized on optical coherence tomography."],["E:photos/inf-notch/inf-notch-NFL-defect-OCT-orig.PNG","Humphrey visual field shows a corresponding superior arcuate scotoma."]],"h":"The optic nerve shows moderate cupping but there is a prominent inferior notch. The normal sheen of the nerve fiber layer is absent in a distribution radiating temporally from this notch due to cellular loss. The notch and nerve fiber layer defect can be more easily visualized on optical coherence tomography. Humphrey visual field shows a corresponding superior arcuate scotoma.","u":"pages/inf-notch-NFL-defect-HVF.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Optic disc hemorrhage in normal tension glaucoma","im":[["E:photos/optic-disc-hemorrhage/in-NTG.PNG",""],["E:photos/optic-disc-hemorrhage/in-NTG-closeup.jpg",""]],"h":"Brice Critser Optic disc hemorrhage indicating inadequate intraocular pressure control in a patient with normal tension glaucoma. Disc hemorrhages are more common in normal tension glaucoma than in primary open angle glaucoma. This patient also has peripapillary atrophy, visible as a pale ring around the optic nerve.","u":"pages/Optic-Disc-Hemorrhage-in-NTG.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Bayoneting of vessels and bean-pot cupping in advanced glaucoma","im":[["E:pages/Bean%20Pot%20Cupping/color-fundus-ou-LRG.jpg","Optical coherence tomography analysis of the optic nerve head (ONH), retinal nerve fiber layer (RNFL), and ganglion cell layer fiber layer of both eyes. Left image: Both eyes demonstrate marked ONH cupping and diffuse RNFL loss. Right image: Both eyes demonstrate marked ganglion cell loss of the macula."]],"h":"Glaucoma is an optic neuropathy characterized by remodeling of the optic nerve head with loss of neural tissue resulting in distinctive visual field defects [1]. It is the leading cause of irreversible blindness worldwide, and by the year 2040, an estimated 111.8 million individuals will be affected [2]. Historically, visualization of the optic nerve head has been used to assess disease severity. The optic nerve head contains a cup which is delineated by the neuroretinal rim. Normal cup-disc ratios range from 0.1 to 0.4, but as neural rim tissue is lost, the cup progressively enlarges and the underlying lamina cribrosa becomes more apparent [1]. In severely advanced glaucoma with complete loss of retinal tissue, retinal vessels may disappear as they make a sharp turn into the cup, termed bayoneting or \"bean-pot\" cupping. Deeper vessels as they re-emerge may appear out of focus [3].","u":"pages/Bean%20Pot%20Cupping/bean-pot-cupping.htm","cr":"Ryan J. Diel, MD, Brittni A. Scruggs, MD, PhD","src":"er"},{"t":"Megalopapillae and severe glaucoma","im":[["E:pages/Megalopapillae-severe-glaucoma/megalopapillae-severe-glaucoma-fundus-LRG.jpg","This OCT shows bilateral megalopapillae with a disc area of 4.18 mm2 in the right eye and severe cupping in this 44-year-old African male with juvenile open glaucoma, initially diagnosed at age 24."]],"h":"This OCT shows bilateral megalopapillae with a disc area of 4.18 mm2 in the right eye and severe cupping in this 44-year-old African male with juvenile open glaucoma, initially diagnosed at age 24.","u":"pages/Megalopapillae-severe-glaucoma/index.htm","cr":"Elisabeth Aponte, MD","src":"er"}]},{"n":"The swollen disc","b":"Papilloedema and its mimics: raised ICP, ischaemia, inflammation, infiltration.","items":[{"t":"Papilloedema","im":[["C:1/1a/Papilledema.jpg",""]],"h":"Photo demonstrating Papilledema which is a swollen optic disc caused by increased intracranial pressure.","u":"https://commons.wikimedia.org/wiki/File:Papilledema.jpg","cr":"Jonathan Trobe, M.D. - University of Michigan Kellogg Eye Ce · CC BY 3.0","src":"wm"},{"t":"Severe papilloedema","im":[["C:a/a6/Fundal_photograph_showing_severe_papilloedema_in_the_right_eye.jpg",""]],"h":"Fundal photograph showing severe papilloedema in the right eye. Bansal et al. Journal of Medical Case Reports 2008 2:86 doi:10.1186/1752-1947-2-86","u":"https://commons.wikimedia.org/wiki/File:Fundal_photograph_showing_severe_papilloedema_in_the_right_eye.jpg","cr":"Shveta Bansal , Timothy Dabbs and Vernon Long · CC BY 2.0","src":"wm"},{"t":"Papilledema","im":[["E:pages/Papilledema/papilledema-B-LRG.jpg","The papilledema and hemorrhages resolved on four month follow-up"]],"h":"61-year-old male presented with new onset floaters and found to have prominent papilledema and peripapillary hemorrhages from a combination of hypertensive emergency, sleep apnea, carbon monoxide poisoning, and aseptic meningitis (A). Each of these alone would unlikely have caused such a dramatic picture of hemorrhage and disc edema.","u":"pages/Papilledema/index.htm","cr":"John Chen, MD","src":"er"},{"t":"Papilledema secondary to meningitis","im":[["E:pages/papilledema-secondary-to-meningitis/OD-LRG.jpg",""],["E:pages/papilledema-secondary-to-meningitis/OS-LRG.jpg",""],["E:pages/papilledema-secondary-to-meningitis/OD-disc-LRG.jpg",""]],"h":"Increased intracranial pressure can have multiple ocular manifestations. Since the optic nerve is wrapped in the meninges, increased pressure in the cerebrospinal fluid (CSF) space can result in forward displacement and edema of the optic nerves. Bilateral disc edema should always carry a high suspicion of papilledema. Papilledema is potentially sight threatening and many of the conditions that produce it are life threatening. Hemorrhages on the optic disc are associated with acute rather than long-standing edema. A second ocular sign (this patient's presenting complaint but not shown here) of increased intracranial pressure is sixth nerve palsy. Cranial nerve six has a long path from the pons through the prepontine cistern where it ascends the along the clivus. The nerve is tightly tethered to the meninges at Dorello's canal where it pierces through the clivus to enter the cavernous sinus. A rise in intracranial pressure can stretch cranial nerve six in this location resulting in a nerve palsy. While isolated, unilateral cranial nerve six palsy is more likely to be vascular in origin, bilateral cranial nerve six palsy is highly suspicious for increased intracranial pressure.","u":"pages/papilledema-secondary-to-meningitis/index.htm","cr":"Tressa Larson, OD","src":"er"},{"t":"Idiopathic Intracranial Hypertension (IIH, Pseudotumor Cerebri)","im":[["E:photos/IIH/IIH-4.jpg","In the right eye nerve OCT there is intraretinal schisis next to the right nerve and in the papillomacular bundle, and abrupt RPE atrophy."],["E:photos/IIH/IIH-12.jpg","In the left eye nerve OCT there is abrupt RPE atrophy as seen in the right eye."],["E:photos/IIH/IIH-3.jpg","Right eye"]],"h":"In the right eye nerve OCT there is intraretinal schisis next to the right nerve and in the papillomacular bundle, and abrupt RPE atrophy. In the left eye nerve OCT there is abrupt RPE atrophy as seen in the right eye.","u":"pages/IIH.htm","cr":"Kimberly Winges, MD","src":"er"},{"t":"Cerebral venous sinus thrombosis causing intracranial hypertension","im":[["E:photos/CVST-IH-1n2.jpg","Fundus Photos"]],"h":"This patient presented with headaches, pulse synchronous tinnitus, and transient visual obscurations of 1 week duration, and was found to have grade 4 disc edema with prominent peripapillary hemorrhages. FLAIR MRI (left lower image) and MRV (right lower image) demonstrated a subacute right transverse sinus thrombosis (blue arrow) as the cause of the intracranial hypertension. Cerebral venous sinus thrombosis must be evaluated for in patients with signs and symptoms of increased intracranial pressure. On MRI, an acute thrombus within 5 days will have intermediate signal on T1-weighted imaging and low signal on T2-weighted imaging. A subacute thrombus will have high signal on both T1- and T2-weighted imaging. A late thrombus will have progressive heterogeneous signal loss on T1- and T2-weighted imaging. MRV is helpful in demonstrating a lack of flow through the thrombosed venous sinus.","u":"pages/CVST.htm","cr":"John J. Chen","src":"er"},{"t":"Olfactory groove meningioma in a pregnant female","im":[["E:pages/imgs/R_5frZ7HOfa74snbb_thumbnail_OD_Meningioma.jpg","Fundus photo demonstrates temporal pallor of the optic nerve and thinning of the papillomacular bundle OU."],["E:pages/imgs/R_5frZ7HOfa74snbb_thumbnail_OS_Meningioma.jpg","Fundus photo demonstrates temporal pallor and thinning of the papillomacular bundle OU."]],"h":"Patient is a 34-year-old pregnant woman (34w0d) presenting with progressive vision loss predominately in her right eye that has been ongoing for approximately 1-2 months and anosmia. Visual acuities at initial presentation were 20/150 OD and 20/20 OS. Pupillary examination showed a 0.90 log unit RAPD OD. Color vision was diminished OD, normal OS. Dilated funduscopic examination was notable for temporal pallor of the optic nerve and thinning of the papillomacular bundle OU. MRI Brain revealed a large olfactory groove meningioma. Goldmann visual fields showed central depression and a central/cecocentral scotoma OD (right photograph) with a possible superior arcuate vs. baring of the blind spot OS (left photograph).","u":"pages/Olfactory_groove_meningioma_in_a_pregnant_female.html","cr":"Ella J. Gehrke, MD; Jaffer Naqvi, MD; Edward F. Linton, MD","src":"er"},{"t":"High water marks after resolution of acute optic nerve head edema","im":[["E:photos/High-water-mark.jpg",""]],"h":"25-year-old female with history of acute left optic nerve head edema, now resolved. In this photo you can see a circumpapillary \"high-water mark\". When seen, this defines the prior extent of retinal elevation after the acute edema resolves. This artifact may take months or years to disappear.","u":"pages/high-water-marks.htm","cr":"Elizabeth Gauger, MD","src":"er"},{"t":"Non-arteritic anterior ischemic optic neuropathy (NAION)","im":[["E:photos/NAION/Fig2-Funduscopic-congested-optic-disc-OD.jpg","OCT of the optic nerves showed bilateral superior RNFL bundle loss corresponding with the above photo. (Fig. 7)"],["E:photos/NAION/Fig1-Funduscopic-optic-disc-edema-OS.jpg","Funduscopic examination showed optic disc edema in the left eye that was more prominent inferiorly along with RNFL hemorrhages. (Fig. 2)"],["E:photos/NAION/Fig3-Funduscopic-right-optic-disc-edema-6months-OD.jpg","Six month
