tograph shows a closer view of the primary horseshoe tear with two smaller retinal tears nearby. Lattice degeneration and intr"]],"h":"71-year-old man presented with 2 weeks of blurred vision and curtain-like vision loss obscuring the inferior portion of his left visual field. Visual acuity was 20/50+2. Fundoscopy (see image) demonstrated a large horseshoe break at 12:30 at the equator, with a slightly rolled edge and a bridging vessel. There was subretinal fluid from 10:00 clockwise to 3:00, extending posteriorly to just involve","u":"pages/Rhegmatogenous-ret-detach.htm","cr":"Zachary Q. Mortensen, MD","src":"er"},{"t":"Rhegmatogenous Retinal Detachment, Macula-Off","im":[["E:LARGE/rhegmato-ret-detach-macula-off-1-LRG.jpg","Image 1: OD: clear media; normal disc, vessels and macula; in the periphery, there were scattered areas of lattice degeneration (270 degrees"],["E:LARGE/rhegmato-ret-detach-macula-off-3-LRG.jpg","Image 3: OS: low magnification montage, rhegmatogenous macula-off retinal detachment (temporal to the white arrows); not shown, the patient"],["E:LARGE/rhegmato-ret-detach-macula-off-4-LRG.jpg","Image 4: OD: higher magnification of the rhegmatogenous retinal detachment that involves the macula."]],"h":"Image 1: OD: clear media; normal disc, vessels and macula; in the periphery, there were scattered areas of lattice degeneration (270 degrees from 4 to 1 o'clock clockwise) near the ora, however there were no other retinal tears or detachments.","u":"pages/rhegmatogenous-ret-detach-macula-off.htm","cr":"Eric Chin, MD","src":"er"},{"t":"Retinal detachment with proliferative vitreoretinopathy","im":[["E:LARGE/RDwithPVR-L.jpg",""],["E:pages/imgs/PVR_Star_Folds_2.png","Wide-field pseudocolor fundus photograph of the right eye shows a macula-involving rhegmatogenous retinal detachment associated wi"],["E:pages/imgs/PVR_Star_Folds_1.png","Wide-field pseudocolor fundus photograph, left eye. There is a macula-involving retinal detachment due to inferior proliferative v"]],"h":"Wide-field pseudocolor fundus photograph of the right eye shows a macula-involving rhegmatogenous retinal detachment associated with a prominent star fold temporally and a retinal tear in the inferotemporal periphery","u":"pages/RDwithPVR.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Retinal Dialysis and Choroidal Rupture after Blunt Trauma","im":[["W:photos/choroidal-rupture-macular-hole/choroidal-rupture-LRG.jpg",""],["W:photos/choroidal-rupture-macular-hole/choroidal-rupture-nerve-LRG.jpg",""],["W:photos/choroidal-rupture-macular-hole/macular-hole-LRG.jpg",""]],"h":"Doreen Dykhuizen This patient experienced blunt eye injury after bungee cord recoil. Color fundus montage photograph of the right eye shows a macular hole and peripapillary choroidal ruptures extending into the macula. There is subretinal hemorrhage and fluid inferior to the macular hole and in the peripapillary region. Optical coherence tomography (Heidelberg) demonstrates a partial-thickness macular hole with subre","u":"pages/choroidal-rupture.html#gsc.tab=0:~:text=Retinal%20Dialysis%20and%20Choroidal%20Rupture%20after%20Blunt%20Trauma","cr":"Austin R. Fox, MD","src":"er"},{"t":"Marshall Syndrome","im":[["E:photos/marshall-syndrome/color-fundus-fig1-LRG.jpg","Color fundus photography, OU.There are large areas of choroidal atrophy OU, including atrophy along the superior and inferior arca"]],"h":"This patient had a lifelong history of profound hearing loss and vision loss in the left eye (OS) greater than right eye (OD) in the setting of Marshall syndrome with high myopia and aphakic glaucoma in both eyes (OU). She underwent strabismus surgery for esotropia as a child and bilateral extracapsular cataract extraction when she was 27-years-old","u":"pages/marshall-syndrome.htm","cr":"Brittni A. Scruggs, MD, PhD and John H. Fingert, MD, PhD","src":"er"}]},{"n":"The macula","b":"Membranes, holes, serous detachments, folds and toxicity.","items":[{"t":"Epiretinal membrane","im":[["E:photos/ERM/ERM-1.JPG","1. Right eye: diffuse dense epiretinal membrane/macular pucker"],["E:photos/ERM/ERM-2.JPG","Left eye: trace epiretinal membrane"],["E:pages/imgs/OD_OCT_ERM.PNG","High resolution vertical raster scan shows a partially separated epiretinal membrane with loss of foveal contour and schitic disruption of t"]],"h":"1. Right eye: diffuse dense epiretinal membrane/macular pucker","u":"pages/epiretinal-membrane.htm","cr":"Eric Chin, MD","src":"er"},{"t":"Lamellar hole with foveal schisis","im":[["E:photos/lamellar-hole/lamellar-hole-w-foveal-schisis-1.jpg","OD: clear media; optic nerve cupping with peripapillary pigment; multiple intermediate and large drusen throughout macula and peri"]],"h":"OD: clear media; optic nerve cupping with peripapillary pigment; multiple intermediate and large drusen throughout macula and periphery; small lamellar hole at the fovea center and an epiretinal membrane worse between the fovea and superior arcades.","u":"pages/lamellar-hole-w-foveal-schisis.htm","cr":"Eric Chin MD","src":"er"},{"t":"Macular hole, commotio retinae, and choroidal rupture after blunt eye injury","im":[["E:photos/macular-hole-choroidal-rupture-commotio.jpg",""]],"h":"","u":"pages/Macular-hole-commotio-retinae-choroidal-rupture.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Central Serous Retinopathy (CSR)","im":[["E:photos/CSR/CSR-LRG.jpg","Color fundus photograph demonstrates subretinal fluid involving the fovea"],["E:photos/CSR/CSR_02072005FFA2Patel.jpg","Late views with flourescein reveal the pooling of fluid within the serous detachement, correlating with the clinical appearance of the fundu"],["E:photos/CSR/CSRsmokestack.jpg",""]],"h":"Jordan M. Graff, MD and Chet B. Patel, MD, CSR (sometimes called Central Serous Chorioretinopathy or CSCR) is seen most commonly in male & fem","u":"pages/Central-Serous-Retinopathy-CSR.html","cr":"Austin R. Fox, MD","src":"er"},{"t":"Bilateral serous retinal detachments from acute hypertensive retinopathy","im":[["E:photos/Bilateral-serous-retinal-detachments-acute-hypertensive-retinopathy/Serous-RD-3-LRG.jpg",""],["E:photos/Bilateral-serous-retinal-detachments-acute-hypertensive-retinopathy/Serous-RD-4-LRG.jpg",""]],"h":"The patient presented with acute onset of blurry vision in both eyes associated with blood pressures exceeding 190/140 mmHg. On dilated exam, both eyes had a flame hemorrhage along the vascular arcade and shifting subretinal fluid in the macula. Acute systemic hypertension more commonly manifests as flame shaped hemorrhages in the nerve fiber layer, but serous retinal detachments","u":"pages/Bilateral-Serous-Retinal-Detachments-HTN-Retinopathy.htm","cr":"Ben J. Janson, MD","src":"er"},{"t":"Hypotony Maculopathy","im":[["E:pages/HypotonyMaculopathy/Hypotony-maculopathy-2-LRG.jpg","There was also optic disc edema as shown in the fundus photograph."]],"h":"There was also optic disc edema as shown in the fundus photograph.","u":"pages/HypotonyMaculopathy/index.htm","cr":"Jeffrey Welder, MD","src":"er"},{"t":"Choroidal folds","im":[["E:pages/choroidal-Folds/CF4-LRG.jpg",""],["E:pages/choroidal-Folds/CF5-LRG.jpg",""],["E:photos/choroidal/Choroidal-folds-1.jpg","Choroidal FoldsCan occur in the setting of hypotony, retinal detachment, or an orbital mass."]],"h":"Choroidal folds occur when there is relative indentation of the inner surface of the sclera, leading to folds of the choroid and RPE or choroidal congestion. Clinically, they appear as parallel, alternating yellow and dark bands upon examination of the posterior pole. Choroidal folds may be present in hypotony, external globe compression, ocular or orbital inflammation, tumors, neovascular membr","u":"pages/choroidal-folds.html","cr":"Matthew Benage, MD; Randy Kardon, MD, PhD","src":"er"},{"t":"Idiopathic juxtafoveal telangiectasia","im":[["E:pages/juxtafoveal-telangiectasia/JXT-OS-LRG.jpg","Fundus Photo"],["E:photos-earlier/jxt.jpg","Macular pigmentation and edema"],["E:photos/img-untitled/ffa1.jpg","Juxtafoveal telangiectasia with leakage"]],"h":"Fundus Photo","u":"pages/juxtafoveal-telangiectasia/index.htm","cr":"Christopher Kirkpatrick, MD","src":"er"},{"t":"Laser Pointer Maculopathy","im":[["E:photos/Laser-pointer-maculopathy/righteye-opt.jpg","2 days after injury"],["E:photos/Laser-pointer-maculopathy/image2-opt.jpg","2 days after injury"],["E:photos/Laser-pointer-maculopathy/image3-opt.jpg",""]],"h":"This is a 16-year-old male who suffered a laser pointer injury to his right eye and subsequently found that he had a small central area of \"blackness\" that made it difficult to read. On fundus exam, the right eye showed a small, depigmented, circular defect just temporal to the center of the fovea. OCT showed a small cavitation at this location with IS/OS disruption. The Amsler grid was normal for the left eye but de","u":"pages/laser-pointer-maculopathy.htm","cr":"Kristina Damisch, M2 and Alison Bozung, OD","src":"er"},{"t":"Macular Hemorrhage","im":[["E:photos/Macular-heme.jpg",""]],"h":"92-year-old female with history of non-exudative age-related macular degeneration presenting with large subretinal macular hemorrhage with preretinal breakthrough in the right eye. This was thought to represent either macroaneurysm or choroidal neovascularization; however, there was too much blockage on fluorescein angiography to distinguish the two causes.","u":"pages/Macular-Heme.htm","cr":"Jeffrey D. Welder, MD","src":"er"},{"t":"Pentosan Polysulfate Maculopathy","im":[["E:pages/imgs/Pentosan_Polysulfate_Maculopathy_fundus_photo_OU.png","Fundus photography of right and left eyes demonstrating pigmentary retinal pigment epithelium (RPE) stippling and nummular atrophy"]],"h":"A 62-year-old woman taking pentosan polysulfate (PPS) for interstitial cystitis (200 mg twice daily for 20 years; cumulative dose >2,500 g) underwent a baseline dilated exam. She reported several years of nyctalopia. Examination showed pigmentary retinal pigment epithelium (RPE) stippling with nummular macular atrophy extending toward the temporal optic disc margins (Figure 1). Fundus autofluores","u":"pages/Pentosan_Polysulfate_Maculopathy.htm","cr":"Joanna I.M. Silverman, MD","src":"er"},{"t":"Chloroquine retinal toxicity","im":[["E:photos/chloroquine/chloroquine-OD.jpg",""],["E:photos/chloroquine/chloroquine-OS.jpg",""]],"h":"","u":"pages/Chloroquine-retinal-toxicity.htm","cr":"Jesse Vislisel, MD","src":"er"}]},{"n":"Age-related macular degeneration","b":"Drusen and PEDs to CNV, RPE rips and polyps.","items":[{"t":"Age-related macular degeneration","im":[["E:photos/AMD/early-AMD-1-LRG.jpg","These fundus photos show early AMD of two different patients. There are a few (<15) intermediate-sized soft drusen predominantly"],["E:photos/AMD/early-AMD-2-LRG.jpg","These fundus photos show early AMD of two different patients. There are several (>15) small hard drusen in the macula."],["E:photos/AMD/Intermediate_AMD-1-LRG.jpg","Eyes demonstrates intermediate AMD with high risk (i.e., large, confluent, soft drusen) non-neovascular, age-related macular dege"]],"h":"Age-related macular degeneration (AMD) is the leading cause of blindness in elderly patients [1] and is classified as either non-exudative (i.e., dry) or exudative (i.e., wet or neovascular). The clinical manifestations of non-exudative AMD range from incidental findings of drusen to geographic atrophy causing significant vision loss, a","u":"pages/AMD.htm","cr":"Brittni A. Scruggs, MD, PhD","src":"er"},{"t":"Cuticular Drusen","im":[["E:photos/cuticular-drusen/cuticular-drusen-OD.jpg","OD"],["E:photos/cuticular-drusen/cuticular-drusen-OS.jpg","OS"],["E:photos/cuticular-drusen/cuticular-drusen-Add-OD.jpg","OD"]],"h":"Cuticular drusen, also known as basal laminar drusen, are a type of familial drusen characterized by many clumps of tiny, extramacular drusen. They are strongly associated with the Tyr402His variant of the complement factor H (CFH) gene. Acuity often remains good as long at the drusen remain outside of the fovea. Cuticular DrusenCuticular DrusenCategory(ies): Retina / VitreousContributor: Peter H. Sanchez, MD; Bilal","u":"pages/cuticular-drusen.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Drusenoid Pigment Epithelial Detachment (PED)","im":[["E:photos/drusenoid-PED/Figure-1-Fundus-photo-OD-Drusenoid-PED.jpg","A Topcon color fundus photo of the right eye shows many soft drusen in the macula. Notice the indistinct borders characteristic of"]],"h":"August 11, 2023 77-year-old female referred to retina service for management of dry age-related macular degeneration in both eyes. The patient is found to have a drusenoid pigment epithelial detachment (PED) in the right eye. Drusenoid PEDs are drusen that span more than 350 microns contiguously.","u":"pages/drusenoid-PED.htm","cr":"Sean Rodriguez, MD","src":"er"},{"t":"Age-Related Macular Degeneration with CNVM","im":[["E:photos/ARMD-CNVM-Color.jpg","Fundus photos shows a green-gray lesion in the central macula with surrounding hemorrhage."]],"h":"Fundus photos shows a green-gray lesion in the central macula with surrounding hemorrhage.","u":"pages/Age-Related-Macular-Degeneration-with-CNVM.html","cr":"Robert B. Dinn, MD and Karen Gehrs, MD","src":"er"},{"t":"Age-related Macular Degeneration with Choroidal Neovascular Membrane","im":[["E:photos/CNVM-121.jpg",""]],"h":"This was a classic lesion on FFA. Note the subretinal hemorrhages beneath the center of the macula and inferiorly distant from the fovea.","u":"pages/ARMD-with-CNVM.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Involuted choroidal neovascular membrane (CNVM) mimicking a granuloma in pseudoxanthoma elasticum (PXE)","im":[["W:pages/CNVM-PXE/PXE-w-involuted-CNVM-LRG.jpg","This photograph shows the appearance of an involuted choroidal neovascular membrane (CNVM) mimicking a granuloma in a patient with pseudoxan"],["W:pages/CNVM-PXE/PXE-w-active-CNVM-LRG.jpg","The appearance of the CNVM several years earlier while in its active state. Also visible in the photographs are the angioid streaks and peau"]],"h":"This photograph shows the appearance of an involuted choroidal neovascular membrane (CNVM) mimicking a granuloma in a patient with pseudoxanthoma elasticum (PXE)","u":"pages/CNVM-PXE/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Retinal Pigment Epithelial Rip","im":[["E:photos/RP/RPE-rip-1.jpg","Image 1. Right eye. Subretinal fluid and dense subretinal hemorrhage adjacent to an area of \"scrolled\" retinal pigment epithelium (RPE) temp"],["E:photos/RP/RPE-rip-2.jpg","Image 2. Left eye. Full thickness macular hole with difficult to delineate margins, due to extensive large high-risk drusen and RPE clumping"]],"h":"Image 1. Right eye. Subretinal fluid and dense subretinal hemorrhage adjacent to an area of \"scrolled\" retinal pigment epithelium (RPE) temporally to nasally; long white arrows point to the temporal edge of a well-demarcated area that lacks RPE, as a result of it curling nasally (white arrow heads) toward the optic nerve.","u":"pages/RPE-rip.htm","cr":"Eric Chin, MD","src":"er"},{"t":"Polypoidal choroidal vasculopathy (PCV)","im":[["E:LARGE/Polypoidal-choroidal-vasculopathy-OD-L.jpg","Right Eye"],["E:LARGE/Polypoidal-choroidal-vasculopathy-OS-L.jpg","Left Eye"],["E:LARGE/Polypoidal-choroidal-vasculopathy-3-LRG.jpg","The photograph shows the fundus appearance after the patient later presented with an acute subretinal hemorrhage in the right eye."]],"h":"Right Eye","u":"pages/Polypoidal-choroidal-vasculopathy.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Choroidal Rupture with Development of Choroidal Neovascular Membrane (CNVM)","im":[["E:pages/CR-in-CNVM/CR-with-CNVM-LRG.jpg",""]],"h":"","u":"pages/CR-in-CNVM/index.htm","cr":"Johanna Beebe, MD","src":"er"}]},{"n":"Diabetic & vascular retinopathy","b":"Diabetes, hypertension, vein and artery occlusions, haemorrhage patterns, vascular anomalies.","items":[{"t":"Intraretinal Microvascular Abnormality (IrMA)","im":[["E:pages/IRMA/IRMA-fundus-OS.jpg","his picture represents a young insulin dependent diabetic patient with severe non-proliferative diabetic retinopathy. There is grea"],["E:pages/IRMA/IRMA-LRG.jpg","r>This is a 21 year-old male with poorly controlled type 1 diabetes mellitus with very severe non-proliferative diabetic retinopath"]],"h":"Intraretinal microvascular abnormalities (or IrMAs) are shunt vessels and appear as abnormal branching or dilation of existing blood vessels (capillaries) within the retina that act to supply areas of non-perfusion in diabetic retinopathy. These vessels represent either new vessel growth within th","u":"pages/IRMA/index.htm","cr":"Chris Kirkpatrick, MD","src":"er"},{"t":"Diabetic Macular Edema (DME)","im":[["E:photos/Diabetic-Macular-Edema-LRG.jpg",""],["E:photos/Diabetic-Macular-Edema-2-LRG.jpg",""],["E:photos/Diabetic-Macular-Edema-3-LRG.jpg",""]],"h":"This patient has a history of severe non-proliferative retinopathy and recurrent diabetic macular edema in both eyes due to type II diabetes mellitus. On the optical coherence tomogram below, there are parafoveal intraretinal cysts with exudates. Diabetic macular edema can result in diffuse or focal areas of swelling and retinal thickening and may be associated with hard exudates. Diabetic macular","u":"pages/diabetic-macular-edema.htm","cr":"Ben J. Janson, MD","src":"er"},{"t":"Circinate Ring of Lipid Exudates","im":[["E:pages/imgs/cirinate_ring_lipid_exudates_1.png","There is a pigmented choroidal lesion (red arrow) centered along the inferotemporal arcade with fading pigment, surrounding RPE atrophy, and"],["E:pages/imgs/circinate_ring_lipid_exudates_2.jpg","There is prominent cystoid macular edema (blue arrow) and a circinate ring of lipid exudates in the macula (yellow arrow)."]],"h":"Color fundus photograph and Optical Coherence Tomography (OCT) images of the right eye of a patient with a treated choroidal melanoma and radiation retinopathy. This patient underwent I-125 plaque brachytherapy and subsequently developed radiation retinopathy and optic neuropathy with associated cystoid macular edema (blue arrow) and a circinate r","u":"pages/Circinate_Ring_Lipid_Exudates.html","cr":"Reiker Ricks, MD; Paige Noble, MD; Elaine Binkley, MD","src":"er"},{"t":"Proliferative diabetic retinopathy (PDR)","im":[["E:pages/proliferative-diabetic-retinopathy/PDR-OS-LRG.jpg",""],["E:pages/proliferative-diabetic-retinopathy/Prolif-DR-1-LRG.jpg","Optos® fundus photo, right eye"],["E:photos/DR/dr2.jpg","Seen are neovascularization, cotton wool spots, microaneurysms, and intraretinal hemorrhages."]],"h":"Optos® widefield fluorescein angiography, right eye, at 41 seconds","u":"pages/proliferative-diabetic-retinopathy/index.htm","cr":"Christopher Kirkpatrick, MD","src":"er"},{"t":"Severe Proliferative Diabetic Retinopathy","im":[["E:pages/Severe-Proliferative-Diabetic-Retinopathy/PDR-nest-OD-LRG.png","Right Eye"],["E:pages/Severe-Proliferative-Diabetic-Retinopathy/PDR-nest-OS-LRG.PNG","Right Eye"]],"h":"Right Eye","u":"pages/Severe-Proliferative-Diabetic-Retinopathy/index.htm","cr":"William Flanary, MD","src":"er"},{"t":"Traction retinal detachment secondary to proliferative diabetic retinopathy","im":[["E:photos/traction-ret-detach/traction-retinal-detachment-LARGE.jpg","This photo shows a tractional retinal detachment secondary to proliferative diabetic retinopathy. There are fibrovascular bands encircling t"]],"h":"This photo shows a tractional retinal detachment secondary to proliferative diabetic retinopathy. There are fibrovascular bands encircling the arcades that are fovea (macula) threatening. Please note the neovascularization of the disc (NVD) originating from the inferonasal edge of the optic disc.","u":"pages/traction-RD.htm","cr":"Elizabeth Gauger, MD","src":"er"},{"t":"Hypertensive retinopathy","im":[["E:photos/Hypertensive-Retinopathy-OD.JPG","Hypertensive retinopathy: 37-year-old male with optic disc edema, cotton wool spots, flame hemorrhages, dot blot hemorrhages, arteriovenous"]],"h":"Hypertensive retinopathy: 37-year-old male with optic disc edema, cotton wool spots, flame hemorrhages, dot blot hemorrhages, arteriovenous nicking, and exudates. He was asymptomatic and his vision was 20/20 in both eyes. Blood pressure in clinic was 198/142.","u":"pages/hypertensive-retinopathy.html","cr":"Jaci Haugsdal, (4th year medical student) and Justin Risma, MD","src":"er"},{"t":"Malignant Hypertension","im":[["E:photos/malignant-HTN.jpg","Fundus Photo. Patient is a 52-year-old male with malignant hypertension"]],"h":"Fundus Photo. Patient is a 52-year-old male with malignant hypertension","u":"pages/malignant-hypertension.htm","cr":"C. Blake Perry, MD","src":"er"},{"t":"Radiation retinopathy","im":[["E:photos/radiation-retinopathy.jpg",""],["E:photos/Radiation-Retinopathy-janson-LRG.jpg",""],["E:photos/Radiation-Retinopathy-2-LRG.jpg",""]],"h":"","u":"pages/radiation-retinopathy.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Non-proliferative sickle cell retinopathy","im":[["E:pages/Non-proliferative-sickle-cell-retinopathy/Atlas-1-LRG.jpg","Photo demonstrates an elevated, round hypopigmented (salmon colored) lesion in the inferior retinal periphery with surrounding hyperpigmenta"],["E:pages/Non-proliferative-sickle-cell-retinopathy/Atlas-2-LRG.jpg","Photo demonstrates a flat, salmon colored, ovoid lesion in the nasal retinal periphery that also represents a \"salmon patch.\"\""]],"h":"Photo demonstrates an elevated, round hypopigmented (salmon colored) lesion in the inferior retinal periphery with surrounding hyperpigmentation. This lesion represents a previous intraretinal hemorrhage, which has since hemolyzed and now appears as a \"salmon patch.\"","u":"pages/Non-proliferative-sickle-cell-retinopathy/index.htm","cr":"Prashant K. Parekh, MD","src":"er"},{"t":"Central Retinal Vein Occlusion (CRVO)","im":[["W:photos-earlier/12C.jpg","1 & 2 Ischemic CRVO"],["W:photos-earlier/12B.jpg","3& 4 Non-Ischemic CRVO"]],"h":"1 & 2 Ischemic CRVO","u":"pages/CRVO/index.htm","cr":"Robert B. Dinn, MD, Erin E. O'Malley, MD","src":"er"},{"t":"Central retinal vein occlusion with cilioretinal artery occlusion","im":[["E:pages/CRVO-w-CLRAO/CRVO-CLRAO-LRG.jpg",""]],"h":"","u":"pages/CRVO-w-CLRAO/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Branched Retinal Vein Occlusion (BRVO)","im":[["E:photos/BRVO2005.jpg",""],["E:photos/BRVO/Fig1-optos-widefield-OS-NVE.jpg",""]],"h":"Andrew Goldstein, MD and Michael D. Abramoff, MD, PhD Contributor: Sarah Skiles, CRA Posted: April 7, 2022 This series of images was obtained in","u":"pages/Branched-Retinal-Vein-Occlusion.html","cr":"Christopher C. Robinson, MD and Jordan M. Graff, MD","src":"er"},{"t":"BRVO (Branched Retinal Vein Occlusion)","im":[["E:photos/BRVO_1.jpg",""]],"h":"In this photo, the classic appearance of a BRVO is illustrated. There was no associated macular edema in this patient.","u":"pages/BRVO-Branched-Retinal-Vein-Occlusion.html","cr":"Robert Dinn, MD","src":"er"},{"t":"Central Retinal Artery Occlusion (CRAO)","im":[["W:photos/CRAO-CRVO/CRAOcilioretinalsparinglowres.jpg","Sparing of the fovea due to a ciliary retinal artery in the presence of a CRAO secondary to a cardiac myxoma."],["E:pages/CRAO/CRAO-OD-LRG.jpg",""],["E:pages/imgs/R_7fCGzZgmHmDr1Zv_CRAO%20with%20ciliary%20sparing.png",""]],"h":"Sparing of the fovea due to a ciliary retinal artery in the presence of a CRAO secondary to a cardiac myxoma.","u":"pages/CRAO/index.htm","cr":"Thomas A. Weingeist, PhD, MD","src":"er"},{"t":"Branch Retinal Artery Occlusion (BRAO)","im":[["E:photos/BRAO-OU-color-fundus.jpg","Color fundus photograph of both eyes of a 79 year-old male presenting with acute onset left eye vision loss of the superior-nasal quadrant."],["W:photos/BRAO-OD-1-month.JPG","1 month later, the retinal whitening and edema resolved. (Chen, 2012)"],["W:photos/brao.jpg","Arrow denotes emboli in inferior arteriole. (Doan, 2004)"]],"h":"Color fundus photograph of both eyes of a 79 year-old male presenting with acute onset left eye vision loss of the superior-nasal quadrant. The right eye (left side image) demonstrates an epiretinal membrane nasal to the fovea. The left eye (right side image) demonstrates a yellow plaque (indicated by the white arrow) lodged within the inferior retinal artery overlying the optic disc. Diffuse areas of retinal whiteni","u":"pages/BRAO/index.htm","cr":"Ryan J. Diel, MD; Zachary Mortensen, MD; A. Tim Johnson, MD","src":"er"},{"t":"Hollenhorst plaque in Branch Retinal Artery Occlusion (BRAO)","im":[["E:photos/Hollenhorst-plaque-2.jpg","BRAO left eye. Two Hollenhorst plaques can be visualized: one in the first bifurcation of the central retinal artery and another along the i"],["E:photos/Hollenhorst-plaque-in-Branch-Retinal-Artery-Occlusion-.jpg","Note the macular whitening indicating macular ischemia."]],"h":"BRAO left eye. Two Hollenhorst plaques can be visualized: one in the first bifurcation of the central retinal artery and another along the inferotemporal arcade arteriorle at a branch point.","u":"pages/Hollenhorst-plaque.htm","cr":"Elizabeth Gauger, MD","src":"er"},{"t":"Hollenhorst plaque with branch retinal artery occlusion (BRAO) causing a cherry red spot","im":[["E:photos/BRAO-cherry-red-spot.jpg","This was an interesting case in which a cholesterol (Hollenhorst) plaque became lodged in an inferior branch of the central retinal artery t"]],"h":"The cherry red spot occurs because the choroidal and retinal circulation is separate. The richly vascularized sub-foveal choriocapillaris remains perfused after CRAO, but the surrounding retina becomes opaque due to edema as the tissue becomes ischemic.","u":"pages/Hollenhorst-plaque-BRAO-cherry-red-spot.htm","cr":"Matt Ward, MD","src":"er"},{"t":"BRAO due to fibrin embolus","im":[["E:photos/Fibrin/Fibrinemboluscolor.jpg",""],["E:photos/Fibrin/Fibrinembolusfa2.jpg",""],["E:photos/Fibrin/Fibrinembolusfa3.jpg",""]],"h":"","u":"pages/BRAO-due-to-fibrin-embolus.html","cr":"Mark H. Haimann, MD","src":"er"},{"t":"Incidental Retinal Embolus","im":[["E:photos/Retinal-Embolus-LRG.jpg",""],["E:pages/imgs/Calcium_Embolus_Atlas.jpg","Fundus photo demonstrating a calcium embolus overlying the right optic disc with severely attenuated inferotemporal and inferonasa"]],"h":"An 81-year-old female with a past ocular history of a branch retinal artery occlusion of the right eye and past medical history of giant cell arteritis, hyperlipidemia, hypertension, and myocardial infarction presented for follow-up and an embolic plaque was incidentally noted during her fundus examination. The plaque was characterized as a calcium embolus given its dull, white, non-reflective ap","u":"pages/incidental-retinal-embolus.htm","cr":"Ben J. Janson, MD","src":"er"},{"t":"Cilioretinal Artery Occlusion","im":[["E:photos/Cilioretinal-Artery-Occlusion/cilioretinal-artery-LRG.jpg","Retinal whitening extends from the superotemporal optic nerve through the macula superior to the fovea. Multiple small emboli are"]],"h":"Susan Wright A 67-year-old man with history of type 2 diabetes mellitus, hyperlipidemia, and uncontrolled hypertension presented with a central visual field deficit of sudden onset in his right eye. Visual acuity on presentation was 20/25 in both eyes, and funduscopic examination revealed an isolated cilioretinal artery occlusion (CLRAO) in his right eye (Figure 1). Work-up revea","u":"pages/cilioretinal-artery-occlusion.htm","cr":"Austin Fox, MD and Stephen Russell, MD","src":"er"},{"t":"Acute Macular Neuroretinopathy (AMN)","im":[["E:pages/Acute-macular-neuroretinopathy/AMN-LRG.jpg",""],["E:pages/Acute-macular-neuroretinopathy/AMN_2008a.jpg",""]],"h":"","u":"pages/Acute-macular-neuroretinopathy/index.htm","cr":"Christopher Kirkpatrick, MD","src":"er"},{"t":"Purtscher Retinopathy","im":[["W:photos/purtschers-retinopathy/purtschers-OD-LRG.jpg",""],["W:photos/purtschers-retinopathy/purtschers-OS.jpg",""],["W:photos/Purtscher.jpg",""]],"h":"","u":"pages/purtscher/index.htm","cr":"Alison Bozung, OD","src":"er"},{"t":"Valsalva Retinopathy with Sub-ILM hemorrhages in the setting of pancytopenia and pneumonia","im":[["E:photos/Valsalva-retinopathy.jpg",""]],"h":"TThis is a 62-year-old man with a history of diffuse large B-cell lymphoma who had undergone autologous bone marrow transplantation and noted vision loss after a coughing episode while admitted for pancytopenia and pneumonia. The photo was taken 1 month after onset of symptoms and demonstrates hemorrhages in multiple layers of the retina, but most prominently beneath the internal limiting membrane as demonstrated by","u":"pages/Valsalva-Retinopathy.htm","cr":"Matt Ward, MD","src":"er"},{"t":"Multi-level retinal hemorrhage secondary to acute immune thrombocytopenic purpura (ITP) exacerbation","im":[["E:photos/immune-thrombocytopenic-purpura/Fundus-bilateral-peripapillary-retinal-hemorrhages-LRG.jpg",""]],"h":"She was found to have a platelet count of 0 and a small concomitant intracranial hemorrhage, though the latter was thought to be noncontributory to her retinal findings. Fundus photos demonstrate superficial, intraretinal, and subretinal involvement,","u":"pages/immune-thrombocytopenic-purpura.htm","cr":"Joanna IM Silverman, MD","src":"er"},{"t":"Sub-inner limiting membrane hemorrhage in leukemic retinopathy","im":[["E:LARGE/sub-ILM-hemorrhage-LRG.png",""]],"h":"","u":"pages/sub-ILM-hemorrhage.htm","cr":"Justin Risma, MD","src":"er"},{"t":"Leukemic retinopathy","im":[["E:photos/leukemic/Leukemic-Retinopathy-1.jpg","Image 1"],["E:photos/leukemic/Leukemic-Retinopathy-2.jpg","Image 2: OS: many central and paracentral superficial hemorrhages, some with a white center (ie Roth spots); no cystoid macular edema"],["E:photos/leukemic/Leukemic-Retinopathy-5.jpg","Images 5-8"]],"h":"Image 1","u":"pages/leukemic-retinopathy.htm","cr":"Eric Chin MD","src":"er"},{"t":"Terson syndrome","im":[["E:pages/Terson/terson-LRG.jpg","This photo shows a patient with a large sub-ILM hemorrhage."]],"h":"This photo shows a patient with a large sub-ILM hemorrhage.","u":"pages/Terson/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Non-accidental trauma-Bilateral Retinal Hemorrhages","im":[["E:photos/Non-accidental-trauma/Fig1-LRG.jpg","Color fundus of the Right eye (OD) demonstrating numerous dot-blot and flame hemorrhages extending from the posterior pole to the ora."],["E:photos/Non-accidental-trauma/Fig2-LRG.jpg","Color fundus of the Left eye (OS) demonstrating numerous dot-blot and flame hemorrhages extending from the posterior pole to the ora."],["E:photos/NonAccidentalTrauma-OD.jpg","Color fundus of the Right eye (OD)"]],"h":"6 month-old girl found unresponsive and evaluated in the setting of a work-up of suspected non-accidental trauma. Fundus exam shows retinal nerve fiber layer hemorrhages OS > OD.","u":"pages/non-accidental-trauma.htm","cr":"Brittni A. Scruggs, MD, PhD","src":"er"},{"t":"Retinal Arterial Venous Malformation","im":[["E:pages/imgs/retinal_arterial_venous_malformation_OD_AVM.jpg","right eye fundus photo showing a large arterial venous malformation with severe tortuosity at the superior arcade and moderate tor"],["E:pages/imgs/retinal_arterial_venous_malformation_OS.jpg","left eye fundus photo showing moderately dilated and tortuous retinal vasculature"]],"h":"Brooke Muth A 64-year-old woman was found on routine examination to have severe tortuosity of the superior arcade vessels in the right eye consistent with an arterial venous malformation (AVM). The other eye had moderately dilated and tortuous retinal vasculature. Retinal AVMs can be seen in isolation as an acquired anomaly or as an ophthalmic finding in Wyburn-Mason Syndrome, a rare congenital disorder characterized","u":"pages/retinal_arterial_venous_malformation.htm","cr":"Lauren A. Tomlinson, MD; Jonathan F. Russell, MD, PhD","src":"er"},{"t":"Coats Disease","im":[["E:pages/imgs/R_6Hh2iyq1pqj36ru_Coats%20disease.jpg",""]],"h":"","u":"pages/Coats_Disease.html","cr":"Mahsaw ough the a"],["E:photos/toxoplasmosis/toxoplasma-scars-2-LRG.jpg","Inactive lesions appear as a chorioretinal scar in the posterior pole, often within the macula as seen in Figure 2."],["E:photos/toxoplasmosis/ocular-toxoplasmosis-new-LRG.jpg","Congenital toxoplasmosis with macular chorioretinal scar seen in a 69-year-old woman who presented with severe primary open angle glaucoma o"]],"h":"Active lesions have a classic \"headlight in fog\" appearance with a focal, white, fluffy lesion adjacent to an old scar visible through the associated granulomatous uveitis and vitritis as seen in Figure 1","u":"pages/ocular-toxoplasmosis-2.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Ocular toxocariasis","im":[["E:pages/toxocara/toxocara-LRG.jpg","Classic localized granuloma located over the optic nerve"]],"h":"Classic localized granuloma located over the optic nerve","u":"pages/toxocara/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Cytomegalovirus (CMV) Retinitis","im":[["W:photos/CMV-Retinitis/CMV-1-LRG.jpg","Right eye – multiple cotton wool spots adjacent to the nerve and throughout the macula, consistent with HIV retinopathy"],["W:photos/CMV-Retinitis/CMV-2-LRG.jpg","Left eye - broad retinal whitening and intraretinal hemorrhages along the superior arcades, with cotton wool spots adjacent to the nerve con"],["W:photos/CMV-Retinitis/CMV-3-LRG.jpg","Right Eye: resolution of cotton wool spotsVision sc: 20/50"]],"h":"Right eye – multiple cotton wool spots adjacent to the nerve and throughout the macula, consistent with HIV retinopathy","u":"pages/CMV-Retinitis/index.htm","cr":"Eric Chin, MD","src":"er"},{"t":"Acute Retinal Necrosis","im":[["E:pages/imgs/R_3e5dpU77mkhr8x6_ARN.png",""]],"h":"","u":"pages/Acute_Retinal_Necrosis.html","cr":"Mahsaw Mansoor, MD","src":"er"},{"t":"Syphillitic punctate inner retinitis","im":[["E:photos/syphillitic/syphillitic-punctate-inner-retinitis.jpg",""],["E:photos/syphillitic/syphillitic-palmar-rash.jpg",""],["E:photos/syphillitic/sypillitic-sole-of-foot-rash.jpg",""]],"h":"Photos include patient's palm and soles of feet which had classic syphillis rash.","u":"pages/Syphillitic-punctate-inner-retinitis.htm","cr":"Jordan Rixen, MD","src":"er"},{"t":"Endophthalmitis","im":[["E:photos-earlier/post-trab.jpg","post-trabeculectomy"]],"h":"post-trabeculectomy","u":"pages/endophthalmitis.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Diffuse Unilateral Subacute Neuroretinitis (DUSN) - Nematode","im":[["E:photos/DUSN/DUSN-macular.jpg","Nematode in the macula and macular inflammation"],["E:photos/DUSN/DUSN-macular-outtake.jpg","Nematode in the macula and macular inflammation"],["E:photos/DUSN/DUSN-macular-outtake.jpg","Nematode in the periphery before laser"]],"h":"This 45-year-old male presented with blurry vision in his left eye and was referred to the University of Iowa for unilateral uveitis. A subretinal nematode was identified on exam next to a crop of yellow-white macular lesions. He was diagnosed with diffuse unilateral subacute neuroretinitis (DUSN), likely secondary to raccoon roundworm (Baylisascaris procyonis) as the patient was an avid outdoorsman and hunter. The n","u":"pages/Diffuse-Unilateral-Subacute-Neuroretinitis.htm","cr":"David Phillips, MD","src":"er"},{"t":"Choroidal effusion in posterior scleritis","im":[["E:pages/choroidal-effusion/choroidals-1-LG.jpg",""],["E:pages/choroidal-effusion/choroidals-2-LG.jpg",""],["E:pages/imgs/R_7GXsMwlC67wWnCx_Serous%20choroidal.png",""]],"h":"","u":"pages/choroidal-effusion/index.htm","cr":"Jesse Vislisel, MD","src":"er"}]},{"n":"Inherited & developmental","b":"Macular dystrophies, rod-cone dystrophies and syndromic retinopathies.","items":[{"t":"Stargardt disease","im":[["E:photos/bullseye_01222005.jpg","1) Bullseye maculopathy."],["E:photos/flecks_01222005.jpg","2) Pisciform flecks in the retina."]],"h":"PhD teaches the following: A photoreceptor cell-specific ATP-binding transporter gene (ABCR) is mutated in recessive Stargardt macular dys olydactyly, obesity, m","u":"pages/bardet-biedl.htm","cr":"Jesse M. Vislisel, MD","src":"er"},{"t":"Batten Disease","im":[["E:photos/Batten-Disease-1-LARGE.jpg",""],["E:photos/Batten-Disease-2-LARGE.jpg",""],["E:pages/imgs/R_3WtVXxh8ctEPeyg_Battons_bullseye_maculopathy_1.JPG","Visual acuity at presentation was 20/40. Initial fundus photo shows a parafoveal hyperpigmentation consistent with bullseye maculopathy. The"]],"h":"7-year-old female with molecularly confirmed CLN3-associated Batten Disease. Fundus photos demonstrate mild optic nerve pallor, central macular mottling, attenuated arterioles and peripheral retinal granularity. There was 1+ vitreous cell present. Vision was 20/800 in the right eye and hand motion in the left. Batten disease is a fatal autosomal recessive neurodegenerative diseas","u":"pages/batten-disease.htm","cr":"Jeffrey D. Welder, MD","src":"er"},{"t":"Choroideremia","im":[["E:photos/choroidal/choroideremia-OD.jpg",""],["E:photos/choroidal/choroideremia-OS.jpg",""]],"h":"18-year-old male with molecularly confirmed choroideremia. Genetic testing revealed the prescence of a hemizygous deletion of exons 1 and 2 of the CHM gene. Note that there is preservation of the choroid and retinal pigment epithelium (RPE) in the macula with pigment mottling centrally and peripheral loss of the choroid and RPE. This patient had 20/20 vision in both eyes with co","u":"pages/Choroideremia.htm","cr":"Jeffrey D. Welder, MD","src":"er"},{"t":"Gyrate atrophy","im":[["E:photos/gyrate-atrophy/gyrate-atrophy-OD.png","Right eye"],["E:photos/gyrate-atrophy/gyrate-atrophy-OS.png","Left eye"]],"h":"Gyrate atrophy is an autosomal recessive disease resulting from a deficiency of ornithine aminotransferase. By the second decade of life, patients exhibit scalloped areas of choroidal and retinal atrophy that begin peripherally and progresses toward the posterior pole. The diagnosis is supported by increased plasma and urine ornithine levels. OMIM #258870","u":"pages/gyrate-atrophy.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Leber Congenital Amaurosis, RPE65-associated","im":[["E:photos/LCA/LCA-OD-fig1.jpg",""],["E:photos/LCA/LCA-OS-fig2.jpg",""]],"h":"These images accompany a case report. OMIM #204100 and *180069","u":"pages/LCA.htm","cr":"Brian Privett, MD","src":"er"},{"t":"LCHADD: long chain 3-hydroxyacyl CoA dehydrogenase deficiency","im":[["E:photos/LCHADD.jpg","7-year-old female with long chain 3-hydroxyacyl CoA dehydrogenase deficiency (LCHADD), Vision 20/40"]],"h":"7-year-old female with long chain 3-hydroxyacyl CoA dehydrogenase deficiency (LCHADD), Vision 20/40","u":"pages/LCHADD.htm","cr":"C. Blake Perry, MD","src":"er"},{"t":"X-linked retinoschisis (XLRS)","im":[["E:LARGE/XLRS-OD-L.jpg",""],["E:LARGE/XLRS-OS-L.jpg",""]],"h":"","u":"pages/XLRS.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Kearns-Sayre syndrome","im":[["E:pages/imgs/R_1n6l01nUZ3oxNkL_EXT-9-GAZE.png","Severe limitation in all ductions bilaterally."],["E:pages/imgs/R_1n6l01nUZ3oxNkL_FP-OD.png","Right eye with normal optic nerve and salt-and-pepper retinopathy."],["E:pages/imgs/R_1n6l01nUZ3oxNkL_FP-OS.png","Left eye with normal optic nerve and salt-and-pepper retinopathy."]],"h":"25 year-old female presented with bilateral ptosis since age 18, severe ophthalmoplegia, and salt-and-pepper retinopathy. She also had short stature at 5'1.8\", fatigue, and weakness of her face, neck, and proximal extremities. She had undergone previous surgery for bilateral upper eyelid ptosis. She had poor levator function of both eyes. ERG","u":"pages/Kearns-Sayre_syndrome.html#gsc.tab=0l","cr":"Lindsay Y Chun MD and Edward F Linton MD","src":"er"},{"t":"Pseudoxanthoma elasticum","im":[["E:LARGE/PXE-OD-LARGE.jpg","Right Eye"],["E:LARGE/PXE-OS-LARGE.jpg","Left Eye"]],"h":"Right Eye","u":"pages/PXE.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Aicardi syndrome","im":[["E:pages/Aicardi/Aicardi-1-LRG.jpg",""],["E:pages/Aicardi/Aicardi-2-LRG.jpg",""]],"h":"Aicardi syndrome is an X-linked dominant condition that is characterized by the triad of round, depigmented chorioretinal lacunae, agenesis of the corpus collosum, and infantile spasms. It can also be associated with optic nerve colobomas and microphthalmos. The condition is almost always seen in females as it is usually lethal in males.","u":"pages/Aicardi/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Chorioretinal coloboma","im":[["E:pages/chorioretinal-coloboma/chorioretinal-coloboma-EH-LG.jpg","photo above by Ed Heffron"],["E:pages/chorioretinal-coloboma/chorioretinal-coloboma-CMT-LG.jpg","photo above by Cindy Montague"]],"h":"photo above by Ed Heffron","u":"pages/chorioretinal-coloboma/index.htm","cr":"Jesse Vislisel, MD","src":"er"}]},{"n":"Tumours & masses","b":"Choroidal and retinal tumours, hamartomas and metastases.","items":[{"t":"Choroidal malignant melanoma in a \"collar button\" configuration","im":[["https://eyerounds.org/cases-i/case190/LARGE/Fig1.jpg",""],["https://eyerounds.org/cases-i/case190/LARGE/fig2.jpg",""],["https://eyerounds.org/cases-i/case190/LARGE/fig4.jpg",""]],"h":"","u":"pages/Choroidal-malignant-melanoma-collar-button.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Choroidal malignant melanoma with orange pigment","im":[["https://eyerounds.org/cases-i/case190/LARGE/fig9a.jpg",""],["https://eyerounds.org/cases-i/case190/LARGE/fig9b.jpg",""]],"h":"","u":"pages/Choroidal-malignant-melanoma-orange-pigment.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Ciliochoroidal Melanoma","im":[["E:pages/Ciliochoroidal-Melanoma/melanoma-1-LRG.jpg",""],["E:pages/Ciliochoroidal-Melanoma/melanoma-2-LRG.jpg",""]],"h":"","u":"pages/Ciliochoroidal-Melanoma/index.htm","cr":"David Phillips, MD","src":"er"},{"t":"Circumscribed choroidal hemangioma","im":[["E:pages/choroidal-hemangioma-circumscribed/1a-CH-LRG.jpg",""],["E:pages/choroidal-hemangioma-circumscribed/1b-CH-LRG.jpg",""],["E:pages/choroidal-hemangioma-circumscribed/1f-CH-post-tx.jpg",""]],"h":"Choroidal hemangiomas are benign vascular hamartomas that can be diffuse (as seen in the case of Sturge-Weber syndrome) or circumscribed as shown here. They typically are red-orange in color with indistinct margins and are located in the posterior pole. There may be overlying retinal pigmente","u":"pages/choroidal-hemangioma-circumscribed/index.htm","cr":"Jesse Vislisel, MD, Eric Chin, MD","src":"er"},{"t":"Choroidal osteoma","im":[["E:pages/osteoma/osteoma-LRG.jpg","An individual with a choroidal osteoma beneath the macula in the right eye."],["E:pages/osteoma/osteoma-Ascan-cropped-LRG.jpg","The A-scan shows the high reflectivity of the mass."],["W:photos-earlier/ODage7_04072004.jpg",""]],"h":"An individual with a choroidal osteoma beneath the macula in the right eye.","u":"pages/osteoma/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Carcinosarcoma choroidal metastasis","im":[["E:photos/Carcinosarcoma-choroidal-metastasis/MET-LRG.jpg",""],["E:photos/Carcinosarcoma-choroidal-metastasis/A-Scan-LRG.png",""]],"h":"","u":"pages/carcinosarcoma-choroidal-metastasis.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Mantle cell lymphoma with choroidal metastasis","im":[["E:photos/choroid-lymphoma-metastasis/L/Lymphoma-retinal-detachment-1-LRG.jpg",""],["E:photos/choroid-lymphoma-metastasis/L/Lymphoma-retinal-detachment-2-LRG.jpg",""],["E:photos/choroid-lymphoma-metastasis/L/Lymphoma-retinal-detachment-ascan-LRG.jpg",""]],"h":"","u":"pages/choroid-mantle-cell-lymphoma-metastasis.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Langerhans histiocytosis with choroidal infiltrates","im":[["E:pages/Langerhans-histiocytosis/Histiocytosis-X-montage-OD-LRG.jpg","Right eye"],["E:pages/Langerhans-histiocytosis/Histiocytosis-X-montage-OS-LRG.jpg","Left eye"]],"h":"Right eye","u":"pages/Langerhans-histiocytosis/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Retinal hemangioblastoma associated with Von-Hippel Lindau syndrome","im":[["E:pages/Retinal-hemangioblastoma-VHL/Angioma-1-LRG.jp urbance with initial presentation. Symptoms usually occur with tumor involvement of the macula. Retinal astrocytomas typically appear white in color, opaque, or translucent, with varying degrees of thickness. Tumors","u":"pages/retinal-astrocytoma.html","cr":"Justin Risma, MD","src":"er"},{"t":"Tuberous sclerosis","im":[["E:photos-earlier/lesion.jpg","Fundus Photo Astrocytic harmartoma: white, semitransparent, mulberry-appearing tumor of retina or ON. Calcification with age. Occurs in the"],["E:photos-earlier/lesion_mag.jpg","Fundus Photo Closeup Astrocytic harmartoma: white, semitransparent, mulberry-appearing tumor of retina or ON. Calcification with age. Occurs"]],"h":"Fundus Photo Astrocytic harmartoma: white, semitransparent, mulberry-appearing tumor of retina or ON. Calcification with age. Occurs in the CNS.","u":"pages/tuberous-sclerosis.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Vitreous seeding from retinoblastoma","im":[["E:pages/Rb-seeding/Rb-seeding-LRG.jpg",""],["E:pages/Rb-seeding/Rb-seeding-2-LRG.jpg",""]],"h":"Retinoblastoma is a neuroendocrine tumor that occurs in young children. The tumors may present with vitreous seeding, or free-floating buds of tumor cells within the vitreous. Reference:","u":"pages/Rb-seeding/index.htm","cr":"Jesse Vislisel, MD; Kevin Gertsch, MD","src":"er"},{"t":"Idiopathic sclerochoroidal calcification","im":[["E:pages/sclerochoroidal-calcification/OD-fundus-LRG.jpg","right eye"],["E:pages/sclerochoroidal-calcification/OS-fundus-LRG.jpg","left eye"],["E:pages/sclerochoroidal-calcification/OD-ascan-LRG.jpg","right eye"]],"h":"right eye","u":"pages/sclerochoroidal-calcification/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Idiopathic sclerochoroidal calcification","im":[["E:LARGE/Sclerochoroidal-calcification-OD-L.jpg","Right Eye"],["E:LARGE/Sclerochoroidal-calcification-OS-L.jpg","Left Eye"]],"h":"Right Eye","u":"pages/sclerochoroidal-calcification.htm","cr":"Jesse Vislisel, MD","src":"er"}]},{"n":"Trauma, surgery & the vitreous","b":"Commotio, ruptures, retained material, choroidal detachments and vitreous findings.","items":[{"t":"Commotio retinae","im":[["E:photos/commotio.jpg","from BB gun injury. commotio retinae = 'bruising' of retina"]],"h":"from BB gun injury. commotio retinae = 'bruising' of retina","u":"pages/commotio-retinae.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Choroidal Rupture","im":[["W:photos/choroidal-rupture-macular-hole/choroidal-rupture-LRG.jpg",""],["W:photos/choroidal-rupture-macular-hole/choroidal-rupture-nerve-LRG.jpg",""],["W:photos/choroidal-rupture-macular-hole/macular-hole-LRG.jpg",""]],"h":"Doreen Dykhuizen This patient experienced blunt eye injury after bungee cord recoil. Color fundus montage photograph of the right eye shows a macular hole and peripapillary choroidal ruptures extending into the macula. There is subretinal hemorrhage and fluid inferior to the macular hole and in the peripapillary region. Optical coherence tomography (Heidelberg) demonstrates a partial-thickness macular hole with subre","u":"pages/choroidal-rupture.html","cr":"Austin R. Fox, MD","src":"er"},{"t":"Sclopetaria","im":[["E:photos/Sclopetaria3.JPG",""],["E:photos/Sclopetaria.JPG",""],["E:pages/imgs/Chorioretinitis_Sclopetaria_Image_1.png","A subconjunctival metallic foreign body is seen posterior to a scarred area of the plica semilunaris representing a likely entry w"]],"h":"A subconjunctival metallic foreign body is seen posterior to a scarred area of the plica semilunaris representing a likely entry wound that had self-sealed","u":"pages/Sclopetaria.htm","cr":"Elizabeth Gauger, MD","src":"er"},{"t":"Retinal detachment with chronic intraocular foreign body","im":[["E:pages/Retinal-detach-chronic-IOFB/RD-w-IOFB-LRG.jpg",""]],"h":"","u":"pages/Retinal-detach-chronic-IOFB/index.htm","cr":"David Phillips, MD","src":"er"},{"t":"Intravitreal Triamcinolone","im":[["E:photos/intravit-triamcinolone-1.jpg","Dilated fundus exam of the right eye immediatel  disc area of 4.18 mm2 in the right eye and severe cupping in this 44-year-old African male wi"]],"h":"This OCT shows bilateral megalopapillae with a disc area of 4.18 mm2 in the right eye and severe cupping in this 44-year-old African male with juvenile open glaucoma, initially diagnosed at age 24.","u":"pages/Megalopapillae-severe-glaucoma/index.htm","cr":"Elisabeth Aponte, MD","src":"er"},{"t":"Optic Disc Notch and Retinal Nerve Fiber Layer Defect in Primary Open Angle Glaucoma","im":[["E:photos/inf-notch/inf-notch-NFL-defect-macula.PNG","The optic nerve shows moderate cupping but there is a prominent inferior notch. The normal sheen of the nerve fiber layer is absent in a dis"],["E:photos/inf-notch/inf-notch-NFL-defect-OCT-orig.PNG","Humphrey visual field shows a corresponding superior arcuate scotoma."]],"h":"The optic nerve shows moderate cupping but there is a prominent inferior notch. The normal sheen of the nerve fiber layer is absent in a distribution radiating temporally from this notch due to cellular loss. The notch and nerve fiber layer defect can be more easily visualized on optical coherence tomography.","u":"pages/inf-notch-NFL-defect-HVF.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Idiopathic Intracranial Hypertension (IIH, Pseudotumor Cerebri)","im":[["E:pages/imgs/R_15Xz1btqzJt4omd_OD_OCT.png","In the right eye nerve OCT there is intraretinal schisis next to the right nerve and in the papillomacular bundle, and abrupt RPE atrophy."],["E:pages/imgs/R_15Xz1btqzJt4omd_OS_OCT.png","In the left eye nerve OCT there is abrupt RPE atrophy as seen in the right eye."]],"h":"In the right eye nerve OCT there is intraretinal schisis next to the right nerve and in the papillomacular bundle, and abrupt RPE atrophy.","u":"pages/IIH.htm","cr":"Kimberly Winges, MD","src":"er"},{"t":"Non-arteritic anterior ischemic optic neuropathy (NAION)","im":[["E:photos/NAION/Fig7-OCT-optic-nerves-bilateral-superior-RNFL-bundle-loss.jpg","OCT of the optic nerves showed bila man with vision loss in the right eye (OD) greater than left eye (OS) in the setting of a craniopharyngioma, which was resected 16 years prior. His visual acuity had been no light perception OD and 20/20 OS since the procedure. Summary: Contrast-enhanced magnetic resonance imaging (MRI) of the brain and orbits showed a stable tiny ring-enhancing cystic lesion anterior to","u":"pages/bow-tie-atrophy.htm","cr":"Brittni A. Scruggs, MD, PhD; Matthew J. Thurtell, MD","src":"er"},{"t":"Optic Disc Drusen","im":[["W:photos/optic-disc-drusen/1b-SD-OCT-ou-LRG.jpg","Spectral domain optical coherence tomography (SD-OCT). Buried optic disc drusen are denoted by the white arrows. Buried optic dis"],["W:photos/optic-disc-drusen/1d-ultrasound-echography-ou-LRG.jpg","Ultrasound echography. In cases of extruded/exposed optic disc drusen, the drusen are easily visible on fundus exam, SD-OCT, and/"]],"h":"Nicole M. Radunzel (photography) and Laura L. Warner (echography) Color fundus photography (A), spectral domain optical coherence tomography (B), fundus autofluorescence (C), and ultrasound echography (D","u":"pages/Optic-Disc-Drusen.html","cr":"Bethlehem Wole, BS","src":"er"},{"t":"Leber’s Hereditary Optic Neuropathy","im":[["E:photos/Lebers_2023/Fig.%205.jpg",""],["E:photos/Lebers_2023/Fig.%206.jpg",""]],"h":"Nicole Radunzel, Paul Swihart (perimetry) March 22, 2023 The patient was a 53-year-old male found to have Leber’s hereditary optic neuropathy (positive for mutation 11778). Fundus photos showed congestion of both optic nerves with telangiectic vessels visible. (Fig 1 and 2) Goldmann visual field testing showed a ceco-central scotoma in the right eye on presentation which stayed stable o","u":"pages/lebers-hereditary-optic-neuropathy.htm","cr":"Noor-Us-Sabah Ahmad, MD; Salma Dawoud, MD","src":"er"},{"t":"Tuberous Sclerosis with Optic Nerve Hamartoma","im":[["E:photos/Noncalcified-astrocytic-hamartoma-rp/hamartoma-2.jpg",""],["E:photos/Optic-Nerve-hamartoma/Fig2.jpg",""]],"h":"Re nvolvement with underlying detachment of Descemet membrane in the area of rupture. Epithelial bullae can be seen overlying the area of stromal edema.","u":"pages/Corneal-Hydrops/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Band keratopathy","im":[["E:photos/band/Cornea_ASOCT.jpg","This image demonstrates anterior segment optic coherence tomography of a cornea with calcific band keratopathy"]],"h":"Retired Clinical Assistant Professor of Ophthalmology, University of Rochester School of Medicine and Dentistry *Dr. Caccamise has very generously shared his images of","u":"pages/band-keratopathy.htm","cr":"Meagan Seay, DO and Nasreen Syed, MD","src":"er"},{"t":"Granular corneal dystrophy","im":[["E:pages/Granular-corneal-dystrophy/GCD-OS-OCT-lrg.jpg","OCT."]],"h":"OCT.","u":"pages/Granular-corneal-dystrophy/index.htm","cr":"David Phillips, MD","src":"er"},{"t":"Corneal edema with Descemet's membrane folds after DMEK","im":[["E:pages/D-folds-p-DMEK/D-folds-sp-DMEK-OCT-LRG.jpg",""]],"h":"","u":"pages/D-folds-p-DMEK/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Descemet Membrane Endothelial Keratoplasty (DMEK)","im":[["E:pages/DMEK/4---DMEK-edge-lift-05583822%5B1%5D-LRG.jpg","Anterior segment optical coherence tomography demonstrating a limited, peripheral graft edge lift one week after DMEK surgery (rig"]],"h":"Anterior segment optical coherence tomography demonstrating a limited, peripheral graft edge lift one week after DMEK surgery (right side of image). The attached portion of the graft mimics normal anatomy due to the precise 1-to-1 replacement of tissue with DMEK.","u":"pages/DMEK/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Graft edge lift after Descemet's membrane endothelial keratoplasty (DMEK)","im":[["E:pages/DMEK-edge-lift/graft-edge-lift-2-LRG.jpg",""],["E:pages/DMEK-edge-lift/graft-edge-lift-OCT-LRG.jpg",""]],"h":"","u":"pages/DMEK-edge-lift/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Deep Anterior Lamellar Keratoplasty (DALK)","im":[["https://webeye.ophth.uiowa.edu/eyeforum/tutorials/Cornea-Transplant-Intro/1--DALK-detachment-99074863-400px.jpg","Anterior segment optical coherence tomography demonstrating the redundant host Descemet membrane and endothelium in poor appositi"]],"h":"Anterior segment optical coherence tomography demonstrating the redundant host Descemet membrane and endothelium in poor apposition to the graft tissue","u":"pages/DALK/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Corneal melt around Boston type I keratoprosthesis","im":[["E:pages/kPro-melt/ASOCT-KPro-normal-LRG.jpg","Normal appearance of Boston type I keratoprosthesis device on anterior segment OCT."],["E:pages/kPro-melt/5---KPRO-98227362-LRG.jpg","Anterior segment optical coherence tomography demonstrating the appearance of a Boston Type I Kpro with healthy corneal tissue sur"]],"h":"Boston keratoprosthesis devices require regular monitoring to assess for the presence of complications such as infection and corneal melt. Anterior segment optical coherence tomography (OCT) is a useful study to assess for the presence of corneal thinning or melt. We regularly use OCT to monitor the status of the cornea around the device.","u":"pages/kPro-melt/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Peters anomaly","im":[["https://eyerounds.org/cases-i/case187/Peters-anomaly-OCT.jpg","Anterior segment optical coherence tomography (OCT) in a neonate with Peters anomaly. Note the iridocorneal adhesions and the regi"]],"h":"Peters anomaly is a rare congenital disorder in the spectrum of anterior segment dysgenesis. Findings include corneal opacities and absence of normal posterior corneal structures. Iridocorneal or corneolenticular adhesions may be present.","u":"pages/Peters/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Post-operative angle closure glaucoma following Descemet’s Membrane Endothelial Keratoplasty (DMEK)","im":[["E:photos/angle-closure-OCT.jpg",""]],"h":"","u":"pages/angle-closure-post-DMEK.htm","cr":"Christopher Kirkpatrick, MD","src":"er"},{"t":"Phacomorphic Angle Closure and Anterior Lens Dislocation due to Repeated Blunt Trauma","im":[["E:photos/Angle-closure-traumatic-cataract/Fig2-LRG.jpg",""]],"h":"This 46-year-old female patient had a history of repeated self-induced blunt force trauma to both eyes. She initially presented with anterior lens dislocation with pupillary block in her right eye (Figure 1). She then presented seven months later in angle closure and with a mature cataract in her left eye (OS). Blunt trauma causes abrupt anteroposterior shortening and resultant equatorial stretching that may lead to","u":"pages/angle-closure-traumatic-cataract.htm","cr":"Lauren E. Hock, MD and A. Tim Johnson, MD, PhD","src":"er"},{"t":"EVO+ Visian Implantable Collamer Lens (ICL) Implant","im":[["E:pages/imgs/AS_OCT.png","Anterior segment ocular coherence tomography (AS-OCT) demonstrates a 720 micron distance, or \"vault\", between the implant and the natural le"]],"h":"Implantable Collamer Lens (ICL) are a minimally invasive technique to correct myopia with or without astigmatism. Implantation of these devices is reversible and can be used in patients who do not qualify for corneal refractive procedures, such as LASIK or PRK. Traditional models require a peripheral iridotomy to permit aqueous humor flow and decrease risk of pupillary bl","u":"pages/EVO-Visian-Implantable-Collamer-Lens(ICL)-Implant.htm","cr":"Sabah Munir, MSPH; Lauren A. Tomlinson, MD","src":"er"},{"t":"Appropriate Scleral Lens Sagittal Depth","im":[["E:photos/appropriate-scleral-lens-sagittal-depth/perfect-sag_09640126-LRG.jpg",""],["E:photos/appropriate-scleral-lens-sagittal-depth/perfect_sag_04841281-LRG.jpg",""]],"h":"Scleral contact lenses rest on the sclera, vaulting over the entire cornea and limbus to avoid irritating or scarring those tissues. The amount of space between the lens and the cornea is typically referred to as sag. Sagittal depth actually refers to hen findings you should recognise and leave alone.","items":[{"t":"Normal cornea","im":[["E:pages/Normal-Cornea/normal-cornea-LRG.jpg",""],["E:pages/Normal-Cornea/normal-cornea-2-LRG.jpg",""]],"h":"","u":"pages/Normal-Cornea/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Clear crystalline lens","im":[["E:pages/Clear-Lens-normal/clear-lens-LRG.jpg",""]],"h":"","u":"pages/Clear-Lens-normal/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Zonules of Zinn","im":[["E:photos-earlier/Zonules_0220051.jpg","In this photograph, a few pigment flecks, likely shed from the iris, can be seen attached to the zonules."]],"h":"The zonules can be readily visualized in the dilated pupil of this patient with Marfan's syndrome (see Marfan's syndrome in this atlas). The Zonules (of Zinn) are a ring of fibrous strands, composed mainly of elastin microfibrils, that extend from the cilary body to the equator of the lens capsule and thus suspending the lens in place.","u":"pages/Zonules-of-Zinn.html","cr":"Jordan Graff, MD","src":"er"},{"t":"Iris processes","im":[["E:pages/Iris-processes/iris-processes-LRG.jpg",""]],"h":"","u":"pages/Iris-processes/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Posterior embryotoxon","im":[["E:photos-earlier/posterior-embryotoxon.jpg","Present in 10-15% of the normal population. Occurs in Axenfeld-Rieger Syndrome. This is an anteriorly displaced and prominent Schwalbe's lin"]],"h":"Present in 10-15% of the normal population. Occurs in Axenfeld-Rieger Syndrome. This is an anteriorly displaced and prominent Schwalbe's line.","u":"pages/posterior-embryotoxon.html","cr":"Andrew Doan, MD, PhD","src":"er"},{"t":"Corneal arcus (arcus senilis)","im":[["E:pages/Arcus/arcus-senilis-LRG.jpg",""]],"h":"","u":"pages/Arcus/index.htm","cr":"Jesse Vislisel, MD","src":"er"},{"t":"Enlarged corneal nerves / Prominent corneal nerves","im":[["E:pages/Enlarged-corneal-nerves/Enlarged-corneal-nerves-LRG.jpg",""],["E:pages/Enlarged-corneal-nerves/Enlarged-corn
