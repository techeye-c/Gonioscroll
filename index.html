<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GonioScroll — Atlas of Gonioscopy, swipe edition</title>
<style>
:root{--bg:#07090c;--fg:#f3f5f7;--mute:#9aa4ae;--acc:#5fd3c6;--acc2:#ffb454;--card:#12171d;--line:#232b34}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--acc)}
#feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.slide{height:100%;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.col{width:100%;max-width:960px;height:100%;display:flex;flex-direction:column;position:relative}
/* clip */
.vwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding-top:calc(54px + env(safe-area-inset-top))}
video{width:100%;max-height:100%;background:#000;display:block;object-fit:contain}
.spin{position:absolute;width:38px;height:38px;border:3px solid #ffffff33;border-top-color:var(--acc);border-radius:50%;animation:sp 0.9s linear infinite;display:none}
.loading .spin{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.paused-ind{position:absolute;font-size:64px;opacity:0;transition:opacity .2s;pointer-events:none;text-shadow:0 2px 12px #000}
.paused .paused-ind{opacity:.85}
.err{position:absolute;inset:auto 16px;text-align:center;color:var(--mute);display:none}
.errored .err{display:block}
.errored .spin{display:none}
.seek{display:flex;flex-direction:column;padding:8px 72px 0 18px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.seek .skip{font-size:12px;color:var(--fg);background:#1b222b;border:1px solid var(--line);border-radius:8px;padding:5px 7px;white-space:nowrap}
.seek input{width:100%;-webkit-appearance:none;appearance:none;height:28px;background:transparent;cursor:pointer;touch-action:none}
.seek input::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(to right,var(--acc) var(--p,0%),#ffffff2a var(--p,0%))}
.seek input::-moz-range-track{height:5px;border-radius:3px;background:linear-gradient(to right,var(--acc) var(--p,0%),#ffffff2a var(--p,0%))}
.seek input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;margin-top:-6.5px;box-shadow:0 1px 6px #000a}
.seek input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:0}
.seek .srow{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.seek .tm{text-align:center}
.info{padding:8px 72px calc(18px + env(safe-area-inset-bottom)) 18px;background:linear-gradient(to top,var(--bg) 70%,transparent);min-height:120px}
.chip{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--bg);background:var(--acc);border-radius:99px;padding:2px 9px;font-weight:700}
.chip.also{background:transparent;color:var(--mute);border:1px solid var(--line);margin-left:6px;text-transform:none;letter-spacing:0;font-weight:500}
.title{font-size:19px;font-weight:700;margin:6px 0 6px;line-height:1.25}
.reveal{display:none;margin:6px 0;padding:7px 14px;border:1px dashed var(--acc2);color:var(--acc2);border-radius:10px;font-weight:600}
.quiz .slide.clip:not(.shown) .title,.quiz .slide.clip:not(.shown) .chip{display:none}
.quiz .slide.clip:not(.shown) .reveal{display:inline-block}
.hx{color:#d6dbe0;font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.hx b{color:var(--acc2);font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;margin-right:6px}
.hx.none{color:var(--mute);font-style:italic}
/* rail */
.rail{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:calc(150px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;z-index:20}
.rail button{width:46px;height:46px;border-radius:50%;background:#1b222bcc;backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px;border:1px solid #ffffff14}
.rail .ph{display:none}
.rail button small{font-size:9px;color:var(--mute);margin-top:1px}
.rail button.on{background:var(--acc2);color:#111}
.rail button.on small{color:#111}
.speed{display:flex;flex-direction:column;align-items:center;gap:4px;background:#1b222bcc;border:1px solid #ffffff14;border-radius:24px;padding:4px 0}
.speed button{width:38px;height:32px;border:0;background:none;font-size:20px;font-weight:700}
.speed span{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.speed small{font-size:9px;color:var(--mute)}
.speed.on span{color:var(--acc2)}
/* top */
#top{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:10px;background:linear-gradient(to bottom,#000c,transparent)}
#chapbtn{flex:1;text-align:left;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chapbtn span{color:var(--mute);font-weight:400}
#count{color:var(--mute);font-variant-numeric:tabular-nums;font-size:13px}
#bar{position:fixed;top:0;left:0;height:3px;background:var(--acc);z-index:21;transition:width .2s}
/* cards */
.card{justify-content:center;padding:70px 26px 40px}
.card .col{justify-content:center;max-width:620px;height:auto}
.card h1{font-size:34px;line-height:1.1;margin:10px 0 14px}
.card .k{color:var(--acc);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.card p{color:#cfd5db;margin-bottom:12px}
.card .meta{color:var(--mute);font-size:13px}
.card .hint{margin-top:26px;color:var(--mute);font-size:13px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.timeline{border-left:2px solid var(--line);margin:14px 0 14px 6px;padding-left:16px}
.timeline div{margin-bottom:10px;position:relative}
.timeline div:before{content:"";position:absolute;left:-22px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.timeline em{font-style:normal;color:var(--acc2);font-weight:700;margin-right:6px}
.chapbig{font-size:84px;font-weight:800;color:#ffffff10;position:absolute;top:-20px;left:-6px;line-height:1;pointer-events:none}
/* sheets */
.sheet{position:fixed;inset:0;z-index:40;background:#000a;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .in{background:var(--card);width:100%;max-width:640px;max-height:82vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet h3{font-size:17px;margin-bottom:10px}
.sheet .x{float:right;color:var(--mute);font-size:22px;line-height:1}
.chl button{display:flex;width:100%;text-align:left;padding:11px 10px;border-radius:10px;gap:10px;align-items:baseline}
.chl button:hover,.chl button.cur{background:#ffffff0d}
.chl .num{color:var(--acc);font-weight:700;width:22px}
.chl .nm{flex:1;font-weight:600}
.chl .ct{color:var(--mute);font-size:12px}
.chl .grp{display:block;color:var(--mute);font-weight:400;font-size:12px}
#hxtext{white-space:pre-wrap;color:#dfe4e8}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d252ef2;border:1px solid var(--line);padding:10px 14px;border-radius:12px;z-index:50;display:none;gap:12px;align-items:center;font-size:14px;max-width:92vw}
#toast.show{display:flex}
#toast button{color:var(--acc);font-weight:700}

/* questions */
#qcard{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(620px,calc(100% - 20px));max-height:62vh;overflow:auto;z-index:30;background:#121a22f5;backdrop-filter:blur(10px);border:1px solid #2c3742;border-radius:16px;padding:14px 14px 12px;box-shadow:0 10px 40px #000c;display:none;animation:up .25s ease-out}
#qcard.open{display:block}
@keyframes up{from{transform:translate(-50%,20px);opacity:0}}
#qcard .qh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin-bottom:6px}
#qcard .qh .tag{color:var(--acc2);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
#qcard .qh button{margin-left:auto;color:var(--mute);font-size:13px;padding:2px 6px}
#qcard .qq{font-weight:650;font-size:15.5px;margin-bottom:10px;line-height:1.35}
#qcard .opt{display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:7px;border-radius:10px;background:#1c252f;border:1px solid #2a3540;font-size:14px;line-height:1.3}
#qcard .opt:hover{border-color:var(--acc)}
#qcard .opt.right{background:#123d36;border-color:var(--acc)}
#qcard .opt.wrong{background:#43201f;border-color:#e0605a}
#qcard.answered .opt{pointer-events:none}
#qcard .ex{display:none;font-size:13.5px;color:#d3dade;margin:6px 0 8px;padding:9px 11px;background:#0d1318;border-radius:10px;border-left:3px solid var(--acc)}
#qcard.answered .ex{display:block}
#qcard .nav{display:none;justify-content:flex-end;gap:8px}
#qcard.answered .nav{display:flex}
#qcard .nav button{padding:8px 14px;border-radius:10px;background:var(--acc);color:#081210;font-weight:700}
#qcard .nav button.sec{background:#1c252f;color:var(--fg)}
#qpill{position:static;background:var(--acc2);color:#151005;font-weight:700;font-size:13px;border-radius:99px;padding:7px 14px;display:none;margin:4px 0 6px;animation:pillin .3s ease-out}
#qpill.show{display:inline-block}
@keyframes pillin{from{transform:translateY(8px);opacity:0}}
#bQ{display:none}
.quiz #bQ{display:flex}
.quiz #chapbtn span{display:none}
#score{color:var(--acc2);font-weight:700;margin-left:8px;display:none}
.quiz #score{display:inline}

/* random test */
#bTest{color:var(--acc2);font-weight:700;font-size:13px;border:1px solid #ffb45455;border-radius:99px;padding:4px 10px;white-space:nowrap}
#test,#prog{position:fixed;inset:0;z-index:45;background:var(--bg);overflow:auto;display:none;padding:calc(12px + env(safe-area-inset-top)) 0 calc(30px + env(safe-area-inset-bottom))}
#test.open,#prog.open{display:block}
#test .tin, #prog .tin{max-width:760px;margin:0 auto;padding:0 16px}
#test .th, #prog .th{display:flex;align-items:center;gap:10px;margin-bottom:10px}
#test h2, #prog h2{font-size:24px;flex:1}
#test .tprog{flex:1;color:var(--mute);font-variant-numeric:tabular-nums}
#test .tx, #prog .tx{color:var(--mute);font-size:15px;padding:4px 8px;border:1px solid var(--line);border-radius:8px}
#test .tx[data-t=close], #prog .tx[data-t=close]{font-size:22px;border:0}
.tm2{color:#cfd5db;margin-bottom:16px}
.tset{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tset small{color:var(--mute)}
.tset input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:7px 13px;border-right:1px solid var(--line)}
.seg button:last-child{border:0}
.seg button.on{background:var(--acc);color:#081210;font-weight:700}
.tgo{display:block;width:100%;margin-top:16px;padding:13px;border-radius:12px;background:var(--acc);color:#081210;font-weight:800;font-size:16px}
.tgo.sec{background:#1c252f;color:var(--fg);font-weight:600;margin-top:10px}
.tvid{background:#000;border-radius:12px;overflow:hidden}
.tvid video{max-height:52vh}
.tseek{padding:6px 0 0}
.tspd{display:flex;align-items:center;gap:4px}
.tlink{color:var(--acc);font-size:14px;padding:8px 0;text-decoration:underline;text-underline-offset:3px}
.hx2{font-size:14px;color:#d6dbe0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
.hx2 b{color:var(--acc2);font-size:12px;letter-spacing:.05em;text-transform:uppercase;margin-right:6px}
.tform{display:flex;gap:8px;margin-top:10px}
.tans{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid #33404c;background:#0f151b;color:var(--fg);outline:none}
.tans:focus{border-color:var(--acc)}
.tform button{padding:0 18px;border-radius:12px;background:var(--acc);color:#081210;font-weight:800}
.tfb{margin-top:12px;padding:14px;border-radius:14px;border:1px solid var(--line)}
.tfb.ok{background:#0f2e29;border-color:#2c7d70}
.tfb.no{background:#2e1615;border-color:#7d3a36}
.tverd{font-size:20px;font-weight:800;margin-bottom:6px}
.tyou{color:var(--mute);margin-bottom:6px}
.tcorr b{font-size:17px}
.tcorr span{color:var(--mute);font-size:13px}
.tlist>div{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tlist>div>span{font-weight:800;width:18px}
.tlist .ok>span{color:var(--acc)}
.tlist .no>span{color:#e0605a}
.tlist>div>div{flex:1}
.tlist small{display:block;color:var(--mute)}

/* lighter, auto-hiding time bar */
.seek{transition:opacity .35s ease}
.seek input{height:22px}
.seek input::-webkit-slider-runnable-track{height:3px;background:linear-gradient(to right,rgba(95,211,198,.6) var(--p,0%),rgba(255,255,255,.14) var(--p,0%))}
.seek input::-moz-range-track{height:3px;background:linear-gradient(to right,rgba(95,211,198,.6) var(--p,0%),rgba(255,255,255,.14) var(--p,0%))}
.seek input::-webkit-slider-thumb{width:12px;height:12px;margin-top:-4.5px;background:rgba(255,255,255,.85);box-shadow:none}
.seek input::-moz-range-thumb{width:12px;height:12px;background:rgba(255,255,255,.85)}
.seek input:hover::-webkit-slider-runnable-track{height:5px}
.seek input:hover::-webkit-slider-thumb{margin-top:-3.5px}
.seek .skip{background:transparent;border-color:transparent;color:rgba(255,255,255,.6);padding:3px 6px}
.seek .skip:hover{color:#fff;background:#ffffff12}
.seek .tm{color:rgba(255,255,255,.5);font-size:11px}
@media (hover:hover) and (pointer:fine){ body.idle .seek{opacity:0;pointer-events:none} }

#bProg{font-size:16px;padding:2px 6px}
.stat{font-size:12px;color:var(--mute);margin-top:6px}
.stat .st0{opacity:.7}
.pkpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.pkpi div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pkpi b{display:block;font-size:22px}
.pkpi span{color:var(--mute);font-size:12px}
.plegend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mute);margin-bottom:8px}
.plegend span{display:flex;align-items:center;gap:5px}
.plegend .cell{width:14px;height:14px;cursor:default}
.pch{margin:14px 0}
.pchh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--mute)}
.pchh .tlink{padding:2px 0;font-weight:600;color:var(--fg);text-decoration:none;text-align:left}
.pbar{height:4px;background:#ffffff14;border-radius:3px;margin:4px 0 7px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--acc)}
.grid{display:flex;flex-wrap:wrap;gap:4px}
.cell{width:22px;height:22px;border-radius:5px;font-size:10px;font-weight:700;color:#081210;display:inline-flex;align-items:center;justify-content:center;position:relative;border:1px solid #ffffff10}
.cell.c0{background:#1a2129}
.cell.cp{background:linear-gradient(135deg,#2c5a55 50%,#1a2129 50%)}
.cell.c1{background:#3f9e93}
.cell.c2{background:#5fd3c6}
.cell.c3{background:#b6fff6}
.cell.ag:after,.cell.aa:after,.cell.ar:after{content:"";position:absolute;right:-2px;top:-2px;width:7px;height:7px;border-radius:50%;border:1px solid var(--bg)}
.cell.ag:after{background:#4ade80}.cell.aa:after{background:#fbbf24}.cell.ar:after{background:#f87171}
.pbox{margin-top:22px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.pbox h3{margin-bottom:6px}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbtns .tgo{margin-top:0;font-size:14px;text-align:center;cursor:pointer}
#ptext{width:100%;min-height:90px;margin-top:10px;background:#0f151b;color:var(--fg);border:1px solid #33404c;border-radius:10px;padding:8px;font:12px monospace}

#bProg.synced,#bProg2.synced{position:relative}
#bProg.synced:after,#bProg2.synced:after{content:"☁";position:absolute;right:-6px;top:-4px;font-size:10px;color:var(--acc)}
.steps{margin:6px 0 10px 18px;color:#cfd5db;font-size:13.5px}
.steps li{margin-bottom:6px}
.steps code{background:#0f151b;padding:1px 5px;border-radius:5px}
.serr{color:#f87171;font-size:13px;margin:8px 0}
.devs>div{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.devs small{color:var(--mute)}
@media (max-width:700px){.card{padding-right:74px}}
@media (min-width:900px){.info{padding-right:90px}.title{font-size:22px}}

/* --- control rail: see-through on desktop, top toolbar on phones --- */
.rail button,.speed{background:rgba(27,34,43,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.rail{transition:opacity .35s ease}
@media (hover:hover) and (pointer:fine){ .rail{opacity:.55} .rail:hover{opacity:1} body.idle .rail{opacity:0;pointer-events:none} }
@media (max-width:700px){
  /* one-handed layout: controls in a bottom bar, scrub bar just above it */
  .rail{top:auto;bottom:0;left:0;right:0;flex-direction:row;justify-content:space-around;align-items:center;gap:4px;
        padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:rgba(7,9,12,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid #ffffff12}
  .rail button{width:min(42px,10.4vw);height:min(42px,10.4vw);flex:0 0 auto;font-size:min(18px,4.6vw);border-color:#ffffff10}
  .rail button small,.speed small{display:none}
  .rail button.on{background:rgba(255,180,84,.85)}
  .rail .ph{display:flex}
  #bSrc{display:none!important}
  .speed{flex-direction:row;padding:0 2px;border-radius:21px;gap:0;height:min(42px,10.4vw);flex:0 0 auto}
  .speed button{width:min(34px,8.4vw);height:min(40px,10vw);flex:0 0 auto;font-size:19px;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;border:0}
  #sDown{order:0} #sVal{order:1;min-width:30px;text-align:center} #sUp{order:2}
  #top #bProg,#top #bTest{display:none}
  .clip .col{padding-bottom:calc(56px + env(safe-area-inset-bottom))}
  .clip .vwrap{order:0;padding-top:calc(44px + env(safe-area-inset-top))}
  .clip .info{order:1;padding:10px 18px 4px;min-height:0;background:none}
  .clip .seek{order:2;padding:4px 18px 8px}
  .card{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
  #qcard{bottom:calc(64px + env(safe-area-inset-bottom))}
  #toast{bottom:calc(72px + env(safe-area-inset-bottom))}
}
}

/* ---------- image sections ---------- */
.imgsec #speed,.imgsec #bMute{display:none!important}
.iwrap{flex-direction:column}
.car{display:flex;width:100%;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.car::-webkit-scrollbar{display:none}
.car figure{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0;padding:0 6px;min-width:0;cursor:zoom-in}
.car img{max-width:100%;max-height:calc(100% - 34px);object-fit:contain;border-radius:6px;background:#000;display:block}
.car figcaption{font-size:11.5px;color:var(--mute);padding:5px 12px 0;text-align:center;line-height:1.3;max-height:30px;overflow:hidden}
.car figure.broken::after{content:"Image unavailable — open the source link";color:var(--mute);font-size:13px}
.car figure.broken img{display:none}
.dots{position:absolute;bottom:2px;left:0;right:0;display:flex;justify-content:center;gap:6px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:#ffffff40}
.dots i.on{background:var(--acc)}
.imgn{position:absolute;top:calc(52px + env(safe-area-inset-top));right:12px;font-size:12px;background:#000a;padding:2px 8px;border-radius:99px;color:#ddd}

<script>
var CH = [
{n:"Examination technique",b:"How to hold the lens and what you are looking at — start here.",g:[
["Basic Exam Technique",[
["General Techniques","Generaltechnique.mp4","Indirect (slit lamp) gonioscopy overview. Direct gonioscopy is rarely used today. These three clips give an overview of examination technique; the Difficult Angles chapter later gives tools for when the view is confusing.","basic-exam-techniques/general-techniques.htm"],
["Four-mirror (Zeiss-style) Lens Technique","4mirrortechnique.mp4","","basic-exam-techniques/4-mirror-technique.htm"],
["Three-mirror (Goldmann-style) Lens Technique","3mirrortechnique.mp4","","basic-exam-techniques/3-mirror-technique.htm"]]]]},
{n:"The normal angle",b:"Learn the landmarks: Schwalbe's line, trabecular meshwork, scleral spur, ciliary body band — and the normal variants that mimic disease.",g:[
["Normal Angle",[
["Lee Allen Drawings - Normal Angle","Allennormalangle.mp4","","normal-angle/lee-allen-drawings-normal-angle.htm"],
["Normal Angle","V082.mp4","","normal-angle/normal-angle.htm"],
["Normal Pigmented Angle","V198.mp4","Young woman without eye pathology. Nicely pigmented angle makes for an easy examination (D40f).","normal-angle/normal-pigmented-angle.htm"],
["Normal Iris Process","V070.mp4","Angle of a healthy 21 year-old woman with normal iris processes.","normal-angle/normal-iris-process.htm"],
["Normal Angle Blood Reflux","V167.mp4","Normal, lightly pigmented angle. Blood refluxes into Schlemm's canal with pressure on the Goldmann lens. Courtesy of: Howard Cohn, MD, American Hospital of Paris","normal-angle/normal-angle-blood-reflux.htm"],
["Greater Circle of the Iris","V117.mp4","","normal-angle/greater-circle-of-the-iris.htm"],
["Prominent Greater Circle of the Iris","V001.mp4","15 year-old male with ocular hypertension. Negative family history. His entire examination was normal other than the prominent greater circle of the iris. Please note that this is the most extreme example of angle vasculature that I have ever seen.","normal-angle/prominent-greater-circle-of-the-iris.htm"],
["Prominent Greater Circle of the Iris - 2","V308.mp4","This 22-year-old man was found to have a visible vessel in his iris on routine examination and was referred in for evaluation. His entire examination, including ultrasound of the iris, was normal. This was felt to be a normal prominent greater circle of the iris.","normal-angle/prominent-greater-circle-of-the-iris-2.htm"],
["Yet Another Dramatic Greater Circle of the Iris","V334-Greater-Circle.mp4","","normal-angle/greater-circle-of-the-iris-2.htm"],
["Posterior Embryotoxon","V078.mp4","","normal-angle/posterior-embryotoxon.htm"]]]]},
{n:"Grading the angle",b:"Putting a number on what you see — the Spaeth system.",g:[
["Angle Grading",[
["Grading the Angle","Grading_the_Angle.mp4","","angle-grading/grading-the-angle.htm"],
["George Spaeth on the Spaeth Grading System","Grading.mp4","This is extracted from a longer lecture by Dr. George L. Spaeth entitled \"Do you really need to gonioscope your patients?\"","angle-grading/spaeth-grading-system.htm"],
["Normal Angle D50c0","V314.mp4","","angle-grading/normal-angle-d50c0.htm"],
["Normal Angle D40f1","V300.mp4","","angle-grading/normal-angle-d40f1.htm"],
["B40f Angle","V319.mp4","","angle-grading/b40f-angle.htm"]]]]},
{n:"Techniques for difficult angles",b:"When the view is narrow or confusing: inferior angle, fellow eye, looking over the hill, Van Herick, corneal wedge, indentation.",g:[
["Difficult Angles",[
["Examine the Inferior Angle","V083.mp4","The inferior angle is the deepest and the most pigmented. Often the anatomy is most clearly defined in the inferior angle because the pigmentation highlights the posterior (pigmented) trabecular meshwork. Once the relationship between structures is established in the lower angle (superior mirror) this information can help the examiner with the interpretation of the remainder of the angle.","difficult-angles/examine-the-inferior-angle.htm"],
["The Other Eye","V087.mp4","One should always examine both eyes. This can be very helpful in patients with presumed pupillary block angle closure in one eye. If corneal edema precludes a view of the iridocorneal angle looking at the fellow eye can be instructive. If the opposite eye has a wide-open angle one might need to reconsider diagnosis. Similarly, angle recession can be difficult to differentiate from the deep anterior chambers of highly myopic eyes. Comparing the two eyes can help to make the appropriate diagnosis.","difficult-angles/examine-the-other-eye.htm"],
["Look over the Hill","V085.mp4","Sometimes the iris is bowed forward making visualization of the iridocorneal angle quite challenging. In many of these eyes the angle is open but the iris bowing obscures the view. This was a bigger problem when cholinergic agents, such as pilocarpine, were commonly used. One can have the patient look into the examining mirror or tip the lens towards the angle being examined to look over the hill and into the angle. In general, if one can readily see over the hill and into the angle without indenting, the angle is not occludable.","difficult-angles/introduction-look-over-hill.htm"],
["Van Herick","V084.mp4","","difficult-angles/introduction-van-herick.htm"],
["Corneal Wedge","Wedgesketch.mp4","","difficult-angles/introduction-corneal-wedge.htm"],
["Indentation","Indentation.mp4","","difficult-angles/introduction-indentation.htm"]]]]},
{n:"Angle closure",b:"From the narrow angle to synechial closure, then the non-pupillary-block mechanisms: plateau iris, lens, short eyes, ciliary body and misdirection.",g:[
["Pupillary Block",[
["Narrow Angles - Slit lamp only","V127.mp4","This is a 51 year-old woman who presented with narrow angles diagnosed by her local ophthalmologist. She has no other known eye pathology. Her Van Herick test shows extremely narrow angles with areas of apposition. Interestingly, this patient is myopic (-3.50 diopters). Primary pupillary block angle closure is quite uncommon in patients with myopia.","pupillary-block/narrow-angles-slit-lamp-only.htm"],
["Narrow Angle, Pupillary Block","V057.mp4","This 60 year-old man has a strong family history of glaucoma. He was referred because his local optometrist found his iridocorneal angles to be narrow. He has mild hyperopia with a spherical equivalent of +0.75 OD and +1.25 OS. His intraocular pressures are normal at 12 mmHg OD and 15 mmHg OS. His optic nerve heads are completely normal.","pupillary-block/narrow-angle-pupillary-block.htm"],
["Pupillary Block","V146.mp4","This patient underwent a laser iridotomy and this video shows the very narrow angle before the iridotomy and the deeper angle post iridotomy using the Van Herick technique.","pupillary-block/pupillary-block.htm"],
["Narrow Angles w/ Indentation Gonio and Corneal Wedge","V172.mp4","This 54 year-old woman was referred for narrow angles. She is mildly hyperopic (one diopter).","pupillary-block/narrow-angles-w-indentation-gonio-and-corneal-wedge.htm"],
["Pupillary Block - Indentation Gonioscopy showing PAS","V180.mp4","This is a 64 year-old man who is moderately hyperopic (+1.50 diopter spheres). He was found by his optometrist that morning to have intraocular pressures of 36 mmHg OD and 37 mmHg OS. He was treated with laser iridotomies in both eyes but ultimately required medical therapy because his pressures continued to be elevated.","pupillary-block/pupillary-block-indentation-gonioscopy-showing-pas.htm"],
["Pupillary Block - Narrow Angles PAS on Indentation","V052.mp4","80 year-old woman was found to have elevated IOP on routine examination at age 54. She was treated as a POAG patient. At age 77 she was found to have narrow angle with low PAS on indentation. She is hyperopic with a spherical equivalent of +3.25 D OU.","pupillary-block/pupillary-block-narrow-angles-pas-on-indentation.htm","Peripheral Anterior Synechiae"],
["Indentation Broad PAS","V121.mp4","This gentleman is a moderately hyperopic patient (+1.00 diopters) who has had longstanding glaucoma. He was taking pilocarpine gel at the time that this video was taken. His intraocular pressure was 32 mmHg. On examination he has narrow angles with scattered peripheral anterior synechia that are seen on indentation.","pupillary-block/indentation-broad-pas.htm","Peripheral Anterior Synechiae"],
["Sequelae from Acute Angle Closure Attack - slit lamp only","V182.mp4","This patient had a bilateral attack of acute angle closure glaucoma with intraocular pressures of 58 mmHg OD and 63 mmHg OS. She is a hyperopic patient and was on no medications that might have induced bilateral angle closure. She had laser iridotomies and now has sequelae of an angle closure attack.","pupillary-block/sequelae-from-acute-angle-closure-attack-slit-lamp-only.htm"],
["Glaukomflecken - slit lamp only","V102.mp4","This 41 year-old man had undergone a trabeculectomy with mitomycin C and had chronic post-operative hypotony. He was symptomatic from the hypotony with macular striae. For this reason a blood patch was performed on the left eye and at the same time the anterior chamber was filled with viscoelastic. After this procedure the patient had an intraocular pressure that went as high as 60 mmHg. Over the next several hours he was given maximum medical therapy and had fluid released from his paracentesis intermittently. Despite this it took almost 6-hours to make the patient comfortable and to attain a steady, normal intraocular pressure. The following week the patient was found to have glaukomflecken. With time as can be seen in the video this dissipated. Note: While these glaukomflecken are not from primary pupillary block angle closure this seems to be the most appropriate place to file this video.","pupillary-block/glaukomflecken-slit-lamp-only.htm"]]],
["Peripheral Anterior Synechiae",[
["Indentation Gonioscopy with PAS","V063.mp4","This 69 year old man has had open angle glaucoma for 17 years and has undergone Argon Laser Trabeculoplasty. He has a long history of pilocarpine use. At the time of presentation his intraocular pressures were 20 mmHg OD and 32 mmHg OS.","pas/indentation-gonioscopy-with-pas.htm"],
["Low PAS","V134.mp4","This is a 60 year-old gentleman with inflammatory glaucoma from congenital toxoplasmosis. This video was taken 30-years after the onset of inflammation. He has low peripheral anterior synechia on gonioscopy.","pas/low-pas.htm"],
["Peripheral Anterior Synechia - 1","V170.mp4","This patient has autosomal dominant neovascularization, inflammation and vitreoretinopathy (ADNIV). The patient has elevated intraocular pressure after multiple vitrectomies. He is found to have a broad peripheral anterior synechia extending to his extracapsular cataract extraction wound.","pas/peripheral-anterior-synechia.htm"],
["Peripheral Anterior Synechia - 2","V309.mp4","This 76 year old man has a long history of POAG. He presented here in 2010 after multiple procedures OU. He has PAS that are probably due to a shallow anterior chamber after surgery.","pas/peripheral-anterior-synechia-2.htm"]]],
["Plateau Iris Syndrome",[
["Plateau Iris Syndrome 1","V056.mp4","76 year-old woman with a history of narrow angles for which she had undergone iridotomies. She has mild hyperopia (+1.25 D OD and +1.00 D OS).","plateau-iris-syndrome/plateau-iris-syndrome-1.htm"],
["Plateau Iris Syndrome 2","V118.mp4","In this video we see the indentation of a mildly hyperopic patient (+1.75 diopters). His iridocorneal angles were not felt to be occludable but on indentation one can see the peripheral roll that is characteristic of plateau iris configuration.","plateau-iris-syndrome/plateau-iris-syndrome-2.htm"],
["Plateau Iris Syndrome 3","V123.mp4","This 39 year-old patient is mildly hyperopic (+2 diopters OU). She had developed narrow iridocorneal angles and had undergone a laser iridotomy in both eyes. Following the iridotomy she continued to have narrow angles and plateau iris syndrome was diagnosed.","plateau-iris-syndrome/plateau-iris-syndrome-3.htm"]]],
["Phacomorphic",[
["Phacomorphic Glaucoma","V014.mp4","81 year-old woman with chronic angle closure glaucoma. She had undergone laser iridotomies 15 years previously. Her axial eye length is 20 mm and her lens is 5.1 mm thick.","phacomorphic/phacomorphic-glaucoma.htm"],
["Phacomorphic Glaucoma (2)","V330.mp4","This 66-year-old woman had an intraocular pressure to 70 mmHg in her left eye. After undergoing laser iridotomy she was found to have persistently narrow angles. Her eyes were found to be quite short (22 mm) and her lens is very thick (5.3 mm).","phacomorphic/phacomorphic-glaucoma-2.htm"],
["Narrow Angle from Phacomorphic Glaucoma (slit lamp only)","V062.mp4","This 50 year old man has retinopathy of prematurity. He developed this dense nuclear sclerotic cataract and was diagnosed with phacomorphic glaucoma. His lens at the time of this video was 6.1 mm in thickness and his anterior chamber centrally was 1.0 mm.","phacomorphic/narrow-angle-from-phacomorphic-glaucoma-slit-lamp-only.htm"]]],
["Nanophthalmos",[
["Nanophthalmos - 1","V073.mp4","This 71-year old patient presented with narrow angles. Her local physician had attempted cataract extraction but found the anterior chamber too shallow and was unable to complete the surgery. She has a refractive error of +10.5 diopters sphere in both eyes. The patient was found to have axial eye length of 16.92 mm OD and 16.97 mm OS.","nanophthalmos/nanophthalmos-1.htm"],
["Nanophthalmos - 2","V157.mp4","This patient was first seen at the University of Iowa in 1980 at the age of 32 with narrow angles in both eyes. He underwent laser iridotomies at that time. In 1986 he developed cystoid macular edema in the left eye that persisted over several years. Standardized echography was performed in 1990 that showed axial eye lengths of 19.3 mm OD and 19.1 mm OS with lens thicknesses of 5.1 mm OD and 5.2 mm OS. He had marked thickening of the retinal choroidal layer. In 1991 he developed spontaneous choroidal effusions in the left eye for which he underwent four quadrant scleral windows. The cystoid macular edema in the left eye left him with chronically decreased vision in that eye. In 2007 he was referred with a nearly completely flat anterior chamber in the left eye. He underwent lensectomy vitrectomy on that eye with subsequent control of his intraocular pressure. Viewed here is the right eye…","nanophthalmos/nanophthalmos-2.htm"]]],
["Spherophakia",[
["Spherophakia","V090.mp4","This young woman at age 26 developed acute angle closure glaucoma in the right eye. She is highly myopic (-11 diopters). She underwent laser iridotomy in both eyes and ultimately required a trabeculectomy in the right eye. Her axial eye lengths were 22.21 mm OD and 21.77 mm OS.","spherophakia/spherophakia.htm"]]],
["Ciliary Body Swelling",[
["Ciliary Body Swelling","V193.mp4","This patient presented with narrow angles after an ischemic central retinal vein occlusion. One can see that the iridocorneal angle is quite narrow. This is not from pupillary block but from swelling of the ciliary body.","ciliary-body-swelling/ciliary-body-swelling.htm"]]],
["Aqueous Misdirection",[
["Response to Atropine","V137.mp4","This patient was referred 5 days after trabeculectomy with a shallow anterior chamber and an intraocular pressure of 20 mmHg. She responded to treatment with atropine alone.","aqueous-misdirection/response-to-atropine.htm"],
["Aqueous Misdirection (Slit Lamp Only)","V020.mp4","Elevated IOP since age 23. Underwent a trabeculectomy at age 24. At 5 months after surgery he had an IOP of 13 mmHg. At 8 months after surgery he noted decreased vision. His IOP was 21 mmHg. A large fluid pocket was seen on echography. His anterior chamber deepened with atropine.","aqueous-misdirection/aqueous-misdirection-slit-lamp-only.htm"],
["Aqueous Misdirection (1)","V016.mp4","Presented at age 41 with angle closure. She had had an iridotomy and iridoplasty. Despite maximum medical therapy her IOP was 52 mmHg. Her early postoperative course was uneventful. Four months later she presented with blurred vision and pain. Her IOP was 24 mmHg.","aqueous-misdirection/aqueous-misdirection-1.htm"],
["Aqueous Misdirection (2)","V192.mp4","A 48-year-old man was hit with a bungee cord 23 years previously. He had undergone an anterior chamber wash-out for hyphema and subsequently had corneal transplants in 1980 and 1999. When we saw him in 2001 he had been having pain in this eye for 2.5 years. He was on two glaucoma medications. One can see this anterior chamber is completely flat and in fact his IOL is embedding into his cornea. His pressure was 80 mm of mercury (checked on the sclera).","aqueous-misdirection/aqueous-misdirection-2.htm"]]]]},
{n:"Pigment & exfoliation",b:"Open angles with too much pigment or material in them.",g:[
["Pigmentary",[
["Pigment Dispersion Syndrome","V326.mp4","A 27-year-old Asian man found to have ocular hypertension at age 26 with intraocular pressures of 30 mmHg OD and 26 mmHg OS.","pigmentary/new-pigment-dispersion-syndrome.htm"],
["Pigment Dispersion Synd. - Iris Pigment and TIDs","V066.mp4","This 31 year-old man was found to have pigment dispersion syndrome on routine examination. His intraocular pressures are 22 mmHg OD and 23 mmHg OS. Patient of Young H. Kwon, M.D., Ph.D. University of Iowa, video by Edward Sung, M.D.","pigmentary/pigment-dispersion-synd-iris-pigment-and-tids.htm"],
["Pigment on Iris (slit lamp only)","V049.mp4","56 year old with a five year history of pigment dispersion syndrome. His referring physician had performed laser iridotomies in both eyes.","pigmentary/pigment-dispersion-syndrome.htm"],
["Krukenberg Spindle","V040.mp4","This middle-age woman has a long standing history of pigment dispersion syndrome in this eye.","pigmentary/krukenberg-spindle.htm"],
["PDS with Striking Krukenberg Spindle","V116.mp4","At age 39 this woman was seen for her pigment dispersion syndrome. She has a refractive error of -5.50 diopters and had a best corrected visual acuity of 20/30. Her optic nerve head was normal and her intraocular pressure was in a normal range on three classes of medications. This patient has the densest Krukenberg spindle that I have seen and her dense spindle may account for her 20/30 vision because her lens is perfectly clear.","pigmentary/pds-with-striking-krukenberg-spindle.htm"],
["Pigment Dispersion Syndrome - Iris Backbowing","V080.mp4","33 year-old woman with pigment dispersion syndrome.","pigmentary/pigment-dispersion-syndrome-iris-backbowing.htm"],
["Pigment Dispersion Syndrome with Marked Back Bowing","V310.mp4","This young man is in his 30's. He has had intraocular pressures as high as 32 mmHg in the right eye and 25 mmHg in the left eye. He has never been on therapy for glaucoma and currently has pressures of 17 mmHg and healthy optic nerves. He has remarkable back bowing.","pigmentary/pigment-dispersion-syndrome-with-marked-back-bowing.htm"],
["PDS Pre and Post LPI","V166.mp4","This nice clip shows many features of pigment dispersion syndrome. It also shows the changes to the iris after iridotomy. Courtesy of: Howard Cohn, MD, American Hospital of Paris","pigmentary/pds-pre-and-post-lpi.htm"],
["Pigment Dispersion Syndrome - Scheie Stripe","V050.mp4","40 year-old man with a five-year history of open angle glaucoma. Was found to have pigment dispersion syndrome with a Krukenberg spindle, transillumination defects, dense angle pigmentation and a Scheie stripe.","pigmentary/pigment-dispersion-syndome-scheie-stripe.htm"],
["Pigmentary Glaucoma Scheie Stripe","V035.mp4","This 23 year-old man was diagnosed with pigmentary glaucoma one year previously. At the time of this examination he had intraocular pressures of 49 mmHg in the right eye and 42 mmHg in the left eye despite taking a beta blocker and a prostaglandin analog.","pigmentary/pigmentary-glaucoma-scheie-stripe.htm"],
["Pigmentary Glaucoma Scheie Stripe - slit lamp","V033.mp4","This patient was diagnosed with pigment dispersion syndrome when she was 27 years old. One year later she was diagnosed as having pigmentary glaucoma.","pigmentary/pigmentary-glaucoma-scheie-stripe-slit-lamp.htm"],
["Sampaolesi Line Visible on Slit Lamp Exam","V204.mp4","This patient with pigmentary glaucoma has a Sampaolesi line that is visible on slit lamp examination. He also has an excellent Scheie stripe.","pigmentary/sampaolesi-line-visible-on-slit-lamp-exam.htm"],
["Pigmentary Glaucoma","V034.mp4","This patient was diagnosed at age 32 with pigmentary glaucoma. He has had pressures as high as 42 mmHg in both eyes and has required trabeculectomies in both eyes.","pigmentary/pigmentary-glaucoma.htm"],
["Asymmetric Pigment Dispersion Syndrome","V320.mp4","This patient has markedly asymmetric pigment dispersion syndrome. There is no known cause for the asymmetry. He has no history of trauma and his refractive errors (-3.35 D) are symmetric. The left eye has a larger cup and has required trabeculectomy while the right eye has been easy to control.","pigmentary/asymmetric-pigment-dispersion-syndrome.htm"],
["PDS - Reverse Pigmentation","V189.mp4","This patient was being evaluated for normal tension glaucoma at age 59. On examination, he has intraocular pressures of 12 mmHg OD and 14 mmHg OS. He has transillumination defects of the iris and marked angle pigmentation. Note that his pigmentation is more striking superiorly than inferiorly. Dr. Robert Ritch makes the point that people who are clearing the pigmentation from their angles often have this reverse pigmentation - where there is more pigment above than below. It is not uncommon to see this in patients who are being evaluated for normal tension glaucoma. They probably have had elevated intraocular pressures when they were young adults.","pigmentary/pds-reverse-pigmentation.htm"],
["Pigment Glaucoma (Burned-out)","V061.mp4","This 75 year-old woman was found to have cup-to-disc asymmetry. Her intraocular pressures were normal at 13 mmHg OD and 11 mmHg OS. She was found to have evidence of pigment dispersion syndrome and it was presumed that the optic nerve head asymmetry was from pigmentary glaucoma when she was younger.","pigmentary/pigment-glaucoma-burned-out.htm"],
["PDS OD, ICE OS","V218.mp4","At 35 years old was diagnosed with both pigment dispersion OD and essential iris atrophy OS. Her essential iris atrophy prevented her development of PDS OS.","pigmentary/pds-od-ice-os.htm","Iridocorneal Endothelial (ICE)"],
["Secondary Pigment Dispersion Syndrome","V065.mp4","This 53 year old man had undergone phacoemulsification 9-months prior to this examination. He developed an elevated intraocular pressure that was treated with a beta blocker and a carbonic anhydrase inhibitor. On examination he was found to have 4+ angle pigmentation and transillumination defects that were felt to be secondary to an intraocular lens.","pigmentary/secondary-pigment-dispersion-syndrome.htm"],
["Pigment Dispersion from Intraocular Lens","V317.mp4","This 66-year-old man had vitreous hemorrhage from a vascular occlusive event. He ultimately underwent vitrectomy and at the time also had a lensectomy. A secondary posterior chamber intraocular lens was inserted but became dislocated. Therefore the intraocular lens was sutured to his iris with Prolene sutures. He subsequently developed ocular hypertension and was found to have marked backbowing and pigment dispersion syndrome. There is no pigment dispersion in the opposite eye.","pigmentary/pigment-dispersion-from-intraocular-lens.htm"]]],
["Exfoliation Syndrome",[
["Exfoliation Syndrome at the Pupillary Margin (slit lamp only)","V174.mp4","This 74 year-old woman has unilateral exfoliation syndrome with an intraocular pressure to 27 mmHg.","exfoliation-syndrome/exfoliation-syndrome-pupillary-margin.htm"],
["Exfoliation Syndrome (1)","V068.mp4","62 year-old woman with unilateral elevated intraocular pressure (to 38 mmHg).","exfoliation-syndrome/exfoliation-syndrome-1.htm"],
["Exfoliation Syndrome (2)","V161.mp4","This excellent clip shows many features of exfoliation syndrome. Courtesy of Howard Cohn, MD, American Hospital of Paris","exfoliation-syndrome/exfoliation-syndrome-2.htm"],
["Exfoliation Syndrome with Scrolled Material","V303.mp4","This 86 year-old woman has exfoliation syndrome. The material on her anterior lens capsule has been folded back by the action of her iris.","exfoliation-syndrome/exfoliation-syndrome-scrolled-material.htm"],
["Exfoliation Syndrome with Marcelling","V202.mp4","This 63 year old man was referred with asymmetric glaucoma. The right eye had a large cup with an intraocular pressure of 36 mmHg while the left eye had a pressure of 20 mmHg and no cup whatsoever. One can see these ridges of light and dark bands that are characteristically seen in exfoliation syndrome. There is also heavy angle pigmentation. The patient was pseudophakic and therefore we were not able to evaluate whether he had typical pseudoexfoliative debris on the anterior lens capsule. The iris changes and angle pigmentation are certainly suggestive of exfoliation syndrome.","exfoliation-syndrome/exfoliation-syndrome-with-marcelling.htm"],
["Exfoliation Syndrome with a Chunk of Debris in the Angle","V311.mp4","This 60-year-old man was found to have elevated intraocular pressures 16 years prior to this video. On examination he is found to have classic exfoliation syndrome. The interesting finding in him is a sheet of pseudoexfoliative debris that has collected as a mass in the inferior angle.","exfoliation-syndrome/exfoliation-syndrome-with-debris-angle.htm"],
["Corneal Deposits - slit lamp only","V125.mp4","In this video one can see pseudoexfoliative material on the corneal endothelium of this 63 year-old gentleman who has unilateral glaucoma with a peak intraocular pressure of 52 mmHg. These deposits look somewhat like keratic precipitates except if one studies them carefully it is possible to see that there is a movement in the aqueous. This means that these are not likely to be KP, which should be firmly adherent to the cornea, but more likely flakes of pseudoexfoliative material that are partially attached to the cornea and partially wafting in the aqueous.","exfoliation-syndrome/corneal-deposits.htm"],
["Frosted Zonules","V005.mp4","58 year-old woman with pseudoexfoliation glaucoma diagnosed at 43 years of age when she presented with an IOP of 64 mmHg in this eye. This eye had undergone a trabeculectomy 14 years before this examination.","exfoliation-syndrome/frosted-zonules.htm"],
["Phacodonesis","V156.mp4","This 83-year-old man has exfoliation syndrome. He was diagnosed eight years before this video was shot. The pressure was uncontrolled and he ultimately required a trabeculectomy. One can see marked phacodonesis.","exfoliation-syndrome/phacodonesis.htm"],
["Exfoliation Syndrome & Ectopia Lentis","V091.mp4","This woman presented at age 83. She was known to have exfoliation syndrome with poor control of her intraocular pressures in both eyes despite maximum tolerated medical therapy. At the time of presentation she had 20/100 vision OD and 20/250 vision OS. Her intraocular pressures were 27 mmHg OD and 52 mmHg OS. She underwent an intracapsular cataract extraction with trabeculectomy OS and had a good visual and intraocular pressure outcome.","exfoliation-syndrome/exfoliation-syndrome-ectopia-lentis.htm","Ectopia Lentis"],
["Pseudophacodonesis","V199.mp4","This 78 year old woman has a history of exfoliation syndrome in the right eye. She had had a vitrectomy and laser treatment for a retinal tear 11 years prior to this video. Subsequently, 10 years prior to this video, she had cataract extraction with an intraocular lens in the right eye. Her vision was excellent at 20/25 and her intraocular pressure was 18 mmHg. She had marked pseudophacodonesis as seen in this video. A year later the lens dislocated inferiorly and was sutured into place.","exfoliation-syndrome/pseudophacodonesis.htm"],
["Dislocated IOL - slit lamp only","V110.mp4","82 year-old man with pseudoexfoliation and ocular hypertension. He had undergone phacoemulsification six years before and had gradually declining visual acuity. He regained 20/25 vision after the lens was repositioned.","exfoliation-syndrome/dislocated-iol-slit-lamp-only.htm"]]],
["Melanosis Oculi",[
["Melanosis Oculi - 1","V045.mp4","42 year-old woman has been noted to have a dark sclera since age 15. She has normal intraocular pressures and optic nerves.","melanosis-oculi/melanosis-oculi-1.htm"],
["Melanosis Oculi - 2","V051.mp4","23 year-old woman presented with eye pain and headache and was incidentally found to have melanosis oculi with normal intraocular pressure.","melanosis-oculi/melanosis-oculi-2.htm"]]]]},
{n:"Developmental anomalies",b:"Angles that formed abnormally — congenital glaucoma, anterior segment dysgenesis and the phakomatoses.",g:[
["Primary Congenital Glaucoma",[
["Primary Congenital Glaucoma - 1","V093.mp4","This 18 year-old man was first seen at age 4 months with unilateral buphthalmos and Haab striae. He had near total cupping in his left eye. The patient underwent a trabeculotomy at age 4 months. The video is at age 18. At this time he had an intraocular pressure on no medications of 14 mmHg and healthy optic nerve (C/D 0.25 vs. 0.1 OD).","congenital-glaucoma/primary-congenital-glaucoma-1.htm"],
["Primary Congenital Glaucoma - 2","V095.mp4","This is an operating room view through a Swan Jacob lens (direct goniolens) into the angle of a baby with primary congenital glaucoma.","congenital-glaucoma/primary-congenital-glaucoma-2.htm"]]],
["Axenfeld-Rieger",[
["AR Syndrome - Mild","V105.mp4","This young woman is the mother of a 1 year-old child referred for evaluation of Axenfeld-Rieger syndrome. This woman has no history of glaucoma and no systemic features of Axenfeld-Rieger syndrome. Her daughter had marked corectopia and polycoria but also did not have glaucoma.","axenfeld-riegers/ar-syndrome-mild.htm"],
["Axenfeld-Rieger Syndrome (1)","V155.mp4","This young patient has a strong family history of Axenfeld-Rieger syndrome. He has no obvious embryotoxon but does have iris hypoplasia and, on gonioscopy, has multiple iris processes up to the embryotoxon.","axenfeld-riegers/axenfeld-rieger-syndrome-1.htm"],
["Axenfeld-Rieger Syndrome (2)","V098.mp4","This patient has a family history of Axenfeld-Rieger syndrome (ocular findings only). She has had glaucoma since a very young age and has had two trabeculectomies. She has mild iris hypoplasia and a posterior embryotoxon.","axenfeld-riegers/axenfeld-rieger-syndrome-2.htm"],
["Axenfeld-Rieger Syndrome (3)","V042.mp4","Presented at age 8 with elevated intraocular pressure in both eyes. She had pressures as high as 40 mmHg OU. She underwent trabeculectomies OU. She is now 20 years-old and her IOP is now well controlled on no medication.","axenfeld-riegers/axenfeld-rieger-syndrome-3.htm"],
["Axenfeld-Rieger Syndrome (4)","V151.mp4","This 22 year-old woman has had glaucoma since early childhood. She has had at least seven surgeries by her history and was evaluated during the evaluation of her son who also has developmental glaucoma. She has count fingers vision in the right eye and 20/20 in the left. Her intraocular pressures are 20 mmHg OD and 14 mmHg OS using timolol, dorzolamide, and latanoprost in the right eye. One can see the marked embryotoxon and iris hypoplasia OU and changes in the right eye that are partially from the multiple surgical procedures.","axenfeld-riegers/axenfeld-rieger-syndrome-4.htm"],
["AR Syndrome - Broken Embryotoxon","V038.mp4","This 36 year-old man was diagnosed first as having glaucoma in 1978. He has had intermittent care throughout his life and has been lost to follow-up many times. He first presented here with no light perception vision in the right eye and 20/40 vision in the left eye. His intraocular pressures were 26 mmHg OD and 13 mmHg OS. He has systemic features of Axenfeld Rieger Syndrome including microdontia and maxillary hypoplasia.","axenfeld-riegers/axenfeld-rieger-broken-embryotoxon.htm"],
["AR Iris Hypoplasia (slit lamp only)","V148.mp4","This is a patient with Axenfeld-Rieger Syndrome who was not diagnosed until he was 21 years of age. He has iris stromal hypoplasia without polycoria or corectopia. He does have dental anomalies, redundant periumbilical skin, and hypospadias. This patient has a mutation in the PITX2 gene.","axenfeld-riegers/ar-iris-hypoplasia.htm"],
["Axenfeld-Rieger Marked (slit lamp only)","V131.mp4","4 year-old boy whose father has unilateral ectopic pupil, small teeth, redundant periumbilical skin and glaucoma. This patient has the iris changes seen here and dental and umbilical changes – through age seven he has no glaucoma.","axenfeld-riegers/axenfeld-rieger-marked.htm"],
["AR Syndrome - Phenotypic Variability","V129.mp4","This 8 year-old girl was born prematurely at 23 weeks of gestation. She had cloudy corneas in the first few weeks of life and IOPs into the mid 40 range. She was diagnosed with primary congenital glaucoma. She had multiple surgeries for glaucoma. With time her iris took on a more hypoplastic look. She was also noted to be small for her age. Because of this she was tested for mutations in the PITX2 and FOXC1 genes. She was found to have a mutation in the FOXC1 gene that was shared by her mother (who had no glaucoma) and her brother (who had no known glaucoma but did have cardiac valve disease – which can be associated with FOXC1 mutations).","axenfeld-riegers/ar-phenotypic-variability.htm"],
["Peripheral Peters Anomaly","V184.mp4","This patient was seen at age 16 at the University of Iowa in 1976 with 20/50 vision OD and 20/200 vision OS. He has retinopathy of prematurity, left esotropia, and nystagmus. On slit lamp examination he had this interesting adhesion bilaterally between the cornea and the iris that was called a peripheral Peters variant. The video here was taken 32 years later when his vision had decreased to count fingers in the left eye due to his worsening cataract.","axenfeld-riegers/peripheral-peters-anomaly.htm"],
["Unknown Angle Anomaly","V207.mp4","(The source page repeats the Peripheral Peters Anomaly history for this clip.)","axenfeld-riegers/unknown-angle-anomaly.htm"]]],
["Aniridia",[
["Aniridia","V037.mp4","39 year-old woman with a family history of aniridia in her mother and maternal grandmother. She has had an elevated intraocular pressure OU since her teenage years. The lens in her right eye has partially resorbed spontaneously. Her visual acuity is 20/50 OD and (remarkably) 20/80 OS. Her pressures are normal on 4 medications. She is remarkable for her relatively good vision due to a lack of foveal hypoplasia and her remarkably clear corneas.","aniridia/aniridia.htm"],
["Aniridia (slit lamp only)","V213.mp4","This 43 year old patient has always been blind in her left eye. The right eye shows a dislocated lens, nystagmus, and pannus.","aniridia/aniridia-slit-lamp-only.htm"],
["Aniridia - Pannus (Slit Lamp Only)","V109.mp4","This elderly woman has had nystagmus since birth. She has severe corneal pannus due to her aniridia.","aniridia/aniridia-pannus-slit-lamp-only.htm"],
["Traumatic Aniridia","V032.mp4","83 year-old woman who fell and struck her left eye. She had undergone phacoemulsification cataract surgery five months before. Her IOP was 40 mmHg and an Ahmed seton was placed. Courtesy of Young H. Kwon, MD, PhD, University of Iowa.","aniridia/traumatic-aniridia.htm"]]],
["PPMD",[
["Posterior Polymorphous Corneal Dystrophy","V076.mp4","This patient at age 42 was diagnosed with glaucoma. At age 60 she was found to have narrow angles and underwent laser iridotomies. Two years later one of her physicians performed laser trabeculoplasty on her (ill advised). When we first saw her she had extensive angle closure with corneal endothelial changes including vesicles. She was diagnosed as having posterior polymorphous corneal dystrophy.","ppmd/posterior-polymorphous-corneal-dystrophy.htm"]]],
["Neurofibromatosis",[
["Neurofibromatosis","V153.mp4","This is a 78-year-old man with neurofibromatosis type 1. He has multiple Lisch nodules. He was diagnosed with open angle glaucoma at age 74.","neurofibromatosis/neurofibromatosis.htm"]]],
["Sturge-Weber",[
["Sturge Weber Limbal Vessels - slit lamp only","V030.mp4","This 39 year-old male has had a prominent port wine stain since birth. He developed secondary glaucoma from which this eye has lost all vision. On examination he has no light perception in the left eye with an intraocular pressure of 38 mmHg and a total optic nerve head cup.","sturge-weber/sturge-weber-limbal-vessels-slit-lamp-only.htm"]]]]},
{n:"Endothelium & iris degeneration",b:"ICE syndrome and its mimics.",g:[
["Iridocorneal Endothelial (ICE)",[
["ICE Syndrome - Subtle","V183.mp4","This is a 43 year-old with unilateral glaucoma with an intraocular pressure to 15 mmHg and a history of a failed trabeculectomy. A great example of the endothelial changes on slit lamp examination.","ice/ice-syndrome-subtle.htm"],
["Iridocorneal Endothelial","V100.mp4","61 year-old woman with unilateral ICE. Her slit lamp exam shows the hammered silver endothelium characteristic of ICE.","ice/iridocorneal-endothelial.htm"],
["Presumed Early ICE","V112.mp4","This is a 62 year-old woman whose physician noticed an iridocorneal adhesion one month prior to this exam. The same physician had followed this patient earlier and had never noticed a similar change. The patient's intraocular pressure was 16 mmHg in both eyes. The central corneal endothelium was normal in this eye but the diagnosis by both the corneal specialist and glaucoma specialist was that this is probably a very early variant of ICE with abnormalities only in the peripheral cornea.","ice/presumed-early-ice.htm"],
["Early ICE","V119.mp4","This 57 year-old man had been noted to have an elevated intraocular pressure in his right eye only since 2000. In 2006 he was noted to have an intraocular pressure of 34 mmHg in the right eye. On examination he has 20/40 vision in the right eye and 20/20 vision in the left eye. His intraocular pressure on three medications is 12 mmHg OD and 8 mmHg OS. The right eye has corectopia and iris nodules. He has mild corneal edema and the hammered silver appearance to his corneal endothelium. He was diagnosed with Cogan-Reese variant of the iridocorneal endothelial syndrome.","ice/early-ice.htm"],
["Iridocorneal Endothelial Cogan-Reese","V092.mp4","This patient at the age of 69 awoke with sudden decreased vision in the left eye. She was found to have an intraocular pressure of 57 mmHg and was started on medical therapy with a poor response.","ice/iridocorneal-endothelial-cogan-reese.htm"],
["Essential Iris Atrophy - slit lamp only","V154.mp4","This 38-year-old woman was diagnosed with glaucoma at age 36. She had been treated with multiple medications and had had an argon laser trabeculoplasty. When she was first seen here she had 20/30 vision with an intraocular pressure of 34 mm Hg.","ice/essential-iris-atrophy-sl-only.htm"],
["Essential Iris Atrophy - 1","V160.mp4","Iridocorneal-endothelium syndrome. This is the essential iris atrophy variant with extensive iris damage and synechial angle closure. This patient also has corneal edema.","ice/essential-iris-atrophy-1.htm"],
["Essential Iris Atrophy - 2","V173.mp4","At 41 this patient was diagnosed with glaucoma. In 1974 at the age of 42 she saw Frederick Blodi and was found to have areas of iris atrophy with a diagnosis of essential iris atrophy. Her intraocular pressure was 42 mmHg and she underwent a Scheie thermal sclerostomy in 1974 by Dr. Charles Phelps. In 2007 at the time when this video was made she had a functioning trabeculectomy with an intraocular pressure of 8 mmHg on no medications, 33 years after her Scheie procedure.","ice/essential-iris-atrophy-2.htm"]]],
["Iridoschisis",[
["Iridoschisis","V074.mp4","This patient was seen at age 72 for the iris changes seen in this video. He was found to have narrow angles in the right eye and on slit lamp examination the right iris appeared to be split with a forward bowing of the anterior lamellae. The left iris was disintegrated inferiorly. The patient also had marked nuclear sclerotic cataract. His intraocular pressures were normal.","iridoschisis/iridoschisis.htm"]]],
["Interstitial Keratitis",[
["Interstitial Keratitis (slit lamp only)","V089.mp4","This 69 year old patient has had left esotropia and amblyopia since birth. She has hand motion vision in the left eye. Both eyes have ghost vessels and stromal haze.","interstitial-keratitis/interstitial-keratitis.htm"],
["Interstitial Keratitis w/ Descemet's Scrolls (slit lamp only)","V099.mp4","This is a patient with long standing interstitial keratitis. Unfortunately the patient is deceased and the chart is not available. She was seen with these rather spectacular scrolls of Descemet's in the posterior cornea and in the anterior chamber. This finding has been described previously (Scattergood KD, Green WR, and Hirst LW Ophthalmology 90:1518-1523, 1983). In their paper, histopathologic studies of this material demonstrated it to have the appearance of laminated scrolls of Descemet's membrane-like tissue.","interstitial-keratitis/interstitial-keratitis-descemets.htm"]]]]},
{n:"Inflammation",b:"Uveitic angles: KP, PAS, and the hypertensive uveitis syndromes.",g:[
["Uveitis",[
["Uveitis Keratic Precipitates (slit lamp only)","V228.mp4","This 30 year-old man was seen three days after new onset of anterior uveitis. He was begun on prednisolone every two hours and anti-viral therapy. After three days he developed fascinating precipitates with clear centers. He was determined to have herpes simplex virus.","uveitis/uveitis-keratic-precipitates-slit-lamp-only.htm"],
["Inflammatory PAS","V162.mp4","Progressive peripheral anterior synechiae in a patient with chronic inflammation. Courtesy of Howard Cohn, MD, American Hospital of Paris","uveitis/inflammatory-pas.htm"],
["Chronic Uveitis w/ Cholesterol Crystals","V017.mp4","49 year-old woman with twenty-year history of granulomatous uveitis OD. Full work-up negative for an underlying etiology. She developed diffuse crystals in anterior chamber and angle. This was presumed to be due to her elevated serum cholesterol (366) and triglyceride (450) in the face of a compromised blood-aqueous barrier.","uveitis/chronic-uveitis-w-cholesterol-crystals.htm"],
["Fuchs-like Uveitis","V027.mp4","61 year-old woman who noted floaters and decreased vision in her left eye for five months. Her IOP was 37 mmHg. She presented with KP and angle neovascularization suggestive of Fuchs heterochromic iridocyclitis but, on dilated examination had severe sarcoid disease in her fundus.","uveitis/fuchs-like-uveitis.htm","Fuchs' Heterochromic Iridocyclitis"]]],
["Fuchs' Heterochromic Iridocyclitis",[
["Fuchs Heterochromic Iridocyclitis - slit lamp only (1)","V053.mp4","42 year-old man presented for cataract evaluation. He was found to have iris atrophy and keratic precipitates and a diagnosis of Fuchs heterochromic iridocyclitis was made.","fuchs-heterochromic/fuchs-heterochromic-iridocyclitis-1.htm"],
["Fuchs Heterochromic Iridocyclitis - slit lamp only (2)","V124.mp4","This 39 year-old woman had a ten-year history of iritis in the right eye. She presented on two medications with inadequate intraocular pressure control. On examination she had an intraocular pressure of 40 mmHg with iris atrophy and stellate KP. She had neovascularization of the iris and the iridocorneal angle.","fuchs-heterochromic/fuchs-heterochromic-iridocyclitis-2.htm"],
["Fuchs Heterochromic Iridocyclitis - Bleeding","V081.mp4","45 year-old male with Fuchs heterochromic iridocyclitis. Developed cataract and was undergoing phacoemulsification. Bleeding from fragile iris vessels occurred. Courtesy of Robert Honkanen, MD. SUNY Stony Brook.","fuchs-heterochromic/fuchs-heterochromic-iridocyclitis-bleeding.htm"]]],
["Glaucomatocyclitic Crisis",[
["Glaucomatocyclitic Crisis (slit lamp only) - 1","V058.mp4","This 44 year old man noted blurred vision in his left eye 4 years prior to this examination. At that time he was found to have markedly elevated intraocular pressure of 50 mmHg. Intermittently since that time he has had marked spikes in intraocular pressure requiring chronic use of corticosteroids and aqueous suppression.","glaucomatocyclitic/glaucomatocyclitic-crisis-1.htm"],
["Glaucomatocyclitic Crisis (slit lamp only) - 2","V059.mp4","Presented at 37 years-old with a history of unilateral haloes and foggy vision. His IOP in this eye was 51 mmHg.","glaucomatocyclitic/glaucomatocyclitic-crisis-2.htm"]]]]},
{n:"Vascular",b:"New vessels and raised episcleral venous pressure.",g:[
["Neovascularization",[
["Neovascularization of the Angle in Diabetes","V022.mp4","20 year-old with type I diabetes mellitus.","neovascular/neovascularization-of-the-angle-in-diabetes.htm"],
["Radiation-Induced Neovascularization","V015.mp4","","neovascular/radiation-induced-neovascularization.htm"],
["Neovascularization of the Angle Pre- & Post-Laser","V113.mp4","This 57 year-old man with a history of diabetes mellitus was seen with a sudden increase of intraocular pressure to 50 mmHg in his right eye. The patient had been treated for proliferative diabetic retinopathy with panretinal photocoagulation in the past. One will see that he has active neovascularization of the iridocorneal angle. The patient underwent further panretinal photocoagulation that day and one week later. Two weeks after the first video he was seen again with dramatic resolution of the neovascularization.","neovascular/neovascularization-of-the-angle-pre-post-laser.htm"],
["NVI with PAS","V163.mp4","Neovascularization of the angle with some open areas and areas that are closed by synechiae. Courtesy of Howard Cohn, MD, American Hospital of Paris","neovascular/nvi-with-pas.htm"],
["Neovascularization of Angle with Peripheral Anterior Synechia","V111.mp4","This 63 year-old woman had malignant lymphoma of the left orbit for which she received radiation therapy three years prior to this examination. She developed neovascularization of the angle with almost total closure of the angle except for a few clock hours. She was on four classes of medication and had adequate intraocular pressure control at the time that this video was taken.","neovascular/neovascularization-of-angle-with-peripheral-anterior-synechia.htm"],
["Neovascularization 360 deg Closed Angle","V097.mp4","This 21 year-old man has had diabetes since two years of age. He has severe proliferative diabetic retinopathy for which he has undergone many sessions of panretinal photocoagulation as well as pars plana vitrectomy. He has neovascular glaucoma for which he has had a Baerveldt seton placed.","neovascular/neovascularization-360-deg-closed-angle.htm"],
["Iris and Angle Neovascularization","V212.mp4","This 80 year old patient was referred to the Glaucoma Service because of neovascular glaucoma. She had a history of a central retinal artery occlusion and ocular ischemia in her left eye. She developed neovascular glaucoma that was uncontrolled on maximal topical and systemic medications. At the time that she was evaluated her vision was hand motion and her intraocular pressure was 55 mmHg. She has ropy vessels and a membrane that distorted her pupil. Her angle is closed and there is hemorrhage in the inferior angle.","neovascular/iris-and-angle-neovascularization.htm"],
["Neovascular Glaucoma","V306.mp4","This 52 year-old man has severe juvenile glaucoma. This eye has had multiple pan retinal photocoagulations. He has a blind eye that has had cyclophotocoagulation and retrobulbar chlorpromazine. The angle neovascularization grows up onto the cornea.","neovascular/neovascular-glaucoma.htm"],
["Neovascularization onto the lens - slit lamp only","V041.mp4","41 year-old man with long-standing poorly controlled diabetes mellitus. He has had pan-retinal photocoagulation in this eye on many occasions. At this examination he had light perception vision.","neovascular/neovascularization-onto-the-lens-slit-lamp-only.htm"]]],
["High Episcleral Venous Pressure",[
["Blood in Schlemm's Canal - 1","V019.mp4","72 year-old woman with asymmetric elevated IOP (48 mmHg OD, 25 mmHg OS). Dilated episcleral veins and blood in Schlemm's canal. An underlying etiology was never found.","high-episcleral-venous-pressure/blood-schlemms-canal-1.htm"],
["Blood in Schlemm's Canal - 2","V229.mp4","At age 38 this patient developed blurred vision in his left eye and was diagnosed with nonischemic central retinal vein occlusion. On follow-up 3 years later he was found to have engorged vessels in the left eye and blood in Schlemm's canal. The intraocular pressure in this eye was elevated at 28 mmHg compared to 10 mmHg in the fellow eye. An ultrasound examination of the orbit revealed no reverse blood flow. No etiology for the elevated episcleral venous pressure was ever found.","high-episcleral-venous-pressure/blood-schlemms-canal-2.htm"],
["Dural Cavernous Fistula (slit lamp only)","V122.mp4","An 83 year-old woman with a dural-cavernous fistula and markedly engorged episcleral vessels.","high-episcleral-venous-pressure/dural-cavernous-fistula.htm"]]]]},
{n:"Lens-related",b:"Displaced and leaking lenses.",g:[
["Ectopia Lentis",[
["Ectopia Lentis (slit lamp only)","V075.mp4","This patient was first seen at age 13 with ectopia lentis. The left eye lost vision at age 16 due to a retinal detachment. The right eye developed elevated intraocular pressure at age 34.","ectopia-lentis/ectopia-lentis-slit-lamp-only.htm"],
["Ectopia Lentis","V305.mp4","This patient was struck in the eye with a spring from a garage door.","ectopia-lentis/ectopia-lentis.htm"],
["Traumatic Ectopia Lentis (slit lamp only)","V196.mp4","After blunt trauma, this patient has a subluxed lens. He also has asteroid hyalosis, which makes for an interesting slit lamp picture.","ectopia-lentis/traumatic-ectopia-lentis.htm"],
["Ectopia Lentis et Pupillae (slit lamp only)","V071.mp4","This 37-year old woman has ectopia lentis et pupillae. She has undergone pars plana vitrectomy and lensectomy approximately 6 years before this examination. One can see that the pupils are displaced up and out. The lenses were displaced down and in.","ectopia-lentis/ectopia-lentis-et-Pupillae.htm"],
["Lens in Vitreous","V101.mp4","57 year-old woman with presumed Marfan syndrome. Her other eye had ectopia lentis and developed phacolytic glaucoma. This eye has a lens in the vitreous that is well tolerated. She wears aphakic correction.","ectopia-lentis/lens-in-vitreous.htm"],
["Exfoliation Syndrome with Ectopic Intraocular Lens (slit lamp only)","V322.mp4","","ectopia-lentis/exfoliation-syndrome-with-ectopic-intraocular-lens.htm"]]],
["Phacolytic Glaucoma",[
["Hypermature Lens - slit lamp only","V219.mp4","This 94 year old patient has a disciform scar in the right eye. He has had vision reduced to the level of light perception for 8 years at the time this video was taken. The right lens shows a hypermature cataract with loss of cortical substance and wrinkling of the anterior capsule. This is what a lens looks like when most of the cortex is gone. This patient never had a phacolytic reaction.","phacolytic/hypermature-lens-slit-lamp-only.htm"],
["Phacolytic Glaucoma","V079.mp4","This patient presented with one week of pain in the right eye. She had known that she had a cataract in that eye for many years but had never gotten around to having cataract surgery. The left eye had had an intracapsular cataract extraction ten to twenty years previously. At presentation her visual acuity was light perception and her intraocular pressure was 32 mmHg.","phacolytic/phacolytic-glaucoma.htm"]]]]},
{n:"Trauma & blood",b:"Recession, clefts, dialysis, hyphema and things that shouldn't be in the angle.",g:[
["Angle Recession",[
["Angle Recession (Deep)","V002.mp4","38 year-old man was struck in this eye two weeks ago with a rock thrown by a lawn mower. His lens was dislocated. His intraocular pressure was normal.","angle-recession/angle-recession-deep.htm"],
["Angle Recession Dark CB Band","V003.mp4","44 year-old man who was involved in a motor vehicle accident as a child. He has mildly elevated IOPs and extensive angle recession in both eyes.","angle-recession/angle-recession-dark-cb-band.htm"],
["Angle Recession Broken Iris Process","V004.mp4","25 year-old man who has been a boxer for many years. He has had elevated IOP since age 22. His angles are recessed OU.","angle-recession/angle-recession-broken-iris-processes.htm"],
["Angle Recession with Sphincter Tear","V159.mp4","Examples of angle recession emphasizing the need to compare the angles in the two eyes. Courtesy of: Howard Cohn, MD, American Hospital of Paris","angle-recession/angle-recession-with-sphincter-tear.htm"],
["Tangential Tear","V108.mp4","This 32 year old gentleman was hit above the right eye with a golf ball from approximately 100 yards. He developed a hyphema. Subsequently he had an elevated intraocular pressure treated with beta blockers. On gonioscopy he was found to have extensive angle recession and an unusual tear visible in the ciliary body face.","angle-recession/angle-recession-tangential-tear.htm"],
["Angle Recession with Synechia","V205.mp4","This 23 year old man was struck in the right eye with a plastic pellet fired from a CO2 rifle. He presented with corneal edema, a 10% hyphema, and a pressure of 4 mmHg. At 6 weeks following the injury this video was taken. At that time his vision was 20/20 and his intraocular pressure 13 mmHg. He has a recession for about 180 degrees and also has areas where the iris is adherent across the recession.","angle-recession/angle-recession-with-synechia.htm"],
["Angle Recession with Iridodialysis","V175.mp4","This young patient was hit with a BB pellet in a glancing blow that did not penetrate the eye or orbit. He presented with a count fingers vision and an intraocular pressure of 9 mmHg. He has an iridodialysis with angle recession. There is an area at 7 o'clock that looks like a cyclodialysis cleft. This patient's low pressure resolved spontaneously and his vision returned to normal.","angle-recession/angle-recession-with-iridodialysis.htm"],
["Angle Recession with Pigment Dispersion","V152.mp4","39 year-old man suffered severe head trauma six years before (he was in a motorcycle accident and hit a tree with his face). The right optic nerve is avulsed and the eye has no light perception. The left eye has 20/15 vision with mild ocular hypertension controlled on one medication. Both angles are recessed. The right has a flap tear in the ciliary body face and the left has pigment dispersion syndrome.","angle-recession/angle-recession-with-pigment-dispersion.htm"],
["Pigment Dispersion from Angle Recession","V088.mp4","This is a 67 year old male who has elevated intraocular pressures in both eyes, the right greater than the left. At age 13 he had severe blunt trauma to the right eye and had a very slow recovery and then a gradual decline again during his childhood. He had been treated for elevated intraocular pressure for over 20 years at the time these videos were taken. The patient has extensive angle recession and has a secondary pigment dispersion syndrome in the right eye. While his axial eye lengths are symmetrical his anterior chamber depth on the right side is deeper than the left (3.52 mm OD and 2.30 mm OS). Published: McKinney JK & Alward WL (1997) Arch Ophthalmol 115(11):1478-9; Ritch R & Alward WL (1993).","angle-recession/pigment-dispersion-from-angle-recession.htm","Pigmentary"]]],
["Cyclodialysis Cleft",[
["Cyclodialysis Cleft (1)","V039.mp4","This 43 year-old man was punched in this eye 5 years previously and has had decreased vision since that time. On initial examination he had 20/50 vision with an intraocular pressure of 8 mmHg. Gonioscopy was difficult but it appeared that there might be a cyclodialysis cleft inferiorly. The patient was treated with steroids in the hope of decreasing trabecular outflow. He was also placed on atropine to deepen the angle. On follow-up his intraocular pressure had not improved but the atropine had improved the view of his iridocorneal angle and it was clear that there was a cyclodialysis cleft at twelve o'clock.","cyclodialysis-cleft/cyclodialysis-cleft-1.htm"],
["Cyclodialysis Cleft (2)","V094.mp4","This 18 year-old woman was struck by a water balloon in her left eye. She presented with count fingers vision and an intraocular pressure of 4 mmHg. She had a 30% hyphema. After a period of hypotony her intraocular pressure gradually returned to a normal level without intervention. This video was taken five months after her injury and shows a cyclodialysis cleft that has healed on its own.","cyclodialysis-cleft/cyclodialysis-cleft-2.htm"],
["Cyclodialysis Cleft (3)","V186.mp4","This patient was struck in the eye with a bungee cord five months prior to this examination. He sustained a hyphema, which resolved. However two months later he had decreased visual acuity with optic nerve edema and retinal folds. On examination he had 20/300 vision in the right eye with an intraocular pressure of 7 mmHg.","cyclodialysis-cleft/cyclodialysis-cleft-3.htm"],
["Cyclodialysis Cleft (4)","V333.mp4","This patient was injured with a racquetball in the left eye 37 years before he was evaluated in our clinic. He did not have any examination at the time of injury. In 2012 he was found to have an elevated intraocular pressure with angle recession. On our examination we found the angle to be recessed with a very wide area of a cyclodialysis cleft that has clearly healed on its own.","cyclodialysis-cleft/cyclodialysis-cleft-4.htm"]]],
["Trauma",[
["Vossius Ring - slit lamp only","V132.mp4","This is a 15 year-old male who was hit in the eye with a football kicked from about 8 feet away. He presented with a hyphema and a visual acuity of hand motion. This video was taken 6 days after the injury and shows Vossius ring.","trauma/vossius-ring-slit-lamp-only.htm"],
["Iridodialysis - Slit lamp only","V185.mp4","This patient was in a car that struck a deer. The left eye had count fingers visual acuity and the large iridodialysis seen here. The pressure was 4 mmHg and the lens was dislocated into the vitreous. The patient underwent a pars plana vitrectomy and McCannel sutures (times four). Ultimately an aniridic style intraocular lens was placed but the patient's vision never improved over 20/400 due to retinal pathology.","trauma/iridodialysis-slit-lamp-only.htm"],
["Iridodialysis - Huge - slit lamp only","V130.mp4","47 year-old struck by rock in OD. Presented with CF vision and an IOP of 27 mmHg. His lens was dislocated. His IOP remained elevated despite maximum medical therapy and he underwent a pars plana vitrectomy, lensectomy and McCannel sutures x 6. The second video is nine years later. The IOP was 12 mmHg on three medications and the visual acuity with a contact lens was 20/20-3.","trauma/iridodialysis-huge-slit-lamp-only.htm"],
["Metallic FB in CB","V128.mp4","50 years before this video was shot this 70-year old patient was grinding high quality steel and felt something strike his left eye. He was not examined at that point and had been doing well for many years. He developed glaucoma in both eyes, which was more difficult to control in this left eye. Suddenly, 50 years after his injury he developed a peaked pupil. He was found to have metal in his ciliary body.","trauma/metallic-fb-in-cb.htm"]]],
["Hyphema",[
